<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" class="echo mood-idle era-1" role="img" aria-labelledby="echo-title">
  <title id="echo-title">Эхо, проводник курса</title>
  <defs>
    <radialGradient id="echo-glow" cx="50%" cy="46%" r="60%">
      <stop offset="0" stop-color="var(--echo-400, #8FB7D6)" stop-opacity=".55"/>
      <stop offset=".55" stop-color="var(--echo-400, #8FB7D6)" stop-opacity=".16"/>
      <stop offset="1" stop-color="var(--echo-400, #8FB7D6)" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <style>
    .echo { --e-ink0: var(--ink-000, #0A0B09); --e-ink2: var(--ink-200, #1A181B); --e-ink3: var(--ink-300, #262329);
            --e-brass3: var(--brass-300, #E4CDA0); --e-brass5: var(--brass-500, #C9A66B); --e-brass7: var(--brass-700, #8A6F3F); --e-brass9: var(--brass-900, #4A3B21);
            --e-echo: var(--echo-400, #8FB7D6); --e-echo2: var(--echo-200, #C7DCEC); --e-saffron: var(--saffron, #C6A447); --e-bruise: var(--bruise-300, #867E90); overflow: visible }
    .echo .orbit-ring { fill: none; stroke: var(--e-brass7); stroke-width: 1; stroke-dasharray: 1.5 5.5; stroke-linecap: round }
    .echo .era { fill: var(--e-brass5); transition: fill .4s, r .4s }
    .echo.era-1 .e1, .echo.era-2 .e2, .echo.era-3 .e3, .echo.era-4 .e4,
    .echo.era-5 .e5, .echo.era-6 .e6, .echo.era-7 .e7, .echo.era-8 .e8 { fill: var(--e-echo); r: 4.5 }
    .echo .wave { fill: none; stroke: var(--e-echo); stroke-width: 2; stroke-linecap: round; opacity: 0;
                  transform-box: view-box; transform-origin: 80px 82px; animation: echo-wave 3.6s ease-out infinite }
    .echo .wave.w2 { animation-delay: 1.8s }
    .echo .cloak { fill: var(--e-ink2); stroke: var(--e-brass5); stroke-width: 1.5; stroke-linejoin: round }
    .echo .fold { fill: none; stroke: var(--e-ink3); stroke-width: 2; stroke-linecap: round }
    .echo .hem { fill: none; stroke: var(--e-brass7); stroke-width: 1.2 }
    .echo .rim { fill: none; stroke: var(--e-brass7); stroke-width: 1.2; stroke-linecap: round }
    .echo .fold.f3 { stroke-width: 1.4 }
    .echo .face { fill: var(--e-ink0); stroke: var(--e-brass7); stroke-width: 1 }
    .echo .eye { fill: var(--e-echo2); transform-box: fill-box; transform-origin: center; animation: echo-blink 5.5s infinite }
    .echo .eye.right { animation-delay: .04s }
    .echo .happy { fill: none; stroke: var(--e-echo2); stroke-width: 2.4; stroke-linecap: round; display: none }
    .echo .clasp { fill: var(--e-brass9); stroke: var(--e-brass5); stroke-width: 1.2 }
    .echo .hand { stroke: var(--e-brass3); stroke-width: 1.4; stroke-linecap: round; transform-box: view-box; transform-origin: 80px 104px }
    .echo .spark { fill: var(--e-saffron); display: none; transform-box: fill-box; transform-origin: center }
    .echo .doubt circle { fill: var(--e-bruise) }
    .echo .doubt { display: none }
    .echo .figure { transform-box: view-box; transform-origin: 80px 124px; animation: echo-breathe 4.2s ease-in-out infinite }
    .echo .orbit { transform-box: view-box; transform-origin: 80px 84px }
    .echo .eyes { transition: transform .5s }

    .echo.mood-explain .orbit { animation: echo-spin 28s linear infinite }
    .echo.mood-explain .hand { animation: echo-spin 2.4s linear infinite }
    .echo.mood-explain .eyes { transform: translateX(3px) }
    .echo.mood-hint .spark { display: inline; animation: echo-twinkle 1.4s ease-in-out infinite }
    .echo.mood-hint .glow { opacity: 1.0 }
    .echo.mood-cheer .figure { animation: echo-hop 1s cubic-bezier(.3,.7,.4,1) 2, echo-breathe 4.2s ease-in-out 2s infinite }
    .echo.mood-cheer .eye { display: none }
    .echo.mood-cheer .happy { display: inline }
    .echo.mood-cheer .wave { animation-duration: 1.6s }
    .echo.mood-hmm .figure { animation: none; transform: rotate(-6deg) }
    .echo.mood-hmm .eye { ry: 2.2; animation: none }
    .echo.mood-hmm .doubt { display: inline }
    .echo.mood-hmm .glow { opacity: .55 }

    .echo.compact .orbit, .echo.compact .wave, .echo.compact .fold, .echo.compact .hem, .echo.compact .rim { display: none }

    @keyframes echo-breathe { 0%, 100% { transform: translateY(0) } 50% { transform: translateY(-1.6px) } }
    @keyframes echo-blink { 0%, 93%, 100% { transform: scaleY(1) } 95.5% { transform: scaleY(.12) } }
    @keyframes echo-wave { 0% { opacity: 0; transform: scale(.92) } 35% { opacity: .55 } 100% { opacity: 0; transform: scale(1.18) } }
    @keyframes echo-spin { to { transform: rotate(360deg) } }
    @keyframes echo-hop { 0%, 100% { transform: translateY(0) } 30% { transform: translateY(-9px) } 55% { transform: translateY(0) } 72% { transform: translateY(-3px) } }
    @keyframes echo-twinkle { 0%, 100% { opacity: .45; transform: scale(.8) rotate(0) } 50% { opacity: 1; transform: scale(1.1) rotate(20deg) } }
    @media (prefers-reduced-motion: reduce) { .echo *, .echo { animation: none !important; transition: none !important } }
  </style>

  <g class="orbit" aria-hidden="true">
    <circle class="orbit-ring" cx="80" cy="84" r="64"/>
    <circle class="era e1" cx="80" cy="20" r="3"/>
    <circle class="era e2" cx="125.25" cy="38.75" r="3"/>
    <circle class="era e3" cx="144" cy="84" r="3"/>
    <circle class="era e4" cx="125.25" cy="129.25" r="3"/>
    <circle class="era e5" cx="80" cy="148" r="3"/>
    <circle class="era e6" cx="34.75" cy="129.25" r="3"/>
    <circle class="era e7" cx="16" cy="84" r="3"/>
    <circle class="era e8" cx="34.75" cy="38.75" r="3"/>
  </g>

  <g aria-hidden="true">
    <path class="wave w1" d="M40 64 Q31 82 40 100"/>
    <path class="wave w1" d="M120 64 Q129 82 120 100"/>
    <path class="wave w2" d="M32 56 Q19 82 32 108"/>
    <path class="wave w2" d="M128 56 Q141 82 128 108"/>
  </g>

  <g class="figure">
    <path class="cloak" d="M80 28 C90 36 107 45 111 65 C114 81 115 97 122 120 Q80 129 38 120 C45 97 46 81 49 64 C53 45 70 36 80 28 Z"/>
    <path class="rim" d="M57 79 C56 60 67 48 80 46 C93 48 104 60 103 79"/>
    <path class="fold" d="M73 103 C69 110 64 116 58 123"/>
    <path class="fold" d="M87 103 C91 110 96 116 102 123"/>
    <path class="fold f3" d="M80 106 L80 125"/>
    <path class="hem" d="M38 120 Q80 129 122 120"/>
    <ellipse class="face" cx="80" cy="80" rx="21" ry="19.5"/>
    <ellipse class="glow" cx="80" cy="80" rx="20.5" ry="19" fill="url(#echo-glow)" opacity=".85"/>
    <g class="eyes">
      <ellipse class="eye left" cx="72" cy="81" rx="3" ry="4.4"/>
      <ellipse class="eye right" cx="88" cy="81" rx="3" ry="4.4"/>
      <path class="happy" d="M68 82 Q72 76 76 82"/>
      <path class="happy" d="M84 82 Q88 76 92 82"/>
    </g>
    <circle class="clasp" cx="80" cy="104" r="5.5"/>
    <line class="hand" x1="80" y1="104" x2="80" y2="100"/>
    <circle cx="80" cy="104" r="1" fill="var(--e-brass3)"/>
  </g>

  <path class="spark" aria-hidden="true" d="M104 16 L106.2 22.8 L113 25 L106.2 27.2 L104 34 L101.8 27.2 L95 25 L101.8 22.8 Z"/>
  <g class="doubt" aria-hidden="true">
    <circle cx="112" cy="40" r="2"/><circle cx="119" cy="35" r="2.4"/><circle cx="127" cy="29" r="2.8"/>
  </g>
</svg>
