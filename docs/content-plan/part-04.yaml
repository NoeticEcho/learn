  - id: 04-design/11-tokens-dtcg
    order: 11
    title: "Дизайн-токены: имена вместо чисел"
    summary: Вы научитесь хранить цвета, отступы и радиусы как именованные решения в три слоя (базовые, смысловые,
      компонентные) и записывать их в формате W3C DTCG. После урока у вашей страницы есть файл токенов и те же токены в
      CSS-переменных, и одна смена базового цвета меняет всю страницу.
    minutes: 30
    teaches:
      - design-tokens
      - design-dtcg-format
    requires:
      - design-ds-product-and-headless
      - design-colour-system
      - design-type-scale
      - css-custom-properties
    diagram: TokenEditor (content/diagrams)
    practice: 'Ваши токены: файл DTCG и CSS-переменные в три слоя. Соберите набор токенов своего проекта. 1) Допишите файл
      токенов (блок script с id tokens, это JSON по формату DTCG): у него три слоя. Базовые: color.accent.600 (уже
      есть), color.neutral.50 и color.neutral.900, space.2 и space.4, radius.md. Смысловые: semantic.action,
      semantic.surface и semantic.text ссылаются на базовые через фигурные скобки. Компонентные: component.button.bg и
      component.button.fg ссылаются на смысловые. У значений есть $value, у групп или значений $type. 2) В styles.css
      повторите те же токены переменными на :root в тех же трёх слоях: --color-accent-600, --color-neutral-50,
      --color-neutral-900, --space-2, --space-4, --radius-md, затем --action, --surface, --text, затем --button-bg и
      --button-fg. 3) Тёмная тема это блок с data-theme="dark" и только переопределённый смысловой слой: --surface и
      --text. Эпоха: 4. Шаг: design-tokens.'
    checks:
      - 'Блок с токенами должен остаться: script type="application/json" id="tokens".'
      - У токенов должен быть $value. Это обязательная часть формата.
      - 'Нужен $type: например "$type": "color" на группе.'
      - "В файле должны быть три слоя: color (базовые), semantic (смысловые) и component (компонентные)."
      - Среди базовых токенов должны быть нейтральные цвета (neutral), space и radius.
      - Смысловые токены должны ссылаться на базовые, например "{color.accent.600}".
      - Компонентные токены должны ссылаться на смысловые, например "{semantic.action}".
      - На :root нужна --color-accent-600 цветом в hex.
      - На :root нужна --color-neutral-50 цветом в hex.
      - На :root нужна --color-neutral-900 цветом в hex.
      - На :root нужна --space-2 в px или rem.
      - На :root нужна --space-4 в px или rem.
      - На :root нужна --radius-md в px или rem.
      - "Смысловой токен --action должен ссылаться на базовый: var(--color-accent-600)."
      - Смысловой токен --surface должен ссылаться на var(--color-neutral-50).
      - Смысловой токен --text должен ссылаться на var(--color-neutral-900).
      - "Компонентный токен --button-bg должен ссылаться на смысловой: var(--action)."
      - "Компонентный токен --button-fg должен ссылаться на смысловой: var(--surface)."
      - В блоке [data-theme="dark"] переопределите --surface на var(--color-neutral-900).
      - В блоке [data-theme="dark"] переопределите --text на var(--color-neutral-50).
