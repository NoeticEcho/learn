    url: https://www.designtokens.org/
    licence: proprietary-link
    kind: spec
    lang: en
  - title: Design Tokens Format Module (DTCG)
    url: https://www.designtokens.org/tr/drafts/format/
    licence: proprietary-link
    kind: spec
    lang: en
  - title: 'Style Dictionary: документация'
    url: https://styledictionary.com/
    licence: proprietary-link
    kind: docs
    lang: en
