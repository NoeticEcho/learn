- id: 04-design/06-atomic-components
  order: 6
  title: 'Атомарный дизайн: атомы, молекулы, компоненты'
  summary: 'Зачем: вы раскладываете любую страницу на повторяемые части и называете их, а затем описываете каждый компонент
    вместе с состояниями (обычное, наведение, фокус, нажатие, ошибка, недоступно, загрузка). После урока вы сможете собрать
    из своих частей страницу, а не рисовать каждую заново.'
  minutes: 20
  teaches:
  - design.atomic-design
  - design.component
  requires:
  - design.tokens
  - html.semantic-elements
  diagram: 'Разбор страницы на уровни Брэда Фроста: нажимаешь на кнопку, она разбирается на атом (кнопка) → молекулу (поле
    + кнопка) → организм (шапка) → шаблон → страницу; у каждого компонента переключатель состояний.'
  practice: 'Эпоха 4 (2014): из sections и items брифа выделить атомы (кнопка, ссылка, метка), молекулу (карточка пункта из
    items) и организм (секция); оформить карточку как один компонент с четырьмя состояниями.'
  checks:
  - 'Карточка для пунктов items — это один повторяемый компонент: изменение его стиля в одном месте меняет все карточки.'
  - 'У кнопки главного действия (mainAction) есть различимые состояния: обычное, наведение, фокус и недоступно.'
  - В списке компонентов есть хотя бы по одному атому, молекуле и организму с названиями.
  - Компоненты используют токены, а не собственные числа.
