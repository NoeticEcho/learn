  как читать Material, Apple, Fluent, GOV.UK, Carbon, Atlassian, Polaris, Primer, Radix, shadcn, Tailwind и российские
  Gravity UI, VKUI, Taiga UI, Plasma), токены в формате DTCG, компоненты и их состояния, документация и управление,
  передача макета в код и приметы шаблонной страницы.
