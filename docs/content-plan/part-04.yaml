  - id: 04-design/08-gov-carbon-atlassian
    order: 8
    title: "Системы государства и больших компаний: GOV.UK, Carbon, Atlassian"
    summary: "Вы разберёте три системы, у которых есть чему поучиться именно новичку: GOV.UK (понятные формы и доступность),
      Carbon от IBM (сетка и данные) и Atlassian (говорящие токены). После урока у вас есть контактная форма,
      построенная по правилам GOV.UK."
    minutes: 30
    teaches:
      - design-ds-public-and-enterprise
    requires:
      - design-reading-a-design-system
      - html-forms
      - html-a11y-basics
    diagram: SystemExplorer, FormPattern (content/diagrams)
    practice: 'Контактная форма по правилам GOV.UK. Сделайте форму обратной связи так, как это описано в GOV.UK Design
      System. 1) У каждого поля есть видимая подпись над ним (label), а не только placeholder. 2) Не меньше двух полей
      имеют атрибут autocomplete (например, name и email). 3) У поля есть подсказка (элемент с классом hint), связанная
      с ним через aria-describedby. 4) Добавьте пример состояния ошибки: сводку (элемент с классом error-summary и
      role="alert") со ссылками на поля, и сообщение рядом с полем (класс field-error), которое начинается со слова
      «Ошибка:». Эти два блока служат образцом и помечены data-scaffold: на готовом сайте их не будет. 5) Кнопка
      отправки: button с type="submit" и подписью-глаголом. Эпоха: 4. Шаг: design-gov-form.'
    checks:
      - У какого-то поля нет подписи. Каждому нужен label, связанный через for и id.
      - "Нужны три подписи label с атрибутом for: имя, почта, сообщение."
      - "Добавьте autocomplete минимум двум полям: name и email."
      - "Нужна подсказка: элемент с классом hint."
      - Поле должно ссылаться на подсказку через aria-describedby с id подсказки.
      - У сводки ошибок должен быть role="alert", чтобы диктор её озвучил.
      - 'В сводке ошибок нужны минимум две ссылки на поля: href="#name" и href="#email".'
      - Сообщение рядом с полем должно начинаться со слов «Ошибка:».
      - Кнопка отправки должна быть button с type="submit" и подписью-глаголом, например «Отправить».
    sources:
