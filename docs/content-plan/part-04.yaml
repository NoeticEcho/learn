- id: 04-design/05-tokens
  order: 5
  title: 'Дизайн-токены: имена вместо чисел'
  summary: 'Зачем: вы научитесь хранить цвета, отступы, радиусы и тени как именованные значения, из которых собирается и CSS,
    и макет, и приложение. После урока вы напишете файл токенов в формате W3C DTCG, разделите токены на базовые, смысловые
    и компонентные и подключите их к странице через CSS-переменные.'
  minutes: 20
  teaches:
  - design.tokens
  - design.dtcg-format
  requires:
  - css.custom-properties
  - design.colour-system
  - design.type-scale
  diagram: 'Редактор токенов: слева JSON в формате DTCG, справа живая страница; изменение базового токена (color.blue.600)
    каскадом меняет смысловой (color.action) и компонентный (button.bg); переключатель темы подменяет слой смысловых токенов.'
  practice: 'Эпоха 4 (2014): выделить из своей страницы цвета, шкалу шрифтов и отступы в файл tokens.json по DTCG, сгенерировать
    из него :root с переменными в трёх слоях (базовые, смысловые, компонентные).'
  checks:
  - В tokens.json у каждого токена есть $value и $type, а ссылки на другие токены записаны через фигурные скобки.
  - 'Есть три слоя: базовые значения, смысловые имена (например, action, surface, text) и хотя бы один компонентный токен.'
  - В CSS нет «сырых» цветов вне блока переменных.
  - Смена одного базового токена меняет вид всех мест, где он используется, включая кнопку главного действия (mainAction).
  sources:
