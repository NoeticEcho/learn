  - id: 04-design/02-what-dates-a-site
    order: 2
    title: "Что старит сайт: устаревшее и современное"
    summary: Вы научитесь отличать приём, который устарел, от приёма, который просто немодный, и от нового, но вредного.
      После урока вы найдёте в чужой или своей странице признаки устаревания и исправите их.
    minutes: 25
    teaches:
      - design-outdated-vs-modern
    requires:
      - design-history-of-web-design
      - css-contrast
      - html-head-meta
    diagram: DatedOrNot (content/diagrams)
    practice: "Омоложение страницы. Эта страница датирована серединой девяностых. Исправьте её, не меняя смысла. 1) Уберите
      теги font, center и marquee. 2) Замените приветствие «Добро пожаловать» в заголовке h1 названием вашего проекта.
      3) Удалите «значок» с номером посетителя и плашку про Netscape. 4) В styles.css сделайте текст не мельче 16
      пикселей (можно 1rem) и достаточно тёмным: контраст с фоном не ниже 4.5. 5) Сократите меню: оставьте не больше
      шести пунктов, и не меньше трёх разделов из вашего проекта. 6) Сделайте кнопку главного действия сплошной: цветом
      фона, а не градиентом, и с контрастным текстом. 7) Добавьте в head метатег viewport и уберите из styles.css
      жёсткую ширину в 960 пикселей. Эпоха: 4. Шаг: design-fix-dated."
    checks:
      - "В разметке остались теги font, center, marquee или blink. Удалите их: оформление делает CSS."
      - В заголовке h1 всё ещё «Добро пожаловать». Замените его названием проекта.
      - В h1 должно быть название вашего проекта.
      - На странице остался значок про номер посетителя или плашка про Netscape. Удалите абзац целиком.
      - "Текст абзацев мелковат. В styles.css для p задайте font-size: 1rem (это 16 пикселей) или больше."
      - "Цвет текста слишком светлый для фона. Сделайте его тёмным, например #1c1b19."
      - В меню должно быть от трёх до шести ссылок. Сейчас больше или меньше.
      - В меню должны быть минимум три раздела вашего проекта, по названиям из брифа.
      - У кнопки главного действия остался градиент. Удалите background-image и задайте background-color.
      - "Текст кнопки плохо виден на её фоне. Возьмите тёмный фон, например #0b5cad, и белый текст."
      - 'В head нет метатега viewport. Добавьте: meta name="viewport" content="width=device-width, initial-scale=1".'
    sources:
      - title: Auto-Forwarding Carousels and Accordions Annoy Users and Reduce Visibility (Nielsen Norman Group)
