  - id: 04-design/04-type-scale
    order: 4
    title: "Типографская шкала: размеры по лестнице, а не наугад"
    summary: "Вы научитесь выбирать размеры шрифта не «на глаз», а по шкале: одно базовое число и один коэффициент дают весь
      набор. После урока у вашей страницы будет лестница размеров на CSS-переменных и понятные роли у текста."
    minutes: 20
    teaches:
      - design-type-scale
    requires:
      - design-visual-hierarchy
      - css-typography
      - css-units
    diagram: TypeScaleLab (content/diagrams)
    practice: "Шкала размеров для вашей страницы. Сейчас размеры шрифта на странице набраны разрозненными числами (29, 21,
      15 пикселей). Замените их шкалой. 1) В styles.css на :root опишите коэффициент --ratio (например, 1.25) и шесть
      ступеней --fs-sm, --fs-base, --fs-lg, --fs-xl, --fs-2xl, --fs-3xl в единицах rem (можно считать через calc). 2)
      Назначьте ступени ролям: h1 получает --fs-3xl, h2 --fs-xl, абзацы разделов --fs-base, подпись small --fs-sm. 3) У
      абзацев разделов межстрочный интервал от 1.4 до 1.7. Эпоха: 4. Шаг: design-type-scale."
    checks:
      - На :root нужна переменная --ratio с числом вроде 1.25.
      - "Не хватает --fs-sm: самой мелкой ступени, например 0.8rem."
      - "Не хватает --fs-base: размера основного текста, обычно 1rem."
      - "Не хватает --fs-lg: ступени выше основного текста, например 1.25rem."
      - Не хватает --fs-xl, например 1.563rem.
      - Не хватает --fs-2xl, например 1.953rem.
      - Не хватает --fs-3xl, самой крупной ступени, например 2.441rem.
      - "Заголовок h1 должен брать размер из крупной ступени: font-size: var(--fs-3xl)."
      - Заголовок h2 должен брать размер из средней ступени, например var(--fs-xl).
      - "Абзацы разделов (section p) должны брать размер основного текста: var(--fs-base)."
      - "Подпись small должна брать самую мелкую ступень: var(--fs-sm)."
      - "У абзацев разделов межстрочный интервал должен быть от 1.4 до 1.7, например line-height: 1.55."
    sources:
