  - id: 04-design/13-docs-governance
    order: 13
    title: "Документация и управление системой: страница компонента, версии, вклад"
    summary: "Вы научитесь описывать компонент так, чтобы им могли пользоваться без вопросов, и управлять системой после
      запуска: статусы, версии, вклад, устаревание. После урока у вас есть страница-справочник для кнопки вашего
      проекта."
    minutes: 30
    teaches:
      - design-ds-docs
      - design-ds-governance
    requires:
      - design-atomic-design
      - design-component
    diagram: SemverLab (content/diagrams)
    practice: "Страница-справочник кнопки вашего проекта. Напишите страницу компонента по образцу, который вы видели в
      GOV.UK. Заполните все разделы для кнопки главного действия. 1) «Когда использовать» и «Когда не использовать» по
      одной фразе. 2) Варианты (не меньше двух) и состояния (не меньше четырёх), списками. 3) «Слова»: правило для
      подписи и подпись вашей кнопки из проекта (она должна быть в тексте). 4) «Доступность». 5) Блок «Код»: пример
      разметки в pre и code, и живой пример кнопки рядом. 6) Статус (экспериментальный, стабильный или устаревший),
      версия вида 1.0.0, список изменений не меньше чем из двух записей с датами и правило устаревания: что и как вы
      сообщите людям, прежде чем что-то удалить. Все «…» нужно заменить. Эпоха: 4. Шаг: design-ds-reference."
    checks:
      - "Рядом должен быть живой пример: кнопка a.btn с подписью вашего проекта."
      - "Статус должен быть одним из трёх слов: экспериментальный, стабильный или устаревший."
      - "Версия должна быть в виде 1.0.0: три числа через точку."
      - "Опишите, когда использовать кнопку: хотя бы фраза из двух слов."
      - Опишите, когда кнопку не использовать.
      - Нужны минимум два варианта, каждый в своём li.
      - Нужны минимум четыре состояния, каждое в своём li.
      - В разделе «Слова» должна быть подпись вашей кнопки главного действия.
      - "Напишите хотя бы фразу о доступности: размер цели, контраст, фокус."
      - 'В блоке «Код» нужен пример разметки: pre и code с class="btn".'
      - В списке изменений нужно минимум две записи.
      - Каждая запись списка изменений должна содержать дату, например 2026-10-27.
      - "Напишите правило устаревания: что вы сообщите людям, прежде чем что-то удалить."
      - Где-то осталось многоточие «…». Замените его своими словами.
    sources:
