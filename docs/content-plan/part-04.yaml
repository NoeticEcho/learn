- id: 04-design/04-design-systems-tour
  order: 4
  title: Что такое дизайн-система и как читать чужие
  summary: 'Зачем: вы понимаете, из чего состоит дизайн-система (принципы, токены, компоненты, правила, код) и можете за двадцать
    минут разобраться в любой: Material 3, Apple HIG, Fluent, IBM Carbon, Atlassian, Shopify Polaris, GOV.UK, GitHub Primer,
    Radix и shadcn/ui, Tailwind, Gravity UI. После урока вы выберете, у кого что заимствовать для своего проекта.'
  minutes: 25
  teaches:
  - design.design-system
  - design.reading-a-design-system
  requires:
  - design.visual-hierarchy
  - design.colour-system
  - css.custom-properties
  diagram: 'Таблица-сравнитель: в строках десять систем, в столбцах «философия», «токены», «компоненты», «доступность», «лицензия»;
    клик по системе открывает мини-карточку с её кнопкой, полем ввода и палитрой, нарисованными одним и тем же компонентом.'
  practice: 'Эпоха 4 (2014): по tone и kind проекта из брифа выбрать две системы-образца, выписать из каждой три решения (радиус
    скругления, шаг отступов, состояние фокуса) и применить их к форме или кнопке главного действия на своей странице.'
  checks:
  - В заметке названы две выбранные системы и объяснено, чем выбор связан с tone и аудиторией (forWhom) проекта.
  - Для каждой системы выписаны три конкретных решения с числами или названиями токенов.
  - На странице главное действие (mainAction) оформлено по правилам хотя бы одной из выбранных систем и имеет видимое состояние
    фокуса.
  - Указано, чем система годится или не годится для языка и аудитории проекта (languages).
  sources:
