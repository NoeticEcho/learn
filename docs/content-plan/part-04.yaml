- id: 04-design/07-design-to-code
  order: 7
  title: 'От макета к коду: Figma, передача и Claude Design'
  summary: 'Зачем: вы понимаете, как дизайнер работает в Figma (фреймы, автолейаут, компоненты, переменные) и что именно нужно
    разработчику при передаче. После урока вы подготовите макет так, чтобы его можно было сверстать без вопросов, и сможете
    сравнить ручную вёрстку с вёрсткой по макету, сгенерированной ИИ-инструментом.'
  minutes: 20
  teaches:
  - design.design-to-code
  - design.handoff
  requires:
  - design.tokens
  - design.component
  diagram: 'Макет и код рядом: клик по элементу макета подсвечивает свойства (отступы, токены, размеры) и соответствующую
    строку CSS; переключатель показывает, чем автолейаут похож на flex, а переменные Figma — на CSS-переменные.'
  practice: 'Эпоха 7 (2025, ИИ-конструктор): собрать на бумаге или в Figma один экран из sections и mainAction брифа с названными
    слоями и переменными, затем дать его ИИ-инструменту как задание на вёрстку и отметить расхождения с токенами.'
  checks:
  - Макет экрана содержит все sections брифа, главное действие (mainAction) и использует названные цвета и размеры, а не случайные.
  - В списке расхождений указано не меньше трёх мест, где сгенерированный код не совпал с токенами или состояниями.
  - Для картинок и значков указано, что отдаётся векторами, а что растром, и в каких размерах.
  - Описано, как макет ведёт себя на узком экране.
  sources:
  - title: Figma Help Center
    url: https://help.figma.com/
    licence: proprietary-link
    kind: docs
    lang: en
  - title: 'Figma: Variables guide'
    url: https://help.figma.com/hc/en-us/articles/15339657135383-Guide-to-variables-in-Figma
    licence: proprietary-link
    kind: docs
