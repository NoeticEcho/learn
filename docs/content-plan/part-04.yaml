  - id: 04-design/05-colour-contrast
    order: 5
    title: "Цветовая система и контраст: палитра, которую можно прочитать"
    summary: Вы соберёте палитру, которая выглядит цельно и читается людьми со слабым зрением, и проверите контраст числами,
      а не на глаз. После урока вы знаете роли цветов, умеете строить ступени из одного оттенка и сделаете светлую и
      тёмную темы.
    minutes: 25
    teaches:
      - design-colour-system
      - design-contrast
    requires:
      - design-visual-hierarchy
      - css-color
      - css-contrast
      - css-custom-properties
    diagram: PaletteLab (content/diagrams)
    practice: 'Палитра с проверенным контрастом, светлая и тёмная. Сейчас на странице серое по белому и бледно-голубое:
      читать трудно. Соберите палитру и проверьте её. 1) В styles.css на :root опишите ступени: --neutral-50,
      --neutral-900, --accent-100, --accent-500, --accent-700 (цвета в hex). 2) Перекрасьте страницу этими цветами, но
      пока записывайте цвета прямо в правила (в уроке про токены вы замените их переменными): основной текст, вторичный
      текст .lead и ссылка в абзаце должны иметь контраст не ниже 4.5; кнопка .cta тоже, и ссылка в абзаце подчёркнута.
      3) Блок [data-theme="dark"] это тёмная тема: дайте ему тёмный фон и светлый текст, светлую ссылку и светлую кнопку
      с тёмным текстом: тоже не ниже 4.5. 4) Добавьте в head метатег color-scheme со значением «light dark». 5)
      Сообщение об ошибке не должно держаться на цвете: начните его со слова «Ошибка». Эпоха: 4. Шаг: design-palette.'
    checks:
      - "На :root нужна переменная --neutral-50: самый светлый нейтральный, в hex, например #faf9f7."
      - "На :root нужна переменная --neutral-900: самый тёмный нейтральный, например #1c1b19."
      - "На :root нужна --accent-100: светлая ступень акцента в hex."
      - "На :root нужна --accent-500: средняя ступень акцента в hex."
      - "На :root нужна --accent-700: тёмная ступень акцента в hex."
      - "Основной текст слишком светлый для фона: нужен контраст не ниже 4.5. Сделайте его почти чёрным."
      - "Вторичный текст .lead слишком светлый. Контраст должен быть не ниже 4.5, например #4a4742 на светлом фоне."
      - "Ссылка в абзаце плохо видна на фоне. Возьмите тёмно-синий, например #0b4a8b."
      - "Ссылка в абзаце должна быть подчёркнута: text-decoration: underline. Иначе её отличает только цвет."
      - Текст кнопки .cta плохо виден на её фоне. Возьмите тёмный фон (#0b5cad) и белый текст.
      - "В тёмном блоке текст слишком тёмный на тёмном фоне. Сделайте текст светлым, например #f2efe9."
      - "В тёмном блоке ссылка плохо видна. Возьмите светлый голубой, например #9cc4f0."
      - "Кнопка в тёмном блоке должна иметь контраст не ниже 4.5: светлый фон и тёмный текст."
      - 'В head нужен метатег: meta name="color-scheme" content="light dark".'
      - "Сообщение об ошибке должно начинаться со слова «Ошибка»: цвета для смысла мало."
    sources:
