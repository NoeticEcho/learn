# Plan of part 4, regenerated from the written lessons (like parts 0 and 1): it describes what exists.
# Changes against the first plan: 8 lessons became 15, because the owner asked for design systems in depth.
# - the history lesson and the "what dates a site" lesson were separated, and the old-or-modern quiz became a game in the second;
# - hierarchy and grid, the type scale, and colour with contrast became three lessons;
# - the design-systems tour became five: what a system is (nine layers), and how to read Material, Apple HIG and Fluent; GOV.UK, Carbon and Atlassian;
#   Polaris, Primer, Radix, shadcn/ui and Tailwind; and the Russian open systems Gravity UI, VKUI, Taiga UI and Plasma, with Russian details of an interface;
# - tokens (DTCG 2025.10), atomic design with component states, documentation with governance, design to code, and the AI tells with the learner's own small system are one lesson each.
# Engine notes that shaped the checks: jsdom (the content test) does not resolve var(), so colour and size checks read literal values; a padding shorthand written with var() reads as 0 there (lesson 9 accepts it);
# the contrast check parses only rgb/hex/named colours; computed lengths become px in a real browser, so checks accept both forms.
part: 4
