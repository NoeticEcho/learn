- id: 04-design/08-ai-tells-and-quiz
  order: 8
  title: Приметы страницы, сделанной ИИ, и квиз «старое или современное»
  summary: 'Зачем: вы видите, какие приёмы выдают шаблонную страницу, сделанную нейросетью (фиолетовый градиент, одинаковые
    карточки с иконками, пустые лозунги, шрифт по умолчанию), и умеете их избегать. В конце вы оцениваете пары «устаревшее
    и современное» сами и собираете мини-систему для своего проекта.'
  minutes: 25
  teaches:
  - design.ai-tells
  - design.outdated-vs-modern
  - design.own-system
  requires:
  - design.design-system
  - design.tokens
  - design.component
  - design.history-of-web-design
  diagram: 'Квиз-оценщик: две версии одного блока рядом, человек ставит «современнее» и «устарело», затем видит разбор по
    критериям (иерархия, контраст, плотность, движение); во второй части — чек-лист примет ИИ-страницы, по которому оценивается
    страница из эпохи 7.'
  practice: 'Эпоха 7 (2025, ИИ-конструктор): сгенерировать главную страницу по брифу ИИ-конструктором, отметить минимум пять
    примет шаблонности и переписать их: конкретные слова из proofs и people вместо лозунгов, свои токены вместо градиента
    по умолчанию.'
  checks:
  - В отчёте не меньше пяти отмеченных примет шаблонности с указанием места на странице.
  - Заголовок и подзаголовок главного экрана говорят о конкретном проекте (title, forWhom), а не о «инновационных решениях».
  - В исправленной версии использованы реальные пункты из proofs или people, а не придуманные цифры.
  - Палитра и шрифты взяты из токенов проекта и не совпадают с настройками по умолчанию конструктора.
  - Результат проходит проверку контраста и имеет видимый фокус.
  sources:
