  - id: 04-design/07-reading-material-hig-fluent
    order: 7
    title: "Как читать чужую дизайн-систему: Material, Apple, Fluent"
    summary: "Вы получите способ разобраться в любой дизайн-системе за двадцать минут и применяете его к трём системам
      крупнейших платформ: Material Design 3, Human Interface Guidelines Apple и Fluent 2 Microsoft. После урока вы
      берёте у них решения, а не оформление."
    minutes: 30
    teaches:
      - design-reading-a-design-system
    requires:
      - design-design-system
      - design-contrast
    diagram: SystemExplorer (content/diagrams)
    practice: "Прочитайте две системы и примените три решения. Выберите две системы из тех, что смотрели (Material, Apple
      HIG, Fluent или другие) и заполните записку. 1) Для каждой впишите название и три решения: радиус скругления, шаг
      отступов, состояние фокуса (с числами или названиями токенов). 2) Объясните, чем выбор связан с тоном и аудиторией
      вашего проекта, и годятся ли системы для его языка и аудитории. 3) Примените решения: в styles.css опишите на
      :root переменные --radius и --space и оформите кнопку главного действия .cta: блочной (inline-flex), с высотой не
      меньше 44 пикселей (так требуют Apple и Material в своих правилах). Все «…» нужно заменить. Эпоха: 4. Шаг:
      design-read-systems."
    checks:
      - "Нужны две системы: названия в элементах strong с классом sys-name."
      - "В названии должна быть настоящая система из списка в уроке: Material, Apple HIG, Fluent, GOV.UK, Carbon и
        другие."
      - У каждой системы нужно по три решения, всего шесть строк.
      - Где-то осталось многоточие «…». Замените его своими словами.
      - Объясните, чем выбор связан с тоном и аудиторией проекта.
      - Напишите, годятся ли системы для языка и аудитории проекта.
      - На :root нужна переменная --radius, например 8px.
      - На :root нужна переменная --space, например 8px.
      - "Кнопке .cta нужен display: inline-flex, иначе высота ей не подчинится."
      - "У .cta высота не меньше 44 пикселей: min-height: 44px (или 2.75rem)."
    sources:
