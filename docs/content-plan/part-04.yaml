  - id: 04-design/12-atomic-components
    order: 12
    title: "Атомарный дизайн: атомы, молекулы, компоненты и их состояния"
    summary: Вы научитесь раскладывать любую страницу на повторяемые части и называть их, а затем описывать каждый компонент
      вместе с состояниями (обычное, наведение, фокус, нажатие, недоступно, загрузка, ошибка). После урока вы собираете
      страницу из своих деталей, а не рисуете каждую заново.
    minutes: 30
    teaches:
      - design-atomic-design
      - design-component
    requires:
      - design-tokens
      - html-semantic-elements
    diagram: AtomicBreakdown (content/diagrams)
    practice: 'Карточка и кнопка как компоненты с состояниями. Оформите две детали как компоненты. 1) Карточка .card: одна и
      та же деталь для каждого пункта вашего проекта (и один образец-карточка уже на странице): в styles.css видимая
      рамка (не тоньше 1 пикселя), скругление и внутренние отступы. 2) Кнопка .btn в трёх состояниях, показанных рядом:
      обычная; недоступная (атрибут disabled) с прозрачностью от 0.2 до 0.7 и курсором not-allowed; в загрузке
      (aria-busy="true") с курсором progress. 3) Кроме того, опишите правилами :hover, :focus-visible и :active
      (проверка не умеет их увидеть: нажмите Tab и проверьте глазами). 4) В записке назовите по одному атому, молекуле и
      организму вашей страницы. Все «…» нужно заменить. Эпоха: 4. Шаг: design-card-component.'
    checks:
      - Карточек article.card должно быть не меньше, чем пунктов в вашем проекте.
      - Должна быть хотя бы одна карточка article.card.
      - "У карточки нужна видимая рамка: border: 1px solid #d9d5ce."
      - "У карточки нужно скругление: border-radius, например var(--radius)."
      - "В блоке состояний нужны три кнопки .btn: обычная, недоступная и в загрузке."
      - "Недоступная кнопка должна быть бледнее: opacity от 0.2 до 0.7."
      - У недоступной кнопки курсор должен быть not-allowed.
      - У кнопки в загрузке (aria-busy="true") курсор должен быть progress.
      - Назовите один атом вашей страницы, например «кнопка».
      - Назовите одну молекулу вашей страницы, например «карточка пункта».
      - Назовите один организм вашей страницы, например «секция с карточками».
      - Где-то осталось многоточие «…». Замените его своими словами.
    sources:
