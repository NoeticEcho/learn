- id: 04-design/03-colour-contrast
  order: 3
  title: Цветовая система и контраст
  summary: 'Зачем: вы соберёте палитру, которая выглядит цельно и читается людьми со слабым зрением, и проверите контраст
    по числам, а не на глаз. Вы узнаете, чем OKLCH удобнее HEX, как строятся ступени серого и акцента и почему светлая и тёмная
    темы — не просто инверсия.'
  minutes: 20
  teaches:
  - design.colour-system
  - design.contrast
  requires:
  - css.color
  - css.custom-properties
  diagram: 'Палитра-конструктор: один акцентный оттенок превращается в ряд из 10 ступеней в OKLCH; для каждой пары «текст
    на фоне» показано число контраста WCAG и значок «AA / AAA / не проходит»; переключатель светлой и тёмной тем.'
  practice: 'Эпоха 4 (2014): выбрать цвет по tone из брифа (серьёзный, тёплый, технический), построить акцент и нейтральные
    ступени переменными, сделать светлую и тёмную тему; проверить, что основной текст и текст кнопки главного действия проходят
    AA.'
  checks:
  - Цвета заданы переменными на :root, а не разбросаны по правилам.
  - Основной текст имеет контраст не ниже 4.5:1 с фоном, крупный текст и значки — не ниже 3:1.
  - Кнопка главного действия (mainAction) проходит проверку контраста в обеих темах.
  - Есть тёмная тема через prefers-color-scheme, и у body задан явный фон.
  - 'Смысл не передан одним только цветом: у ошибок и ссылок есть ещё и текстовый или графический признак.'
  sources:
  - title: 'W3C: Understanding Contrast (Minimum), WCAG 2.2'
    url: https://www.w3.org/WAI/WCAG22/Understanding/contrast-minimum.html
    licence: proprietary-link
    kind: spec
    lang: en
  - title: 'MDN: Color contrast'
