lessons:
  - id: 04-design/01-history
    order: 1
    title: "Тридцать лет веб-дизайна: от серого фона до стекла"
    summary: "Вы научитесь узнавать эпоху веб-дизайна по виду страницы и понимать, что её породило: технология, экран или
      мода. После урока вы по скриншоту назовёте время, объясните, что в нём устарело, а что осталось верным."
    minutes: 25
    teaches:
      - design-history-of-web-design
    requires:
      - net-internet-history
      - net-dotcom-web2
      - css-separate-stylesheets
      - css-floats-legacy
    diagram: DesignEras (content/diagrams)
    practice: "Первый экран двумя способами. Соберите первый экран своего проекта в манере двух эпох. В блоке «1996»
      раскладка делается таблицей: название, пункты из вашего содержимого и главное действие внутри table, а действие
      оформлено ссылкой. В блоке «2005» таблиц нет: шапка с цветным фоном, левая колонка с пунктами (класс side,
      плавающая влево) и основная колонка с тем же главным действием-ссылкой. Правила для колонок и шапки пишите в
      styles.css. В конце заполните заметку: что потерялось и что стало лучше. Эпоха: 2. Шаг: design-two-layouts."
    checks:
      - В head нет подключения стилей. Добавьте строку link rel="stylesheet" href="styles.css".
      - В блоке 1996 года название проекта должно стоять внутри таблицы.
      - Пункты вашего содержимого должны быть внутри таблицы в блоке 1996 года.
      - Главное действие в блоке 1996 года должно быть ссылкой (тег a) с вашим текстом действия.
      - "В блоке 2005 года таблиц быть не должно: раскладку делает CSS."
      - Пункты содержимого в блоке 2005 года положите в элемент с классом side.
      - Главное действие в блоке 2005 года должно быть ссылкой внутри элемента с классом main.
      - "У шапки блока 2005 года (элемент header) в styles.css должен быть цвет фона, например background-color:
        #cfe0f3."
      - "Колонке .side в styles.css нужно правило float: left. Файл стилей находится на соседней вкладке."
      - В заметке осталось многоточие «…». Замените его своими словами.
      - Напишите, что потерялось с переходом на отдельный CSS.
      - Напишите, что стало лучше.
    sources:
