  - id: 04-design/15-ai-tells-own-system
    order: 15
    title: Приметы шаблонной страницы и своя маленькая дизайн-система
    summary: Вы увидите, какие приёмы выдают шаблонную страницу (фиолетовый градиент, одинаковые карточки с эмодзи, лозунги,
      выдуманные цифры) и научитесь их заменять своим. После урока вы собираете из токенов, шкалы, компонентов и
      справочника свою маленькую систему и проверяете, что страница выглядит как ваша.
    minutes: 35
    teaches:
      - design-ai-tells
      - design-own-system
    requires:
      - design-handoff
      - design-ds-governance
      - design-outdated-vs-modern
      - design-design-system
    diagram: AiTells (content/diagrams)
    practice: "Сделайте шаблонную страницу своей. Эта главная страница собрана из шаблонных решений, как её сделал бы
      конструктор «по умолчанию». Перепишите её. 1) В заметке отметьте не меньше пяти примет шаблонности с указанием
      места на странице. 2) Заголовок h1 это название вашего проекта, а подзаголовок говорит, для кого он (никаких
      «инновационных решений» и «новых высот»). 3) Кнопка главного действия .cta подписана действием из вашего проекта.
      4) Карточки в блоке features это пункты вашего проекта, без эмодзи; вводный абзац p под заголовком блока тоже
      конкретный. 5) В блоке proof подтверждения из вашего проекта (документы, работы, люди), без выдуманных цифр вроде
      «10k+» и «99.9 %». 6) В styles.css на :root опишите токены --accent, --surface, --text, --font-body и --space-4;
      уберите градиент с .hero и шрифт Inter; основной текст и кнопка должны иметь контраст не ниже 4.5. Все «…» нужно
      заменить. Эпоха: 7. Шаг: design-own-system."
    checks:
      - В заметке нужно минимум пять примет шаблонности.
      - Каждую примету опишите словами с указанием места на странице.
      - Где-то осталось многоточие «…». Замените его своими словами.
      - Заголовок h1 должен быть названием вашего проекта.
      - В первом экране должно быть сказано, для кого проект.
      - В первом экране остались шаблонные лозунги («инновационные решения», «новых высот»). Напишите конкретно.
      - Кнопка главного действия должна называть действие из вашего проекта.
      - Карточки должны быть вашими пунктами проекта.
      - В блоке карточек остались эмодзи. Уберите их.
      - В блоке подтверждений должны быть ваши настоящие подтверждения из проекта.
      - Выдуманные цифры («10k+», «99.9 %») нужно убрать.
      - На :root нужна переменная --accent.
      - На :root нужна переменная --surface.
      - На :root нужна переменная --text.
      - На :root нужна переменная --font-body.
      - На :root нужна переменная --space-4 в px или rem.
      - "С шапки .hero нужно убрать градиент: background-image."
      - Шрифт Inter остался по умолчанию. Задайте свой шрифт через --font-body.
      - "Текст в карточках слишком светлый для фона: контраст не ниже 4.5."
      - "Подпись кнопки плохо видна на её фоне: нужен контраст не ниже 4.5."
    sources:
      - title: Improving frontend design through Skills (Anthropic)
