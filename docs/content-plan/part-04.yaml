- id: 04-design/02-hierarchy-grid-type
  order: 2
  title: Иерархия, сетка, пустое место и шкала шрифтов
  summary: 'Зачем: вы можете сделать так, чтобы глаз посетителя шёл туда, куда нужно вам: к главному действию. Вы поймёте,
    чем размер, вес, цвет и отступ управляют вниманием, как сетка выравнивает страницу и как выбрать шкалу размеров шрифта,
    а не гадать каждый раз.'
  minutes: 20
  teaches:
  - design.visual-hierarchy
  - design.grid-and-whitespace
  - design.type-scale
  requires:
  - css.typography
  - css.grid
  - css.custom-properties
  diagram: 'Страница-макет с ползунками: размер заголовка, интерлиньяж, отступ между секциями, колонки сетки; рядом тепловая
    карта «куда сначала смотрит глаз» и подсветка текущей ступени типографской шкалы (коэффициент 1.2 / 1.25 / 1.333).'
  practice: 'Эпоха 4 (2014, адаптивная): взять sections и mainAction из брифа и построить страницу с тремя уровнями иерархии,
    сеткой в 12 колонок (или 4 на телефоне) и шкалой шрифтов на CSS-переменных; главное действие должно быть самым заметным
    элементом первого экрана.'
  checks:
  - Размеры шрифта заданы через переменные шкалы, а не разрозненными числами, и их не меньше пяти ступеней.
  - У каждой секции из sections есть заголовок на одном и том же уровне, а заголовок страницы крупнее заголовков секций.
  - Главное действие (mainAction) визуально выделено сильнее остальных ссылок и кнопок.
  - Ширина строки основного текста не превышает примерно 75 знаков.
  - Отступы между секциями кратны одному базовому шагу.
  sources:
  - title: 'NN/g: Visual Hierarchy in UX'
    url: https://www.nngroup.com/articles/visual-hierarchy-ux-definition/
    licence: proprietary-link
    kind: article
    lang: en
