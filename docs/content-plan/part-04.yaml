part: 4
slug: design
title: Дизайн и дизайн-системы
era: null
summary: Как выглядел веб с 1991 года, что устарело и почему, как читать и строить дизайн-систему (токены, атомы, компоненты),
  как передавать дизайн в код и как не делать страницу, которая выглядит как сгенерированная ИИ.
