  - id: 04-design/09-product-headless-utility
    order: 9
    title: "Продуктовые и «безголовые» системы: Polaris, Primer, Radix, shadcn/ui, Tailwind"
    summary: Вы поймёте, что у детали интерфейса четыре слоя (структура, поведение, доступность, вид) и что разные системы
      берут на себя разное их число. После урока вы объясните, чем Radix отличается от Polaris, и соберёте утилитные
      классы из своих токенов, как в Tailwind.
    minutes: 30
    teaches:
      - design-ds-product-and-headless
    requires:
      - design-reading-a-design-system
      - css-custom-properties
    diagram: LayerMatrix, SystemExplorer (content/diagrams)
    practice: "Утилитные классы из ваших токенов. В styles.css уже есть токены (отступы, радиус, размеры шрифта, цвета
      акцента). Сделайте из них словарь утилит, как в Tailwind, и перепишите страницу. 1) Опишите восемь классов: .flex,
      .gap-4, .p-4, .rounded, .text-lg, .text-sm, .bg-accent и .text-on-accent, каждый через токены из :root. 2)
      Перепишите карточки из разделов вашего проекта, используя только эти классы (класс .card уберите): .p-4, .rounded,
      .bg-accent, .text-on-accent на каждой карточке, .text-lg на её заголовке. 3) Контейнер карточек получает .flex и
      .gap-4. Атрибут style в разметке использовать нельзя. Эпоха: 4. Шаг: design-utilities."
    checks:
      - "Нужен класс .flex с display: flex, и он должен быть использован в разметке."
      - "У .gap-4 должен быть gap: var(--space-4). Класс нужно применить к контейнеру."
      - "У .p-4 должен быть padding: var(--space-4). Примените его к карточкам."
      - "У .rounded должен быть border-radius: var(--radius)."
      - "У .text-lg должен быть font-size: var(--fs-lg). Примените его к заголовкам карточек."
      - "У .text-sm должен быть font-size: var(--fs-sm). Примените его к тексту карточки."
      - "У .bg-accent должен быть background-color: var(--accent)."
      - "У .text-on-accent должен быть color: var(--on-accent)."
      - "Каждая карточка должна иметь сразу четыре класса: p-4, rounded, bg-accent, text-on-accent."
      - "Класс card должен исчезнуть из разметки: теперь карточки собираются из утилит."
      - В разметке остался атрибут style. Перенесите его в утилитные классы.
    sources:
