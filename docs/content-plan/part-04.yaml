  - id: 04-design/06-what-is-a-design-system
    order: 6
    title: Что такое дизайн-система и из чего она состоит
    summary: Вы поймёте, чем дизайн-система отличается от набора картинок и от гайдлайна, из каких девяти слоёв она
      складывается и какие из них нужны вашему проекту. После урока у вас есть паспорт собственной системы.
    minutes: 25
    teaches:
      - design-design-system
    requires:
      - design-visual-hierarchy
      - design-colour-system
      - design-type-scale
    diagram: DsAnatomy (content/diagrams)
    practice: "Паспорт дизайн-системы вашего проекта. Заполните паспорт: что у вашего проекта есть на каждом слое системы.
      1) Три принципа: короткие правила, по которым вы будете решать спорные вопросы (каждое из трёх слов и больше). 2)
      Для шести слоёв (основы, токены, компоненты, слова, документация, управление) напишите, что у вас на этом слое
      есть или будет. 3) Кто решает об изменениях. 4) Чего в системе пока нет и не будет: умение отказаться от лишнего
      это часть дизайна. Все «…» нужно заменить. Эпоха: 4. Шаг: design-ds-passport."
    checks:
      - Нужно три принципа, каждый в своём пункте с классом principle.
      - Принцип слишком короткий. Напишите его минимум тремя словами.
      - В таблице должно остаться шесть слоёв.
      - В колонке «Что у нас» нужно написать слова, а не оставить пусто.
      - Где-то осталось многоточие «…». Замените его своими словами.
      - Напишите, кто решает об изменениях в системе.
      - "Напишите, чего в системе не будет: умение отказаться тоже решение."
    sources:
