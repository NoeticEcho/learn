  - id: 04-design/03-hierarchy-grid-space
    order: 3
    title: Иерархия, сетка и пустое место
    summary: "Вы научитесь вести взгляд посетителя к главному действию: размером, весом, цветом и отступами, а не словами.
      После урока вы построите страницу с тремя уровнями заголовков, сеткой и единым шагом отступов, и проверите её
      «прищуриванием»."
    minutes: 25
    teaches:
      - design-visual-hierarchy
      - design-grid-and-whitespace
    requires:
      - design-outdated-vs-modern
      - css-grid
      - css-typography
      - css-custom-properties
    diagram: HierarchyLab (content/diagrams)
    practice: "Страница с иерархией, сеткой и шагом отступов. Постройте страницу так, чтобы глаз шёл к главному действию. 1)
      Название проекта сделайте заголовком h1, а каждый раздел из вашего проекта карточкой с заголовком h2. 2) Главное
      действие оформите ссылкой с классом cta: ровно одна такая на странице, сплошного цвета и с жирным начертанием.
      Остальные ссылки остаются обычными. 3) В styles.css опишите на :root два значения: --space (базовый шаг отступов,
      например 8px) и --measure (ширина строки, например 65ch). 4) Карточки разложите сеткой: .grid с display: grid и
      колонками repeat(12, 1fr) (или repeat(4, 1fr) для телефона). Прищурьтесь на предпросмотр: главным должно остаться
      действие. Эпоха: 4. Шаг: design-hierarchy-grid."
    checks:
      - "На странице должен быть ровно один заголовок h1: название проекта."
      - В h1 должно быть название вашего проекта.
      - В заголовках h2 должны стоять названия разделов вашего проекта.
      - На каждый раздел нужен свой заголовок h2.
      - "Нужна ровно одна ссылка с классом cta: главное действие. Остальные ссылки обычные."
      - Ссылка cta должна называть главное действие вашего проекта.
      - "У .cta в styles.css нужен сплошной фон: background-color."
      - "Сделайте текст .cta жирным: font-weight: 700."
      - "В styles.css на :root нужна переменная --space с числом в px или rem, например --space: 8px."
      - "В styles.css на :root нужна переменная --measure в единицах ch, например --measure: 65ch."
      - "У .grid в styles.css должно быть display: grid."
      - "У .grid нужны колонки: grid-template-columns: repeat(12, 1fr) (или repeat(4, 1fr))."
    sources:
