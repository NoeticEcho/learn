  - id: 04-design/14-design-to-code
    order: 14
    title: "От макета к коду: Figma, передача и работа с ИИ"
    summary: Вы поймёте, как дизайнер работает в Figma (кадры, автолейаут, компоненты, переменные) и что именно нужно
      разработчику при передаче макета. После урока вы напишете спецификацию передачи для первого экрана своего проекта,
      по которой его можно сверстать без вопросов, в том числе поручить ИИ.
    minutes: 30
    teaches:
      - design-design-to-code
      - design-handoff
    requires:
      - design-tokens
      - design-component
    diagram: HandoffInspector (content/diagrams)
    practice: "Спецификация передачи первого экрана. Опишите первый экран своего проекта так, чтобы его можно было сверстать
      без вопросов. 1) Кадры: ширина для телефона, планшета и компьютера (числа). 2) Слои: не меньше пяти названий в
      виде «Блок/Часть» (например Hero/Title). 3) Токены: не меньше четырёх, названиями переменных CSS (--space-4 и так
      далее). 4) Состояния главного действия: не меньше четырёх. 5) Ресурсы: две строки таблицы: что отдаётся векторами,
      что растром, и размеры. 6) Что происходит на узком экране. 7) После того как по спецификации сделали вёрстку
      (вручную или ИИ-инструментом), впишите не меньше трёх расхождений с токенами или состояниями. В описании экрана
      должны быть все разделы вашего проекта и главное действие. Все «…» нужно заменить. Эпоха: 7. Шаг:
      design-handoff-spec."
    checks:
      - "Нужны три кадра: телефон, планшет и компьютер."
      - У каждого кадра должна быть ширина числом, например 375.
      - Нужно минимум пять слоёв, каждый в своём li с классом layer.
      - Слои называются «Блок/Часть», например Hero/Title.
      - Нужно минимум четыре токена.
      - "Токены записывайте именами переменных CSS: --space-4, --fs-3xl."
      - Нужны минимум четыре состояния главного действия.
      - В таблице ресурсов нужны две строки.
      - В колонке «Как отдаётся» напишите «вектор»/«SVG» или «растр»/«WebP».
      - "Опишите, что происходит на узком экране: например, «до 600 пикселей карточки идут в одну колонку»."
      - Нужно минимум три расхождения после вёрстки.
      - "В описании экрана должны быть все разделы проекта: они подставлены из вашего брифа."
      - В спецификации должно быть главное действие вашего проекта.
      - Где-то осталось многоточие «…». Замените его своими словами.
    sources:
