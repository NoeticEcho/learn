lessons:
- id: 04-design/01-history
  order: 1
  title: 'Тридцать лет веб-дизайна: от серого фона до стекла'
  summary: 'Зачем: вы узнаёте эпохи веб-дизайна по виду страницы (таблицы и распорки, Flash и заставки, скевоморфизм, плоский
    дизайн, Material, «стекло», неоморфизм, брутализм) и понимаете, какая причина — технология, мода или экран — породила
    каждую. После урока вы сможете по скриншоту назвать эпоху и объяснить, что в ней устарело, а что осталось верным.'
  minutes: 20
  teaches:
  - design.history-of-web-design
  requires:
  - css.box-model
  - net.internet-history
  diagram: 'Слайдер «сравни эпохи»: одна и та же карточка из брифа человека (название, главное действие, три пункта) перерисовывается
    в 1996, 2000, 2008, 2013, 2018, 2022 и 2025; рядом подпись, какая технология или экран это сделали возможным.'
  practice: 'Эпоха 1 (1996, таблицы) и эпоха 2 (2005): взять поля брифа title, mainAction и items и оформить первый экран
    двумя способами — табличной вёрсткой с цветным фоном и затем CSS с шапкой и колонкой; записать в одну строку, что стало
    лучше и что потерялось.'
  checks:
  - На первом экране есть название проекта (title) и главное действие (mainAction), оформленное как заметная ссылка или кнопка.
  - В версии 1996 года вёрстка сделана таблицей, в версии 2005 года таблиц для макета нет, стили вынесены в отдельный CSS.
  - Каждый пункт из items показан в обеих версиях.
  - Рядом с каждой версией есть подпись с эпохой и одним устаревшим и одним уцелевшим приёмом.
  sources:
  - title: 'Web Design Museum: история веб-дизайна по годам'
    url: https://www.webdesignmuseum.org/
    licence: link-only
    kind: article
    lang: en
