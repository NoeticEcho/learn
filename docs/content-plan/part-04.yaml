  - id: 04-design/10-russian-systems
    order: 10
    title: Российские открытые системы и русский язык в интерфейсе
    summary: "Вы познакомитесь с четырьмя открытыми дизайн-системами российских компаний: Gravity UI, VKUI, Taiga UI и
      Plasma, и узнаете, что нужно учесть, чтобы любая система работала по-русски: формы слов после числа, цены, даты,
      кавычки и длинные подписи. После урока вы исправите эти мелочи на своей странице."
    minutes: 30
    teaches:
      - design-ds-russian
    requires:
      - design-ds-product-and-headless
      - html-lang-i18n
    diagram: SystemExplorer, RuDetails (content/diagrams)
    practice: "Русские мелочи в интерфейсе. Исправьте на странице то, на чём ломаются «английские» компоненты. 1) Счётчики:
      «1 услуга», «2 услуги», «5 услуг» (сейчас везде «услуг»). 2) Цена: «12 500 ₽» с неразрывными пробелами (&nbsp;)
      между тысячами и перед знаком рубля. 3) Дата: оберните в элемент time с атрибутом datetime в формате 2026-10-27 и
      напишите её словами: «27 октября 2026». 4) Цитата в кавычках-«ёлочках». 5) В styles.css кнопка .cta должна расти
      по подписи: вместо жёсткой ширины задайте min-width (например 9rem) и уберите white-space: nowrap. 6) В записке
      выберите одну из российских систем (Gravity UI, VKUI, Taiga UI или Plasma), напишите одну идею, которую вы бы
      взяли, и одну причину не брать её целиком. Все «…» нужно заменить. Эпоха: 4. Шаг: design-russian-details."
    checks:
      - Для единицы нужна форма «1 услуга».
      - Для двух нужна форма «2 услуги».
      - Для пяти нужна форма «5 услуг».
      - "Цена должна быть записана как 12 500 ₽ с неразрывными пробелами: 12&nbsp;500&nbsp;₽."
      - Дата должна быть в элементе time с атрибутом datetime в виде 2026-10-27.
      - "Внутри time напишите дату словами: «27 октября 2026»."
      - "Цитата должна стоять в «ёлочках»: «Работа сделана вовремя»."
      - У .cta должен быть min-width, например 9rem, вместо жёсткой ширины.
      - "У .cta не должно быть white-space: nowrap: пусть подпись переносится."
      - "В записке назовите одну из систем: Gravity UI, VKUI, Taiga UI или Plasma."
      - Напишите идею, которую берёте у этой системы.
      - Напишите, почему не берёте систему целиком.
      - Где-то осталось многоточие «…». Замените его своими словами.
