- id: 05-javascript/07-svelte-component
  order: 7
  title: Компонент на Svelte
  summary: 'Компонент — кусок интерфейса со своими данными, разметкой и оформлением. После урока вы читаете файл .svelte,
    понимаете руны $state, $derived и $props и переносите блок страницы в компонент: карточку и список с поиском.'
  minutes: 30
  teaches:
  - js-svelte-component
  requires:
  - js-reactivity
  - js-modules
  diagram: 'content/diagrams/RunesDemo.svelte: «Что обновилось»'
  practice: 'Карточка и список вашего проекта как компоненты. Песочница не собирает Svelte, поэтому компоненты вы пишете
    текстом, в полях блока «Компоненты страницы», как если бы они лежали в файлах. Заполните все «…». 1)
    ItemCard.svelte: получает item через let { item } = $props(), хранит в $state, раскрыт ли блок «Подробнее», выводит
    {item.title}, {item.price}, а по кнопке с aria-expanded показывает {item.text}. 2) ItemList.svelte: импортирует
    ItemCard, получает items через $props, хранит запрос в $state, а показанный список считает через $derived; поле
    поиска связано через bind:value; карточки выводит {#each … as item (item.title)} и на пустой список показывает
    сообщение через {:else}. 3) App.svelte: массив items с вашими пунктами из брифа и строка <ItemList {items} />. 4)
    Подсчитайте строки кода: вручную (ваши скрипты на странице) и в компонентах. 5) В абзаце про JavaScript напишите,
    что увидит посетитель без скрипта. Компоненты можно проверить в песочнице svelte.dev/playground. Эпоха: 5.'
  checks:
  - Блок «Компоненты страницы» (section id="components") пропал. Верните его.
  - Остались многоточия «…». Заполните каждое поле кодом или текстом.
  - 'В ItemCard данные берутся так: let { item } = $props();.'
  - 'В ItemCard нужно состояние раскрытия: let open = $state(false);.'
  - Карточка должна выводить {item.title} и, по кнопке, {item.text}.
  - 'Кнопка раскрытия должна иметь aria-expanded и onclick: <button type="button" aria-expanded={open} onclick={…}>.'
  - 'Уберите {@html …}: данные выводите обычной вставкой {…}, она безопасна.'
  - 'ItemList должен импортировать карточку: import ItemCard from "./ItemCard.svelte".'
  - В ItemList запрос хранится в $state, а показанный список считается через $derived.
  - 'ItemList получает список от родителя: let { items } = $props();.'
  - 'Список выводится так: {#each shown as item (item.title)} … {/each}, с ключом в скобках.'
  - На пустой список нужна ветка {:else} с сообщением для посетителя.
  - Поле поиска связывается с состоянием через bind:value={query}.
  - 'В списке надо использовать карточку: <ItemCard {item} />.'
  - 'App должен импортировать список: import ItemList from "./ItemList.svelte".'
  - 'App передаёт данные списку: <ItemList {items} />.'
  - 'В App.svelte должны быть ваши пункты из брифа: хотя бы два названия записаны так же, как в брифе.'
  - 'В абзаце «Строк кода» нужны два числа: сколько вручную и сколько в компонентах.'
  - В последнем абзаце напишите, что увидит посетитель без JavaScript.
  sources:
