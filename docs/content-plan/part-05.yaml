- id: 05-javascript/02-dom
  order: 2
  title: 'DOM: страница как дерево, которое можно менять'
  summary: Браузер хранит страницу как дерево, и JavaScript может в нём искать, читать и менять. После урока вы находите
    элементы селекторами, создаёте новые из данных и понимаете, почему чужой текст нельзя вставлять через innerHTML.
  minutes: 25
  teaches:
  - js-dom
  requires:
  - js-arrays-and-objects
  - html-semantic-elements
  diagram: 'content/diagrams/DomTree.svelte: «Дерево страницы»'
  practice: 'Быстрый переход по вашим предложениям: список из карточек. Пусть скрипт сам построит навигацию по карточкам.
    1) В секции #offer после заголовка добавьте пустой nav с id="quick" и aria-label (например «Быстрый переход по
    предложениям») и пустой абзац с id="offer-count". 2) Добавьте второй скрипт <script type="module" id="dom-code">. В
    нём найдите все карточки (#offer .card) через querySelectorAll. 3) Если карточек нет, покажите в #quick понятное
    сообщение (через textContent). Если есть, создайте список ul: каждой карточке задайте id вида item-1, item-2 и
    сделайте для неё li со ссылкой a, у которой href ведёт на этот id, а текст взят из заголовка карточки. Всё это через
    createElement, textContent и append. 4) В #offer-count напишите «Предложений: N». Использовать innerHTML для вставки
    текста нельзя. Проверки читают текст вашего скрипта и разметку; список ссылок вы увидите в предпросмотре. Эпоха: 4.
    Продолжает шаг js-first-code.'
  checks:
  - 'В секции #offer нужен элемент <nav id="quick" aria-label="…">. Скрипт построит в нём список.'
  - 'У nav нужно подпись для скринридера: aria-label="Быстрый переход по предложениям".'
  - 'Нужен абзац для счётчика: <p id="offer-count"></p>.'
  - 'Не нашёл второй скрипт: <script type="module" id="dom-code">.'
  - У скрипта нужен атрибут type="module".
  - 'Карточки в разметке (article с классом card) должны остаться на месте: скрипт строит навигацию, а не заменяет их.'
  - 'Карточки ищутся через querySelectorAll: document.querySelectorAll("#offer .card").'
  - Не вижу createElement. Элементы списка создаются командой document.createElement("li").
  - 'Созданные элементы надо вставить в страницу: list.append(row), quick.append(list).'
  - Текст ссылок записывайте через textContent.
  - 'Уберите innerHTML, outerHTML, insertAdjacentHTML и document.write: текст надо вставлять через textContent.'
  - 'Нужна проверка пустого списка: if (cards.length === 0) { … }. Сообщение для посетителя запишите в #quick через
    textContent.'
  - 'Навигация должна быть настоящим списком: создайте ul (или ol) и li через createElement.'
  - 'Каждой карточке задайте id (card.id = "item-" + …), а ссылке href, который на этот id указывает: link.href = "#" +
    card.id.'
  sources:
  - title: Введение в DOM (MDN)
    url: https://developer.mozilla.org/ru/docs/Web/API/Document_Object_Model/Introduction
    licence: CC-BY-SA
    kind: docs
    lang: ru
  - title: Document.querySelector (MDN)
    url: https://developer.mozilla.org/ru/docs/Web/API/Document/querySelector
    licence: CC-BY-SA
    kind: docs
    lang: ru
  - title: DOM Standard (WHATWG)
    url: https://dom.spec.whatwg.org/
    licence: CC-BY
    kind: spec
    lang: en
  - title: 'Документ: учебник learn.javascript.ru'
    url: https://learn.javascript.ru/document
    licence: link-only
    kind: course
    lang: ru
  - title: 'OWASP: DOM based XSS Prevention Cheat Sheet'
    url: https://cheatsheetseries.owasp.org/cheatsheets/DOM_based_XSS_Prevention_Cheat_Sheet.html
    licence: CC-BY-SA
    kind: docs
    lang: en
  videos: []
- id: 05-javascript/03-events
  order: 3
  title: 'События: реакция на клики, ввод и клавиши'
  summary: Страница оживает, когда реагирует на посетителя. После урока вы вешаете обработчики на клики, ввод и клавиши,
    понимаете, как событие всплывает по дереву и зачем делегирование, и не ломаете управление с клавиатуры.
  minutes: 25
  teaches:
  - js-events
  requires:
  - js-dom
  - html-forms
  diagram: 'content/diagrams/EventFlight.svelte: «Полёт события»'
  practice: 'Меню-кнопка и поиск по предложениям, с клавиатуры. Оживите страницу двумя вещами. 1) Меню. В nav с разделами
    добавьте перед списком кнопку <button type="button" id="menu-button" aria-expanded="false" aria-controls="menu-list"
    hidden>Разделы</button> и дайте ul список id="menu-list". Без скрипта список виден всегда, а скрипт убирает у кнопки
    hidden, прячет список и по клику открывает и закрывает его, обновляя aria-expanded. Клавиша Escape закрывает меню и
    возвращает фокус на кнопку. В styles.css добавьте [hidden] { display: none !important }: иначе display: flex у
    списка перебьёт атрибут. 2) Поиск. В секции #offer после счётчика добавьте форму <form id="search" role="search"
    aria-label="…"> с полем type="search" и подписью label, и абзац <p id="nothing" hidden> с текстом «Ничего не
    нашлось». 3) Третий скрипт <script type="module" id="events-code">: слушатель click на кнопке, keydown для Escape,
    на форме submit с preventDefault (иначе Enter перезагрузит страницу) и input: по введённому слову скрывайте карточки
    (card.hidden), в котором нет слова, без учёта регистра; пустую выдачу показывайте абзацем #nothing, а в #offer-count
    пишите «Показано: N из M». Обработчики на onclick в разметке не пишите. Эпоха: 4. Продолжает шаг js-dom-quick-nav.'
  checks:
  - В nav с разделами нужна кнопка <button id="menu-button">.
  - 'У кнопки нужен type="button": без него в форме она бы отправляла форму.'
  - У кнопки нужен атрибут aria-expanded со значением "false" или "true".
  - 'Добавьте кнопке aria-controls: в нём id списка, которым она управляет: aria-controls="menu-list".'
  - Список разделов должен называться ul#menu-list.
  - Нужна форма id="search" с полем <input type="search">.
  - 'У каждого поля должна быть подпись label. Проверьте новое поле поиска: <label for="q"> и id="q" у input.'
  - Абзац <p id="nothing" hidden> должен содержать текст сообщения, например «Ничего не нашлось».
  - 'Уберите атрибуты onclick, oninput и подобные из разметки: обработчики вешает скрипт через addEventListener.'
  - 'Не нашёл третий скрипт: <script type="module" id="events-code">.'
  - У скрипта нужен атрибут type="module".
  - Не вижу addEventListener("click", …) для кнопки меню.
  - 'Для Escape нужен слушатель клавиатуры: document.addEventListener("keydown", (event) => { if (event.key ===
    "Escape") … }).'
  - 'Меняйте aria-expanded вместе с меню: button.setAttribute("aria-expanded", String(open)).'
  - 'Прячьте и показывайте через свойство hidden: menu.hidden = true.'
  - 'После закрытия по Escape верните фокус на кнопку: button.focus().'
  - 'Нужен слушатель события input для поля поиска: search.addEventListener("input", …).'
  - У формы поиска нужен обработчик submit с event.preventDefault(), иначе Enter перезагрузит страницу.
  - 'Значение поля берите из события: event.target.value. Так обработчик на форме работает для любого её поля.'
  - 'Поиск должен не зависеть от регистра: приведите и запрос, и текст карточки к нижнему регистру через toLowerCase().'
  sources:
  - title: Введение в события (MDN)
    url: https://developer.mozilla.org/ru/docs/Learn_web_development/Core/Scripting/Events
    licence: CC-BY-SA
    kind: docs
    lang: ru
  - title: EventTarget.addEventListener (MDN)
    url: https://developer.mozilla.org/ru/docs/Web/API/EventTarget/addEventListener
    licence: CC-BY-SA
    kind: docs
    lang: ru
  - title: Введение в браузерные события (learn.javascript.ru)
    url: https://learn.javascript.ru/events
    licence: link-only
    kind: course
    lang: ru
  - title: 'ARIA Authoring Practices Guide: Disclosure (W3C)'
    url: https://www.w3.org/WAI/ARIA/apg/patterns/disclosure/
    licence: link-only
    kind: docs
    lang: en
  videos:
  - title: 'Уроки JavaScript для начинающих, №11: События и обработчик событий (Школа itProger)'
