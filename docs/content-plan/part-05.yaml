lessons:
- id: 05-js/01-values-functions
  order: 1
  title: Значения, функции, массивы и объекты
  summary: 'Зачем: вы читаете и пишете короткие программы на JavaScript: храните данные брифа в переменных, объектах и массивах
    и превращаете их функциями в другие данные. После урока вы можете объяснить, что такое тип, область видимости и стрелочная
    функция, и пользоваться консолью браузера.'
  minutes: 25
  teaches:
  - js.values-and-types
  - js.functions
  - js.arrays-and-objects
  requires:
  - html.document-structure
  - net.rendering-pipeline
  diagram: 'Песочница-консоль: слева код, справа значения с типами; шаги выполнения подсвечивают, какая переменная в какой
    области видимости живёт, а map/filter показаны как конвейер карточек.'
  practice: 'Эпоха 2 (2005): записать items брифа массивом объектов {название, описание, цена или ссылка}, написать функции,
    которые возвращают список названий, отфильтровывают по условию и считают количество; показать результат в консоли.'
  checks:
  - Данные items заданы массивом объектов, а не отдельными переменными.
  - Есть функция, возвращающая из items только названия, и она не изменяет исходный массив.
  - Есть функция, которая отбирает пункты по условию, например по ключу цены или категории.
  - Код запускается без ошибок в консоли и не использует var.
  sources:
