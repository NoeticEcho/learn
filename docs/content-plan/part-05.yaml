- id: 05-js/08-progressive-enhancement
  order: 8
  title: Прогрессивное улучшение
  summary: 'Зачем: вы строите страницу так, чтобы основная задача посетителя решалась и без JavaScript, на слабом телефоне
    и при сбое скрипта, а скрипт делает её лучше. После урока вы делите функции вашего проекта на обязательные и
    улучшающие и проверяете страницу с отключённым скриптом.'
  minutes: 20
  teaches:
  - js.progressive-enhancement
  requires:
  - js.fetch
  - js.events
  - html.forms
  diagram: 'Переключатель условий: JS выключен, медленная сеть, сбой скрипта, старый браузер; на странице-макете видно,
    что остаётся работать при каждой, а что нет.'
  practice: 'Эпоха 5 (2019) и далее: проверить страницу брифа с отключённым JavaScript, убедиться, что главное действие
    (mainAction) и контакты (contacts) работают как обычные ссылки и форма, затем добавить скрипт как улучшение
    (проверка на лету, отправка без перезагрузки).'
  checks:
  - С отключённым JavaScript видны все sections, items и контакты (contacts).
  - 'Главное действие (mainAction) работает без скрипта: ссылка или форма с обычной отправкой.'
  - Скрипт добавляет возможности, а не заменяет собой разметку; при ошибке скрипта страница остаётся читаемой.
  - Составлен список «обязательное» и «улучшение» минимум из пяти функций.
  sources:
