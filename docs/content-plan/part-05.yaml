- id: 05-javascript/04-async-fetch-json
  order: 4
  title: Асинхронность, fetch и JSON
  summary: Данные с сервера приходят не сразу, а страница при этом не должна зависать. После урока вы запрашиваете данные
    через fetch, читаете и пишете JSON, понимаете промисы и async/await и показываете посетителю состояния «загрузка» и
    «ошибка».
  minutes: 30
  teaches:
  - js-async
  - js-fetch
  - js-json
  - js-error-handling
  requires:
  - js-events
  - net-http-request-response
  diagram: 'content/diagrams/AsyncTimeline.svelte: «Пока ждём ответ»'
  practice: 'Список с сервера и заявка без перезагрузки. Подключите страницу к «серверу». 1) Вставьте из урока блок
    имитации сервера (fieldset и скрипт с пометкой data-scaffold) перед своим скриптом: песочница не пускает настоящие
    запросы, и этот блок подменяет fetch. 2) В разметку добавьте: в секцию #offer абзац <p id="status" role="status"> и
    скрытую кнопку <button type="button" id="retry" hidden>Повторить</button>; форме заявки дайте id="request-form", а в
    конец формы абзац <p id="form-status" role="status">. 3) Четвёртый скрипт <script type="module" id="fetch-code">.
    Функция loadItems (async) запрашивает fetch("/items.json"), проверяет response.ok, читает response.json(), собирает
    карточки через createElement и textContent и кладёт их в .cards (replaceChildren). Показывайте «Загружаем…» в
    #status и убирайте индикатор в любом исходе (finally), при сбое покажите понятное сообщение, оставьте прежние
    карточки и покажите кнопку «Повторить». 4) На форме заявки: слушатель submit с preventDefault, на время отправки
    блокируйте кнопку (disabled), отправляйте fetch("/zayavka", { method: "POST", body: new FormData(form) }) и пишите
    результат в #form-status, а после отправки снова включайте кнопку. Проверки читают разметку и текст скрипта;
    переключайте «связь» в имитации и смотрите на свою страницу в каждом случае. Эпоха: 4. Продолжает шаг
    js-events-menu-search.'
  checks:
  - Не вижу блок имитации сервера (fieldset id="net-sim" с радиокнопками). Скопируйте его из урока в страницу.
  - 'В секции #offer нужен абзац <p id="status" role="status">: дикторы сообщат посетителю, что список загружается.'
  - Нужна кнопка <button type="button" id="retry" hidden>Повторить</button>.
  - В форме нужен абзац <p id="form-status" role="status">, и сама форма должна иметь id="request-form".
  - 'У формы должно остаться action="/zayavka": без скрипта она отправляется обычным способом.'
  - 'Не нашёл четвёртый скрипт: <script type="module" id="fetch-code">.'
  - У скрипта нужен атрибут type="module".
  - Функция загрузки должна быть async, а внутри ждать ответ через await.
  - Не вижу запроса fetch("/items.json").
  - 'После fetch проверьте response.ok: ответ 404 или 500 тоже приходит как обычный.'
  - Данные читаются командой await response.json().
  - 'Запрос должен быть в блоке try { … } catch (error) { … }: так вы поймаете сбой сети.'
  - 'Индикатор загрузки надо убирать в блоке finally { … }: он сработает и при успехе, и при сбое.'
  - 'Карточки из данных собирайте так: createElement, textContent и cardsBox.replaceChildren(...cards).'
  - 'Уберите innerHTML и подобное: данные сервера тоже чужие, пишите их через textContent.'
  - 'Кнопке «Повторить» нужен обработчик: retry.addEventListener("click", loadItems).'
  - В обработчике отправки формы нужен event.preventDefault().
  - 'Заявку отправляют методом POST: fetch("/zayavka", { method: "POST", … }).'
  - 'Тело запроса берите из формы: body: new FormData(form).'
  - Кнопку надо блокировать на время отправки (button.disabled = true) и включать снова после ответа (disabled = false,
    лучше в finally).
  sources:
  - title: Использование Fetch (MDN)
    url: https://developer.mozilla.org/ru/docs/Web/API/Fetch_API/Using_Fetch
    licence: CC-BY-SA
    kind: docs
    lang: ru
  - title: Работа с JSON (MDN)
    url: https://developer.mozilla.org/ru/docs/Learn_web_development/Core/Scripting/JSON
    licence: CC-BY-SA
    kind: docs
    lang: ru
  - title: Асинхронный JavaScript (MDN)
    url: https://developer.mozilla.org/ru/docs/Learn_web_development/Extensions/Async_JS
    licence: CC-BY-SA
    kind: docs
    lang: ru
  - title: Промисы, async/await (learn.javascript.ru)
    url: https://learn.javascript.ru/async
    licence: link-only
