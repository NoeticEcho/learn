lessons:
- id: 05-javascript/01-values-functions
  order: 1
  title: Значения, функции, массивы и объекты
  summary: 'HTML и CSS ничего не решают: решает JavaScript. После урока вы читаете и пишете короткие программы: храните
    пункты вашего списка в массиве объектов, превращаете их функциями в другие данные и знаете, чем отличаются тип,
    переменная и область видимости.'
  minutes: 25
  teaches:
  - js-values-and-types
  - js-functions
  - js-arrays-and-objects
  requires:
  - html-document-structure
  - net-rendering-pipeline
  diagram: 'content/diagrams/ValueLab.svelte: «Значения и конвейер»'
  practice: 'Первая программа на вашем сайте: сводка по списку. Добавьте на страницу первый скрипт. 1) В подвале (footer)
    поставьте пустой абзац с id="summary". 2) В конец body, перед закрывающим тегом, вставьте тег <script type="module"
    id="my-code">. Внутри запишите данные вашего списка массивом объектов: const items = [{ title: "…", price: "…" },
    …], с вашими пунктами из брифа (не пишите var). 3) Напишите три функции: titlesOf(list) возвращает массив названий
    через map, withPrice(list) оставляет пункты с указанной ценой через filter, countOf(list) возвращает количество.
    Исходный массив менять нельзя: никаких push, sort и splice. 4) Составьте строку-сводку и покажите её в двух местах:
    console.log(summary) и document.querySelector("#summary").textContent = summary. Проверки читают текст вашего
    скрипта; что он делает, вы видите сами: сводка появится в подвале предпросмотра. Эпоха: 4. Продолжает шаг
    responsive-page.'
  checks:
  - 'В подвале нужен абзац с id="summary": <p id="summary"></p>. Скрипт будет писать сводку в него.'
  - Не нашёл тег <script type="module" id="my-code">. Он должен стоять в странице, ближе к концу body.
  - 'У тега script нужен атрибут type="module": <script type="module" id="my-code">. Так скрипт выполняется после
    разбора страницы и живёт в собственной области видимости.'
  - 'Данные должны быть массивом объектов: const items = [{ title: "…", price: "…" }, …]. Проверьте, что это const или
    let и что внутри квадратных скобок сразу идёт фигурная.'
  - 'В массиве должны быть ваши пункты из брифа: хотя бы два названия записаны в скрипте так же, как в брифе.'
  - В скрипте не должно быть var. Замените его на const (если значение не меняется) или let.
  - 'Для названий нужен метод map: list.map((item) => item.title).'
  - 'Для отбора нужен метод filter: list.filter((item) => item.price !== "").'
  - 'Для подсчёта нужно свойство length: list.length.'
  - 'Исходный массив менять нельзя. Уберите push, pop, shift, unshift, splice, sort и reverse: map и filter и так
    создают новые массивы.'
  - 'Нужны три функции с этими именами: titlesOf, withPrice и countOf.'
  - 'Не нашёл console.log(...). Выведите сводку в консоль: console.log(summary).'
  - 'Сводку надо ещё и показать на странице: document.querySelector("#summary").textContent = summary.'
  sources:
  - title: Руководство по JavaScript (MDN)
    url: https://developer.mozilla.org/ru/docs/Web/JavaScript/Guide
    licence: CC-BY-SA
    kind: docs
    lang: ru
