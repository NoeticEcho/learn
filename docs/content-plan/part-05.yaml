- id: 05-js/02-dom
  order: 2
  title: 'DOM: страница как дерево, которое можно менять'
  summary: 'Зачем: вы находите элементы страницы, читаете и меняете их текст, атрибуты и классы и создаёте новые из данных.
    После урока вы построите список карточек из массива items одной функцией и поймёте, почему innerHTML с чужим текстом опасен.'
  minutes: 25
  teaches:
  - js.dom
  requires:
  - js.arrays-and-objects
  - html.semantic-elements
  diagram: 'Двухпанельный просмотр: код HTML и дерево DOM; запрос querySelector подсвечивает найденные узлы, создание элемента
    показывает, как он вставляется в дерево, а вставка строки через innerHTML и через textContent показана рядом.'
  practice: 'Эпоха 4 (2014): вывести items брифа в секцию страницы функцией render(items), создающей карточки через createElement
    и textContent; добавить счётчик показанных пунктов.'
  checks:
  - Секция страницы наполняется из массива items кодом, а не набрана вручную.
  - Текст из данных вставляется через textContent или аналог, а не через innerHTML.
  - Если items пуст, пользователь видит понятное сообщение.
  - Карточки остаются размеченными семантическими тегами (список или article), а не набором div.
  sources:
  - title: 'MDN: Введение в DOM'
    url: https://developer.mozilla.org/ru/docs/Web/API/Document_Object_Model/Introduction
    licence: CC-BY-SA
    kind: docs
    lang: ru
