- id: 05-javascript/05-modules-tooling
  order: 5
  title: Модули, npm и сборка
  summary: Один длинный скрипт быстро превращается в кашу. После урока вы разбиваете код на файлы с помощью модулей ES,
    читаете package.json, понимаете, что делает сборщик и зачем беречь зависимости.
  minutes: 25
  teaches:
  - js-modules
  - js-tooling
  requires:
  - js-fetch
  - net-url-anatomy
  diagram: 'content/diagrams/ModuleGraph.svelte: «Граф модулей и сборка»'
  practice: 'Разложите код вашего сайта на модули. Песочница не умеет подключать несколько файлов, поэтому модули вы
    напишете текстом, в блоках pre, как если бы они лежали в файлах. Заполните все «…» в блоке «Модули страницы». 1)
    data.js: export const items = […], с вашими пунктами из брифа (название, текст, цена). 2) render.js: импортируйте
    items из ./data.js (расширение .js обязательно) и экспортируйте функцию renderCards(container), которая строит
    карточки через createElement и textContent. 3) main.js: импортируйте items и renderCards и вызовите их. 4)
    package.json: name и "type": "module". 5) В абзаце «Внешние пакеты» напишите, какие внешние пакеты нужны и сколько
    они весят, или что они не нужны. Внутри pre знак < пишется как &lt;. Проверять модули придётся у себя: сохраните
    файлы, запустите локальный сервер (в уроке написано, как). Эпоха: 5.'
  checks:
  - 'Блок «Модули страницы» (section id="modules") пропал. Верните его: в нём вы пишете модули.'
  - В блоке модулей ещё остались многоточия «…». Замените каждое кодом или текстом.
  - 'В data.js данные надо отдать другим файлам: export const items = […].'
  - 'В data.js должны быть ваши пункты из брифа: хотя бы два названия записаны так же, как в брифе.'
  - 'В render.js первой строкой нужен импорт: import { items } from "./data.js". Расширение .js обязательно.'
  - 'render.js должен экспортировать функцию: export function renderCards(container) { … }.'
  - В renderCards карточки строят через createElement и textContent. innerHTML для данных не нужен.
  - 'В main.js нужны два импорта: из "./render.js" и из "./data.js".'
  - 'main.js должен вызвать функцию: renderCards(…).'
  - 'В package.json нужно имя: "name": "moy-sait".'
  - 'В package.json нужно "type": "module": так Node и сборщики понимают, что файлы это модули.'
  - В абзаце «Внешние пакеты» напишите, что пакеты не нужны, или назовите их и укажите вес в килобайтах.
