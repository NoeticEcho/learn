- id: 05-js/07-svelte-component
  order: 7
  title: Компонент на Svelte
  summary: 'Зачем: вы пишете свой первый компонент: карточку с состоянием и событием, и используете его в списке. После урока
    вы читаете файл .svelte, понимаете руны $state, $derived и $props и можете перенести блок страницы брифа в компонент.'
  minutes: 30
  teaches:
  - js.svelte-component
  requires:
  - js.reactivity
  - js.modules
  - design.component
  diagram: 'Живой редактор Svelte: слева код компонента, справа результат; под ним панель «что обновится», где видно, какой
    узел DOM пересчитался при изменении $state.'
  practice: 'Эпоха 5 (2019, статический сайт): превратить секцию items брифа в компонент ItemCard и список ItemList с фильтром
    по категориям; собрать страницу с помощью SvelteKit или Vite и сравнить размер с ручной версией.'
  checks:
  - Карточка items — отдельный компонент, получающий данные через props.
  - Фильтр хранится в $state, а список — в $derived от него.
  - Страница работает и при отключённом JavaScript хотя бы как список без фильтра, либо явно отмечено, что нет, и почему.
  - Названы размер и время загрузки вручную и в компоненте.
