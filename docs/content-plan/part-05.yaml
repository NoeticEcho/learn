    kind: course
    lang: ru
  videos: []
- id: 05-js/03-events
  order: 3
  title: 'События: реакция на клики, ввод и клавиши'
  summary: 'Зачем: вы делаете страницу интерактивной: открываете меню, проверяете форму, фильтруете список по клику. Вы поймёте,
    как событие всплывает по дереву, зачем делегирование и как не сломать клавиатурное управление.'
  minutes: 25
  teaches:
  - js.events
  requires:
  - js.dom
  - html.forms
  diagram: 'Дерево элементов, по которому летит событие: фазы погружения и всплытия, остановка, preventDefault; ползунок скорости
    и счётчик слушателей при делегировании.'
  practice: 'Эпоха 4 (2014): добавить фильтр по категориям для items и переключаемое меню sections; всё должно работать с
    клавиатуры (Tab, Enter, Esc) и оставаться доступным без мыши.'
  checks:
  - Фильтр меняет показанные пункты items без перезагрузки страницы.
  - Меню sections управляется кнопкой с aria-expanded, а не ссылкой-заглушкой.
  - Все действия доступны с клавиатуры и показывают видимый фокус.
  - Обработчики навешены на общий родитель (делегирование), а не на каждую карточку отдельно.
  sources:
  - title: 'MDN: Введение в события'
    url: https://developer.mozilla.org/ru/docs/Learn_web_development/Core/Scripting/Events
    licence: CC-BY-SA
    kind: docs
    lang: ru
