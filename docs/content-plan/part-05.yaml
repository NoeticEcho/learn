- id: 05-js/04-async-fetch-json
  order: 4
  title: Асинхронность, fetch и JSON
  summary: 'Зачем: вы получаете данные с сервера без перезагрузки страницы и показываете их, вместе с состояниями «загрузка»
    и «ошибка». После урока вы читаете и пишете JSON, понимаете промисы и async/await и видите в панели «Сеть» свой запрос.'
  minutes: 30
  teaches:
  - js.async
  - js.fetch
  - js.json
  - js.error-handling
  requires:
  - js.events
  - net.http-request-response
  diagram: 'Диаграмма времени: основной поток, очередь событий и запрос на сервер; кнопка «ответ идёт 3 секунды» показывает,
    что страница не зависает, а промис переходит из pending в fulfilled или rejected.'
  practice: 'Эпоха 4 (2014): вынести items брифа в файл items.json, загрузить его через fetch при открытии страницы, показать
    состояния загрузки и ошибки, а для контактов (contacts) отправить форму обратной связи через fetch на тестовый адрес.'
  checks:
  - Данные items загружаются из JSON-файла, а не лежат в коде.
  - При ошибке сети или статусе вне 200–299 пользователь видит понятное сообщение и может повторить попытку.
  - Во время загрузки показывается индикатор, а потом он убирается в любом исходе.
  - Форма обратной связи не отправляется дважды при повторном клике и сообщает результат экранному диктору (aria-live).
  sources:
  - title: 'MDN: Использование Fetch'
    url: https://developer.mozilla.org/ru/docs/Web/API/Fetch_API/Using_Fetch
    licence: CC-BY-SA
    kind: docs
    lang: ru
  - title: 'MDN: Работа с JSON'
    url: https://developer.mozilla.org/ru/docs/Learn_web_development/Core/Scripting/JSON
    licence: CC-BY-SA
    kind: docs
    lang: ru
  - title: 'MDN: Асинхронный JavaScript'
    url: https://developer.mozilla.org/ru/docs/Learn_web_development/Extensions/Async_JS
    licence: CC-BY-SA
    kind: docs
    lang: ru
