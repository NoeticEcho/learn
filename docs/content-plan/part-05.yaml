- id: 05-js/06-why-frameworks
  order: 6
  title: Зачем нужны фреймворки
  summary: 'Зачем: вы видите, на каких задачах ручной код с DOM начинает ломаться (синхронизация данных и экрана, повторяющиеся
    компоненты, состояние), и как фреймворки (React, Vue, Svelte, Angular) решают их. После урока вы можете спокойно ответить
    «а нужен ли мне фреймворк вообще».'
  minutes: 25
  teaches:
  - js.why-frameworks
  - js.reactivity
  requires:
  - js.dom
  - js.events
  - js.modules
  diagram: 'Один и тот же список с фильтром и счётчиком, написанный тремя способами: ручной DOM, шаблонные строки и реактивный
    компонент; ползунок «число правил в проекте» показывает, где растёт число ошибок синхронизации.'
  practice: 'Эпоха 5 (2019): из текущей страницы брифа выбрать три места, где состояние (выбранная категория, число пунктов,
    раскрытое меню) приходится синхронизировать вручную, и записать, что в каждом было бы проще при реактивном подходе.'
  checks:
  - Названы минимум три места, где состояние и вид страницы надо согласовывать вручную.
  - Для каждого места указано, что изменилось бы при реактивном подходе.
  - 'Есть вывод для проекта: нужен фреймворк или нет, с учётом sections и items брифа.'
  - Упомянут вес JavaScript и влияние на скорость первой загрузки.
