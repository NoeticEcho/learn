- id: 05-js/05-modules-tooling
  order: 5
  title: Модули, npm и сборка
  summary: 'Зачем: вы разбиваете код на файлы с помощью модулей ES, подключаете чужие пакеты через npm и понимаете, что
    делают сборщик и «бандл». После урока вы читаете package.json и объясняете, почему нужно беречь зависимости.'
  minutes: 25
  teaches:
  - js.modules
  - js.tooling
  requires:
  - js.fetch
  - net.url-anatomy
  diagram: 'Граф зависимостей проекта: файлы-узлы, стрелки import; кнопка «собрать» превращает граф в один файл,
    показывает размер до и после минификации и отмечает неиспользуемый код (tree shaking).'
  practice: 'Эпоха 5 (2019, генератор статического сайта): разложить код страницы брифа на модули (данные items, функция
    render, форма contacts), подключить их через type=module и убедиться, что страница работает без сборки.'
  checks:
  - Код разбит минимум на три файла-модуля, связанных import и export.
  - Скрипт подключён с type=module, и страница работает при открытии через локальный сервер.
  - Данные брифа (items, contacts) лежат в отдельном модуле или JSON, а не внутри функций отрисовки.
  - Указано, какие внешние пакеты нужны и сколько они весят, или написано, что не нужны.
