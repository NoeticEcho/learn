- id: 05-javascript/08-progressive-enhancement
  order: 8
  title: Прогрессивное улучшение
  summary: 'Скрипт не всегда доезжает до посетителя: слабая сеть, сбой, блокировщик, старый браузер. После урока вы
    строите страницу так, чтобы главное работало и без JavaScript, а скрипт делал её лучше, и проверяете это с
    выключенным скриптом.'
  minutes: 20
  teaches:
  - js-progressive-enhancement
  requires:
  - js-fetch
  - js-events
  - html-forms
  diagram: 'content/diagrams/EnhanceMatrix.svelte: «Что остаётся без скрипта»'
  practice: 'Страница, которая работает и без скрипта. Сделайте страницу устойчивой. 1) Заполните таблицу «Что
    обязательно, а что улучшение»: не меньше пяти функций, у каждой слово «обязательная» или «улучшение» и что видит
    посетитель без JavaScript. 2) Сделайте обязательное независимым от скрипта: добавьте блок <aside id="contacts"> с
    адресом из брифа и ссылками tel: и mailto: (телефон и почта из брифа), а после шапки вставьте <noscript> с абзацем,
    что страница работает и без JavaScript. Форма заявки остаётся с action и method, а главное действие подписано
    словами из брифа. 3) Поиск без скрипта бесполезен, поэтому скройте его в разметке (атрибут hidden у form#search), а
    показывать будет скрипт. 4) Добавьте пятый скрипт <script type="module" id="enhance-code">: он показывает форму
    поиска (search.hidden = false) и проверяет телефон на лету: слушатель input на поле #f-phone, aria-invalid и
    сообщение в <span id="phone-hint" role="status"> после поля. Оба действия обёрнуты в проверку «элемент есть» (if).
    Проверьте без скрипта: у себя, в инструментах разработчика, выключите JavaScript и обновите страницу. Эпоха: 5.'
  checks:
  - Блок «Что обязательно, а что улучшение» (section id="enhancement-plan") пропал. Верните его.
  - В таблице остались многоточия «…». Заполните каждую клетку.
  - В таблице нужно не меньше пяти строк с классом feature.
  - 'Во второй колонке должны встречаться оба слова: «обязательная» и «улучшение»: вы делите функции на два класса.'
  - В main нужен блок <aside id="contacts"> с контактами.
  - 'Телефон должен быть ссылкой: <a href="tel:+7…">.'
  - 'Почта должна быть ссылкой: <a href="mailto:…">.'
  - Адрес из брифа должен быть показан в блоке контактов.
  - 'Добавьте <noscript> с абзацем: что страница работает и без JavaScript.'
  - 'Главное действие должно быть подписано словами из брифа: на ссылке-кнопке или на кнопке формы.'
  - 'У формы должен остаться method="post": без скрипта она отправляется обычным способом.'
  - У формы должен остаться action с адресом, начинающимся с «/».
  - 'Форму поиска надо скрыть в разметке: <form id="search" … hidden>. Показывать её будет скрипт.'
  - 'После поля телефона нужен <span id="phone-hint" role="status">: туда скрипт пишет подсказку.'
  - 'Не нашёл пятый скрипт: <script type="module" id="enhance-code">.'
  - У скрипта нужен атрибут type="module".
  - 'Скрипт должен показать форму поиска: search.hidden = false, где search это document.querySelector("#search").'
  - Для проверки на лету нужен слушатель input на поле телефона и атрибут aria-invalid.
  - 'Обернуть действия в проверку «элемент есть»: if (search) { … } и if (phone && hint) { … }. Если элемента нет,
    скрипт молча пропускает улучшение.'
  sources:
