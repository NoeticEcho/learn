- id: 05-javascript/06-why-frameworks
  order: 6
  title: Зачем нужны фреймворки
  summary: Ручной код с DOM работает, пока на странице немного мест, которые надо согласовывать. После урока вы видите,
    где он начинает ломаться, понимаете, что решают React, Vue, Svelte и Angular и чего это стоит посетителю, и можете
    спокойно ответить «а нужен ли мне фреймворк вообще».
  minutes: 25
  teaches:
  - js-why-frameworks
  - js-reactivity
  requires:
  - js-dom
  - js-events
  - js-modules
  diagram: 'content/diagrams/SyncDemo.svelte: «Где растёт сложность»'
  practice: 'Нужен ли фреймворку вашему проекту: разбор своей страницы. Найдите на странице три места, где вид и состояние
    приходится согласовывать вручную (в скриптах выше они есть: счётчик, быстрый переход, меню, поиск), и заполните
    таблицу «Где страница согласуется вручную»: что с чем согласуется, как это сделано сейчас и как было бы при
    реактивном подходе. Каждая клетка это живая фраза, а не «…». Затем напишите вывод для вашего проекта (абзац
    «Вывод»): нужен ли ему фреймворк или не нужен, с учётом числа разделов и пунктов из брифа (запишите эти числа). И в
    последнем абзаце назовите вес ваших скриптов в килобайтах (приблизительно, по вкладке «Сеть» или по размеру файла) и
    то, как он влияет на первую загрузку. Эпоха: 5.'
  checks:
  - Блок «Где страница согласуется вручную» (section id="framework-notes") пропал. Верните его.
  - В таблице и в абзацах осталось многоточие «…». Замените каждое осмысленной фразой.
  - 'В таблице нужно не меньше трёх строк с классом sync: три места ручного согласования.'
  - 'В выводе нужно прямо сказать: «нужен» или «не нужен» фреймворк вашему проекту.'
  - 'Вывод должен опираться на числа из брифа: сколько разделов, сколько пунктов, сколько мест согласования.'
  - 'Назовите вес ваших скриптов числом и единицей: например «около 6 кБ».'
  - Напишите, как вес скриптов влияет на первую загрузку страницы, особенно на телефоне.
  sources:
