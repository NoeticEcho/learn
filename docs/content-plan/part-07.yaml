lessons:
- id: 07-data/01-what-is-a-database
  order: 1
  title: Что такое база данных и зачем она сайту
  definition: База данных — упорядоченное хранилище под присмотром программы-сторожа, СУБД. Реляционная база хранит данные в таблицах,
    связанных ключами.
  summary: 'Вы поймёте, чем база данных лучше файла и таблицы Excel, и разберёте данные своего проекта на сущности и связи. После урока
    у вас есть схема данных вашего брифа: что хранить, под каким ключом и какие поля считаются персональными данными.'
  minutes: 20
  teaches:
  - data.what-is-database
  - data.relational-model
  requires:
  - server.static-vs-dynamic
  - js.json
  diagram: 'FileVsDatabase: «Двое правят одно и то же» (part 7, lesson 1). The same two edits twice: once in a plain file, once in a
    database. Step by step, the person sees the file lose an edit (both editors read the old value) and the database make the second
    editor wait for the first. The numbers are invented; the item''s name comes from the person''s own brief.'
  practice: 'Заполните таблицу схемы данных. Первая строка (услуги из items) уже готова как образец. Допишите три остальных: люди (people),
    подтверждения (proofs) и заявки (то, что посетитель отправляет через форму). В каждой строке: название сущности, ключ (уникальное
    поле, обычно id), поля через запятую, связь с другой сущностью (например «ссылается на услугу») и отметка, есть ли там персональные
    данные («да» или «нет» с пояснением). Заявку делайте отдельной сущностью, а не полем чужой. Если в вашем проекте нет людей или подтверждений,
    напишите в строке, что сущность не нужна, и объясните почему. Все «…» нужно заменить. Эпоха: 3.'
  checks:
  - Блока со схемой не видно. Он был в странице, не удаляйте его.
  - Где-то осталось многоточие «…». Замените его своим текстом.
  - 'Нужны не меньше четырёх строк с классом entity: услуги, люди, подтверждения и заявки.'
  - У каждой сущности должна быть ячейка td.key с ключом.
  - 'В ключе напишите id: так называют уникальный номер строки.'
  - 'В полях заявки не видно контактов посетителя. Напишите, что именно он оставляет: имя, телефон, почту.'
  - 'Не видно связей. Напишите, с чем сущность связана: например «ссылается на услугу (item_id)».'
  - Имя и телефон посетителя это персональные данные. В ячейке заявки начните с «да».
  sources:
  - title: 'PostgreSQL Documentation: Tutorial'
    url: https://www.postgresql.org/docs/current/tutorial.html
    licence: proprietary-link
    kind: docs
    lang: en
  - title: 'Postgres Pro: учебник PostgreSQL на русском'
