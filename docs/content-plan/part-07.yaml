# Regenerated from the written lessons (28.10.2026). Changes against the draft:
# - The app has no SQL engine yet (the draft assumed PGlite in `lib/sql`), so the SQL lessons run a teaching interpreter, `content/diagrams/sqlmini.ts`
#   (CREATE TABLE and INDEX, INSERT, SELECT with JOIN, GROUP BY and HAVING, UPDATE, DELETE, BEGIN/COMMIT/ROLLBACK, EXPLAIN as a simplified model).
#   It is written to be honest about itself: every lesson and diagram says it is not PostgreSQL, and links PGlite for the real thing. The practice
#   page embeds it as a data-scaffold module, so the learner's own queries run against tables built from their brief. The checks read the text of the SQL.
# - Lesson 7 keeps `server.authentication` (taught in part 6) as a requirement. `data.privacy-by-design` exists now: part 10 lesson 6 requires
#   `html-form-validation` only because it did not, and can require the new concept instead.
# - Each lesson's practice is a complete page (the learner's site plus an exercise block marked data-scaffold), so the era's gallery site stays a site.
# - Videos: the draft's list kept for lessons 2, 4, 5, 6 (checked by oEmbed, a title and a channel are what was judged).
part: 7
