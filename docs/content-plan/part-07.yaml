    url: https://postgrespro.ru/docs/postgresql/current/
    licence: proprietary-link
    kind: docs
    lang: ru
  - title: 'SQLite: Appropriate Uses For SQLite'
    url: https://www.sqlite.org/whentouse.html
    licence: PD
    kind: docs
    lang: en
  - title: 'Википедия: Реляционная модель данных'
    url: https://ru.wikipedia.org/wiki/Реляционная_модель_данных
    licence: CC-BY-SA
    kind: article
    lang: ru
  - title: 'CMU 15-445: Introduction to Database Systems'
    url: https://15445.courses.cs.cmu.edu/
    licence: link-only
    kind: course
    lang: en
  videos: []
- id: 07-data/02-sql-basics
  order: 2
  title: 'SQL: читаем и пишем данные (Postgres в браузере)'
  summary: 'Зачем: вы пишете запросы SELECT, INSERT, UPDATE и DELETE на настоящем PostgreSQL, который работает прямо в браузере
    (PGlite), и понимаете, что делает каждое слово запроса. После урока вы получите нужные данные из таблиц своего проекта.'
  minutes: 35
  teaches:
  - data.sql-select
  - data.sql-write
  requires:
  - data.relational-model
  diagram: 'SQL-песочница на PGlite: таблицы слева, запрос в центре, результат справа; подсветка выполнения по шагам FROM
    → WHERE → GROUP BY → SELECT → ORDER BY → LIMIT.'
  practice: 'Эпоха 3 (2010): создать таблицу items по полям брифа, вставить минимум пять строк, написать запросы: все пункты,
    отобранные по условию, отсортированные, посчитанные по категориям; изменить одну запись и удалить другую.'
  checks:
  - Таблица items создана с первичным ключом и типами столбцов, подходящими данным брифа.
  - Запросы возвращают пункты, отобранные по условию, отсортированные и ограниченные LIMIT.
  - Есть запрос с GROUP BY и подсчётом пунктов по категориям.
  - UPDATE и DELETE написаны с условием WHERE; запрос без WHERE отмечен как опасный.
  sources:
