- id: 07-data/07-privacy-by-design
  order: 7
  title: 'Приватность по замыслу: что хранить и где'
  definition: 'Приватность по замыслу — защита данных, заложенная в схему заранее: минимум полей, цель и срок у каждого. По 152-ФЗ данные
    граждан РФ хранят в базах в России.'
  summary: 'Вы закладываете защиту данных в схему базы, а не прикручиваете её потом: собираете минимум, ставите сроки хранения, отделяете
    персональное и записываете согласие как факт. После урока вы знаете главное из 152-ФЗ (включая хранение данных граждан РФ на серверах
    в России) и можете перечислить, какие данные вашего проекта под него подпадают.'
  minutes: 30
  teaches:
  - data.privacy-by-design
  - data.data-localisation
  requires:
  - data.transaction
  - data.sql-write
  - server.authentication
  diagram: 'DataRegister: «Реестр данных» (part 7, lesson 7). Nine candidate fields of a request form (the purpose is the person''s
    own main action). The person switches each on or off and sees what they would be holding: how many fields, how many are personal
    data, special categories, high-risk, and which collected fields the purpose does not need. A retention slider and a place of storage
    show the two other questions of a data register. The classification is the lesson''s teaching simplification, not legal advice.'
  practice: 'В странице таблица реестра данных и поле для SQL. 1) Для каждой из четырёх строк (имя, телефон, комментарий, данные людей
    с сайта) заполните шесть ячеек: зачем, где хранятся, срок и условие удаления (например «3 года после заявки, затем удаляется»),
    кто имеет доступ и персональные ли данные («да» или «нет» с пояснением). 2) Укажите поле, которое вы решили не собирать, хотя хотелось
    (дата рождения, паспорт, электронная почта), и почему. 3) Скажите, где первичная запись данных посетителей (для граждан РФ на сервере
    в России) и что с зарубежными копиями. 4) Скажите, как персональные данные отделены от остальных (например, отдельная таблица заявок).
    5) В поле SQL создайте таблицу consents: согласие хранится с датой, версией текста и целью, и ссылается на заявку. Все «…» нужно
    заменить. Это учебный черновик, а не юридический документ. Эпоха: 6.'
  checks:
  - Блок с реестром исчез. Он был в странице, верните его.
  - Где-то осталось многоточие «…». Замените его своим текстом.
  - В реестре должно остаться не меньше четырёх строк.
  - В колонке «Зачем» не видно цели. Начните со слов «чтобы…».
  - 'В сроке нужно число: например, «3 года» или «6 месяцев».'
  - 'К сроку допишите, что произойдёт потом: данные удаляются или обезличиваются.'
  - 'Скажите, кто имеет доступ: например «владелец через админку».'
  - Имя и телефон это персональные данные. В последней колонке начните с «да».
  - Назовите поле, которое вы не стали собирать, и объясните, почему оно не нужно для цели.
  - Скажите, что первичная запись данных идёт в базу на сервере в России, и что с копиями за рубежом.
  - Скажите, как персональные данные отделены от остальных, например отдельной таблицей заявок.
  - 'Таблица согласий называется consents: CREATE TABLE consents (…).'
  - 'Согласию нужна дата: столбец given_at типа timestamp.'
  - 'Согласию нужна версия текста: столбец text_version.'
  - 'Согласию нужна цель: столбец purpose.'
  - 'Согласие должно ссылаться на заявку: request_id integer REFERENCES requests(id).'
  sources:
