- id: 07-data/05-nosql
  order: 5
  title: 'Документные, ключ-значение и графовые базы: когда и когда не стоит'
  definition: 'NoSQL — базы не на таблицах: документные (MongoDB), ключ-значение (Redis) и графовые (Neo4j). У каждой своя задача, а
    по умолчанию хватает реляционной.'
  summary: Вы понимаете, какую задачу решает каждая «не-реляционная» база (MongoDB, Redis, Neo4j) и когда хватает реляционной. После
    урока вы выбираете хранилище под каждую функцию своего проекта и не гонитесь за модой.
  minutes: 25
  teaches:
  - data.document-db
  - data.key-value
  - data.graph-db
  - data.choose-database
  requires:
  - data.relational-model
  - data.index
  diagram: 'DataShapes: «Одни данные, четыре формы» (part 7, lesson 5). The person''s own services and people shown as tables, as a
    JSON document, as key-value pairs and as a graph, with a question picker: for each question the diagram says whether that shape
    answers it naturally, possibly, or awkwardly, and why. The ratings are the lesson''s judgement, not a benchmark. Sessions and counters
    are invented.'
  practice: 'В таблице пять функций вашего проекта. Для каждой допишите три ячейки: тип хранилища (реляционная база, документная, ключ-значение,
    графовая или файл), почему так, и чем вы за это платите (например: нет связей, нет транзакций, ещё один сервер, данные в памяти).
    Если для функции хватает одной реляционной базы, так и напишите, и не ищите другую. Ниже ответьте, где лежат данные и кто может
    их читать, и где вы выбрали реляционную базу, хотя соблазн был другой. Все «…» нужно заменить. Эпоха: 6.'
  checks:
  - Блок с таблицей решения исчез. Он был в странице, верните его.
  - Где-то осталось многоточие «…». Замените его своим текстом.
  - Нужны пять строк с функциями. Не удаляйте строки таблицы.
  - 'В колонке «Тип хранилища» нужно назвать тип: реляционная база, документная, ключ-значение, графовая или файл.'
  - Ни разу не выбрана реляционная база. Для связанных данных проекта она почти всегда подходит.
  - 'Объясните выбор развёрнуто: хотя бы несколько слов в каждой строке колонки «Почему».'
  - В колонке «Чем платим» ничего не сказано про цену. Напишите, чего хранилищу не хватает или что оно требует.
  - Скажите, где лежат данные (на каком сервере, в какой стране) и кто может их читать.
  - Назовите случай, где выбрали реляционную базу, и объясните, чем её выбор лучше соблазнительного.
