    url: https://www.youtube.com/watch?v=5sG9kmXYsKU
    lang: ru
- id: 07-data/03-joins-normalization
  order: 3
  title: 'Связи между таблицами: JOIN и нормализация'
  summary: 'Зачем: вы разносите данные по таблицам так, чтобы каждый факт хранился один раз, и собираете их обратно соединениями.
    После урока вы читаете запрос с JOIN, понимаете, чем INNER отличается от LEFT, и видите, где нормализация мешает и когда
    её нарушают намеренно.'
  minutes: 30
  teaches:
  - data.sql-join
  - data.normalization
  requires:
  - data.sql-select
  diagram: 'Диаграммы JOIN на живых таблицах: перетаскиваешь строки, видишь, какие попадают в INNER, LEFT, RIGHT; рядом таблица
    с дублями данных и пошаговое приведение к 1НФ, 2НФ, 3НФ.'
  practice: 'Эпоха 3 (2010): добавить в БД проекта таблицы categories и people (из брифа) и связи между ними и items; написать
    запрос, показывающий пункты вместе с категорией и ответственным человеком, и запрос по пунктам без категории.'
  checks:
  - Категория и человек хранятся отдельными таблицами и связаны внешними ключами с items.
  - Один JOIN выводит пункты вместе с названием категории, а LEFT JOIN находит пункты без категории.
  - В схеме нет повторяющихся строк-значений (например, названия категории в каждой строке).
  - Указан случай, где данные намеренно продублированы для скорости, и сказано почему.
  sources:
  - title: 'PostgreSQL: Joins Between Tables'
    url: https://www.postgresql.org/docs/current/tutorial-join.html
    licence: proprietary-link
    kind: docs
    lang: en
  - title: 'PostgreSQL: Foreign Keys'
    url: https://www.postgresql.org/docs/current/tutorial-fk.html
    licence: proprietary-link
    kind: docs
    lang: en
  - title: 'SQLBolt: Multi-table queries with JOINs'
    url: https://sqlbolt.com/lesson/select_queries_with_joins
    licence: link-only
    kind: course
    lang: en
  - title: 'Википедия: Нормальная форма'
    url: https://ru.wikipedia.org/wiki/Нормальная_форма
    licence: CC-BY-SA
    kind: article
    lang: ru
  videos: []
- id: 07-data/04-indexes-transactions
  order: 4
  title: Индексы и транзакции
  summary: 'Зачем: вы понимаете, почему запрос медленный и как индекс его ускоряет, и что делает транзакция, когда два человека
    одновременно покупают последний билет. После урока вы читаете EXPLAIN простых запросов и знаете, что значит ACID.'
  minutes: 30
  teaches:
  - data.index
  - data.transaction
  requires:
  - data.sql-join
  - data.sql-write
  diagram: 'Таблица на миллион строк: полный просмотр против поиска по индексу (B-дерево), счётчик прочитанных страниц; вторая
    панель: два клиента, одна запись, с транзакцией и без неё.'
  practice: 'Эпоха 6 (2022): для запроса по items брифа (поиск по категории и сортировка по дате) сгенерировать тысячу строк,
    измерить время до и после индекса и оформить заявку из contacts транзакцией из двух шагов (заявка и уведомление).'
  checks:
  - Время запроса измерено до и после индекса, и индекс создан по тем столбцам, которые участвуют в условии.
  - В выводе EXPLAIN показано различие просмотра всей таблицы и использования индекса.
  - 'Заявка и её уведомление записываются одной транзакцией: при сбое откатываются обе записи.'
  - Объяснено, какую цену платит запись за каждый лишний индекс.
  sources:
  - title: 'PostgreSQL: Indexes'
    url: https://www.postgresql.org/docs/current/indexes.html
    licence: proprietary-link
    kind: docs
    lang: en
  - title: 'PostgreSQL: Transactions (tutorial)'
    url: https://www.postgresql.org/docs/current/tutorial-transactions.html
    licence: proprietary-link
    kind: docs
    lang: en
  - title: Use The Index, Luke!
    url: https://use-the-index-luke.com/
    licence: link-only
    kind: book
    lang: en
  - title: 'Postgres Pro: Индексы'
    url: https://postgrespro.ru/docs/postgresql/current/indexes
    licence: proprietary-link
    kind: docs
    lang: ru
  - title: 'PostgreSQL: Using EXPLAIN'
    url: https://www.postgresql.org/docs/current/using-explain.html
    licence: proprietary-link
    kind: docs
    lang: en
  videos:
  - title: Что такое SQL-индексы за 10 минут
    url: https://www.youtube.com/watch?v=LpEwssOYRKA
    lang: ru
- id: 07-data/05-nosql
  order: 5
  title: 'Документные, ключ-значение и графовые базы: когда, а когда не стоит'
  summary: 'Зачем: вы понимаете, какую задачу решает каждая «не-реляционная» база (MongoDB, Redis, Neo4j) и когда реляционной
    достаточно. После урока вы можете выбрать модель данных под функцию проекта и не гнаться за модой.'
  minutes: 25
  teaches:
  - data.document-db
  - data.key-value
  - data.graph-db
  - data.choose-database
  requires:
  - data.relational-model
  - data.index
  diagram: 'Одни и те же данные брифа в четырёх представлениях: таблицы, документ JSON, пары ключ-значение, граф; для запросов
    («все пункты категории», «кто связан с кем», «сессия по токену») подсвечивается, где ответ быстрее.'
  practice: 'Эпоха 6 (2022, headless): для каждой функции проекта из брифа (каталог items, сессии, связи people между собой,
    быстрый счётчик посетителей) выбрать тип базы или обосновать, что хватит одной реляционной.'
  checks:
  - Для каждой названной функции указан тип хранилища и причина.
  - Минимум в одном случае выбрана реляционная база там, где соблазнял другой вариант, и это объяснено.
  - 'Названа цена: что теряется при выборе нереляционной базы (связи, транзакции, привычные инструменты).'
  - Указано, где хранятся данные и кто может их читать.
