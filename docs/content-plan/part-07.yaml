- id: 07-data/04-indexes-transactions
  order: 4
  title: Индексы и транзакции
  definition: Индекс — упорядоченная структура из значений столбца и ссылок на строки, которая ускоряет поиск. Транзакция — группа команд,
    выполняемая целиком или никак.
  summary: Вы понимаете, почему запрос бывает медленным и как индекс его ускоряет, и что делает транзакция, когда сбой случается посреди
    двух записей. После урока вы читаете план запроса, создаёте индекс там, где он нужен, и знаете, что значит ACID.
  minutes: 30
  teaches:
  - data.index
  - data.transaction
  requires:
  - data.sql-join
  - data.sql-write
  diagram: 'IndexAndTransaction: «Индекс и транзакция» (part 7, lesson 4). Two small models, both labelled as models. The first counts
    how many pages the database would read to find a few rows with and without an index (100 rows per page, a tree with 200 children
    per node), for a table size and a share of matching rows the person sets: the index wins on big tables with rare matches and loses
    on small ones or common values, and every extra index adds a write. The second walks one purchase (a seat taken and an order recorded)
    through a crash with and without a transaction. Numbers are invented.'
  practice: 'В странице уже есть таблицы items (2000 строк), requests и notifications. 1) В первом поле спросите план запроса EXPLAIN
    SELECT: пункты категории 7, новые сначала, первые десять (WHERE category_id = 7, ORDER BY day DESC, LIMIT 10). 2) Во втором создайте
    индекс по столбцу из WHERE и снова спросите план. Сколько строк просмотрено до и после, впишите в строку под полем (число из результата).
    3) В третьем поле напишите транзакцию из двух вставок (заявка и уведомление) с BEGIN и COMMIT. 4) В четвёртом сделайте то же, но
    второй вставкой допустите ошибку (например, NULL в text) и COMMIT не пишите. 5) В пятом поле откатите транзакцию и проверьте, что
    заявок не прибавилось. 6) Ответьте, какую цену платит запись за каждый лишний индекс. Все «…» нужно заменить. Эпоха: 6.'
  checks:
  - Блок с запросами исчез. Он был в странице, верните его.
  - Где-то осталось многоточие «…». Замените его своим текстом.
  - В первом поле нужен запрос вида EXPLAIN SELECT * FROM items WHERE category_id = 7 …
  - Индекс создаётся командой CREATE INDEX имя ON items (category_id). Столбец в скобках должен быть тем, что стоит в WHERE.
  - Во втором поле после CREATE INDEX снова напишите EXPLAIN SELECT …, чтобы увидеть разницу.
  - 'В строке «до индекса» нужно число: сколько строк просмотрено, как написано в ответе песочницы.'
  - В строке «после индекса» нужно число из второго плана.
  - 'В третьем поле нужна цепочка: BEGIN, INSERT INTO requests …, INSERT INTO notifications …, COMMIT.'
  - 'В четвёртом поле нужны BEGIN и две вставки, но без COMMIT: транзакция должна остаться открытой после ошибки.'
  - В пятом поле напишите ROLLBACK, а затем SELECT COUNT(*) FROM requests, чтобы проверить, что от сбойной заявки ничего не осталось.
  - 'Скажите, чем плох лишний индекс: запись замедляется, потому что индекс обновляется вместе с таблицей, и он занимает место.'
  sources:
  - title: 'PostgreSQL: Indexes'
    url: https://www.postgresql.org/docs/current/indexes.html
    licence: proprietary-link
    kind: docs
    lang: en
  - title: 'Postgres Pro: Индексы'
