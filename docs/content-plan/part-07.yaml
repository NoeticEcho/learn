    url: https://ru.wikipedia.org/wiki/Реляционная_модель_данных
    licence: CC-BY-SA
    kind: article
    lang: ru
  - title: 'PostgreSQL: Concurrency Control (введение)'
    url: https://www.postgresql.org/docs/current/mvcc-intro.html
    licence: proprietary-link
    kind: docs
    lang: en
