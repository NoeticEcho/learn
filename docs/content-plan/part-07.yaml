- id: 07-data/06-vector-search
  order: 6
  title: 'Поиск: полнотекстовый и векторный'
  definition: Полнотекстовый поиск находит тексты по словам через обратный индекс и основы слов, а векторный — по смыслу, через эмбеддинги
    и ближайших соседей.
  summary: 'Вы понимаете, как сайт ищет по словам и по смыслу: токены, указатель, ранжирование, эмбеддинги и ближайшие соседи. После
    урока вы выберете между поиском внутри Postgres, отдельным движком и векторной базой и поймёте, как ИИ-ответы используют ваши тексты.'
  minutes: 30
  teaches:
  - data.full-text-search
  - data.vector-db
  requires:
  - data.index
  - data.choose-database
  diagram: 'SearchModes: «Поиск по словам и по смыслу» (part 7, lesson 6). Words: the person''s own services searched with a teaching
    stemmer (it cuts common Russian endings; real search engines use fuller dictionaries), showing the tokens, stems and a ranking,
    and what LIKE would do without morphology. Meaning: nine invented questions of visitors on a 2D map whose coordinates were placed
    by hand, because real embeddings have hundreds of dimensions and come from a model; the nearest three to a chosen query are lit,
    beside what a word search would have found.'
  practice: 'В странице работает демо поиска по вашим услугам. 1) Попробуйте в нём запрос в разных формах слова. 2) В таблице выпишите
    три формы одного слова из своих услуг и их основу (основа общая). 3) В поле запроса напишите для PostgreSQL выборку услуг с русской
    полнотекстовой конфигурацией: to_tsvector(''russian'', …) @@ plainto_tsquery(''russian'', …), ts_rank и ORDER BY … DESC. 4) В поле
    индекса создайте GIN-индекс по to_tsvector. 5) Ответьте тремя фразами: когда вам хватит поиска по словам; когда понадобился бы поиск
    по смыслу и какие тексты в него пошли бы; какие тексты ушли бы стороннему сервису и нужно ли согласие. Все «…» нужно заменить. Эпоха:
    6.'
  checks:
  - Блок поиска исчез. Он был в странице, верните его.
  - Где-то осталось многоточие «…». Замените его своим текстом.
  - 'В таблице нужны три строки: форма слова и основа.'
  - 'В запросе нет to_tsvector(''russian'', …): так текст превращается в набор основ для русского языка.'
  - 'Не хватает сравнения: to_tsvector(…) @@ plainto_tsquery(''russian'', ''слово'').'
  - 'Нужен вес найденного: функция ts_rank(…).'
  - 'Результаты надо упорядочить по весу: ORDER BY rank DESC.'
  - 'Индекс создают так: CREATE INDEX имя ON items USING GIN (to_tsvector(''russian'', …)).'
  - Объясните в нескольких словах, когда вам хватит поиска по словам.
  - 'Скажите, когда понадобился бы поиск по смыслу: например, когда посетители пишут вопросы своими словами и слова не совпадают с текстом.'
  - Назовите, какие тексты ушли бы стороннему сервису (провайдеру эмбеддингов).
  - 'Скажите, нужно ли согласие: есть ли в этих текстах персональные данные.'
  sources:
  - title: 'PostgreSQL: Full Text Search'
    url: https://www.postgresql.org/docs/current/textsearch.html
