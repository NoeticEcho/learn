lessons:
- id: 07-data/01-what-is-a-database
  order: 1
  title: Что такое база данных и зачем она сайту
  summary: 'Зачем: вы понимаете, чем база данных лучше файла и таблицы Excel (одновременный доступ, целостность, быстрый поиск,
    права), и разбираете данные своего проекта на «сущности» и связи между ними. После урока вы нарисуете схему данных для
    брифа.'
  minutes: 20
  teaches:
  - data.what-is-database
  - data.relational-model
  requires:
  - server.static-vs-dynamic
  - js.json
  diagram: Один и тот же список заказов в файле JSON, в таблице и в базе; двое «редакторов» одновременно меняют запись, и
    видно, как файл портит данные, а база их сериализует.
  practice: 'Эпоха 3 (2010, WordPress): по полям брифа items, people, proofs и contacts выделить сущности и связи на схеме
    (прямоугольники и стрелки), указать для каждой ключ и несколько полей.'
  checks:
  - На схеме есть минимум три сущности, соответствующие items, people или proofs, и связи между ними.
  - У каждой сущности есть уникальный идентификатор.
  - Заявки из contacts вынесены в отдельную сущность, а не в поле другой.
  - Отмечено, какие поля — персональные данные.
  sources:
  - title: 'PostgreSQL Documentation: Tutorial'
    url: https://www.postgresql.org/docs/current/tutorial.html
    licence: proprietary-link
    kind: docs
    lang: en
