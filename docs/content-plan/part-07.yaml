- id: 07-data/02-sql-basics
  order: 2
  title: 'SQL: читаем и пишем данные'
  definition: 'SQL — декларативный язык запросов к реляционной базе: SELECT читает данные, INSERT добавляет строки, UPDATE и DELETE
    меняют и удаляют их.'
  summary: 'Вы пишете запросы SELECT, INSERT, UPDATE и DELETE и понимаете, что делает каждое слово. После урока вы создаёте таблицу
    своих услуг, добавляете в неё строки и получаете нужные данные: отобранные, упорядоченные и посчитанные.'
  minutes: 35
  teaches:
  - data.sql-select
  - data.sql-write
  requires:
  - data.relational-model
  diagram: 'SqlLab: «Песочница SQL» (part 7, lesson 2). A small table made from the person''s own items (prices are invented) and a
    query box. The query runs in `sqlmini.ts`, a teaching interpreter, NOT PostgreSQL; the lesson says so. Beside the result it shows
    the order a SELECT is carried out in (FROM, WHERE, GROUP BY, SELECT, ORDER BY, LIMIT) with the number of rows left after each step.
    UPDATE and DELETE change the table for real, and «Сбросить таблицу» puts it back.'
  practice: 'В странице шесть полей для запросов. 1) Создайте таблицу items: у каждого «…» впишите тип столбца (для id подойдёт serial
    с PRIMARY KEY, для названия text NOT NULL, для цены integer). 2) Добавьте не меньше пяти строк, каждую в скобках на отдельной строке;
    названия возьмите из своих услуг. 3) Напишите SELECT с WHERE, ORDER BY и LIMIT. 4) Напишите запрос с GROUP BY и COUNT, который считает
    пункты по категориям. 5) Измените цену одной записи через UPDATE и 6) удалите другую через DELETE, оба с WHERE. 7) В последней строке
    напишите, какой запрос без WHERE опасен. Проверки читают текст запросов; результаты выполнения вы видите под полями в предпросмотре.
    Все «…» нужно заменить. Эпоха: 3.'
  checks:
  - Блок с запросами исчез. Он был в странице, верните его.
  - Где-то осталось многоточие «…». Замените его своим текстом.
  - Нужна команда CREATE TABLE items (…) в первом поле.
  - У таблицы нет первичного ключа. Допишите к id слова PRIMARY KEY.
  - Не у всех столбцов есть тип. Нужны числовые (serial или integer для id, integer для цены) и текстовый (text для названия).
  - Нужно не меньше пяти строк данных. Каждую напишите в скобках, на отдельной строке, после слова VALUES.
  - В добавленных строках нет названий ваших услуг. Возьмите их из брифа.
  - 'В запросе из третьего поля нет условия: допишите WHERE, например price > 1000.'
  - Запрос не упорядочен. Допишите ORDER BY, например ORDER BY price DESC.
  - Не хватает ограничения. Допишите LIMIT и число, например LIMIT 3.
  - В четвёртом поле нет GROUP BY. Он собирает строки по категории.
  - 'Нужно что-то посчитать: добавьте в SELECT функцию COUNT(*).'
  - 'UPDATE должен выглядеть так: UPDATE items SET price = 3500 WHERE id = 2. Без WHERE изменятся все строки.'
  - 'DELETE должен выглядеть так: DELETE FROM items WHERE id = 5. Без WHERE удалятся все строки.'
  - Назовите опасный запрос и объясните одним предложением, что будет без WHERE.
  sources:
  - title: 'Postgres Pro: Язык SQL (учебник)'
    url: https://postgrespro.ru/docs/postgresql/current/tutorial-sql
    licence: proprietary-link
    kind: docs
    lang: ru
