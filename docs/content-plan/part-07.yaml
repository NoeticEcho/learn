    url: https://www.postgresql.org/docs/current/queries.html
    licence: proprietary-link
    kind: docs
    lang: en
  - title: 'SQLBolt: интерактивные упражнения по SQL'
    url: https://sqlbolt.com/
    licence: link-only
    kind: course
    lang: en
  - title: 'PGlite: настоящий Postgres в браузере'
    url: https://pglite.dev/
    licence: proprietary-link
    kind: docs
    lang: en
  - title: 'OWASP: SQL Injection Prevention Cheat Sheet'
    url: https://cheatsheetseries.owasp.org/cheatsheets/SQL_Injection_Prevention_Cheat_Sheet.html
    licence: CC-BY-SA
    kind: docs
    lang: en
  videos:
  - title: Вся база SQL для начинающих за 1 час (Vlad Mishustin)
    url: https://www.youtube.com/watch?v=5sG9kmXYsKU
    licence: proprietary-link
    kind: video
    lang: ru
- id: 07-data/03-joins-normalization
  order: 3
  title: 'Связи между таблицами: JOIN и нормализация'
  definition: Нормализация — способ разнести данные по таблицам так, чтобы каждый факт хранился один раз. JOIN собирает их обратно,
    склеивая строки с совпавшим ключом.
  summary: Вы разносите данные по таблицам так, чтобы каждый факт хранился один раз, и собираете их обратно соединениями. После урока
    вы читаете запрос с JOIN, понимаете, чем INNER отличается от LEFT, и знаете, где нормализацию нарушают намеренно.
  minutes: 30
  teaches:
  - data.sql-join
  - data.normalization
  requires:
  - data.sql-select
  diagram: 'JoinsNormal: «Соединения и нормализация» (part 7, lesson 3). Two views on the same invented data, with the names of services
    taken from the person''s brief. «Соединения»: services and categories, one service without a category and one category without services;
    INNER, LEFT and RIGHT JOIN shown as the rows that come out. «Нормализация»: one wide table of orders before and after it is split,
    and three events (a price changes, a phone changes, the only order is cancelled) showing how many rows each one touches.'
  practice: 'В странице четыре поля для SQL и одна строка для вывода. 1) В первом поле допишите таблицы: у people тип столбца name,
    а в items добавьте столбцы category_id и person_id, каждый со ссылкой через REFERENCES на свою таблицу. Никакого столбца с названием
    категории в items быть не должно: название живёт только в categories. 2) Во втором поле добавьте свои услуги (и людей из брифа);
    одна услуга должна остаться без категории (NULL). 3) Напишите запрос с двумя JOIN: услуга, название категории, имя ответственного.
    4) Напишите запрос с LEFT JOIN, который находит услуги без категории. 5) В последней строке скажите, где в вашем проекте данные
    продублированы намеренно и зачем. Все «…» нужно заменить. Эпоха: 3.'
  checks:
  - Блок с запросами исчез. Он был в странице, верните его.
  - Где-то осталось многоточие «…». Замените его своим текстом.
  - 'Нужны две отдельные таблицы: categories и people.'
  - 'В items нет ссылки на categories. Допишите: category_id integer REFERENCES categories(id).'
  - 'В items нет ссылки на people. Допишите: person_id integer REFERENCES people(id).'
  - 'В items есть столбец с названием категории текстом. Так название повторяется в каждой строке. Оставьте только category_id: название
    живёт в таблице categories.'
  - В данных нет названий ваших услуг. Возьмите их из брифа.
  - В данных нет имён людей из вашего брифа.
  - 'Одна услуга должна остаться без категории: поставьте в ней NULL вместо номера категории.'
  - В запросе нет соединения с categories. Нужно JOIN categories ON items.category_id = categories.id.
  - В запросе нет соединения с people. Добавьте JOIN people ON items.person_id = people.id.
  - Для услуг без категории нужен LEFT JOIN, а не обычный.
  - 'Не хватает условия IS NULL: именно оно оставляет услуги, у которых справа пусто.'
  - 'Расскажите чуть подробнее: что продублировано и зачем. Хватит двух предложений.'
