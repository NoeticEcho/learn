- id: 07-data/06-vector-search
  order: 6
  title: 'Поиск: полнотекстовый и векторный'
  summary: 'Зачем: вы понимаете, как сайт ищет по смыслу и по словам: токены, индекс, ранжирование, эмбеддинги и ближайшие
    соседи. После урока вы выберете между поиском внутри Postgres, отдельным движком (Meilisearch, Elasticsearch) и векторной
    базой, и поймёте, как ИИ-ответы используют ваши данные (RAG).'
  minutes: 30
  teaches:
  - data.full-text-search
  - data.vector-db
  requires:
  - data.index
  - data.choose-database
  diagram: 'Поисковая строка по данным брифа: переключатель «по словам / по смыслу»; показаны токены, лемматизация и вес слов
    у первого режима, и точки в пространстве эмбеддингов с кругом ближайших соседей у второго.'
  practice: 'Эпоха 6 (2022): добавить в БД проекта поиск по items и proofs брифа: сначала полнотекстовый в PGlite (tsvector,
    русская конфигурация), затем описать, при каких условиях потребовался бы векторный и что туда пошло бы.'
  checks:
  - Поиск находит пункты по другой форме слова (русская морфология), например «услуга» и «услуги».
  - Результаты упорядочены по релевантности, а не по порядку записей.
  - Описано, когда полнотекстового поиска хватит, а когда нужен векторный.
  - Для векторного варианта названо, какие тексты отправляются стороннему сервису и нужно ли согласие.
