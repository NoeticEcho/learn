- id: 07-data/07-privacy-by-design
  order: 7
  title: 'Приватность по замыслу: что хранить и где'
  summary: 'Зачем: вы закладываете защиту данных в схему базы, а не прикручиваете потом: собираете минимум, ставите сроки
    хранения, разделяете персональное и обычное, шифруете и логируете доступ. После урока вы знаете, чего требуют 152-ФЗ (включая
    хранение данных граждан РФ на серверах в России) и GDPR, и можете перечислить, какие данные проекта подпадают под закон.'
  minutes: 30
  teaches:
  - data.privacy-by-design
  - data.data-localisation
  requires:
  - data.transaction
  - data.sql-write
  - server.authentication
  diagram: 'Реестр данных проекта: перетаскиваешь поля формы в корзины «нужно», «можно не собирать», «персональные», «специальные»;
    рядом счётчик «срок хранения» и карта «где лежит копия» с предупреждением при иностранном хостинге.'
  practice: 'Эпоха 6 (2022): по полям брифа (contacts, people, proofs, заявки) составить реестр: какие данные, зачем, где,
    сколько хранить, кто имеет доступ; отметить то, что можно не собирать, и добавить в схему поле «согласие» с датой.'
  checks:
  - В реестре каждое поле формы связано с целью, и лишние поля убраны.
  - Для каждой категории данных указан срок хранения и условие удаления.
  - Персональные данные отделены от остальных и помечены в схеме.
  - Указано место хранения и сказано, что первичная запись данных граждан РФ идёт на сервер в России.
  - Согласие хранится с датой и версией текста, а не только галочкой.
  sources:
  - title: Федеральный закон № 152-ФЗ «О персональных данных»
    url: https://www.consultant.ru/document/cons_doc_LAW_61801/
