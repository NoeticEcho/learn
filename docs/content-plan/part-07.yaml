title: Данные
era: null
summary: Что такое база данных, как работают реляционные базы и SQL (практика на настоящем Postgres в браузере), зачем нужны индексы
  и транзакции, когда подходят документные, ключ-значение, графовые и векторные базы, как устроен поиск и что такое приватность по замыслу.
