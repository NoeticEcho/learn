  - id: 12-storytelling/07-landing-story
    order: 7
    title: История на посадочной странице
    summary: "Вы превратите страницу в сюжет: расставите разделы по актам, сделаете первый экран «обычным миром с желанием»,
      оживите доказательства и отзыв и решите, чего на странице рассказывать не нужно. После урока у вас есть страница,
      которая читается сверху вниз как история с концом."
    minutes: 30
    teaches:
      - story-landing-narrative
    requires:
      - story-storybrand-page
      - story-three-act
    diagram: "LandingStory: разделы страницы в порядке прокрутки с актами; переключатель подсвечивает части, где историю не
      рассказывают (меню, цены, форма, юридические тексты)."
    practice: "Главная страница как сюжет. Соберите страницу из пяти разделов в нужном порядке: первый экран, проблема,
      доказательства, план, призыв. На первом экране напишите обычный мир посетителя и его желание (не «добро
      пожаловать»). К каждому доказательству из брифа допишите, что оно значит для посетителя. Добавьте один отзыв-сцену
      с числом или датой и подписью, а в контактах оставьте только факты. Все «…» нужно заменить. Эпоха: 5. Шаг:
      story-landing."
    checks:
      - "Разделы должны идти в порядке: первый экран, проблема, доказательства, план, призыв."
      - Где-то осталось многоточие «…». Замените его текстом.
      - Опишите обычный мир посетителя хотя бы шестью словами.
      - Опишите желание посетителя хотя бы пятью словами.
      - "Уберите «добро пожаловать» и «приветствуем»: начните с жизни посетителя."
      - Кнопка на первом экране должна остаться с названием вашего главного действия.
      - Названия доказательств из брифа должны остаться на странице.
      - "У доказательства осталось многоточие: допишите, что оно значит для посетителя."
      - В отзыве-сцене нужно хотя бы двенадцать слов и одна цифра или дата.
      - "Под отзывом нужна подпись: например «Из практики, имя изменено»."
      - В плане должно быть три или четыре шага.
      - В блоке призыва должны остаться контакты из брифа.
      - "В контактах нет места рассказу: оставьте только факты."
    sources:
