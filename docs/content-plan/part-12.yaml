- id: 12-story/08-expert-ethics-and-test
  order: 8
  title: 'Эксперт, который не хвастается: этика рекламы и проверка трёх версий'
  summary: 'Зачем: рассказывать о себе как эксперт, не нарушая закон о рекламе и профессиональную этику адвоката или другого
    специалиста, и проверить, какая из трёх версий истории работает лучше. После урока человек имеет итоговую историю проекта
    и план проверки её на читателях.'
  minutes: 30
  teaches:
  - story.expert-ethics
  - story.three-ways-test
  requires:
  - story.brand-story
  - story.case-study
  - story.pixar-spine
  - texts.expert-text
  diagram: 'Три версии истории рядом (ABT, STAR-кейс, история основателя) и «линейка скромности»: подсветка гарантий результата,
    превосходных степеней и сравнений с конкурентами; опрос «какая версия убедительнее?» с выборкой из карточек читателей.'
  practice: 'Эпоха 7 (AI-конструктор): написать историю проекта тремя способами (ABT, STAR-кейс, история основателя), прогнать
    каждую через чек-лист «без превосходных степеней, без гарантий результата, без отзывов, если они запрещены для вашей профессии»,
    и выбрать две версии для проверки на читателях. Если brief.tone «эксперт», проверить текст на соответствие нормам этики
    своей профессии.'
  checks:
  - Есть три версии одной истории разных форм.
  - Ни одна версия не содержит гарантий результата, слов «лучший» и «№1» без подтверждения.
  - Если профессия регулируется (brief.who), указано, какое правило этики или закона о рекламе проверено.
  - Для двух выбранных версий записано, что и как будет сравниваться (прочитано до конца, клик по brief.mainAction).
  - Все ссылки на документы и достижения опираются на brief.proofs.
  sources:
  - title: Федеральный закон «О рекламе» 38-ФЗ (КонсультантПлюс)
    url: https://www.consultant.ru/document/cons_doc_LAW_58968/
    licence: proprietary-link
    kind: docs
    lang: ru
  - title: 'КонсультантПлюс: Кодекс профессиональной этики адвоката (подборка)'
    url: https://www.consultant.ru/law/podborki/kodeks_professionalnoj_jetiki_advokata/
    licence: proprietary-link
    kind: docs
    lang: ru
