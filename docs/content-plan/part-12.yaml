- id: 12-story/04-short-forms
  order: 4
  title: 'Короткие формы: хребет Pixar, ABT и кисётэнкэцу'
  summary: 'Зачем: получить три компактные формы, которые помещаются в абзац, подзаголовок или пост: хребет Pixar, ABT («и…
    но… поэтому») и японскую четырёхчастную форму без конфликта. После урока человек пишет один и тот же рассказ о проекте
    в каждой из трёх форм.'
  minutes: 20
  teaches:
  - story.pixar-spine
  - story.abt
  - story.kishotenketsu
  requires:
  - story.three-act
  - copy.pas
  diagram: 'Три «станка»: в каждый вставляется один и тот же набор фактов, и он раскладывается по хребту Pixar (жили-были,
    каждый день, но однажды, из-за этого, пока наконец, с тех пор), по ABT и по ки–сё–тэн–кэцу; рядом переключатель «когда
    какая форма уместна».'
  practice: 'Эпоха 4 (адаптивная вёрстка, мобильный первый подход). Написать описание проекта (brief.who) тремя способами:
    в одно предложение по ABT, в шесть коротких строк по хребту Pixar и в четыре абзаца по кисётэнкэцу, где «тэн» это неожиданный
    поворот, не конфликт. ABT пойдёт в подзаголовок hero-блока, остальные сохранить как заготовки.'
  checks:
  - 'Есть три версии: ABT из одного предложения, хребет из шести строк, четыре абзаца кисётэнкэцу.'
  - В ABT «но» называет реальную проблему адресата из brief.forWhom, а «поэтому» ведёт к brief.mainAction.
  - В кисётэнкэцу третий абзац вводит новый взгляд или факт, а не конфликт.
  - Тон всех версий соответствует brief.tone.
  sources:
  - title: 'SESYNC Communications Toolkit: And, But, Therefore statement'
    url: https://www.sesync.org/resources/communications-toolkit-and-therefore-statement
    licence: proprietary-link
    kind: article
    lang: en
  - title: Pixar's 22 Rules of Storytelling (Aerogramme Studio)
    url: https://www.aerogrammestudio.com/2013/03/07/pixars-22-rules-of-storytelling/
    licence: proprietary-link
    kind: article
    lang: en
  - title: 'Khan Academy: Pixar in a Box, the art of storytelling'
    url: https://www.khanacademy.org/computing/pixar/storytelling
    licence: link-only
    kind: course
    lang: en
  - title: 'Wikipedia: Kishōtenketsu'
    url: https://en.wikipedia.org/wiki/Kish%C5%8Dtenketsu
    licence: CC-BY-SA
    kind: article
    lang: en
  videos: []
- id: 12-story/05-brand-and-founder
  order: 5
  title: История бренда и история основателя
  summary: 'Зачем: написать страницу «О проекте» или «Обо мне», которой верят: с причиной, ценностями, проверяемыми фактами
    и без пафоса. После урока человек получает черновик истории проекта и историю основателя в трёх длинах (одна строка, абзац,
    страница).'
  minutes: 20
  teaches:
  - story.brand-story
  - story.founder-story
  requires:
  - story.heros-journey
  - texts.tone-of-voice
  - texts.rewrite
  diagram: 'Конструктор страницы «О проекте»: слайдеры «личное ↔ профессиональное» и «миссия ↔ факты» меняют пример текста;
    подсветка помечает пустые обещания («мы заботимся») и предлагает заменить их проверяемым фактом.'
  practice: 'Эпоха 3 (WordPress, тема и плагины): страница «О проекте» в записи типа «страница». Из brief.who, brief.people
    и brief.proofs собрать историю основателя: поворотное событие, чему оно научило, что человек делает теперь для brief.forWhom.
    Дать три длины и поместить длинную на страницу, среднюю в анонс, короткую в подпись.'
  checks:
  - 'Есть три длины: одна строка, абзац и страница, и в каждой одна и та же причина.'
  - 'Поворотное событие конкретно: дата или место и что именно произошло.'
  - Не менее двух утверждений подкреплены brief.proofs (документ, дата, число).
  - Нет слов-пустышек вроде «профессионал», «индивидуальный подход» без факта.
  - Язык и тон страницы соответствуют brief.languages и brief.tone.
  sources:
  - title: 'Wikipedia: Hero''s journey'
    url: https://en.wikipedia.org/wiki/Hero%27s_journey
    licence: CC-BY-SA
    kind: article
    lang: en
  - title: 'Wikipedia: List of story structures (Freytag''s pyramid and others)'
    url: https://en.wikipedia.org/wiki/Freytag%27s_pyramid
    licence: CC-BY-SA
    kind: article
    lang: en
