  - id: 12-storytelling/12-expert-ethics
    order: 12
    title: "Эксперт, который не хвастается: рассказ и правила рекламы"
    summary: "Вы научитесь рассказывать о себе как эксперт, не нарушая закон о рекламе и правила своей профессии: без
      гарантий результата, без пустых превосходных степеней, с проверяемыми фактами. После урока у вас есть три версии
      истории, проверенные по чек-листу, и понимание, какому специалисту показать итоговый текст."
    minutes: 30
    teaches:
      - story-expert-ethics
    requires:
      - story-brand-story
      - story-case-study
    diagram: "ModestyRuler: текст о себе проверяется на превосходные степени, гарантии, сравнения и отзывы; итог
      подсказывает, куда посмотреть, и не заменяет юриста."
    practice: "Три версии и проверка перед публикацией. Напишите о проекте тремя способами: по ABT, как короткий кейс и как
      историю основателя (по двенадцать слов и больше). В одной из них назовите документ или подтверждение из брифа. В
      версиях не должно быть гарантий результата и слов «лучший» и «№1». Потом ответьте на шесть вопросов чек-листа
      («да», «нет» или «не применимо» и коротко почему), назовите правило или закон, по которому проверяли, что вы
      исправили и кто посмотрит итоговый текст. Все «…» нужно заменить. Эпоха: 7. Шаг: story-ethics."
    checks:
      - Нужны ровно три версии истории.
      - Где-то осталось многоточие «…». Заполните версии и ответы чек-листа.
      - "Версия ABT слишком короткая: нужно хотя бы двенадцать слов."
      - "Версия-кейс слишком короткая: нужно хотя бы двенадцать слов."
      - "История основателя слишком короткая: нужно хотя бы двенадцать слов."
      - В версиях остались гарантии или превосходные степени («гарантирую», «лучший», «№1»). Замените их фактом.
      - Назовите в одной из версий документ или подтверждение из вашего брифа.
      - В чек-листе должно быть шесть вопросов с ответами.
      - "Укажите, по какому закону или правилам проверяли: например «закон о рекламе, статья 5» или «правила моей
        палаты»."
      - Опишите, что исправили, хотя бы пятью словами.
      - "Назовите, кто посмотрит итоговый текст: например «юрист» и «моя палата»."
    sources:
