  - id: 12-storytelling/09-case-study
    order: 9
    title: "Кейс: STAR и «до и после»"
    summary: "Вы научитесь оформлять рабочий случай как доказательство: ситуация, задача, действия, результат и честное «до
      и после». После урока у вас есть один кейс по вашей услуге, из которого нельзя узнать клиента, и вы знаете, что в
      нём нельзя раскрывать."
    minutes: 30
    teaches:
      - story-case-study
    requires:
      - story-abt
      - story-brand-story
    diagram: "CaseFrame: бегунок «до ↔ после» над придуманными числами и поле, где программа находит телефоны, почту,
      кадастровые и судебные номера и адреса."
    practice: "Кейс по вашей услуге. Заполните одну запись коллекции «Кейсы», как в headless CMS: название, услуга из вашего
      брифа, ситуация, задача, не меньше трёх действий, результат, срок и блок «до и после». Всё без персональных
      данных: имён, телефонов, почты, адресов, номеров дел и кадастровых номеров. Результат измеримый (число, срок) или
      честно описанный без числа. Кнопку главного действия оставьте. Все «…» нужно заменить. Эпоха: 6. Шаг: story-case."
    checks:
      - Где-то осталось многоточие «…». Заполните все поля.
      - В поле «Услуга» должна быть услуга или товар из вашего брифа.
      - "В кейсе должны остаться четыре поля: ситуация, задача, действия, результат."
      - "Опишите ситуацию подробнее: хотя бы восемь слов."
      - Опишите задачу хотя бы шестью словами.
      - Нужно не меньше трёх действий в виде списка.
      - В результате нужна цифра или честное «без числа». Опишите, чем кончилось.
      - "В поле «Срок» нужна цифра: сколько дней, недель или месяцев."
      - В строке «До:» опишите положение до работы хотя бы четырьмя словами.
      - В строке «После:» опишите положение после работы хотя бы четырьмя словами.
      - "В кейсе остались данные, по которым можно найти человека: почта, телефон, адрес, номер дела или кадастровый
        номер. Уберите их."
      - Кнопка главного действия должна остаться на странице.
    sources:
