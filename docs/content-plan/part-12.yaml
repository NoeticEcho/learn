  - id: 12-storytelling/11-visual-and-scroll
    order: 11
    title: Визуальный сторителлинг и прокрутка
    summary: Вы поймёте, как рассказывать картинками и порядком показа и как сделать историю, которая разворачивается при
      прокрутке, не ломая страницу для тех, кому анимации вредят. После урока у вас есть блок «Как мы работаем» из
      трёх-пяти шагов с анимацией на CSS и запасной версией без неё.
    minutes: 30
    teaches:
      - story-visual-story
    requires:
      - story-data-story
      - story-three-act
    diagram: "ScrollStory: прокручиваемый блок с четырьмя шагами, индикатор прокрутки, переключатель «уменьшить движение» и
      проверка поддержки animation-timeline в браузере."
    practice: "Блок «Как мы работаем» при прокрутке. Напишите три-пять шагов вашего пути для клиента: от первого обращения
      до результата. Последний шаг содержит название вашей кнопки слово в слово. В стилях добавьте появление шагов при
      прокрутке: правило @keyframes, правило с animation-timeline внутри @supports (animation-timeline: view()) и
      отдельное правило @media (prefers-reduced-motion: reduce), которое отключает анимацию. Без анимации шаги должны
      читаться как обычный список. Все «…» нужно заменить. Эпоха: 5. Шаг: story-scroll."
    checks:
      - "Нужно от трёх до пяти шагов: элементы li с классом step в списке steps."
      - Где-то остался знак «…». Заполните все шаги.
      - В последнем шаге должно стоять название вашей кнопки слово в слово.
      - "В стилях нет правила @keyframes: опишите, как шаг появляется."
      - "В стилях нет animation-timeline: view() или scroll(): без него анимация не привязана к прокрутке."
      - "Правило с animation-timeline нужно поместить внутрь @supports (animation-timeline: view())."
      - "Добавьте @media (prefers-reduced-motion: reduce), а в нём animation: none."
      - Кнопка главного действия должна остаться под шагами.
    sources:
