  - id: 12-storytelling/02-acts-and-curves
    order: 2
    title: Три акта, пирамида Фрейтага и зигзаг Дуарте
    summary: "Вы научитесь раскладывать историю на завязку, развитие и развязку, видеть подъём и спад напряжения и выбирать,
      с чего начинать: с начала или с середины. После урока у вас есть дуга главной страницы, которая ведёт к вашему
      главному действию."
    minutes: 25
    teaches:
      - story-three-act
      - story-freytag-pyramid
      - story-in-medias-res
      - story-sparkline
    requires:
      - story-narrative-transport
    diagram: "ArcShaper: пять ползунков напряжения двигают кривую Фрейтага с тремя актами поверх неё; вкладка «зигзаг
      Дуарте» чередует «как есть / как могло бы быть»; вкладка «с начала / с середины» переставляет блоки."
    practice: "Дуга вашей главной страницы. Распишите главную страницу как историю в пяти строках: экспозиция, подъём,
      кульминация, спад, развязка. Кульминация это раздел, где посетитель видит решение; в ней назовите один из разделов
      вашего сайта. Развязка ведёт к вашему главному действию и содержит его название слово в слово. Хотя бы в одной
      строке упомяните свою услугу или товар из брифа. Потом выберите, начнётся ли страница «с начала» или «с середины»,
      и объясните почему. Все «…» нужно заменить. Эпоха: 5. Шаг: story-arc."
    checks:
      - В дуге должно быть ровно пять строк с классом beat.
      - Где-то остался знак «…». Замените его своими словами.
      - Последняя строка должна содержать название вашей кнопки слово в слово (оно сверху, под заголовком «Желаемая
        развязка»).
      - В кульминации назовите один из разделов вашего сайта по названию из брифа.
      - Хотя бы в одной строке упомяните свою услугу или товар по названию из брифа.
      - Напишите после «Страница начинается» либо «с начала», либо «с середины».
      - Объясните выбор хотя бы тремя словами.
    sources:
