  - id: 12-storytelling/13-three-ways-test
    order: 13
    title: "Какая версия работает лучше: проверка на читателях"
    summary: "Вы научитесь проверять, какая из версий истории лучше, не обманывая себя: что именно сравнивать, сколько
      читателей нужно и почему на малых числах «победитель» часто случаен. После урока у вас есть план проверки двух
      версий, составленный заранее, и выбранная пока версия на странице."
    minutes: 30
    teaches:
      - story-three-ways-test
    requires:
      - story-expert-ethics
      - story-abt
    diagram: "AaTest: опыт «два одинаковых текста»: двадцать A/A-тестов при разном числе посетителей показывают, как часто
      «побеждает» случайность."
    practice: "План проверки двух версий. Поставьте на главную выбранную пока версию истории (не меньше двенадцати слов, без
      гарантий и слов «лучший» и «№1»). Затем составьте план проверки двух версий: что в них различается и что
      одинаково, что измеряете (прочитано до конца и клик по вашей кнопке), сколько читателей (число не меньше пяти),
      три вопроса, правило решения с числом, записанное до проверки, и как вы предупредите читателей. Все «…» нужно
      заменить. Эпоха: 7. Шаг: story-test-plan."
    checks:
      - В выбранной версии на странице осталось многоточие «…».
      - "Выбранная версия слишком короткая: нужно хотя бы двенадцать слов."
      - В выбранной версии остались гарантии или слова вроде «лучший». Замените их фактом.
      - Кнопка главного действия должна остаться на странице.
      - В плане осталось многоточие «…». Заполните все поля.
      - Опишите версию A хотя бы тремя словами.
      - Опишите версию B хотя бы тремя словами.
      - "Скажите, что остаётся одинаковым в обеих версиях: меняться должен только рассказ."
      - В измеряемом должно быть название вашей кнопки слово в слово.
      - Измеряйте ещё и то, дочитали ли до конца.
      - "Укажите число читателей: не меньше пяти."
      - Нужно хотя бы три вопроса читателю.
      - В правиле решения нужно число (например «не менее 3 из 5») и хотя бы восемь слов.
      - Опишите, как вы предупредите читателей, хотя бы пятью словами.
