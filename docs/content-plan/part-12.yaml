- id: 12-story/07-data-and-visual
  order: 7
  title: 'Данные и визуальный сторителлинг: диаграммы и скроллителлинг'
  summary: 'Зачем: превратить числа и процессы в рассказ: выбрать заголовок-вывод, акцент и порядок показа, а там, где история
    длинная, показать её скроллом. После урока человек делает одну диаграмму с выводом в заголовке и одну прокручиваемую сцену
    на CSS scroll-driven animations.'
  minutes: 25
  teaches:
  - story.data-story
  - story.visual-story
  requires:
  - story.three-act
  - css.transitions-animations
  - css.reduced-motion
  - design.visual-hierarchy
  diagram: 'Одна таблица данных и три подачи: «как есть», «с заголовком-выводом и акцентом», «пошагово при прокрутке»; бегунок
    прокрутки двигает сцену, переключатель prefers-reduced-motion показывает статичную версию.'
  practice: 'Эпоха 4/5: сделать блок «Путь клиента» или «Как мы работаем» из brief.sections: 3–5 шагов, прокручиваемых одним
    экраном; к нему приложить одну диаграмму по числам из brief.proofs или brief.items (сроки, количество, стоимость) с заголовком-выводом.
    При reduced motion шаги показываются списком.'
  checks:
  - Заголовок диаграммы это вывод («…сократился втрое»), а не название осей.
  - Выделен один акцент цветом или рамкой, остальное нейтральное.
  - Шагов от трёх до пяти, и порядок идёт по пути посетителя к brief.mainAction.
  - При prefers-reduced-motion контент доступен без анимации.
  - У диаграммы есть текстовая альтернатива.
  sources:
