  - id: 12-storytelling/08-brand-and-founder
    order: 8
    title: История проекта и история основателя
    summary: "Вы научитесь писать страницу «О проекте» или «Обо мне», которой верят: с причиной, проверяемыми фактами и без
      пустых обещаний. После урока у вас есть история основателя в трёх длинах: строка, абзац и страница, и во всех трёх
      одна и та же причина."
    minutes: 30
    teaches:
      - story-brand-story
      - story-founder-story
    requires:
      - story-landing-narrative
    diagram: "EmptyPromises: текстовое поле с примером «О нас»; стандартные обороты подчёркнуты, считаются предложения без
      числа или даты."
    practice: "История основателя в трёх длинах. Напишите страницу «О проекте» в трёх длинах: строка под названием (по одной
      на каждый язык вашего сайта), абзац-анонс и страница из трёх абзацев: поворотное событие (с датой или местом),
      чему оно научило, что вы делаете теперь для тех, для кого сайт. Во всех трёх длинах выделите словами одну и ту же
      причину элементом span с классом reason. Пустых слов вроде «профессионал» и «индивидуальный подход» быть не
      должно. Все «…» нужно заменить. Эпоха: 3. Шаг: story-founder."
    checks:
      - Строка под названием нужна для каждого языка вашего сайта.
      - Где-то осталось многоточие «…». Замените его текстом.
      - Строка под названием должна быть одним предложением.
      - "В строке нет выделенной причины: оберните её в span с классом reason."
      - "В анонсе нет выделенной причины: оберните её в span с классом reason."
      - "На странице нет выделенной причины: оберните её в span с классом reason."
      - "Анонс слишком короткий: в нём должно быть хотя бы двадцать слов."
      - "На странице нужно три абзаца: событие, урок, что вы делаете теперь."
      - "В поворотном событии нужны дата, год или место: например «в Заречье» или «осенью 2012 года»."
      - Список подтверждений из брифа должен остаться на странице.
      - В тексте остались пустые слова вроде «профессионал» или «индивидуальный подход». Замените их фактом.
    sources:
