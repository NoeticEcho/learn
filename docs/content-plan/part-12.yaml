  - id: 12-storytelling/10-data-story
    order: 10
    title: "Рассказ на данных: заголовок-вывод и один акцент"
    summary: "Вы научитесь превращать числа в рассказ: выбирать главную мысль, ставить её в заголовок, выделять одно и
      делать диаграмму доступной тем, кто её не видит. После урока у вас есть диаграмма из ваших данных с выводом в
      заголовке и текстовой альтернативой."
    minutes: 25
    teaches:
      - story-data-story
    requires:
      - story-three-act
    diagram: "DataThreeWays: пять придуманных чисел в трёх подачах: как есть, с выводом и акцентом, шаг за шагом; текстовая
      альтернатива под каждой."
    practice: "Диаграмма с выводом. Постройте диаграмму из полос по числам вашего проекта (сроки, цены, количество).
      Подпишите строки названиями своих услуг или товаров из брифа, у каждой впишите значение. Заголовок диаграммы
      должен быть выводом с числом или сравнением, а не названием осей. Выделите цветом одну полосу, остальные оставьте
      серыми. Укажите источник и дату и напишите текстовую альтернативу в одно-два предложения. Все «…» нужно заменить.
      Эпоха: 5. Шаг: story-data."
    checks:
      - Где-то остался знак «…». Заполните все подписи, значения и заголовок.
      - "Заголовок должен быть выводом: хотя бы четыре слова с числом или сравнением («в десять раз», «дольше»,
        «вырос»)."
      - Нужно хотя бы три строки диаграммы.
      - Подпишите хотя бы две строки названиями услуг или товаров из вашего брифа.
      - У строк должны быть числовые значения.
      - "Должна быть ровно одна выделенная полоса: класс accent у одной полосы."
      - "Укажите источник и дату или год: «Источник: …, 2025»."
      - Напишите альтернативу хотя бы восемью словами и с главным числом.
      - "Подписи плохо читаются: тёмный текст на светлом фоне даёт нужный контраст."
    sources:
