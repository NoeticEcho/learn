lessons:
- id: 12-story/01-why-stories
  order: 1
  title: Почему истории работают
  summary: 'Зачем: понять, что делает рассказ сильнее списка фактов (погружение, образы, причинность), и отличить на любой
    странице сайта, где история помогает, а где мешает. После урока человек может найти в своём брифе три места, где перечень
    стоит заменить рассказом.'
  minutes: 15
  teaches:
  - story.narrative-transport
  - story.story-vs-list
  requires:
  - texts.screen-reading
  - texts.inverted-pyramid
  - copy.aida
  diagram: 'Переключатель «список ↔ рассказ»: один и тот же набор фактов о проекте подаётся как маркированный список и как
    короткая сцена; рядом счётчик «что читатель запомнил» заполняется из карточек-вопросов, которые человек отвечает сам по
    памяти.'
  practice: 'Эпоха 5 (генератор статических сайтов, Markdown). В поле brief «sections» и «items» найти раздел, где материал
    подан списком (услуги, достижения, этапы), и переписать вступление этого раздела в две-три предложения-сцены: кто (people/forWhom),
    что случилось, чем кончилось. Список оставить ниже.'
  checks:
  - Раздел выбран из brief.sections, и в нём есть и список, и вступление-сцена.
  - В сцене назван адресат из brief.forWhom или персонаж из brief.people, а не абстрактный «клиент».
  - В сцене есть хотя бы одно конкретное число, дата или место из brief.items или brief.proofs.
  - Вступление не длиннее трёх предложений и не содержит оценок вроде «лучший» или «уникальный».
  sources:
  - title: 'Green & Appel (2024): narrative transportation, author preprint (PDF)'
    url: https://mcm.uni-wuerzburg.de/fileadmin/06110300/2024/Pdfs/Green___Appel__2024__Advances_Preprint.pdf
    licence: proprietary-link
    kind: article
    lang: en
  - title: 'Wikipedia: List of story structures (Freytag''s pyramid and others)'
    url: https://en.wikipedia.org/wiki/Freytag%27s_pyramid
    licence: CC-BY-SA
    kind: article
    lang: en
  - title: 'NN/g: Scrolling and Attention'
    url: https://www.nngroup.com/articles/scrolling-and-attention/
    licence: proprietary-link
    kind: article
    lang: en
  - title: 'Wikipedia: Situation, task, action, result (STAR)'
    url: https://en.wikipedia.org/wiki/Situation,_task,_action,_result
    licence: CC-BY-SA
    kind: article
    lang: en
  videos: []
- id: 12-story/02-acts-and-curves
  order: 2
  title: Три акта, пирамида Фрейтага и кривая Дуарте
  summary: 'Зачем: научиться раскладывать историю на завязку, развитие и развязку, видеть в ней нарастание и спад напряжения
    и выбирать, с чего начать (с начала или in medias res). После урока человек строит дугу для главной страницы или рассказа
    о проекте.'
  minutes: 20
  teaches:
  - story.three-act
  - story.freytag-pyramid
  - story.in-medias-res
  - story.sparkline
  requires:
  - story.narrative-transport
  - texts.headlines
  diagram: 'Интерактивная кривая: человек двигает точки на пирамиде Фрейтага (экспозиция, подъём, кульминация, спад, развязка),
    и ниже тот же рассказ перестраивается в три акта; переключатель «с начала / in medias res» меняет порядок блоков; режим
    Дуарте рисует зигзаг «как есть / как могло бы быть».'
  practice: Эпоха 5. Взять brief.mainAction как желаемую развязку. Расписать главную страницу как дугу в пяти строках (экспозиция,
    осложнение, кульминация, спад, развязка), где кульминация это момент, когда посетитель видит brief.mainAction. Выбрать,
    начнёт ли страница с начала или in medias res, и обосновать одной фразой.
  checks:
  - Все пять строк дуги заполнены, и последняя ведёт к brief.mainAction.
  - Кульминация привязана к конкретному разделу из brief.sections.
  - Названо, начинает ли страница с начала или с середины, и дано обоснование.
  - Хотя бы в двух строках дуги использованы факты из brief.proofs или brief.items, а не общие слова.
  sources:
  - title: 'Wikipedia: List of story structures (Freytag''s pyramid and others)'
    url: https://en.wikipedia.org/wiki/Freytag%27s_pyramid
    licence: CC-BY-SA
    kind: article
    lang: en
  - title: 'Wikipedia: Three-act structure'
    url: https://en.wikipedia.org/wiki/Three-act_structure
    licence: CC-BY-SA
    kind: article
    lang: en
  - title: 'Wikipedia: In medias res'
    url: https://en.wikipedia.org/wiki/In_medias_res
    licence: CC-BY-SA
    kind: article
    lang: en
  - title: Nancy Duarte, The secret structure of great talks (TED)
    url: https://www.ted.com/talks/nancy_duarte_the_secret_structure_of_great_talks
    licence: link-only
    kind: video
    lang: en
  - title: Nancy Duarte, Resonate (book page)
    url: https://www.duarte.com/resources/books/resonate/
    licence: proprietary-link
    kind: book
    lang: en
  videos: []
- id: 12-story/03-heros-journey
  order: 3
  title: Путь героя и круг истории
  summary: 'Зачем: понять мономиф Кэмпбелла в версии Воглера и восьмишаговый круг Хармона и применить их так, чтобы героем
    стал клиент, а не автор сайта. После урока человек пишет сюжет клиента, в котором его проект играет роль проводника.'
  minutes: 20
  teaches:
  - story.heros-journey
  - story.story-circle
  requires:
  - story.three-act
  - copy.storybrand
  diagram: 'Круг из восьми секторов Хармона поверх 12 шагов пути героя Воглера: наведение на шаг показывает пример из выбранного
    шаблона проекта (портфолио, магазин, кафе, НКО, мероприятие, SaaS); человек перетаскивает сцены клиента в секторы.'
  practice: 'Эпоха 5. Выбрать героя: человека из brief.forWhom. Заполнить круг Хармона из восьми строк: что у героя есть,
    чего он хочет, куда попадает, как приспосабливается, что находит, чего это стоит, как возвращается, что изменилось. Проект
    из brief.who встречается в шагах 3–6 как проводник, а не как герой.'
  checks:
  - Герой взят из brief.forWhom, а не сам автор проекта.
  - Все восемь шагов заполнены, и в шаге о желании звучит тот результат, ради которого посетитель пришёл (brief.mainAction).
  - Проект и его услуги (brief.items) появляются как помощь герою, не раньше третьего шага.
  - Последний шаг описывает изменение героя после результата, а не рекламный призыв.
  sources:
  - title: 'Wikipedia: Hero''s journey'
    url: https://en.wikipedia.org/wiki/Hero%27s_journey
    licence: CC-BY-SA
    kind: article
    lang: en
  - title: 'Wikipedia: Dan Harmon (the story circle)'
    url: https://en.wikipedia.org/wiki/Dan_Harmon
    licence: CC-BY-SA
    kind: article
    lang: en
  - title: 'Wikipedia: List of story structures (Freytag''s pyramid and others)'
    url: https://en.wikipedia.org/wiki/Freytag%27s_pyramid
    licence: CC-BY-SA
    kind: article
    lang: en
  - title: 'Khan Academy: Pixar in a Box, the art of storytelling'
    url: https://www.khanacademy.org/computing/pixar/storytelling
    licence: link-only
    kind: course
    lang: en
  videos:
  - title: 'Мономиф: 12 шагов Пути героя (Alifbo Agency)'
    url: https://www.youtube.com/watch?v=PoQ4mqpZHkA
    lang: ru
  - title: Мономиф или ПУТЬ ГЕРОЯ • Тысячеликий герой (заумь)
