  - id: 12-storytelling/04-circle-and-critique
    order: 4
    title: Круг Хармона и критика пути героя
    summary: Вы научитесь пользоваться более простой схемой, кругом Дэна Хармона, и узнаете, что именно критикуют в пути
      героя и какие истории устроены иначе. После урока вы можете честно сказать, где схема помогает вашему проекту, а
      где её лучше отложить.
    minutes: 25
    teaches:
      - story-story-circle
      - story-heros-journey-critique
    requires:
      - story-heros-journey
    diagram: "StoryCircle: круг Хармона из восьми шагов с верхней и нижней половиной, примерным соответствием шагам Воглера
      и вопросом про посетителя; вкладка «три формы»: линия, круг, мешок."
    practice: "Круг истории вашего клиента. Заполните восемь шагов круга для героя из вашего брифа. В двух первых шагах
      («ты» и «нужда») слово «мы» не нужно: проекта в истории ещё нет. В шагах с третьего по шестой назовите свою услугу
      или товар из брифа. Последний шаг описывает перемену героя, а не призыв «звоните» или «заказывайте». И в конце
      честно скажите, где эта схема не подходит вашему проекту. Все «…» нужно заменить. Эпоха: 5. Шаг: story-circle."
    checks:
      - Строка «Герой» должна остаться на месте.
      - В круге должно быть ровно восемь шагов.
      - Где-то осталось многоточие «…». Замените его словами.
      - "В шагах 1 и 2 встретилось слово «мы». Там проекта ещё нет: напишите только о герое."
      - В шагах с третьего по шестой назовите свою услугу или товар по названию из брифа.
      - Последний шаг должен описывать перемену героя хотя бы пятью словами и не быть призывом.
      - Напишите хотя бы пятью словами, где схема вашему проекту не подходит.
    sources:
