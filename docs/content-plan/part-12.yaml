  - id: 12-storytelling/03-heros-journey
    order: 3
    title: "Путь героя: кто герой на вашем сайте"
    summary: "Вы узнаете самую известную схему историй, путь героя Кэмпбелла и Воглера, и поймёте её главное применение для
      сайта: героем делают посетителя, а проект выступает наставником. После урока у вас есть путь вашего клиента,
      расписанный по этой схеме."
    minutes: 25
    teaches:
      - story-heros-journey
    requires:
      - story-three-act
    diagram: "HeroJourney: двенадцать шагов Воглера по кругу, у каждого значение в истории и место на сайте; внизу герой и
      наставник из брифа человека."
    practice: "Путь вашего клиента. Герой этой истории ваш посетитель, а не вы. Заполните три строки «до встречи с нами»:
      обычный мир, зов, отказ (чем он сомневается). В этих трёх строках не должно быть слова «мы». Потом строки «встреча
      и путь»: наставник (назовите в нём свою услугу или товар из брифа), порог (название вашей кнопки слово в слово),
      награда и эликсир (чем жизнь героя изменилась). Все «…» нужно заменить. Эпоха: 5. Шаг: story-journey."
    checks:
      - "Строка «Герой» должна остаться: в ней адресат вашего сайта из брифа."
      - Осталось многоточие «…». Заполните все строки.
      - "В первых трёх строках встретилось слово «мы». Перепишите про героя: он действует, а вы ещё не появились."
      - "Опишите сомнение героя хотя бы четырьмя словами: чего он боится или в чём не уверен."
      - В строке наставника назовите свою услугу или товар по названию из брифа.
      - В строке порога должно быть название вашей кнопки слово в слово.
      - "Опишите последнюю строку хотя бы пятью словами: что изменилось в жизни героя."
    sources:
