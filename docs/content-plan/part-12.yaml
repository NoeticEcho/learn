  - id: 12-storytelling/06-storybrand-page
    order: 6
    title: StoryBrand как скелет страницы
    summary: "Вы возьмёте семь частей схемы StoryBrand Дональда Миллера и разложите по ним главную страницу: герой с
      желанием, проблема, проводник, план, призыв, ставки и успех. После урока у вас есть работающий черновик главной
      страницы, в котором герой посетитель, а вы проводник."
    minutes: 30
    teaches:
      - story-storybrand-page
    requires:
      - story-heros-journey
    diagram: "PageSkeleton: семь блоков StoryBrand на схеме страницы; клик показывает, что писать, слабую и более сильную
      строку."
    practice: "Главная страница по семи блокам. Соберите главную страницу из шести разделов. В первом, в абзаце want,
      напишите, что получит посетитель. В разделе проблемы напишите три слоя: внешний, внутренний и «несправедливость».
      В разделе проводника пропишите сочувствие и авторитет (авторитет подкрепите доказательством из брифа). В плане
      дайте три шага. Добавьте вторую кнопку с названием вашего главного действия в плане. В ставках и успехе по одному
      честному абзацу. Слов «лучший» и «уникальный» быть не должно. Все «…» нужно заменить. Эпоха: 5. Шаг:
      story-storybrand."
    checks:
      - На странице должно быть шесть разделов с классом sb.
      - Где-то осталось многоточие «…». Замените его текстом.
      - Напишите хотя бы пятью словами, что получит посетитель.
      - Кнопка в первом разделе должна остаться с названием вашего главного действия.
      - Добавьте вторую кнопку с классом cta, например в плане.
      - "В проблеме должны быть три строки: external, internal, philosophical."
      - Сочувствие нужно выразить фразой хотя бы из шести слов.
      - В авторитете назовите документ или доказательство из вашего брифа.
      - В плане должно быть три или четыре шага.
      - Опишите в ставках спокойно и честно, что будет без действия (хотя бы шесть слов).
      - "Опишите успех: как будет выглядеть жизнь героя потом (хотя бы шесть слов)."
      - В тексте остались слова «лучший», «уникальный» или «№1». Замените их фактом.
    sources:
