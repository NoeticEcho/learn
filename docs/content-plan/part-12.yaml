- id: 12-story/06-case-study
  order: 6
  title: 'Кейс: STAR и «до и после»'
  summary: 'Зачем: оформить рабочий случай как доказательство: ситуация, задача, действия, результат, и честное «до и после».
    После урока человек пишет один кейс по своему проекту (или по шаблону для его типа) и знает, что в нём нельзя раскрывать.'
  minutes: 20
  teaches:
  - story.case-study
  requires:
  - story.abt
  - copy.four-p-picture
  - texts.expert-text
  diagram: 'Редактор кейса с рамкой STAR и бегунком «до ↔ после»; рядом панель «что нельзя»: имена, адреса, номера дел и данные
    из 152-ФЗ подсвечиваются и предлагаются к замене на обобщение.'
  practice: 'Эпоха 6 (headless CMS): коллекция «Кейсы» с полями ситуация, задача, действия, результат, срок. Заполнить одну
    запись по brief.items или brief.proofs, обезличив данные клиента, и вывести её на странице с блоком «до и после».'
  checks:
  - Заполнены все четыре поля STAR и срок.
  - Результат выражен измеримо (срок, число, решение) или честно описан без числа.
  - 'В записи нет персональных данных клиента: имён, адресов, номеров документов.'
  - Кейс привязан к услуге из brief.items и ведёт к brief.mainAction.
  sources:
  - title: 'Wikipedia: Situation, task, action, result (STAR)'
    url: https://en.wikipedia.org/wiki/Situation,_task,_action,_result
    licence: CC-BY-SA
    kind: article
    lang: en
  - title: Федеральный закон «О персональных данных» 152-ФЗ (КонсультантПлюс)
    url: https://www.consultant.ru/document/cons_doc_LAW_61801/
    licence: proprietary-link
    kind: docs
    lang: ru
  - title: 'КонсультантПлюс: Кодекс профессиональной этики адвоката (подборка)'
    url: https://www.consultant.ru/law/podborki/kodeks_professionalnoj_jetiki_advokata/
    licence: proprietary-link
    kind: docs
    lang: ru
  - title: 'NN/g: Scrolling and Attention'
    url: https://www.nngroup.com/articles/scrolling-and-attention/
    licence: proprietary-link
    kind: article
    lang: en
