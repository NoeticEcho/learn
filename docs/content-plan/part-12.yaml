  - id: 12-storytelling/05-short-forms
    order: 5
    title: "Короткие формы: ABT, хребет Pixar, кисётэнкэцу"
    summary: "Вы получите три компактные формы, которые помещаются в предложение, абзац или пост: ABT («и… но… поэтому»),
      хребет Pixar и японскую форму из четырёх частей, где конфликт не нужен. После урока у вас есть подзаголовок
      первого экрана и две заготовки на потом."
    minutes: 25
    teaches:
      - story-pixar-spine
      - story-abt
      - story-kishotenketsu
    requires:
      - story-three-act
    diagram: "ThreeLooms: человек вводит семь фактов (можно свои), а они раскладываются по ABT, шести строкам хребта Pixar и
      четырём абзацам кисётэнкэцу; рядом «когда какая форма уместна»."
    practice: "Три короткие формы про ваш проект. Опишите свой проект тремя способами. Подзаголовок первого экрана напишите
      по ABT одним предложением: «…, но …, поэтому …». Он идёт на страницу. В заготовках заполните шесть строк хребта
      (жили-были, каждый день, но однажды, из-за этого, пока наконец, с тех пор) и четыре абзаца кисётэнкэцу: в третьем
      («тэн») нужен неожиданный поворот или новый факт, а не конфликт. Все «…» нужно заменить. Эпоха: 4. Шаг:
      story-short-forms."
    checks:
      - "В head нужен тег meta name=viewport: без него страница плохо выглядит на телефоне."
      - Ссылка с названием главного действия должна остаться в шапке.
      - В заготовках осталось многоточие «…». Замените его словами.
      - В подзаголовке осталось многоточие «…». Напишите предложение по ABT.
      - "Подзаголовок по ABT должен быть одним предложением: внутри не должно быть точек."
      - "Подзаголовок слишком короткий: в нём должны уместиться «и», «но» и «поэтому»."
      - "В подзаголовке нет слова «но»: именно оно называет препятствие."
      - "В подзаголовке нет слова «поэтому»: оно ведёт к вашему предложению."
      - В хребте должно быть ровно шесть строк.
      - "В кисётэнкэцу должно быть ровно четыре абзаца: ки, сё, тэн, кэцу."
      - "Опишите поворот хотя бы шестью словами: что неожиданного узнаёт читатель."
    sources:
      - title: And, But, Therefore statement (SESYNC Communications Toolkit)
        url: https://www.sesync.org/resources/communications-toolkit-and-therefore-statement
        licence: proprietary-link
        kind: article
        lang: en
