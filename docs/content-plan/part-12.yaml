lessons:
  - id: 12-storytelling/01-why-stories
    order: 1
    title: Почему истории работают
    summary: Вы поймёте, чем рассказ отличается от списка фактов и почему его читают иначе, и научитесь видеть на любой
      странице, где история помогает, а где мешает. После урока вы заменяете одно перечисление на своём сайте короткой
      сценой.
    minutes: 20
    teaches:
      - story-narrative-transport
      - story-story-vs-list
    requires:
      - start-brief-fields
    diagram: "ListOrStory: одни и те же шесть фактов выдуманной кофейни списком или сценой; человек читает одну версию,
      прячет и отвечает на три вопроса по памяти, счётчик показывает, сколько он вспомнил."
    practice: "Сцена вместо перечня. В разделе вашего сайта сейчас только список. Перед списком напишите в абзаце «сцену» из
      одного-трёх предложений: кто пришёл с какой бедой, что вы сделали, чем кончилось. В сцене должно быть число, дата
      или место, а оценок вроде «лучший» или «уникальный» не должно быть. Список оставьте под сценой. Многоточие «…»
      нужно заменить. Эпоха: 5. Шаг: story-scene."
    checks:
      - "Абзаца со сценой нет: в странице должен остаться элемент p с классом scene."
      - Сцена должна стоять прямо перед списком, а не после него.
      - В сцене осталось многоточие «…». Замените его своим текстом.
      - "Сцена слишком короткая: в ней должны уместиться человек, событие и итог."
      - Сцена длиннее трёх предложений. Уберите всё лишнее.
      - "В сцене нет ни одной цифры: добавьте число, дату или срок."
      - В сцене осталась оценка вроде «лучший» или «уникальный». Покажите факт вместо оценки.
      - "Список под сценой должен остаться: пунктов столько же, сколько в вашем брифе."
    sources:
