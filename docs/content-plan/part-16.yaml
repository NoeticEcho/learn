    licence: proprietary-link
    kind: article
    lang: en
  - title: 'Simon Willison: Two publishers and three authors fail to understand what “vibe coding” means'
    url: https://simonwillison.net/2025/May/1/not-vibe-coding/
    licence: proprietary-link
    kind: article
    lang: en
  - title: 'OWASP GenAI Security Project: LLM Top 10 risks'
    url: https://genai.owasp.org/llm-top-10/
    licence: CC-BY-SA
    kind: docs
    lang: en
