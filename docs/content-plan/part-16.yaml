  - id: 16-ai/03-prompts-as-briefs
    order: 3
    title: "Промпты как брифы: как ставить задачу ИИ"
    definition: "Промпт — задание для языковой модели; хороший устроен как бриф: цель, адресат, факты, ограничения, примеры тона и
      критерии готовности."
    summary: "Короткая просьба получает самый вероятный ответ, то есть шаблон. После урока вы пишете запрос так, как пишут бриф
      человеку: цель, аудитория, факты из своего брифа, ограничения, тон на примерах и критерии готовности, знаете, что не стоит
      отправлять модели, и сравниваете результат с короткой просьбой."
    minutes: 25
    teaches:
      - future.prompt-as-brief
    requires:
      - future.ai-site-builders
      - start.project-brief
      - copy.value-proposition-canvas
    diagram: "PromptLab: «Конструктор запроса» (part 16, lesson 3). The person ticks which parts of their own brief go into the prompt
      (who, for whom, the main action, sections, items, people, proofs, languages, examples of the tone, what not to do, what
      «done» means), and the page does two things: it assembles the prompt text, and shows what a typical model would make of it.
      The second part is a TEACHING MODEL, not a model: every field switches one feature of the imagined result on or off by a
      written rule (no brief fields, so the stand-in is the most probable page: a slogan, three cards, invented numbers). It
      counts the tells of a template page that are left. The text of the brief is the person's own; the page never leaves the
      browser."
    practice: "Составьте запрос, который можно дать и конструктору, и человеку-верстальщику. 1) В поле запроса замените «…» данными
      своего брифа: контекст (кто вы), цель, аудитория, главное действие в кавычках, все разделы, то, что вы предлагаете, люди,
      подтверждения (только настоящие из брифа), языки двухбуквенными кодами (ru, en), тон на двух своих фразах в «ёлочках» (не
      прилагательным), формат результата. Если в брифе нет людей или подтверждений, напишите «нет в брифе». 2) Под запросом
      впишите три запрета (каждый начинается с «Не») и три критерия готовности (измеримых). 3) Напишите, что из брифа вы не
      отправите модели (например телефон и почту). 4) Сравните с короткой просьбой в трёх-четырёх предложениях. Все «…» нужно
      заменить. Эпоха: 7."
    checks:
      - Блок «Структурированный запрос по брифу» (section id="prompt-brief") пропал. Верните его.
      - Остались многоточия «…». Замените каждое.
      - "В запросе нужно, кто вы и чем занимаетесь: слова из брифа."
      - "В запросе нужна аудитория: слова из брифа."
      - В запросе нужно главное действие посетителя словами из брифа.
      - В запросе должны быть все разделы из брифа.
      - "В запросе назовите, что вы предлагаете: названия из брифа."
      - В запросе назовите людей из брифа (или напишите, что их нет, если брифа с людьми нет).
      - "В запросе назовите подтверждения из брифа: только настоящие."
      - "Языки напишите кодами: ru, en."
      - Тон выразите двумя своими фразами в «ёлочках», каждая не короче восьми символов.
      - "В «Формат результата» напишите, что нужно получить: HTML и CSS, без внешних скриптов."
      - Первый запрет должен начинаться со слова «Не» и содержать несколько слов.
      - Второй запрет должен начинаться со слова «Не» и содержать несколько слов.
      - Третий запрет должен начинаться со слова «Не» и содержать несколько слов.
      - "Первый критерий готовности: не меньше четырёх слов."
      - "Второй критерий готовности: не меньше четырёх слов."
      - "Третий критерий готовности: не меньше четырёх слов."
      - "Назовите, что из брифа вы не отправите модели: телефон, почту, личные данные."
      - В сравнении скажите про короткую просьбу и про бриф, не меньше двенадцати слов.
      - "Сформулируйте вывод: в чём разница и почему."
    sources:
