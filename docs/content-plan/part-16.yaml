  - id: 16-ai/02-vibe-coding
    order: 2
    title: "Вайб-кодинг: что он даёт и чего стоит"
    definition: Вайб-кодинг — стиль работы с ИИ, при котором сгенерированный код принимают, не читая и не понимая; помощь ИИ
      отличается тем, что результат проверяют.
    summary: Вайб-кодинг значит принимать код от ИИ, не читая. После урока вы отличаете его от обычной работы с ИИ-помощником, знаете,
      что он честно даёт, и какие четыре вещи он ставит под угрозу (безопасность, поддерживаемость, понимание и деньги), и решаете
      для своего сайта, что можно отдать ИИ без проверки, что только с проверкой, а что нельзя вообще.
    minutes: 25
    teaches:
      - future.vibe-coding
    requires:
      - future.ai-site-builders
      - server.authentication
      - html.form-validation
    diagram: "RiskScale: «Шкала риска» (part 16, lesson 2). Cards of the tasks of a site, among them the person's own main action from
      the brief. Each card carries four plain facts: does it touch visitors' personal data, does it touch money, is it public at
      once, can a person see by looking that it is wrong. The person decides how much to trust the AI with it (without a check,
      with a check, a human), and the page answers with what the four facts suggest and why. The rule is written out below the
      cards: data and money weigh most, invisibility of a mistake next, publicity least. A teaching rule, not a standard. Cards
      are keyed by index, since one of them comes from the person's brief."
    practice: "Раздайте задачи по трём уровням. 1) Для каждой из десяти задач впишите в колонку «Уровень» ровно одно из: «ИИ без
      проверки», «ИИ с проверкой» или «человек», а в колонке справа скажите, как вы проверяете, или почему задача остаётся
      человеку. 2) Форму главного действия, приём заявок, оплату, политику, счётчик и секреты нельзя отдавать «без проверки». 3) В
      первом абзаце объясните почему (персональные данные, деньги, закон, утечка). 4) Во втором напишите, что остаётся человеку и
      сколько это работы (в часах, днях или долях). Все «…» нужно заменить. Эпоха: 7."
    checks:
      - Блок «Кому я доверяю каждую задачу» (section id="risk") пропал. Верните его.
      - Остались многоточия «…». Замените каждое.
      - В таблице должно остаться десять задач.
      - "В строке 1 в колонке «Уровень» должно быть одно из трёх: «ИИ без проверки», «ИИ с проверкой» или «человек»."
      - "В строке 2 в колонке «Уровень» должно быть одно из трёх: «ИИ без проверки», «ИИ с проверкой» или «человек»."
      - "В строке 3 в колонке «Уровень» должно быть одно из трёх: «ИИ без проверки», «ИИ с проверкой» или «человек»."
      - "В строке 4 в колонке «Уровень» должно быть одно из трёх: «ИИ без проверки», «ИИ с проверкой» или «человек»."
      - "Задачу 4 («Форма для действия «…»») нельзя отдавать «без проверки»: она затрагивает данные или деньги."
      - "В строке 5 в колонке «Уровень» должно быть одно из трёх: «ИИ без проверки», «ИИ с проверкой» или «человек»."
      - "Задачу 5 («Приём и хранение заявок») нельзя отдавать «без проверки»: она затрагивает данные или деньги."
      - "В строке 6 в колонке «Уровень» должно быть одно из трёх: «ИИ без проверки», «ИИ с проверкой» или «человек»."
      - "Задачу 6 («Оплата или предоплата») нельзя отдавать «без проверки»: она затрагивает данные или деньги."
      - "В строке 7 в колонке «Уровень» должно быть одно из трёх: «ИИ без проверки», «ИИ с проверкой» или «человек»."
      - "Задачу 7 («Политика обработки данных и согласие») нельзя отдавать «без проверки»: она затрагивает данные или деньги."
      - "В строке 8 в колонке «Уровень» должно быть одно из трёх: «ИИ без проверки», «ИИ с проверкой» или «человек»."
      - "В строке 9 в колонке «Уровень» должно быть одно из трёх: «ИИ без проверки», «ИИ с проверкой» или «человек»."
      - "Задачу 9 («Скрипт счётчика посещений») нельзя отдавать «без проверки»: она затрагивает данные или деньги."
      - "В строке 10 в колонке «Уровень» должно быть одно из трёх: «ИИ без проверки», «ИИ с проверкой» или «человек»."
      - "Задачу 10 («Секреты и настройки выкладки») нельзя отдавать «без проверки»: она затрагивает данные или деньги."
      - В колонке справа скажите, как вы проверяете, или почему задача остаётся человеку.
      - "Объясните, почему форма и платежи не «без проверки»: персональные данные, деньги, закон, утечка."
      - "Скажите, что остаётся человеку и сколько это работы: числом, в часах, днях или долях."
