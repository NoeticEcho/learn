  - id: 16-ai/05-capstone-builder
    order: 5
    title: "Итоговая работа: мини-конструктор «бриф, структура, тексты, код»"
    definition: Конвейер «бриф, структура, тексты, код» — цепочка запросов к модели, где выход каждого этапа проверяет обычный код,
      прежде чем он станет входом следующего.
    summary: Один большой запрос ломается там, где его не видно. После урока вы собираете конвейер из четырёх этапов с проверками
      между ними, понимаете, как устроен вызов модели по API (запрос, ключ, токены, ошибки), решаете, какие поля брифа уходят
      модели и когда нужна российская модель, и записываете проект своего мини-конструктора.
    minutes: 35
    teaches:
      - future.llm-api-basics
      - future.builder-pipeline
      - future.russian-llm
    requires:
      - future.prompt-as-brief
      - future.review-ai-output
      - js.fetch
      - js.json
      - server.rest
      - server.authentication
    diagram: "PipelineBuilder: «Мини-конструктор» (part 16, lesson 5). A pipeline of four stages, brief to structure to copy to code,
      with a check between the stages. NO MODEL RUNS HERE: each stage is a written rule that assembles its output from the
      person's own brief, so that the page works offline and costs nothing, and the page says so. What it shows is real: what goes
      into a stage, what comes out and in what format, and how a gate (a few lines of ordinary code, not another model) refuses an
      output that breaks the contract. Each stage can be told to «make a model mistake» (an extra section, an invented number, an
      external script and an image without alt) to watch its gate catch it. The gate on stage 4 parses the HTML in the browser, so
      it runs only after a click."
    practice: "Опишите конвейер своего мини-конструктора. 1) В таблице для каждого из четырёх этапов впишите вход (второй этап берёт
      выход первого, третий второго и так далее), что делает модель, выход с форматом и проверку перед следующим этапом. Проверка
      второго этапа сверяет структуру с брифом, третьего факты, четвёртого код (h1, alt, подписи, внешние скрипты). 2) В блоке
      структуры впишите JSON со всеми разделами брифа и подписью главной кнопки. 3) Скажите, какие факты разрешены в текстах,
      какие поля брифа уходят модели и какие не уходят. 4) Скажите, где хранится ключ (не в коде и не в архиве сайта) и когда вы
      возьмёте российскую модель. Все «…» нужно заменить. Эпоха: 7."
    checks:
      - Блок «Мой конвейер» (section id="pipeline-plan") пропал. Верните его.
      - Остались многоточия «…». Замените каждое.
      - В таблице должно остаться четыре этапа.
      - "Вход второго этапа это выход первого: назовите JSON или бриф."
      - "Вход третьего этапа это структура со второго: назовите её."
      - "Вход четвёртого этапа это тексты (и структура): назовите их."
      - "Выход второго этапа: JSON."
      - "Проверка второго этапа сверяет структуру с брифом: схема, названия разделов."
      - "Проверка третьего этапа сверяет факты: числа и имена есть в items и proofs брифа."
      - "Проверка четвёртого этапа смотрит код: h1, alt, подписи полей, внешние скрипты."
      - В JSON структуры должны быть все разделы из брифа, каждый назван полностью.
      - В JSON структуры нужна подпись главной кнопки словами из брифа.
      - "Скажите, какие факты разрешены: items и proofs брифа, а выдумывать запрещено."
      - Назовите поля брифа, которые уходят модели (публичные).
      - "Назовите, что не уходит: телефон, почта, личные данные."
      - "Скажите, где хранится ключ: в настройках, у вас в браузере или на сервере."
      - Скажите, что ключ не попадает в код страницы, архив и репозиторий.
      - Не вписывайте сюда сам ключ. Только где он хранится.
      - "Скажите, когда нужна российская модель: персональные данные граждан России, 152-ФЗ."
