- id: 16-future/07-iskin-and-next
  order: 7
  title: Интернет интеллекта, Искин и куда идти дальше
  summary: 'Зачем: увидеть, куда движется веб (от страниц к диалогу и действиям, от сайта к сервису), и пройти путь «бриф
    и интервью → сайт и сервис» с Искином, того, что в прологе показывали, но теперь самому. После урока человек создаёт сайт
    из своего brief и знает, как продолжать учиться.'
  minutes: 25
  teaches:
  - future.internet-of-intelligence
  - future.iskin-flow
  - future.next-steps
  requires:
  - future.agentic-web
  - future.builder-pipeline
  - quality.prelaunch-checklist
  - growth.seo-crawl-index-rank
  diagram: 'Повтор пролога: «Сейчас вы сделаете это сами»: Искин задаёт вопросы интервью, ответы появляются в brief, и сайт
    собирается эпоха за эпохой; в конце галерея восьми версий рядом.'
  practice: 'Эпоха 8 (бриф и интервью): пройти интервью с Искином по всем полям brief (who, forWhom, mainAction, sections,
    items, people, proofs, contacts, languages, tone), собрать сайт и сервис (форма, запись, ответы на вопросы), прогнать
    чек-лист запуска и записать план: первые 30 дней после запуска и три темы для дальнейшего изучения.'
  checks:
  - Интервью заполнило все поля brief без пустых.
  - Сайт собран и соответствует brief.sections.
  - Чек-лист запуска пройден, красных пунктов нет.
  - План на 30 дней содержит метрику, связанную с brief.mainAction.
  - Названы три темы для дальнейшего изучения.
  sources:
