  - id: 16-ai/08-next
    order: 8
    title: Интернет интеллекта, запуск и куда идти дальше
    definition: Интернет интеллекта — сеть, где рядом с людьми действуют ИИ-агенты, а сайт из страницы становится диалогом и сервисом;
      это направление, а не факт.
    summary: Вы прошли путь от первой страницы до агентной сети. После урока вы видите, куда может двигаться веб и что при любом
      сценарии останется ценным, проходите чек-лист запуска, составляете план первых тридцати дней с метрикой, привязанной к
      главному действию вашего проекта, и выбираете три темы для дальнейшего изучения.
    minutes: 30
    teaches:
      - future.internet-of-intelligence
      - future.next-steps
    requires:
      - future.iskin-flow
      - future.agentic-web
      - growth.seo-crawl-index-rank
      - infra.backups
    diagram: "EraReplay: «Восемь эпох одного сайта» (part 16, lesson 8). The prologue promised the person's own site in every era and
      this is the answer: a slider across the eight eras of the course, with the person's own name and main action drawn in each
      era's manner, and, beside it, what the era's tools changed and what stayed the same. The drawings are a few lines of CSS per
      era, not screenshots, and the words are the person's own brief. The last era is not history but a direction (a brief, an
      interview, and a check by a person), and the page says so."
    practice: "Проведите итог. 1) В чек-листе против каждого из двенадцати пунктов впишите честный статус: «да», «не нужно» или срок
      исправления в виде «до 15.11». Красных пунктов без срока быть не должно. 2) Назовите главную метрику и целевое число, связав
      её с главным действием проекта словами из брифа (например, число обращений в неделю). 3) Распишите четыре недели после
      запуска: в первой запуск и настройка счёта метрики, остальные не короче четырёх слов. 4) Выберите три темы для изучения
      дальше, каждая не короче трёх слов и из тем курса. Все «…» нужно заменить. Эпоха: 8."
    checks:
      - Блок «Запуск и первые тридцать дней» (section id="launch") пропал. Верните его.
      - Остались многоточия «…». Замените каждое.
      - В чек-листе должно остаться двенадцать пунктов.
      - "Пункт 1 («Сайт открывается по https, а http перенаправляет на него»): статус только «да», «не нужно» или срок вида «до
        15.11»."
      - "Пункт 2 («Адреса с www и без www открываются, основной выбран»): статус только «да», «не нужно» или срок вида «до 15.11»."
      - "Пункт 3 («У картинок есть alt, у полей подписи»): статус только «да», «не нужно» или срок вида «до 15.11»."
      - "Пункт 4 («Контраст текста не ниже 4,5, страница проходится клавишей Tab»): статус только «да», «не нужно» или срок вида
        «до 15.11»."
      - "Пункт 5 («Один h1, заголовки идут по порядку»): статус только «да», «не нужно» или срок вида «до 15.11»."
      - "Пункт 6 («Каждый факт и цифра подтверждены, выдуманных нет»): статус только «да», «не нужно» или срок вида «до 15.11»."
      - "Пункт 7 («Форма: согласие, политика, https, данные в российской базе»): статус только «да», «не нужно» или срок вида «до
        15.11»."
      - "Пункт 8 («Нет чужих скриптов и ключей в коде»): статус только «да», «не нужно» или срок вида «до 15.11»."
      - "Пункт 9 («Быстро открывается на телефоне: размеры картинок, вес страницы»): статус только «да», «не нужно» или срок вида
        «до 15.11»."
      - "Пункт 10 («У страниц есть title, описание и превью ссылки»): статус только «да», «не нужно» или срок вида «до 15.11»."
      - "Пункт 11 («Копии и мониторинг настроены, восстановление проверено»): статус только «да», «не нужно» или срок вида «до
        15.11»."
      - "Пункт 12 («Счётчик и cookie описаны в политике (если они есть)»): статус только «да», «не нужно» или срок вида «до
        15.11»."
      - Метрика должна называть главное действие проекта словами из брифа.
      - В метрике нужно целевое число.
      - Первая неделя про запуск, счётчик или проверку главного действия.
      - "Вторая неделя: не меньше четырёх слов."
      - "Третья неделя: не меньше четырёх слов."
      - "Четвёртая неделя: не меньше четырёх слов."
      - "Первая тема: не меньше трёх слов."
      - "Вторая тема: не меньше трёх слов."
      - "Третья тема: не меньше трёх слов."
