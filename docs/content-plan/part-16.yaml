  - id: 16-ai/04-review-ai-output
    order: 4
    title: "Проверка результата ИИ: ошибки, которые выглядят правдоподобно"
    definition: "Проверка результата ИИ — ревью по порядку: факты, работа, безопасность, данные и закон, доступность, приметы шаблона.
      Ошибки в выдаче выглядят правдоподобно."
    summary: ИИ пишет уверенно, и ошибки в его выдаче выглядят как правда. После урока вы знаете, какие бывают ошибки (выдуманные
      факты, ключи в коде, форма без согласия, чужие картинки, недоступные кнопки), проверяете выдачу в нужном порядке и находите
      и исправляете настоящие ошибки на странице, которую «написал ИИ», с журналом найденного.
    minutes: 30
    teaches:
      - future.review-ai-output
      - future.ai-failure-modes
    requires:
      - future.vibe-coding
      - future.prompt-as-brief
      - design.ai-tells
      - html.form-validation
    diagram: "ErrorHunt: «Найдите ошибки» (part 16, lesson 4). A page that an AI «wrote» is shown as a list of its elements, a dozen
      of them wrong in the ways AI pages usually are (an invented claim, an invented review, an image without alt, a control made
      of a div, a key in the code, a form that sends by http and by GET, fields without labels, no consent, an English button, a
      slogan, a stock picture from a third-party host) and a few that are right. The person marks what they think is wrong; the
      page then counts what they found, what they missed and what they flagged without cause, and says for each error why it is
      one and how it is fixed. Honest limits: the page is a constructed example, not the output of a real tool. Elements are keyed
      by index."
    practice: "Страница ниже «написана ИИ» и содержит настоящие ошибки. Исправьте их прямо в коде. 1) Уберите лозунг из заголовка и
      выдуманные цифры и отзыв, подтверждения возьмите из брифа (списком). 2) У картинки нужен alt, и она не должна идти с чужого
      сервера. 3) Вместо «кнопки» из div сделайте ссылку с подписью главного действия из брифа. 4) Уберите ключ из скрипта. 5)
      Форма: адрес по https, метод post, подписи у полей (label) и обязательное согласие со ссылкой на политику. 6) В журнале
      запишите пять найденных ошибок (что, где, как исправили, не меньше четырёх слов в каждой) и порядок, в котором вы
      проверяете. Все «…» нужно заменить. Эпоха: 7."
    checks:
      - Блок «Журнал проверки» (section id="review") пропал. Верните его.
      - Остались многоточия «…». Замените каждое.
      - В заголовке остался лозунг «инновационные решения». Назовите проект.
      - В заголовке должно быть название проекта.
      - В подтверждениях остались выдуманные цифры или отзыв (15 лет, 1200, 99,9, «лучший специалист»). Удалите.
      - "В подтверждениях должны быть настоящие подтверждения из брифа: по одному в пункте списка."
      - У картинки нет атрибута alt. Опишите её или поставьте alt="" для декоративной.
      - Картинка идёт со стороннего сервера. Замените на свой файл.
      - Осталась «кнопка» из div с onclick. Замените настоящей ссылкой или кнопкой.
      - Ссылка-кнопка должна называться главным действием проекта словами из брифа.
      - "В скрипте остался ключ. Удалите его: секреты хранятся на сервере, а не в коде страницы."
      - Форма отправляет по http. Используйте https.
      - Форма отправляет методом GET. Используйте post.
      - У какого-то поля формы нет подписи label.
      - В форме нужен обязательный флажок согласия (input type="checkbox" required).
      - В форме нужна ссылка на политику обработки данных (адрес со словом politika).
      - "Первая запись журнала: не меньше четырёх слов."
      - "Вторая запись журнала: не меньше четырёх слов."
      - "Третья запись журнала: не меньше четырёх слов."
      - "Четвёртая запись журнала: не меньше четырёх слов."
      - "Пятая запись журнала: не меньше четырёх слов."
      - В порядке проверки назовите факты.
      - В порядке проверки назовите безопасность (ключи, форма).
      - В порядке проверки назовите данные и закон (согласие, 152-ФЗ).
