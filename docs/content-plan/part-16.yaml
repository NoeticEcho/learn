- id: 16-future/06-agentic-web
  order: 6
  title: 'Агентная сеть: MCP, A2A, агенты как посетители'
  summary: 'Зачем: понять, как ИИ-агенты используют сайты и сервисы: через MCP получают инструменты и данные, через A2A разговаривают
    друг с другом, как посетители читают сайт и совершают действия. После урока человек решает, что его сайт отдаёт агентам
    и как это защитить.'
  minutes: 25
  teaches:
  - future.agentic-web
  - future.mcp
  - future.a2a
  - future.agents-as-visitors
  requires:
  - future.builder-pipeline
  - server.webhooks
  - growth.geo
  - quality.owasp-basics
  diagram: 'Три участника: человек, агент, сайт. Человек выбирает, какие действия сайта доступны агенту (прочитать цены, записаться,
    спросить), и симулятор показывает, как агент их вызывает по MCP и что видит, а блок рисков показывает подмену инструкций
    в описании инструмента.'
  practice: 'Эпоха 8: описать для brief.mainAction и brief.items четыре действия, которые сайт готов отдать агенту (чтение,
    запись, вопрос, оплата), для каждого формат, права и подтверждение человеком; решить, нужны ли llms.txt, MCP-сервер или
    NLWeb и какие данные нельзя отдавать вообще.'
  checks:
  - Описано четыре действия с форматом и правами.
  - Для записи и оплаты предусмотрено подтверждение человеком.
  - Названы данные из brief.contacts и brief.people, которые не отдаются агентам.
  - 'Названы риски MCP: подмена инструкций, лишние права.'
  - Решение по llms.txt, MCP или NLWeb обосновано.
  sources:
