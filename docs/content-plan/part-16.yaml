lessons:
- id: 16-future/01-ai-builders
  order: 1
  title: 'ИИ-конструкторы сайтов: bolt, v0, Tilda AI'
  summary: 'Зачем: понимать, что именно делают ИИ-конструкторы, чем они отличаются друг от друга (код против блоков, веб-приложение
    против страницы) и когда выбрать каждый. После урока человек строит страницу по своему brief в одном из них и описывает,
    что получилось и что нет.'
  minutes: 20
  teaches:
  - future.ai-site-builders
  requires:
  - cms.choosing-stack
  - cms.tilda
  - js.svelte-component
  - infra.ci-cd
  diagram: 'Таблица сравнения «что выходит»: один и тот же бриф подаётся на три шаблонных «конструктора» (кодовый, блочный,
    генератор приложений); человек сравнивает результат по структуре, коду, доступности и стоимости.'
  practice: 'Эпоха 7 (AI-конструктор): взять brief целиком (who, forWhom, mainAction, sections, items, tone) как первый промпт,
    получить главную страницу в выбранном конструкторе, сохранить ссылку или экспорт и записать три вещи, которые получились,
    и три, которые пришлось исправить. Для российской аудитории проверить, где хранятся данные и работают ли оплата и мессенджеры.'
  checks:
  - Первый промпт содержит все основные поля brief.
  - Получена страница с разделами из brief.sections.
  - Записаны три удачи и три исправления.
  - Указано, где хранятся данные и какие сервисы доступны в России.
  - Выбор конструктора объяснён типом проекта.
  sources:
  - title: 'bolt.new: AI builder for websites, apps and prototypes'
    url: https://bolt.new/
    licence: proprietary-link
    kind: docs
    lang: en
  - title: 'v0 by Vercel: What is v0?'
