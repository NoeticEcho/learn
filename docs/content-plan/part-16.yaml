- id: 16-future/05-capstone-builder
  order: 5
  title: 'Итоговая работа: мини-конструктор «бриф → структура → тексты → код»'
  summary: 'Зачем: собрать собственный конвейер, который по брифу строит сайт: этапы, их формат, проверки и ключ человека.
    После урока человек получает работающий в приложении мини-конструктор, который создаёт структуру, тексты и код по его
    brief.'
  minutes: 30
  teaches:
  - future.llm-api-basics
  - future.builder-pipeline
  - future.russian-llm
  requires:
  - future.prompt-as-brief
  - future.review-ai-output
  - js.fetch
  - server.rest
  - server.authentication
  diagram: 'Конвейер из четырёх этапов: бриф, структура (JSON), тексты (по разделам), код (HTML и CSS); человек запускает
    каждый на своём ключе, видит промежуточные результаты и ставит проверки между этапами; счётчик токенов и стоимости.'
  practice: 'Эпоха 7/8: в приложении подключить свой ключ (хранится только локально), настроить четыре этапа по brief: структура
    из brief.sections, тексты по brief.tone и brief.languages, код с доступностью и без внешних скриптов; добавить проверки
    между этапами (схема JSON, факты из brief.items и brief.proofs); сохранить результат в zip. Описать, какие данные брифа
    уходят модели, и когда их нужно обезличить или использовать российскую модель.'
  checks:
  - Есть четыре этапа, и вход каждого берётся из выхода предыдущего.
  - Структура соответствует brief.sections, и тексты не содержат фактов вне brief.items и brief.proofs.
  - Ключ не уходит на сервер и не попадает в zip.
  - Между этапами есть проверка схемы или фактов.
  - Описано, какие поля брифа уходят модели.
  sources:
  - title: 'Anthropic: Building effective agents'
    url: https://www.anthropic.com/engineering/building-effective-agents
    licence: proprietary-link
    kind: article
    lang: en
  - title: 'Claude docs: Prompt engineering overview'
    url: https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/overview
    licence: proprietary-link
    kind: docs
    lang: en
  - title: 'Yandex AI Studio: документация'
    url: https://aistudio.yandex.ru/docs/ru/
    licence: proprietary-link
    kind: docs
    lang: ru
  - title: 'GigaChat API: руководства для разработчиков'
    url: https://developers.sber.ru/docs/ru/gigachat/overview
    licence: proprietary-link
    kind: docs
    lang: ru
  - title: Федеральный закон «О персональных данных» 152-ФЗ (КонсультантПлюс)
    url: https://www.consultant.ru/document/cons_doc_LAW_61801/
    licence: proprietary-link
    kind: docs
