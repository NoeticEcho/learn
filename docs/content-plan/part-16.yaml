  - title: Вайб кодинг полный гайд на реальных проектах в Cursor AI и ChatGPT (Олег Малышев)
    url: https://www.youtube.com/watch?v=yYxrQbP7fsU
    lang: ru
- id: 16-future/03-prompts-as-briefs
  order: 3
  title: Промпты как брифы
  summary: 'Зачем: писать задания для ИИ так, как пишут бриф человеку: цель, адресат, ограничения, примеры, критерии готовности.
    После урока человек превращает свои поля brief в структурированный промпт и проверяет, чем он лучше короткой просьбы.'
  minutes: 20
  teaches:
  - future.prompt-as-brief
  requires:
  - future.ai-site-builders
  - start.project-brief
  - copy.value-proposition-canvas
  diagram: 'Редактор промпта с полями brief: who, forWhom, mainAction, sections, items, tone; рядом сравнение трёх результатов
    на «коротком», «структурированном» и «с примерами» промптах.'
  practice: 'Эпоха 7: собрать промпт из всех полей brief (who, forWhom, mainAction, sections, items, people, proofs, contacts,
    languages, tone), добавить ограничения и критерии готовности, запустить два раза и сравнить с короткой просьбой.'
  checks:
  - Промпт использует все поля brief.
  - Указаны ограничения (чего не делать) и критерии готовности.
  - Тон из brief.tone выражен примерами, а не одним прилагательным.
  - Сравнение двух запусков записано, и вывод сформулирован.
  sources:
  - title: 'Claude docs: Prompt engineering overview'
    url: https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/overview
    licence: proprietary-link
    kind: docs
    lang: en
  - title: 'Anthropic: Building effective agents'
    url: https://www.anthropic.com/engineering/building-effective-agents
    licence: proprietary-link
    kind: article
    lang: en
  - title: 'Wikipedia: Vibe coding'
    url: https://en.wikipedia.org/wiki/Vibe_coding
    licence: CC-BY-SA
    kind: article
    lang: en
  videos: []
- id: 16-future/04-review-ai-output
  order: 4
  title: Проверка результата ИИ
  summary: 'Зачем: проверять страницы и код, созданные ИИ, по списку: выдуманные факты, заметные «признаки ИИ», доступность,
    безопасность, персональные данные, лицензии. После урока человек знает порядок ревью и ведёт журнал исправлений.'
  minutes: 25
  teaches:
  - future.review-ai-output
  - future.ai-failure-modes
  requires:
  - future.vibe-coding
  - quality.prelaunch-checklist
  - design.ai-tells
  diagram: 'Страница с намеренно вставленными ошибками: выдуманное достижение, нет alt, ключ в коде, форма без согласия, ссылка
    в никуда; человек кликает по ошибкам, а сводка показывает, какие он нашёл.'
  practice: 'Эпоха 7: взять страницу из первого урока и провести ревью: факты (сверка с brief.proofs), доступность, безопасность
    формы, персональные данные, лицензии, «признаки ИИ» в дизайне и тексте; записать найденное и исправления.'
  checks:
  - Каждый факт сверен с brief.proofs, выдуманные удалены.
  - Проверены доступность, форма, 152-ФЗ и лицензии.
  - Журнал содержит не менее пяти найденных проблем и исправлений.
  - Удалены шаблонные формулировки, не соответствующие brief.tone.
  sources:
  - title: 'OWASP GenAI Security Project: LLM Top 10 risks'
    url: https://genai.owasp.org/llm-top-10/
    licence: CC-BY-SA
    kind: docs
    lang: en
  - title: OWASP Top 10
    url: https://top10.owasp.org/
    licence: CC-BY-SA
    kind: docs
    lang: en
  - title: 'W3C: Web Content Accessibility Guidelines (WCAG) 2.2'
    url: https://www.w3.org/TR/WCAG22/
    licence: link-only
    kind: spec
    lang: en
