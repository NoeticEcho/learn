    lang: en
  videos: []
- id: 16-future/02-vibe-coding
  order: 2
  title: 'Вайб-кодинг: что он даёт и чего стоит'
  summary: 'Зачем: различать вайб-кодинг (код принимается без проверки) и ИИ-помощь профессионала, знать, где вайб-кодинг
    уместен (одноразовое, прототип) и где опасен (персональные данные, деньги). После урока человек решает, какие части сайта
    можно отдать ИИ, а какие нет.'
  minutes: 20
  teaches:
  - future.vibe-coding
  requires:
  - future.ai-site-builders
  - quality.owasp-basics
  diagram: Шкала «риск ↔ польза» с карточками задач проекта (лендинг, форма, оплата, админка, обработка данных); человек раскладывает
    их, и сервис предлагает уровень проверки для каждой.
  practice: 'Эпоха 7: разбить сайт проекта на 8–10 задач из brief.sections и brief.items, для каждой отметить «ИИ без проверки
    / ИИ с проверкой / человек», а для персональных данных и платежей записать причину.'
  checks:
  - Все задачи отнесены к одному из трёх уровней.
  - Форма с персональными данными и платежи не отнесены к «без проверки».
  - Для каждой задачи с проверкой назван способ проверки.
  - В итоге указан объём работы, который остаётся человеку.
  sources:
  - title: 'Wikipedia: Vibe coding'
    url: https://en.wikipedia.org/wiki/Vibe_coding
    licence: CC-BY-SA
    kind: article
    lang: en
