lessons:
  - id: 16-ai/01-ai-builders
    order: 1
    title: "ИИ-конструкторы сайтов: bolt, Lovable, v0, Tilda AI и вопросы к любому из них"
    definition: "ИИ-конструктор сайта — сервис, который по описанию словами собирает сайт: кодом, из готовых блоков или целым
      приложением с базой данных."
    summary: "Вы описываете сайт словами, и через минуту он собран. После урока вы понимаете, чем отличаются виды ИИ-конструкторов
      (код, блоки, приложение с базой), умеете измерить то, что они выдали, знаете семь вопросов, которые стоит задать любому из
      них, и составляете свой первый запрос по брифу. Названия и возможности датированы октябрём 2026 года: рынок меняется за
      месяцы."
    minutes: 25
    teaches:
      - future.ai-site-builders
    requires:
      - start.project-brief
      - server.stack-choice
      - js.svelte-component
      - infra.deploy-own-site
      - design.ai-tells
    diagram: "BuilderCompare: «Что выходит из конструктора» (part 16, lesson 1). One brief, three kinds of AI builder, and a table of
      what came out. The three pages are written for this lesson from the habits of the kinds (a code generator, a block builder,
      a generator of a whole application with a back end): they are NOT the output of any real product, and the page says so. The
      numbers beside them are not made up: they are counted from the generated HTML by the browser itself (headings, landmarks,
      images without alt, controls that are not buttons, form fields without a label, scripts, nodes, bytes, third-party hosts),
      so the person can see how to measure a page they receive from a real tool. The brief's name, who, sections, items and main
      action fill the pages."
    practice: "Составьте запись о первом запуске ИИ-конструктора. 1) В «Первом запросе» замените «…» данными своего брифа: кто и чем
      занимается, для кого, главное действие посетителя (в кавычках), все разделы, что вы предлагаете, тон и то, чего делать
      нельзя. 2) Скажите, какой конструктор или вид вы выбрали и почему, исходя из типа проекта. 3) Если вы пробовали конструктор,
      запишите три удачи и три вещи, которые пришлось исправить. Если не пробовали, разберите так три страницы из схемы выше.
      Каждый пункт не короче трёх слов. 4) Скажите, где хранятся данные и какие сервисы (оплата, мессенджеры, формы) доступны в
      России. Все «…» нужно заменить. Эпоха: 7."
    checks:
      - Блок «Мой первый запуск ИИ-конструктора» (section id="builder-log") пропал. Верните его.
      - Остались многоточия «…». Замените каждое.
      - "В запросе нужно, кто вы и чем занимаетесь: слова из брифа."
      - "В запросе нужно, для кого сайт: слова из брифа."
      - В запросе нужно главное действие посетителя словами из брифа.
      - В запросе должны быть все разделы из брифа, каждый назван полностью.
      - "В запросе назовите, что вы предлагаете: названия из брифа."
      - "В строке «Тон» выразите тон словами: спокойный, тёплый, формальный."
      - В строке «Чего не делать» запишите хотя бы одно «не…».
      - Назовите конструктор или вид (код, блоки, приложение).
      - Объясните, почему этот выбор подходит вашему проекту.
      - В первой удаче нужно не меньше трёх слов.
      - Во второй удаче нужно не меньше трёх слов.
      - В третьей удаче нужно не меньше трёх слов.
      - В первом исправлении нужно не меньше трёх слов.
      - Во втором исправлении нужно не меньше трёх слов.
      - В третьем исправлении нужно не меньше трёх слов.
      - "Скажите, где хранятся данные: платформа, облако, страна."
      - Скажите, какие сервисы (оплата, мессенджеры, формы) работают в России, или что они не нужны.
