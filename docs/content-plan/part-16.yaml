  - id: 16-ai/07-iskin-capstone
    order: 7
    title: "Итоговая работа с Искином: интервью, сайт и критическая проверка"
    definition: Интервью с Искином — разговор, где ИИ задаёт вопросы по полям брифа и по ответам собирает сайт и сервис; результат
      проверяет человек.
    summary: "Искин не ждёт запроса, а расспрашивает о деле и собирает из ответов сайт и сервис. После урока вы знаете, как устроено
      такое интервью и что оно решает, а чего не решает за вас, и проверяете «черновик Искина» на своём проекте всем, чему
      научились: доступностью, смысловой разметкой, текстом и скоростью. Итог работы: найденные и исправленные ошибки и честный
      ответ, готов ли сайт."
    minutes: 40
    teaches:
      - future.iskin-flow
      - future.capstone-review
    requires:
      - future.review-ai-output
      - future.agentic-web
      - future.builder-pipeline
      - html.a11y-basics
      - css.contrast
    diagram: "IskinInterview: «Интервью с Искином» (part 16, lesson 7). Искин is the course's name for a builder that does not wait
      for a prompt but asks: one question for each field of the brief, one at a time. The person answers (their own brief fills
      the answers in, to edit, or they say «не знаю»), and the page shows what an interviewer would do with the answers: the brief
      filling up, what is still empty, the structure of the site, the parts of the service that the main action needs (a form and
      a receiver, a booking, an order), and what is NOT decided for the person: facts, legal texts, payments, publishing. A
      SCRIPTED demonstration: the questions are written in advance and no model runs; the page says so. Everything stays in the
      browser."
    practice: 'Искин собрал черновик страницы по вашему брифу, но в нём есть ошибки четырёх видов. Исправьте их прямо в коде и в
      стилях. Доступность: у картинки нужен alt, у поля подпись label, а серый текст .note слишком бледный (контраст не ниже 4,5,
      цвет задаётся в styles.css). Смысловая разметка: один h1, названия разделов должны быть заголовками h2 (сейчас div, а потом
      h4), список предложений настоящим списком ul вместо строк с br. Тексты: уберите пустые формулы и восклицательные знаки,
      вместо «Подробнее» напишите что-то понятное без этого слова, на кнопке формы название главного действия из брифа. Скорость:
      у каждой картинки width и height, нижняя картинка loading="lazy", а главная (hero) не lazy, и никаких чужих скриптов и
      шрифтов. Запишите в журнал не меньше шести находок и скажите, готов ли сайт к запуску. Все «…» нужно заменить. Эпоха: 8.'
    checks:
      - Блок «Журнал итоговой проверки» (section id="cap") пропал. Верните его.
      - Остались многоточия «…». Замените каждое.
      - На странице должен быть ровно один заголовок h1.
      - "Остался заголовок h4: после h2 идёт h3, а не h4. Замените на h2."
      - Каждый раздел из брифа должен быть заголовком h2.
      - Остались «заголовки» из div с классом title. Замените настоящими h2.
      - Предложения должны быть списком ul с пунктами li, по одному на предложение.
      - Остались переносы br внутри абзаца. Сделайте настоящий список.
      - У какой-то картинки нет alt.
      - У каждой картинки нужны атрибуты width и height.
      - Нижней картинке (класс below) нужен loading="lazy".
      - 'Главную картинку (класс hero) откладывать нельзя: уберите у неё loading="lazy".'
      - У какого-то поля формы нет подписи label.
      - "Текст .note слишком бледный: темнее цвет в styles.css, контраст не ниже 4,5."
      - Кнопка формы должна называться главным действием проекта словами из брифа.
      - В тексте остались восклицательные знаки. Уберите их.
      - В тексте остались пустые формулы («рада помочь», «новых высот», «профессионалов»).
      - Слово «Подробнее» не говорит, куда ведёт ссылка. Замените понятным текстом.
      - Остались чужие скрипт или шрифт с внешнего сервера. Уберите их.
      - "Первая запись журнала: не меньше четырёх слов."
      - "Вторая запись журнала: не меньше четырёх слов."
      - "Третья запись журнала: не меньше четырёх слов."
      - "Четвёртая запись журнала: не меньше четырёх слов."
      - "Пятая запись журнала: не меньше четырёх слов."
      - "Шестая запись журнала: не меньше четырёх слов."
      - Назовите в «Что я проверил» доступность.
      - Назовите в «Что я проверил» семантику или смысловую разметку.
      - Назовите в «Что я проверил» тексты.
      - Назовите в «Что я проверил» скорость.
      - "Скажите, готов ли сайт к запуску и что остаётся человеку: не меньше десяти слов."
    sources:
      - title: "W3C WAI: Images tutorial"
