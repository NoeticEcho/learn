  - id: 16-ai/06-agentic-web
    order: 6
    title: "Агентная сеть: MCP, A2A и агенты как посетители"
    definition: MCP — открытый протокол, по которому ИИ-агент вызывает инструменты и читает данные внешней системы; стороны
      обмениваются сообщениями JSON-RPC.
    summary: Посетителем сайта всё чаще бывает не человек, а ИИ-агент, который читает страницы и вызывает действия. После урока вы
      знаете, как агент находит и использует сайт (разметка, structured data, API, MCP, NLWeb), чем A2A отличается от MCP, какие
      риски несёт каждая «дверь» (подмена инструкций, лишние права) и решаете, что ваш сайт отдаёт агентам, с подтверждением
      человека и без личных данных.
    minutes: 30
    teaches:
      - future.agentic-web
      - future.mcp
      - future.a2a
      - future.agents-as-visitors
    requires:
      - future.builder-pipeline
      - server.rest
      - server.webhooks
      - growth.geo
      - js.json
    diagram: "AgentDoors: «Двери для агента» (part 16, lesson 6). Three parties: a person, their AI agent, and the site. The site's
      owner (the learner) decides which of four actions the site hands to an agent (read the offers, ask a question, book, pay)
      and at what level (off; for writing and paying: only with a person's confirmation, or without). The person tells the agent,
      in words, to book the site's own main action; the page plays the agent's calls out as tool calls and shows what each choice
      costs. A switch plants an instruction in a tool's description, the way a poisoned tool does, and a second switch lets a tool
      return the owner's contacts; together with the levels they show when the planted instruction can do harm. A TEACHING MODEL:
      no agent, no protocol runs here; the calls are written out by hand in the spirit of MCP (a name, arguments, a result)."
    practice: "Решите, какие «двери» вы открываете агентам. 1) Для каждого из четырёх действий впишите формат (как оно доступно:
      страница, форма, API, MCP-сервер), права (чтение, запись одного слота, нет) и подтверждение человека (для записи и оплаты
      оно должно быть, или «не предлагается»). 2) Назовите данные, которые вы не отдаёте агентам вообще (телефон, почта, личные
      данные людей). 3) Назовите риски (подмена инструкций и лишние права) и как вы их учитываете. 4) Решите про llms.txt, MCP или
      NLWeb: делаете или нет, и почему (не короче восьми слов). Все «…» нужно заменить. Эпоха: 8."
    checks:
      - Блок «Что мой сайт отдаёт агентам» (section id="agent-plan") пропал. Верните его.
      - Остались многоточия «…». Замените каждое.
      - В таблице должно остаться четыре действия.
      - "Чтение предложений открывается только для чтения: скажите это."
      - "Запись открывайте минимальными правами: один слот, без отмены чужих записей."
      - "Для записи нужно подтверждение человека: напишите, кто и как подтверждает."
      - Для оплаты нужен человек, или скажите, что оплаты нет («не предлагается»).
      - "В колонке «Формат» назовите, как действие доступно: страница, форма, API, MCP или «не предлагается»."
      - "Назовите данные, которые не отдаются агентам: телефон, почта, личные данные."
      - Назовите риск подмены инструкций (скрытая инструкция в описании или тексте).
      - Назовите риск лишних прав и как вы его ограничиваете.
      - Скажите, что решили про llms.txt, MCP или NLWeb.
      - Объясните решение не короче восьми слов, с причиной («потому что…»).
