- id: 15-quality/08-prelaunch
  order: 8
  title: Предзапусковый чек-лист
  summary: 'Зачем: собрать в один список всё, что проверяется перед запуском: скорость, доступность, безопасность, право,
    SEO, аналитику, резервные копии и откат. После урока человек пройдёт чек-лист по собственному сайту и получает отчёт «готов
    / не готов».'
  minutes: 25
  teaches:
  - quality.prelaunch-checklist
  requires:
  - quality.core-web-vitals
  - quality.wcag22
  - quality.security-headers
  - quality.152fz
  - quality.cookies
  - quality.copyright-images
  - quality.ad-law-ethics
  - growth.technical-seo
  - infra.backups
  diagram: 'Панель запуска: 30 пунктов в шести группах, каждый открывает мини-проверку на живом превью сайта человека; итоговая
    шкала готовности и список блокирующих ошибок.'
  practice: 'Эпоха 8: пройти чек-лист по сайту проекта, записать для каждого блока «зелёный / жёлтый / красный» и план исправлений;
    проверить, что brief.mainAction выполняется на телефоне и без JavaScript там, где это возможно; убедиться в наличии резервной
    копии и способа откатить публикацию.'
  checks:
  - Пройдены все шесть блоков чек-листа с отметкой по каждому.
  - Красные пункты имеют срок и ответственного.
  - brief.mainAction проверен на телефоне.
  - Есть резервная копия и описан откат.
  - Контакты из brief.contacts работают и совпадают во всех местах.
  sources:
  - title: 'web.dev: Web Vitals'
    url: https://web.dev/articles/vitals
    licence: CC-BY
    kind: article
    lang: en
  - title: 'web.dev: Learn Accessibility'
    url: https://web.dev/learn/accessibility
    licence: CC-BY
    kind: course
    lang: en
  - title: OWASP Cheat Sheet Series
