  - id: 15-quality/03-keyboard-reader
    order: 3
    title: "Клавиатура и диктор: имя, роль, состояние"
    definition: "Дерево доступности — то, что браузер строит из разметки для диктора: у каждого элемента есть имя, роль и
      состояние. Нативные элементы дают их сами."
    summary: "Человек с диктором не видит страницу, а слушает её дерево: у каждого элемента есть имя, роль и состояние.
      После урока вы понимаете, как браузер собирает это дерево, делаете кнопку меню, окно и навигацию, с которыми
      справляются клавиатура и диктор, и умеете за пять минут проверить свою страницу NVDA или VoiceOver."
    minutes: 30
    teaches:
      - quality.keyboard-screen-reader
    requires:
      - quality.wcag22
      - html.forms
      - js.events
    diagram: "AccName: «Что слышит диктор и что делает Tab» (part 15, lesson 3). A menu button, a phone field and a dialog,
      each written several ways (div with onclick, role without behaviour, tabindex, native button, aria-expanded;
      placeholder, aria-label, label; plain div, role=dialog, native dialog). For each: does Tab reach it, do Enter and
      Space work, what a screen reader says (a teaching simplification), and the verdict."
    practice: 'На странице «кнопки» сделаны из div и работают только мышью. Перепишите разметку так, чтобы она работала
      клавиатурой и диктором. 1) Шапка, навигация, основное и подвал: элементы header, nav, main, footer; у nav своё имя
      (aria-label), у текущего пункта aria-current="page". 2) Заголовок страницы h1 с названием проекта из брифа. 3)
      Кнопка меню: button с id="menu-toggle", aria-expanded="false" и aria-controls="menu"; в навигации ссылки a со
      всеми разделами из брифа. 4) Кнопка главного действия: button с id="open-d", aria-haspopup="dialog" и текстом
      действия из брифа. 5) Окно: dialog с id="d", aria-labelledby и заголовком h2 с текстом действия, внутри кнопка
      «Закрыть». 6) Кнопка-значок поиска: button с aria-label и svg с aria-hidden="true". 7) Место для сообщений:
      role="status". 8) Не оставляйте div с onclick и role="button". В заметке напишите, что скажет диктор на кнопке
      меню (роль и состояние) и на окне. Все «…» нужно заменить. Эпоха: 4.'
    checks:
      - Нужны элементы header, nav, main и footer вместо div.
      - 'У nav должно быть имя: aria-label="Разделы сайта".'
      - Текущему пункту навигации добавьте aria-current="page".
      - Название проекта из брифа нужно в h1.
      - 'Кнопка меню: button с id="menu-toggle", aria-expanded="false" и aria-controls="menu".'
      - В nav должны быть ссылки a со всеми разделами из брифа.
      - 'Кнопка главного действия: button с id="open-d", aria-haspopup="dialog" и текстом действия из брифа.'
      - Нужен элемент dialog с id="d" и aria-labelledby.
      - В dialog должен быть заголовок h2 с названием действия из брифа.
      - В окне нужна кнопка «Закрыть».
      - 'Кнопка-значок: aria-label у button и aria-hidden="true" у svg.'
      - Добавьте место для сообщений с role="status".
      - Остался div или span с onclick или role="button". Замените на нативные элементы.
      - "Напишите, что скажет диктор на кнопке меню: роль «кнопка» и состояние (свёрнуто)."
      - "Напишите, что скажет диктор на окне: название и слово «диалог»."
