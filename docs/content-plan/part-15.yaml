# Regenerated from the written lessons (28.10.2026). Changes against the draft: fourteen lessons instead of eight.
# - Accessibility became three lessons: WCAG 2.2 in depth with a fix pass on a page given to the learner (02), keyboard and screen
#   reader, names, roles and states (03), and the law with the rules of other countries and an accessibility statement (13).
# - A new lesson on what a test is and what an end-to-end test checks (04), because the part is about quality before launch.
# - Security is two lessons: OWASP, HTTPS, headers, updates, passwords and two-factor sign-in (05), and the form and spam (06).
#   Backups are not a lesson of their own: part 9 (lesson 9) teaches them, and this part links back and lists them in the checklist.
# - The 152-FZ lesson is split into the law and the operator's register (07) and the policy and the consent block (08).
# - New: the law on advertising stays (11), and consumer protection and the offer for online sales has its own lesson (12);
#   the comparison with GDPR, ePrivacy, ADA and the European Accessibility Act is in lesson 13.
# - Every legal statement is dated 28.10.2026 and says it is not legal advice; the lawyer's list is in the coordinator's report.
# - A source the Links CI cannot reach from GitHub's runners (pd.rkn.gov.ru, eur-lex.europa.eu answering 202) is not cited: the
#   law is cited through consultant.ru, and EU law through gdpr-info.eu and the Commission.
