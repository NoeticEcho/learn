  - id: 15-quality/07-152fz
    order: 7
    title: "152-ФЗ: персональные данные, оператор, согласие"
    definition: Оператор персональных данных — тот, кто организует их обработку, например владелец сайта с формой. Для
      каждого поля нужны цель, основание и срок хранения.
    summary: Любая форма делает владельца сайта оператором персональных данных. После урока вы знаете, что считается
      персональными данными, какие основания обработки бывают, как устроено согласие после изменений 2025 года, какие
      обязанности лежат на операторе (политика, уведомление, хранение в России, утечки) и составляете реестр обработки
      для формы своего проекта. Это ориентир на 28 октября 2026 года, а не юридическая консультация.
    minutes: 35
    teaches:
      - quality.152fz
    requires:
      - html.forms
      - data.privacy-by-design
      - data.data-localisation
      - quality.forms-spam-security
      - texts.legal-text
    diagram: "DutiesMap: «Что на мне лежит» (part 15, lesson 7). Ten things a site may do with people data (a form, a
      counter, session recording, a foreign chat widget, a newsletter, an account, payment, a third-party form handler,
      free text about a case, photographs). The person ticks the ones the site has and the map lists the duties of an
      operator that follow, each with its article of 152-FZ (or 38-FZ, the Civil Code). Dated 28.10.2026, not legal
      advice."
    practice: "Составьте реестр обработки для формы своего проекта. 1) Оператор: название или имя проекта из брифа. 2)
      Источник данных: форма главного действия (назовите словами из брифа). 3) В таблице для каждого поля (имя, телефон,
      почта, сообщение) впишите цель, основание (согласие, договор, закон или законный интерес) и срок хранения с
      числом. 4) Где хранится первичная запись данных граждан РФ: в России, у какого провайдера или на каком сервере. 5)
      Перечислите минимум два сервиса, которые получают данные (счётчик, почтовая служба, CRM, приёмник форм). 6) В
      #special скажите, как вы поступаете с особыми данными (здоровье, дело человека в свободном тексте). 7) В #notify
      решите, подавать ли уведомление Роскомнадзору, и объясните почему (не короче четырёх слов). 8) Если в брифе есть
      английский, скажите в #lang-force, какой язык текста имеет юридическую силу. Все «…» нужно заменить. Эпоха: 6."
    checks:
      - "Оператор: название или имя проекта из брифа."
      - Назовите форму главным действием проекта словами из брифа.
      - "В таблице должно быть четыре поля: имя, телефон, почта, сообщение."
      - В таблице остались «…». Заполните цель, основание и срок для каждого поля.
      - "Основание: согласие, договор, закон или законный интерес."
      - "Срок хранения нужен с числом: например «3 года после последнего обращения»."
      - Скажите, что первичные данные хранятся в России, и у какого провайдера или на каком сервере.
      - Перечислите минимум два сервиса, получающих данные.
      - В списке сервисов остались «…».
      - "Скажите, как вы поступаете с особыми данными: не собираете, подсказываете не писать, удаляете."
      - Решите, подавать ли уведомление Роскомнадзору, и объясните причину не короче четырёх слов.
      - Скажите, текст на каком языке имеет юридическую силу (например, на русском).
    sources:
      - title: Федеральный закон «О персональных данных» 152-ФЗ (КонсультантПлюс)
