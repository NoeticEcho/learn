  - id: 15-quality/08-policy-consent
    order: 8
    title: Политика обработки и согласие на сайте
    definition: Политика обработки — публичный документ о том, что делают с данными посетителей. Согласие — отдельное
      действие человека с собственным текстом.
    summary: "Реестр из прошлого урока превращается в два документа: политику, которую читает любой, и согласие, которое
      человек даёт сам. После урока вы знаете, из каких разделов состоит политика, как оформить согласие отдельно от
      других условий, чего в нём не должно быть, и собираете для своей формы политику из десяти разделов и честное
      согласие с отдельной галочкой на рассылку."
    minutes: 30
    teaches:
      - quality.privacy-notice
    requires:
      - quality.152fz
      - texts.legal-text
      - html.form-validation
      - html.lang-i18n
    diagram: "ConsentDesign: «Пять способов спросить согласие» (part 15, lesson 8). Five consent lines under a request form
      shown as form fragments (pre-ticked with the offer, no checkbox, one box for offer and data, a separate empty box
      with operator, data and purpose, the same plus a separate newsletter box). A verdict against article 9 as the
      lesson reads it, and for the good ones the consent record (date, text version, purpose)."
    practice: 'Приведите форму и политику в порядок. 1) Согласие в блоке #consent: чекбокс name="consent" должен быть пустым
      (без checked) и обязательным (required); текст без слова «оферта»; в нём назван оператор (имя проекта из брифа),
      данные и цель («для…» или «чтобы…»), слово «обработк…», и ссылка на политику (#privacy). 2) Рассылка отдельным
      чекбоксом name="newsletter": пустой и необязательный. 3) В подвале ссылка на #privacy. 4) Политика: десять
      разделов с id p-operator, p-data, p-purposes, p-basis, p-keep, p-recipients, p-storage, p-rights, p-cookies,
      p-version. В p-operator укажите имя и город из брифа, в p-rights почту из брифа, срок ответа в десять рабочих дней
      и отзыв согласия, в p-keep срок числом, в p-storage Россию, в p-recipients сервисы, в p-cookies счётчик, в
      p-version дату по образцу 28.10.2026. Если в брифе есть английский, скажите, что юридическую силу имеет русский
      текст. Не оставляйте «…». Эпоха: 4.'
    checks:
      - У какого-то поля нет подписи.
      - Чекбокс согласия name="consent" должен быть обязательным (required) и пустым (без checked).
      - "Уберите оферту из текста согласия: оно должно быть отдельным."
      - "В согласии нужны слово «обработк…» и цель: «чтобы ответить на заявку»."
      - "В согласии назовите оператора: имя проекта из брифа."
      - 'В согласии нужна ссылка на политику: <a href="#privacy">.'
      - 'Рассылке нужен отдельный чекбокс name="newsletter": пустой и необязательный.'
      - В подвале нужна ссылка на политику.
      - В политике должны быть десять разделов с указанными id.
      - В политике остались «…». Заполните каждый раздел.
      - "В p-operator назовите оператора: имя из брифа."
      - В p-operator укажите город из брифа.
      - "В p-keep назовите срок: например «три года»."
      - "В p-recipients назовите получателей: хостинг, почтовую службу, счётчик."
      - В p-storage скажите, что данные хранятся в России.
      - В p-rights укажите почту из брифа.
      - В p-rights напишите срок ответа (десять рабочих дней) и что согласие можно отозвать.
      - В p-cookies скажите про cookie и счётчик.
      - В p-version нужна дата по образцу 28.10.2026.
      - В политике скажите, что юридическую силу имеет русский текст.
    sources:
      - title: Федеральный закон «О персональных данных» 152-ФЗ (КонсультантПлюс)
        url: https://www.consultant.ru/document/cons_doc_LAW_61801/
