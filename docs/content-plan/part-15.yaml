  - id: 15-quality/14-prelaunch
    order: 14
    title: Предзапусковый чек-лист
    definition: Предзапусковый чек-лист — список проверок по шести блокам перед выкладкой сайта. Блокер не оставляют
      неисправленным, замечания получают срок.
    summary: "Запуск сайта не момент вдохновения, а список, который проходят по пунктам. После урока вы собираете тридцать
      проверок из всей части в шесть блоков (скорость и надёжность, доступность, безопасность, право, поиск и аналитика,
      главное действие), умеете отличать блокер от замечания и составляете отчёт «готов или не готов» для своего
      проекта: цвет каждого блока, красные пункты со сроком и ответственным, проверка на телефоне и план отката."
    minutes: 30
    teaches:
      - quality.prelaunch-checklist
    requires:
      - quality.core-web-vitals
      - quality.wcag22
      - quality.e2e-testing
      - quality.security-headers
      - quality.forms-spam-security
      - quality.152fz
      - quality.privacy-notice
      - quality.cookies
      - quality.copyright-images
      - quality.ad-law-ethics
      - quality.consumer-law
      - quality.a11y-law
      - growth.technical-seo
      - infra.backups
    diagram: "LaunchPanel: «Панель запуска» (part 15, lesson 14). Thirty checks in six blocks (speed and reliability,
      accessibility, security, law, search and analytics, the main action and content), each not checked, fine or a
      problem. Block colours (green, yellow, red), readiness out of thirty and the list of blockers that stop the
      launch."
    practice: "Составьте отчёт о готовности. 1) В каждом из шести блоков (.block с id b-speed, b-a11y, b-security, b-law,
      b-seo, b-action) поставьте data-status: green, yellow или red, и запишите в .note один главный вывод (не
      оставляйте «…»). 2) В таблице #fixes для каждого красного или жёлтого пункта впишите, что исправить,
      ответственного и срок по образцу 04.11.2026. 3) #mobile: скажите, что главное действие проекта (названное словами
      из брифа) пройдено на телефоне. 4) #nojs: что происходит, если скрипт не загрузился. 5) #backup: где резервная
      копия и как откатить выкладку. 6) В таблице #contacts для трёх мест (шапка, подвал, страница контактов) впишите
      телефон и почту из брифа и отметьте, что они совпадают. 7) Вердикт #verdict с атрибутом data-ready (yes или no) и
      словами «готов» или «не готов». Не оставляйте «…». Эпоха: 8."
    checks:
      - Нужно шесть блоков .block.
      - У каждого блока data-status должен быть green, yellow или red.
      - В каждом блоке нужен вывод в .note.
      - В отчёте остались «…». Заполните всё.
      - В таблице исправлений нужна хотя бы одна строка.
      - В исправлениях укажите ответственного.
      - В исправлениях укажите срок по образцу 04.11.2026.
      - "В #mobile назовите главное действие проекта словами из брифа."
      - "В #mobile скажите, что проверка была на телефоне."
      - "В #nojs скажите, что работает без скрипта."
      - "В #backup скажите про копию и про откат."
      - "Нужны три строки контактов: шапка, подвал, страница контактов."
      - В контактах нужен телефон из брифа.
      - В контактах нужна почта из брифа.
      - "Отметьте, что контакты совпадают: «да, совпадает»."
      - 'У #verdict нужен data-ready="yes" или "no".'
      - В вердикте напишите «готов» или «не готов».
