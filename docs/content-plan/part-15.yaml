lessons:
- id: 15-quality/01-performance
  order: 1
  title: 'Скорость: Core Web Vitals'
  summary: 'Зачем: измерить и ускорить сайт по трём показателям: LCP (загрузка главного), INP (отклик) и CLS (скачки макета).
    После урока человек находит главную причину медленной загрузки и исправляет её.'
  minutes: 25
  teaches:
  - quality.core-web-vitals
  - quality.performance-budget
  requires:
  - net.rendering-pipeline
  - html.images
  - css.responsive
  - js.events
  - infra.cdn
  diagram: 'Водопад загрузки учебной страницы: человек сжимает изображение, откладывает скрипт, добавляет размеры картинке,
    и три индикатора LCP/INP/CLS меняют цвет по порогам 2,5 с, 200 мс, 0,1.'
  practice: 'Эпоха 5: найти LCP-элемент главной страницы (изображение или заголовок из brief.sections), довести LCP до зелёной
    зоны на медленной сети в песочнице, задать размеры всем изображениям, и записать бюджет: не больше N килобайт на страницу.
    Для конструктора указать, какие настройки сжимают изображения.'
  checks:
  - Определён LCP-элемент главной страницы.
  - Всем изображениям заданы ширина и высота, макет не прыгает.
  - Записан бюджет в килобайтах и числе запросов.
  - Изображения подобраны под размер экрана (srcset или эквивалент).
  - Для brief.languages шрифты загружаются без блокировки (swap) и с нужными начертаниями.
  sources:
  - title: 'web.dev: Web Vitals'
    url: https://web.dev/articles/vitals
    licence: CC-BY
    kind: article
    lang: en
  - title: 'web.dev: Optimize Largest Contentful Paint'
    url: https://web.dev/articles/optimize-lcp
    licence: CC-BY
    kind: article
    lang: en
  - title: 'web.dev: Interaction to Next Paint (INP)'
    url: https://web.dev/articles/inp
    licence: CC-BY
    kind: article
    lang: en
  - title: 'Web Almanac 2024: SEO'
    url: https://almanac.httparchive.org/en/2024/seo
    licence: CC-BY-SA
    kind: article
    lang: en
  videos: []
- id: 15-quality/02-accessibility
  order: 2
  title: 'Доступность: WCAG 2.2 и закон'
  summary: 'Зачем: сделать сайт пригодным для людей с нарушениями зрения, моторики и слуха и понимать юридический контекст
    в России и мире. После урока человек проходит чек-лист WCAG 2.2 уровня AA для своего сайта.'
  minutes: 25
  teaches:
  - quality.wcag22
  - quality.a11y-law
  requires:
  - html.a11y-basics
  - css.contrast
  - design.contrast
  diagram: 'Три режима одной страницы: «обычный», «только клавиатура» и «скринридер» (читается порядок): человек чинит контраст,
    фокус, подписи форм, и счётчик критериев WCAG 2.2 AA растёт.'
  practice: 'Эпоха 4: проверить сайт на критерии WCAG 2.2 AA: контраст, фокус, размер цели касания, подписи полей из brief.contacts,
    альтернативы изображений из brief.proofs, язык страницы для каждого значения brief.languages. Записать три найденных проблемы
    и исправления.'
  checks:
  - У каждой формы есть подписанные поля и понятные сообщения об ошибках.
  - Контраст текста не ниже 4,5:1, у крупного не ниже 3:1.
  - Весь сайт проходится клавиатурой и фокус виден.
  - Атрибут lang соответствует каждому языку из brief.languages.
  - Изображения-доказательства имеют осмысленное alt.
  sources:
  - title: 'web.dev: Learn Accessibility'
    url: https://web.dev/learn/accessibility
    licence: CC-BY
    kind: course
    lang: en
  - title: 'W3C: Web Content Accessibility Guidelines (WCAG) 2.2'
    url: https://www.w3.org/TR/WCAG22/
    licence: link-only
    kind: spec
    lang: en
  - title: 'W3C WAI: What''s new in WCAG 2.2'
    url: https://www.w3.org/WAI/standards-guidelines/wcag/new-in-22/
    licence: link-only
    kind: article
    lang: en
  - title: 'Web Almanac 2024: Accessibility'
    url: https://almanac.httparchive.org/en/2024/accessibility
    licence: CC-BY-SA
    kind: article
    lang: en
  - title: 'GOV.UK Service Manual: Making your service accessible'
    url: https://www.gov.uk/service-manual/helping-people-to-use-your-service/making-your-service-accessible-an-introduction
    licence: proprietary-link
    kind: article
    lang: en
