- id: 15-quality/03-security
  order: 3
  title: 'Безопасность: основы OWASP, формы и спам'
  summary: 'Зачем: закрыть самые частые дыры: инъекции, XSS, слабые пароли, открытые секреты, спам в формах. После урока человек
    проверяет свой сайт и форму и настраивает заголовки безопасности.'
  minutes: 25
  teaches:
  - quality.owasp-basics
  - quality.forms-spam-security
  - quality.security-headers
  requires:
  - server.authentication
  - html.forms
  - net.tls
  - data.sql-select
  - infra.ci-cd
  diagram: 'Форма обратной связи под атакой: человек включает проверку на сервере, экранирование, CSP, ограничение частоты
    и скрытую ловушку для ботов, и лента попыток показывает, что пропускается; шкала HTTP Observatory.'
  practice: 'Эпоха 6: для формы из brief.mainAction (заявка, запись) добавить серверную валидацию, honeypot-поле, ограничение
    частоты и сообщение без раскрытия данных; настроить CSP и HTTPS-заголовки и прогнать сайт через HTTP Observatory. Секреты
    вынести из кода.'
  checks:
  - Ввод валидируется на сервере, а не только в браузере.
  - В форме есть защита от спама без обязательной капчи с чужим трекингом.
  - Заданы Content-Security-Policy и HSTS.
  - В репозитории нет ключей и паролей.
  - Результат проверки заголовков записан.
  sources:
  - title: OWASP Top 10
    url: https://top10.owasp.org/
    licence: CC-BY-SA
    kind: docs
    lang: en
  - title: OWASP Cheat Sheet Series
    url: https://cheatsheetseries.owasp.org/
    licence: CC-BY-SA
    kind: docs
    lang: en
  - title: 'MDN: Content Security Policy (CSP)'
    url: https://developer.mozilla.org/en-US/docs/Web/HTTP/Guides/CSP
    licence: CC-BY-SA
    kind: docs
    lang: en
  - title: 'MDN: Using HTTP cookies'
