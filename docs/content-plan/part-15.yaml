  - id: 15-quality/02-wcag22
    order: 2
    title: "Доступность вглубь: WCAG 2.2 и проход по странице"
    definition: WCAG 2.2 — международный стандарт доступности веб-содержимого с критериями уровней A, AA и AAA. Его
      проверяют автоматикой, клавиатурой и диктором.
    summary: "В части про HTML вы сделали первый проход по доступности. После этого урока вы знаете, что нового в WCAG 2.2,
      умеете проверить страницу тремя способами (автоматикой, клавиатурой и диктором) и исправляете типичные недочёты:
      контраст, фокус, размер цели касания, подписи полей, язык и сообщения об ошибках."
    minutes: 30
    teaches:
      - quality.wcag22
      - quality.a11y-audit
    requires:
      - html.a11y-basics
      - html.aria-first-rule
      - css.contrast
      - design.contrast
      - css.reduced-motion
    diagram: "A11yViews: «Одна страница, три способа её пройти» (part 15, lesson 2). Nine defects of a contact page, each
      tied to a WCAG 2.2 criterion (contrast, alt, label, focus visible, focus not obscured, target size, language,
      status message, accessible authentication). The person switches the view (eyes and finger, keyboard only, screen
      reader) and fixes defects one by one; a counter shows how many of the nine criteria are met."
    practice: 'Вам дана страница с недочётами. Исправьте: 1) lang="ru" у html, ссылка «Перейти к содержимому» первой в body
      и id="main" у main; 2) один h1 на странице (второй сделайте абзацем); 3) контраст: у .muted и у .btn не ниже 4,5 к
      1; 4) у .icon-btn размер не меньше 44 на 44 (min-width, min-height) и aria-label; 5) верните рамку фокуса: уберите
      outline: none и добавьте :focus-visible с видимым outline, а для фиксированной шапки задайте scroll-padding-top у
      html; 6) у каждого поля label и autocomplete (name, tel, current-password), у поля пароля разрешите вставку; 7) у
      сообщения об ошибке role="status"; 8) у каждого изображения-доказательства осмысленный alt, у каждого абзаца
      lang-note свой lang по языку из брифа; 9) для прокрутки учтите prefers-reduced-motion. В заметке впишите три
      найденные вами проблемы, каждую с номером критерия (например, 2.4.7) и исправлением. Все «…» нужно заменить.
      Эпоха: 4.'
    checks:
      - У html должен быть lang="ru".
      - Первым элементом в body нужна ссылка <a href="#main">Перейти к содержимому</a>.
      - У main нужен id="main".
      - На странице должен быть ровно один h1. Второй сделайте абзацем.
      - "У .muted слишком светлый текст: нужен контраст не ниже 4,5 к 1."
      - "У .btn контраст текста и фона ниже 4,5 к 1: сделайте фон темнее."
      - У .icon-btn min-width должен быть не меньше 44px.
      - У .icon-btn min-height должен быть не меньше 44px.
      - 'У кнопки-значка нет названия: добавьте aria-label="Закрыть".'
      - Добавьте правило :focus-visible с outline, чтобы фокус был виден.
      - "Уберите outline: none, не заменив рамку чем-то видимым."
      - "Для фиксированной шапки добавьте html { scroll-padding-top: 4rem }: фокус не уйдёт под неё."
      - "Плавную прокрутку оберните в @media (prefers-reduced-motion: reduce) с scroll-behavior: auto."
      - У какого-то поля нет подписи label.
      - "У каждого поля нужен autocomplete: name, tel, current-password."
      - 'Уберите onpaste="return false": менеджеру паролей и людям нужна вставка.'
      - Контейнеру сообщения об ошибке нужен role="status" (или "alert").
      - У изображений-доказательств должен быть непустой alt.
      - 'У каждого абзаца .lang-note нужен свой lang по языку версии: lang="ru" или lang="en".'
      - В первой проблеме укажите номер критерия, например 2.4.7.
      - Во второй проблеме укажите номер критерия, например 1.4.3.
      - В третьей проблеме укажите номер критерия, например 2.5.8.
