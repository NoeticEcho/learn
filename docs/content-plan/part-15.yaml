- id: 15-quality/06-copyright
  order: 6
  title: Авторское право и изображения
  summary: 'Зачем: не нарушать чужие права и защитить свои: лицензии на фото, шрифты и тексты, лицензии Creative Commons,
    ГК РФ часть 4. После урока человек делает реестр материалов сайта с лицензиями и указанием авторства.'
  minutes: 20
  teaches:
  - quality.copyright-images
  requires:
  - html.images
  - texts.expert-text
  diagram: 'Игра «можно ли использовать»: для десяти материалов (фото, шрифт, иконка, цитата, карта) человек выбирает лицензию
    и условия, а реестр заполняется строками.'
  practice: 'Эпоха 5: составить реестр всех изображений, шрифтов, иконок и текстов проекта (brief.items, brief.people, brief.proofs):
    источник, автор, лицензия, ссылка, условия. Заменить материалы без подтверждённого права. Для фото людей из brief.people
    получить письменное согласие.'
  checks:
  - Реестр содержит источник, автора, лицензию и ссылку для каждого материала.
  - Нет материалов без права использования.
  - Для лицензий с указанием авторства оно размещено.
  - Для фото людей из brief.people есть согласие.
  - Указана лицензия собственного контента сайта.
  sources:
  - title: Гражданский кодекс РФ, часть 4 (КонсультантПлюс)
    url: https://www.consultant.ru/document/cons_doc_LAW_64629/
    licence: proprietary-link
    kind: docs
    lang: ru
  - title: 'Creative Commons: Sharing openly, sharing globally'
    url: https://creativecommons.org/share-your-work/cclicenses/
    licence: CC-BY
    kind: docs
    lang: en
  - title: 'Creative Commons: CC BY-SA 4.0 (русский)'
    url: https://creativecommons.org/licenses/by-sa/4.0/deed.ru
