  - id: 15-quality/13-a11y-law-world
    order: 13
    title: Доступность и закон, и правила других стран
    definition: Заявление о доступности — страница, где честно сказано, что на сайте проверено, а что нет. ГОСТ Р 52872-2019
      основан на WCAG 2.1.
    summary: Сайт читают не только в России. После урока вы знаете, что есть в России про доступность сайтов (ГОСТ Р
      52872-2019 и требования к официальным сайтам), чем отличаются GDPR, ePrivacy, ADA и европейский закон о
      доступности и когда они касаются небольшого сайта, и составляете для проекта карту аудитории и честное заявление о
      доступности. Это ориентир на 28 октября 2026 года, не юридическая консультация.
    minutes: 30
    teaches:
      - quality.a11y-law
      - quality.intl-law
    requires:
      - quality.wcag22
      - quality.keyboard-screen-reader
