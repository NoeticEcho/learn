  - id: 15-quality/06-forms-spam
    order: 6
    title: "Безопасность формы: проверка на сервере и спам"
    definition: Проверка формы на сервере — защита, которую нельзя обойти запросом мимо страницы. Спам останавливают
      ловушка, лимит частоты и пауза, а не капча.
    summary: Форма это единственное место сайта, где чужой текст попадает к вам в базу и в почту. После урока вы знаете,
      почему проверка в браузере не защита, что проверяет сервер, как остановить спам без капчи, которая мешает людям и
      делится данными с третьими сторонами, и пишете форму главного действия своего проекта с правилами для сервера.
    minutes: 30
    teaches:
      - quality.forms-spam-security
    requires:
      - quality.owasp-basics
      - html.form-validation
      - infra.serverless-edge
    diagram: "FormTrap: «Ловушка для ботов» (part 15, lesson 6). Four visitors (a person with a mouse, a person with a
      screen reader and a password manager, a simple bot, a smart bot) meet a form with defences the person switches on:
      a trap field hidden by colour, by display:none or off-screen with aria-hidden, a time check, a rate limit, a
      third-party captcha. The table says who passes and which honest person is stopped by mistake. AttackFeed is reused
      with a subset of measures."
    practice: 'Защитите форму. 1) Форма отправляется методом post; у имени и телефона required, у всех трёх полей maxlength.
      2) Добавьте ловушку для ботов: блок с классом hp, aria-hidden="true", внутри поле с tabindex="-1" и
      autocomplete="off"; блок скрывайте сдвигом за край (position: absolute, большой отрицательный left), а не display:
      none. 3) Добавьте скрытое поле ts для времени показа формы. 4) Уберите стороннюю капчу (скрипт recaptcha). 5) У
      сообщения об ошибке form-error поставьте role="alert". 6) Кнопка отправки называется главным действием из брифа.
      7) В таблице «Что делает сервер» для каждого поля впишите правило (с числами) и текст ошибки, текст ошибки для
      посетителя не должен раскрывать внутренности (без SQL, stack, exception). 8) В #rate впишите лимит частоты числом
      и единицей времени. Все «…» нужно заменить. Эпоха: 6.'
    checks:
      - Форма должна отправляться методом post, у неё должен быть action.
      - У имени и телефона нужен required.
      - У каждого поля нужен maxlength.
      - Нужен блок .hp с aria-hidden="true" и полем с tabindex="-1" и autocomplete="off".
      - "В стилях .hp сдвигают за край: position: absolute и большой отрицательный left."
      - "Не прячьте ловушку через display: none: умные боты такие поля обходят."
      - Добавьте скрытое поле name="ts".
      - Уберите скрипт сторонней капчи.
      - 'У #form-error нужен role="alert".'
      - Кнопка отправки должна называться главным действием из брифа.
      - В таблице должно быть три правила.
      - В таблице правил остались «…». Заполните все ячейки.
      - "В правилах нужны числа: длина, число знаков."
      - "Текст ошибки для посетителя: «Не удалось отправить, повторите позже»; без SQL, stack и других внутренностей."
      - Ограничение частоты запишите числом и единицей времени, например «5 заявок в час».
    sources:
