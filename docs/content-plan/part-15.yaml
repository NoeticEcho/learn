  - id: 15-quality/12-consumer
    order: 12
    title: "Защита прав потребителей: продажа и оферта онлайн"
    definition: Закон о защите прав потребителей требует, чтобы продавец заранее сообщал сведения о себе и о товаре и давал
      покупателю право отказаться.
    summary: Как только сайт что-то продаёт или предлагает платную услугу человеку, он подчиняется закону «О защите прав
      потребителей». После урока вы знаете, какую информацию о продавце и товаре закон требует показать, когда
      выставленная на сайте цена становится публичной офертой, на какие сроки может отказаться от покупки или услуги
      человек, и собираете страницу условий для своего проекта. Это ориентир на 28 октября 2026 года, не юридическая
      консультация.
    minutes: 30
    teaches:
      - quality.consumer-law
    requires:
      - quality.ad-law-ethics
      - quality.privacy-notice
      - html.forms
      - texts.legal-text
    diagram: "ReturnClock: «Часы возврата» (part 15, lesson 12). A distance purchase or a paid service: delivery date, date
      of the request, whether the return procedure was given in writing, whether the goods are custom. The diagram says
      until when the buyer may withdraw (7 days, 3 months, before delivery any time), when the refund is due (10 days)
      and that a service may be refused at any time against actual costs."
    practice: "Соберите страницу условий для проекта. Шесть разделов с id: seller, goods, payment, delivery, return, claims,
      а также offer. 1) seller: название или имя проекта из брифа, ИНН (в учебном образце нули), адрес или город, режим
      работы, телефон и почта из брифа. 2) goods: каждый товар или услуга из брифа с ценой в рублях (₽ или «руб.») и что
      входит в цену. 3) payment и delivery: как платят и как и когда оказывается услуга или доставляется товар; payment
      упоминает чек. 4) return: в return-goods скажите о семи днях, в return-service об отказе от услуги с оплатой
      фактических расходов (или «не применимо», если вы этого не продаёте). 5) claims: куда писать претензию (почта из
      брифа) и что вы ответите. 6) offer: ссылка на текст оферты и фраза о том, что договор заключается, когда человек
      делает главное действие из брифа и оплачивает. Все «…» нужно заменить. Эпоха: 6."
    checks:
      - Нужны семь разделов с id seller, goods, payment, delivery, return, claims, offer.
      - На странице остались «…». Заполните все разделы.
      - "Назовите продавца: имя или название проекта из брифа."
      - В «Кто продаёт» нужны ИНН или ОГРН (в учебном образце нули).
      - Укажите телефон из брифа.
      - Укажите почту из брифа.
      - Укажите город или адрес из брифа.
      - Перечислите каждый товар или услугу из брифа.
      - "Цена указывается в рублях: «₽» или «руб.»."
      - В разделе об оплате скажите про кассовый чек.
      - Скажите, как и в какой срок оказывается услуга или доставляется товар.
      - "Для товаров: семь дней (или «не продаём» / «не применимо»)."
      - "Для услуг: отказ в любое время с оплатой фактических расходов (или «не применимо»)."
      - В претензиях укажите почту из брифа.
      - В разделе об оферте нужна ссылка на её текст.
      - В разделе об оферте назовите главное действие проекта словами из брифа.
    sources:
      - title: Закон РФ «О защите прав потребителей» (КонсультантПлюс)
