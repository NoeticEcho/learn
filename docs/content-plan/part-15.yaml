    url: https://developer.mozilla.org/en-US/observatory
    licence: CC-BY-SA
    kind: docs
    lang: en
  - title: 'Web Almanac 2024: Security'
    url: https://almanac.httparchive.org/en/2024/security
    licence: CC-BY-SA
    kind: article
    lang: en
  videos: []
- id: 15-quality/04-152fz
  order: 4
  title: '152-ФЗ: персональные данные, согласие, политика'
  summary: 'Зачем: понять, что любая форма делает владельца сайта оператором персональных данных, и выполнить минимум: цель,
    основание, согласие, политика на сайте, уведомление Роскомнадзора, хранение в России. После урока человек готовит набор
    документов для своего сайта.'
  minutes: 30
  teaches:
  - quality.152fz
  - quality.privacy-notice
  requires:
  - html.forms
  - data.privacy-by-design
  - infra.data-localisation-ru
  - quality.forms-spam-security
  diagram: 'Карта данных сайта: человек отмечает, где собираются данные (форма, Метрика, чат, запись), и для каждого выбирает
    цель, основание и срок; при хранении за границей сервис подсвечивает риск локализации; итог превращается в черновик политики.'
  practice: 'Эпоха 3/6: составить перечень данных из brief.contacts и форм brief.mainAction, для каждого поля цель, основание,
    срок хранения; добавить отдельное согласие и ссылку на политику рядом с формой, указать оператора (brief.who), место хранения
    и сервисы, которым передаются данные. Решить, нужно ли подавать уведомление. Для нескольких языков (brief.languages) указать,
    какой текст имеет юридическую силу.'
  checks:
  - Для каждого поля формы указаны цель обработки и срок хранения.
  - Согласие отдельное и непредзаполненное, рядом с кнопкой отправки.
  - Политика обработки опубликована и доступна с каждой страницы с формой.
  - Указано место хранения данных граждан РФ.
  - Перечислены сторонние сервисы, получающие данные (Метрика, почта, CRM, мессенджеры).
  sources:
  - title: Федеральный закон «О персональных данных» 152-ФЗ (КонсультантПлюс)
    url: https://www.consultant.ru/document/cons_doc_LAW_61801/
    licence: proprietary-link
    kind: docs
    lang: ru
  - title: 'Роскомнадзор: Портал персональных данных'
    url: https://pd.rkn.gov.ru/
    licence: proprietary-link
    kind: docs
    lang: ru
  - title: 'Web Almanac 2024: Privacy'
    url: https://almanac.httparchive.org/en/2024/privacy
    licence: CC-BY-SA
    kind: article
    lang: en
  - title: 'MDN: Using HTTP cookies'
    url: https://developer.mozilla.org/en-US/docs/Web/HTTP/Guides/Cookies
    licence: CC-BY-SA
    kind: docs
    lang: en
  videos: []
- id: 15-quality/05-cookies
  order: 5
  title: Cookie, трекеры и согласие
  summary: 'Зачем: понимать, какие cookie ставит сайт, какие из них нужны и как честно спросить согласие там, где это нужно,
    в России и по правилам ЕС для посетителей оттуда. После урока человек составляет таблицу cookie и баннер, которые не подталкивают
    к «принять всё».'
  minutes: 20
  teaches:
  - quality.cookies
  requires:
  - quality.152fz
  - metrics.counter-setup
  - net.http-status-headers
  diagram: 'Инспектор cookie: страница ставит cookie по очереди (сессия, язык, Метрика, чат, карты), человек классифицирует
    их, а баннер собирается из результата; индикатор тёмных паттернов оценивает «принять» и «отклонить» по равному весу.'
  practice: 'Эпоха 6: инвентаризовать cookie и локальное хранилище проекта, разбить на необходимые и аналитические, составить
    таблицу (имя, цель, срок, кто ставит) и баннер с равноценными кнопками. Подключать аналитику после согласия для brief.languages-аудиторий,
    где это требуется.'
  checks:
  - Таблица содержит имя, цель, срок и владельца для каждой cookie.
  - Необходимые cookie не требуют согласия, аналитические отделены.
  - Кнопки «принять» и «отклонить» равнозначны по виду и месту.
  - Метрика и другие трекеры не запускаются до решения, если оно требуется.
  sources:
  - title: 'MDN: Using HTTP cookies'
    url: https://developer.mozilla.org/en-US/docs/Web/HTTP/Guides/Cookies
    licence: CC-BY-SA
    kind: docs
    lang: en
