lessons:
  - id: 15-quality/01-performance
    order: 1
    title: "Скорость: Core Web Vitals и бюджет"
    definition: "Core Web Vitals — три показателя скорости страницы: LCP (показ главного), INP (отклик) и CLS (сдвиги
      макета). Бюджет задаёт пределы заранее."
    summary: "Медленный сайт теряет людей раньше, чем они прочли первое слово. После урока вы знаете три показателя скорости
      (LCP, INP и CLS) и их пороги, находите главный элемент своей страницы, исправляете типичные причины медленной
      загрузки и прыжков макета и записываете бюджет: сколько килобайт и запросов вашей странице разрешено."
    minutes: 25
    teaches:
      - quality.core-web-vitals
      - quality.performance-budget
    requires:
      - net.rendering-pipeline
      - html.images
      - css.responsive
      - js.events
      - infra.cdn
      - css.web-fonts
    diagram: "PerfWaterfall: «Водопад загрузки» (part 15, lesson 1). A teaching model of one landing page on a slow mobile
      network (200 KB/s, 150 ms round trip). Seven switches (compress the hero, no lazy and fetchpriority, image sizes,
      defer, less JavaScript, a late chat widget, font swap) move three gauges (LCP, INP, CLS) across the Core Web
      Vitals thresholds (2.5 s and 200 ms and 0.1 good; 4 s and 500 ms and 0.25 poor); two number fields hold a weight
      and a request budget. The formulas are a simplification chosen to show which fix matters, not a measurement."
    practice: 'Ускорьте страницу и запишите бюджет. 1) Главную картинку первого экрана (она в разделе .hero) отметьте
      fetchpriority="high" и уберите у неё loading="lazy": она и есть LCP. 2) Всем картинкам задайте width и height. 3)
      Картинке первого экрана добавьте srcset и sizes (два размера), остальным картинкам оставьте loading="lazy". 4)
      Подключите скрипт с defer. 5) В @font-face поставьте font-display: swap, а для кириллического начертания
      ограничьте набор знаков через unicode-range (U+0400-04FF). 6) В заметке: в раздел первого экрана впишите название
      раздела из брифа (первый пункт списка разделов) и скажите, что это за элемент; запишите бюджет числами: сколько
      килобайт и запросов страница не должна превышать и за сколько секунд должна показать главное. Все «…» нужно
      заменить. Эпоха: 5.'
    checks:
      - Главной картинке первого экрана (.hero) нужен атрибут fetchpriority="high".
      - 'У главной картинки не должно быть loading="lazy": её нужно грузить сразу.'
      - Есть картинка без width или height. Задайте оба, чтобы браузер заранее оставил место.
      - Главной картинке добавьте srcset с двумя размерами и sizes.
      - 'Картинки ниже первого экрана стоит грузить лениво: loading="lazy".'
      - Остался скрипт без defer. Он блокирует показ страницы.
      - "В @font-face добавьте font-display: swap;."
      - "Для кириллического начертания добавьте unicode-range: U+0400-04FF;"
      - Впишите в заметку название первого раздела из брифа.
      - "Скажите, что за элемент главный: картинка, заголовок или абзац."
      - "Бюджет по весу: число килобайт, например 500."
      - "Бюджет по запросам: число, например 15."
      - "Время показа главного: число секунд от 1 до 4, например 2,5."
    sources:
      - title: Web Vitals (web.dev)
        url: https://web.dev/articles/vitals
        licence: CC-BY
        kind: article
        lang: en
