  - id: 15-quality/10-copyright
    order: 10
    title: "Авторское право: фото, шрифты, тексты и лицензии"
    definition: Авторское право возникает у автора с созданием произведения, без регистрации. Чужое используют по лицензии
      или в случаях, прямо названных в законе.
    summary: Найти картинку не значит получить на неё право. После урока вы знаете, как в России возникает авторское право и
      что такое исключительное право и лицензия, читаете лицензии Creative Commons, Unsplash, SIL OFL и MIT, отличаете
      цитату от заимствования, понимаете, что нужно для фото человека, и составляете реестр материалов своего сайта с
      лицензиями, заменяя то, на что права нет. Это ориентир на 28 октября 2026 года, а не юридическая консультация.
    minutes: 30
    teaches:
      - quality.copyright-images
    requires:
      - html.images
      - texts.expert-text
      - css.web-fonts
    diagram: "LicenceGame: «Можно ли это использовать» (part 15, lesson 10). Eleven materials for a commercial site (an
      unattributed search-result photo, Unsplash, CC BY-SA, CC BY-NC, an OFL font, a pirated font, MIT icons, a short
      quotation, a copied competitor text, a staff photo, an AI image). The person picks allowed, allowed with
      conditions or not allowed, reads the reason with the article of the Civil Code or the licence, and gets a
      register."
    practice: 'Проведите аудит материалов сайта. В реестре #audit у каждого материала (строка tr.asset) четыре ячейки:
      источник, автор, лицензия и ссылка. 1) Замените материалы без права: у них стоят «неизвестна», «из поиска» и
      data-licence="unknown". Выберите источник с понятной лицензией (Wikimedia Commons, Unsplash, Pexels, собственная
      съёмка) и пропишите его, а data-licence замените на cc0, cc-by, cc-by-sa, unsplash, own, ofl или mit. 2) Материал
      с лицензией CC BY-NC (data-licence="cc-by-nc") не годится для коммерческого сайта: замените. 3) У материалов cc-by
      и cc-by-sa поставьте data-credited="yes" и разместите указание авторства в подвале (footer.credits: слова «Фото»,
      «Автор» или «Источник»). 4) Для каждого человека из брифа (если он есть) в строке напишите, что получено
      письменное согласие на публикацию фото. 5) В #own-licence напишите, под какой лицензией ваши собственные тексты и
      изображения (например, © с годом или CC BY 4.0). Не оставляйте «…». Строки для items, people и proofs из брифа уже
      в таблице. Эпоха: 5.'
    checks:
      - В реестре должно быть не меньше пяти материалов.
      - В реестре остались «…». Заполните источник, автора, лицензию и ссылку.
      - "Остались «неизвестна», «не знаю», «из поиска» или «согласия нет»: замените материалы с неясным правом."
      - 'У какой-то строки data-licence="unknown": выберите источник с понятной лицензией.'
      - Лицензия CC BY-NC не подходит сайту, который продаёт услуги. Замените материал.
      - Для материалов cc-by и cc-by-sa нужно разместить указание авторства и поставить data-credited="yes".
      - "В подвале footer.credits напишите указание авторства: «Фото: …»."
      - В подвале остались «…».
      - В реестре нужна строка про шрифт.
      - В реестре нужны строки для каждой услуги или товара из брифа.
      - В реестре нужны строки для подтверждений из брифа.
      - Для фото людей из брифа напишите, что получено письменное согласие.
      - Скажите, под какой лицензией ваши тексты и изображения, и укажите год.
    sources:
      - title: Гражданский кодекс РФ, часть 4 (КонсультантПлюс)
