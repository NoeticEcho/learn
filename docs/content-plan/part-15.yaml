  - id: 15-quality/11-ad-law
    order: 11
    title: Закон о рекламе и правила профессии
    definition: Реклама по закону — информация для неопределённого круга лиц, привлекающая внимание к объекту. Она должна
      быть добросовестной и достоверной.
    summary: Описание услуг на сайте, скорее всего, реклама, и на неё действует закон. После урока вы знаете, что считается
      рекламой, какие четыре беды перечисляет статья 5 закона «О рекламе» (недобросовестность, недостоверность,
      неэтичность, скрытость), какие фразы нарушают её чаще всего, как правила профессии (на примере адвоката)
      ограничивают рассказ о себе, и проверяете тексты своего сайта по списку. Это ориентир на 28 октября 2026 года, не
      юридическая консультация.
    minutes: 30
    teaches:
      - quality.ad-law-ethics
    requires:
      - story.expert-ethics
      - growth.ad-labelling
      - texts.expert-text
    diagram: "ClaimLens: «Лупа для фраз» (part 15, lesson 11). Seven phrases of expert sites (best in town, guaranteed
      result, a starred condition, a daily sale, thousands of clients, cheaper than competitors, a lawyer review of a
      won case). For each: what is wrong (superlative, guarantee, hidden condition, false urgency, unverifiable figure,
      unfair comparison, professional rules) and the honest rewrite out of three, with the rule it rests on."
    practice: "Вам дан абзац сайта с шестью рискованными фразами. 1) В таблице #claims для каждой фразы (строка tr.claim)
      впишите в ячейки: type (что не так: превосходная степень, гарантия, скрытое условие, ложная срочность,
      непроверяемая цифра, сравнение), rewrite (честная замена) и basis (чем подтверждается: документ, реестр, номер,
      или «удалено»). 2) В basis хотя бы одной фразы назовите подтверждение из брифа (одно из доказательств). 3)
      Перепишите абзац #final-text: уберите превосходные степени, гарантии, «только сегодня», «тысячи», сравнения со
      звёздочками, оставьте название проекта и чем он занимается из брифа и хотя бы одно число или дату. 4) В
      #profession-rules напишите, какие правила вашей профессии вы проверили (кодекс этики, СРО, палата, закон) и что
      они запрещают, не короче пяти слов. Не оставляйте «…». Эпоха: 7."
    checks:
      - В таблице должно быть шесть строк с фразами.
      - В таблице остались «…». Заполните «что не так», замену и подтверждение.
      - "Назовите, что не так: превосходная степень, гарантия, скрытое условие, ложная срочность, непроверяемая цифра,
        сравнение."
      - В «чем подтверждается» назовите документ, реестр, номер или напишите «удалено».
      - В одной из ячеек «чем подтверждается» назовите подтверждение из брифа.
      - В абзаце остались превосходные степени, гарантия, «только сегодня», «тысячи», сравнение или звёздочка.
      - В абзаце должно быть название проекта из брифа.
      - В абзаце должно быть, чем занимается проект, словами из брифа.
      - Добавьте в абзац число или дату, которые вы можете подтвердить.
      - Назовите правила профессии, которые проверили (кодекс, СРО, палата, закон), и что они запрещают, не короче пяти
        слов.
    sources:
      - title: Федеральный закон «О рекламе» 38-ФЗ (КонсультантПлюс)
