        kind: docs
        lang: ru
      - title: "GDPR, статья 13: информация, которую нужно сообщить человеку (для сравнения)"
        url: https://gdpr-info.eu/art-13-gdpr/
        licence: link-only
        kind: docs
        lang: en
      - title: "Web Almanac 2024: Privacy"
        url: https://almanac.httparchive.org/en/2024/privacy
