  - id: 15-quality/04-testing-e2e
    order: 4
    title: "Тесты сайта: что такое сквозной тест"
    definition: Сквозной (e2e) тест — программа, которая в настоящем браузере проходит путь человека по сайту и сверяет
      результат с ожидаемым.
    summary: "Сайт ломается тихо: поправили стиль, а форма перестала отправляться. После урока вы понимаете, что такое тест,
      чем различаются юнит-, интеграционные и сквозные (e2e) тесты, читаете пример на Playwright и составляете план из
      сценариев для главного действия своего проекта, с тестовыми данными и без чужих настоящих."
    minutes: 25
    teaches:
      - quality.e2e-testing
    requires:
      - html.forms
      - js.events
      - net.http-status-headers
      - infra.ci-cd
      - quality.keyboard-screen-reader
    diagram: "E2eTrace: «Что скажет сквозной тест» (part 15, lesson 4). One five-step end-to-end test of the main action,
      written with locators by role and label or by a CSS class. The person breaks the site four ways (a missing label,
      a banner over the button, a 500 from the server, a harmless class rename) and runs the test: the log shows which
      step stops. A role-based test catches the label and survives the rename; a class-based one does the opposite."
    practice: "Составьте план проверки сайта. 1) В таблице #plan у каждой строки класс scenario и три ячейки: given
      («Дано»), when («Когда») и then («Тогда»). Заполните четыре готовые строки: путь главного действия на телефоне (в
      «Когда» назовите действие словами из брифа), отправка пустой формы, открытие двух разделов из брифа (назовите их),
      проход клавиатурой. Не оставляйте «…». 2) По одной строке на каждый язык из брифа уже добавлено: заполните их так
      же. 3) В блоке #test-code допишите тест на Playwright: переход на страницу, нажатие ссылки или кнопки по роли и
      имени (название действия из брифа), ввод в поле по подписи, нажатие кнопки, проверка сообщения; без пауз
      waitForTimeout. 4) В #test-data скажите, какие данные используют тесты (тестовые, выдуманные). 5) В #ci-run
      скажите, когда тесты запускаются (при каждой выкладке или правке). Все «…» нужно заменить. Эпоха: 6."
    checks:
      - В таблице должно быть не меньше пяти строк-сценариев (четыре и по строке на язык).
      - В таблице остались «…». Заполните все ячейки.
      - В одном из сценариев «Когда» назовите главное действие словами из брифа.
      - Назовите в плане хотя бы два раздела из брифа.
      - Тест начинается с import { test, expect } from '@playwright/test';
      - "В тесте нужен переход на страницу: await page.goto('/');"
      - "Ищите элементы по роли и подписи: getByRole и getByLabel."
      - В тесте назовите главное действие словами из брифа.
      - "Тест должен что-то проверять: await expect(…)…."
      - "Уберите waitForTimeout: Playwright сам ждёт появления элемента."
      - В блоке теста остались «…». Допишите шаги.
      - Скажите, что данные тестов выдуманные («Тест», телефон из нулей, example.com).
      - "Скажите, когда запускаются тесты: при каждой правке и перед выкладкой."
    sources:
