part: 15
slug: quality
title: Качество и право
era: null
summary: 'Что отличает готовый сайт от черновика: скорость (Core Web Vitals), доступность (WCAG 2.2), безопасность (OWASP),
  персональные данные по 152-ФЗ, cookie, авторские права, реклама и этика профессии, и предзапусковый чек-лист.'
