  - id: 15-quality/09-cookies
    order: 9
    title: Cookie, трекеры и честный баннер
    definition: Cookie — небольшие файлы в браузере, их делят на необходимые, предпочтения, аналитику и рекламу. Честный
      баннер даёт равный выбор.
    summary: Cookie ставит почти каждый сайт, и не все они одинаковы. После урока вы отличаете необходимые cookie от
      аналитических и рекламных, знаете, что на этот счёт говорит российская практика и правила ЕС для посетителей
      оттуда, составляете таблицу cookie своего проекта и баннер, где «принять» и «отклонить» равноценны, а счётчик не
      запускается до выбора. Это ориентир на 28 октября 2026 года, а не юридическая консультация.
    minutes: 25
    teaches:
      - quality.cookies
    requires:
      - quality.152fz
      - metrics.counter-setup
      - metrics.analytics-ethics
      - server.sessions-and-cookies
      - net.http-status-headers
    diagram: "CookieInspector: «Инспектор cookie» (part 15, lesson 9). Seven cookies of a small site (session, csrf, lang,
      consent record, Metrika id, chat visitor, ad id) to sort into necessary, preferences, analytics or advertising,
      then checked; and a banner whose five features the person sets (a bigger accept, a buried reject, pre-ticked
      switches, a cookie wall, a returning banner) with a count of the signs of steering."
    practice: 'Опишите cookie своего проекта и сделайте баннер. 1) В таблице #cookies (строки tr.cookie) минимум пять
      cookie: у каждой строки атрибут data-cat (necessary, prefs, analytics или ads) и data-consent (yes или no: нужно
      ли согласие). Необходимые (necessary) не требуют согласия, аналитические требуют. Хотя бы одна строка должна
      называть главное действие проекта словами из брифа. 2) Баннер #cookie-banner: role="dialog" и aria-label, три
      кнопки с одним классом btn: #accept, #reject и #settings; без класса primary; ссылка на политику #privacy. 3) Код
      счётчика сделайте «спящим»: script type="text/plain" с data-consent="analytics". 4) В подвале ссылка или кнопка с
      атрибутом data-cookie-settings, чтобы человек мог передумать. 5) В заметке #eu-note скажите, что делаете для
      посетителей из ЕС (согласие до запуска аналитики), и назовите язык или аудиторию из брифа. Все «…» нужно заменить.
      Эпоха: 6.'
    checks:
      - В таблице нужно минимум пять строк tr.cookie с data-cat и data-consent.
      - В таблице остались «…». Заполните все ячейки.
      - Нужна хотя бы одна необходимая cookie с data-consent="no".
      - 'Необходимой cookie не нужно согласие: поставьте data-consent="no".'
      - Нужна аналитическая cookie с data-consent="yes".
      - 'Аналитической cookie согласие нужно: data-consent="yes".'
      - Одна строка должна называть главное действие проекта словами из брифа.
      - 'У #cookie-banner нужны role="dialog" и aria-label.'
      - "В баннере нужны кнопки #accept и #reject с классом btn."
      - "Нужно три кнопки с одним классом btn: принять, отклонить, настроить."
      - "Уберите класс primary: кнопки должны быть равноценны."
      - "В баннере нужна кнопка #reject."
      - "В баннере нужна кнопка #settings."
      - "В баннере нужна ссылка на политику #privacy."
      - 'Сделайте код счётчика «спящим»: script type="text/plain" data-consent="analytics".'
      - "Остался обычный script: счётчик не должен запускаться до согласия."
      - В подвале нужна ссылка с атрибутом data-cookie-settings, чтобы передумать.
      - В заметке скажите, что для посетителей из ЕС аналитика включается после согласия, и назовите язык или аудиторию.
    sources:
