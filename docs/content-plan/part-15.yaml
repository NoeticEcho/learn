  - id: 15-quality/05-security
    order: 5
    title: "Безопасность сайта: OWASP, HTTPS, обновления и пароли"
    definition: OWASP Top 10 — список самых распространённых классов уязвимостей веб-приложений. От массовых атак защищают
      HTTPS, обновления, пароли и второй фактор.
    summary: Сайты взламывают не по личной неприязни, а автоматически и пачками, цепляясь за устаревшие плагины, слабые
      пароли и забытые ключи. После урока вы знаете десять самых частых классов проблем из списка OWASP Top 10 простыми
      словами, настраиваете HTTPS и заголовки безопасности, заводите двухфакторный вход и составляете для своего проекта
      короткий план защиты.
    minutes: 30
    teaches:
      - quality.owasp-basics
      - quality.site-hygiene
      - quality.security-headers
    requires:
      - server.authentication
      - server.sessions-and-cookies
      - net.tls
      - infra.tls-certificates
      - data.sql-select
      - infra.ci-cd
    diagram: "AttackFeed: «Лента попыток» (part 15, lesson 5). Nine everyday automated attempts (password guessing, an
      outdated plugin, script and SQL in a form, a public Wi-Fi, framing, a hunt for .env, a changed number in the
      address, spam) and nine measures that stop them. An attempt is stopped when a measure it depends on is on; each
      line names the OWASP Top 10:2025 class. A teaching map, not a model of an attacker."
    practice: "Составьте план защиты сайта. 1) В блоке #headers допишите файл заголовков (формат _headers):
      Strict-Transport-Security с max-age, Content-Security-Policy с default-src 'self', object-src 'none',
      frame-ancestors, form-action 'self' (без 'unsafe-inline' и 'unsafe-eval'), X-Content-Type-Options: nosniff и
      Referrer-Policy. 2) В таблице #accounts для каждого из пяти аккаунтов впишите защиту: второй фактор
      (приложение-аутентификатор, аппаратный ключ или пасскей). 3) В #updates скажите, что и как часто вы обновляете и
      кто за это отвечает. 4) В #secrets скажите, где хранятся ключи и пароли (не в репозитории). 5) В #form-note
      напишите, какие данные принимает главное действие проекта (названное словами из брифа) и почему форма может
      отправлять их только на ваш домен. Все «…» нужно заменить. Эпоха: 6."
    checks:
      - "Нужна строка Strict-Transport-Security: max-age=31536000 (число секунд, не меньше семи цифр)."
      - В Content-Security-Policy нужен default-src 'self'.
      - Добавьте object-src 'none'.
      - Добавьте frame-ancestors 'none' (или 'self'), чтобы сайт нельзя было встроить в чужую страницу.
      - "Добавьте form-action 'self': форма сможет отправлять данные только на ваш адрес."
      - "Уберите 'unsafe-inline' и 'unsafe-eval': они сводят CSP на нет."
      - "Нужна строка X-Content-Type-Options: nosniff."
      - Нужна строка Referrer-Policy со значением, например strict-origin-when-cross-origin.
      - В заголовках остались «…». Допишите все значения.
      - В таблице должно быть пять ячеек второго фактора.
      - В таблице остались «…». Заполните каждую ячейку.
      - "Назовите способ второго фактора: приложение-аутентификатор, аппаратный ключ или пасскей."
      - "В обновлениях скажите, как часто и кто отвечает: например «раз в месяц, отвечаю я»."
      - В секретах скажите, где хранятся (переменные окружения, менеджер паролей) и что не в репозитории.
      - Назовите в заметке о форме главное действие проекта словами из брифа.
      - Объясните, почему форма должна отправлять данные только на ваш домен (form-action 'self').
    sources:
