- id: 15-quality/07-ad-law-ethics
  order: 7
  title: Закон о рекламе и этика адвокатов и экспертов
  summary: 'Зачем: проверить тексты сайта на соответствие закону о рекламе и профессиональной этике: что считается рекламой,
    какие утверждения запрещены, что можно указать об адвокате или эксперте. После урока человек пересматривает свои тексты
    по списку рисков.'
  minutes: 25
  teaches:
  - quality.ad-law-ethics
  requires:
  - story.expert-ethics
  - growth.ad-labelling
  - texts.expert-text
  diagram: 'Лента фраз с сайта: человек отмечает, какие из них нарушают закон о рекламе или этику (гарантия результата, «лучший»,
    отзывы, сравнения), и объяснение показывает норму; затем он переписывает фразу без нарушения.'
  practice: 'Эпоха 7: пройти по всем текстам сайта из brief.sections, отметить утверждения, которые нельзя подтвердить (brief.proofs)
    или которые запрещены правилами профессии (brief.who), и переписать. Для адвоката учесть Кодекс профессиональной этики;
    для других профессий найти свои требования.'
  checks:
  - Все превосходные степени либо подтверждены в brief.proofs, либо удалены.
  - Нет гарантий результата и обещаний выигрыша.
  - Отзывы или результаты дел указаны только если допускаются профессией.
  - Для каждого утверждения указан источник или нормативный документ.
  sources:
  - title: Федеральный закон «О рекламе» 38-ФЗ (КонсультантПлюс)
    url: https://www.consultant.ru/document/cons_doc_LAW_58968/
    licence: proprietary-link
    kind: docs
    lang: ru
  - title: 'КонсультантПлюс: Кодекс профессиональной этики адвоката (подборка)'
    url: https://www.consultant.ru/law/podborki/kodeks_professionalnoj_jetiki_advokata/
    licence: proprietary-link
    kind: docs
    lang: ru
  - title: 'Адвокатская газета: «Критерии допустимости. К вопросу о правомерности рекламы адвокатской деятельности»'
    url: https://www.advgazeta.ru/arhivnye-zapisi/kriterii-dopustimosti/
    licence: proprietary-link
    kind: article
    lang: ru
  - title: 'Яндекс Директ: как работает обязательная маркировка рекламы в интернете'
    url: https://direct.yandex.ru/base/articles/markirovka-reklamy-v-internete
