    diagram: "RegimeMatrix: «Какие правила рядом» (part 15, lesson 13). The person ticks where visitors come from (Russia,
      the EU, the USA) and what the site does (a form, analytics cookies, online sales, a public commercial site); the
      matrix lists the regimes that may apply (152-FZ, the advertising law, the consumer law, GDPR, ePrivacy, the
      European Accessibility Act, ADA, US state laws) with what a small site does about each and the sanction in a
      word."
    practice: "Составьте две вещи. 1) Карту аудитории: в таблице #audience по строке на каждый язык из брифа уже есть
      (tr.aud). Для каждой впишите: где живёт аудитория, какие правила рядом (152-ФЗ, GDPR, ePrivacy, EAA, ADA) и что вы
      для этого делаете. Для английского не забудьте GDPR. 2) Заявление о доступности в разделе #a11y-statement: цель
      (WCAG 2.2, уровень AA; можно и ГОСТ Р 52872-2019), статус проверки (частично проверено, что не проверялось), дата
      проверки по образцу 28.10.2026, список известных ограничений (минимум два пункта в списке #limits) и почта для
      сообщений о проблемах из брифа. Не пишите «полностью соответствует»: пока нет проверки, это неправда. Не
      оставляйте «…». Эпоха: 8."
    checks:
      - В таблице должна быть строка на каждый язык из брифа.
      - В таблице аудитории остались «…».
      - "В «Какие правила рядом» назовите акты: 152-ФЗ, GDPR, ePrivacy, EAA или ADA."
      - Для английской версии назовите GDPR.
      - "Цель: WCAG 2.2, уровень AA."
      - В статусе скажите, что проверено и что нет (не короче пяти слов).
      - "Уберите «полностью соответствует»: без полной проверки это неправда."
      - Дата проверки по образцу 28.10.2026.
      - Нужно минимум два известных ограничения в списке.
      - В ограничениях остались «…».
      - Укажите почту из брифа для сообщений о проблемах.
