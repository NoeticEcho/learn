- id: 06-server/06-graphql-webhooks
  order: 6
  title: GraphQL и вебхуки
  summary: 'Зачем: вы знаете, чем GraphQL отличается от REST (клиент сам выбирает поля) и зачем нужны вебхуки (сервис сам
    сообщает вам о событии). После урока вы подключите уведомление о заявке или оплате к Telegram-боту и проверите подпись
    входящего запроса.'
  minutes: 25
  teaches:
  - server.graphql
  - server.webhooks
  requires:
  - server.rest
  diagram: 'Две панели: слева запрос GraphQL с выбором полей, справа ответ меняется; ниже схема вебхука: событие → POST на
    ваш адрес → проверка подписи → повтор при ошибке, с таймлайном повторов.'
  practice: 'Эпоха 6 (2022): настроить так, чтобы заявка из формы contacts отправляла вебхук в Telegram-бота или в почту владельцу;
    описать, как проверяется подпись и что происходит, если приёмник недоступен.'
  checks:
  - Заявка с формы доходит до владельца проекта через вебхук, и указан канал (Telegram или почта).
  - Входящий вебхук проверяется по секрету или подписи, а секрет не лежит в публичном коде.
  - 'Описано поведение при повторной доставке: обработка идемпотентна.'
  - Объяснено, в каком случае для данных items удобнее GraphQL, а в каком — REST.
  sources:
  - title: 'GraphQL: Introduction to GraphQL'
    url: https://graphql.org/learn/
    licence: CC-BY
    kind: docs
    lang: en
  - title: 'Telegram Bot API: setWebhook'
    url: https://core.telegram.org/bots/api#setwebhook
    licence: proprietary-link
    kind: docs
    lang: en
  - title: 'Stripe: Webhooks'
    url: https://docs.stripe.com/webhooks
    licence: proprietary-link
    kind: docs
    lang: en
  - title: 'GitHub Docs: Validating webhook deliveries'
    url: https://docs.github.com/en/webhooks/using-webhooks/validating-webhook-deliveries
