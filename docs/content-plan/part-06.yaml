- id: 06-server/02-static-dynamic
  order: 2
  title: Статика и динамика
  summary: Одну страницу отдают готовым файлом, другую сервер собирает под каждого посетителя. После урока вы понимаете
    цену каждого подхода (скорость, стоимость, безопасность, возможности) и решаете, где вашему проекту хватит статики,
    а где нужен сервер.
  minutes: 20
  teaches:
  - server-static-vs-dynamic
  requires:
  - server-web-server
  - html-document-structure
  diagram: 'content/diagrams/TwoPipelines.svelte: «Два конвейера»'
  practice: 'Что на вашем сайте статика, а что динамика. Заполните таблицу в блоке «Статика или динамика». 1) Для каждого
    раздела из брифа, для списка предложений, формы заявки и входа для посетителей в колонке «Статика или динамика»
    напишите одно слово («статика» или «динамика»), а в колонке «Почему» одним-двумя предложениями причину. 2) Форма
    заявки требует серверной части или сервиса-посредника: скажите это в причине. 3) В абзаце про базу данных ответьте,
    нужна ли она проекту, и обоснуйте. 4) В абзаце про кэширование скажите, что кэшируется и что делает динамическую
    страницу быстрее. Все «…» нужно заменить. Эпоха: 3.'
  checks:
  - Блок «Статика или динамика» (section id="classify") пропал. Верните его.
  - Остались многоточия «…». Замените каждое.
  - Строк tr class="part" должно быть не меньше, чем разделов в вашем брифе.
  - В таблице должны быть названия всех ваших разделов из брифа.
  - 'В колонке «Статика или динамика» пишите одно слово: «статика» или «динамика».'
  - 'Форма заявки это динамика: данные надо принять на сервере.'
  - В причине для формы скажите, что нужен сервер или сервис-посредник.
  - 'Вход для посетителей это динамика: пароль проверяет сервер.'
  - В колонке «Почему» нужны живые предложения хотя бы из четырёх слов.
  - 'В абзаце про базу ответьте нужна она или нет и объясните: «потому что…», «пока…».'
  - 'В абзаце про кэширование скажите, что кэшируется: слова «кэш», Cache-Control или CDN.'
  sources:
  - title: 'MDN: Introduction to the server side'
    url: https://developer.mozilla.org/en-US/docs/Learn_web_development/Extensions/Server-side/First_steps/Introduction
    licence: CC-BY-SA
    kind: docs
    lang: en
  - title: 'MDN: Client-Server overview (static and dynamic sites)'
    url: https://developer.mozilla.org/en-US/docs/Learn_web_development/Extensions/Server-side/First_steps/Client-Server_overview
    licence: CC-BY-SA
    kind: docs
    lang: en
  - title: 'Jamstack.org: What is Jamstack?'
    url: https://jamstack.org/
    licence: link-only
    kind: article
    lang: en
  - title: 'web.dev: HTTP caching'
    url: https://web.dev/articles/http-cache
    licence: CC-BY
    kind: article
    lang: en
  videos: []
- id: 06-server/03-cgi-php-app-servers
  order: 3
  title: От CGI к PHP и серверам приложений
  summary: CGI запускал программу на каждый запрос, PHP встроил код в страницу, а серверы приложений держат программу
    живой и работают за nginx. После урока вы объясняете, почему WordPress и 1С-Битрикс на PHP, а чат или игра на
    Node.js или Elixir.
  minutes: 25
  teaches:
  - server-cgi
  - server-php-model
  - server-app-server
  requires:
  - server-static-vs-dynamic
  - net-http-request-response
  diagram: 'content/diagrams/RequestModels.svelte: «Три модели запроса»'
  practice: 'Путь запроса на страницу вашего проекта. Опишите, как запрос на страницу раздела проходит по вашему серверу.
    1) В нумерованном списке #steps четыре пункта (класс step): сервер, обработчик (PHP или приложение), база, ответ.
    Назовите в них раздел из вашего брифа. 2) В абзаце «Модель» объясните разницу «процесс на запрос» и «живое
    приложение» и напишите, какую вы выбрали для проекта. 3) В абзаце «Кэш» скажите, где поставить кэш и что в нём
    хранится. 4) В абзаце про PHP-хостинг скажите, подходит ли он проекту вашего типа и почему. Все «…» нужно заменить.
    Эпоха: 3.'
  checks:
  - Блок «Путь запроса» (section id="request-path") пропал. Верните его.
  - Остались многоточия «…». Замените каждое.
  - 'В списке #steps нужно не меньше четырёх пунктов с классом step.'
  - 'В шагах должны встретиться: сервер, обработчик или код, база данных и ответ.'
  - Назовите в шагах хотя бы один раздел вашего брифа.
  - В абзаце «Модель» объясните разницу «процесс на запрос» и «живое приложение» и скажите, что выбрано («выбрана»,
    «подходит»).
  - В абзаце «Кэш» скажите, где он стоит и что в нём хранится.
  - 'В абзаце про PHP-хостинг назовите плюс или минус и объясните: «потому что…», «минус…».'
  sources:
  - title: 'RFC 3875: The Common Gateway Interface (CGI) 1.1'
    url: https://www.rfc-editor.org/rfc/rfc3875
    licence: link-only
    kind: spec
    lang: en
  - title: 'PHP: Руководство. Введение'
    url: https://www.php.net/manual/ru/introduction.php
    licence: CC-BY
    kind: docs
    lang: ru
