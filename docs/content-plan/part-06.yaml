- id: 06-server/06-graphql-webhooks
  order: 6
  title: GraphQL и вебхуки
  summary: GraphQL отдаёт ровно те поля, которые попросил клиент, а вебхук позволяет сервису самому сообщить вам о
    событии. После урока вы знаете, чем GraphQL отличается от REST, и настраиваете уведомление о заявке с проверкой
    подписи и защитой от повторов.
  minutes: 25
  teaches:
  - server-graphql
  - server-webhooks
  requires:
  - server-rest
  diagram: 'content/diagrams/WebhookGraphQL.svelte: «WebhookGraphQL»'
  practice: 'Заявка с формы доходит до владельца: вебхук и его защита. Настоящий приёмник в песочнице не запустить,
    поэтому код обработчика вы пишете текстом в блоке pre id="handler" и проверяете подпись на схеме выше. 1) В абзаце
    «Канал» назовите, куда придёт заявка: Telegram, почта или другой канал. 2) В pre напишите обработчик (на Node.js, по
    образцу из урока): секрет из process.env, подпись HMAC SHA-256 по сырому телу (crypto.createHmac("sha256", …)),
    безопасное сравнение (timingSafeEqual), ответ 401 при несовпадении, повтор события с тем же id игнорируется, при
    успехе быстрый ответ 200. 3) В абзаце «Если приёмник недоступен» опишите, что произойдёт при сбое и почему заявка не
    потеряется и не придёт дважды. 4) В абзаце про GraphQL сравните с REST для ваших данных: назовите один пункт из
    брифа и случай, когда удобнее GraphQL. Значение секрета прямо в код не записывайте. Все «…» нужно заменить. Эпоха:
    6.'
  checks:
  - Блок «Заявка, вебхук, владелец» (section id="webhook-plan") пропал. Верните его.
  - Остались многоточия «…». Замените каждое.
  - 'Назовите канал доставки: Telegram, почта или другой.'
  - 'Подпись считают через HMAC SHA-256: crypto.createHmac("sha256", SECRET).'
  - 'Секрет берут из переменных окружения: process.env.WEBHOOK_SECRET.'
  - Секрет не должен быть записан в коде строкой. Уберите значение и возьмите его из process.env.
  - 'Подписи сравнивают безопасной функцией: crypto.timingSafeEqual(…).'
  - 'Если подпись не сошлась, ответьте 401: res.status(401).end().'
  - 'Нужна защита от повторов: запоминайте event.id и проверяйте, обработано ли событие (seen.has(event.id)).'
  - 'При успехе быстро отвечайте 200: res.status(200).end().'
  - 'Расскажите, что произойдёт при недоступности приёмника: повтор доставки, очередь или журнал, и почему заявка не
    потеряется.'
  - 'В последнем абзаце сравните GraphQL и REST: «REST… потому что…», «GraphQL пригодится, если…».'
  - 'Назовите в сравнении один из ваших пунктов из брифа: рассуждать надо на ваших данных.'
  sources:
