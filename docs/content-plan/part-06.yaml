- id: 06-server/04-languages
  order: 4
  title: Почему у каждого языка своя ниша
  summary: 'Зачем: вы понимаете, чем PHP, Python, Ruby, Java, C#, Go, JavaScript (Node), Elixir и Rust отличаются для сервера,
    и знаете, у кого какая сильная сторона: быстрая сборка, экосистема, параллельность, надёжность, скорость, найм. Вы можете
    выбрать язык под задачу, а не по моде, и учесть российский рынок.'
  minutes: 30
  teaches:
  - server.language-niches
  requires:
  - server.cgi
  - server.app-server
  diagram: Радар-сравнение по осям «скорость старта проекта», «скорость выполнения», «параллельность», «экосистема», «найм
    в России», «порог входа»; клик по языку показывает типичный проект и известные примеры (WordPress, Instagram, Spotify,
    Discord, Mail.ru и др.).
  practice: 'Эпоха 6 (2022): для проекта из брифа (kind и список функций) взвесить три языка из списка по шести критериям
    и выбрать один, с оговоркой, при каких условиях выбор поменялся бы.'
  checks:
  - Сравнение охватывает минимум три языка и опирается на шесть названных критериев.
  - Выбор объяснён на фактах про функции проекта (sections, items, languages), а не на предпочтениях.
  - Указано, каких специалистов можно найти и как.
  - Названа ситуация, при которой выбор нужно пересмотреть.
