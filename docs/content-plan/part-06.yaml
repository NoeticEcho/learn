    url: https://httpd.apache.org/docs/current/getting-started.html
    licence: link-only
    kind: docs
    lang: en
  - title: 'W3Techs: Web servers usage statistics'
    url: https://w3techs.com/technologies/overview/web_server
    licence: link-only
    kind: article
    lang: en
  videos:
  - title: 'Apache vs Nginx: что выбрать? Сравнение двух популярных HTTP-серверов (Мир ИТ с Антоном Павленко)'
