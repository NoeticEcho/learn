    url: https://developer.mozilla.org/en-US/docs/Learn_web_development/Extensions/Server-side/First_steps/Client-Server_overview
    licence: CC-BY-SA
    kind: docs
    lang: en
  - title: 'Jamstack.org: What is Jamstack?'
    url: https://jamstack.org/
    licence: proprietary-link
    kind: article
    lang: en
  - title: 'web.dev: HTTP caching'
    url: https://web.dev/articles/http-cache
    licence: CC-BY
    kind: article
    lang: en
  videos: []
- id: 06-server/03-cgi-php-app-servers
  order: 3
  title: От CGI к PHP и серверам приложений
  summary: 'Зачем: вы понимаете эволюцию серверного кода: CGI запускал программу на каждый запрос, PHP встроил код в страницу,
    а серверы приложений держат программу живой и общаются с nginx. После урока вы объясните, почему WordPress и 1С-Битрикс
    на PHP, а чат или игра — на Node.js или Elixir.'
  minutes: 25
  teaches:
  - server.cgi
  - server.php-model
  - server.app-server
  requires:
  - server.static-vs-dynamic
  - net.http-request-response
  diagram: 'Три анимации запроса: CGI (процесс запускается и умирает), PHP-FPM (пул воркеров, каждый запрос — чистый старт),
    сервер приложений (одна живая программа с общей памятью); счётчик времени запроса и памяти.'
  practice: 'Эпоха 3 (2010, WordPress): на шаблоне проекта (kind из брифа) описать одним предложением, как запрос на страницу
    из sections проходит через PHP или сервер приложений до базы данных и обратно, и найти, где его можно ускорить кэшем.'
  checks:
  - 'Путь запроса описан по шагам: сервер, обработчик, база, ответ.'
  - Названо различие модели «процесс на запрос» и «живое приложение» и сказано, что из этого выбрано для проекта.
  - Указано место для кэша и что в нём хранится.
  - Упомянуто, почему для проекта выбранной kind подходит или не подходит PHP-хостинг.
  sources:
