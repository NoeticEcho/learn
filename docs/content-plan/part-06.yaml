- id: 06-server/04-languages
  order: 4
  title: Почему у каждого языка своя ниша
  summary: 'PHP, Python, Ruby, Java, C#, Go, JavaScript (Node), Elixir и Rust не конкуренты в одном ринге: у каждого свой
    опыт и своя сильная сторона. После урока вы выбираете язык под задачу, а не по моде, и учитываете российский рынок
    специалистов.'
  minutes: 30
  teaches:
  - server-language-niches
  requires:
  - server-cgi
  - server-app-server
  diagram: 'content/diagrams/LanguageRadar.svelte: «Радар языков»'
  practice: 'Какой язык взять для вашего проекта. Взвесьте три языка по шести критериям и выберите один. 1) В таблице три
    строки tr class="lang": в первой клетке название языка (PHP, Python, Go, Node.js, Elixir и так далее), в следующих
    шести оценки от 1 до 5 (5 это лучше: быстрый старт, высокая скорость, много параллельности, богатая экосистема,
    легко найти людей в России, низкий порог входа), в последней сумма. 2) В абзаце «Выбор» назовите язык и объясните
    выбор фактами про ваш проект: назовите один из ваших разделов и функцию (форма, список, вход). 3) В абзаце
    «Специалисты» напишите, где вы искали бы людей. 4) В абзаце «Пересмотрю выбор, если» назовите ситуацию, которая
    изменила бы решение. Все «…» нужно заменить. Эпоха: 6.'
  checks:
  - Блок «Выбор языка» (section id="language-choice") пропал. Верните его.
  - Остались многоточия «…». Замените каждое.
  - В таблице нужно не меньше трёх строк с классом lang.
  - 'В первой колонке нужно название языка: PHP, Python, Go, Node.js, Elixir и так далее.'
  - Оценки это числа от 1 до 5.
  - 'В последней колонке напишите сумму чисел: целое число.'
  - 'В абзаце «Выбор» назовите язык и объясните: «потому что…», «так как…».'
  - 'Объясняя выбор, назовите один из разделов вашего проекта: опираться надо на ваш проект, а не на вкус.'
  - 'В абзаце «Специалисты» скажите, где вы искали бы людей: hh.ru, сообщества, студии, фрилансеры.'
  - 'Назовите ситуацию, при которой выбор надо пересмотреть: «если…», «когда…».'
