lessons:
- id: 06-server/01-web-server
  order: 1
  title: 'Что такое веб-сервер: Apache, nginx и Caddy'
  summary: 'Зачем: вы понимаете, что происходит между браузером и файлом на диске: сервер принимает соединение, разбирает
    запрос, находит ответ и отправляет его. После урока вы читаете короткий конфиг nginx или Caddy, знаете, что такое обратный
    прокси, и можете объяснить, чем три сервера отличаются.'
  minutes: 25
  teaches:
  - server.web-server
  - server.reverse-proxy
  requires:
  - net.http-request-response
  - net.url-anatomy
  - net.dns-resolution
  diagram: 'Путь запроса: браузер → DNS → сервер → конфиг (location, root, proxy_pass) → файл или приложение; можно менять
    правила в простом конфиге и видеть, какой ответ и какой статус получит запрос по выбранному URL.'
  practice: 'Эпоха 1 (1996): представить, что страницы проекта из sections лежат в папке на сервере; написать конфиг, который
    отдаёт главную страницу, отдельную страницу на каждую секцию, красивый ответ 404 и перенаправление со старого адреса на
    новый.'
  checks:
  - Каждая секция из sections открывается по своему адресу, а адрес главной страницы отдаёт файл index.
  - Несуществующий адрес возвращает статус 404 и страницу ошибки, а не главную.
  - Перенаправление со старого адреса сделано статусом 301 на новый, а не страницей-заглушкой.
  - Объяснено, какую роль играет выбранный сервер и зачем его ставят перед приложением (если приложение есть).
  sources:
  - title: 'MDN: What is a web server?'
    url: https://developer.mozilla.org/en-US/docs/Learn_web_development/Howto/Web_mechanics/What_is_a_web_server
    licence: CC-BY-SA
    kind: docs
    lang: en
