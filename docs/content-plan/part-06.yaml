- id: 06-server/07-authentication
  order: 7
  title: Аутентификация простыми словами
  summary: 'Зачем: вы объясняете, чем отличаются «кто вы» (аутентификация) и «что вам можно» (авторизация), как работают
    сессии, cookie, токены JWT, вход через сторонний сервис (OAuth, Яндекс ID, VK ID) и пасскеи. После урока вы выберете
    безопасный способ входа для проекта и не станете хранить пароли открытым текстом.'
  minutes: 30
  teaches:
  - server.sessions-and-cookies
  - server.authentication
  - server.authorization
  - server.oauth
  - server.passkeys
  requires:
  - server.rest
  - net.tls
  diagram: 'Четыре сценария входа бок о бок (пароль и сессия, JWT, OAuth через Яндекс ID, пасскей): шаги ходят между
    браузером, сервером и провайдером; кнопка «украсть» показывает, что украли бы в каждом случае.'
  practice: 'Эпоха 6 (2022): определить по брифу, нужен ли вход вообще (people, items, закрытая часть), выбрать способ и
    описать роли (посетитель, владелец, редактор); если вход не нужен, обосновать.'
  checks:
  - Есть ответ, нужен ли вход, с причиной, связанной с главным действием (mainAction) и аудиторией (forWhom).
  - Перечислены роли и что каждой можно.
  - Пароли не хранятся открытым текстом, названа схема хэширования или вход без пароля.
  - Вход через стороннего провайдера или SMS отмечен как обработка персональных данных (ссылка на 152-ФЗ).
