    url: https://httpd.apache.org/docs/current/getting-started.html
    licence: proprietary-link
    kind: docs
    lang: en
  - title: 'W3Techs: Web servers usage statistics'
    url: https://w3techs.com/technologies/overview/web_server
    licence: link-only
    kind: article
    lang: en
  videos:
  - title: Apache vs Nginx. Что выбрать? Сравнение двух популярных HTTP серверов
    url: https://www.youtube.com/watch?v=rQABD6kTP7g
    lang: ru
- id: 06-server/02-static-dynamic
  order: 2
  title: Статика и динамика
  summary: 'Зачем: вы отличаете страницу, которая лежит готовым файлом, от страницы, которую сервер собирает под каждый запрос,
    и понимаете цену каждого подхода: скорость, стоимость, безопасность, возможности. После урока вы решите, где проекту хватит
    статики, а где нужен сервер.'
  minutes: 20
  teaches:
  - server.static-vs-dynamic
  requires:
  - server.web-server
  - html.document-structure
  diagram: 'Два конвейера рядом: статический (файл → кэш → браузер) и динамический (запрос → код → база → HTML → браузер);
    бегунок «число посетителей» показывает, где какой растёт по времени ответа и стоимости.'
  practice: 'Эпоха 3 (2010, WordPress): разметить функции проекта из брифа (sections, items, форма в contacts, вход для людей)
    как статические или динамические и записать для каждой, зачем нужен сервер, а где достаточно файла.'
  checks:
  - Каждая секция из sections и каждый вид items отнесены к статике или динамике с причиной.
  - Форма обратной связи по contacts отмечена как требующая серверной части или сервиса-посредника.
  - Есть вывод, нужна ли проекту база данных, с доводом.
  - Упомянуты кэширование и то, что делает динамическую страницу быстрее.
  sources:
  - title: 'MDN: Introduction to the server side'
    url: https://developer.mozilla.org/en-US/docs/Learn_web_development/Extensions/Server-side/First_steps/Introduction
    licence: CC-BY-SA
    kind: docs
    lang: en
