- id: 06-server/05-rest-api
  order: 5
  title: 'API и REST: как программы разговаривают друг с другом'
  summary: 'Страница и сервер, а часто и две программы разных компаний, общаются по правилам API. После урока вы читаете и
    проектируете простой HTTP API: ресурсы, методы GET, POST, PUT и DELETE, коды ответа, ошибки и версии, и описываете
    его файлом OpenAPI.'
  minutes: 30
  teaches:
  - server-rest
  - server-openapi
  requires:
  - net-http-request-response
  - js-fetch
  - js-json
  diagram: 'content/diagrams/RestTrainer.svelte: «Тренажёр запросов»'
  practice: 'Описание API вашего проекта по OpenAPI. Песочница не проверяет YAML, поэтому описание вы пишете текстом в
    блоке pre id="openapi" (вместо «…»), как файл openapi.yaml, и сверяете с примером из урока. Опишите API для ваших
    предложений и заявок. 1) Версия: openapi: 3.1.0, info, servers с адресом https://…/api/v1. 2) Пути-существительные
    во множественном числе: /items для списка предложений (get) и /items/{id} для одного, а для заявки из формы
    /requests (post). Глаголов в путях быть не должно. 3) У GET нет побочных эффектов; заявка создаётся методом POST и
    отвечает 201 (или 202). 4) Описаны ответы 200, 400 и 404 и общий формат ошибки в components.schemas.Error (поля code
    и message). 5) У заявки перечислены обязательные поля required и сказано, что персональные данные принимаются только
    по HTTPS. Эпоха: 6.'
  checks:
  - Нужен блок section id="api-spec" с pre id="openapi". Верните его.
  - В описании остались многоточия «…». Замените весь блок описанием API.
  - 'Описание начинается строкой openapi: 3.1.0.'
  - 'В servers нужен адрес по HTTPS: - url: https://example.ru/api/v1.'
  - 'Пути должны быть существительными во множественном числе: /items, /requests.'
  - 'В путях не должно быть глаголов (getItems, createRequest, delete…): действие говорит метод.'
  - 'Нужен путь одного ресурса с параметром: /items/{id}.'
  - 'Нужна операция чтения: get: внутри пути.'
  - Заявка создаётся методом post и отвечает кодом "201" (или "202").
  - Опишите ответы 200, 400 и 404.
  - 'Общий формат ошибки: components → schemas → Error с полями code и message.'
  - 'Для заявки перечислите обязательные поля: required: [name, phone].'
  - Напишите, что персональные данные принимаются только по HTTPS (в описании заявки).
  sources:
