- id: 06-server/05-rest-api
  order: 5
  title: 'API и REST: как программы разговаривают друг с другом'
  summary: 'Зачем: вы читаете и проектируете простой HTTP API: ресурсы, методы GET/POST/PUT/DELETE, коды ответа, формат JSON,
    версии и ошибки. После урока вы опишете API своего проекта по OpenAPI и проверите запросы из браузера и из терминала.'
  minutes: 30
  teaches:
  - server.rest
  - server.openapi
  requires:
  - net.http-request-response
  - js.fetch
  - js.json
  diagram: 'Тренажёр запросов: выбираешь метод и путь, видишь запрос и ответ с кодом; нарушение правил (GET, который меняет
    данные) подсвечивается; рядом отображается соответствующий фрагмент файла OpenAPI.'
  practice: 'Эпоха 6 (2022): описать в файле OpenAPI API для items брифа: список, один пункт, создание заявки из contacts;
    указать формат ошибок и статусы.'
  checks:
  - Для items есть адреса-существительные во множественном числе, а не глаголы.
  - GET не меняет данные, создание заявки идёт методом POST и возвращает 201 или 202.
  - Описаны формат ошибки и минимум три статуса (200, 400, 404).
  - Для заявки из contacts перечислены обязательные поля и сказано, что персональные данные принимаются только по HTTPS.
  sources:
  - title: 'Fielding: Architectural Styles and the Design of Network-based Software Architectures, глава 5 (REST)'
