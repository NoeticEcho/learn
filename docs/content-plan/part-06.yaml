- id: 06-server/07-authentication
  order: 7
  title: Аутентификация простыми словами
  summary: «Кто вы» и «что вам можно» это два разных вопроса. После урока вы объясняете, как работают сессии и cookie,
    токены JWT, вход через сторонний сервис (OAuth, Яндекс ID) и пасскеи, выбираете безопасный способ входа для проекта
    и не станете хранить пароли открытым текстом.
  minutes: 30
  teaches:
  - server-sessions-and-cookies
  - server-authentication
  - server-authorization
  - server-oauth
  - server-passkeys
  requires:
  - server-rest
  - net-tls
  diagram: 'content/diagrams/AuthFlows.svelte: «AuthFlows»'
  practice: 'Нужен ли вход на вашем сайте и как он устроен. Решите, нужен ли вход вашему проекту, и опишите его. 1) В
    абзаце «Нужен ли вход» ответьте «нужен» или «не нужен» и приведите причину, связанную с главным действием проекта:
    назовите его словами из брифа (например, в кавычках). 2) В абзаце «Способ входа» назовите способ: пароль, вход по
    ссылке с почты, Яндекс ID, VK ID, пасскей, или «входа нет». 3) В таблице три роли (class="role"): посетитель,
    владелец и ещё одна (редактор или своя), и что каждой можно (class="can"). 4) В абзаце про пароли назовите схему
    хранения (хэш argon2id или bcrypt с солью) или скажите, что вход без пароля. 5) В последнем абзаце скажите, что вход
    через стороннего провайдера или по SMS это обработка персональных данных по 152-ФЗ, и что для неё нужны согласие и
    политика. Все «…» нужно заменить. Эпоха: 6.'
  checks:
  - Блок «Нужен ли вход на моём сайте» (section id="auth-plan") пропал. Верните его.
  - Остались многоточия «…». Замените каждое.
  - 'В абзаце «Нужен ли вход» ответьте прямо: «нужен» или «не нужен».'
  - 'Причина должна быть связана с главным действием проекта: назовите его словами из брифа.'
  - 'В абзаце «Способ входа» назовите способ: пароль, ссылка с почты, Яндекс ID, VK ID, пасскей или «входа нет».'
  - В таблице нужно не меньше трёх строк с классом role.
  - В таблице должна быть роль «Посетитель».
  - В таблице должна быть роль владельца или администратора.
  - В колонке «Что можно» нужны живые фразы хотя бы из трёх слов.
  - 'В абзаце про пароли назовите схему: хэш (argon2id, bcrypt) с солью, или вход без пароля.'
  - В последнем абзаце скажите, что вход это обработка персональных данных (152-ФЗ), и что нужны согласие и политика.
  sources:
  - title: 'MDN: HTTP authentication'
    url: https://developer.mozilla.org/en-US/docs/Web/HTTP/Guides/Authentication
    licence: CC-BY-SA
    kind: docs
    lang: en
