lessons:
- id: 06-server/01-web-server
  order: 1
  title: 'Что такое веб-сервер: Apache, nginx и Caddy'
  summary: 'Между браузером и файлом на диске стоит программа: сервер принимает соединение, разбирает запрос, находит
    ответ и отправляет его. После урока вы читаете короткий конфиг nginx, знаете, что такое обратный прокси, и
    объясняете, чем отличаются Apache, nginx и Caddy.'
  minutes: 25
  teaches:
  - server-web-server
  - server-reverse-proxy
  requires:
  - net-http-request-response
  - net-url-anatomy
  - net-dns-resolution
  diagram: 'content/diagrams/ConfigSim.svelte: «Путь запроса через конфиг»'
  practice: 'Сервер для страниц вашего проекта: адреса, 404 и переезд. Настоящего сервера в песочнице нет, поэтому вы
    пишете конфиг текстом, а проверяете его в схеме выше (она понимает часть директив nginx). Добавьте в конец body
    блок-каркас из урока (section id="server" с таблицей, pre id="conf" и абзацем id="role") и заполните его. 1) В
    таблице по строке tr class="route" на каждый раздел из брифа: название раздела, адрес латиницей с косой чертой (td
    class="url") и файл .html (td class="file"). 2) В pre пишите конфиг server { … }: root, index index.html, error_page
    404 /404.html, location с return 301 со старого адреса на новый и location / с try_files $uri $uri/ =404. 3) В
    абзаце напишите, какой сервер вы выбрали и зачем: nginx, Caddy или Apache, и нужен ли обратный прокси перед
    приложением. Все «…» нужно заменить. Эпоха: 1. Продолжает шаг page-1996.'
  checks:
  - Блок section id="server" пропал. Вставьте каркас из урока.
  - В блоке сервера остались многоточия «…». Замените каждое.
  - Строк tr class="route" должно быть не меньше, чем разделов в вашем брифе.
  - В первой колонке строк route должны стоять названия ваших разделов из брифа.
  - 'Адрес пишется латиницей и начинается с косой черты: /uslugi.html.'
  - 'Файл пишется латиницей и заканчивается на .html: uslugi.html.'
  - 'В конфиге нужна папка сайта: root /var/www/site;'
  - 'Нужна главная страница каталога: index index.html;'
  - 'Нужно не меньше двух блоков location: один для переезда, один для остального сайта.'
  - В location / напишите try_files $uri $uri/ =404; чтобы несуществующий адрес получал 404.
  - 'Нужна своя страница ошибки: error_page 404 /404.html;'
  - 'Для переезда нужен код 301: return 301 /новый-адрес;'
  - 'В абзаце назовите сервер: nginx, Caddy или Apache.'
  - В абзаце скажите, нужен ли обратный прокси перед приложением (или что приложения нет).
  sources:
  - title: 'MDN: What is a web server?'
    url: https://developer.mozilla.org/en-US/docs/Learn_web_development/Howto/Web_mechanics/What_is_a_web_server
    licence: CC-BY-SA
    kind: docs
    lang: en
