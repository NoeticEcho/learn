- id: 06-server/08-stack-choice
  order: 8
  title: Собираем стек под проект
  summary: 'Теперь всё из части складывается в один выбор: сервер, язык, API, вход и вебхуки под конкретный проект, с
    учётом российских реалий (хостинги, закон о хранении данных, зависимость от иностранных сервисов). После урока у вас
    есть схема серверной части и список рисков.'
  minutes: 20
  teaches:
  - server-stack-choice
  requires:
  - server-language-niches
  - server-rest
  - server-authentication
  - server-webhooks
  diagram: 'content/diagrams/StackBuilder.svelte: «Конструктор схемы»'
  practice: 'Схема серверной части вашего проекта на одной странице. Соберите схему. 1) В абзаце «Главное действие»
    назовите его словами из брифа и скажите, как оно заканчивается. 2) В списке #flow четыре шага (класс hop) пути
    данных от посетителя до владельца: назовите посетителя и владельца. 3) В таблице семь блоков (class="block"):
    страницы, язык и приложение, API, вход, заявки, данные, хостинг. В колонке «Выбор» конкретный инструмент или «не
    нужен», в «Зачем» причина; в одной из причин назовите пункт из вашего списка. 4) В абзаце про персональные данные
    скажите, где они физически хранятся и почему это важно (152-ФЗ, граждане РФ). 5) В списке #risks три риска (класс
    risk), у каждого план на случай отказа блока: резервная копия, запасной канал, ручной обход. Все «…» нужно заменить.
    Эпоха: 6.'
  checks:
  - Блок «Серверная часть моего проекта» (section id="stack") пропал. Верните его.
  - Остались многоточия «…». Замените каждое.
  - Назовите главное действие проекта словами из брифа.
  - 'В списке #flow нужно не меньше четырёх шагов с классом hop.'
  - 'В шагах должны быть посетитель и владелец: путь идёт от первого ко второму.'
  - 'В таблице нужно семь строк с классом block: страницы, язык и приложение, API, вход, заявки, данные, хостинг.'
  - В колонке «Выбор» нужны конкретные названия (nginx, Node.js, REST, PostgreSQL, Telegram…) или «не нужен».
  - 'В одной из причин назовите пункт из вашего списка предложений: схема должна быть про ваш проект.'
  - Скажите, где физически хранятся персональные данные граждан РФ (в России) и почему (152-ФЗ).
  - 'В списке #risks нужно три риска с классом risk.'
  - 'У рисков должен быть план: резервная копия, запасной канал, дублирование, ручной обход.'
  sources:
  - title: Федеральный закон от 27.07.2006 № 152-ФЗ «О персональных данных»
