- id: 06-server/08-stack-choice
  order: 8
  title: Собираем стек под проект
  summary: 'Зачем: вы соединяете всё из части в один выбор: сервер, язык, API, вход и вебхуки под конкретный проект, с учётом
    российского рынка (PHP-хостинги, 1С-Битрикс и WordPress, Яндекс Облако, VK Cloud, бесплатные ограничения иностранных сервисов).
    После урока у вас есть схема сервера проекта и список рисков.'
  minutes: 20
  teaches:
  - server.stack-choice
  requires:
  - server.language-niches
  - server.rest
  - server.authentication
  - server.webhooks
  diagram: 'Конструктор схемы: из палитры блоков (сервер, приложение, база, хранилище, почта, вебхук, вход) собираешь схему
    проекта; система подсказывает лишние и пропущенные блоки по брифу и показывает ориентировочную стоимость в месяц.'
  practice: 'Эпоха 6 (2022): по полям брифа kind, mainAction, items, languages и contacts собрать схему серверной части на
    одной странице: что статика, что динамика, какой язык, какое API, как приходят заявки, что хранится и где.'
  checks:
  - На схеме есть главное действие (mainAction) и путь данных от посетителя до владельца.
  - Для каждого блока выбран конкретный инструмент или написано, что не нужен.
  - Упомянуто, где физически хранятся персональные данные граждан РФ и почему это важно.
  - Есть три риска и план на случай отказа хотя бы одного блока.
  sources:
  - title: Федеральный закон от 27.07.2006 № 152-ФЗ «О персональных данных»
    url: https://www.consultant.ru/document/cons_doc_LAW_61801/
    licence: proprietary-link
    kind: spec
    lang: ru
  - title: 'Yandex Cloud: документация'
    url: https://yandex.cloud/ru/docs
