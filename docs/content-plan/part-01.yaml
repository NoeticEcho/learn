lessons:
- id: 01-net/01-history
  order: 1
  title: От ARPANET до Всемирной паутины
  summary: 'Зачем: вы отличите интернет от веба и поймёте, кто что придумал и зачем. После урока вы можете объяснить в трёх
    фразах, почему появилась паутина и почему первый сайт выглядел как текст со ссылками.'
  minutes: 20
  teaches:
  - net.internet-history
  - net.web-vs-internet
  requires:
  - start.web-eras
  diagram: 'Шкала времени 1969–1995 с перетаскиваемыми событиями (ARPANET, e-mail, TCP/IP, DNS, предложение Бернерса-Ли, первый
    сервер, Mosaic); задача: поставить карточки в правильный порядок и подписать, что интернет, а что веб.'
  practice: 'Человек пишет для своего проекта «адресную карточку 1991 года»: одна страница из заголовка, абзаца про who и
    списка ссылок на разделы из sections. Эпоха: 1 (текст и ссылки, как на первом сайте).'
  checks:
  - Есть элемент h1 с названием проекта (title)
  - Число ссылок на разделы равно числу значений в sections, и у каждой ссылки есть непустой текст
  - 'На странице нет ни изображений, ни скриптов: только текст и ссылки'
  sources:
