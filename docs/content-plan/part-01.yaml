- id: 01-net/03-packets-ip-tcp
  order: 3
  title: 'Пакеты, IP и TCP: как данные доходят'
  summary: 'Зачем: вы поймёте, что страница путешествует не целиком, а кусками, и почему она всё-таки собирается правильно.
    После урока вы можете объяснить IP-адрес, порт, потерянный пакет и рукопожатие TCP простым языком.'
  minutes: 20
  teaches:
  - net.packets
  - net.ip-tcp
  requires:
  - net.web-vs-internet
  diagram: 'Симулятор пакетов: сообщение режется на пронумерованные пакеты, идёт по сети из нескольких узлов, часть теряется
    или приходит не по порядку; ползунок потерь показывает, как TCP просит повторить и собирает целое.'
  practice: 'Человек оценивает вес своей главной страницы: сколько пакетов примерно нужно, чтобы доставить текст из sections
    и по одной картинке на каждый пункт items. Результат записывается как бюджет страницы в килобайтах. Эпоха: 1 (1996), бюджет
    для модема.'
  checks:
  - Бюджет страницы записан числом и не превышает заданный для эпохи
  - Для каждого пункта items указано, нужна ли ему картинка, и она учтена в бюджете
  - Человек правильно различил в схеме адрес узла, порт и номер пакета
  sources:
