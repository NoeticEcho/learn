lessons:
- id: 01-internet/01-history
  order: 1
  title: От ARPANET до Всемирной паутины
  summary: Вы отличите интернет от веба и поймёте, кто что придумал и зачем. После урока вы можете объяснить в трёх фразах,
    почему появилась паутина и почему первый сайт выглядел как текст со ссылками.
  minutes: 20
  teaches:
  - net-internet-history
  - net-web-vs-internet
  requires:
  - start-web-eras
  diagram: 'Шкала времени 1969–1995 с перетаскиваемыми событиями (ARPANET, e-mail, TCP/IP, DNS, предложение Бернерса-Ли, первый
    сервер, Mosaic); задача: поставить карточки в правильный порядок и подписать, что интернет, а что веб.'
  practice: 'Адресная карточка 1991 года. Первые сайты были текстом со ссылками, и больше ничего. Сделайте так же: на странице
    должен быть список с идентификатором contents, в нём по пункту li на каждый раздел вашего сайта (разделы записаны в карточке
    проекта), а в каждом пункте ссылка a с названием раздела. Ни картинок, ни видео. Если списка у вас на странице нет, он
    есть в исходном файле под кнопкой «Начать заново». Эпоха: 1.'
  checks:
  - Ссылок в списке contents пока меньше трёх. Каждый раздел должен быть ссылкой внутри своего <li>.
  - У ссылки нет адреса. Добавьте атрибут href, например href="#".
  - 'У ссылки нет текста: между <a ...> и </a> должно стоять название раздела.'
  - 'На странице есть картинка, видео или вставка. В 1991 году их не было: оставьте только текст и ссылки.'
  sources:
  - title: History of the World Wide Web (Wikipedia)
    url: https://en.wikipedia.org/wiki/History_of_the_World_Wide_Web
    licence: CC-BY-SA
    kind: article
    lang: en
