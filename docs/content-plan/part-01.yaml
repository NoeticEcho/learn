- id: 01-net/08-rendering
  order: 8
  title: Как браузер рисует страницу
  summary: 'Зачем: вы увидите путь от байтов ответа до пикселей и поймёте, откуда берутся «белый экран» и «прыгающая вёрстка».
    После урока вы можете назвать этапы: разбор, DOM, CSSOM, раскладка и отрисовка, и сказать, что их замедляет.'
  minutes: 25
  teaches:
  - net.rendering-pipeline
  requires:
  - net.http-status-headers
  - net.tls
  diagram: 'Конвейер рендеринга: человек вставляет короткий HTML и CSS и видит, как строятся дерево DOM, дерево CSSOM, дерево
    отрисовки, раскладка и слои; добавление блокирующего скрипта или стиля показывает, на каком этапе всё встаёт.'
  practice: 'Человек открывает свою страницу из предыдущих уроков в инструментах разработчика, смотрит вкладку «Сеть» и вкладку
    «Элементы» и записывает, сколько запросов нужно для главной страницы и какие из них самые тяжёлые. Эпоха: 1 (1996) и сравнение
    со страницей 2005 года.'
  checks:
  - Записано число запросов главной страницы и размер самого тяжёлого
  - Названы хотя бы два ресурса, блокирующих первую отрисовку, либо сказано, что их нет
  - 'Человек правильно упорядочил этапы: разбор, DOM и CSSOM, дерево отрисовки, раскладка, отрисовка'
  sources:
