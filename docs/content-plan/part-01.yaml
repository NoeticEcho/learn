- id: 01-internet/04-urls-domains
  order: 4
  title: URL, домены и регистраторы
  summary: Вы прочитаете любой адрес по частям и выберете имя для своего проекта. После урока вы знаете, чем схема отличается
    от хоста и пути, что такое зона .ru и .рф и что делает регистратор.
  minutes: 20
  teaches:
  - net-url-anatomy
  - net-domain-names
  requires:
  - net-ip-tcp
  diagram: 'Разборщик URL: поле ввода и подсветка частей (схема, хост, порт, путь, запрос, якорь); рядом дерево доменных зон,
    по которому можно «подняться» от имени до корня.'
  practice: 'Имя и адреса вашего сайта. Подберите имя для сайта и адреса его разделов. Впишите в заметку: домен, который вы
    выбрали (латиницей, без пробелов, с зоной, например .ru), ещё два запасных варианта в элементах alt, одну фразу о том,
    почему выбрали этот, и путь для каждого раздела: он начинается с косой черты и пишется латиницей, например /uslugi. Все
    «…» нужно заменить. Эпоха: 1.'
  checks:
  - Где-то осталось многоточие «…». Замените его своим текстом.
  - 'Домен написан неверно. Нужны латинские буквы и цифры, без пробелов и подчёркиваний, с зоной в конце: например moi-proekt.ru.'
  - Нужно два запасных варианта в элементах code с классом alt.
  - Напишите одной фразой, почему выбрали это имя.
  - 'Нужен путь для каждого раздела: не меньше трёх в элементах code с классом path.'
  - 'Путь должен начинаться с косой черты и состоять из латинских букв, цифр и дефисов: например /o-nas.'
  sources:
