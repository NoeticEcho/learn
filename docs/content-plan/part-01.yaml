- id: 01-internet/05-dns
  order: 5
  title: 'DNS: от резолвера до корня и обратно'
  summary: Вы поймёте, как имя превращается в адрес, и почему после смены записи сайт «не открывается» несколько часов. После
    урока вы читаете DNS-записи и знаете, что такое TTL.
  minutes: 25
  teaches:
  - net-dns-resolution
  - net-dns-records
  requires:
  - net-domain-names
  diagram: 'Пошаговый симулятор: запрос идёт от браузера к резолверу, корневому серверу, серверу зоны (TLD) и авторитетному
    серверу; кэши включаются и выключаются, а ползунок TTL показывает, как долго в сети живёт старый ответ.'
  practice: 'DNS-записи вашего домена. В 2010 году сайт и почта стали отдельными сервисами, и у каждого появилась своя запись.
    Дополните таблицу: сайт уже есть (запись A), добавьте запись CNAME для www, запись MX для почты и запись TXT для подтверждения
    владения доменом. В каждой строке в ячейке ttl напишите число секунд. И одной фразой объясните, когда TTL стоит уменьшить.
    Все «…» нужно заменить. Эпоха: 3.'
  checks:
  - Где-то осталось многоточие «…». Замените его своим текстом.
  - 'Записи A для сайта нет. Она уже была в исходной таблице: не удаляйте её.'
  - Нет записи CNAME. Она отвечает за то, чтобы www.ваш-домен вёл туда же, куда сам домен.
  - Нет записи MX. Без неё письма на адрес вашего домена не придут.
  - Нет записи TXT. Её обычно просят, чтобы подтвердить владение доменом.
  - 'У каждой записи должна быть ячейка ttl: нужно не меньше четырёх.'
  - 'TTL должен быть числом секунд: например 3600. Слова писать не нужно.'
  - Объясните одной фразой, когда TTL стоит уменьшить.
  sources:
