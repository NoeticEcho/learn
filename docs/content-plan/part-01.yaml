- id: 01-internet/07-https-tls
  order: 7
  title: 'HTTPS и TLS: шифрование и доверие'
  summary: Вы поймёте, что значит замочек в адресной строке и почему без него браузеры пугают посетителей. После урока вы
    можете объяснить рукопожатие TLS, роль сертификата и удостоверяющего центра.
  minutes: 20
  teaches:
  - net-tls
  - net-certificates
  requires:
  - net-http-request-response
  diagram: 'Пошаговое рукопожатие TLS 1.3: ClientHello, ServerHello, обмен ключами, сертификат, Finished; переключатель «подслушивает
    третий» показывает читаемый текст при HTTP и шифр при HTTPS, а поддельный сертификат вызывает предупреждение.'
  practice: 'Форма заявки по HTTPS. В 2010 году сайты начали принимать данные от посетителей, и теперь тайна этих данных зависит
    от вас. Исправьте форму: пусть она отправляет данные по защищённому адресу (https вместо http) и пусть у каждого поля
    будет видимая подпись, элемент label (сейчас поля подписаны только для программ чтения с экрана, а зрячий человек видит
    просто слово рядом). А в заметке о сертификате впишите, как вы его получите (бесплатный автоматический сертификат или
    у хостинга) и на сколько дней он выдаётся. Все «…» нужно заменить. Эпоха: 3.'
  checks:
  - Форма всё ещё отправляет данные по http. Замените адрес в action на https.
  - Видимых подписей label пока меньше двух. Оберните каждое поле в <label>, чтобы подпись и поле были вместе.
  - У какого-то поля формы нет подписи. Подпись должна быть у каждого поля.
  - В заметке о сертификате осталось многоточие «…». Замените его.
  - 'Напишите, как получите сертификат: например «бесплатный автоматический» или «у хостинга».'
  - Срок действия сертификата записывается числом дней, например 90.
  sources:
