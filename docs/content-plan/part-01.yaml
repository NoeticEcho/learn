- id: 01-internet/06-http
  order: 6
  title: 'HTTP: запросы, ответы, коды и заголовки'
  summary: Вы увидите, как браузер просит страницу и что отвечает сервер. После урока вы читаете запрос и ответ в инструментах
    разработчика, отличаете 200, 301, 404 и 500 и понимаете, что делают основные заголовки.
  minutes: 25
  teaches:
  - net-http-request-response
  - net-http-status-headers
  requires:
  - net-dns-resolution
  diagram: 'Симулятор запрос–ответ: человек выбирает метод, путь и заголовки, сервер отвечает; ошибки в пути дают 404, неверный
    метод даёт 405, а переезд раздела даёт 301 с заголовком Location.'
  practice: 'Карта переездов и страница 404. Вы перестроили сайт, и адреса разделов поменялись. Заполните карту переездов:
    для каждого раздела впишите старый адрес, новый адрес (оба начинаются с косой черты, латиницей) и код 301. И допишите
    страницу 404: объясните, что такой страницы нет, и поставьте ссылку на раздел, который ведёт к главному действию вашего
    сайта. Все «…» нужно заменить. Эпоха: 3.'
  checks:
  - 'В таблице должно быть не меньше трёх строк с классом move: по одной на раздел.'
  - В таблице переездов осталось многоточие «…». Заполните все ячейки.
  - 'Старый адрес должен начинаться с косой черты и быть написан латиницей: например /old-uslugi.'
  - 'Новый адрес должен начинаться с косой черты и быть написан латиницей: например /uslugi.'
  - Код для переезда навсегда это 301. Впишите число без слов.
  - На странице 404 осталось многоточие «…». Замените его текстом.
  - 'Напишите на странице 404 понятную фразу: что такой страницы нет.'
  - 'Нужна ссылка <a href="…"> на раздел с главным действием: адрес должен начинаться с косой черты.'
  sources:
