- id: 01-internet/08-rendering
  order: 8
  title: Как браузер рисует страницу
  summary: 'Вы увидите путь от байтов ответа до пикселей и поймёте, откуда берутся «белый экран» и «прыгающая вёрстка». После
    урока вы можете назвать этапы: разбор, DOM, CSSOM, раскладка и отрисовка, и сказать, что их замедляет.'
  minutes: 25
  teaches:
  - net-rendering-pipeline
  requires:
  - net-http-status-headers
  - net-tls
  diagram: 'Конвейер рендеринга: человек вставляет короткий HTML и CSS и видит, как строятся дерево DOM, дерево CSSOM, дерево
    отрисовки, раскладка и слои; добавление блокирующего скрипта или стиля показывает, на каком этапе всё встаёт.'
  practice: 'Измерьте два сайта по вкладке «Сеть». Откройте в новой вкладке самый первый сайт (info.cern.ch/hypertext/WWW/TheProject.html)
    и любой современный сайт на ваш выбор. Для каждого откройте инструменты разработчика (F12), вкладку «Сеть», обновите страницу
    и впишите в таблицу: сколько было запросов (число) и какой ресурс самый тяжёлый (название и размер). Адрес второго сайта
    впишите в первую ячейку его строки. В заметке одной фразой скажите, что на втором сайте мешает первой отрисовке (например
    файл стилей или скрипт), или напишите «ничего не мешает». Все «…» нужно заменить. Эпоха: 1.'
  checks:
  - 'В таблице должно остаться две строки с классом site: первый сайт и ваш.'
  - Где-то осталось многоточие «…». Заполните все ячейки и фразу под таблицей.
  - В ячейках «Запросов» должно быть число, например 24, без слов.
  - Опишите самый тяжёлый ресурс вместе с размером, например «картинка, 420 КБ».
  - В первой ячейке второй строки впишите адрес сайта, который вы измеряли.
  - Одной фразой скажите, что мешает первой отрисовке, или напишите «ничего не мешает».
  sources:
