- id: 01-net/02-browsers-platforms-runet
  order: 2
  title: Браузерные войны, доткомы, веб 2.0, платформы и Рунет
  summary: 'Зачем: вы поймёте, откуда взялись стандарты, «ломавшиеся» сайты, соцсети и привычка заходить с телефона, и как
    это шло в России. После урока вы можете объяснить, почему сегодняшний сайт строят иначе, чем в 1996-м.'
  minutes: 20
  teaches:
  - net.browser-wars
  - net.dotcom-web2
  - net.runet
  requires:
  - net.internet-history
  diagram: Слайдер «сравни эпохи» с долями рынка браузеров и ключевыми событиями 1995–2025; под ним параллельная лента Рунета
    (Рамблер, Яндекс, ЖЖ, ВКонтакте, мобильный веб, мессенджеры), по которой можно проводить пальцем.
  practice: 'Человек выбирает, где его аудитория (forWhom) реально бывает: в поиске, в соцсети, в мессенджере, на карте, и
    записывает в contacts каналы связи по приоритету. Эпоха: 2 (2005), взгляд на «веб 2.0».'
  checks:
  - В contacts указаны хотя бы два канала, один из них не e-mail
  - Для каждого канала указано, зачем он аудитории из forWhom
  - 'Человек правильно сопоставил три события с эпохой: браузерные войны, пузырь доткомов, веб 2.0'
  sources:
