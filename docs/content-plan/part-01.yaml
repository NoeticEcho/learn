- id: 01-internet/02-browsers-platforms-runet
  order: 2
  title: Браузерные войны, доткомы, веб 2.0, платформы и Рунет
  summary: Вы поймёте, откуда взялись стандарты, «ломавшиеся» сайты, соцсети и привычка заходить с телефона, и как это шло
    в России. После урока вы можете объяснить, почему сегодняшний сайт строят иначе, чем в 1996-м, и выбрать, где искать свою
    аудиторию.
  minutes: 20
  teaches:
  - net-browser-wars
  - net-dotcom-web2
  - net-runet
  requires:
  - net-internet-history
  diagram: Слайдер «сравни эпохи» с долями рынка браузеров и ключевыми событиями 1995–2025; под ним параллельная лента Рунета
    (Рамблер, Яндекс, ЖЖ, ВКонтакте, мобильный веб, мессенджеры), по которой можно проводить пальцем.
  practice: 'Где вас найдут. В 2005 году сайт перестал быть единственной точкой входа: людей находили через поиск, форумы,
    блоги. Допишите в список с идентификатором channels каналы, по которым ваша аудитория вас найдёт или свяжется с вами:
    не меньше двух, по порядку важности. Каждый пункт li состоит из названия канала в элементе strong с классом channel и
    объяснения в элементе span с классом why: чем этот канал удобен вашим людям. Хотя бы один канал должен быть не электронной
    почтой. Все «…» нужно заменить. Эпоха: 2.'
  checks:
  - Каналов пока меньше двух. Каждый канал это отдельный пункт <li> в списке channels.
  - 'У пунктов не хватает названия канала: оно должно стоять в <strong class="channel">.'
  - 'У пунктов не хватает объяснения: оно должно стоять в <span class="why">.'
  - Где-то осталось многоточие «…». Замените его своими словами.
  - 'Все ваши каналы это электронная почта. Добавьте хотя бы один другой: мессенджер, поиск, телефон, соцсеть.'
  sources:
  - title: Browser wars (Wikipedia)
    url: https://en.wikipedia.org/wiki/Browser_wars
    licence: CC-BY-SA
    kind: article
    lang: en
  - title: Dot-com bubble (Wikipedia)
    url: https://en.wikipedia.org/wiki/Dot-com_bubble
    licence: CC-BY-SA
    kind: article
    lang: en
  - title: Web 2.0 (Wikipedia)
    url: https://en.wikipedia.org/wiki/Web_2.0
    licence: CC-BY-SA
    kind: article
    lang: en
  - title: Responsive web design (Wikipedia)
    url: https://en.wikipedia.org/wiki/Responsive_web_design
    licence: CC-BY-SA
    kind: article
    lang: en
  - title: Рунет (Википедия)
    url: https://ru.wikipedia.org/wiki/%D0%A0%D1%83%D0%BD%D0%B5%D1%82
    licence: CC-BY-SA
    kind: article
    lang: ru
  videos: []
- id: 01-internet/03-packets-ip-tcp
  order: 3
  title: 'Пакеты, IP и TCP: как данные доходят'
  summary: Вы поймёте, что страница путешествует не целиком, а кусками, и почему она всё-таки собирается правильно. После
    урока вы можете объяснить IP-адрес, порт, потерянный пакет и рукопожатие TCP простым языком.
  minutes: 20
  teaches:
  - net-packets
  - net-ip-tcp
  requires:
  - net-web-vs-internet
  diagram: 'Симулятор пакетов: сообщение режется на пронумерованные пакеты, идёт по сети из нескольких узлов, часть теряется
    или приходит не по порядку; ползунок потерь показывает, как TCP просит повторить и собирает целое.'
  practice: 'Бюджет страницы для модема. В 1996 году страницу открывали по модему, примерно 3,6 килобайта в секунду. Страница
    в 50 килобайт грузилась почти четырнадцать секунд, поэтому у неё был бюджет. Заполните таблицу под заголовком: напишите
    вес каждой строки в килобайтах (число в ячейке с классом kb), для строки с картинками ответьте «да» или «нет» в ячейке
    img и впишите в итог сумму, не больше 50. Все «…» нужно заменить. Эпоха: 1.'
  checks:
  - В таблице должно быть не меньше трёх строк с классом row.
  - Где-то осталось многоточие «…». Замените его числом или словом.
  - 'Вес должен быть числом: например 6 или 12,5. Слова «КБ» писать не нужно.'
  - В ячейках img должно быть слово «да» или «нет», без других слов.
  - Итог должен быть числом от 1 до 50. Если у вас больше, уберите или уменьшите картинки.
  sources:
  - title: Как работает Интернет (MDN)
    url: https://developer.mozilla.org/ru/docs/Learn_web_development/Howto/Web_mechanics/How_does_the_Internet_work
