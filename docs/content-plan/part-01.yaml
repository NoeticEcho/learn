- id: 01-net/05-dns
  order: 5
  title: 'DNS: от резолвера до корня и обратно'
  summary: 'Зачем: вы поймёте, как имя превращается в адрес, и почему после смены записи сайт «не открывается» несколько часов.
    После урока вы читаете DNS-записи и знаете, что такое TTL.'
  minutes: 25
  teaches:
  - net.dns-resolution
  - net.dns-records
  requires:
  - net.domain-names
  diagram: 'Пошаговый симулятор: запрос идёт от браузера к резолверу, корневому серверу, серверу зоны (TLD) и авторитетному
    серверу; кэши включаются и выключаются, а ползунок TTL показывает, как долго в сети живёт старый ответ.'
  practice: 'Человек составляет таблицу DNS-записей для своего домена: A или AAAA для сайта, CNAME для www, MX для почты в
    contacts, TXT для проверки владения. Значение TTL выбирается и обосновывается. Эпоха: 3 (2010), когда сайт и почта становятся
    отдельными сервисами.'
  checks:
  - В таблице есть запись для сайта и запись для www
  - Если в contacts указан адрес на своём домене, есть запись MX
  - TTL указан числом в секундах, и человек объяснил, когда его стоит уменьшить
