- id: 01-net/06-http
  order: 6
  title: 'HTTP: запросы, ответы, коды и заголовки'
  summary: 'Зачем: вы увидите, как браузер просит страницу и что отвечает сервер. После урока вы читаете запрос и ответ в
    инструментах разработчика, отличаете 200, 301, 404 и 500 и понимаете, что делают основные заголовки.'
  minutes: 25
  teaches:
  - net.http-request-response
  - net.http-status-headers
  requires:
  - net.dns-resolution
  diagram: 'Симулятор запрос–ответ: человек выбирает метод, путь и заголовки, сервер отвечает; ошибки в пути дают 404, неверный
    метод даёт 405, а переезд раздела даёт 301 с заголовком Location.'
  practice: 'Человек придумывает карту переездов для своего сайта: старые адреса разделов из sections перенаправляются на
    новые (301), а несуществующие получают страницу 404 с текстом, который ведёт к mainAction. Эпоха: 3 (2010), смена структуры
    сайта.'
  checks:
  - Для каждого старого адреса указан новый и код 301
  - Страница 404 содержит ссылку на раздел, отвечающий на mainAction
  - Человек правильно сопоставил три кода состояния с их смыслом
