- id: 01-net/04-urls-domains
  order: 4
  title: URL, домены и регистраторы
  summary: 'Зачем: вы прочитаете любой адрес по частям и выберете имя для своего проекта. После урока вы знаете, чем схема
    отличается от хоста и пути, что такое зона .ru и .рф и что делает регистратор.'
  minutes: 20
  teaches:
  - net.url-anatomy
  - net.domain-names
  requires:
  - net.ip-tcp
  diagram: 'Разборщик URL: поле ввода и подсветка частей (схема, хост, порт, путь, запрос, якорь); рядом дерево доменных зон,
    по которому можно «подняться» от имени до корня.'
  practice: 'Человек придумывает три варианта доменного имени для проекта по полям title и who (латиницей и, если языков несколько,
    отдельно для каждого), выбирает один и объясняет выбор. Затем записывает адреса разделов из sections как пути. Эпоха:
    не привязана.'
  checks:
  - Имя домена не содержит пробелов и недопустимых символов, зона указана
  - Для каждого раздела из sections записан путь, начинающийся с /
  - Если в languages больше одного языка, пути или поддомены различают языки
