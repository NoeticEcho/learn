- id: 01-net/07-https-tls
  order: 7
  title: 'HTTPS и TLS: шифрование и доверие'
  summary: 'Зачем: вы поймёте, что значит замочек в адресной строке и почему без него браузеры пугают посетителей. После урока
    вы можете объяснить рукопожатие TLS, роль сертификата и удостоверяющего центра.'
  minutes: 20
  teaches:
  - net.tls
  - net.certificates
  requires:
  - net.http-request-response
  diagram: 'Пошаговое рукопожатие TLS 1.3: ClientHello, ServerHello, обмен ключами, сертификат, Finished; переключатель «подслушивает
    третий» показывает читаемый текст при HTTP и шифр при HTTPS, а поддельный сертификат вызывает предупреждение.'
  practice: 'Человек составляет для своего проекта список данных, которые посетитель отправляет (поля формы по mainAction,
    например имя и телефон), и отмечает, почему им нужен HTTPS. Затем выбирает способ получить сертификат (бесплатный автоматический
    или у хостинга). Эпоха: 3 (2010), сайт начинает принимать данные.'
  checks:
  - Для каждого собираемого поля указано, что оно передаётся по HTTPS
  - Выбран способ получения сертификата и записан срок его действия
  - Человек правильно ответил, что сертификат подтверждает владельца домена, а не добросовестность сайта
  sources:
  - title: Transport Layer Security (TLS)
    url: https://developer.mozilla.org/en-US/docs/Web/Security/Transport_Layer_Security
