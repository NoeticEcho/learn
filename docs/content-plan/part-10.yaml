lessons:
- id: 10-texts/01-screen-reading
  order: 1
  title: Как люди читают с экрана
  summary: 'Зачем: вы увидите на трекинге глаз, что посетитель не читает, а сканирует, и научитесь строить страницу так, чтобы
    главное нашли за пять секунд: подзаголовки, списки, абзацы по одной мысли.'
  minutes: 15
  teaches:
  - texts.screen-reading
  requires:
  - html.semantic-elements
  - design.visual-hierarchy
  - start.project-brief
  diagram: 'Тепловая карта чтения: загружаешь макет страницы (свой или шаблонный), ползунок «время просмотра» показывает,
    куда глаз попадает за 1, 3 и 10 секунд для F-образного и слоевого паттерна; можно перетаскивать блоки и видеть изменение.'
  practice: 'Любая эпоха сайта. Человек берёт главную страницу своего проекта и размечает: что в первом экране (brief.who,
    brief.mainAction), какие подзаголовки позволяют просканировать страницу (brief.sections), где текст сплошной и его надо
    разбить.'
  checks:
  - В первом экране видно, кто вы (brief.who) и что можно сделать (brief.mainAction).
  - Каждая секция из brief.sections начинается с подзаголовка, из которого понятно её содержание.
  - Нет абзацев длиннее пяти строк на мобильной ширине.
  - Списки использованы там, где перечисляются равноправные пункты (brief.items).
  sources:
  - title: 'NN/g: F-Shaped Pattern of Reading on the Web'
    url: https://www.nngroup.com/articles/f-shaped-pattern-reading-web-content-discovered/
    licence: proprietary-link
    kind: article
    lang: en
  - title: 'NN/g: How Users Read on the Web'
    url: https://www.nngroup.com/articles/how-users-read-on-the-web/
    licence: proprietary-link
    kind: article
    lang: en
  - title: 'W3C WAI: Understanding Reading Level (WCAG 2.2)'
    url: https://www.w3.org/WAI/WCAG22/Understanding/reading-level.html
    licence: proprietary-link
    kind: spec
    lang: en
  - title: Plain Language Guidelines (plainlanguage.gov)
    url: https://www.plainlanguage.gov/guidelines/
    licence: PD
    kind: docs
    lang: en
  videos: []
- id: 10-texts/02-info-style
  order: 2
  title: 'Информационный стиль: «Пиши, сокращай»'
  summary: 'Зачем: вы научитесь вычищать из текста стоп-слова, канцелярит и пустые оценки («уникальный», «профессиональный»)
    и заменять их фактами и цифрами; результат — абзац, который можно проверить и которому можно поверить.'
  minutes: 20
  teaches:
  - texts.info-style
  - texts.stop-words
  requires:
  - texts.screen-reading
  diagram: 'Редактор с подсветкой: вставляешь абзац, слова-паразиты и оценки подсвечиваются категориями (стоп-слово, оценка,
    канцелярит, пассив); счётчик показывает «информационный шум», кнопка подсказывает, чем заменить факт.'
  practice: 'Любая эпоха. Человек берёт описание своего проекта (brief.who) и по одной услуге или товару из brief.items переписывает
    в информационном стиле: убирает оценки, добавляет факт, число, срок, результат; хранится версия «было / стало».'
  checks:
  - В тексте нет слов-оценок без подтверждения («лучший», «качественный», «индивидуальный подход»).
  - 'Для каждого пункта из brief.items есть как минимум один проверяемый факт: число, срок, документ, пример.'
  - Предложения активные, без цепочек существительных на «-ние».
  - Объём текста сократился по сравнению с исходным, а информации не стало меньше.
  sources:
  - title: 'Максим Ильяхов: сайт автора (Пиши, сокращай; Главред)'
    url: https://maximilyahov.ru/
    licence: proprietary-link
