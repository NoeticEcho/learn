- id: 10-writing/06-legal-expert
  order: 6
  title: Юридические и экспертные тексты
  summary: "Вы напишете страницу об обработке персональных данных и согласие простым языком, не теряя точности, и поймёте
    границы экспертного текста: как рассказать о квалификации и результатах, не нарушая закон о рекламе и
    профессиональные правила. После урока у вашего проекта есть учебный черновик политики, подписанные источниками
    доказательства и чистый текст о работе. Урок не юридическая консультация: тексты перед публикацией проверяет юрист."
  minutes: 25
  teaches:
  - texts-legal-text
  - texts-expert-text
  requires:
  - texts-tone-of-voice
  - html-form-validation
  diagram: "LegalPlain, две вкладки. Политика: пункты учебной политики в двух вариантах (юридическая формула и простые
    слова) с галочками «оставить»; страница называет, чего не хватает без обязательных пунктов. Утверждения: восемь фраз
    об эксперте, которые нужно отнести к «допустимо», «нужен источник» или «нельзя»."
  practice: "Составьте для проекта учебный черновик трёх вещей. 1) Страница о персональных данных (блок privacy): кто
    оператор (в нём ваше имя из брифа), статус (самозанятый, ИП, организация или физическое лицо), какие данные, зачем,
    как долго хранятся (срок), как отозвать согласие (адрес почты из брифа). 2) Согласие рядом с формой: отдельная
    галочка, не отмеченная заранее, текст со словом «обработку» и ссылка на блок privacy. 3) Подтверждения: у каждого
    доказательства из брифа впишите в source источник, где его можно проверить: документ, номер или ссылку. А в абзаце
    pitch коротко напишите, чем вы полезны, без гарантий и превосходных степеней. Все «…» нужно заменить. Эпоха: 8."
  checks:
  - Где-то в main осталось многоточие «…». Замените его своими словами.
  - В пункте «Кто обрабатывает» должно стоять ваше имя или название из брифа.
  - "В пункте «Статус» укажите: самозанятый, ИП, организация (ООО, АНО и т. п.) или физическое лицо."
  - В пункте «Какие данные» перечислите хотя бы два вида данных, которые вы собираете.
  - В пункте «Зачем» напишите, для чего нужны данные, не меньше трёх слов.
  - "В пункте «Сколько хранятся» назовите срок цифрой или словами: «3 года», «до отзыва согласия»."
  - В пункте «Как отозвать согласие» укажите адрес почты из брифа.
  - Согласие должно быть отдельной галочкой (input type="checkbox") в форме.
  - "Галочка не должна быть отмечена заранее: уберите атрибут checked."
  - "В тексте согласия должно быть слово «обработку»: на что и зачем соглашается человек."
  - 'Ссылка рядом с галочкой должна вести на блок политики: href="#privacy".'
  - У каждого доказательства из брифа должен быть свой источник в элементе source.
  - Хотя бы в одном источнике нужен документ, номер, реестр или ссылка.
  - Текст о работе должен быть не короче двенадцати слов.
  - "В тексте о работе остались гарантии или превосходные степени: «лучший», «гарантируем», «самый», «100 %»,
    «выиграем». Для вашей профессии это рискованно, замените описанием."
  - "Заметка «Это учебный черновик» пропала. Верните её: она напоминает проверить текст у юриста."
  sources:
