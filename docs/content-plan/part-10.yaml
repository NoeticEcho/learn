- id: 10-texts/07-rewrite-bio
  order: 7
  title: 'Редактура на деле: биография «до» и «после»'
  summary: 'Зачем: вы применяете все приёмы части сразу: берёте длинную самоописательную биографию (учебную «до» или свою)
    и превращаете её в страницу «О себе», которую читают, ей верят и которая подводит к действию; сохраняется пара «до/после»
    для галереи.'
  minutes: 25
  teaches:
  - texts.rewrite
  requires:
  - texts.inverted-pyramid
  - texts.headlines
  - texts.microcopy
  - texts.tone-of-voice
  - texts.legal-text
  - texts.expert-text
  diagram: 'Слайдер «до/после» по абзацам: тянешь ползунок — старый текст превращается в новый, правки подсвечены цветами
    приёмов (убрана оценка, добавлен факт, сдвинут вывод, сокращён канцелярит), а счётчик показывает слова и «шум».'
  practice: 'Любая эпоха. Человек берёт биографию (brief.who, brief.people, brief.proofs; если своей нет — учебную) и выполняет
    редактуру в пять проходов: вывод вперёд, факты вместо оценок, структура, тон по brief.tone, проверка допустимости; результат
    размечается как страница «О себе» с призывом к brief.mainAction.'
  checks:
  - 'В первом абзаце названы: кто это (brief.who), чем занят, чем полезен для brief.forWhom.'
  - Каждое утверждение о заслугах опирается на пункт из brief.proofs.
  - Перед призывом к действию нет более трёх абзацев текста.
  - Тон страницы соответствует brief.tone и согласован с остальным сайтом.
  - Есть пара «до/после» с краткой запиской, что и почему изменено.
  sources:
  - title: 'Максим Ильяхов: сайт автора'
    url: https://maximilyahov.ru/
    licence: proprietary-link
    kind: book
    lang: ru
  - title: 'NN/g: How Users Read on the Web'
    url: https://www.nngroup.com/articles/how-users-read-on-the-web/
    licence: proprietary-link
