- id: 10-writing/07-rewrite
  order: 7
  title: "Редактура: биография до и после"
  summary: "Вы применяете все приёмы части сразу: берёте длинную самоописательную биографию и превращаете её в страницу «О
    себе», которую читают, которой верят и которая ведёт к действию. После урока у вас есть страница «О себе» и пара
    «было и стало» с запиской о том, что и почему изменено."
  minutes: 25
  teaches:
  - texts-rewrite
  requires:
  - texts-headlines
  - texts-expert-text
  diagram: "BioSlider: ползунок из пяти шагов проводит вымышленную биографию по проходам редактуры; для каждого шага
    текст, что сделано, число слов и число слов, помеченных словарём шума."
  practice: 'В заметке «Было» собрана ваша биография в самом слабом виде. Перепишите её в пять проходов на странице
    #about. Проход 1, вывод вперёд: в абзаце class="lead" назовите себя и скажите, чем вы заняты и кому полезны. Проход
    2, факты: вместо оценок годы, документы, стаж. Проход 3, структура: не меньше трёх подзаголовков h2, короткие
    абзацы, каждый на своей строке файла, доказательства из брифа списком. Проход 4, тон: он должен звучать так, как
    записан в брифе. Проход 5, допустимость: без гарантий, превосходных степеней и пустых оценок. Ссылка на главное
    действие (a с классом cta, в своём абзаце) стоит не позже, чем после трёх абзацев. В заметке «Что и почему» запишите
    три правки и причину каждой. Все «…» нужно заменить. Эпоха: 8.'
  checks:
  - В странице «О себе» осталось многоточие «…». Замените его своими словами.
  - В заметке «Что и почему» остались многоточия. Напишите три правки.
  - В первом абзаце (lead) должно быть ваше имя или название проекта, как в брифе.
  - "Первый абзац слишком короткий. В нём должно быть не меньше десяти слов: кто вы, чем заняты, кому полезны."
  - Нужно не меньше трёх подзаголовков h2.
  - Ссылка a с классом cta должна стоять в своём абзаце p среди первых четырёх абзацев article.
  - Ссылка должна называть главное действие из брифа теми же словами.
  - Каждое доказательство из брифа должно стоять в своём пункте списка li на странице.
  - "В тексте остались оценки или канцелярит: «лучший», «качественный», «уникальный», «индивидуальный подход»,
    «высококвалифицированный», «осуществляем», «является». Замените фактами."
  - "В тексте остались обещания или превосходные степени: «гарантируем», «самый», «100 %», «выиграем», «никогда не
    подводил». Для вашей профессии это рискованно."
  - Где-то в странице абзац слишком длинный. Разбейте его, каждый абзац на своей строке файла.
  - "Заметка «Было» пропала. Верните её: без неё нет пары «было и стало»."
  - В заметке «Что и почему» нужно три правки, каждая в своём li.
  - "Опишите хотя бы одну правку подробнее: что изменили и почему, не меньше пяти слов."
  sources:
