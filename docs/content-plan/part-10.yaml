- id: 10-writing/05-tone
  order: 5
  title: Тон голоса и гайд по стилю
  summary: "Вы опишете, как звучит ваш проект: формально или по-дружески, серьёзно или легко. И составите короткий гайд с
    примерами «так и не так», чтобы все тексты звучали одним голосом. После урока у вас есть положение на четырёх осях
    тона, три принципа, списки слов и главный блок страницы в вашем тоне."
  minutes: 15
  teaches:
  - texts-tone-of-voice
  requires:
  - texts-microcopy
  diagram: "ToneDials: четыре ползунка осей тона NN/g; строка под заголовком, кнопка и сообщение об ошибке собираются по
    правилам из положения осей; кнопка ставит ползунки по тону из брифа."
  practice: "Опишите, как звучит ваш проект, и напишите в этом тоне главный блок страницы. В заметке «Как мы говорим»:
    слово тона из брифа (деловой, тёплый, смелый или спокойный) в strong с классом tone-word; положение на четырёх осях
    цифрой от 1 до 5 в ячейке pos и пояснение в ячейке why; три принципа: название, пара «так» и «не так» на материале
    проекта; три слова, которые вы используете (use), и три, которые не используете (avoid). Затем в элементе hero-text
    напишите текст под заголовком в этом тоне, а в alt-tone тот же текст в противоположном тоне, чтобы увидеть разницу.
    Кнопка в шапке называет главное действие из брифа. Все «…» нужно заменить. Эпоха: 8."
  checks:
  - В блоке под заголовком или в кнопке осталось многоточие «…».
  - В заметке «Как мы говорим» осталось многоточие «…». Заполните все поля.
  - Кнопка в шапке должна называть главное действие из брифа теми же словами.
  - В брифе тон «деловой». Впишите в tone-word слово «деловой».
  - В брифе тон «тёплый». Впишите в tone-word слово «тёплый».
  - В брифе тон «смелый». Впишите в tone-word слово «смелый».
  - В брифе тон «спокойный». Впишите в tone-word слово «спокойный».
  - В таблице должно быть четыре строки осей.
  - В ячейках pos должны стоять цифры от 1 до 5, по одной на ось.
  - У каждой оси нужно пояснение в ячейке why.
  - Нужно три принципа, каждый в своём элементе li с классом principle.
  - У каждого принципа нужен пример «Так» в элементе с классом do.
  - У каждого принципа нужен пример «Не так» в элементе с классом dont.
  - Нужно три слова, которые вы используете (class="use").
  - Нужно три слова, которые вы не используете (class="avoid").
  - Тот же блок в противоположном тоне нужно написать целиком, хотя бы в шесть слов.
  - Текст под заголовком в вашем тоне нужно написать целиком, хотя бы в шесть слов.
  sources:
  - title: The Four Dimensions of Tone of Voice (Nielsen Norman Group)
