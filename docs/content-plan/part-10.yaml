part: 10
slug: texts
title: Тексты для веба
era: null
summary: 'Как люди читают с экрана и как писать для них: информационный стиль, перевёрнутая пирамида, заголовки, микротексты,
  тон, юридические и экспертные тексты — на материале вашего проекта.'
