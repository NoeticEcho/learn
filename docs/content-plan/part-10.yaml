- id: 10-texts/05-tone-of-voice
  order: 5
  title: Тон голоса и гайд по стилю
  summary: 'Зачем: вы опишете, как звучит ваш проект (формальный или дружеский, серьёзный или лёгкий), и составите короткий
    гайд с примерами «так — не так», чтобы все тексты звучали одним голосом.'
  minutes: 15
  teaches:
  - texts.tone-of-voice
  requires:
  - texts.info-style
  - texts.microcopy
  diagram: 'Четыре оси тона (NN/g): шутливый ↔ серьёзный, формальный ↔ разговорный, уважительный ↔ дерзкий, энтузиазм ↔ сдержанность;
    ползунки меняют пример абзаца и кнопки в реальном времени.'
  practice: Любая эпоха. Человек выставляет тон по полю brief.tone (оси), пишет три принципа, три слова, которые используем,
    три, которые не используем, и переписывает один блок главной страницы в двух тонах для brief.forWhom.
  checks:
  - Положение на четырёх осях соответствует brief.tone, и это объяснено.
  - Для каждого принципа есть пара примеров «так / не так» на материале проекта.
  - Списки «используем / не используем» содержат конкретные слова.
  - Один и тот же блок написан в двух тонах, и разница видна.
  sources:
  - title: 'NN/g: The Four Dimensions of Tone of Voice'
    url: https://www.nngroup.com/articles/tone-of-voice-dimensions/
    licence: proprietary-link
    kind: article
    lang: en
  - title: Mailchimp Content Style Guide
    url: https://styleguide.mailchimp.com/
    licence: link-only
    kind: docs
    lang: en
  - title: 'GOV.UK: Writing for GOV.UK'
    url: https://www.gov.uk/guidance/content-design/writing-for-gov-uk
    licence: proprietary-link
    kind: docs
    lang: en
  - title: 'GOV.UK: A to Z of GOV.UK style'
    url: https://www.gov.uk/guidance/style-guide/a-to-z-of-gov-uk-style
    licence: proprietary-link
    kind: docs
    lang: en
  videos: []
- id: 10-texts/06-legal-expert-texts
  order: 6
  title: Юридические и экспертные тексты
  summary: 'Зачем: вы напишете страницу об обработке персональных данных и согласие простым языком, не теряя юридической точности,
    и поймёте границы экспертного текста: как рассказать о своей квалификации и результатах, не нарушая закона о рекламе и
    профессиональной этики.'
  minutes: 25
  teaches:
  - texts.legal-text
  - texts.expert-text
  requires:
  - texts.info-style
  - texts.tone-of-voice
  - data.privacy-by-design
  diagram: 'Редактор «юридически → по-человечески»: слева фрагмент типовой политики, справа его пересказ; галочки показывают,
    что обязательно сохранить (оператор, цели, сроки, права), а что можно упростить. Вторая вкладка — лента утверждений («лучший
    эксперт», «выиграли 95 дел», «гарантируем результат») с метками допустимо / нужен источник / нельзя.'
  practice: Любая эпоха. Человек пишет краткое пояснение для формы brief.mainAction и страницу о персональных данных по структуре
    (кто оператор, какие данные, зачем, сколько хранится, как отозвать); затем проверяет brief.proofs на допустимость формулировок
    и добавляет источники к каждому доказательству.
  checks:
  - Названы оператор, список собираемых данных, цели обработки, срок и способ отзыва согласия.
  - Согласие выражено отдельным действием (галочка), а не вшито в кнопку отправки.
  - 'Каждое доказательство из brief.proofs подкреплено проверяемым источником: документ, номер, ссылка.'
  - В тексте нет гарантий результата и сравнений с другими в превосходной степени, если профессия их ограничивает (для адвокатов
    и экспертов).
  - Для услуг проекта указано, кто исполнитель и в каком статусе (самозанятый, ИП, юрлицо).
  sources:
  - title: Федеральный закон № 152-ФЗ «О персональных данных»
    url: https://www.consultant.ru/document/cons_doc_LAW_61801/
