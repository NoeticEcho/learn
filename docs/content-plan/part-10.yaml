- id: 10-writing/04-microcopy
  order: 4
  title: Микротексты и UX-writing
  summary: Вы научитесь писать кнопки, подписи и подсказки в формах, сообщения об ошибках и ответ после отправки так,
    чтобы посетитель понимал, что делать и что будет дальше. После урока у формы вашего проекта есть все эти тексты, а
    рядом с ней понятное согласие на обработку данных.
  minutes: 20
  teaches:
  - texts-microcopy
  requires:
  - texts-info-style
  - html-forms
  diagram: "FormBeforeAfter: одна форма заявки дважды, с типичными словами и переписанная; три момента (заполняют, ошибка,
    отправлено); нажатие на любой текст объясняет, что с ним не так или что в нём сделано; кнопка «после» берёт главное
    действие из брифа."
  practice: 'Форма для главного действия вашего проекта собрана, но слова в ней не написаны. Впишите: заголовок формы (h2
    с классом form-title), подписи двух полей (в элементах label), подсказку под каждым полем (span с классом hint),
    текст согласия (label с классом consent), текст кнопки: он должен называть главное действие из брифа. В заметке «Что
    сайт скажет» напишите три сообщения об ошибках (class="error") и сообщение после отправки (class="success"): в нём
    срок. В ошибках не должно быть слов «неверно», «неправильно» и номеров ошибок. Все «…» нужно заменить. Эпоха: 8.'
  checks:
  - В форме осталось многоточие «…». Впишите заголовок, подписи, подсказки и текст согласия.
  - В заметке «Что сайт скажет» осталось многоточие «…».
  - У каждого поля должна быть подпись в label, привязанная к полю через for и id.
  - Заголовок формы должен состоять хотя бы из двух слов.
  - Кнопка должна называть главное действие из брифа теми же словами, а не «Отправить».
  - Нужны две подсказки под полями (span с классом hint).
  - "В тексте согласия должно быть слово «обработку»: на обработку каких данных и зачем человек соглашается."
  - Согласие должно быть отдельной галочкой (input type="checkbox"), а не частью кнопки.
  - Галочка согласия не должна быть отмечена заранее. Уберите атрибут checked.
  - Нужно три сообщения об ошибках с классом error.
  - В сообщениях об ошибках остались слова «неверно», «неправильно» или номер ошибки. Опишите, что не так, без упрёка.
  - Хотя бы одно сообщение об ошибке слишком короткое. Напишите, что не так и что сделать, не меньше шести слов.
  - "В сообщении после отправки нет срока. Скажите, когда ответите: «сегодня до 18:00» или «в течение часа»."
  sources:
