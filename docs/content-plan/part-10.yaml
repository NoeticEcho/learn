- id: 10-writing/02-info-style
  order: 2
  title: "Информационный стиль: «Пиши, сокращай»"
  summary: "Вы научитесь вычищать из текста пустые оценки, вводные слова и канцелярит и заменять их фактами: числом,
    сроком, документом, примером. После урока описание вашего проекта и каждой услуги коротко, конкретно, и в нём можно
    проверить каждое слово."
  minutes: 20
  teaches:
  - texts-info-style
  - texts-stop-words
  requires:
  - texts-screen-reading
  diagram: "StopWordLens: окно с текстом; шесть коротких словарей подсвечивают оценки без фактов, усилители, канцелярит,
    пустые обороты, штампы и цепочки существительных; счётчик слов и доля помеченных; кнопки «было» и «стало»; можно
    вставить свой текст, он остаётся в браузере."
  practice: 'Внизу страницы, в заметке «Было», стоит описание вашего проекта в худшем виде: с оценками и канцеляритом.
    Перепишите его по-новому прямо на странице. В абзаце class="lead" в 2–3 коротких предложениях скажите, чем вы
    занимаетесь и для кого, без оценок и штампов. В каждом пункте списка замените многоточие в абзаце class="fact"
    проверяемым фактом: числом, сроком, документом, названием или примером. Заметку «Было» оставьте: пара «было и стало»
    нужна для галереи. Все «…» нужно заменить. Эпоха: 8.'
  checks:
  - Где-то осталось многоточие «…». Замените его своими словами.
  - "Абзац lead должен быть коротким, но не пустым: от 40 до 300 знаков. Сейчас он выходит за эти рамки."
  - "В тексте остались оценки или канцелярит: «лучший», «качественный», «уникальный», «индивидуальный подход», «широкий
    спектр», «команда профессионалов», «надёжный», «осуществляем», «является», «в целях», «в рамках». Замените их
    фактами."
  - У каждой услуги или товара из брифа нужен свой абзац class="fact" внутри пункта списка.
  - Ни в одном из фактов нет числа. Хотя бы в некоторых назовите срок, цену, количество или год.
  - "Заметка «Было» пропала. Верните её: она нужна, чтобы видеть разницу."
  sources:
  - title: "Максим Ильяхов: сайт автора («Пиши, сокращай», «Главред»)"
