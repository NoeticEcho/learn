- id: 10-writing/03-pyramid
  order: 3
  title: Перевёрнутая пирамида и заголовки
  summary: Вы научитесь ставить главное в начало текста, а подробности в конец, и писать заголовки, которые честно
    говорят, что внутри, и читаются во вкладке, в поиске, в соцсети и в письме. После урока у страницы вашего проекта
    есть заголовок, описание и первый абзац с ответом.
  minutes: 20
  teaches:
  - texts-inverted-pyramid
  - texts-headlines
  requires:
  - texts-info-style
  - html-open-graph
  diagram: "PyramidHeadlines, две вкладки. Пирамида: шесть абзацев вымышленной страницы переставляются кнопками, ползунок
    «читатель дочитал до…» показывает, чего он не узнал. Заголовок: title и description со счётчиками знаков и
    предпросмотр во вкладке, выдаче, соцсети и теме письма; стартовые значения из брифа."
  practice: 'Соберите главную страницу проекта по пирамиде и подпишите её для поиска и соцсетей. В head впишите title (до
    65 знаков), description (50–170 знаков), og:title и og:description. В article с идентификатором lead-page напишите
    h1, первый абзац class="lead" (в нём ответ на вопрос посетителя и главное действие из брифа, теми же словами), затем
    абзац class="detail" с подробностями и абзац class="background" с предысторией. В заметке придумайте три заголовка
    разными способами (способ впишите в class="approach"), выберите один и объясните выбор. Все «…» нужно заменить.
    Эпоха: 8.'
  checks:
  - Заголовок вкладки (title) должен быть от 10 до 65 знаков и без многоточия.
  - В meta description нужен текст от 50 до 170 знаков, без «…».
  - В og:title впишите заголовок для соцсети, до 90 знаков, без «…».
  - В og:description нужен текст от 40 до 200 знаков, без «…».
  - В первом абзаце (class="lead") не нашлось главного действия из брифа. Назовите его теми же словами.
  - "В article нужно три абзаца: lead, detail и background, в этом порядке."
  - В article осталось многоточие «…». Замените его своими словами.
  - В заметке про три заголовка осталось многоточие «…». Замените его своими словами.
  - Нужно три заголовка, у каждого свой способ в class="approach".
  - В поле «Выбран вариант» впишите цифру 1, 2 или 3.
  - Объясните выбор хотя бы в четыре слова.
  sources:
