- id: 10-texts/03-inverted-pyramid-headlines
  order: 3
  title: Перевёрнутая пирамида и заголовки
  summary: 'Зачем: вы научитесь ставить главное в начало текста, а подробности — в конец, и писать заголовки, которые честно
    сообщают, что внутри; такие, что их понятно и в выдаче поисковика, и в карточке соцсети.'
  minutes: 20
  teaches:
  - texts.inverted-pyramid
  - texts.headlines
  requires:
  - texts.info-style
  - html.open-graph
  diagram: 'Перетаскиваемая пирамида: абзацы текста — блоки, их ставишь от самого важного к второстепенному; ползунок «обрезать
    снизу» показывает, что остаётся у читателя. Рядом лента из четырёх мест, где виден заголовок (вкладка, выдача, соцсеть,
    письмо), с ограничением по длине.'
  practice: Любая эпоха. Человек переписывает страницу или статью из brief.sections по схеме пирамиды (вывод первым), пишет
    три варианта заголовка и описание для выдачи и Open Graph; выбирает вариант и записывает причину.
  checks:
  - Первый абзац отвечает на вопрос, ради которого посетитель пришёл (связан с brief.mainAction или brief.forWhom).
  - Заголовок называет предмет и пользу, не обещает того, чего нет на странице.
  - Заголовок страницы и описание укладываются в рекомендованную длину и различаются между страницами.
  - Три варианта заголовка различаются по подходу, а не одним словом.
  sources:
  - title: 'NN/g: Inverted Pyramid — Writing for Web'
    url: https://www.nngroup.com/articles/inverted-pyramid/
    licence: proprietary-link
    kind: article
    lang: en
  - title: 'NN/g: Microcontent — How to Write Headlines, Page Titles, and Subject Lines'
    url: https://www.nngroup.com/articles/microcontent-how-to-write-headlines-page-titles-and-subject-lines/
    licence: proprietary-link
    kind: article
    lang: en
  - title: 'Wikipedia: Inverted pyramid (journalism)'
    url: https://en.wikipedia.org/wiki/Inverted_pyramid_(journalism)
    licence: CC-BY-SA
    kind: article
    lang: en
  - title: 'Максим Ильяхов: сайт автора'
    url: https://maximilyahov.ru/
    licence: proprietary-link
    kind: book
    lang: ru
  videos: []
- id: 10-texts/04-microcopy
  order: 4
  title: Микротексты и UX-writing
  summary: 'Зачем: вы научитесь писать кнопки, подсказки в формах, сообщения об ошибках и пустые состояния так, чтобы посетитель
    понимал, что делать дальше; это именно то место, где форма заявки либо работает, либо нет.'
  minutes: 20
  teaches:
  - texts.microcopy
  requires:
  - html.forms
  - texts.info-style
  diagram: 'Сравнение форм «до/после»: слева форма с типичными «Отправить», «Ошибка 422», справа — исправленная; клик по месту
    показывает, что было неясно, и подставляет вариант; игра «угадай, что произойдёт после нажатия».'
  practice: 'Любая эпоха. Человек пишет микротексты для формы brief.mainAction: заголовок, подписи полей, подсказки, текст
    кнопки, три сообщения об ошибках, сообщение после отправки, текст рядом с согласием на обработку данных.'
  checks:
  - Текст кнопки называет действие (brief.mainAction), а не «Отправить».
  - Каждое сообщение об ошибке говорит, что случилось и что сделать.
  - Сообщение после отправки сообщает, что будет дальше и когда.
  - Подписи полей не исчезают при вводе и не повторяют друг друга.
  - Рядом с формой есть формулировка согласия, понятная без юриста.
  sources:
  - title: 'NN/g: UX Copy Sizes: Long, Short, and Micro'
    url: https://www.nngroup.com/articles/ux-copy-sizes/
    licence: proprietary-link
    kind: article
    lang: en
  - title: 'NN/g: The 3 I''s of Microcopy'
    url: https://www.nngroup.com/articles/3-is-of-microcopy/
    licence: proprietary-link
    kind: article
    lang: en
  - title: 'NN/g: UX Writing Study Guide'
    url: https://www.nngroup.com/articles/ux-writing-study-guide/
    licence: proprietary-link
    kind: article
    lang: en
  - title: Google developer documentation style guide
    url: https://developers.google.com/style
    licence: CC-BY
    kind: docs
    lang: en
