lessons:
- id: 10-writing/01-screen-reading
  order: 1
  title: Как люди читают с экрана
  summary: Вы увидите, что посетитель не читает страницу, а ищет на ней ответ, и научитесь строить текст так, чтобы
    главное нашлось за пять секунд. После урока у главной страницы вашего проекта есть первый экран, подзаголовки и
    короткие абзацы, а вы умеете проверить её «пятью секундами».
  minutes: 15
  teaches:
  - texts-screen-reading
  requires:
  - start-project-brief
  - html-semantic-elements
  - design-visual-hierarchy
  diagram: "ScanSimulator: одна страница вымышленной мастерской в двух видах, «стена текста» и «страница для
    сканирования». Ползунок задаёт секунды взгляда, подсвечиваются слова, которые посетитель успел бы заметить, и список
    вопросов, на которые по увиденному можно ответить (что, кто, сколько, что делать). Учебная модель, не измерение."
  practice: "Сейчас главная страница вашего проекта это один сплошной абзац. Разберите её. Соберите первый экран в
    элементе header с идентификатором first-screen: заголовок h1, кто вы, для кого проект и ссылка a с главным
    действием. Остальное положите в main: для каждого раздела из брифа сделайте заголовок h2 и один-два коротких абзаца
    (каждый p на отдельной строке файла). Услуги или товары запишите списком ul. Затем посмотрите на страницу ровно пять
    секунд, закройте и впишите в заметку, что вы поняли и чего не нашли. Все «…» нужно заменить. Эпоха: 8."
  checks:
  - В элементе с идентификатором first-screen нет описания, кто вы и что делаете. Добавьте поле «кто и что» из брифа.
  - В first-screen не сказано, для кого проект. Добавьте это поле из брифа.
  - Ссылка a в first-screen должна называть главное действие тем же текстом, что в брифе.
  - Не у каждого раздела из брифа есть свой заголовок h2 в main. Название раздела должно стоять в тексте заголовка.
  - Заголовков h2 в main меньше, чем разделов в брифе.
  - Каждая услуга или товар из брифа должна стоять в своём пункте li списка.
  - Где-то в main абзац слишком длинный. Разбейте его на несколько p, каждый на своей строке файла.
  - В заметке про пять секунд осталось многоточие «…». Замените его своими словами.
  - Запишите, что вы поняли за пять секунд. Хотя бы одну фразу.
  sources:
  - title: F-Shaped Pattern For Reading Web Content, исходное исследование (Nielsen Norman Group)
    url: https://www.nngroup.com/articles/f-shaped-pattern-reading-web-content-discovered/
    licence: proprietary-link
    kind: article
    lang: en
  - title: "F-Shaped Pattern of Reading on the Web: Misunderstood, But Still Relevant (Nielsen Norman Group)"
    url: https://www.nngroup.com/articles/f-shaped-pattern-reading-web-content/
    licence: proprietary-link
    kind: article
    lang: en
  - title: How Users Read on the Web (Nielsen Norman Group)
    url: https://www.nngroup.com/articles/how-users-read-on-the-web/
    licence: proprietary-link
    kind: article
    lang: en
