  - id: 13-growth/07-geo
    order: 7
    title: "GEO: как попасть в ответы ИИ"
    summary: "Вы поймёте, как ИИ-поиск собирает ответ из страниц, что об этом известно и что нет, и сделаете страницы,
      которые можно процитировать: ответ в первом предложении, факты списком, автор и дата. После урока у вас две
      переписанные страницы и записанные решения о ботах и файле llms.txt."
    minutes: 25
    teaches:
      - growth.geo
    requires:
      - growth.seo-crawl-index-rank
      - html.semantic-elements
      - texts.inverted-pyramid
    diagram: "AnswerLab: «Чат с ИИ-поиском» (part 13, lesson 7). A toy model of how an AI answer engine might choose sources
      for one question. The reader switches features of their own page on and off (a direct first sentence, a list of
      facts, an author and a date, references to sources, keyword stuffing, hidden text, a robots.txt that blocks the
      search bot) and watches a made-up «ответ» change and a «цитируемость» meter move. The weights are the author's
      teaching choices, built from what the GEO paper (Aggarwal et al., 2023) and the search engines' own guidance say
      qualitatively; no real system is known to work like this, and the diagram says so."
    practice: "Подготовьте две страницы. На каждой: заголовок-вопрос (оканчивается знаком «?»), первый абзац из одного
      предложения, которое отвечает на этот вопрос, строка с автором и датой обновления (тег time с атрибутом datetime в
      виде 2026-10-27), список из не менее трёх фактов. Фактов на двух страницах вместе не меньше шести; если в брифе
      есть услуги, назовите их среди фактов. Скрытого текста быть не должно. Затем заполните решения для ботов: не
      меньше трёх строк с решением (допустить или закрыть) и причиной не короче четырёх слов, и решение по файлу
      llms.txt (не короче восьми слов). Все «…» нужно заменить. Эпоха: 7."
    checks:
      - В решениях для ботов осталось многоточие «…». Заполните таблицу и строку про llms.txt.
      - "На страницах остались «…»: заполните вопросы, ответы, авторов, даты и факты."
      - Нужны две страницы с классом page.
      - Заголовок страницы должен быть вопросом и заканчиваться знаком «?».
      - Первый абзац должен быть одним предложением (20–250 знаков), без точек внутри и с точкой в конце.
      - "У каждой страницы должен быть автор: впишите имя в span с классом author."
      - В строке с автором назовите человека из брифа (поле «люди»).
      - Дата обновления пишется в теге time с атрибутом datetime в виде 2026-10-27.
      - Фактов на двух страницах должно быть не меньше шести.
      - Среди фактов назовите хотя бы одну услугу или позицию из брифа.
      - "На странице есть скрытый текст (hidden или display:none). Уберите его: скрытый текст считается обманом."
      - В таблице решений должно быть не меньше трёх строк.
      - "Назовите в таблице хотя бы одного бота по имени: например GPTBot или Googlebot."
      - Решение должно начинаться со слова «Допустить» или «Закрыть».
      - Причину напишите не короче чем в четыре слова.
      - "Про llms.txt напишите не короче восьми слов: пишете ли вы его и почему."
    sources:
