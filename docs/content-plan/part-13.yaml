  - id: 13-growth/05-seo
    order: 5
    title: "SEO: сканирование, индексация, ранжирование"
    summary: "Вы поймёте, как поисковик находит страницу, запоминает её и решает, кому показать, и сделаете то, что зависит
      от сайта: уникальные title и description для каждого раздела, один заголовок первого уровня, канонический адрес.
      После урока у вас есть паспорт каждой страницы проекта и план подключения Яндекс Вебмастера и Google Search
      Console."
    minutes: 30
    teaches:
      - growth.seo-crawl-index-rank
      - growth.yandex-vs-google
      - growth.seo-content-links
    requires:
      - net.http-status-headers
      - html.head-meta
      - html.semantic-elements
      - texts.headlines
    diagram: "IntentSorter: «Что человек хочет на самом деле» (part 13, lesson 5). Eight search queries of a made-up
      land-law specialist's audience. The reader labels each with one of four intents (узнать, выбрать, сделать, найти
      конкретное место) and gets an immediate reading: which page type serves that intent and which stage of
      See–Think–Do–Care it belongs to (part 11). Some queries are honestly ambiguous, and the diagram says so rather
      than pretending that intent is always one thing."
    practice: "Подготовьте страницу для поиска. 1) В head главной страницы: title до 60 знаков с названием проекта,
      description 50–160 знаков, канонический адрес (полный, с https://) и, если в брифе есть английский, пару ссылок
      hreflang для ru и en. На странице один заголовок первого уровня. 2) В таблице «Паспорта страниц» для каждого
      раздела из брифа: адрес (начинается с /, латиницей), title (10–60 знаков, в нём название раздела) и description
      (50–160 знаков). 3) Напишите, как вы подключите сайт к Яндекс Вебмастеру и Google Search Console (способ
      подтверждения прав), и под какой запрос пишется главная. Все «…» нужно заменить. Эпоха: 5."
    checks:
      - Где-то осталось многоточие «…». Заполните адреса, title, description и два текста внизу.
      - Title главной должен быть длиной от 10 до 60 знаков.
      - В title главной должно быть название проекта (поле «название» брифа).
      - В head нужен meta name="description" длиной от 50 до 160 знаков.
      - Нужен link rel="canonical" с полным адресом, начинающимся с https://.
      - 'В брифе есть английский: добавьте две ссылки link rel="alternate" hreflang для ru и en.'
      - На странице должен быть ровно один h1.
      - В таблице должна быть строка для каждого раздела из брифа.
      - "Адрес пишется латиницей, начинается с / и не содержит пробелов: например /uslugi/."
      - Title страницы должен быть длиной от 10 до 60 знаков.
      - В title каждой страницы должно встретиться название её раздела из брифа.
      - Description страницы должен быть длиной от 50 до 160 знаков.
      - В описании подключения назовите и Яндекс Вебмастер, и Google Search Console.
      - "Запрос запишите не короче чем тремя словами: как его ввёл бы человек."
