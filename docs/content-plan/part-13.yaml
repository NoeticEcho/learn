  - id: 13-growth/08-local-seo
    order: 8
    title: "Локальное SEO: карточка организации и LocalBusiness"
    summary: "Вы сделаете так, чтобы вас находили по запросам «рядом» и «в моём городе»: заполните карточку организации и
      поставите на сайт согласованные с ней данные и разметку LocalBusiness. После урока у вас готовы данные для
      карточки (название, адрес или зона обслуживания, часы, категории) и блок разметки с теми же сведениями."
    minutes: 25
    teaches:
      - growth.local-seo
    requires:
      - growth.technical-seo
      - growth.structured-data
      - copy.four-p-picture
    diagram: "LocalNap: «Адрес на сайте и в карточке» (part 13, lesson 8). Two columns of the same three facts (название,
      адрес, телефон): what the site says and what the directory card says. The card starts a little different, as cards
      do after a move or a rebrand. The diagram marks every mismatch, counts the agreeing facts and, below, shows the
      three things local search is said to weigh (соответствие запросу, расстояние, известность) on three made-up
      organisations, with sliders for the reader's own. The ranking is a teaching model: the services publish the
      factors, not the weights."
    practice: "Подготовьте данные для карточки и разметку. 1) В блоке «Карточка» впишите название, адрес и телефон теми же
      словами, что в брифе (в поле «Телефон» номер из брифа), часы работы (с временем вида 10:00), от одной до трёх
      категорий, перечень услуг (если в брифе есть услуги, назовите их), зону обслуживания (для проекта без офиса
      опишите, куда вы выезжаете, или напишите, что принимаете по адресу) и описание без гарантий и сравнений («лучший»,
      «гарантируем», «№1»). 2) В head разметка JSON-LD типа LocalBusiness (или подходящего подтипа): название, адрес,
      телефон, часы работы и зона обслуживания. Все «…» нужно заменить. Эпоха: 5."
    checks:
      - В карточке остались «…». Заполните все поля.
      - Название в карточке должно совпадать с названием из брифа.
      - Адрес в карточке должен совпадать с адресом из брифа слово в слово.
      - Телефон в карточке должен совпадать с телефоном из брифа.
      - В часах работы в карточке нужно время вида 10:00.
      - На сайте в строке «Часы работы» нужно время вида 10:00.
      - Укажите от одной до трёх категорий.
      - В перечне услуг назовите услуги из брифа.
      - Зону обслуживания опишите не короче чем тремя словами.
      - В карточке остались слова гарантии или сравнения («гарантируем», «лучший», «№1», «100%»). Уберите их.
      - В разметке нужен тип LocalBusiness или его подтип, например ProfessionalService.
      - В разметке название должно совпадать с названием из брифа.
      - В разметке нужен телефон из брифа.
      - В разметке нужен адрес из брифа в поле streetAddress.
      - "В разметке нужны часы работы: openingHoursSpecification или openingHours."
      - "В разметке нужна зона обслуживания: areaServed."
