- id: 13-growth/06-local-seo
  order: 6
  title: 'Локальное SEO: карточка в Яндекс Бизнесе и Google'
  summary: 'Зачем: сделать так, чтобы эксперта и местное дело находили по запросам «рядом» и «в моём городе»: карточка организации,
    адрес, отзывы, разметка на сайте. После урока человек заполняет карточку и разметку LocalBusiness.'
  minutes: 20
  teaches:
  - growth.local-seo
  requires:
  - growth.technical-seo
  - html.head-meta
  - copy.four-p-picture
  diagram: 'Карта и выдача «рядом»: человек меняет данные карточки (категория, часы, адрес) и разметку, а список результатов
    перестраивается; подсвечиваются несоответствия между сайтом и карточкой (NAP).'
  practice: 'Эпоха 3/5: подготовить данные для карточки в Яндекс Бизнесе из brief.contacts и brief.who (название, адрес или
    зона обслуживания, часы, категории, фото, ссылка) и вставить на сайт разметку schema.org LocalBusiness с теми же данными.
    Если у проекта нет офиса, описать зону обслуживания. Для регулируемых профессий проверить, что в карточке нет запрещённых
    утверждений.'
  checks:
  - Название, адрес и телефон в карточке и на сайте совпадают с brief.contacts.
  - Разметка LocalBusiness содержит как минимум название, контакты и часы работы.
  - Указаны категории, соответствующие brief.items.
  - Для проекта без офиса задана зона обслуживания.
  - В карточке нет гарантий результата и сравнений с другими.
  sources:
