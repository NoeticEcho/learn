- id: 13-growth/04-seo
  order: 4
  title: 'SEO: как поисковик находит, индексирует и ранжирует'
  summary: 'Зачем: понять цепочку «сканирование → индексация → ранжирование» в Яндексе и Google и сделать то, что зависит
    от сайта: доступность для робота, адреса, заголовки, содержание. После урока человек готовит robots.txt, sitemap и теги
    страницы.'
  minutes: 25
  teaches:
  - growth.seo-crawl-index-rank
  - growth.technical-seo
  - growth.seo-content-links
  - growth.yandex-vs-google
  requires:
  - net.http-status-headers
  - html.head-meta
  - html.semantic-elements
  - texts.headlines
  diagram: 'Игра «паук»: робот идёт по ссылкам миниатюрного сайта; человек открывает и закрывает страницы в robots.txt, добавляет
    sitemap и видит, какие страницы попали в индекс и по каким запросам показываются.'
  practice: 'Эпоха 5 (генератор статических сайтов): сгенерировать robots.txt и sitemap.xml, задать для каждого раздела из
    brief.sections уникальные title и description, канонический адрес и описание страницы на языке из brief.languages (с hreflang,
    если языков больше одного). Подключить сайт в Яндекс Вебмастере и Google Search Console (на бумаге или в песочнице).'
  checks:
  - robots.txt лежит в корне и не закрывает нужные страницы.
  - sitemap перечисляет страницы всех разделов из brief.sections.
  - У каждой страницы свой title до 60 символов и description, оба содержат тему раздела.
  - Для нескольких языков из brief.languages прописаны hreflang.
  - Закрытые от индекса страницы (спасибо, личный кабинет) помечены noindex, а не только robots.txt.
  sources:
