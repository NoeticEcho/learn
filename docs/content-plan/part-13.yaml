  - id: 13-growth/06-technical-seo
    order: 6
    title: Техническое SEO и разметка JSON-LD
    summary: "Вы сделаете сайт удобным для робота: robots.txt, карта сайта, канонические адреса, noindex для служебных
      страниц, и расскажете поисковику, о чём страница, разметкой schema.org в формате JSON-LD. После урока у вас готовы
      файлы robots.txt и sitemap.xml, список страниц, закрытых от индекса, и блок JSON-LD с данными вашего проекта."
    minutes: 30
    teaches:
      - growth.technical-seo
      - growth.structured-data
    requires:
      - growth.seo-crawl-index-rank
      - html.lang-i18n
    diagram: "SpiderGame: «Паук» (part 13, lesson 6). A made-up site of seven pages with the links between them. For each
      page the reader can close it in robots.txt and mark it noindex, and switch a sitemap on or put a link to the
      orphan page on the home page. A small crawler walks the links from the home page and the diagram states, page by
      page, what the robot found, whether it could read the page and whether it will be kept in the index. The rules are
      the ones the search engines state (a page closed in robots.txt cannot show its noindex; a sitemap is a hint, not a
      command); the site is made up."
    practice: "Подготовьте технические части сайта. 1) robots.txt в блоке «Файлы для робота»: строка User-agent, закрыты
      только служебные разделы (не весь сайт: Disallow: / запрещено) и строка Sitemap с полным адресом на https://. 2)
      Адреса для sitemap.xml: по одному полному адресу на каждый раздел из брифа, и сам файл sitemap.xml с тегами urlset
      и loc. 3) Что закрыть от индекса: не меньше двух служебных страниц (например «Спасибо» и личный кабинет) с адресом
      и способом; хотя бы одна закрыта через noindex. 4) В head страницы блок JSON-LD с @context schema.org, @type,
      названием и адресом проекта и контактом (телефон или почта из брифа). Все «…» нужно заменить. Эпоха: 5."
    checks:
      - Где-то осталось многоточие «…». Заполните robots.txt, адреса, sitemap и список закрытых страниц.
      - 'В JSON-LD нужен "@context": "https://schema.org".'
      - 'В JSON-LD нужен "@type" с названием типа с большой буквы: например "Organization".'
      - В JSON-LD "name" должно совпадать с названием проекта из брифа.
      - В JSON-LD нужен "url" с полным адресом сайта на https://.
      - В JSON-LD нужен "telephone" или "email" со значением в кавычках.
      - "В robots.txt нужна строка User-agent: например «User-agent: *»."
      - "В robots.txt есть «Disallow: /»: это закрывает весь сайт. Закройте только служебные разделы."
      - В robots.txt нужна строка «Sitemap:» с полным адресом, начинающимся с https://.
      - Адресов должно быть не меньше, чем разделов в брифе.
      - "Адрес должен быть полным: начинаться с https:// и не содержать пробелов."
      - В sitemap.xml нужны теги urlset и loc с полным адресом. В pre пишите &lt; и &gt; вместо знаков меньше и больше.
      - В списке закрытых страниц должно быть не меньше двух.
      - Адрес закрытой страницы пишется латиницей и начинается с /.
      - Хотя бы одна служебная страница должна быть закрыта через noindex.
      - В head нужен link rel="canonical" с полным адресом на https://.
    sources:
