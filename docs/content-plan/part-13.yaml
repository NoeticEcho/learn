  - id: 13-growth/04-smm-russia
    order: 4
    title: "Соцсети в России: Telegram, ВКонтакте, видео и метки UTM"
    summary: Вы выберете два канала, где действительно находятся ваши люди, и научитесь вести их так, чтобы они вели на
      сайт, а не заменяли его. После урока у вас есть описание канала, три поста разных форм, каждый со ссылкой на
      раздел сайта с метками UTM, и решение, нужен ли вам бот в Telegram.
    minutes: 25
    teaches:
      - growth.smm-russia
      - growth.content-plan
      - growth.utm
    requires:
      - story.abt
      - texts.tone-of-voice
      - growth.automation-triggers
    diagram: "ChannelMap: «Карта каналов» (part 13, lesson 4). Five channels (Telegram, ВКонтакте, Дзен, видео, e-mail) and
      six kinds of project. For the chosen kind the diagram shows the author's teaching estimate of how well the channel
      reaches that audience and how much work it asks, and suggests two channels to start with. The estimates are a way
      to practise the reasoning, not a market statistic: audiences and platform rules in Russia have changed several
      times since 2022 and will change again."
    practice: "Заполните заметку. 1) Выберите два канала и для каждого напишите причину (не короче шести слов); в причинах
      должна встретиться формулировка «для кого» из брифа. 2) Описание канала длиной 12–120 знаков и ссылка на сайт с
      метками UTM (строчными латинскими буквами, с utm_source). 3) Три поста: у каждого форма (кейс, ABT или польза; все
      три разные), короткий текст, раздел сайта из брифа, на который он ведёт, и ссылка с метками utm_source, utm_medium
      и utm_campaign. Ссылки на разные разделы. 4) Пометка о рекламе: рекламные ли посты. 5) Нужен ли бот в Telegram и
      чем он поможет главному действию. Все «…» нужно заменить. Эпоха: 8."
    checks:
      - Где-то остались «…». Заполните каналы, описание, посты, пометку и бота.
      - Нужно ровно два канала.
      - Причину выбора канала напишите не короче чем в шесть слов.
      - В причинах выбора каналов должна встретиться формулировка «для кого» из брифа.
      - Описание канала должно быть длиной от 12 до 120 знаков.
      - Ссылка в описании должна начинаться с https:// и содержать utm_source строчными латинскими буквами.
      - Нужны три поста.
      - Среди форм должны встретиться кейс, ABT и польза.
      - "Посты должны вести на разные разделы сайта из брифа: впишите их названия теми же словами."
      - В ссылках постов метки идут в порядке utm_source, utm_medium, utm_campaign, строчными латинскими буквами без
        пробелов.
      - У каждого из трёх постов в ссылке должна быть метка utm_campaign.
      - "Напишите в пометке о рекламе не меньше пяти слов: рекламные ли посты и как вы их помечаете."
      - "Про бота напишите не короче восьми слов: нужен ли он и чем помогает главному действию."
    sources:
      - title: "Telegram: каналы"
        url: https://telegram.org/tour/channels
