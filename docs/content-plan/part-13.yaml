    url: https://yandex.ru/support/business-priority/
    licence: proprietary-link
    kind: docs
    lang: ru
  - title: 'Google Search Central: Creating helpful, reliable, people-first content'
    url: https://developers.google.com/search/docs/fundamentals/creating-helpful-content
    licence: CC-BY
    kind: docs
    lang: en
  - title: Федеральный закон «О рекламе» 38-ФЗ (КонсультантПлюс)
    url: https://www.consultant.ru/document/cons_doc_LAW_58968/
    licence: proprietary-link
    kind: docs
    lang: ru
  videos: []
- id: 13-growth/07-paid-and-law
  order: 7
  title: 'Платный трафик и юридические границы: реклама, ОРД, маркировка'
  summary: 'Зачем: запустить небольшую рекламную кампанию, не нарушив закон: понять, что считается рекламой, кому и что маркировать,
    как работают ОРД и ERID. После урока человек имеет пример объявления, бюджета и заполненной карточки маркировки.'
  minutes: 25
  teaches:
  - growth.paid-traffic
  - growth.ad-labelling
  requires:
  - growth.smm-russia
  - growth.seo-crawl-index-rank
  - copy.four-u
  diagram: 'Цепочка «рекламодатель → рекламная площадка → ОРД → ЕРИР»: человек вводит данные, получает токен ERID, и симулятор
    показывает, где пометка «Реклама» и токен должны стоять в объявлении; ошибки подсвечиваются.'
  practice: 'Эпоха 7: составить объявление для поиска и для соцсети по brief.mainAction (заголовок до 56 символов, текст до
    81), выбрать лендинг из brief.sections, посчитать бюджет «клик → заявка» (в предположениях) и заполнить карточку маркировки:
    рекламодатель, креатив, ОРД, токен. Проверить объявление на закон о рекламе и профессиональную этику.'
  checks:
  - Объявление ведёт на раздел из brief.sections и отражает brief.mainAction.
  - Указана пометка «Реклама», данные рекламодателя (brief.who) и место для токена ERID.
  - Названы ОРД и порядок отчётности.
  - Нет гарантий результата и недостоверных сравнений.
  - Бюджет посчитан в явных допущениях (клик, конверсия), а не взят из воздуха.
