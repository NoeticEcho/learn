  - id: 13-growth/09-paid-and-law
    order: 9
    title: Платный трафик, маркировка рекламы и ОРД
    summary: "Вы запустите (на бумаге) небольшую рекламу и не нарушите закон: поймёте, что считается рекламой, кому и что
      помечать, как работают ОРД и токен, и посчитаете бюджет в явных допущениях. После урока у вас есть объявление для
      поиска и для соцсети, расчёт «клик, заявка, цена заявки» и заполненная карточка маркировки."
    minutes: 30
    teaches:
      - growth.paid-traffic
      - growth.ad-labelling
    requires:
      - growth.smm-russia
      - growth.seo-crawl-index-rank
      - copy.four-u
      - growth.utm
    diagram: "AdLabel: «Путь рекламы до ЕРИР» (part 13, lesson 9). A made-up advertisement and a chain of five steps
      (advertiser, ad platform or blogger, ОРД, ЕРИР at Roskomnadzor): the reader chooses where the ad is bought,
      switches the «Реклама» label, the advertiser's details and the token (ERID) on and off and watches the preview and
      the checklist. The steps and the label's parts follow the public explanation of Yandex Direct (cited in the
      lesson); rules, deadlines and exceptions are the law's and change, so the diagram is a map for orientation and not
      a legal check."
    practice: "Заполните заметку. 1) Объявление для поиска и объявление для соцсети: заголовок 5–56 знаков, текст 20–81
      знак, раздел сайта из брифа, на который ведёт объявление, и пометка со словом «Реклама» и местом для токена
      (erid). В заголовках или текстах должно встретиться главное действие из брифа теми же словами. Обещаний результата
      и сравнений («лучший», «гарантируем», «№1») быть не должно. 2) Бюджет: в таблице допущений впишите деньги в месяц,
      цену клика, число кликов, конверсию клика в заявку (проценты), число заявок и стоимость заявки; цифры должны
      согласоваться. 3) Карточка маркировки: рекламодатель (название из брифа), креатив, ОРД и порядок отчётности (не
      короче шести слов, с упоминанием ОРД), токен. 4) Проверка объявления на закон о рекламе и профессиональную этику,
      не короче восьми слов. Все «…» нужно заменить. Эпоха: 7."
    checks:
      - Где-то остались «…». Заполните объявления, бюджет, карточку маркировки и проверку.
      - Заголовок объявления для поиска должен быть длиной от 5 до 56 знаков.
      - Текст объявления для поиска должен быть длиной от 20 до 81 знака.
      - Заголовок объявления для соцсети должен быть длиной от 5 до 56 знаков.
      - Текст объявления для соцсети должен быть длиной от 20 до 81 знака.
      - "Объявление должно вести на раздел сайта из брифа: впишите его название."
      - В заголовках или текстах должно встретиться главное действие теми же словами, что в брифе.
      - В пометке к объявлению для поиска нужны слово «Реклама» и место для токена (erid).
      - В пометке к объявлению для соцсети нужны слово «Реклама» и место для токена (erid).
      - В тексте остались обещания или сравнения («гарантируем», «лучший», «№1», «100%»). Уберите их.
      - Цену клика впишите числом.
      - Конверсию клика в заявку впишите числом.
      - Стоимость заявки впишите числом.
      - В карточке маркировки рекламодателем должно быть название из брифа.
      - Про ОРД и отчётность напишите не короче шести слов и назовите ОРД.
      - Проверку на закон и этику опишите не короче восьми слов.
