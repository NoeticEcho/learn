lessons:
- id: 13-growth/01-automation
  order: 1
  title: 'Автоматизация маркетинга: триггеры, сегменты, каскады'
  summary: 'Зачем: понять, как сообщения отправляются сами в ответ на действие человека, и спроектировать цепочку «подписался
    → получил → не ответил → напомнили» через несколько каналов. После урока человек рисует сценарий для главного действия
    из своего brief.'
  minutes: 20
  teaches:
  - growth.automation-triggers
  requires:
  - copy.funnel
  - copy.value-ladder
  - data.relational-model
  - server.webhooks
  diagram: 'Конструктор каскада: блоки «событие», «условие», «пауза», «сообщение (e-mail / Telegram / SMS)»; человек собирает
    цепочку, симулятор прогоняет трёх выдуманных посетителей по сегментам и показывает, кто что получил.'
  practice: 'Эпоха 6 (headless CMS и Jamstack): по brief.mainAction описать триггер (заявка, подписка, запись) и каскад из
    трёх сообщений в двух каналах, с условием выхода (человек ответил или записался). Сегменты строятся по brief.forWhom.'
  checks:
  - Есть триггер, соответствующий brief.mainAction.
  - Каскад содержит не менее трёх сообщений, паузу и условие выхода.
  - Использованы минимум два канала, и ни один не нарушает согласие на рассылку.
  - Сегмент сформулирован по полю из brief.forWhom, а не «все».
  - 'Для каждого сообщения указана цель: напомнить, доказать, предложить.'
  sources:
  - title: 'Wikipedia: Marketing automation'
    url: https://en.wikipedia.org/wiki/Marketing_automation
    licence: CC-BY-SA
    kind: article
    lang: en
  - title: 'Google: Email sender guidelines'
    url: https://support.google.com/a/answer/81126
    licence: proprietary-link
    kind: docs
    lang: en
  - title: Федеральный закон «О рекламе» 38-ФЗ (КонсультантПлюс)
    url: https://www.consultant.ru/document/cons_doc_LAW_58968/
    licence: proprietary-link
    kind: docs
    lang: ru
  - title: Федеральный закон «О персональных данных» 152-ФЗ (КонсультантПлюс)
    url: https://www.consultant.ru/document/cons_doc_LAW_61801/
    licence: proprietary-link
    kind: docs
    lang: ru
  videos: []
- id: 13-growth/02-email
  order: 2
  title: 'E-mail: доставляемость, согласие, отписка'
  summary: 'Зачем: сделать так, чтобы письма доходили и не нарушали закон: подтверждённый адрес, подписи домена, понятная
    отписка и честная тема. После урока человек пишет приветственное письмо и форму подписки с согласием.'
  minutes: 20
  teaches:
  - growth.email-basics
  - growth.email-law
  requires:
  - growth.automation-triggers
  - net.dns-records
  - html.forms
  - texts.microcopy
  diagram: 'Путь письма от формы до ящика: SPF, DKIM, DMARC включаются по очереди, и индикатор «в папку / в спам» меняется;
    рядом форма с галочкой согласия, которую человек правильно заполняет.'
  practice: 'Эпоха 3 (WordPress и плагины): форма подписки на странице из brief.sections с согласием на получение рассылки
    и на обработку данных (отдельные чекбоксы, не отмеченные заранее). Приветственное письмо на 80–120 слов: от кого, зачем,
    что дальше, как отписаться, с учётом brief.tone и brief.languages.'
  checks:
  - Форма содержит отдельное согласие и ссылку на политику обработки данных.
  - Чекбоксы не отмечены заранее.
  - В письме указан отправитель (brief.who), есть способ отписки и ссылка на brief.mainAction.
  - Тема письма описывает содержание и не обещает того, чего нет в письме.
  - Письмо написано на языке из brief.languages.
  sources:
  - title: 'Google: Email sender guidelines'
    url: https://support.google.com/a/answer/81126
    licence: proprietary-link
    kind: docs
    lang: en
  - title: Федеральный закон «О рекламе» 38-ФЗ (КонсультантПлюс)
    url: https://www.consultant.ru/document/cons_doc_LAW_58968/
    licence: proprietary-link
    kind: docs
    lang: ru
  - title: Федеральный закон «О персональных данных» 152-ФЗ (КонсультантПлюс)
    url: https://www.consultant.ru/document/cons_doc_LAW_61801/
    licence: proprietary-link
    kind: docs
    lang: ru
  - title: 'Роскомнадзор: Портал персональных данных'
    url: https://pd.rkn.gov.ru/
    licence: proprietary-link
    kind: docs
    lang: ru
