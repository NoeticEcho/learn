- id: 13-growth/05-geo
  order: 5
  title: 'GEO: как попасть в ответы ИИ'
  summary: 'Зачем: понять, как ИИ-поиск собирает ответы, и сделать сайт цитируемым: ясные факты, структура, разметка, доступность
    для ботов. После урока человек проверяет сайт по чек-листу и решает, нужен ли файл llms.txt.'
  minutes: 20
  teaches:
  - growth.geo
  requires:
  - growth.seo-crawl-index-rank
  - html.semantic-elements
  - texts.inverted-pyramid
  diagram: 'Чат-имитация ИИ-ответа: человек меняет страницу (добавляет факт, таблицу, автора, разметку), и ответ меняется,
    показывая, откуда ИИ берёт цитаты; шкала «цитируемость».'
  practice: 'Эпоха 7 (AI-конструктор): переписать две страницы из brief.sections так, чтобы первый абзац отвечал на один вопрос
    из brief.forWhom одним предложением, добавить автора и дату, таблицу или список фактов (из brief.items, brief.proofs),
    и решить, пишется ли llms.txt и какие боты допускаются в robots.txt.'
  checks:
  - На каждой из двух страниц первый абзац отвечает на конкретный вопрос адресата из brief.forWhom.
  - Указаны автор (brief.people) и дата обновления.
  - Факты вынесены в список или таблицу, а не размазаны по тексту.
  - Есть решение по llms.txt и допуску ботов с причиной.
  - Нет скрытого текста и набитых ключевых слов.
  sources:
  - title: 'Google Search Central: AI features and your website'
    url: https://developers.google.com/search/docs/appearance/ai-features
    licence: CC-BY
    kind: docs
    lang: en
