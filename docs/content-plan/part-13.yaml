- id: 13-growth/03-smm-russia
  order: 3
  title: 'SMM в России: VK, Telegram, YouTube'
  summary: 'Зачем: выбрать каналы, где реально находится аудитория проекта, и вести их так, чтобы они вели на сайт, а не заменяли
    его. После урока человек имеет контент-план на месяц и знает, что изменилось после 2022 года.'
  minutes: 20
  teaches:
  - growth.smm-russia
  - growth.content-plan
  requires:
  - story.abt
  - texts.tone-of-voice
  - growth.automation-triggers
  diagram: 'Карта каналов: ось «аудитория ↔ усилие» и карточки VK, Telegram, YouTube, Дзен, e-mail; человек расставляет их
    для своего типа проекта, а справа появляется предложение по частоте и форматам.'
  practice: 'Эпоха 4/5: подобрать два канала из списка для brief.forWhom, написать описание канала (до 120 символов) и три
    поста по структурам из части «Сторителлинг». Каждый пост ведёт на конкретный раздел из brief.sections. Для Telegram описать,
    нужен ли бот (запись, вопрос) и чем он помогает brief.mainAction.'
  checks:
  - Выбрано два канала и дано обоснование через brief.forWhom.
  - Описание канала состоит из кто и для кого, и есть ссылка на сайт.
  - Три поста используют разные формы (кейс, ABT, польза) и каждый ведёт на раздел из brief.sections.
  - Если пост рекламный, указана пометка и сказано про токен (см. урок про маркировку).
  - Тон постов соответствует brief.tone.
  sources:
  - title: 'Telegram: Channels'
    url: https://telegram.org/tour/channels
    licence: proprietary-link
    kind: docs
    lang: en
  - title: 'Telegram: Bots, an introduction for developers'
