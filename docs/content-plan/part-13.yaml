  - id: 13-growth/03-ladder-in-practice
    order: 3
    title: "Лестница ценности на деле: страница, «спасибо», учёт"
    summary: Вы соберёте механизм, который доставляет лид-магнит, честно предлагает следующий шаг и считает, что получилось.
      После урока у вас есть страница лид-магнита с формой из одного поля, страница «Спасибо» с доставкой и разовым
      предложением, от которого можно отказаться, и четыре события для учёта.
    minutes: 25
    teaches:
      - growth.ladder-in-practice
    requires:
      - growth.email-law
      - copy.core-offer-oto
      - copy.dark-patterns
    diagram: "LadderMath: «Арифметика лестницы» (part 13, lesson 3). A made-up month of visitors to a lead-magnet page and
      four conversion rates, step by step down the ladder. For every step the diagram shows the expected count and an
      honest range («примерно от … до …»: two standard deviations of a binomial count), so that the reader sees how wide
      the range is when the traffic is small and learns not to read a one-person difference as a trend. All numbers are
      made up."
    practice: "Соберите две страницы лестницы в заметке. 1) Страница лид-магнита: название материала (не меньше трёх слов),
      форма с одним полем (почта), двумя пустыми галочками (на обработку почты и на получение новостей) и кнопкой. 2)
      Страница «Спасибо»: ссылка для получения материала, ссылка на главное действие из брифа (теми же словами) и
      разовое предложение с ценой цифрой, кнопкой согласия и кнопкой отказа «Нет, спасибо». В разовом предложении не
      должно быть слов «только сегодня», «осталось», «последний шанс». Если в брифе есть услуги, предложение должно быть
      связано с одной из них. 3) Перечислите не меньше четырёх событий для учёта: названия латиницей через
      подчёркивание, например lead_form_view. Все «…» нужно заменить. Эпоха: 8."
    checks:
      - Где-то осталось многоточие «…». Заполните материал, ссылки, предложение и события.
      - "Назовите материал не короче чем в три слова: что человек получит."
      - В форме должно быть поле для почты.
      - "Уберите из формы телефон: для отправки материала на почту он не нужен."
      - "Нужны две галочки: согласие на обработку почты и на получение новостей."
      - "Ни одна галочка не должна быть отмечена заранее: уберите checked."
      - "Ссылка на материал должна быть понятной: «Скачать…», «Получить…» или «Открыть…»."
      - На странице «Спасибо» нужна ссылка на главное действие, подписанная так же, как в брифе.
      - Цену разового предложения нужно написать цифрой.
      - В предложении должна быть ссылка согласия с классом accept.
      - Кнопка отказа должна начинаться со слов «Нет», «Не нужно» или «Не сейчас».
      - "В предложении остались слова давления: «только сегодня», «осталось» или «последний шанс». Уберите их."
      - Предложение должно называть одну из ваших услуг из брифа.
      - Нужно не меньше четырёх событий.
      - "Названия событий должны быть латиницей, строчными, с подчёркиванием между словами: lead_form_submit."
