  - id: 13-growth/02-email
    order: 2
    title: "E-mail: доставляемость, согласие, отписка"
    summary: Вы поймёте, почему одни письма доходят, а другие нет, что такое SPF, DKIM и DMARC, и как собрать подписку,
      которая не нарушает правил. После урока у вас есть форма подписки с двумя отдельными согласиями и приветственное
      письмо на 80–120 слов.
    minutes: 25
    teaches:
      - growth.email-basics
      - growth.email-law
    requires:
      - growth.automation-triggers
      - net.dns-records
      - html.forms
      - texts.microcopy
    diagram: "EmailPath: «Путь письма» (part 13, lesson 2). A teaching model, not the rules of any real mail provider: the
      person switches on the pieces that decide where a made-up letter lands (the three signatures of the domain, a
      confirmed address, a one-click unsubscribe) and switches off the habits that hurt (a bought list, a misleading
      subject). A score of «доверие» moves, and the letter lands in the inbox, in spam or is refused. Real providers
      weigh far more than this and do not publish their weights."
    practice: "Исправьте форму подписки на странице: вместо одной галочки «согласен на всё» сделайте два отдельных согласия.
      Первое на обработку почты (обязательное, со ссылкой на политику обработки данных), второе на получение новостей
      (необязательное). Обе пустые, у поля почты есть подпись. Затем в заметке напишите приветственное письмо: тема из
      трёх слов и больше, без восклицаний и слов «срочно» и «гарантия»; от кого (название проекта); текст на 80–120 слов
      с ссылкой на главное действие и ссылкой для отписки. Если в брифе есть английский, добавьте английскую версию. Все
      «…» нужно заменить. Эпоха: 3."
    checks:
      - В заметке про письмо ещё осталось многоточие «…». Заполните «От кого», тему и тексты.
      - У каждого поля формы должна быть подпись (label), в том числе у галочек.
      - В форме нужно поле для почты с типом email.
      - "Нужны две галочки: на обработку почты и на получение новостей."
      - "Ни одна галочка не должна быть отмечена заранее: уберите атрибут checked."
      - Обязательной (required) может быть только одна галочка, а получение новостей должно быть добровольным.
      - Рядом с согласием на обработку должна быть ссылка на политику обработки данных со словом «политика».
      - В форме должны встретиться отдельные слова про обработку данных и про получение новостей или писем.
      - В поле «От кого» напишите название проекта или своё имя из брифа.
      - Тема должна быть из трёх и более слов, без восклицательного знака, слов «срочно» и «гарантия».
      - Текст письма должен быть длиной 80–120 слов. Посчитайте слова вместе со ссылками.
      - В письме нужна ссылка со словом «отписаться».
      - В письме нужна ссылка, текст которой совпадает с главным действием из брифа.
      - Письмо нужно написать по-русски.
      - "В брифе есть английский: добавьте английскую версию письма не короче десяти слов."
    sources:
