lessons:
  - id: 13-growth/01-automation
    order: 1
    title: "Автоматизация: триггеры, сегменты, каскады"
    summary: "Вы научитесь описывать цепочку сообщений, которая отправляется сама в ответ на действие человека, и не
      превращать её в спам. После урока у вас есть сценарий для главного действия из брифа: триггер, сегмент, три
      сообщения в двух каналах, паузы, условие выхода и проверка согласий."
    minutes: 25
    teaches:
      - growth.automation-triggers
    requires:
      - copy.funnel
      - copy.lead-magnet-tripwire
    diagram: "CascadeBuilder: «Каскад сообщений» (part 13, lesson 1). A made-up cascade of three messages after a sign-up,
      three made-up visitors, and three switches: a pause between messages, an exit condition («записался, остановить»)
      and a second channel for those who did not open the first letter. The simulator prints what each visitor receives,
      day by day, and marks the three mistakes automation makes when a rule is missing: a burst on one day, a message to
      someone who has already acted, and a message through a channel the person never agreed to. Nothing is sent;
      everything is made up."
    practice: "Опишите сценарий в заметке. 1) Триггер: действие человека, которое его запускает; назовите главное действие
      из брифа теми же словами. 2) Сегмент: для кого сценарий; вставьте формулировку «для кого» из брифа и допишите, чем
      этот сегмент отличается от остальных. 3) Три сообщения в таблице: когда (с паузой в днях, часах или минутах),
      канал, цель (напомнить, доказать или предложить) и суть. Каналов нужно не меньше двух, например e-mail и Telegram.
      4) Условие выхода: когда сценарий останавливается. 5) Согласие: на какой канал и как человек его дал. Все «…»
      нужно заменить. Эпоха: 8."
    checks:
      - Где-то осталось многоточие «…». Заполните триггер, сегмент, таблицу, выход и согласие.
      - Триггер должен называть главное действие теми же словами, что в брифе.
      - В сегменте должна быть формулировка «для кого» из брифа, а после неё чем ваш сегмент отличается.
      - В таблице должно быть не меньше трёх сообщений.
      - "Хотя бы в одной строке «Когда» должна быть пауза числом: «через 2 дня», «через 3 часа»."
      - "Нужны минимум два канала: например e-mail и Telegram."
      - "У сообщений должны встретиться все три цели: напомнить, доказать, предложить."
      - "Условие выхода опишите не короче чем в пять слов: когда именно сценарий останавливается."
      - "Опишите согласие: на какой канал и как человек его дал, не короче шести слов."
    sources:
