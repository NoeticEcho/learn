  - id: 09-infrastructure/08-deploy-own-site
    order: 8
    title: "Выкладываем свой сайт: GitHub Pages, Vercel или российский хостинг"
    definition: Выкладка сайта — перенос его файлов на хостинг, который отдаёт их всем, например GitHub Pages или Vercel, и привязка
      своего домена с HTTPS.
    summary: "Теория кончилась: пора показать сайт людям. После урока вы знаете по шагам, как выложить скачанный сайт тремя способами
      (GitHub Pages, Vercel, российский хостинг), привязать к нему свой домен с HTTPS, проверить результат и найти причину, если
      что-то пошло не так. Выкладка в учебнике репетируется, а настоящую вы сделаете сами по инструкции."
    minutes: 30
    teaches:
      - infra.deploy-own-site
    requires:
      - infra.ci-cd
      - infra.dns-in-practice
      - infra.tls-certificates
      - infra.hosting-choice
    diagram: "DeploySim: «Три пути выкладки» (part 9, lesson 8). A guided rehearsal, not a deployment: nothing leaves the person's
      browser. For each of the three ways to publish the downloaded site (GitHub Pages, Vercel, a Russian shared host) the page
      lists the real steps in order, with the address the site would get (made from the person's own project name), and lets them
      tick the steps off. Beside it, a symptom list (404, no styles, an old version, a certificate warning, the domain does not
      open, www does not open) answers with the usual cause and the fix. The steps follow the providers' documentation as read in
      October 2026; interfaces change, so each step names what to look for, not a pixel to click."
    practice: "Составьте паспорт первой выкладки, чтобы по нему можно было всё повторить. 1) Назовите выбранный путь: GitHub Pages,
      Vercel или российский хостинг. 2) Впишите адрес сайта, начинающийся с https://. 3) Расскажите шесть шагов своими словами:
      откуда берёте файлы («Скачать сайт»), где заводите аккаунт и место, как загружаете, как первый раз проверяете, как
      привязываете домен (записи A и CNAME) и как включаете HTTPS с перенаправлением. 4) Напишите, что проверите после выкладки, и
      назовите главное действие проекта словами из брифа. 5) Скажите, куда попадают данные посетителей из формы и что это значит
      по 152-ФЗ. Все «…» нужно заменить. Эпоха: 6."
    checks:
      - Блок «Паспорт выкладки моего сайта» (section id="deploy-plan") пропал. Верните его.
      - Остались многоточия «…». Замените каждое.
      - "Назовите выбранный путь: GitHub Pages, Vercel или российский хостинг."
      - Адрес сайта должен начинаться с https://.
      - "В первом шаге скажите, откуда берёте файлы: «Скачать сайт», архив."
      - "Во втором шаге скажите, где заводите аккаунт и место: репозиторий, проект, тариф."
      - "В третьем шаге скажите, как загружаете: commit, перетаскивание, SFTP или менеджер панели."
      - "В четвёртом шаге скажите, как первый раз проверяете: открываю адрес."
      - "В пятом шаге назовите записи DNS: A для корня, CNAME для www."
      - "В шестом шаге скажите про HTTPS: сертификат и перенаправление с http на https."
      - В проверке назовите главное действие проекта словами из брифа.
      - "Скажите, как проверите: с телефона, с www и без, по https."
      - "Скажите про данные: куда уходит форма, и что это по 152-ФЗ (российская база, политика, согласие)."
    sources:
