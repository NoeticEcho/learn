lessons:
- id: 09-infra/01-hosting
  order: 1
  title: 'Где живёт сайт: от виртуального хостинга до облака'
  summary: 'Зачем: вы различите shared-хостинг, VPS, выделенный сервер, облако и статический хостинг, сможете оценить цену
    и трудозатраты каждого и выбрать место для своего сайта (эпоха 3 — хостинг и FTP, эпоха 6 — деплой на CDN).'
  minutes: 15
  teaches:
  - infra.hosting-types
  - infra.hosting-choice
  requires:
  - net.http-request-response
  - server.web-server
  - server.static-vs-dynamic
  - cms.choosing-stack
  diagram: 'Лестница абстракции: ступени shared → VPS → выделенный → облако → статический хостинг. Ползунки «трафик» и «ваше
    время» сдвигают цену и ответственность; на каждой ступени подсвечивается, что обслуживаете вы, а что провайдер.'
  practice: 'Эпоха 3 (2010) и эпоха 6 (2022). Человек выбирает размещение для своего проекта по стеку, выбранному в части
    8: заполняет карточку «где живёт сайт» (тип, провайдер, регион дата-центра, цена в год, кто отвечает за обновления) для
    brief.mainAction и числа посетителей.'
  checks:
  - Тип хостинга согласован с выбранным в части 8 стеком (генератор — статический хостинг, WordPress — shared или VPS).
  - Указан регион дата-центра и причина выбора.
  - Есть цена в год и расшифровка, что в неё входит.
  - Названо, кто в вашем проекте отвечает за обновления сервера.
  sources:
  - title: 'MDN: What is a web server?'
    url: https://developer.mozilla.org/en-US/docs/Learn_web_development/Howto/Web_mechanics/What_is_a_web_server
    licence: CC-BY-SA
    kind: docs
    lang: en
  - title: 'Википедия: Хостинг'
    url: https://ru.wikipedia.org/wiki/Хостинг
    licence: CC-BY-SA
    kind: article
    lang: ru
  - title: 'Yandex Cloud: документация (обзор)'
    url: https://yandex.cloud/ru/docs/overview/
    licence: proprietary-link
    kind: docs
    lang: ru
  - title: Timeweb Cloud
    url: https://timeweb.cloud/
    licence: proprietary-link
    kind: docs
    lang: ru
  videos: []
- id: 09-infra/02-domain-dns
  order: 2
  title: Домен и DNS на практике
  summary: 'Зачем: вы настроите записи A, CNAME, MX и TXT для своего домена в учебной панели, поймёте TTL и задержку при переносе,
    сможете перенести сайт на другой хостинг без простоя и настроить почту на домене с SPF, DKIM и DMARC.'
  minutes: 20
  teaches:
  - infra.dns-in-practice
  - infra.email-dns
  requires:
  - net.dns-resolution
  - net.domain-names
  - infra.hosting-types
  diagram: 'Панель DNS-зоны с живым «резолвером»: правишь запись и TTL, симулятор показывает, кто из посетителей видит старый
    адрес, кто новый; отдельная вкладка проверяет письмо с домена (SPF/DKIM/DMARC) на попадание в спам.'
  practice: 'Эпоха 3 (2010) → эпоха 6 (2022). Человек пишет зону для своего домена: адрес сайта, www, почта и подтверждение
    владения (TXT), затем план переезда на другой хостинг с понижением TTL заранее. Язык и поддомены — по brief.languages.'
  checks:
  - Зона содержит запись для корневого домена и для www, обе ведут на один сайт.
  - Для каждого языка из brief.languages решено, поддомен это, каталог или отдельный домен, и запись для него есть.
  - TTL перед переездом понижен и возвращён после, порядок шагов верный.
  - Для почты на домене есть MX, SPF и DMARC.
  - Домен принадлежит регистратору, для .ru указан учёт требований к данным администратора.
  sources:
  - title: 'MDN: What is a domain name?'
    url: https://developer.mozilla.org/en-US/docs/Learn_web_development/Howto/Web_mechanics/What_is_a_domain_name
    licence: CC-BY-SA
    kind: docs
    lang: en
  - title: 'Cloudflare Pages: документация (подключение домена)'
    url: https://developers.cloudflare.com/pages/
    licence: proprietary-link
    kind: docs
    lang: en
  - title: Timeweb Cloud
    url: https://timeweb.cloud/
    licence: proprietary-link
    kind: docs
    lang: ru
  videos: []
- id: 09-infra/03-tls
  order: 3
  title: 'HTTPS на практике: сертификаты и Let''s Encrypt'
  summary: 'Зачем: вы поймёте, что именно подтверждает сертификат, как Let''s Encrypt выдаёт его бесплатно и обновляет сам,
    и сможете включить HTTPS на своём сайте и исправить типичные ошибки (смешанное содержимое, истёкший срок).'
  minutes: 15
  teaches:
  - infra.tls-certificates
  requires:
  - net.tls
  - net.http-request-response
  - infra.dns-in-practice
  diagram: 'Рукопожатие: пошаговая анимация запроса сертификата через ACME (вызов по HTTP или DNS), с кнопкой «сломать»: сертификат
    истёк, домен не совпадает, цепочка неполная — браузер показывает, что увидит посетитель.'
  practice: Эпоха 6 (2022). Человек в песочнице включает HTTPS для адреса своего проекта, перенаправляет http на https, проверяет,
    что все ссылки на картинки и скрипты на странице безопасные; решает, нужен ли сертификат для поддоменов из brief.languages.
  checks:
  - Адрес сайта открывается по https, а http перенаправляется на него.
  - Нет ресурсов, загружаемых по http.
  - Для каждого поддомена, нужного по brief.languages, сертификат есть или есть wildcard.
  - Описано, как обновляется сертификат и что происходит при ошибке обновления.
  sources:
  - title: 'Let''s Encrypt: How It Works'
    url: https://letsencrypt.org/how-it-works/
    licence: proprietary-link
    kind: docs
    lang: en
  - title: 'Let''s Encrypt: Documentation'
    url: https://letsencrypt.org/docs/
    licence: proprietary-link
    kind: docs
    lang: en
  - title: 'MDN: Transport Layer Security'
    url: https://developer.mozilla.org/en-US/docs/Web/Security/Transport_Layer_Security
    licence: CC-BY-SA
    kind: docs
    lang: en
  videos: []
- id: 09-infra/04-cdn-edge
  order: 4
  title: CDN, serverless и edge
  summary: 'Зачем: вы поймёте, как CDN приближает сайт к посетителю и как кэшировать страницу, а как — нет; узнаете, что такое
    функция без сервера и когда на границе сети стоит запустить небольшой код (форма, редирект, проверка), и применить это
    к главному действию вашего проекта.'
  minutes: 20
  teaches:
  - infra.cdn
  - infra.serverless-edge
  requires:
  - net.http-status-headers
  - net.http-request-response
  - infra.hosting-types
  diagram: 'Карта мира с посетителями и точками присутствия CDN: щёлкаешь по городу — видишь путь запроса, попадание или промах
    в кэше и время ответа; переключатель «статика / функция на границе» показывает, где выполняется код.'
  practice: 'Эпоха 6 (2022). Человек для страниц своего проекта (brief.sections) решает, что кэшируется (картинки, CSS, HTML),
    на какой срок, а для brief.mainAction (форма, запись, расчёт) описывает функцию: что принимает, что отвечает, куда пишет;
    учитывает посетителей из регионов, указанных в brief.'
  checks:
  - Для статических ресурсов указан срок кэша, для HTML — отдельное решение.
  - Есть способ сбросить кэш после публикации.
  - Функция для brief.mainAction проверяет входные данные и не хранит секреты в коде страницы.
  - Указан регион работы функции и причина, если принимаются персональные данные.
  sources:
  - title: 'MDN: Glossary — CDN'
    url: https://developer.mozilla.org/en-US/docs/Glossary/CDN
    licence: CC-BY-SA
    kind: docs
    lang: en
  - title: 'web.dev: Content delivery networks (CDN)'
    url: https://web.dev/articles/content-delivery-networks
    licence: CC-BY
    kind: article
    lang: en
  - title: 'Cloudflare Workers: документация'
    url: https://developers.cloudflare.com/workers/
    licence: proprietary-link
    kind: docs
    lang: en
  - title: 'Cloudflare Pages: документация'
    url: https://developers.cloudflare.com/pages/
    licence: proprietary-link
    kind: docs
    lang: en
  videos: []
- id: 09-infra/05-docker
  order: 5
  title: Контейнеры и Docker
  summary: 'Зачем: вы поймёте, что такое образ и контейнер (по аналогии с транспортным контейнером), запустите веб-сервер
    с вашим сайтом в симуляторе Docker и сможете описать сборку сайта в Dockerfile и Compose.'
  minutes: 25
  teaches:
  - infra.containers
  - infra.dockerfile-compose
  requires:
  - server.web-server
  - infra.hosting-types
  - cms.static-site-generator
  diagram: 'Симулятор терминала Docker в браузере: команды build, run, ps, logs, stop; слева слои образа складываются, справа
    контейнеры запускаются и останавливаются; аналогия «контейнер на судне» подсвечивает изоляцию.'
  practice: Эпоха 6 (2022). Человек в симуляторе пишет Dockerfile, который берёт собранный сайт (страницы по brief.sections)
    и отдаёт его веб-сервером, затем Compose-файл с сайтом и, если нужно для brief.mainAction, с небольшой базой или функцией.
  checks:
  - Dockerfile копирует собранные файлы и открывает порт, на котором отвечает сервер.
  - Секреты (ключи, пароли) вынесены в переменные окружения, не записаны в образ.
  - Данные, которые не должны теряться (база заявок из brief.mainAction), лежат на томе.
  - Контейнер запускается в симуляторе, а команда ps показывает его работающим.
  sources:
