  - id: 09-infrastructure/03-tls-practice
    order: 3
    title: "HTTPS на практике: сертификат, продление и типичные поломки"
    definition: "Сертификат TLS выдают тому, кто доказал, что управляет доменом: файлом на сайте (HTTP-01) или записью в DNS (DNS-01).
      Let’s Encrypt делает это по ACME."
    summary: О том, что такое TLS и сертификат, вы уже знаете. После урока вы умеете получить сертификат для своего домена, понимаете,
      как центр проверяет, что домен ваш, настраиваете автоматическое продление и узнаёте четыре поломки, которые встречаются чаще
      всего, в том числе «смешанное содержимое».
    minutes: 20
    teaches:
      - infra.tls-certificates
    requires:
      - net.tls
      - net.certificates
      - infra.dns-in-practice
    diagram: "CertLab: «Сертификат на практике» (part 9, lesson 3). Two halves. On the left, how Let's Encrypt checks that the domain
      is yours (the ACME challenge): the person picks HTTP-01 or DNS-01, ticks «wildcard», and sees which check is allowed and
      what must be put where. On the right, one switch breaks the site in a way that really happens (an expired certificate, a
      name that does not match, a missing intermediate, a plain-http image on an https page) and the page says what a visitor sees
      and what to do. The browser's own words are paraphrased; the error codes are Chrome's. A model: no certificate is issued and
      nothing is sent anywhere."
    practice: "Страница вашего проекта открывается по https, но в ней остались адреса по http: картинка, адрес сайта в canonical,
      картинка для превью ссылки, ссылка на политику и на кнопку. Исправьте их все на https. Потом заполните заметку о
      сертификате: 1) как получаете его, 2) какие имена в него входят (корень и www), 3) где живут языки из брифа и нужны ли им
      поддомены, 4) как он продлевается, 5) что вы сделаете, если продление сломается, 6) собираетесь ли включать HSTS и как
      осторожно. Все «…» нужно заменить. Эпоха: 6."
    checks:
      - Блок «HTTPS моего сайта» (section id="tls-plan") пропал. Верните его.
      - Остались многоточия «…». Замените каждое.
      - "В странице всё ещё есть ресурс по http: картинка, canonical или og:image. Замените http:// на https://."
      - Остались ссылки на http://. Замените их на https://.
      - Адрес в link rel="canonical" должен начинаться с https://.
      - Адрес в meta og:image должен начинаться с https://.
      - "Скажите, как получаете сертификат: Let’s Encrypt, хостинг, Certbot или платный."
      - В имена сертификата входят домен и www. Назовите оба.
      - "Скажите, где живут языки из брифа: каталог, поддомен или wildcard."
      - "Опишите продление: автоматически, и как часто."
      - "Скажите, что вы сделаете, если продление сломается: монитор, письмо, ручное продление."
      - "Скажите про HSTS: включите ли и как осторожно (малый max-age)."
    sources:
