  - id: 09-infrastructure/02-dns-practice
    order: 2
    title: "Домен и DNS на практике: зона своего сайта и переезд без простоя"
    definition: "Зона DNS — список записей домена: A, CNAME, MX, TXT. Действует та зона, на которую указывают NS-серверы домена у
      регистратора."
    summary: Вы знаете, что такое записи DNS; теперь вы ими пользуетесь. После урока вы пишете зону своего домена (корень, www, почта,
      подтверждения), выбираете, где живёт каждый язык, и переносите сайт на другой хостинг так, чтобы посетители ничего не
      заметили.
    minutes: 25
    teaches:
      - infra.dns-in-practice
      - infra.email-dns
    requires:
      - net.dns-resolution
      - net.dns-records
      - net.domain-names
      - infra.hosting-types
    diagram: "ZoneLab: «Зона и переезд» (part 9, lesson 2). Two tabs. The first moves a site to a new server and shows who still sees
      the old one: thirty visitors, each with a resolver cache holding the old answer for as long as its TTL has left. A model,
      not a measurement: visitors' caches are spread evenly over the old TTL, which is what many independent visitors look like.
      The second is a small linter for a zone written as text: it knows the handful of mistakes that actually break sites (a CNAME
      at the root, a CNAME beside other records, a mail record that points at an address, two SPF records, a missing www). Nothing
      is sent anywhere: the zone stays in the page."
    practice: "Заполните зону своего домена и план переезда на другой хостинг. 1) В таблице впишите тип, значение и TTL в секундах для
      шести записей: корень (A с IP-адресом, например 192.0.2.10), www (CNAME на корень), почта (MX), правила отправителей (TXT со
      словом v=spf1), _dmarc (TXT с v=DMARC1) и подтверждение владения (TXT). 2) В абзаце про языки скажите, где живёт каждый язык
      брифа: в каталоге, в поддомене или на отдельном домене. 3) В абзаце про владельца скажите, на кого оформлен домен (на вас
      или вашу организацию, не на подрядчика). 4) В списке переезда напишите, что вы делаете на каждом из пяти шагов; на первом и
      последнем назовите TTL. Все «…» нужно заменить. Эпоха: 6."
    checks:
      - Блок «Зона моего домена и план переезда» (section id="dns-plan") пропал. Верните его.
      - Остались многоточия «…». Замените каждое.
      - В таблице должно остаться шесть строк с записями.
      - Для сайта нужна запись типа A (или ALIAS) с адресом.
      - В записи A значение это IP-адрес из четырёх чисел, например 192.0.2.10.
      - Для www нужна запись типа CNAME.
      - Для почты нужна запись типа MX.
      - "В одной из записей TXT должны быть правила отправителей: текст, начинающийся с v=spf1."
      - На имени _dmarc нужна запись TXT с v=DMARC1.
      - Для правил и подтверждений нужен тип TXT.
      - TTL записывается числом секунд, например 300 или 3600.
      - "В абзаце про языки скажите, где живёт каждый язык: каталог, поддомен или отдельный домен."
      - "В брифе есть английский: скажите, где он живёт (каталог /en/, поддомен или отдельный домен)."
      - "Скажите, на кого оформлен домен: на вас (или вашу организацию), а не на подрядчика."
      - В списке переезда должно остаться пять шагов.
      - "Первый шаг: уменьшить TTL заранее. Назовите это."
      - "На третьем шаге назовите, что вы меняете: запись A на новый адрес."
      - "На четвёртом шаге назовите проверку: dig, nslookup или открытие сайта."
      - На пятом шаге верните TTL или скажите, когда выключаете старый сервер.
    sources:
