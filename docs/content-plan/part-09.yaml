- id: 09-infra/07-ci-cd
  order: 7
  title: 'CI/CD: выкладка по коммиту'
  summary: 'Зачем: вы опишете конвейер, который при каждом изменении проверяет сайт, собирает его и выкладывает на хостинг,
    и поймёте, как откатить плохую версию; это превращает «залить по FTP» эпохи 3 в безопасный релиз эпохи 6.'
  minutes: 20
  teaches:
  - infra.ci-cd
  requires:
  - cms.build-webhook-rebuild
  - infra.dockerfile-compose
  - infra.hosting-types
  diagram: 'Конвейер из станций: коммит → проверки → сборка → предпросмотр → выкладка; по клику любую станцию «заклинивает»
    (ссылка битая, тест красный), видно, что дальше не идёт и что уведомление придёт в чат.'
  practice: 'Эпоха 6 (2022). Человек пишет файл конвейера для своего проекта (в песочнице): шаги проверки ссылок и валидации
    HTML, сборки по brief.sections и выкладки; добавляет шаг, который проверяет наличие страницы согласия на обработку данных,
    если в brief есть форма.'
  checks:
  - Конвейер запускается на каждое изменение в основной ветке.
  - Выкладка идёт только после успешных проверок.
  - Секреты хранятся в настройках сервиса, а не в репозитории.
  - Для каждой страницы секции из brief.sections проверяется, что она собирается.
  - 'Описан откат: как вернуть предыдущую версию.'
