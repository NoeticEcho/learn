  - id: 09-infrastructure/05-docker
    order: 5
    title: "Контейнеры и Docker: одна и та же коробка везде"
    definition: Docker упаковывает программу со всем нужным ей в образ и запускает его контейнером одинаково везде. Образ задаёт
      Dockerfile, набор контейнеров — compose.yaml.
    summary: «У меня работает» перестаёт быть оправданием, когда программа едет в коробке со всем нужным. После урока вы различаете
      образ, контейнер и том, читаете и пишете Dockerfile и compose-файл для сайта своего проекта, запускаете контейнер в
      симуляторе и честно решаете, нужен ли он вам вообще.
    minutes: 30
    teaches:
      - infra.containers
      - infra.dockerfile-compose
    requires:
      - server.web-server
      - server.static-vs-dynamic
      - infra.hosting-types
    diagram: "DockerSim: «Docker в браузере» (part 9, lesson 5). A pretend terminal: no Docker runs here, the page reads the commands
      itself. It knows the handful that matter on a first day: build, images, run (with -d, -p, --name, -e, -v), ps, logs, stop,
      start, rm, rmi and curl against a published port. A Dockerfile is a text box beside it; build turns each instruction into a
      layer, reuses the layers that did not change (CACHED), refuses a COPY of a file the build context does not have, and warns
      when a key or a password is written into the image with ENV. The site that `curl` returns carries the person's own project
      name. Everything is a model: sizes and times are made up."
    practice: 'Опишите контейнеры своего проекта. 1) В Dockerfile впишите базовый образ веб-сервера (nginx:alpine), копирование
      собранных файлов из папки dist в /usr/share/nginx/html/ и порт 80. 2) В compose.yaml для сайта опубликуйте порт в виде
      "8080:80", для программы-приёмника заявок возьмите секреты из файла .env (env_file) и подключите том requests, который
      смонтирован в /data. Не записывайте ключи и пароли ни в Dockerfile, ни в compose. 3) Откройте симулятор выше, соберите
      образ, запустите контейнер и вставьте сюда строку из docker ps с Up. 4) Скажите, что лежит на томе, назвав главное действие
      проекта словами из брифа. 5) Честно решите, нужен ли Docker вашему проекту, и назовите более простую замену, если не нужен.
      Все «…» нужно заменить. Эпоха: 6.'
    checks:
      - Блок «Контейнер моего сайта» (section id="docker-plan") пропал. Верните его.
      - Остались многоточия «…». Замените каждое, в том числе в файлах.
      - В Dockerfile первой строкой нужен FROM с базовым образом, например nginx:alpine.
      - "В Dockerfile нужна строка COPY: откуда и куда положить файлы сайта."
      - В Dockerfile нужна строка EXPOSE с портом, на котором отвечает сервер (80).
      - В Dockerfile записан секрет (ENV или ARG с KEY, TOKEN, SECRET, PASSWORD). Уберите его.
      - В compose нужен раздел services:.
      - Порт публикуется в виде "8080:80".
      - "Секреты берите из файла или переменных: env_file или environment."
      - Том подключается строкой вида requests:/data.
      - Том должен быть объявлен и внизу файла, в разделе volumes.
      - В compose записан секрет. Оставьте только имя файла или переменной.
      - Вставьте строку из docker ps, в которой контейнер работает (слово Up).
      - Скажите, что лежит на томе, назвав главное действие проекта словами из брифа.
      - Назовите данные, которые лежат на томе (заявки, записи, файлы).
      - "Ответьте прямо: нужен ли Docker вашему проекту."
      - Назовите более простую замену (статический хостинг, VPS без контейнеров) или скажите, что именно в проекте оправдывает
        контейнеры.
    sources:
