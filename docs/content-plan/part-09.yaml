- id: 09-infra/08-backups-monitoring-ru
  order: 8
  title: Копии, мониторинг и российские требования к данным
  summary: 'Зачем: вы составите план «что если сайт упал или данные потеряны» — резервные копии по правилу 3-2-1, проверка
    восстановления, мониторинг доступности — и поймёте, какие данные посетителей по закону должны храниться в России и как
    выбирать провайдера.'
  minutes: 25
  teaches:
  - infra.backups
  - infra.monitoring
  - infra.data-localisation-ru
  requires:
  - infra.hosting-types
  - infra.ci-cd
  - data.privacy-by-design
  diagram: 'Таймлайн инцидента: ползунок времени от «сайт упал» до «восстановлен»; сравнивается план с копией на том же сервере,
    копия в другом регионе и без копии; рядом график доступности с алертом.'
  practice: 'Эпоха 6 (2022). Человек составляет паспорт эксплуатации своего проекта: что копируется (файлы, база, содержимое
    CMS), как часто и куда, проверка восстановления; что мониторится и кому приходит алерт; где хранятся персональные данные
    из форм brief.mainAction и какого провайдера он выбирает для них.'
  checks:
  - Копии лежат минимум в двух разных местах, одно — вне основного сервера.
  - Указана периодичность и срок хранения копий и дата проверки восстановления.
  - Мониторинг проверяет главную страницу и страницу действия из brief.mainAction.
  - Определено, кому приходит алерт и как быстро нужно ответить.
  - Хранение первичной записи персональных данных граждан РФ указано в российском дата-центре, провайдер назван.
  sources:
