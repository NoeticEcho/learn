lessons:
  - id: 09-infrastructure/01-hosting
    order: 1
    title: "Где живёт сайт: от виртуального хостинга до облака"
    definition: "Хостинг — место, где сайт живёт на всегда включённом компьютере: статический хостинг, виртуальный (shared), VPS,
      выделенный сервер или облако."
    summary: Сайт должен жить на компьютере, который никогда не спит. После урока вы различаете статический хостинг, shared, VPS,
      выделенный сервер и облако, понимаете, что обслуживаете вы, а что провайдер, и выбираете место для своего сайта под его
      главное действие, посетителей и бюджет.
    minutes: 20
    teaches:
      - infra.hosting-types
      - infra.hosting-choice
    requires:
      - net.http-request-response
      - server.web-server
      - server.static-vs-dynamic
      - server.stack-choice
    diagram: "HostingLadder: «Лестница хостинга» (part 9, lesson 1). Five ways to keep a site on someone else's always-on computer,
      from a static host to a cloud. The person says what kind of site it is, how many visitors a month, and how many hours a
      month they can give to the machine; the page says, for every step, what the person looks after and what the provider does, a
      rough price band, and whether it fits. The price bands are orders of magnitude for the Russian market in autumn 2026, not
      quotes: the point is the questions, not the prices. The main action of the person's own brief decides whether the site only
      shows pages or must also receive something."
    practice: "Заполните карточку размещения своего проекта. 1) Тип: статический хостинг, shared (виртуальный), VPS, выделенный сервер
      или облако. 2) Провайдер: назовите конкретный. 3) Регион дата-центра: страна или город. 4) Цена в год числом с валютой. 5)
      Кто обновляет сервер и систему: вы, провайдер, подрядчик. 6) В абзаце «Почему так» объясните выбор, назвав главное действие
      проекта словами из брифа. 7) В абзаце «Почему этот регион» скажите, как это связано с посетителями и персональными данными,
      и назовите город проекта, если он есть в брифе. Все «…» нужно заменить. Эпоха: 6."
    checks:
      - Блок «Где живёт мой сайт» (section id="host-card") пропал. Верните его.
      - Остались многоточия «…». Замените каждое.
      - "В поле «Тип размещения» назовите ступень: статический хостинг, shared, VPS, выделенный сервер или облако."
      - Назовите конкретного провайдера или платформу.
      - В поле региона назовите страну или город дата-центра.
      - Цена в год должна быть числом с валютой, например «1 200 ₽».
      - "Скажите, кто обновляет сервер и систему: вы, провайдер или подрядчик."
      - В «Почему так» назовите выбранную ступень или объясните, чем она подходит.
      - В «Почему так» назовите главное действие проекта словами из брифа.
      - В «Почему этот регион» скажите про посетителей, задержку или персональные данные.
      - Назовите в этом абзаце город проекта из брифа.
