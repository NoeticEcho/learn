  - id: 09-infrastructure/09-backups-monitoring-ru
    order: 9
    title: Копии, мониторинг и российские требования к данным
    definition: "Правило 3-2-1: три копии данных на двух разных носителях, одна вне основной площадки. Мониторинг сообщает о поломке
      раньше, чем её заметят посетители."
    summary: "Рано или поздно что-то ломается. После урока вы составляете паспорт эксплуатации своего проекта: что копируется и куда
      по правилу 3-2-1, как проверяется восстановление, что и как отслеживает мониторинг, кому идёт сигнал, и где хранятся
      персональные данные посетителей по закону. Урок не заменяет юриста, но показывает, о чём его спрашивать."
    minutes: 30
    teaches:
      - infra.backups
      - infra.monitoring
      - infra.data-localisation-ru
    requires:
      - infra.hosting-types
      - infra.ci-cd
      - html.form-validation
      - infra.deploy-own-site
    diagram: "IncidentLab: «Авария: что вернётся» (part 9, lesson 9). Two small models. First: an incident (a dead disk, a hacked
      server, a file deleted by mistake, a data centre that is unreachable), a backup plan (none, on the same server, two places
      in one data centre, two places in two regions), how often copies are made and whether a restore was ever tried; the page
      says what is recovered, how much is lost at worst (up to one interval) and how long it takes. Second: how quickly an outage
      is noticed, by how often it is checked and by what: a check of the home page alone does not see that the person's own main
      action has stopped working. Both are teaching models with rounded orders of magnitude, not promises about any provider."
    practice: "Заполните паспорт эксплуатации. 1) Копии: что копируется (файлы, база, содержимое CMS, заявки), как часто, сколько
      хранится, где лежат (в не менее чем двух разных местах, одно из них вне основного сервера) и когда в последний раз проверяли
      восстановление или когда проверите впервые. 2) Мониторинг: что отслеживается (главную страницу и страницу или функцию
      главного действия проекта, назвав его словами из брифа), кому приходит сигнал и как быстро нужно ответить. 3) Данные: где
      хранятся персональные данные из формы (по закону первичная запись данных россиян в России), какой провайдер, и в абзаце
      «Почему так» объясните выбор со ссылкой на 152-ФЗ. Все «…» нужно заменить. Эпоха: 6."
    checks:
      - Блок «Паспорт эксплуатации» (section id="ops-passport") пропал. Верните его.
      - Остались многоточия «…». Замените каждое.
      - "Скажите, что копируется: файлы, база, заявки, настройки."
      - "Скажите, как часто копируется: ежедневно, раз в час, при каждой выкладке."
      - "Скажите, сколько копии хранятся: числом дней, недель или месяцев."
      - "Копии должны лежать минимум в двух местах: назовите оба."
      - "Одна из копий должна быть вне основного сервера: облако, другой регион, внешний диск."
      - Скажите, когда проверяли восстановление или когда проверите впервые.
      - Мониторинг должен проверять главную страницу.
      - "Мониторинг должен проверять и действие проекта: назовите его словами из брифа."
      - "Скажите, кому приходит сигнал: вам, команде, подрядчику, и по какому каналу."
      - "Скажите, как быстро нужно ответить: в минутах или часах."
      - Скажите, что персональные данные хранятся в России.
      - Назовите провайдера, у которого лежат данные.
      - В «Почему так» сошлитесь на 152-ФЗ или на персональные данные граждан.
