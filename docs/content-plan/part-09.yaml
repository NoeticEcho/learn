  - id: 09-infrastructure/04-cdn-edge
    order: 4
    title: "CDN, serverless и edge: сайт ближе к посетителю"
    definition: CDN — сеть серверов в разных городах, отдающая копии файлов сайта с узла рядом с посетителем. Serverless — функции на
      платформе, edge — функции на узлах CDN.
    summary: Сайт в Москве медленно открывается во Владивостоке, потому что свет в кабеле не бесконечно быстр. После урока вы
      понимаете, как CDN приближает файлы к посетителю, что можно и что нельзя кэшировать, зачем в имени файла хэш, как выглядит
      функция «без сервера» и что она принимает от формы вашего проекта.
    minutes: 25
    teaches:
      - infra.cdn
      - infra.serverless-edge
    requires:
      - net.http-status-headers
      - net.http-request-response
      - infra.hosting-types
      - server.rest
    diagram: "CdnMap: «CDN и кэш» (part 9, lesson 4). Two models in one figure. The first: a visitor in one of seven Russian cities
      opens a page whose server is in Moscow or in Frankfurt, with or without a CDN with points of presence in four cities; the
      page shows how long the first request takes, from the distance (light in fibre travels about 200 km a millisecond, and real
      routes are longer than the straight line, which the 1.4 stands for). The second: a new version of the page is published, and
      for each `Cache-Control` the visitors a few minutes later either still see the old copy or the new, with or without a purge.
      Both are models, orders of magnitude: they teach the shape, not a measurement of any network."
    practice: "Заполните заметку о кэше и функции своего проекта. 1) Для картинок, CSS и скриптов напишите значение Cache-Control с
      долгим сроком. 2) Для HTML выберите короткий срок или перепроверку. 3) Назовите каждый раздел из брифа и скажите, что с ним
      (кэшируем, не кэшируем). 4) Скажите, как сбрасывается кэш после публикации. 5) Опишите функцию: что она делает для главного
      действия проекта, назвав его словами из брифа. 6) Допишите её код: пропустить только POST, проверить поля и ответить 400,
      если они плохие, взять адрес приёмника из настроек (env), а не из кода. 7) Скажите, в каком регионе она работает и почему
      (персональные данные по 152-ФЗ). Все «…» нужно заменить. Эпоха: 6."
    checks:
      - Блок «Кэш и функция моего сайта» (section id="edge-plan") пропал. Верните его.
      - Остались многоточия «…». Замените каждое, в том числе в коде.
      - "Для картинок, CSS и скриптов нужен долгий срок: например max-age=31536000 и immutable."
      - "Для HTML нужен короткий срок или перепроверка: например no-cache или max-age=300."
      - В заметке должны быть все разделы вашего брифа, каждый названный полностью.
      - Скажите, что страницы с личными данными не кэшируются (private, no-store).
      - "Скажите, как сбрасывается кэш после публикации: сброс при сборке, новое имя файла с хэшем."
      - Опишите функцию через главное действие проекта, назвав его словами из брифа.
      - "В коде функции нужна проверка request.method: принимать только POST."
      - В коде функции нужен ответ со статусом 400 для плохих данных.
      - "Адрес приёмника берите из настроек: например env.WEBHOOK_URL."
      - "В коде остался ключ или токен. Уберите его: секреты хранятся в настройках сервиса."
      - "Скажите, где работает функция (российский дата-центр) и почему: персональные данные, 152-ФЗ."
