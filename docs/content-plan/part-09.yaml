# Regenerated from the written lessons (28.10.2026). Changes against the draft:
# - A ninth lesson, 09-infrastructure/08-deploy-own-site: the owner asked for the learner's own site to be deployed (GitHub Pages, Vercel, a Russian
#   host). The sandbox has no network, so the lesson is a rehearsal (a step list with ticks, and a symptom list) with the real steps taken from the
#   providers' documentation as read in October 2026; the practice is a deployment passport. The draft's lesson 8 became lesson 9.
# - Lesson 2 is about the zone in practice and moving a site; SPF, DKIM and DMARC are taught in part 13 (growth-email-basics), so here they are only
#   the records in the zone and two mistakes. Lesson 3 does not repeat the TLS handshake of part 1 lesson 7.
# - Requirements the draft took from parts 8 and 15 (cms.*, quality.*) are replaced by the nearest written concepts (server-static-vs-dynamic,
#   js-tooling, server-webhooks, html-form-validation), because those parts had no lessons yet.
# - The Docker lesson has a terminal simulator (no Docker runs); the Kubernetes lesson a dispatcher model; the CI/CD lesson a pipeline model.
# - The practice pages are complete pages with an exercise block marked data-scaffold, built by content/diagrams/practice-kit.ts.
# - The lesson on data localisation quotes 152-FZ art. 18 and widely reported fine ranges, and says so; a lawyer should read it.
