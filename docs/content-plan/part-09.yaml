  - id: 09-infrastructure/07-ci-cd
    order: 7
    title: "CI/CD: выкладка по коммиту"
    definition: CI/CD — конвейер, который на каждый коммит сам проверяет, собирает и выкладывает сайт, причём выкладка идёт, только
      когда все проверки прошли.
    summary: Залить сайт по FTP руками значит надеяться, что ничего не забыто. После урока вы понимаете, что такое непрерывная
      интеграция и доставка, читаете и пишете файл конвейера для GitHub Actions, который проверяет, собирает и выкладывает ваш
      сайт, прячете секреты в настройках и знаете, как откатить плохую версию.
    minutes: 25
    teaches:
      - infra.ci-cd
    requires:
      - infra.dockerfile-compose
      - infra.hosting-types
      - server.webhooks
      - js.tooling
    diagram: "PipelineSim: «Конвейер выкладки» (part 9, lesson 7). Stations in a row: change, checks, build, preview, deploy, notice.
      The person runs a change through it, jams any station (a broken link, a red test, a failing build, an expired token), and
      sees that the line stops there and that nothing after it runs, and what the notice says. A switch compares it with the old
      way: uploading by hand, where nothing stops a bad change. A second switch makes the mistake the checks cannot see; then the
      button «Откатить» puts the previous version back. The build station lists the sections of the person's own brief, and if
      their main action takes data from a visitor a check for the consent page appears. Keyed by index, since sections come from
      the brief. A model."
    practice: "Допишите файл конвейера для GitHub Actions. 1) Название и условие запуска: на каждый push в ветку main. 2) Задание
      check: получить код, проверить ссылки и разметку, собрать страницы, а если на сайте есть форма, проверить, что страница
      политики и согласия на месте. 3) Задание deploy с needs: check, чтобы выкладка шла только после успешных проверок. 4)
      Секреты (адрес чата) берите из настроек сервиса в виде secrets.ИМЯ, а не вписывайте в файл. 5) Под файлом напишите, что
      проверяет сборка для каждого раздела проекта (назовите каждый раздел из брифа) и как откатить плохую версию. Все «…» нужно
      заменить. Эпоха: 6."
    checks:
      - Блок «Конвейер моего сайта» (section id="cicd-plan") пропал. Верните его.
      - Остались многоточия «…». Замените каждое, в том числе в файле.
      - "Конвейер должен запускаться на push в ветку main: on: push: branches: [main]."
      - "В файле должны быть два задания: check и deploy."
      - "У deploy должно быть needs: check, чтобы выкладка шла только после проверок."
      - В check нужен шаг сборки сайта (build).
      - В check нужна проверка ссылок и разметки.
      - "Секрет берите из настроек: secrets.ИМЯ (например secrets.NOTIFY_URL)."
      - "В файле записан токен или пароль. Уберите его: значение хранится в настройках сервиса."
      - "У вашего проекта есть форма: добавьте шаг, проверяющий страницу политики и согласия."
      - "У вашего проекта есть запись: добавьте шаг, проверяющий страницу политики и согласия."
      - "У вашего проекта есть регистрация: добавьте шаг, проверяющий страницу политики и согласия."
      - "У вашего проекта есть покупка: добавьте шаг, проверяющий страницу политики и согласия."
      - Назовите каждый раздел проекта из брифа полностью.
      - "Скажите, как откатить плохую версию: git revert и push, или прошлая выкладка."
    sources:
