  - id: 09-infrastructure/06-kubernetes
    order: 6
    title: Kubernetes простыми словами и когда он не нужен
    definition: "Kubernetes — оркестратор контейнеров: ему описывают желаемое состояние, а контроллеры перезапускают и обновляют
      копии, пока настоящее с ним не совпадёт."
    summary: Когда контейнеров много, их кто-то должен перезапускать, размножать и обновлять. После урока вы понимаете, что делает
      Kubernetes и что значат слова pod, deployment, service и ingress, знаете, чем он стоит, и можете честно ответить, нужен ли
      он вашему проекту. Почти всегда ответ «нет».
    minutes: 20
    teaches:
      - infra.kubernetes
      - infra.when-not-k8s
    requires:
      - infra.containers
      - infra.hosting-choice
    diagram: "OrchestraSim: «Диспетчер аэропорта» (part 9, lesson 6). Three machines (nodes) are runways and the copies of the site
      (pods) are planes. The person states how many copies they want, and the page does what Kubernetes' controllers do: it keeps
      that number, moves the copies of a fallen node to the others, and replaces old copies with new ones one at a time during an
      update. Below, a small questionnaire asks about the person's own project (services, tolerated downtime, uneven load, people)
      and answers whether an orchestrator pays for itself, naming the main action of their brief. A model: names and timings are
      made up, but the behaviour (desired state, then reconcile) is the real idea."
    practice: "Оцените свой проект. 1) Впишите число сервисов (сайт, приёмник заявок, база, очередь: сколько отдельных программ вы
      запускаете) и допустимый простой (например, «до часа»). 2) Скажите, кто будет вести кластер, если он понадобится: вы,
      команда, провайдер, подрядчик или никто. 3) В выводе скажите прямо, нужен оркестратор или нет, опираясь на число сервисов и
      простой и назвав главное действие проекта словами из брифа. 4) Назовите дешёвый вариант без Kubernetes: статический хостинг,
      один сервер с Compose, платформа. 5) В списке напишите, что в вашем проекте было бы pod, service и deployment, в каждом
      пункте не меньше четырёх слов. Все «…» нужно заменить. Эпоха: 6."
    checks:
      - Блок «Нужен ли моему проекту оркестратор» (section id="k8s-plan") пропал. Верните его.
      - Остались многоточия «…». Замените каждое.
      - Впишите число сервисов цифрой.
      - "Скажите, какой простой допустим: минуты, час, сутки или «нельзя»."
      - "Скажите, кто будет вести кластер: вы, команда, провайдер, подрядчик или никто."
      - "В выводе скажите прямо: «нужен» или «не нужен»."
      - "Вывод должен опираться на число сервисов и допустимый простой: назовите их цифрами или словами."
      - В выводе назовите главное действие проекта словами из брифа.
      - "Назовите дешёвый вариант без Kubernetes: статический хостинг, сервер с Compose, платформа."
      - "В списке должно остаться три пункта: pod, service, deployment."
      - После «pod:» напишите, что это в вашем проекте, не меньше четырёх слов.
      - После «service:» напишите, что это в вашем проекте, не меньше четырёх слов.
      - После «deployment:» напишите, что это в вашем проекте, не меньше четырёх слов.
    sources:
      - title: "Kubernetes: Overview"
        url: https://kubernetes.io/docs/concepts/overview/
        licence: CC-BY
        kind: docs
        lang: en
