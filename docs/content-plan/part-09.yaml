- id: 09-infra/06-kubernetes
  order: 6
  title: Kubernetes простыми словами — и когда он не нужен
  summary: 'Зачем: вы поймёте, что делает оркестратор (держит нужное число копий, перезапускает упавшее, обновляет без простоя),
    узнаете слова pod, deployment, service, ingress, и сможете честно ответить, нужен ли он вашему проекту — почти всегда
    нет.'
  minutes: 15
  teaches:
  - infra.kubernetes
  - infra.when-not-k8s
  requires:
  - infra.containers
  - infra.hosting-choice
  diagram: 'Диспетчер аэропорта: узлы — взлётные полосы, контейнеры — самолёты; кнопки «упал узел», «пришёл поток посетителей»,
    «выкатить новую версию» — оркестратор пересаживает и размножает контейнеры. Ползунок «размер проекта» показывает точку,
    где ручное управление дешевле.'
  practice: 'Эпоха 6 (2022). Человек оценивает свой проект: число посетителей, число сервисов, допустимый простой (из brief.mainAction),
    команда — и пишет вывод «оркестратор нужен / не нужен» с планом: статический хостинг, один VPS с Compose или управляемый
    кластер.'
  checks:
  - Вывод опирается на число сервисов и допустимый простой, указанные человеком.
  - Назван минимум один дешёвый вариант без Kubernetes для этого проекта.
  - Указано, кто будет эксплуатировать кластер, если выбран он.
  - Названы три понятия Kubernetes в применении к проекту (например, что здесь pod, что service).
