- id: 11-copywriting/09-growth
  order: 9
  title: AARRR, маховик, North Star, ICE и RICE
  summary: Вы выберете одну главную метрику для главного действия, разложите рост на пять стадий AARRR, опишете маховик
    проекта и решите, какую из пяти идей роста делать первой. После урока у вас есть North Star, пять метрик с
    оценочными числами и способами измерения, цепочка маховика и ранжирование идей двумя способами с объяснением, почему
    они разошлись.
  minutes: 35
  teaches:
  - copy-aarrr
  - copy-flywheel
  - copy-north-star
  - copy-ice-rice
  requires:
  - copy-funnel
  diagram: "IceRice: пять идей роста с оценками ICE и RICE; два рейтинга рядом и пояснение, почему идея сдвинулась (охват,
    трудозатраты)."
  practice: "Постройте для проекта четыре вещи. 1) North Star: одна метрика для главного действия, в которой названо это
    действие (теми же словами, что в брифе) и период («в месяц», «в неделю»), без слов вроде «довольные клиенты». 2)
    AARRR: метрика, оценочное число и способ измерения для каждой из пяти стадий. 3) Маховик: четыре звена, где каждое
    усиливает следующее. 4) Пять идей роста, оценённых по ICE и RICE: числа в ячейках, и ниже объяснение, чем рейтинги
    отличаются. Все «…» нужно заменить. Эпоха: 8."
  checks:
  - Где-то осталось многоточие «…». Заполните North Star, таблицу AARRR, маховик и пять идей.
  - В North Star должно быть главное действие из брифа теми же словами.
  - В North Star нет периода. Допишите «в месяц» или «в неделю».
  - North Star слишком короткая или в ней слова вроде «довольные», «лояльность», «узнаваемость». Назовите действие,
    период и аудиторию.
  - В таблице AARRR должно быть пять строк.
  - Нужно число (оценка) в каждой из пяти строк.
  - "Назовите, чем будете измерять: счётчик посещений, форма, таблица заказов, опрос."
  - В маховике должно быть четыре звена.
  - Опишите каждое звено хотя бы в четыре слова.
  - Нужно пять идей роста.
  - В колонке ICE должны быть числа.
  - В колонке RICE должны быть числа.
  - "Объясните, чем рейтинги отличаются и почему: не меньше восьми слов."
  sources:
  - title: Dave McClure (Wikipedia)
    url: https://en.wikipedia.org/wiki/Dave_McClure
    licence: CC-BY-SA
    kind: article
    lang: en
  - title: The HubSpot Flywheel
    url: https://www.hubspot.com/flywheel
    licence: proprietary-link
