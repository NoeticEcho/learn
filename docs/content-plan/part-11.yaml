- id: 11-copywriting/02-attention
  order: 2
  title: AIDA, AIDCA, ACCA, PAS, PASO и SLAP
  summary: Вы напишете один и тот же блок про своё главное предложение шестью способами и поймёте, какая формула для
    какого читателя. После урока вы знаете, откуда взялась каждая формула, когда она работает и когда вводит в
    заблуждение, и у вас есть шесть вариантов текста про своё предложение, из которых вы выбрали два для разных
    читателей.
  minutes: 30
  teaches:
  - copy-aida
  - copy-aidca
  - copy-acca
  - copy-pas
  - copy-paso
  - copy-slap
  requires:
  - copy-awareness-levels
  - texts-microcopy
  diagram: "FormulaDesk: вкладка «Разложить на бриф» показывает шесть формул (AIDA, AIDCA, ACCA, PAS, PASO, SLAP) по
    блокам, с вопросом к автору и фактом из брифа человека; вкладка «Угадать формулу» даёт шесть коротких текстов и
    ответ с объяснением."
  practice: "Выберите главное предложение вашего проекта (по умолчанию первое из брифа) и напишите про него шесть коротких
    блоков, по одному на формулу: AIDA, AIDCA, ACCA, PAS, PASO, SLAP. Метки блоков уже стоят, впишите текст после каждой
    метки вместо многоточия. В блоках AIDA, AIDCA, ACCA и SLAP действие это главное действие из брифа теми же словами. В
    убеждении (AIDCA) и убеждённости (ACCA) назовите доказательство из брифа целиком. В PAS и PASO описывайте
    последствия честно, без слов «катастрофа», «ужас», «кошмар». В PASO предложение называет цену, срок или условие.
    Блок SLAP не длиннее объявления. В конце выберите два лучших блока для читателей разных уровней и объясните выбор.
    Все «…» нужно заменить. Эпоха: 8."
  checks:
  - Где-то остались многоточия «…». Каждый из 24 блоков и заметка про два лучших должны быть заполнены.
  - В поле «Главное предложение» должно остаться название одной из услуг или товаров из брифа.
  - "Должно быть шесть формул: AIDA, AIDCA, ACCA, PAS, PASO, SLAP. Не удаляйте целые блоки."
  - "Не хватает блоков: должно быть 24 строки, по числу элементов шести формул."
  - В блоке «Действие» формулы AIDA должно стоять главное действие из брифа теми же словами.
  - В блоке «Действие» формулы AIDCA должно стоять главное действие из брифа теми же словами.
  - В блоке «Действие» формулы ACCA должно стоять главное действие из брифа теми же словами.
  - В блоке «Действуйте» формулы SLAP должно стоять главное действие из брифа теми же словами.
  - В убеждении AIDCA нужно доказательство из брифа целиком, как оно записано.
  - В убеждённости ACCA нужно доказательство из брифа целиком, как оно записано.
  - "Проблема в PAS слишком короткая: не меньше пяти слов."
  - "В PAS есть слова из запугивания: «катастрофа», «ужас», «кошмар», «страшно». Замените фактами."
  - "В PASO есть слова из запугивания: «катастрофа», «ужас», «кошмар», «страшно». Замените фактами."
  - "В предложении PASO нужны условия: цена, срок или слово «бесплатно»."
  - "SLAP это объявление: до четырёхсот знаков, и не короче двадцати."
  - Нужно выбрать два лучших блока.
  - В поле «уровень читателя» нужна цифра от 1 до 5.
  - Объясните выбор хотя бы пятью словами для каждого из двух блоков.
