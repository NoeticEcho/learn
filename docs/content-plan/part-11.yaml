lessons:
- id: 11-copy/01-awareness-ogilvy
  order: 1
  title: 'Кто читает и что он уже знает: уровни осведомлённости и принципы Огилви'
  summary: 'Зачем: прежде чем выбирать формулу, вы определите, насколько ваш посетитель знает о проблеме и решении (пять уровней
    Шварца), и выведете из этого, с чего начинать текст. Разделы: пять уровней осведомлённости; принципы Огилви (исследование,
    факты, заголовок, конкретика, уважение к читателю).'
  minutes: 20
  teaches:
  - copy.awareness-levels
  - copy.ogilvy-principles
  requires:
  - texts.info-style
  - texts.headlines
  - start.project-brief
  diagram: 'Лестница из пяти ступеней: «не знает проблемы → знает проблему → знает решения → знает продукт → готов купить».
    Ползунок выбирает ступень посетителя, и первый экран страницы перестраивается: с чего начинается заголовок, сколько объяснений,
    какое действие просят.'
  practice: 'Любая эпоха. Человек выбирает по brief.forWhom главный уровень осведомлённости посетителя, пишет под него заголовок
    и первый абзац главной страницы (с brief.mainAction как действием), затем проверяет текст по списку принципов Огилви:
    конкретика, факт из brief.proofs, обращение к одному читателю.'
  checks:
  - Заявлен один основной уровень осведомлённости и дано обоснование через brief.forWhom.
  - Заголовок начинается с того, что посетитель уже знает (проблема, решение или продукт), а не с названия компании.
  - В первом абзаце есть минимум один проверяемый факт из brief.proofs.
  - 'Призыв соответствует уровню: к осведомлённому ведёт к brief.mainAction, к неосведомлённому — к материалу, а не к покупке.'
  sources:
  - title: 'Personal MBA: Levels of Awareness (по Breakthrough Advertising Юджина Шварца)'
    url: https://book.personalmba.com/levels-of-awareness/
    licence: proprietary-link
    kind: article
    lang: en
  - title: 'Wikipedia: David Ogilvy'
    url: https://en.wikipedia.org/wiki/David_Ogilvy
    licence: CC-BY-SA
    kind: article
    lang: en
  - title: 'NN/g: How Users Read on the Web'
    url: https://www.nngroup.com/articles/how-users-read-on-the-web/
    licence: proprietary-link
    kind: article
    lang: en
  videos: []
- id: 11-copy/02-formulas-attention
  order: 2
  title: 'Формулы внимания и боли: AIDA, AIDCA, ACCA, PAS, PASO, SLAP'
  summary: 'Зачем: вы напишете один и тот же блок про свою главную услугу или товар шестью способами и поймёте, какая формула
    для какого посетителя. Разделы (у каждого пример на вашем проекте): AIDA; AIDCA (с убеждением); ACCA (с пониманием и уверенностью);
    PAS; PASO (с предложением); SLAP (Stop–Look–Act–Purchase для рекламы и заголовка).'
  minutes: 30
  teaches:
  - copy.aida
  - copy.aidca
  - copy.acca
  - copy.pas
  - copy.paso
  - copy.slap
  requires:
  - copy.awareness-levels
  - texts.headlines
  - texts.microcopy
  diagram: 'Шесть дорожек, по одной на формулу: один и тот же текст разрезается на блоки, ярлыки A-I-D-A / P-A-S / S-L-A-P
    перекрашивают блоки. Кнопка «собери свой текст» даёт шаблон с полями из brief; рядом тест: к какой формуле принадлежит
    этот абзац.'
  practice: 'Любая эпоха. По brief.items человек выбирает главный пункт и пишет под него шесть блоков (по одному на формулу):
    для PAS — проблему brief.forWhom, для AIDCA — убеждение из brief.proofs, для SLAP — объявление в три строки; выбирает
    лучшие два для разных уровней осведомлённости.'
  checks:
  - Каждый из шести блоков помечен формулой и содержит все её элементы в правильном порядке.
  - В PAS и PASO проблема взята из brief.forWhom и описана без запугивания и без преувеличения.
  - AIDCA и ACCA используют доказательство из brief.proofs, а не общие слова.
  - Во всех блоках действие совпадает с brief.mainAction.
  - Для двух лучших блоков указан уровень осведомлённости, на который они рассчитаны.
  sources:
  - title: 'Wikipedia: AIDA (marketing)'
    url: https://en.wikipedia.org/wiki/AIDA_(marketing)
    licence: CC-BY-SA
    kind: article
    lang: en
  - title: 'Википедия: AIDA'
    url: https://ru.wikipedia.org/wiki/AIDA
    licence: CC-BY-SA
    kind: article
    lang: ru
  - title: 'PAS Framework: Complete Copywriting Guide (il.ly)'
    url: https://il.ly/blog/pas-framework
    licence: proprietary-link
    kind: article
    lang: en
  - title: 'Mirasee: Copywriting formulas'
    url: https://mirasee.com/blog/copywriting-formulas/
    licence: proprietary-link
    kind: article
    lang: en
  videos:
  - title: Модель AIDA в копирайтинге. Формула продающего текста АИДА
    url: https://www.youtube.com/watch?v=KP8GJrsXbww
    lang: ru
  - title: Как писать рекламные тексты. Модель AIDA для продающего текста
    url: https://www.youtube.com/watch?v=YlWu9iNs6hQ
    lang: ru
- id: 11-copy/03-formulas-benefit
  order: 3
  title: 'Формулы выгоды и убеждения: BAB, 4U, 4P, FAB, QUEST'
  summary: 'Зачем: вы научитесь превращать описание услуги в выгоду для конкретного человека, делать заголовок проверяемым
    и строить текст «до — после — мост». Разделы (каждый с примером на проекте): BAB (Before–After–Bridge); 4U (Urgent, Unique,
    Ultra-specific, Useful) для заголовков; 4P (Picture–Promise–Prove–Push); FAB (Feature–Advantage–Benefit); QUEST (Qualify–Understand–Educate–Stimulate–Transition).'
  minutes: 30
  teaches:
  - copy.bab
  - copy.four-u
  - copy.four-p-picture
  - copy.fab
  - copy.quest
  requires:
  - copy.aida
  - copy.pas
  - copy.awareness-levels
  diagram: 'Мастерская FAB: перетаскиваешь свойства услуги в колонки «свойство / преимущество / выгода», подсвечивается, где
    свойство выдано за выгоду. Вторая вкладка — оценка заголовка по 4U: четыре оценочных ползунка, итоговая шкала и подсказка,
    что исправить.'
  practice: Любая эпоха. По каждому пункту brief.items человек строит таблицу FAB; пишет три заголовка и оценивает их по 4U;
    пишет BAB-блок для brief.forWhom (до — после — как brief.mainAction служит мостом); пишет 4P-версию лендинга и QUEST-версию
    письма.
  checks:
  - В таблице FAB каждая выгода отвечает на вопрос «и что мне с этого» посетителя из brief.forWhom.
  - Заголовки оценены по четырём критериям, лучший набрал больше всех и содержит конкретное число или срок.
  - В BAB «после» описывает результат клиента, а не товар; мост — это brief.mainAction.
  - В 4P блок Prove опирается на brief.proofs, а Push — на действие brief.mainAction.
  - QUEST-письмо проходит все пять шагов и не нарушает ограничений рекламы для профессии проекта.
  sources:
  - title: 'Unbounce: A Legendary Copywriting Formula 4 U'
    url: https://unbounce.com/podcast/copywriting-formula-4-u/
    licence: proprietary-link
    kind: article
    lang: en
  - title: 'Mirasee: Copywriting formulas'
    url: https://mirasee.com/blog/copywriting-formulas/
    licence: proprietary-link
