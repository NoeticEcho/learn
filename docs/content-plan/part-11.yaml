lessons:
- id: 11-copywriting/01-awareness
  order: 1
  title: Уровни осведомлённости и принципы Огилви
  summary: Прежде чем выбирать формулу, вы определите, насколько ваш посетитель знает о проблеме и о решениях, и выведете
    из этого, с чего начинать текст. После урока у главной страницы вашего проекта есть заголовок и первый абзац под
    вашего читателя, а вы умеете проверить их шестью принципами Огилви.
  minutes: 20
  teaches:
  - copy-awareness-levels
  - copy-ogilvy-principles
  requires:
  - texts-headlines
  - start-project-brief
  diagram: "AwarenessLadder: ползунок из пяти уровней осведомлённости по Шварцу; первый экран вымышленной мастерской
    перестраивается: с чего начинается заголовок, сколько объяснений, какое действие просит кнопка (с четвёртого уровня
    это главное действие из брифа)."
  practice: 'Выберите основной уровень осведомлённости вашего посетителя (число от 1 до 5, где 1 не знает о проблеме, а 5
    готов обратиться) и объясните выбор через то, для кого проект и откуда люди приходят. Затем напишите первый экран
    под этот уровень: заголовок (h1 с классом headline, не «Добро пожаловать»), первый абзац class="first-para" с фактом
    из доказательств в брифе и ссылку a с классом cta. Для читателя 4–5 она ведёт к главному действию, для 1–3 к
    материалу. Проверьте текст по трём принципам Огилви в заметке. Все «…» нужно заменить. Эпоха: 8.'
  checks:
  - В первом экране осталось многоточие «…». Замените его текстом.
  - В заметке про уровень и принципы Огилви осталось многоточие «…».
  - В поле «уровень» должна стоять цифра от 1 до 5, ничего больше.
  - "Объясните выбор уровня хотя бы шестью словами: откуда приходят люди и что они уже знают."
  - Заголовок должен быть от 15 до 110 знаков и не начинаться с «Добро пожаловать» или «Приветствуем».
  - "Первый абзац слишком короткий: нужно не меньше пятнадцати слов."
  - В первом абзаце нет ни одного доказательства из брифа. Впишите его полностью, как оно записано в брифе.
  - Текст ссылки должен состоять хотя бы из двух слов и называть действие.
  - В заметке нужны три пункта проверки по Огилви.
  - Опишите, к какому одному человеку обращён текст, не меньше четырёх слов.
  sources:
  - title: Levels of Awareness (Personal MBA, по «Breakthrough Advertising» Юджина Шварца)
