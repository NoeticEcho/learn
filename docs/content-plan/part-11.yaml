- id: 11-copy/07-funnels-growth
  order: 7
  title: 'Воронки, рост и приоритеты: TOFU/MOFU/BOFU, STDC, RACE, AARRR, маховик, North Star, ICE и RICE'
  summary: 'Зачем: вы разложите путь посетителя по стадиям, выберете одну главную метрику и решите, какую из идей роста делать
    первой. Разделы (каждый с примером на проекте): воронка и TOFU/MOFU/BOFU; See–Think–Do–Care; RACE; AARRR; маховик; North
    Star Metric; ICE и RICE.'
  minutes: 35
  teaches:
  - copy.funnel
  - copy.see-think-do-care
  - copy.race
  - copy.aarrr
  - copy.flywheel
  - copy.north-star
  - copy.ice-rice
  requires:
  - copy.journey-map
  - copy.stp
  - copy.hook-story-offer
  diagram: 'Воронка с краном на каждой стадии: вводишь конверсии (из brief) и видишь, где утечка; кнопка переключает разметку
    AARRR / RACE / STDC на ту же воронку. Отдельная панель: список идей и ползунки ICE и RICE, ранжирование перестраивается.'
  practice: Любая эпоха. Человек раскладывает контент проекта (brief.sections, brief.items) по стадиям воронки и STDC, формулирует
    North Star для brief.mainAction (например, число заявок в месяц от нужной аудитории), записывает по метрике на каждую
    букву AARRR (оценочные числа) и ранжирует пять идей роста по ICE и RICE.
  checks:
  - Каждая страница и материал проекта отнесены к стадии воронки, и есть хотя бы по одной на каждую.
  - North Star связана с brief.mainAction и измерима, а не «довольные клиенты».
  - Для AARRR названы метрики всех пяти стадий, и измерение возможно инструментом, который будет подключён в части 14.
  - Пять идей оценены по ICE и RICE; различие в рейтингах объяснено.
  - 'Описан маховик проекта: какое действие клиента усиливает следующее.'
