- id: 11-copywriting/06-persuasion
  order: 6
  title: Убеждение и его границы
  summary: Вы научитесь замечать механизмы влияния в чужих и своих текстах (шесть принципов Чалдини, модель Фогга, крючок
    Hooked) и ставить границу между убеждением и манипуляцией, в том числе рядом с российским законом. После урока вы
    проверили свою страницу по принципам Чалдини, сократили форму до минимума, нашли и заменили тёмные паттерны.
  minutes: 30
  teaches:
  - copy-cialdini
  - copy-fogg
  - copy-hooked
  - copy-dark-patterns
  requires:
  - copy-storybrand
  - texts-expert-text
  diagram: "PersuasionLab, две вкладки. Тёмные паттерны: восемь придуманных кусков страниц, названия приёма, принцип
    Чалдини, честная версия и норма закона в ответе. Модель Фогга: ползунок мотивации, шесть факторов простоты и
    подсказка; точка над линией действия."
  practice: 'Проверьте свою страницу на убеждение и манипуляцию. 1) Предложение и форма в блоке page-honest: короткий
    абзац class="offer-text" без давления (слов «осталось», «только сегодня», «успейте», «торопитесь»); форма не больше
    трёх полей, галочка согласия не отмечена заранее, кнопка называет главное действие из брифа. 2) В заметке «Принципы
    Чалдини» для каждого из шести принципов впишите, где он применён у вас, или «не использую». У авторитета назовите
    доказательство из брифа целиком. У социального доказательства скажите, чем оно подтверждено, или что его нет. 3) В
    заметке «Форма по Фоггу» оставьте от одного до трёх полей и обоснуйте каждое. 4) В таблице тёмных паттернов в каждой
    строке «Найден?» впишите «да» или «нет», а в «Чем заменено» что вы сделали или «не применялось». Для эксперта в
    тексте нет гарантий и превосходных степеней. Все «…» нужно заменить. Эпоха: 8.'
  checks:
  - В блоке предложения и формы осталось многоточие «…».
  - В заметках проверки осталось многоточие «…».
  - "Текст предложения слишком короткий: хотя бы двенадцать слов."
  - "В предложении есть давление: «осталось», «только сегодня», «успейте», «торопитесь», «последний шанс». Уберите или
    замените настоящим сроком."
  - В предложении нет цены, срока или условия. Назовите хотя бы одно.
  - В форме больше трёх полей. Оставьте те, без которых не обойтись.
  - Согласие должно быть отдельной галочкой.
  - Галочка не должна быть отмечена заранее. Уберите атрибут checked.
  - "В тексте согласия должно быть слово «обработку»: на что и зачем согласен человек."
  - Кнопка должна называть главное действие из брифа теми же словами, а не «Отправить».
  - "Нужны шесть строк: по одной на каждый принцип Чалдини."
  - У авторитета нужно доказательство из брифа целиком, как оно записано.
  - У социального доказательства напишите, чем оно подтверждено или что его нет, хотя бы три слова.
  - В списке полей формы должно остаться от одного до трёх, каждое со своим «зачем».
  - В таблице тёмных паттернов должно быть шесть строк.
  - В колонке «Найден?» в каждой из шести строк нужно слово «да» или «нет».
  - В колонке «Чем заменено» напишите, что вы сделали, или «не применялось».
  - В тексте остались гарантии или превосходные степени. Для вашей профессии это недопустимо.
  sources:
