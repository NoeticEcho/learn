- id: 11-copywriting/03-benefit
  order: 3
  title: BAB, 4U, 4P, FAB и QUEST
  summary: Вы научитесь превращать описание услуги в выгоду для конкретного человека, оценивать заголовок по четырём
    критериям и строить текст «до, после, мост». После урока у вас есть таблица свойств, преимуществ и выгод по каждому
    пункту проекта и тексты в формулах BAB, 4P и QUEST, а ещё честный разбор того, где 4U подталкивает к обману.
  minutes: 30
  teaches:
  - copy-bab
  - copy-four-u
  - copy-four-p-picture
  - copy-fab
  - copy-quest
  requires:
  - copy-aida
  diagram: "FormulaDesk для FAB, BAB, 4P и QUEST на брифе человека, и FabAndFourU: классификация шести фраз на свойство,
    преимущество и выгоду; оценка заголовков по 4U с предупреждением, когда срочность или уникальность выше единицы."
  practice: "Постройте для проекта пять вещей. 1) Таблица FAB: для каждого пункта брифа впишите свойство, преимущество и
    выгоду; выгода говорит о читателе («вы»). 2) Три заголовка: оцените каждый по 4U (сумма из 12), выберите лучший по
    номеру; хотя бы в одном заголовке должно быть число или срок. 3) BAB: до, после и мост, мост это главное действие из
    брифа. 4) 4P для страницы: в доказательстве назовите доказательство из брифа целиком, в толчке главное действие. 5)
    QUEST для письма: пять шагов. Метки блоков уже стоят, пишите после них. Без гарантий результата и превосходных
    степеней, если профессия их ограничивает. Все «…» нужно заменить. Эпоха: 8."
  checks:
  - Где-то остались многоточия «…». Заполните таблицы и все блоки.
  - В таблице FAB должна быть строка для каждого пункта брифа.
  - "В выгодах не нашлось слов «вы», «вам», «ваш»: выгода должна говорить о читателе."
  - Нужно три заголовка в таблице 4U.
  - В колонке «Сумма» нужны числа. Сложите четыре оценки.
  - Хотя бы в одном заголовке должно быть число или срок.
  - В поле «Выбранный заголовок» нужна цифра 1, 2 или 3.
  - "Нужны три блока BAB: до, после, мост."
  - В мосте BAB должно стоять главное действие из брифа теми же словами.
  - "Нужны четыре блока 4P: картина, обещание, доказательство, толчок."
  - В доказательстве 4P нужно доказательство из брифа целиком.
  - В толчке 4P должно стоять главное действие из брифа теми же словами.
  - Нужны пять шагов QUEST.
  - В переходе QUEST должно стоять главное действие из брифа теми же словами.
  - В тексте остались гарантии или превосходные степени («гарантируем», «лучший», «самый», «100 %»). Для вашей профессии
    это недопустимо.
