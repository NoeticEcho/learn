- id: 11-copy/04-positioning
  order: 4
  title: 'Позиционирование и ценность: JTBD, Value Proposition Canvas, StoryBrand, Hook–Story–Offer'
  summary: 'Зачем: вы сформулируете, какую «работу» нанимает ваш проект у клиента, и из этого выведете ценностное предложение
    и структуру страницы. Разделы (каждый с примером на проекте): JTBD и job stories; Value Proposition Canvas; StoryBrand
    (SB7: герой, проблема, проводник, план, призыв, успех, провал); Hook–Story–Offer.'
  minutes: 35
  teaches:
  - copy.jtbd
  - copy.value-proposition-canvas
  - copy.storybrand
  - copy.hook-story-offer
  requires:
  - copy.awareness-levels
  - copy.bab
  - start.project-brief
  diagram: 'Конструктор «канвас»: слева профиль клиента (задачи, боли, выгоды), справа карта ценности (продукты, обезболивающие,
    создатели выгод); соединяешь пары стрелками — не покрытые боли подсвечены. Вторая вкладка: SB7-схема, в которую подставляются
    ответы.'
  practice: Любая эпоха. Человек пишет job story для brief.forWhom («когда …, я хочу …, чтобы …»), заполняет Value Proposition
    Canvas по brief.items, строит SB7 (герой — посетитель, проводник — brief.who, план — шаги brief.sections, призыв — brief.mainAction)
    и Hook–Story–Offer для главной страницы.
  checks:
  - Job story содержит ситуацию, мотивацию и результат и написана о клиенте, а не о продукте.
  - Каждая боль в канвасе покрыта пунктом из brief.items или явно помечена как не решаемая.
  - В SB7 героем назван посетитель, а проводник (brief.who) показан через empathy и authority, подтверждённые brief.proofs.
  - В Hook–Story–Offer предложение — один из пунктов brief.items с понятным следующим шагом.
  - Позиционирование выражено одним предложением и не повторяет общих слов вроде «качественно» и «профессионально».
  sources:
