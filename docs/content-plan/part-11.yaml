- id: 11-copywriting/04-jtbd
  order: 4
  title: JTBD и Value Proposition Canvas
  summary: "Вы сформулируете, какую «работу» клиент нанимает у вашего проекта, и из этого выведете ценностное предложение:
    что вы закрываете и чего честно не закрываете. После урока у вас есть история о работе клиента (job story), канвас
    ценности по пунктам вашего брифа и позиционирование одним предложением, а ещё умение отличить знание о клиенте от
    собственной гипотезы."
  minutes: 30
  teaches:
  - copy-jtbd
  - copy-value-proposition-canvas
  requires:
  - copy-bab
  diagram: "ValueCanvas, две вкладки. Job story: три поля «когда, я хочу, чтобы» и проверка, что в желании нет решения, а
    в истории нет «мы». Канвас: четыре боли клиента вымышленной мастерской связываются с обезболивающими; важная боль
    без ответа подсвечивается."
  practice: "Запишите, зачем клиент приходит к вашему проекту, и сопоставьте это с предложением. 1) История о работе в
    одном абзаце: «когда» это ситуация клиента (не меньше четырёх слов), «я хочу» это цель без подсказки решения (в ней
    нет слов «кнопка», «сайт», «страница», «функция», «раздел»), «чтобы» результат. История о клиенте: слов «мы» и «наш»
    в ней нет. Ниже впишите функциональную и эмоциональную работу клиента. 2) Канвас: три боли клиента и чем каждая
    снимается: названием пункта из брифа (целиком) или словами «не решаем»; две выгоды, которых клиент ждёт. 3)
    Позиционирование одним предложением, не короче двенадцати слов и без слов «качественный», «профессиональный»,
    «уникальный», «лучший». 4) Что из этого вы знаете из разговоров с клиентами, а что пока гипотеза. Все «…» нужно
    заменить. Эпоха: 8."
  checks:
  - Где-то осталось многоточие «…». Заполните историю, канвас и позиционирование.
  - "В истории должны остаться три части: «когда», «я хочу», «чтобы», каждая в своём span."
  - "Ситуация («когда») слишком короткая: опишите момент хотя бы в четыре слова."
  - "В желании («я хочу») спрятано решение: «кнопка», «сайт», «страница», «функция», «раздел». Опишите цель клиента."
  - "Результат («чтобы») слишком короткий: хотя бы три слова."
  - В истории появились «мы» или «наш». Она должна быть о клиенте.
  - "Функциональная работа клиента описана слишком коротко: хотя бы три слова."
  - "Эмоциональная работа клиента описана слишком коротко: хотя бы три слова."
  - В канвасе нужно три боли.
  - Ни одна боль не связана с пунктом вашего предложения. Впишите название пункта из брифа целиком или «не решаем».
  - Нужны две выгоды, которых ждёт клиент.
  - Позиционирование должно быть не короче двенадцати слов.
  - В позиционировании остались общие слова («качественный», «профессиональный», «уникальный», «лучший», «надёжный»).
    Замените конкретикой.
  - "Напишите, что вы знаете из разговоров, а что гипотеза: хотя бы четыре слова."
