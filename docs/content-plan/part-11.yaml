- id: 11-copywriting/07-marketing
  order: 7
  title: STP, 4P/7P и карта пути клиента
  summary: Вы выберете, кому вы продаёте, как это позиционируете и как складывается маркетинг-микс, и нарисуете путь
    клиента от первого касания до результата с местами, где он теряется. После урока у вас есть сегменты с основным,
    положение на карте восприятия, заполненные семь «P» и карта пути к вашему главному действию.
  minutes: 25
  teaches:
  - copy-stp
  - copy-marketing-mix
  - copy-journey-map
  requires:
  - copy-value-proposition-canvas
  diagram: "PerceptionJourney, две вкладки. Карта восприятия: три точки по осям на выбор (ось «цена и качество» помечена
    как бесполезная), предупреждение, если точка совпала с конкурентом. Путь клиента: шесть этапов, касания, кривая
    настроения и места ухода."
  practice: "Постройте для проекта четыре вещи. 1) Сегменты: по трём сегментам аудитории из брифа впишите, какую задачу
    (работу) решает человек в каждом, не возраст и не пол; выберите основной сегмент и объясните выбор. 2) Карта
    восприятия: впишите две оси, которые клиенты действительно используют при выборе и которые не сводятся к цене и
    «качеству», и расставьте проект и двух конкурентов по осям числами от 1 до 5. 3) Таблица 7P: продукт уже вписан из
    брифа, остальные шесть впишите сами, цену числом или диапазоном. 4) Путь клиента: касание на каждом из шести этапов
    (в этапе «Обращается» главное действие из брифа теми же словами) и «да» или «нет» в колонке «Здесь люди уходят»,
    хотя бы одно «да». Все «…» нужно заменить. Эпоха: 8."
  checks:
  - Где-то осталось многоточие «…». Заполните все таблицы.
  - Нужны три сегмента.
  - "Опишите задачу сегмента подробнее: не меньше шести слов, начните с «когда» или «хочет»."
  - Назовите основной сегмент.
  - "Объясните выбор основного сегмента: не меньше четырёх слов."
  - Ось X должна быть из двух слов или больше и не про цену и «качество».
  - Ось Y должна быть из двух слов или больше и не про цену и «качество».
  - "Нужны три точки: проект и два конкурента."
  - "В таблице карты нужны числа от 1 до 5: по два на каждую из трёх точек."
  - В таблице 7P должно быть семь строк.
  - В строке «Цена» нужно число или диапазон, например «от 3 000 ₽».
  - Нужны шесть этапов пути.
  - В этапе «Обращается» впишите главное действие из брифа теми же словами.
  - Отметьте «да» хотя бы в одном месте, где люди уходят.
