- id: 11-copywriting/05-storybrand
  order: 5
  title: StoryBrand и Hook–Story–Offer
  summary: Вы построите схему главной страницы по семи элементам StoryBrand (посетитель герой, а вы проводник) и коротко
    запишете её же в схеме «крючок, история, предложение». После урока у вас есть схема страницы с честным «провалом» и
    успехом, одной строкой о проекте и текстом из трёх частей, а ещё привычка отличать настоящую историю от выдуманной.
  minutes: 30
  teaches:
  - copy-storybrand
  - copy-hook-story-offer
  requires:
  - copy-jtbd
  diagram: "FormulaDesk для SB7 и Hook–Story–Offer: семь элементов и три блока с вопросами и фактами из брифа человека."
  practice: "Постройте схему главной страницы проекта. 1) SB7: герой (посетитель, не вы: чего он хочет), проблема,
    проводник (вы: сочувствие и подтверждение доказательством из брифа целиком), план из трёх шагов, призыв (прямой
    главным действием из брифа теми же словами и мягкий не меньше чем в три слова), провал (честные последствия, без
    запугивания), успех. Одной строкой (не меньше пятнадцати слов): проблема, план, результат. 2) Hook–Story–Offer:
    крючок, история (с пометкой «типичный случай» или «с согласия клиента»: выдуманная история под видом настоящей
    недопустима) и предложение с названием пункта из брифа и главным действием. Все «…» нужно заменить. Эпоха: 8."
  checks:
  - Где-то осталось многоточие «…». Заполните все семь элементов, строку и три блока.
  - Должно быть семь элементов SB7. Не удаляйте строки.
  - "Герой описан слишком коротко: хотя бы пять слов о том, чего хочет посетитель."
  - В проводнике нет доказательства из брифа. Впишите его целиком, как оно записано.
  - В плане должно быть три шага.
  - Прямой призыв должен называть главное действие из брифа теми же словами.
  - Мягкий призыв (например, «посмотреть, как это проходит») должен быть не короче трёх слов.
  - "В «провале» есть слова из запугивания: «катастрофа», «ужас», «кошмар», «страшно». Замените фактами."
  - "Успех описан слишком коротко: хотя бы шесть слов."
  - Строка про проблему, план и результат должна быть не короче пятнадцати слов.
  - "Нужно три блока: крючок, история, предложение."
  - "Крючок слишком короткий: хотя бы пять слов."
  - "Пометьте историю: «типичный случай», «с согласия клиента» или «вымышленный пример»."
  - В предложении должен быть пункт из вашего брифа, названный целиком.
  - В предложении должно быть главное действие из брифа теми же словами.
  sources:
  - title: "StoryBrand: сайт Дональда Миллера"
    url: https://storybrand.com/
    licence: link-only
    kind: article
    lang: en
