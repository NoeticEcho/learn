- id: 11-copywriting/10-ladder
  order: 10
  title: Лестница ценности и офферы
  summary: Вы построите для своего проекта последовательность предложений от бесплатного до основного, с допродажей и
    облегчённым вариантом, и поймёте, где лестница честна, а где превращается в давление. После урока у вас есть пять
    ступеней с текстом и ценой, форма лид-магнита с отдельными согласиями и список давлений, от которых вы отказались.
  minutes: 25
  teaches:
  - copy-value-ladder
  - copy-lead-magnet-tripwire
  - copy-core-offer-oto
  requires:
  - copy-funnel
  - copy-dark-patterns
  - texts-legal-text
  diagram: "ValueLadder: лестница из пяти ступеней с ценой и долей поднимающихся; выручка на тысячу посетителей; девять
    приёмов давления по ступеням: отметка называет паттерн, честную версию и норму закона."
  practice: "Постройте лестницу из пяти ступеней и напишите для каждой название и текст. 1) Лид-магнит решает один узкий
    вопрос вашей аудитории; форма просит только почту, у неё две отдельные галочки (на обработку данных, слово
    «обработку», и на рассылку, слова «письма» или «новости»), обе не отмечены заранее, кнопка называет, что человек
    получит. 2) Недорогое первое предложение с ценой цифрой. 3) Основное предложение: название пункта из брифа и ссылка
    с главным действием из брифа теми же словами. 4) Дополнение и 5) облегчённый вариант, у обоих названа цена. В тексте
    нет давления («осталось», «только сегодня», «успейте»). В заметке для каждой ступени впишите цену (число или
    «бесплатно») и зачем она человеку, а также где могло появиться давление и чем вы это заменили. Для эксперта нет
    гарантий и превосходных степеней. Все «…» нужно заменить. Эпоха: 8."
  checks:
  - В странице с предложениями осталось многоточие «…».
  - В заметке про лестницу осталось многоточие «…».
  - На странице должно быть пять ступеней (элементов с классом rung).
  - В форме лид-магнита больше одного поля. Оставьте только почту.
  - "В форме лид-магнита нужны две отдельные галочки: на обработку данных и на рассылку."
  - Галочки не должны быть отмечены заранее. Уберите атрибут checked.
  - В тексте согласия на данные должно быть слово «обработку».
  - В тексте согласия на рассылку должны быть слова «письма», «новости» или «рассылка».
  - Кнопка должна называть, что человек получит (не «Отправить»), хотя бы в два слова.
  - В основном предложении ссылка должна называть главное действие из брифа теми же словами.
  - В основном предложении должен быть пункт из вашего брифа, названный целиком.
  - В тексте недорогого первого предложения нужна цена цифрами.
  - В тексте дополнения нужна цена цифрами.
  - В тексте облегчённого варианта нужна цена цифрами.
  - "В предложениях есть давление: «осталось», «только сегодня», «успейте», «торопитесь», «последний шанс», «навсегда».
    Замените настоящим сроком и причиной или уберите."
  - В таблице лестницы должно быть пять строк.
  - В таблице у каждой из пяти ступеней должна быть цена (число или слово «бесплатно»).
  - "У каждой ступени объясните, зачем она человеку: хотя бы четыре слова."
  - "Опишите, где могло появиться давление и чем вы это заменили: не меньше восьми слов."
  - В предложениях остались гарантии или превосходные степени. Для вашей профессии это недопустимо.
