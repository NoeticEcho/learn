- id: 11-copywriting/08-funnel
  order: 8
  title: Воронка, See–Think–Do–Care и RACE
  summary: Вы разложите путь посетителя по стадиям тремя словарями (TOFU/MOFU/BOFU, See–Think–Do–Care, RACE) и увидите, на
    какой стадии у вашего проекта пусто. После урока каждая страница вашего проекта отнесена к стадии, а на пустые
    стадии есть список недостающих материалов.
  minutes: 25
  teaches:
  - copy-funnel
  - copy-see-think-do-care
  - copy-race
  requires:
  - copy-journey-map
  diagram: "FunnelLeaks: воронка из пяти этапов с долями перехода; кнопки подписывают её словарём TOFU/MOFU/BOFU,
    See–Think–Do–Care или RACE; называет место наибольшей потери."
  practice: "Разложите страницы проекта по стадиям. В таблице у каждого раздела из брифа впишите стадию воронки (TOFU,
    MOFU или BOFU), стадию See–Think–Do–Care (See, Think, Do или Care) и одну фразу: что на этой странице решает
    человек. Затем в списке «Чего не хватает» назовите три материала, которых нет, для пустых стадий: у каждого стадия
    воронки, стадия STDC и название (не меньше трёх слов). В итоге в ваших записях должны встретиться все стадии: TOFU,
    MOFU, BOFU и See, Think, Do, Care. И впишите, на какой странице человек делает главное действие (называя его теми же
    словами, что в брифе). Все «…» нужно заменить. Эпоха: 8."
  checks:
  - Где-то осталось многоточие «…». Заполните таблицу, список и строку про главное действие.
  - Для каждого раздела из брифа должна остаться строка таблицы.
  - Опишите, что решает человек на странице, хотя бы в три слова.
  - "В записях не встречается одна из стадий: TOFU, MOFU или BOFU. Добавьте недостающий материал."
  - В записях не встречается одна из стадий See, Think, Do, Care. Добавьте недостающий материал.
  - В списке «Чего не хватает» должно быть три материала.
  - Названия недостающих материалов должны состоять не меньше чем из трёх слов.
  - В строке про главное действие напишите его теми же словами, что в брифе.
  sources:
