- id: 11-copy/08-value-ladder
  order: 8
  title: 'Лестница ценности: лид-магнит, tripwire, основное предложение, OTO, upsell и downsell'
  summary: 'Зачем: вы построите для своего проекта последовательность предложений от бесплатного до основного и поймёте, где
    лестница честна, а где превращается в давление. Разделы (каждый с примером на проекте): лид-магнит; tripwire; основное
    предложение; one-time offer; upsell и downsell.'
  minutes: 25
  teaches:
  - copy.value-ladder
  - copy.lead-magnet-tripwire
  - copy.core-offer-oto
  requires:
  - copy.funnel
  - copy.hook-story-offer
  - copy.dark-patterns
  - texts.legal-text
  diagram: 'Лестница из пяти ступеней по цене и доверию: перетаскиваешь предложения проекта на ступени; график показывает
    долю пользователей, дошедших до каждой, и выручку на посетителя. Красная метка загорается, если ступень похожа на тёмный
    паттерн (ложная срочность, скрытая подписка).'
  practice: 'Любая эпоха. Человек строит лестницу для своего проекта из brief.items: бесплатный лид-магнит под brief.forWhom,
    недорогой tripwire, основное предложение под brief.mainAction, upsell и downsell; пишет текст для каждой ступени и согласие
    на рассылку и обработку данных там, где собираются контакты (brief.contacts).'
  checks:
  - Лид-магнит решает один узкий вопрос brief.forWhom и не требует лишних данных.
  - Цены (или условия) на ступенях возрастают и каждая ступень объяснена выгодой.
  - Основное предложение совпадает с brief.mainAction, остальные ступени ведут к нему.
  - Там, где собираются контакты, есть отдельное согласие и понятный отказ от рассылки.
  - Для проекта с ограничениями рекламы профессии лестница не содержит гарантий результата и давления сроком.
  sources:
