- id: 11-copy/05-persuasion-ethics
  order: 5
  title: 'Убеждение и его границы: Чалдини, Фогг, Hooked, тёмные паттерны'
  summary: 'Зачем: вы научитесь замечать механизмы влияния в чужих и своих текстах и ставить границу между убеждением и манипуляцией,
    в том числе по российскому закону. Разделы (каждый с примером на проекте): шесть принципов Чалдини; поведенческая модель
    Фогга (мотивация, способность, триггер); модель Hooked (триггер, действие, награда, вложение); тёмные паттерны (обман,
    скрытые условия, давление срочностью).'
  minutes: 30
  teaches:
  - copy.cialdini
  - copy.fogg
  - copy.hooked
  - copy.dark-patterns
  requires:
  - copy.paso
  - copy.storybrand
  - texts.expert-text
  diagram: 'Пара страниц рядом: честная и с тёмными паттернами (обратный отсчёт-фикция, скрытый отказ, предвыбранная подписка).
    Игрок кликает по подозрительному месту, получает название паттерна, принцип влияния, который эксплуатируется, и ссылку
    на закон. Вторая вкладка: ось Фогга — ползунки мотивации и способности с порогом действия.'
  practice: Любая эпоха. Человек отмечает на своей главной странице и форме brief.mainAction, какие из шести принципов Чалдини
    использованы и честно ли; делает форму проще по Фоггу (снижает усилие); проверяет страницу по списку тёмных паттернов
    и отменяет или заменяет сомнительное; для проекта-эксперта — проверяет на допустимость рекламы профессии.
  checks:
  - Для каждого использованного принципа Чалдини указан элемент страницы и его подтверждение (brief.proofs для авторитета
    и социального доказательства).
  - Форма brief.mainAction сокращена до минимума полей, и каждое оставшееся поле оправдано.
  - На странице нет ложного дефицита, скрытых платежей и предвыбранных согласий.
  - Для каждого найденного тёмного паттерна предложена честная замена.
  - Если профессия проекта ограничивает рекламу, нет формулировок, которые её нарушают.
  sources:
  - title: 'Influence at Work: The 7 Principles of Persuasion (Чалдини)'
    url: https://www.influenceatwork.com/principles-of-persuasion/
    licence: proprietary-link
    kind: article
    lang: en
