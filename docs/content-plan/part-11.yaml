- id: 11-copy/06-marketing-basics
  order: 6
  title: 'Маркетинг в основе: STP, 4P/7P и карта пути клиента'
  summary: 'Зачем: вы выберете, кому вы продаёте, как это позиционируете и как складывается маркетинг-микс, и нарисуете путь
    клиента от первого касания до повторной покупки. Разделы (каждый с примером на проекте): STP (сегмент, таргет, позиционирование);
    4P (продукт, цена, место, продвижение) и 7P для услуг (люди, процесс, физическое окружение); карта пути клиента.'
  minutes: 25
  teaches:
  - copy.stp
  - copy.marketing-mix
  - copy.journey-map
  requires:
  - copy.jtbd
  - copy.value-proposition-canvas
  - copy.awareness-levels
  diagram: 'Три связанных таблицы: сегменты → таргет → позиционирование (карта восприятия 2×2 с конкурентами); таблица 7P
    с ползунками; карта пути клиента, где касания (поиск, карточка, форма, ответ, оплата, отзыв) можно перетаскивать по этапам
    и видеть эмоции.'
  practice: Любая эпоха. По brief.forWhom человек делит аудиторию на два-три сегмента, выбирает основной, наносит проект и
    двух конкурентов на карту восприятия, заполняет 7P по brief.items (цена, место, продвижение, люди, процесс, окружение)
    и рисует карту пути к brief.mainAction с точками выхода.
  checks:
  - Сегменты различаются по задаче (JTBD), а не только по возрасту и полу.
  - Позиционирование объяснено осью карты восприятия, не совпадающей с ценой и «качеством».
  - В 7P заполнены все семь пунктов, цена указана числом или диапазоном.
  - На карте пути есть касания до и после brief.mainAction и отмечены места, где посетитель теряется.
  sources:
