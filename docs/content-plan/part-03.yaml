- id: 03-css/06-responsive
  order: 6
  title: 'Адаптивность: медиазапросы и контейнерные запросы'
  summary: 'Зачем: сайт открывают на телефоне, ноутбуке и большом мониторе, а ваши посетители чаще всего на телефоне. После
    урока вы делаете mobile first, ставите точки перелома по содержимому и используете контейнерные запросы, чтобы компонент
    подстраивался под своё место.'
  minutes: 30
  teaches:
  - css.responsive
  - css.media-queries
  - css.container-queries
  requires:
  - css.grid
  - html.head-meta
  diagram: 'Рамка, которую можно сужать от 1280 до 320 px: страница перестраивается, на шкале отмечаются сработавшие точки
    перелома; переключатель «медиазапрос / контейнерный запрос» показывает, как одна карточка ведёт себя в узкой боковой колонке.'
  practice: 'Человек переписывает стили своей страницы mobile first: сначала одна колонка, затем один-два медиазапроса. Карточка
    из items получает контейнерный запрос, чтобы в узкой колонке была вертикальной, а в широкой горизонтальной. Эпоха: 4 (2014),
    респонсив и mobile first.'
  checks:
  - В head есть viewport, и при ширине 320 px нет горизонтальной прокрутки
  - Основные стили написаны для узкого экрана, а min-width добавляют правила для широкого
  - Кнопка действия из mainAction видна без прокрутки на экране 360 × 640
  - Карточка меняет раскладку по container-type, а не только по ширине окна
  sources:
