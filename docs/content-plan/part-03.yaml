- id: 03-css/06-responsive
  order: 6
  title: 'Адаптивность: медиазапросы и контейнерные запросы'
  summary: Сайт открывают на телефоне, ноутбуке и большом мониторе, причём чаще всего на телефоне. После урока вы делаете
    mobile first, ставите точки перелома по содержимому и используете контейнерные запросы, чтобы компонент
    подстраивался под своё место.
  minutes: 30
  teaches:
  - css-responsive
  - css-media-queries
  - css-container-queries
  requires:
  - css-grid
  - html-head-meta
  diagram: 'content/diagrams/ResponsiveFrame.svelte: настоящая страница в песочнице с ползунком ширины от 320 до 1280, где
    сработал медиазапрос и как ведёт себя одна карточка в широком и в узком контейнере.'
  practice: 'Сделайте страницу адаптивной. 1) Убедитесь, что в head есть viewport (width=device-width). 2) Перепишите
    раскладку mobile first: базовые правила .layout это один столбец (две области, "main" и "aside" друг под другом), а
    в медиазапросе @media (min-width: 48rem) добавляются два столбца. 3) Картинки не должны вылезать за экран: img {
    max-width: 100%; height: auto }. 4) Кнопка главного действия .button удобна для пальца: min-height не меньше 2.75rem
    (44 пикселей). 5) Блоку карточек .cards дайте container-type: inline-size и напишите @container (min-width: 40rem) {
    .card { … } }: широкая карточка раскладывается в две колонки, узкая остаётся вертикальной. Эпоха: 4. Продолжает шаг
    grid-layout.'
  checks:
  - 'В head нужен тег viewport: <meta name="viewport" content="width=device-width, initial-scale=1">.'
  - 'Макет .layout должен остаться сеткой: display: grid.'
  - 'Картинки должны сжиматься вместе с колонкой: img { max-width: 100%; height: auto; }.'
  - 'У кнопки .button маленькая высота. Для пальца нужно не меньше 44 пикселей: min-height: 2.75rem.'
  - 'У блока карточек нужен container-type: inline-size, иначе контейнерный запрос не знает, чью ширину смотреть.'
  sources:
