- id: 03-css/02-box-model-floats
  order: 2
  title: Блочная модель, единицы и float-раскладка
  summary: У каждого элемента есть содержимое, внутренний отступ, рамка и внешний отступ, и половина «странностей» вёрстки
    возникает из-за них. После урока вы считаете размеры блока, выбираете между px, rem и процентами и можете прочитать
    старую раскладку на float.
  minutes: 30
  teaches:
  - css-box-model
  - css-units
  - css-floats-legacy
  requires:
  - css-cascade
  diagram: content/diagrams/BoxModel.svelte (ползунки width, padding, border, margin и переключатель box-sizing с живыми
    расчётами) и FloatDemo.svelte (колонки на float, подвал, clear и clearfix).
  practice: 'Поставьте основное содержимое и контакты рядом. 1) Задайте всем блокам box-sizing: border-box (у html и
    наследованием для остальных). 2) Ограничьте ширину .layout через max-width и центрируйте его автоматическими полями
    margin: 0 auto. 3) Сделайте main левой колонкой (float: left, ширина в процентах), а aside правой (float: right) с
    внутренним отступом. 4) Подвалу footer задайте clear: both, чтобы он не заехал под колонки. Размеры отступов и
    ширину пишите в относительных единицах: rem и проценты. Эпоха: 2. Продолжает шаг separate-css.'
  checks:
  - 'У html должен быть box-sizing: border-box; остальные элементы наследуют его через *, *::before, *::after {
    box-sizing: inherit; }.'
  - 'У блока .layout нет ограничения ширины: задайте max-width, например 62.5rem (это 1000 пикселей).'
  - 'main должен быть колонкой: float: left (или right).'
  - 'aside должен быть второй колонкой: float: right (или left).'
  - У боковой колонки нет внутреннего отступа. Задайте padding.
  - 'Подвалу нужно clear: both, иначе он заедет под колонки.'
  sources:
  - title: The box model (MDN)
    url: https://developer.mozilla.org/en-US/docs/Learn_web_development/Core/Styling_basics/Box_model
    licence: CC-BY-SA
    kind: course
    lang: en
  - title: Floats (MDN)
    url: https://developer.mozilla.org/en-US/docs/Learn_web_development/Core/CSS_layout/Floats
    licence: CC-BY-SA
    kind: course
    lang: en
  - title: Box Model (web.dev)
    url: https://web.dev/learn/css/box-model
    licence: CC-BY
    kind: course
    lang: en
  - title: Блочная модель — Дока
    url: https://doka.guide/css/box-model/
    licence: link-only
    kind: docs
    lang: ru
