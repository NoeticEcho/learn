- id: 03-css/05-grid
  order: 5
  title: 'Grid: двумерная сетка'
  summary: Когда нужны и строки, и столбцы, flexbox становится неудобным, а grid решает задачу одним правилом. После урока
    вы описываете макет страницы областями и делаете сетку карточек, которая сама подбирает число столбцов.
  minutes: 30
  teaches:
  - css-grid
  requires:
  - css-flexbox
  diagram: 'content/diagrams/GridPlayground.svelte: три варианта колонок с ползунком ширины (фиксированные против
    auto-fit) и макет страницы по областям, широкий и узкий.'
  practice: 'Заменим ручные ширины сеткой. 1) У .layout вместо flex поставьте display: grid, колонки (например minmax(0,
    2fr) minmax(14rem, 1fr)) и области через grid-template-areas: "main aside". 2) main поставьте в свою область через
    grid-area: main, aside через grid-area: aside. 3) Карточки .cards: display: grid, колонки repeat(auto-fit,
    minmax(14rem, 1fr)) и gap. Свойства flex у карточек и макета уберите: они теперь ни к чему. Эпоха: 4. Продолжает шаг
    flex-layout.'
  checks:
  - 'У .layout нужен display: grid вместо flex.'
  - 'Не заданы колонки макета: grid-template-columns, например minmax(0, 2fr) minmax(14rem, 1fr).'
  - 'Нарисуйте макет областями: grid-template-areas: "main aside".'
  - 'Основному блоку нужна область: grid-area: main.'
  - 'У блока карточек .cards нужен display: grid.'
  - 'Не заданы колонки карточек: repeat(auto-fit, minmax(14rem, 1fr)).'
  - Между карточками нужен gap, например 1rem.
  sources:
  - title: CSS grid layout (MDN)
    url: https://developer.mozilla.org/en-US/docs/Learn_web_development/Core/CSS_layout/Grids
    licence: CC-BY-SA
    kind: course
    lang: en
  - title: Basic concepts of grid layout (MDN)
    url: https://developer.mozilla.org/en-US/docs/Web/CSS/CSS_grid_layout/Basic_concepts_of_grid_layout
    licence: CC-BY-SA
    kind: docs
    lang: en
  - title: Grid (web.dev)
    url: https://web.dev/learn/css/grid
    licence: CC-BY
    kind: course
    lang: en
  - title: Руководство по grid — Дока
    url: https://doka.guide/css/grid-guide/
    licence: link-only
    kind: docs
    lang: ru
