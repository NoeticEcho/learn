- id: 03-css/07-modern-css
  order: 7
  title: 'Современный CSS: переменные, вложенность, :has() и слои'
  summary: 'Зачем: сегодняшний CSS умеет то, ради чего раньше брали препроцессоры и скрипты. После урока вы собираете токены
    в переменные, пишете вложенные правила, подсвечиваете форму с ошибкой через :has() и упорядочиваете стили слоями.'
  minutes: 30
  teaches:
  - css.custom-properties
  - css.nesting
  - css.has-selector
  - css.cascade-layers
  requires:
  - css.specificity
  - css.color
  - css.container-queries
  diagram: 'Переключатель тем: переменные цвета, отступа и радиуса меняются ползунками и сразу перекрашивают страницу; вторая
    вкладка показывает порядок слоёв @layer и то, как слой побеждает специфичность.'
  practice: 'Человек выносит цвета, размеры и шрифты из своего CSS в переменные на :root, делает тёмную тему через переменные,
    вкладывает правила карточки и объявляет слои reset, base, components, utilities. Эпоха: не привязана к одной эпохе; результат
    показывается как «CSS 2025».'
  checks:
  - Все цвета и основные отступы заданы через var(--…), а значения объявлены на :root один раз
  - Есть тёмная тема, переключаемая переменными или prefers-color-scheme
  - Стили разложены хотя бы по трём слоям, порядок которых объявлен в начале файла
  - Хотя бы одно правило использует :has() для реального состояния, например формы с невалидным полем
  sources:
