- id: 03-css/03-typography-color
  order: 3
  title: Типографика и цвет
  summary: 'Зачем: большая часть страницы — текст, и от шрифта, размера, межстрочного интервала и цвета зависит, будут ли
    читать. После урока вы подбираете шрифт и мерку строки, задаёте цвета в современных форматах и проверяете контраст по
    WCAG.'
  minutes: 30
  teaches:
  - css.typography
  - css.web-fonts
  - css.color
  - css.contrast
  requires:
  - css.units
  - css.cascade
  diagram: 'Лаборатория текста: ползунки размера, интерлиньяжа и ширины колонки, подсчёт знаков в строке; рядом палитра с
    автоматическим расчётом контраста пары «текст — фон» и пометкой, проходит ли пара AA и AAA.'
  practice: 'Человек подбирает шрифт (системный или веб-шрифт с поддержкой кириллицы), размер основного текста, интерлиньяж
    и две-три цветовые роли по полю tone. Контраст основного и вспомогательного текста проверяется. Эпоха: 2 (2005), веб 2.0:
    глянец и плотные цвета; затем упрощение.'
  checks:
  - Размер основного текста не меньше 16 px, интерлиньяж от 1.4
  - Ширина колонки с текстом ограничена примерно 45–80 знаками
  - Контраст основного текста и фона не ниже 4.5:1, крупного не ниже 3:1
  - Шрифт содержит кириллицу, и подключён с запасным шрифтом и font-display
  sources:
  - title: Fundamental text and font styling
    url: https://developer.mozilla.org/en-US/docs/Learn_web_development/Core/Text_styling/Fundamentals
