- id: 03-css/07-modern-css
  order: 7
  title: 'Современный CSS: переменные, вложенность, :has() и слои'
  summary: Сегодняшний CSS умеет то, ради чего раньше брали препроцессоры и скрипты. После урока вы собираете значения в
    переменные, пишете вложенные правила, подсвечиваете блок по его содержимому через :has() и упорядочиваете стили
    слоями.
  minutes: 30
  teaches:
  - css-custom-properties
  - css-nesting
  - css-has-selector
  - css-cascade-layers
  requires:
  - css-specificity
  - css-color
  - css-container-queries
  diagram: 'content/diagrams/ThemeSwitch.svelte: ползунки оттенка, скругления и отступа, тёмная тема на переменных и
    таблица слоёв, где выбирается слой каждого правила.'
  practice: 'Это та же страница, что вы закончили в прошлый раз, но стили лежат с «зашитыми» значениями. Перепишите их
    по-современному. 1) На :root объявите переменные --color-text, --color-bg, --color-surface, --color-accent и --space
    и используйте их через var() вместо повторяющихся значений. 2) Тёмная тема: в @media (prefers-color-scheme: dark)
    поменяйте только значения переменных; в head добавьте <meta name="color-scheme" content="light dark">. 3) Объявите
    порядок слоёв в начале файла: @layer reset, base, components, utilities; и разложите правила по слоям. 4) Вложите
    правила .site-header и .card с помощью &. 5) Правило section:has(.cards) с внутренним отступом поставьте вне слоёв:
    так оно выигрывает у любого слоя. Эпоха: 7.'
  checks:
  - 'Нет переменной --color-text на :root. Объявите её: :root { --color-text: #1d2430; }.'
  - Нет переменной --color-bg на :root (цвет страницы).
  - Нет переменной --color-surface на :root (цвет карточек и подвала).
  - Нет переменной --color-accent на :root (цвет кнопок и ссылок).
  - 'Нет переменной --space на :root: базовый отступ.'
  - 'В head нужен тег <meta name="color-scheme" content="light dark">: он подсказывает браузеру, что у сайта есть обе
    темы.'
  - 'Правило с :has() не сработало: проверьте, что есть section:has(.cards) { padding-top: … }, и что оно лежит вне
    @layer.'
