- id: 03-css/02-box-model-units
  order: 2
  title: Блочная модель, единицы и float-раскладка
  summary: 'Зачем: у каждого элемента есть содержимое, отступы, рамка и поля, и половина «странностей» вёрстки возникает из-за
    них. После урока вы считаете размеры блока, выбираете между px, rem и %, и можете прочитать старую float-раскладку и объяснить,
    почему её заменили.'
  minutes: 30
  teaches:
  - css.box-model
  - css.units
  - css.floats-legacy
  requires:
  - css.cascade
  diagram: 'Интерактивная блочная модель: ползунки content, padding, border, margin и переключатель box-sizing; рядом блок
    рисуется настоящими размерами, а общая ширина пересчитывается.'
  practice: 'Человек выстраивает страницу в две колонки (основное и боковая панель с contacts) на float и clearfix, как делали
    в 2005-м, задаёт отступы блочной моделью с border-box и размеры в rem. Эпоха: 2 (2005), раскладка на float.'
  checks:
  - 'Для всех элементов задан box-sizing: border-box'
  - Две колонки стоят рядом при ширине 1000 px, а подвал не заезжает под них
  - Размеры текста и отступов заданы в относительных единицах, а не в px
  - Человек правильно посчитал полную ширину блока в трёх примерах
  sources:
  - title: The box model
    url: https://developer.mozilla.org/en-US/docs/Learn_web_development/Core/Styling_basics/Box_model
    licence: CC-BY-SA
    kind: course
