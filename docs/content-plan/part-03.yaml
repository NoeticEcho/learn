lessons:
- id: 03-css/01-selectors-cascade
  order: 1
  title: 'Селекторы и каскад: оформление в отдельном файле'
  summary: Вы отделите оформление от содержимого и поймёте, почему «моё правило не работает». После урока вы подключаете
    файл стилей, выбираете нужные элементы и предсказываете, какое из двух правил победит.
  minutes: 30
  teaches:
  - css-selectors
  - css-cascade
  - css-specificity
  - css-separate-stylesheets
  requires:
  - html-semantic-elements
  - html-tags-attributes
  diagram: 'content/diagrams/Specificity.svelte: калькулятор каскада. Одна ссылка и несколько правил, селектор проверяет
    настоящий Element.matches, специфичность считается тремя числами, а порядок: !important, специфичность, потом
    позиция в файле.'
  practice: 'Оденьте свою страницу. 1) В head подключите файл стилей: link rel="stylesheet" href="styles.css". 2) В
    styles.css задайте body шрифт с запасным вариантом (Georgia, serif или другой), цвет текста и цвет фона по тону
    вашего проекта. 3) Шапке .site-header дайте цвет фона и цвет текста с хорошим контрастом. 4) Ссылке-кнопке .button
    дайте фон и цвет текста. 5) Карточкам .card дайте отступ внутри padding и рамку. Не используйте атрибут style: всё
    оформление живёт в styles.css. Эпоха: 2. Продолжает шаг data-table.'
  checks:
  - Файл стилей не подключён. В head нужна строка <link rel="stylesheet" href="styles.css">.
  - У какого-то элемента остался атрибут style. Перенесите его оформление в styles.css и удалите атрибут.
  - 'У body нужен font-family с запасным вариантом в конце: например, Georgia, serif или system-ui, sans-serif.'
  - 'Цвет текста и фон страницы слишком близки. Нужен контраст не ниже 4,5 к 1: задайте body color и background-color.'
  - У шапки (класс site-header) ещё нет цвета фона. Задайте background-color.
  - Текст в шапке плохо читается на её фоне. Подберите цвет текста с контрастом не ниже 4,5 к 1.
  - У ссылки-кнопки (класс button) нет цвета фона. Задайте background-color.
  - Текст кнопки плохо читается на её фоне. Нужен контраст не ниже 4,5 к 1.
  - У карточки (класс card) нет внутреннего отступа. Задайте padding.
  sources:
  - title: Getting started with CSS (MDN)
    url: https://developer.mozilla.org/en-US/docs/Learn_web_development/Core/Styling_basics/Getting_started
    licence: CC-BY-SA
    kind: course
    lang: en
  - title: Handling conflicts (MDN)
