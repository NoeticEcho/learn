- id: 03-css/04-flexbox
  order: 4
  title: 'Flexbox: выстраиваем в ряд и в столбец'
  summary: Большинство меню, рядов карточек и шапок сегодня строится на flex. После урока вы выравниваете элементы по двум
    осям, распределяете место и делаете меню, которое переносится на узком экране.
  minutes: 25
  teaches:
  - css-flexbox
  requires:
  - css-box-model
  - css-floats-legacy
  diagram: 'content/diagrams/FlexPlayground.svelte: кнопки для flex-direction, justify-content, align-items, flex-wrap и
    gap, живой CSS рядом и подписанные оси.'
  practice: 'Начинается эпоха 2014 года: плоский вид, а раскладка на flexbox вместо float. Страница ваша, а базовые стили
    уже лежат в styles.css (сброс и типографика). 1) Подключите styles.css к странице: link в head. 2) Шапка
    .site-header: display: flex, перенос строк, выравнивание по центру, gap. 3) Оба меню (header nav ul): flex с
    переносом и gap. 4) Страница .layout: flex с переносом и gap, основной блок получает flex: 2 1 28rem, боковой flex:
    1 1 14rem. 5) Карточки .cards: flex с переносом и gap, у каждой .card flex: 1 1 14rem. Float нигде не нужен. Эпоха:
    4. Продолжает шаг languages-hreflang.'
  checks:
  - 'Файл стилей не подключён: в head нужна строка <link rel="stylesheet" href="styles.css">.'
  - 'У шапки .site-header нужен display: flex.'
  - 'Оба меню (header nav ul) должны быть flex-контейнерами: display: flex.'
  - 'Меню должно переноситься на узком экране: flex-wrap: wrap.'
  - 'У блока .layout нужен display: flex: основной и боковой стоят рядом.'
  - 'У блока карточек .cards нужен display: flex.'
  - 'Карточки должны переходить на следующую строку: flex-wrap: wrap.'
  - 'Между карточками нужен gap, например gap: 1rem.'
  - 'У main остался float. Уберите его: раскладка теперь на flexbox.'
  sources:
  - title: Flexbox (MDN)
    url: https://developer.mozilla.org/en-US/docs/Learn_web_development/Core/CSS_layout/Flexbox
    licence: CC-BY-SA
    kind: course
    lang: en
