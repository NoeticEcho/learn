    url: https://developer.mozilla.org/en-US/docs/Web/CSS/CSS_media_queries/Using_media_queries
    licence: CC-BY-SA
    kind: docs
    lang: en
  - title: CSS container queries
    url: https://developer.mozilla.org/en-US/docs/Web/CSS/CSS_containment/Container_queries
    licence: CC-BY-SA
    kind: docs
    lang: en
