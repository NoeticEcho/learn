- id: 03-css/04-flexbox
  order: 4
  title: 'Flexbox: выстраиваем в ряд и в столбец'
  summary: 'Зачем: большинство меню, рядов карточек и шапок строятся на flex. После урока вы выравниваете элементы по двум
    осям, распределяете место и делаете меню, которое переносится на узком экране.'
  minutes: 25
  teaches:
  - css.flexbox
  requires:
  - css.box-model
  - css.floats-legacy
  diagram: 'Площадка flexbox: переключатели flex-direction, justify-content, align-items, flex-wrap и gap меняют положение
    блоков, а оси подписаны; рядом код, который можно редактировать.'
  practice: 'Человек делает шапку с логотипом (title) и меню из sections, ряд карточек из items и строку контактов из contacts
    на flexbox. Float из предыдущего урока удаляется. Эпоха: 4 (2014), адаптивная вёрстка.'
  checks:
  - 'Меню и карточки получают display: flex или inline-flex, а float не используется'
  - При ширине 360 px элементы меню переносятся на следующую строку и не вылезают за экран
  - Между карточками задан gap, а не внешние отступы последнего элемента
  - Человек правильно назвал главную и поперечную ось в трёх примерах
  sources:
