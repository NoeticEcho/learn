- id: 03-css/08-motion
  order: 8
  title: Анимация и движение с уважением к людям
  summary: 'Зачем: небольшое движение показывает, что произошло, а лишнее мешает и даже вредит людям с вестибулярными нарушениями.
    После урока вы делаете плавные переходы и анимацию появления и учитываете настройку «уменьшить движение».'
  minutes: 20
  teaches:
  - css.transitions-animations
  - css.reduced-motion
  requires:
  - css.custom-properties
  - html.a11y-basics
  diagram: Редактор кривой перехода и ключевых кадров рядом с переключателем «уменьшить движение»; включённый режим показывает,
    как те же элементы появляются без перемещения и мерцания.
  practice: 'Человек добавляет переход состояния для кнопки действия (mainAction) и анимацию появления карточек из items,
    затем отключает всё лишнее при prefers-reduced-motion: reduce. Эпоха: 7 (2025) как вишенка; обе версии, с движением и
    без, сохраняются в галерее.'
  checks:
  - Анимируются только transform и opacity
  - 'Есть блок @media (prefers-reduced-motion: reduce), отключающий перемещение и повторяющуюся анимацию'
  - Нет мерцания чаще трёх раз в секунду, а автозапускаемое движение дольше пяти секунд можно остановить
  sources:
  - title: Using CSS animations
    url: https://developer.mozilla.org/en-US/docs/Web/CSS/CSS_animations/Using_CSS_animations
    licence: CC-BY-SA
    kind: docs
    lang: en
  - title: Using CSS transitions
    url: https://developer.mozilla.org/en-US/docs/Web/CSS/CSS_transitions/Using_CSS_transitions
    licence: CC-BY-SA
