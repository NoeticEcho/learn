lessons:
- id: 03-css/01-selectors-cascade
  order: 1
  title: 'Селекторы и каскад: страница 2005 года'
  summary: 'Зачем: вы отделите оформление от содержимого и поймёте, почему «моё правило не работает». После урока вы подключаете
    файл стилей, выбираете нужные элементы и предсказываете, какое из двух правил победит.'
  minutes: 30
  teaches:
  - css.selectors
  - css.cascade
  - css.specificity
  - css.separate-stylesheets
  requires:
  - html.semantic-elements
  - html.tags-attributes
  diagram: 'Калькулятор специфичности: человек пишет несколько правил для одного элемента, схема подсвечивает победителя и
    показывает счёт (id, классы, теги), порядок и источник; перетаскивание правил меняет результат.'
  practice: 'Человек выносит оформление из HTML в отдельный файл стилей и избавляется от тегов font и атрибутов оформления.
    Цвета и шрифт выбираются по полю tone (строгий, тёплый, дерзкий и т. п.). Эпоха: 2 (2005), веб 2.0: CSS в отдельном файле.'
  checks:
  - Страница подключает внешний файл стилей, а в разметке нет тегов font и атрибутов bgcolor
  - Оформление заголовков, меню и карточек задано классами, а не id
  - Нет правил с !important, кроме объяснённых в комментарии
  - Человек правильно предсказал победителя в трёх парах конфликтующих правил
  sources:
