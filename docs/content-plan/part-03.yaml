- id: 03-css/05-grid
  order: 5
  title: 'Grid: двумерная сетка'
  summary: 'Зачем: когда нужны и строки, и столбцы, flexbox становится неудобным, а grid решает задачу одним правилом. После
    урока вы строите макет страницы и адаптивную сетку карточек, которая сама подбирает число столбцов.'
  minutes: 30
  teaches:
  - css.grid
  requires:
  - css.flexbox
  diagram: 'Редактор сетки: человек тянет границы столбцов и строк, называет области (header, main, aside, footer) и размещает
    в них блоки; режим «показать линии» рисует нумерованные линии сетки.'
  practice: 'Человек размечает макет страницы областями grid и делает сетку карточек из items с repeat(auto-fit, minmax()).
    Каждая карточка берёт заголовок и описание из своего пункта. Эпоха: 4 (2014), сетка вместо ручных ширин.'
  checks:
  - Макет страницы использует grid-template-areas или явные колонки
  - Сетка карточек перестраивается от одного до трёх столбцов без медиазапросов
  - Карточки одного ряда имеют одинаковую высоту, и между ними задан gap
  - Человек правильно определил, где лучше flexbox, а где grid, в четырёх примерах
  sources:
  - title: CSS grid layout
    url: https://developer.mozilla.org/en-US/docs/Learn_web_development/Core/CSS_layout/Grids
    licence: CC-BY-SA
    kind: course
    lang: en
  - title: Basic concepts of grid layout
    url: https://developer.mozilla.org/en-US/docs/Web/CSS/CSS_grid_layout/Basic_concepts_of_grid_layout
    licence: CC-BY-SA
    kind: docs
    lang: en
  - title: Grid (web.dev)
    url: https://web.dev/learn/css/grid
    licence: CC-BY
