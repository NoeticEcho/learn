- id: 03-css/03-typography-colour
  order: 3
  title: Типографика и цвет
  summary: Большая часть страницы это текст, и от шрифта, размера, межстрочного интервала и цвета зависит, будут ли его
    читать. После урока вы подбираете шрифт и ширину строки, задаёте цвета в современных форматах и проверяете контраст
    по WCAG.
  minutes: 30
  teaches:
  - css-typography
  - css-web-fonts
  - css-color
  - css-contrast
  requires:
  - css-units
  - css-cascade
  diagram: 'content/diagrams/TypeLab.svelte: размер, интерлиньяж и ширина строки на тексте из брифа и калькулятор
    контраста WCAG с готовыми парами.'
  practice: 'Доведите текст до читаемого. 1) У body: размер шрифта не меньше 16 пикселей (лучше 1.125rem), межстрочный
    интервал line-height от 1.4. 2) Заголовкам h1, h2, h3 дайте другой шрифт с запасным вариантом в конце списка и свой
    line-height. 3) Ширину строки в основном тексте ограничьте: для main p и main li поставьте max-width в знаках (ch),
    около 65. 4) Проверьте контраст: основной текст, кнопка и подвал должны давать не меньше 4.5 к 1 против своего фона.
    Эпоха: 2. Продолжает шаг float-columns.'
  checks:
  - Размер текста у body меньше 16 пикселей. Поставьте не меньше 1rem, лучше 1.125rem.
  - 'У body нет подходящего межстрочного интервала: задайте line-height не меньше 1.4, лучше 1.6.'
  - У заголовков должен быть font-family с запасным семейством в конце, например sans-serif.
  - Строка не ограничена. Для main p, main li задайте max-width в знаках, например 65ch.
  - 'Основной текст плохо читается на своём фоне: контраст ниже 4,5 к 1. Затемните текст или осветлите фон.'
  - 'Текст на кнопке плохо читается на её фоне: контраст ниже 4,5 к 1.'
  - 'Текст в подвале плохо читается на его фоне: контраст ниже 4,5 к 1.'
  sources:
