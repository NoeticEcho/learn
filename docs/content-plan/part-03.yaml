- id: 03-css/08-motion
  order: 8
  title: Анимация и движение с уважением к людям
  summary: Небольшое движение показывает, что произошло, а лишнее мешает и даже вредит людям с вестибулярными нарушениями.
    После урока вы делаете плавные переходы и анимацию появления и учитываете настройку «уменьшить движение».
  minutes: 20
  teaches:
  - css-transitions-animations
  - css-reduced-motion
  requires:
  - css-custom-properties
  - html-a11y-basics
  diagram: 'content/diagrams/MotionLab.svelte: кривая скорости, длительность, переключатель «уменьшить движение» и живой CSS.'
  practice: 'Добавьте движение, которое помогает. 1) Кнопке .button дайте плавный переход: transition-property только из
    transform и цвета (не all и не размеры), transition-duration около 0.2s; на :hover пусть кнопка чуть приподнимается
    (transform). 2) Карточкам .card дайте анимацию появления: @keyframes rise (из прозрачного и чуть ниже в видимое),
    animation-name, animation-duration не дольше секунды. 3) Напишите блок @media (prefers-reduced-motion: reduce):
    уберите перемещение (hover без transform), а у карточек замените анимацию на плавное появление без сдвига. Проверьте
    блок в инструментах разработчика сами: проверки его не видят. Эпоха: 7. Продолжает шаг modern-css.'
  checks:
  - 'У кнопки нет конкретного перехода: transition-property не должен быть all. Перечислите свойства: transform,
    background-color.'
  - В transition-property остались размеры или положение. Анимируйте transform и цвет, а не width, height, top, left.
  - 'У перехода кнопки нет длительности: transition-duration, например 0.2s.'
  - 'У карточек нет анимации: задайте animation-name с @keyframes.'
  - 'Анимация карточек слишком длинная или без длительности: animation-duration не дольше секунды, например 0.5s.'
  sources:
