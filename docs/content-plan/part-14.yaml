- id: 14-metrics/07-heart-dashboard
  order: 7
  title: HEART, North Star и панель показателей проекта
  summary: 'Зачем: выбрать немного метрик, которые говорят о здоровье проекта, и собрать из них панель. После урока человек
    имеет North Star и таблицу HEART (счастье, вовлечённость, принятие, удержание, успех задач) для своего проекта.'
  minutes: 20
  teaches:
  - metrics.heart
  - metrics.dashboard
  requires:
  - metrics.conversion-basics
  - metrics.cohorts-retention
  - copy.north-star
  diagram: 'Матрица HEART × (цель, сигнал, метрика): человек заполняет клетки для выбранного шаблона проекта, и панель собирается
    из выбранных метрик; сравнение «тщеславные против рабочих метрик».'
  practice: 'Эпоха 8 (бриф и интервью, из которого строится сайт): заполнить таблицу HEART для brief.who, выбрать North Star,
    связанный с brief.mainAction, и описать панель из пяти показателей с источником данных (Метрика, CRM, опрос).'
  checks:
  - Заполнены все пять измерений HEART для проекта из brief.
  - North Star отражает ценность для brief.forWhom, а не число посещений.
  - В панели не более пяти показателей, у каждого есть источник.
  - Для каждого показателя указано решение, которое он поддерживает.
  sources:
  - title: 'Rodden, Hutchinson, Fu (Google): Measuring the user experience on a large scale (HEART)'
    url: https://research.google/pubs/measuring-the-user-experience-on-a-large-scale-user-centered-metrics-for-web-applications/
