  - id: 14-metrics/04-conversion-cohorts
    order: 4
    title: Конверсия, воронки, когорты и удержание
    summary: "Вы научитесь мерить результат, а не посещаемость: считать конверсию с правильным знаменателем, находить слабый
      шаг воронки и читать таблицу удержания по когортам. После урока вы посчитали конверсию каждого шага и недельное
      удержание на учебных данных и назвали микроконверсии своего проекта."
    minutes: 30
    teaches:
      - metrics.conversion-basics
      - metrics.funnels
      - metrics.cohorts-retention
    requires:
      - metrics.bounce-definitions
      - copy.funnel
      - copy.aarrr
    diagram: "FunnelCohort: «Воронка и когорты» (part 14, lesson 4). Above: a five-step funnel of a made-up site (2000
      visitors), with a slider on every step; the page names the weakest step and the overall conversion. Below: a
      cohort table (people who did the main action for the first time in a given week, and how many came back in each
      later week) computed from raw counts into percentages and shaded; the same numbers are the lesson's practice data.
      Everything is made up."
    practice: "Работайте с учебными числами в заметке. 1) Воронка: дайте шагам названия своими словами (первый начинается с
      источника, например «пришли из поиска», а последний называет главное действие из брифа теми же словами) и впишите,
      сколько процентов предыдущего шага дошло до каждого следующего. 2) Впишите общую конверсию (от первого до
      последнего шага, в процентах) и самый слабый шаг с его долей. 3) Назовите не меньше двух микроконверсий для вашего
      проекта; хотя бы одна связана с разделом сайта из брифа. 4) В таблице когорт впишите, сколько процентов каждой
      когорты вернулись в нужную неделю (только число). Все «…» нужно заменить. Эпоха: 8."
    checks:
      - Где-то осталось многоточие «…». Заполните все названия шагов, доли, микроконверсии и проценты.
      - "Первый шаг должен называть источник: например «пришли из поиска» или «пришли из письма»."
      - Последний шаг должен называть главное действие теми же словами, что в брифе.
      - "Переход со второго шага на третий: 240 из 800. Посчитайте процент."
      - "Переход с третьего на четвёртый: 120 из 240."
      - "Переход с четвёртого на пятый: 60 из 120."
      - "Проверьте последнюю долю: 60 из 120."
      - "Общая конверсия: 60 из 2000, то есть 3 процента."
      - Самый слабый шаг тот, где самая низкая доля перехода. Назовите его и его долю.
      - Нужны не меньше двух микроконверсий.
      - Хотя бы одна микроконверсия должна называть раздел сайта из брифа.
      - "Когорта 6 октября, неделя 1: 70 из 200."
      - "Когорта 6 октября, неделя 2: 50 из 200."
      - "Когорта 6 октября, неделя 3: 40 из 200."
      - "Когорта 13 октября, неделя 1: 48 из 160."
      - "Когорта 13 октября, неделя 2: 32 из 160."
      - "Когорта 20 октября, неделя 1: 48 из 120."
