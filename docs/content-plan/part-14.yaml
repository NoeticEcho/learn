- id: 14-metrics/06-heatmaps-replay
  order: 6
  title: 'Тепловые карты и запись сессий: польза и этика'
  summary: 'Зачем: пользоваться Вебвизором, картами кликов и прокрутки (Метрика, Clarity), не нарушая приватность: маскирование
    форм, согласие, сроки хранения. После урока человек составляет правила записи сессий для своего сайта.'
  minutes: 20
  teaches:
  - metrics.heatmaps-replay
  - metrics.analytics-ethics
  requires:
  - metrics.counter-setup
  - data.privacy-by-design
  diagram: 'Запись сессии учебного сайта: человек включает маскирование полей и видит, как исчезают введённые данные; карта
    кликов и прокрутки с переключателем «десктоп / телефон».'
  practice: 'Эпоха 7: включить Вебвизор или Clarity только на страницах из brief.sections, где нет ввода данных, или замаскировать
    поля; записать правила: что собирается, сколько хранится, кто видит, как об этом сказано в политике (brief.languages).
    Для регулируемых профессий исключить страницы с описанием дела клиента.'
  checks:
  - Вебвизор или Clarity включён только на указанных страницах из brief.sections.
  - Формы и поля с персональными данными замаскированы.
  - Указан срок хранения записей и круг лиц с доступом.
  - Политика обработки данных на языке из brief.languages сообщает о записи сессий.
