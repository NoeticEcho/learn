  - id: 14-metrics/03-engagement
    order: 3
    title: Отказы, время, прокрутка и CTR
    summary: Вы поймёте, как считаются отказ в Метрике и в GA4, почему эти числа расходятся, что значат время на странице,
      глубина прокрутки и CTR, и каким цифрам не стоит верить. После урока у вас выбран показатель вместо «отказов»,
      условие «неотказа» для страницы с главным действием и пороги прокрутки для длинных страниц.
    minutes: 25
    teaches:
      - metrics.bounce-definitions
      - metrics.time-scroll-ctr
    requires:
      - metrics.counter-setup
      - metrics.visits-events
    diagram: "BounceCompare: «Один визит, два счётчика» (part 14, lesson 3). The reader sets one visit (seconds on the page,
      page views, a non-bounce event, a key action) and sees how Яндекс Метрика and GA4 each classify it. Метрика: a
      bounce is a visit with at most one view, shorter than the threshold (15 s by default) and without the service
      «неотказ» event; with accurateTrackBounce on, the counter sends that event itself after the threshold. GA4: a
      visit is engaged when it lasts over 10 s, or has 2+ views, or has a key event, and the bounce rate is the share of
      sessions that were not engaged. A scroll bar shows the thresholds (25/50/75/100 in Метрика-style goals, 90 for the
      GA4 automatic event). Sources: the Яндекс Директ article and the GA4 Data API schema cited in the lesson.
      Everything else is made up."
    practice: "Заполните заметку. 1) Выберите показатель, который заменит «отказы» для вашего сайта: «достижение цели»,
      «глубина прокрутки» или «неотказ»; объясните причину (не короче восьми слов). 2) Объясните одним предложением, чем
      различаются определения отказа в Метрике и в GA4: назовите оба счётчика и оба порога (15 и 10 секунд). 3) Для
      страницы, где человек выполняет главное действие, не покидая её, напишите условие, при котором визит не считается
      отказом: назовите главное действие теми же словами, что в брифе (не короче восьми слов). 4) Впишите не меньше двух
      страниц, где нужна глубина прокрутки (названия разделов из брифа), и пороги 25, 50 и 75 процентов. Все «…» нужно
      заменить. Эпоха: 8."
    checks:
      - Где-то осталось многоточие «…». Заполните показатель, объяснения и список страниц.
      - "Назовите показатель вместо отказов: «достижение цели», «глубина прокрутки» или «неотказ»."
      - Причину выбора напишите не короче чем восемью словами.
      - В предложении про различия назовите и Метрику, и GA4.
      - "В предложении про различия укажите пороги: 15 секунд (Метрика) и 10 секунд (GA4)."
      - Условие «неотказа» опишите не короче чем восемью словами.
      - В условии назовите главное действие теми же словами, что в брифе.
      - Нужны не меньше двух страниц с порогами прокрутки.
      - Страницы называйте по разделам из брифа.
      - Среди порогов должны быть 25, 50 и 75 процентов.
    sources:
