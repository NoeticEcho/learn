  - id: 14-metrics/06-ab-tests
    order: 6
    title: A/B-тесты и их ловушки
    summary: "Вы научитесь проверять изменение экспериментом и не принимать шум за эффект: размер выборки, подглядывание,
      несколько метрик сразу, сезонность. После урока у вас есть план одного A/B-теста для вашей гипотезы с метрикой,
      размером выборки, сроком и правилом остановки, а для малого трафика честная альтернатива."
    minutes: 30
    teaches:
      - metrics.ab-tests
    requires:
      - metrics.attention-behaviour
      - metrics.conversion-basics
      - metrics.vanity-goodhart
    diagram: "AbPeek: «Подглядывание» (part 14, lesson 6). 300 simulated experiments in the browser. Every visitor converts
      with probability 5% (both variants identical) or, with the switch on, variant B really converts at 6%. The reader
      chooses how many visitors each variant gets, and whether the experimenter looks at the result ten times along the
      way and stops at the first «значимая» difference, or looks once, at the end. A two-sided two-proportion z-test at
      the 5% level decides what «значимая» means. With identical variants a single look at the end gives about 5% false
      wins; ten looks give several times more. With the real uplift the same run shows how often the test notices it
      (its power). The rule of thumb n ≈ 16·p(1−p)/δ² for 80% power is shown beside it. Nothing here is real data."
    practice: "Составьте план теста для одной из ваших гипотез. Впишите: гипотезу; одну главную метрику, связанную с главным
      действием из брифа (назовите действие теми же словами); текущее значение метрики в процентах (допущение),
      минимальную интересную разницу в процентных пунктах, нужную выборку на вариант (число, хотя бы три цифры; оцените
      по правилу 16·p·(1−p)/δ²), посетителей в день на страницу и срок в днях; правило остановки, из которого видно, что
      вы не остановитесь раньше срока (не короче восьми слов); что вы не меняете во время теста (не короче пяти слов).
      Назовите две ловушки и как вы избежите каждой. И напишите, что вы сделаете, если трафика мало (не короче десяти
      слов). Все «…» нужно заменить. Эпоха: 7."
    checks:
      - Где-то осталось многоточие «…». Заполните весь план.
      - "Запишите гипотезу не короче чем шестью словами: «если… то… потому что…»."
      - Главная метрика должна называть главное действие теми же словами, что в брифе.
      - Текущее значение метрики впишите числом (допущение).
      - Минимальную интересную разницу впишите числом в процентных пунктах.
      - Выборку на вариант впишите числом не меньше сотни, лучше оценённым по правилу.
      - Число посетителей в день впишите цифрой.
      - Срок впишите в днях цифрой.
      - В правиле остановки должно быть видно, что вы не остановитесь раньше срока («не раньше…», «только после…»), не
        короче восьми слов.
      - Опишите, что не меняете во время теста, не короче чем пятью словами.
      - Нужны две ловушки.
      - "Как избегаем: опишите защиту не короче чем четырьмя словами."
      - Опишите, что вы сделаете при малом трафике, не короче чем десятью словами.
    sources:
      - title: "Evan Miller: How not to run an A/B test"
        url: https://www.evanmiller.org/how-not-to-run-an-ab-test.html
        licence: proprietary-link
        kind: article
        lang: en
