  - id: 14-metrics/02-metrika-setup
    order: 2
    title: "Яндекс Метрика и GA4: счётчик, события, цели"
    summary: Вы поставите счётчик так, чтобы он считал честно, и настроите цель на главное действие из брифа, не засчитывая
      одно действие дважды. После урока на странице стоит код счётчика (один раз), форма отправляет цель при отправке, а
      у вас готов план событий и абзац для политики обработки данных.
    minutes: 30
    teaches:
      - metrics.counter-setup
      - metrics.visits-events
    requires:
      - js.events
      - html.head-meta
      - net.http-status-headers
    diagram: "CounterLive: «Что видит счётчик» (part 14, lesson 2). A made-up page with four things to press (reload,
      scroll, call link, send form) and a counter that is either installed or not. Every press becomes a line in an
      event log (a view, an event or a goal) and moves four totals: visits, views, events, goals. Two switches show the
      two classic mistakes: the counter code twice on one page, which doubles the views, and a goal sent on every press
      with no once-only guard, which counts one form many times. A third switch, Webvisor, lists what is collected when
      it is on. Nothing leaves the page: the log is local state. The counter is made up and tied to no real service."
    practice: 'Доработайте страницу. 1) В head вставьте код счётчика Яндекс Метрики (с загрузчиком
      mc.yandex.ru/metrika/tag.js и вызовом ym с номером счётчика и словом init) ровно один раз; номер возьмите
      условный, например 12345678. 2) В конце body добавьте скрипт, который при отправке формы вызывает ym(…,
      "reachGoal", "lead_submit") не больше одного раза за действие (флаг или once: true). 3) В заметке заполните план
      событий: не меньше двух событий; у каждого имя латиницей через подчёркивание, когда оно срабатывает, как вы
      защищаетесь от повторов (не короче шести слов) и как оно называется в GA4. Главное действие из брифа (теми же
      словами) должно быть в плане. 4) Напишите, куда вставляют код в Tilda, WordPress и 1С-Битрикс. 5) Напишите абзац
      для политики обработки данных о Метрике: что собирается, не короче пятнадцати слов, с упоминанием cookie и
      IP-адреса. Все «…» нужно заменить. Эпоха: 4.'
    checks:
      - Где-то осталось многоточие «…». Заполните план событий, строку про сервисы и абзац для политики.
      - "Не найден загрузчик Метрики: в коде должен быть адрес https://mc.yandex.ru/metrika/tag.js."
      - 'Нет вызова ym(номер, "init", …): добавьте его после загрузчика.'
      - Код инициализации счётчика встречается больше одного раза. Оставьте один.
      - Нет вызова ym(номер, "reachGoal", "название_цели") с названием латиницей через подчёркивание.
      - "В скрипте нет защиты от повторов: добавьте флаг (например sent) или обработчик с once: true."
      - В плане событий должно быть не меньше двух строк.
      - "Название события пишется латиницей строчными с подчёркиванием между словами: lead_submit."
      - Опишите защиту от повторов не короче чем шестью словами.
      - "Название события в GA4 пишется латиницей строчными: generate_lead."
      - В плане событий должно быть названо главное действие теми же словами, что в брифе.
      - "В строке про конструкторы назовите все три: Tilda, WordPress и 1С-Битрикс."
      - В абзаце для политики назовите Метрику, cookie и IP-адрес и напишите не короче пятнадцати слов.
