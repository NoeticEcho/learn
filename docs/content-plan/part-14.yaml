lessons:
  - id: 14-metrics/01-behaviour
    order: 1
    title: Что двигает клики и удержание
    summary: Вы поймёте, как посетитель читает экран, где кончается его внимание и почему он нажимает или уходит, чтобы
      ставить гипотезы, а не гадать. После урока у вас три гипотезы для главного действия вашего проекта в виде «если,
      то, потому что», у каждой показатель проверки и оценка, хватит ли трафика.
    minutes: 25
    teaches:
      - metrics.attention-behaviour
    requires:
      - texts.screen-reading
      - design.visual-hierarchy
      - copy.fogg
    diagram: "AttentionMap: «Куда смотрит внимание» (part 14, lesson 1). A tall made-up page is cut into screens, and each
      screen is shaded by the share of viewing time it received in the Nielsen Norman Group's 2018 eye-tracking study
      (57% on the first screen, 17% on the second, 7% on the third, 19% on everything below). The reader moves the call
      to action up and down the page and sees how much of the attention it can hope for. The shares are the study's
      averages for the pages it tested: a reference point for hypotheses, not a promise about the reader's own site. All
      pages are made up."
    practice: "Запишите три гипотезы в форме «если изменить X, то Y вырастет (или снизится), потому что Z». Каждая относится
      к главному действию из брифа (назовите его теми же словами хотя бы в одной гипотезе) или к разделу сайта из брифа.
      Для каждой укажите показатель проверки (не короче двух слов) и число посетителей в месяц на этой странице цифрой.
      В «то» должно быть слово об изменении: «вырастет», «снизится», «увеличится», «уменьшится». Все «…» нужно заменить.
      Эпоха: 8."
    checks:
      - Где-то осталось многоточие «…». Заполните все три гипотезы.
      - Нужны три гипотезы.
      - В части «Если» опишите изменение не короче чем тремя словами.
      - "В части «то» должно быть слово об изменении: «вырастет», «снизится», «увеличится» или «уменьшится»."
      - В части «потому что» напишите причину не короче чем четырьмя словами.
      - Хотя бы одна гипотеза должна называть главное действие теми же словами, что в брифе.
      - Хотя бы одна гипотеза должна называть раздел сайта из брифа.
      - Показатель проверки напишите не короче чем двумя словами.
      - Число посетителей в месяц нужно написать цифрой.
    sources:
      - title: "NN/g: Scrolling and Attention"
        url: https://www.nngroup.com/articles/scrolling-and-attention/
        licence: proprietary-link
        kind: article
        lang: en
