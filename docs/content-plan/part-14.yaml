  - id: 14-metrics/05-metrics-that-lie
    order: 5
    title: "Метрики, которые обманывают: тщеславные цифры и закон Гудхарта"
    summary: "Вы научитесь отличать цифры, которые помогают решать, от цифр, которые только приятно видеть, и защищаться от
      ловушек: закона Гудхарта, смешения групп, малых чисел. После урока вы разобрали учебную панель, переписали три
      тщеславных показателя в рабочие и записали защиту для главной метрики своего проекта."
    minutes: 25
    teaches:
      - metrics.vanity-goodhart
    requires:
      - metrics.conversion-basics
      - copy.north-star
    diagram: "MetricTraps: «Две ловушки цифр» (part 14, lesson 5). Tab one: a made-up site is rewarded for the number of
      leads, and a slider is the pressure put on that number (a shorter form, a pop-up, a sweetener). The number of
      leads grows, the share of useful leads falls, and the count of useful leads rises a little and then drops:
      Goodhart's law in four lines of arithmetic. Tab two: Simpson's paradox with made-up weekly numbers: both device
      groups improved, and the total fell, because the mix of visitors changed. Everything is invented; the formulas are
      the author's illustration, not measured behaviour."
    practice: "Разберите панель в заметке. 1) В таблице отметьте каждый показатель одним из трёх слов: «тщеславная»,
      «рабочая» или «вводит в заблуждение», и напишите, какое решение он поддерживает (для рабочих не короче трёх слов).
      2) Выберите три показателя, которые вы переписали бы, и для каждого впишите, что было и во что вы переписали:
      новая версия должна быть долей или считаться на что-то (на посетителя, из какого числа, в процентах). 3) Напишите
      защиту для главной метрики своего проекта: главное действие из брифа теми же словами, какую вторую метрику вы
      будете смотреть рядом, чтобы не получить подгонку (не короче двенадцати слов). Все «…» нужно заменить. Эпоха: 8."
    checks:
      - Где-то осталось многоточие «…». Заполните таблицу, три переписанных показателя и защиту.
      - "Просмотры страниц за месяц тщеславная метрика: они растут без пользы."
      - "Подписчики за всё время тоже тщеславная или вводящая в заблуждение: считаются и ушедшие."
      - Заявки с рабочим телефоном от нужного сегмента рабочая метрика.
      - "Среднее время на сайте вводит в заблуждение: человек может читать, а может запутаться."
      - Доля посетителей из поиска, дошедших до формы рабочая метрика.
      - Лайки тщеславная метрика.
      - "Для рабочей метрики напишите, какое решение она поддерживает: не короче трёх слов."
      - "Для рабочей метрики напишите, какое решение она поддерживает: не короче трёх слов."
      - Нужны три переписанных показателя.
      - "Новая версия должна быть долей или считаться на что-то: «доля…», «из…», «на одного…», «в процентах»."
      - Защиту опишите не короче чем двенадцатью словами.
      - В защите назовите главное действие теми же словами, что в брифе.
