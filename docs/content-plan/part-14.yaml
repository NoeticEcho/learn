- id: 14-metrics/04-conversion-cohorts
  order: 4
  title: Конверсия, воронки, когорты и удержание
  summary: 'Зачем: измерять не посещаемость, а результат: сколько из пришедших сделали главное действие, где теряются на пути
    и возвращаются ли. После урока человек строит воронку и считает конверсию и когортное удержание на примере.'
  minutes: 25
  teaches:
  - metrics.conversion-basics
  - metrics.funnels
  - metrics.cohorts-retention
  requires:
  - metrics.bounce-definitions
  - copy.funnel
  - data.sql-select
  diagram: 'Воронка с шагами из brief.sections и таблица когорт по неделям: человек правит конверсию шага и видит, как меняется
    итог и удержание; SQL-запрос на PGlite считает то же самое из учебной таблицы событий.'
  practice: 'Эпоха 6: описать воронку «пришёл → увидел предложение → нажал → заполнил → отправил» по brief.mainAction, поставить
    микроконверсии (клик по контакту, прокрутка до brief.proofs, скачивание документа) и посчитать на учебных данных конверсию
    каждого шага и недельное удержание.'
  checks:
  - Воронка начинается с источника и заканчивается brief.mainAction.
  - Есть минимум две микроконверсии из brief.sections или brief.contacts.
  - Конверсия рассчитана на каждом шаге и указан самый слабый шаг.
  - Таблица удержания по неделям посчитана на данных.
  sources:
