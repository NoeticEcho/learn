  - id: 14-metrics/07-heatmaps-privacy
    order: 7
    title: Тепловые карты, записи сессий и согласие на cookie
    summary: "Вы научитесь смотреть на сайт глазами людей через карты кликов, прокрутки и записи сессий, не нарушая их
      приватности: маскировать поля, записывать только нужные страницы, ограничивать срок и доступ, спрашивать согласие.
      После урока у вас готовы баннер согласия, который не обманывает и не запускает счётчик заранее, поля формы,
      скрытые от записи, и правила записи сессий для вашего сайта."
    minutes: 30
    teaches:
      - metrics.heatmaps-replay
      - metrics.analytics-ethics
    requires:
      - metrics.counter-setup
      - texts.legal-text
      - html.form-validation
    diagram: "SessionMask: «Что видно в записи сессии» (part 14, lesson 7). A made-up visitor fills in a made-up contact
      form on one of three pages. The right-hand pane shows what the owner of the site would see in a session recording.
      Three switches decide it: recording on at all, the form fields masked, and the page with the description of a
      client's case excluded from recording. Switch masking off and the visitor's name, phone and the story of their
      dispute are readable; switch it on and they become stars. Every person and every word here is invented."
    practice: 'Исправьте страницу и запишите правила. 1) Баннер: должна быть диалоговая роль, две кнопки одного вида
      «Принять» и «Отклонить», ссылка на политику со словом «политика», галочка «разрешить аналитику» не отмечена
      заранее. 2) Счётчик не должен запускаться до согласия: код Метрики оформите как script с type="text/plain" и
      data-consent="analytics", а в обычном script (он должен остаться единственным активным) напишите загрузчик,
      который запускает этот код только после согласия; в активном script не должно быть вызова ym(. 3) На поля формы
      поставьте класс ym-disable-keys (не меньше двух). 4) В правилах записи сессий: на каких страницах из брифа
      (названия), что скрыто, что исключено (не короче пяти слов), срок хранения цифрой в днях, кто видит (не короче
      трёх слов), что сказано в политике (не короче двенадцати слов, со словом «записываем»). Если в брифе есть
      английский, добавьте политику по-английски. Все «…» нужно заменить. Эпоха: 7.'
    checks:
      - Где-то осталось многоточие «…». Заполните все правила записи.
      - У каждого поля формы должна быть подпись (label).
      - 'У баннера должна быть роль диалога: role="dialog".'
      - "В баннере нужны две кнопки: «Принять» и «Отклонить»."
      - Кнопка согласия должна называться «Принять».
      - Нужна кнопка «Отклонить» того же вида, что и «Принять».
      - В баннере нужна галочка «разрешить аналитику».
      - "Галочка не должна быть отмечена заранее: уберите checked."
      - В баннере нужна ссылка на политику со словом «политика».
      - Код Метрики нужно оформить как script с type="text/plain" и data-consent="analytics".
      - "Активным должен остаться только один script: загрузчик. Метрику перенесите в «спящий» script."
      - "В активном script остался вызов ym(: код Метрики запускается до согласия. Перенесите его в «спящий» script."
      - Поставьте класс ym-disable-keys не меньше чем на два поля формы.
      - Назовите страницы, где запись нужна, по разделам из брифа.
      - "Скажите, что скрыто: например класс ym-disable-keys или «маскирование полей»."
      - Опишите, что исключено из записи, не короче чем пятью словами.
      - Срок хранения впишите цифрой в днях.
      - Опишите, кто видит записи, не короче чем тремя словами.
      - В политике должно быть слово «записываем» и не меньше двенадцати слов.
      - "В брифе есть английский: добавьте политику по-английски не короче десяти слов."
    sources:
