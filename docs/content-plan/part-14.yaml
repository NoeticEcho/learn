lessons:
- id: 14-metrics/01-behaviour
  order: 1
  title: Что двигает клики и удержание
  summary: 'Зачем: понять, как посетитель читает экран, где кончается внимание и почему он кликает или уходит, чтобы ставить
    гипотезы, а не гадать. После урока человек формулирует три гипотезы для своих страниц.'
  minutes: 20
  teaches:
  - metrics.attention-behaviour
  requires:
  - texts.screen-reading
  - design.visual-hierarchy
  - copy.fogg
  diagram: 'Тепловая карта внимания на макете страницы: человек двигает блок призыва выше и ниже сгиба, и распределение внимания
    по данным NN/g перерисовывается; гипотеза записывается в формате «если… то… потому что…».'
  practice: 'Эпоха 4: для страницы с brief.mainAction записать три гипотезы по шаблону «если изменить X, то Y вырастет, потому
    что Z» (расположение призыва, заголовок, форма) и указать, какой показатель их проверит.'
  checks:
  - Три гипотезы в формате «если… то… потому что…».
  - Каждая гипотеза относится к brief.mainAction или разделу из brief.sections.
  - У каждой указан показатель проверки.
  - 'Гипотезы можно проверить за разумный срок: хватает ли трафика.'
  sources:
  - title: 'NN/g: Scrolling and Attention'
    url: https://www.nngroup.com/articles/scrolling-and-attention/
    licence: proprietary-link
    kind: article
    lang: en
  - title: 'NN/g: How long do users stay on web pages?'
    url: https://www.nngroup.com/articles/how-long-do-users-stay-on-web-pages/
    licence: proprietary-link
    kind: article
    lang: en
  - title: 'Wikipedia: Bounce rate'
    url: https://en.wikipedia.org/wiki/Bounce_rate
    licence: CC-BY-SA
    kind: article
    lang: en
  videos: []
- id: 14-metrics/02-metrika-setup
  order: 2
  title: Настройка Яндекс Метрики для сайта
  summary: 'Зачем: правильно поставить счётчик, не нарушив закон о персональных данных, и сразу настроить цели под главное
    действие. После урока на сайте работает счётчик, и первая цель отслеживает brief.mainAction.'
  minutes: 25
  teaches:
  - metrics.counter-setup
  - metrics.visits-events
  requires:
  - js.events
  - html.head-meta
  - net.http-status-headers
  - server.webhooks
  diagram: 'Живая панель Метрики на макете сайта: человек вставляет код счётчика, нажимает кнопки на странице, и поток событий
    (визиты, просмотры, цели) идёт в таблицу; переключатель «Вебвизор вкл/выкл» показывает, что собирается.'
  practice: 'Эпоха 4/5: установить код счётчика на все страницы, настроить цель по JavaScript-событию «brief.mainAction» (отправка
    формы, клик по телефону, запись), проверить в режиме отладки, что цель срабатывает один раз. Для Tilda или WordPress указать,
    где вставляется код. Добавить в политику обработки данных сведения о Метрике.'
  checks:
  - Счётчик стоит на всех страницах, и код не продублирован.
  - Создана цель, соответствующая brief.mainAction, и она срабатывает один раз за действие.
  - Для сайта на конструкторе указано, куда вставлять код (Tilda, Битрикс, WordPress).
  - В политике обработки данных упомянута Метрика и перечислены собираемые данные.
  sources:
