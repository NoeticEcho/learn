  - id: 14-metrics/08-heart-dashboard
    order: 8
    title: HEART, North Star и панель показателей
    summary: Вы выберете немного метрик, которые говорят о здоровье проекта, и соберёте из них панель, на которую приятно и
      полезно смотреть. После урока у вас заполнена таблица HEART для вашего проекта, записан North Star, связанный с
      главным действием из брифа, и описана панель из пяти показателей с источником данных и решением, которое каждый
      поддерживает.
    minutes: 25
    teaches:
      - metrics.heart
      - metrics.dashboard
    requires:
      - metrics.conversion-basics
      - metrics.cohorts-retention
      - copy.north-star
      - metrics.vanity-goodhart
    diagram: "HeartBoard: «Матрица HEART» (part 14, lesson 8). Five rows (счастье, вовлечённость, принятие, удержание, успех
      задач) for six kinds of project; each row gives a goal, a signal and a metric, with a switch that replaces every
      metric by the vanity number people usually reach for instead. Below, ten candidate numbers for a panel; the reader
      picks at most five and the page says how many of them are vanity, since a panel that is mostly vanity numbers is a
      decoration. Example rows are the author's teaching examples, not data. HEART is the framework of Rodden,
      Hutchinson and Fu (Google, 2010)."
    practice: "Соберите панель для вашего проекта в заметке. 1) Таблица HEART: для каждой из пяти сторон впишите цель,
      сигнал и метрику (метрика не короче трёх слов; в строке «Успех задач» должно быть главное действие из брифа теми
      же словами). 2) North Star: одна метрика, в которой названо главное действие из брифа, период («в месяц», «в
      неделю») и для кого (формулировка «для кого» из брифа); без слов «посещаемость» и «просмотры». 3) Панель: от трёх
      до пяти показателей, у каждого название (не короче двух слов), источник данных (Метрика, GA4, CRM, опрос, форма,
      таблица) и решение, которое он поддерживает (не короче четырёх слов). Тщеславных показателей («просмотры страниц»,
      «число лайков», «подписчиков за всё время») в панели быть не должно. Все «…» нужно заменить. Эпоха: 8."
    checks:
      - Где-то осталось многоточие «…». Заполните HEART, North Star и панель.
      - Метрику в строке «Счастье» опишите не короче чем тремя словами.
      - Метрику в строке «Вовлечённость» опишите не короче чем тремя словами.
      - Метрику в строке «Принятие» опишите не короче чем тремя словами.
      - Метрику в строке «Удержание» опишите не короче чем тремя словами.
      - Метрику в строке «Успех задач» опишите не короче чем тремя словами.
      - В строке «Успех задач» назовите главное действие теми же словами, что в брифе.
      - В North Star назовите главное действие теми же словами, что в брифе.
      - В North Star должна быть формулировка «для кого» из брифа.
      - "В North Star нужен период: «в месяц», «в неделю» или «в день»."
      - "North Star не должен быть про посещаемость или просмотры: уберите эти слова."
      - В панели должно быть от трёх до пяти показателей.
      - Название показателя напишите не короче чем двумя словами.
      - "У каждого показателя нужен источник: Метрика, GA4, CRM, опрос, форма, таблица или почтовый сервис."
      - Решение, которое поддерживает показатель, опишите не короче чем четырьмя словами.
      - В панели остался тщеславный показатель (просмотры страниц, лайки или подписчики за всё время). Замените его.
    sources:
      - title: "Rodden, Hutchinson, Fu (Google): Measuring the user experience on a large scale (HEART)"
