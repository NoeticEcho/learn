- id: 14-metrics/03-engagement-metrics
  order: 3
  title: 'Отказы, время, прокрутка и CTR: что и как считается'
  summary: 'Зачем: не обманываться цифрами: понять, как считается отказ в Метрике (меньше 15 секунд и один просмотр, без события
    «неотказ») и как в GA4 (визит без вовлечённости), что значат время на странице и глубина прокрутки. После урока человек
    знает, какой показатель выбрать для страницы и каким цифрам не верить.'
  minutes: 20
  teaches:
  - metrics.bounce-definitions
  - metrics.time-scroll-ctr
  requires:
  - metrics.counter-setup
  - metrics.visits-events
  diagram: 'Два счётчика на одну и ту же сессию: «Метрика» и «GA4». Человек двигает бегунки (время на странице, число просмотров,
    событие) и видит, где один считает отказом, а другой нет; шкала глубины прокрутки с порогами 25/50/75/100.'
  practice: 'Эпоха 4: для одностраничного или длинного сайта (brief.sections) выбрать показатель, который заменит «отказы»
    (достижение цели, глубина прокрутки, событие «неотказ»), и записать, почему. Настроить событие «неотказ» для страницы,
    где посетитель выполняет brief.mainAction без перехода.'
  checks:
  - Назван показатель вместо «отказов» и объяснена причина.
  - Объяснено различие определений Метрики и GA4 одним предложением.
  - Для страницы с brief.mainAction задано условие, при котором визит не считается отказом.
  - Указаны пороги глубины прокрутки и страницы, где они нужны.
  sources:
  - title: 'Яндекс Директ: что такое отказы в Яндекс Метрике'
    url: https://direct.yandex.ru/base/articles/chto-takoe-otkazy-v-yandeks-metrike
    licence: proprietary-link
    kind: article
    lang: ru
  - title: 'Google Analytics: [GA4] Engagement rate and bounce rate'
    url: https://support.google.com/analytics/answer/12195621
    licence: proprietary-link
    kind: docs
    lang: en
