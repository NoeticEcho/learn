- id: 14-metrics/05-ab-tests
  order: 5
  title: A/B-тесты и их ловушки
  summary: 'Зачем: проверять изменения экспериментом и не принимать шум за эффект: размер выборки, подглядывание, множественные
    сравнения, сезонность. После урока человек планирует один тест для своей гипотезы и знает, когда лучше не тестировать
    вовсе.'
  minutes: 25
  teaches:
  - metrics.ab-tests
  requires:
  - metrics.attention-behaviour
  - metrics.conversion-basics
  diagram: 'Симулятор теста: два варианта с реальной конверсией, неизвестной человеку; он выбирает размер выборки и момент
    остановки, а ловушка «подглядывание» показывает долю ложных побед при частых остановках.'
  practice: 'Эпоха 7: взять гипотезу из первого урока и составить план A/B-теста: метрика, минимальный интересный эффект,
    ожидаемая выборка (по калькулятору), срок, что не меняем во время теста. Для малого трафика предложить вместо теста последовательные
    изменения или качественное исследование.'
  checks:
  - План содержит одну главную метрику, связанную с brief.mainAction.
  - Указаны выборка и срок до начала теста, а не «пока не станет видно».
  - Названы две ловушки и способ избежать каждой.
  - Для малого трафика предложена альтернатива.
  sources:
  - title: 'Evan Miller: How not to run an A/B test'
    url: https://www.evanmiller.org/how-not-to-run-an-ab-test.html
