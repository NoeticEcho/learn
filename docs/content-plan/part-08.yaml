- id: 08-cms/07-jamstack-deploy
  order: 7
  title: 'Jamstack: сборка, CDN и вебхук'
  definition: Jamstack — подход, при котором страницы собирают заранее и раздают через CDN, а динамику берут из API и внешних сервисов.
    Правку в CMS подхватывает вебхук.
  summary: Вы настроите на бумаге схему «правка в CMS, вебхук, сборка, выкладка на CDN» для своего сайта, поймёте, что в такой схеме
    быстро и безопасно, а что требует отдельных сервисов (формы, поиск, оплата, личный кабинет). Это эпоха 6 (2022). Про CDN здесь коротко,
    подробно в части 9.
  minutes: 20
  teaches:
  - cms.jamstack
  - cms.build-webhook-rebuild
  requires:
  - cms.headless
  - cms.static-site-generator
  diagram: 'ReleasePipeline: «Путь правки до посетителя» (part 8, lesson 7). Editor presses «Опубликовать»; a webhook starts a build,
    the build is uploaded, the CDN''s cache is refreshed. The person steps through, can break any stage and see what a visitor still
    sees (the old version, because a deploy is switched all at once and a failed build leaves the old site alone), can roll back, and
    moves a slider for the number of pages to see how build time grows. All numbers are a model, not a measurement.'
  practice: 'Опишите, как правка содержания попадает на сайт вашего проекта. 1) В таблице для четырёх шагов (источник содержания, сборка,
    выкладка, раздача) впишите, что происходит и где или кем это делается. Упомяните вебхук там, где сборку запускает правка. 2) Скажите,
    какой внешний сервис или функция обслуживает главное действие посетителя (форма, запись, оплата), если у сайта нет своего серверного
    кода. 3) Скажите, где лягут персональные данные посетителей и что нужно для хранения в России. 4) Назовите способ откатить неудачную
    публикацию. Все «…» нужно заменить. Эпоха: 6.'
  checks:
  - Блок со схемой исчез. Он был в странице, верните его.
  - Где-то осталось многоточие «…». Замените его своим текстом.
  - В таблице должны остаться четыре шага.
  - В колонке «Что происходит» опишите шаг хотя бы четырьмя-пятью словами.
  - 'Нигде не упомянут вебхук: он запускает сборку после правки в CMS.'
  - 'Для раздачи напишите, где она идёт: CDN или хостинг статических сайтов.'
  - Скажите, какой внешний сервис или функция обслуживает главное действие посетителя.
  - Скажите, где лягут персональные данные и что нужно для хранения в России.
  - 'Назовите способ отката: например, переключиться на предыдущую собранную версию.'
  sources:
