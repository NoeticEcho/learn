- id: 08-cms/07-jamstack-deploy
  order: 7
  title: 'Jamstack: сборка, CDN и вебхук'
  summary: 'Зачем: вы настроите схему «правка в CMS → вебхук → сборка → выкладка на CDN» для своего сайта, поймёте, что в
    такой схеме быстро и безопасно, а что требует отдельных сервисов (формы, поиск, оплата, личный кабинет) — эпоха 6 (2022).
    (CDN здесь — коротко; подробно — в части 9.)'
  minutes: 20
  teaches:
  - cms.jamstack
  - cms.build-webhook-rebuild
  requires:
  - cms.headless
  - cms.static-site-generator
  diagram: 'Живая схема релиза: нажимаешь «Опубликовать» в админке — пакет путешествует по цепочке (вебхук, сборка, загрузка
    на CDN, сброс кэша), на каждом этапе его можно «сломать» и увидеть, что видит посетитель. Ползунок — размер сайта и время
    сборки.'
  practice: 'Эпоха 6 (2022). Человек строит схему выкладки для своего проекта: откуда берётся контент, кто запускает сборку,
    куда уходит готовый сайт; подключает внешний сервис для главного действия посетителя (brief.mainAction — форма, запись,
    оплата) и отмечает, куда попадут персональные данные.'
  checks:
  - 'В схеме названы четыре шага: источник контента, сборка, выкладка, раздача.'
  - Главное действие посетителя (brief.mainAction) реализовано через внешний сервис или функцию, а не через серверный код
    сайта.
  - Указано, где лежат персональные данные посетителей и что нужно для хранения в России.
  - Назван способ откатить неудачную публикацию.
  sources:
