    licence: proprietary-link
    kind: course
    lang: ru
  - title: 'HTTP Archive Web Almanac 2024: CMS'
    url: https://almanac.httparchive.org/en/2024/cms
    licence: CC-BY-SA
    kind: article
    lang: en
  videos: []
- id: 08-cms/05-static-generators
  order: 5
  title: Генераторы статических сайтов и Markdown
  summary: 'Зачем: вы напишете страницы в Markdown с front matter, увидите, как генератор превращает их и шаблон в обычный
    HTML, и сможете выбрать между Jekyll, Hugo, Eleventy, Astro и SvelteKit по задаче — это эпоха 5 (2019) вашего сайта.'
  minutes: 25
  teaches:
  - cms.markdown-frontmatter
  - cms.static-site-generator
  - cms.ssg-landscape
  requires:
  - cms.what-is-cms
  - html.semantic-elements
  - css.responsive
  - net.http-request-response
  diagram: 'Конвейер сборки: слева файл Markdown с front matter, в середине шаблон и «ручки» (layout, коллекция), справа готовый
    HTML. Правится любая строка — страница пересобирается в панели рядом; переключатель имитирует Jekyll / Eleventy / Astro
    (одни входные данные, разные шаблоны).'
  practice: 'Эпоха 5 (2019). Человек переносит содержимое своего brief в проект генератора в песочнице: по одной странице
    Markdown на каждую секцию из brief.sections, коллекция из brief.items (услуги, товары, люди), общий шаблон с шапкой и
    подвалом, язык по brief.languages.'
  checks:
  - Для каждой секции из brief.sections есть Markdown-файл с заголовком и описанием в front matter.
  - Элементы из brief.items лежат в коллекции и выводятся списком через шаблон, а не вставлены вручную.
  - Шапка и подвал заданы в одном месте и общие для всех страниц.
  - Собранный HTML содержит атрибут lang, соответствующий brief.languages.
  sources:
