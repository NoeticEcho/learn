# Regenerated from the written lessons (28.10.2026). Changes against the draft:
# - Lesson 2's practice is a WordPress-2010-style theme (floats, a sidebar, a grey page) that the learner completes, so the era-3 site looks like its era.
# - Lesson 5's practice is a working miniature generator in the sandbox (`content/diagrams/ssgmini.ts`): Markdown with front matter, a Liquid-style template
#   and a collection, rebuilt on every edit. The template's double braces carry harmless Liquid filters (`{{ site.title | escape }}`) because the practice
#   editor substitutes values into plain `{{ x }}`; the lesson says so.
# - Lesson 6's practice is a content type, entries as JSON and a `fetch` against a pretend API (the sandbox allows no network), not a Decap-like admin.
# - The draft's video for lesson 6 (a talk on Jamstack) moved to lesson 7, where Jamstack is taught.
# - Lesson 6 requires `server.rest` and `js.fetch`; lesson 1 requires `data.relational-model`, so part 8 follows part 7.
# - The claim «half of Russian landing pages are on Tilda» is not in the lessons: nothing in the sources supports a share.
