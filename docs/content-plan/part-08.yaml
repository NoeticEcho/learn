- id: 08-cms/05-static-generators
  order: 5
  title: Генераторы статических сайтов и Markdown
  definition: Генератор статических сайтов — программа, которая при сборке превращает файлы Markdown, данные и общий шаблон в готовые
    HTML-файлы; на сервер кладут только их.
  summary: 'Вы напишете страницы в Markdown с front matter, увидите, как генератор превращает их и шаблон в обычный HTML, и сможете
    выбрать между Jekyll, Hugo, Eleventy, Astro и SvelteKit по задаче. Это эпоха 5 (2019) вашего сайта: страницы по разделам, коллекция
    из ваших услуг и один общий шаблон.'
  minutes: 25
  teaches:
  - cms.markdown-frontmatter
  - cms.static-site-generator
  - cms.ssg-landscape
  requires:
  - cms.what-is-cms
  - html.semantic-elements
  - css.responsive
  - net.http-request-response
  diagram: 'SsgPipeline: «Конвейер генератора» (part 8, lesson 5). A Markdown page with front matter, a layout and the person''s own
    services (the data) go through a teaching generator (`ssgmini.ts`, not Jekyll or Hugo) and come out as HTML, rebuilt on every edit.
    The person can switch the layout, change the Markdown, and see the same loop written the way five real tools write it. Prices are
    invented.'
  practice: 'В странице проект маленького генератора: настройки, общий шаблон, по странице Markdown на каждый раздел вашего брифа, страница
    каталога и коллекция услуг. 1) В site.yml впишите язык сайта (lang: ru) и языки (languages: …, как в брифе). 2) В layout.html: lang
    возьмите из настроек ({{ site.lang | escape }}), добавьте шапку (header) с меню из списка страниц ({% for p in pages %} … {% endfor
    %}) и подвал (footer); {{ content | strip }} оставьте. 3) В файле каждого раздела допишите в front matter description и напишите
    текст. 4) В catalog.md выведите услуги циклом по коллекции: {% for item in items %}- **{{ item.title | escape }}**, {{ item.price
    | escape }} {% endfor %}. Проверки читают файлы проекта; внизу вы видите собранный HTML. Двойные скобки в шаблоне дополнены фильтрами,
    потому что редактор курса сам подставляет значения в простые скобки. Все «…» нужно заменить. Эпоха: 5.'
  checks:
  - Блок проекта исчез. Он был в странице, верните его.
  - Где-то осталось многоточие «…». Замените его своим текстом.
  - 'В site.yml нужна строка lang: ru (или en).'
  - 'В site.yml нужна строка languages: со списком языков, например languages: ru.'
  - 'У проекта два языка, а в languages нет en. Напишите languages: ru, en.'
  - Нужно по файлу Markdown на каждый раздел брифа. Не удаляйте поля.
  - Заголовки страниц должны совпадать с названиями разделов из брифа.
  - 'В начале файла страницы нужен front matter: между строками «---» строка title: Название.'
  - 'В front matter нужна строка description: с коротким описанием страницы.'
  - 'В шаблоне нет места для содержания страницы: {{ content | strip }}.'
  - 'В шаблоне должны быть шапка header и подвал footer: они одинаковы для всех страниц.'
  - 'Меню должно строиться циклом по страницам: {% for p in pages %} … {% endfor %}.'
  - 'Язык страницы берите из настроек: <html lang="{{ site.lang | escape }}">.'
  - 'Список услуг должен выводиться циклом по коллекции, а не вписываться вручную: {% for item in items %}.'
