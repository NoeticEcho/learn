lessons:
- id: 08-cms/01-what-is-cms
  order: 1
  title: Что такое CMS и зачем она нужна
  summary: 'Зачем: после урока вы объясните, чем сайт на HTML-файлах отличается от сайта на CMS, назовёте три слоя (контент,
    шаблон, код) и опишете модель контента своего проекта — какие бывают «сущности» (услуга, статья, человек, отзыв) и какие
    у них поля.'
  minutes: 15
  teaches:
  - cms.what-is-cms
  - cms.content-model
  requires:
  - server.static-vs-dynamic
  - data.relational-model
  - start.project-brief
  diagram: 'Три слоя сайта: ползунок «кто правит» (разработчик / редактор / клиент) двигает контент, шаблон и код между «файлы
    на диске» и «база + админка»; рядом показывается, где лежит каждая правка.'
  practice: 'Эпоха 3 (2010). Из поля brief «items» (услуги, товары, люди, доказательства) и «sections» человек строит таблицу
    модели контента: тип → поля → кто и как часто правит. Для проекта без услуг (портфолио, мероприятие) предлагаются типы
    по умолчанию для этого вида проекта.'
  checks:
  - Каждый пункт из brief.items отнесён к типу контента с названием и списком полей.
  - У каждого типа указано, кто его правит (владелец, редактор, разработчик).
  - Для каждой секции из brief.sections указано, какие типы контента она выводит.
  - Есть хотя бы одно поле, повторяющееся на нескольких языках, если в brief.languages больше одного языка.
  sources:
  - title: 'MDN: Glossary — CMS'
    url: https://developer.mozilla.org/en-US/docs/Glossary/CMS
    licence: CC-BY-SA
    kind: docs
    lang: en
  - title: 'Википедия: Система управления содержимым'
    url: https://ru.wikipedia.org/wiki/Система_управления_содержимым
    licence: CC-BY-SA
    kind: article
    lang: ru
  - title: 'HTTP Archive Web Almanac 2024: CMS'
    url: https://almanac.httparchive.org/en/2024/cms
    licence: CC-BY-SA
    kind: article
    lang: en
  videos: []
- id: 08-cms/02-wordpress
  order: 2
  title: 'WordPress: тема, плагины и эпоха 2010 года'
  summary: 'Зачем: вы разберёте, как устроен WordPress — записи и страницы, тема, плагины, меню, — и соберёте на бумаге (а
    в редакторе приложения в песочнице) сайт эпохи 2010 года для своего проекта, понимая, что именно тема решает, а что плагин.'
  minutes: 20
  teaches:
  - cms.wordpress-themes-plugins
  requires:
  - cms.what-is-cms
  - cms.content-model
  - html.semantic-elements
  - css.box-model
  diagram: 'Схема страницы WordPress: щёлкаешь по областям (шапка, цикл записей, боковая колонка, подвал) и видишь, какой
    файл темы за них отвечает (header.php, index.php, sidebar.php, footer.php) и какой плагин может вмешаться.'
  practice: 'Эпоха 3 (2010). Человек выбирает в песочнице стартовую тему-шаблон и раскладывает материалы из brief: что станет
    страницей, что записью, что пунктом меню (из brief.sections), какие плагины нужны (форма из brief.mainAction, SEO, кэш)
    — и зачем каждый.'
  checks:
  - Каждая секция из brief.sections стала страницей или рубрикой, есть меню, в котором она видна.
  - Для главного действия посетителя (brief.mainAction) выбран плагин или блок, и он выведен на главной.
  - Список плагинов короткий (не больше пяти) и для каждого записана причина.
  - Тон из brief.tone отражён в заголовке сайта и слогане.
  sources:
  - title: 'WordPress Developer Resources: Theme Handbook — Getting Started'
    url: https://developer.wordpress.org/themes/getting-started/
    licence: proprietary-link
    kind: docs
    lang: en
  - title: WordPress.org Documentation
    url: https://wordpress.org/documentation/
    licence: proprietary-link
    kind: docs
    lang: en
  - title: 'HTTP Archive Web Almanac 2024: CMS (доля WordPress)'
    url: https://almanac.httparchive.org/en/2024/cms
    licence: CC-BY-SA
    kind: article
    lang: en
  videos: []
- id: 08-cms/03-wordpress-upkeep
  order: 3
  title: Что ломается у WordPress и сколько он на самом деле стоит
  summary: 'Зачем: вы научитесь честно считать цену владения CMS — обновления, взломы, зависимость от плагинов, хостинг —
    и сможете сказать, когда WordPress уместен, а когда он станет обузой. Это страница «что было не так» для эпохи 3.'
  minutes: 15
  teaches:
  - cms.wordpress-maintenance
  - cms.cms-history
  requires:
  - cms.wordpress-themes-plugins
  diagram: 'Лента «год жизни сайта на WordPress»: ползунок времени показывает выход обновлений ядра, уязвимости плагинов и
    прогрессирующую потерю совместимости темы; кнопка «обновить» чинит одно и ломает другое.'
  practice: 'Эпоха 3 (2010). Человек составляет план обслуживания для своего проекта: кто обновляет, как часто, что копируется
    (связка с резервным копированием из части 9), сколько времени в месяц это займёт при его brief.items и brief.mainAction.
    Сравнивает с Drupal и Joomla по тому же плану в одной таблице.'
  checks:
  - В плане есть ответственный человек и периодичность обновлений.
  - Указано, что делается резервная копия и где она хранится.
  - Названы минимум два риска, связанных с плагинами нужного brief.mainAction.
  - 'В таблице сравнения для проекта есть вывод: оставить WordPress, взять другое или отказаться от CMS.'
  sources:
  - title: 'WordPress Advanced Administration: Hardening WordPress'
    url: https://developer.wordpress.org/advanced-administration/security/hardening/
    licence: proprietary-link
    kind: docs
    lang: en
  - title: 'Drupal.org: About Drupal'
    url: https://www.drupal.org/about
    licence: proprietary-link
    kind: docs
    lang: en
  - title: 'Joomla!: About Joomla'
    url: https://www.joomla.org/about-joomla.html
    licence: proprietary-link
    kind: docs
    lang: en
  - title: 'HTTP Archive Web Almanac 2024: CMS'
    url: https://almanac.httparchive.org/en/2024/cms
    licence: CC-BY-SA
    kind: article
    lang: en
  videos: []
- id: 08-cms/04-tilda-bitrix
  order: 4
  title: 'Tilda и 1С-Битрикс: российский рынок сайтов'
  summary: 'Зачем: вы поймёте, почему в России половина лендингов живёт на Tilda, а магазины и корпоративные порталы — на
    «1С-Битрикс», чем это отличается от WordPress, и сможете решить, что подходит вашему проекту по бюджету, поддержке и интеграциям
    (оплата, 1С, CRM, Метрика).'
  minutes: 20
  teaches:
  - cms.tilda
  - cms.bitrix
  requires:
  - cms.what-is-cms
  - cms.content-model
  - html.forms
  diagram: 'Сравнение «три пути»: Tilda / Битрикс / WordPress. Бегунки «бюджет», «нужна интеграция с 1С», «кто правит», «нужен
    магазин» подсвечивают подходящее; под каждым — типичные ограничения (экспорт кода, лицензия, хостинг).'
  practice: 'Эпоха 3 (2010, как современная альтернатива WordPress). Человек собирает таблицу решения для своего проекта:
    по brief.items (товары или услуги), brief.mainAction (оплата, заявка, запись) и brief.languages выбирает Tilda, Битрикс
    или WordPress, указывает, где будет жить форма заявки и куда пойдут персональные данные (связка с 152-ФЗ).'
  checks:
  - Выбор платформы обоснован двумя полями brief (например, items и mainAction), а не вкусом.
  - Указано, где хранятся данные заявок и какую страницу согласия на обработку персональных данных нужно вывести.
  - 'Названа стоимость владения за год: платформа, хостинг, домен, поддержка.'
  - 'Описан способ выйти с платформы: что можно экспортировать.'
  sources:
  - title: Tilda Education
    url: https://tilda.education/
    licence: proprietary-link
    kind: course
    lang: ru
  - title: 'Tilda: справочный центр'
    url: https://help-ru.tilda.cc/
