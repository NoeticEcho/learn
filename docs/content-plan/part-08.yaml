- id: 08-cms/08-choosing
  order: 8
  title: 'Как выбрать: дерево решений для вашего проекта'
  summary: 'Зачем: вы получите рабочий метод выбора между конструктором, WordPress, Битрикс, генератором и headless — по пяти
    вопросам про ваш brief — и защитите выбор перед заказчиком или самим собой; выбранное сохранится как основа для следующих
    частей.'
  minutes: 15
  teaches:
  - cms.choosing-stack
  requires:
  - cms.wordpress-maintenance
  - cms.tilda
  - cms.bitrix
  - cms.ssg-landscape
  - cms.jamstack
  diagram: 'Интерактивное дерево решений: пять вопросов (кто правит, как часто, нужен ли магазин или личный кабинет, бюджет,
    языки) — ответы подсвечивают путь к рекомендации; можно сравнить свой путь с путями других шаблонных проектов (портфолио,
    кафе, SaaS).'
  practice: 'Эпоха 6 (2022) с взглядом назад. Человек заполняет карточку решения: проект, редактор, частота правок, главное
    действие (brief.mainAction), языки, бюджет → выбранный стек и два отвергнутых варианта с причинами; карточка сохраняется
    в галерее рядом с версиями эпох 3, 5 и 6.'
  checks:
  - В карточке названы редактор контента и частота правок, и выбор согласован с ними.
  - Для brief.mainAction указано, что именно его обслуживает.
  - Два отвергнутых варианта имеют причины, не совпадающие друг с другом.
  - Учтено число языков из brief.languages и способ их хранения.
  - Есть строка «когда пересмотрю решение» — условие, при котором выбор поменяется.
  sources:
  - title: 'HTTP Archive Web Almanac 2024: CMS'
    url: https://almanac.httparchive.org/en/2024/cms
    licence: CC-BY-SA
    kind: article
    lang: en
  - title: Jamstack.org
    url: https://jamstack.org/
    licence: proprietary-link
    kind: article
    lang: en
