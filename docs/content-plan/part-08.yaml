- id: 08-cms/06-headless
  order: 6
  title: 'Headless CMS: когда контент отделён от сайта'
  summary: 'Зачем: вы поймёте, почему «безголовая» CMS даёт редактору удобную админку, а разработчику — свободу выбирать сайт,
    и сможете сравнить Strapi, Directus, Sanity, Contentful и Decap по модели размещения (свой сервер, облако, Git) и цене.'
  minutes: 20
  teaches:
  - cms.headless
  - cms.headless-landscape
  requires:
  - cms.content-model
  - cms.static-site-generator
  - server.rest
  - js.fetch
  diagram: 'Три колонки «где хранится»: файлы в Git (Decap), база на своём сервере (Strapi, Directus), облако (Sanity, Contentful).
    Редактор вносит правку — стрелки показывают путь контента к API, к сборщику и к сайту.'
  practice: 'Эпоха 6 (2022). Человек переносит модель контента из урока 1 в headless-CMS (в песочнице — упрощённая админка
    на Decap-подобной схеме): создаёт типы из brief.items, вносит по одному примеру и получает JSON; затем пишет запрос на
    выборку для страницы секции из brief.sections.'
  checks:
  - Для каждого типа из brief.items описаны поля, и в JSON они видны под теми же именами.
  - Поля для языков из brief.languages заданы отдельно либо как перевод одного элемента.
  - Страница секции получает данные запросом (fetch или при сборке), а не копирует текст.
  - Выбран вариант размещения (Git, свой сервер или облако) с короткой причиной, привязанной к бюджету и данным проекта.
  sources:
