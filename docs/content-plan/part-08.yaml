lessons:
- id: 08-cms/01-what-is-cms
  order: 1
  title: Что такое CMS и зачем она нужна
  definition: 'CMS (система управления содержимым) — программа, в которой содержание сайта правят без знания HTML: админка, хранилище,
    шаблоны, роли и публикация.'
  summary: 'Вы объясните, чем сайт на HTML-файлах отличается от сайта на CMS, назовёте три слоя (содержание, шаблон, код) и опишете
    модель контента своего проекта: какие бывают «сущности» (услуга, статья, человек, отзыв) и какие у них поля. После урока у вас есть
    таблица типов содержания с редакторами и частотой правок.'
  minutes: 15
  teaches:
  - cms.what-is-cms
  - cms.content-model
  requires:
  - server.static-vs-dynamic
  - data.relational-model
  - start.project-brief
  diagram: 'ThreeLayers: «Три слоя сайта» (part 8, lesson 1). Content, template and code, and where each lives at three stages: HTML
    files, a CMS with pages, a CMS with a content model. The person moves a slider and sees where each layer lives, who can change it,
    and what changing one service''s price takes. The service is the first item of the person''s own brief; everything else is the lesson''s
    explanation.'
  practice: 'Заполните таблицу типов содержания. Первая строка (услуги или товары из items) почти готова: допишите, кто их правит и
    как часто. В остальных строках впишите: люди (people), подтверждения (proofs) и страницы-разделы. Для каждого: название типа, поля
    через запятую, кто правит (владелец, редактор или разработчик) и как часто (например, «раз в месяц»). Если в вашем проекте нет людей
    или подтверждений, замените строку своим типом (например, «Отзыв», «Событие»). Во второй таблице для каждого раздела вашего сайта
    впишите, какие типы он выводит. Если у сайта несколько языков, поля с текстами сделайте на каждом языке (например, title_ru и title_en).
    Все «…» нужно заменить. Эпоха: 3.'
  checks:
  - Блок с моделью исчез. Он был в странице, верните его.
  - Где-то осталось многоточие «…». Замените его своим текстом.
  - В таблице должно быть не меньше четырёх типов (четыре строки).
  - 'Поля пишите через запятую: например, title, text, price.'
  - 'В колонке «Кто правит» напишите: владелец, редактор или разработчик.'
  - 'В колонке «Как часто» напишите частоту: например, «раз в месяц».'
  - Во второй таблице нужна строка на каждый раздел вашего сайта. Не удаляйте их.
  - Названия разделов в таблице должны совпадать с брифом.
  - У сайта несколько языков, а полей на каждый язык нет. Сделайте title_ru и title_en или напишите «перевод записи».
  sources:
  - title: 'MDN: Глоссарий, CMS'
    url: https://developer.mozilla.org/en-US/docs/Glossary/CMS
    licence: CC-BY-SA
    kind: docs
    lang: en
