- id: 08-cms/06-headless
  order: 6
  title: 'Headless CMS: когда контент отделён от сайта'
  definition: 'Headless CMS — система управления содержимым без собственного сайта: редактор правит записи в админке, а сайт и приложения
    получают их по API.'
  summary: Вы поймёте, почему «безголовая» CMS даёт редактору удобную админку, а разработчику свободу выбрать сайт, и сравните Strapi,
    Directus, Sanity, Contentful и Decap по месту хранения (Git, свой сервер, облако) и цене. После урока вы описываете тип содержания,
    вносите записи и получаете их запросом, как это делает настоящий сайт.
  minutes: 20
  teaches:
  - cms.headless
  - cms.headless-landscape
  requires:
  - cms.content-model
  - cms.static-site-generator
  - server.rest
  - js.fetch
  diagram: 'HeadlessPaths: «Где живёт headless-CMS» (part 8, lesson 6). Three columns: content as files in Git (Decap), a database on
    your own server (Strapi, Directus), a cloud service (Sanity, Contentful). The person picks one and presses «Редактор сохраняет правку»;
    the path of the change (editor, store, API or build, site) lights up step by step, with what each choice means for the data and
    the money. The service names are real; the judgements are the lesson''s, and prices are not stated.'
  practice: 'Страница получает услуги не из HTML, а запросом к «API» (имитация, потому что песочница не пускает в сеть). 1) В поле «Тип
    содержания» впишите тип поля price и добавьте текстовые поля для второго языка, если у проекта их два (title_en, text_en). 2) В
    поле «Записи» уже лежат ваши услуги из брифа; добавьте ещё одну запись вместо «…» (для двух языков с полями title_en и text_en).
    3) В скрипте headless-code допишите функцию load: запросите fetch(''/api/items''), прочитайте ответ как JSON и для каждой записи
    создайте карточку (article с классом card, внутри h3 и p), положите карточки в .cards. 4) Скажите, где живёт CMS (Git, свой сервер
    или облако) и почему: привяжите к бюджету и данным проекта. Проверки читают поля и текст скрипта. Все «…» нужно заменить. Эпоха:
    6.'
  checks:
  - Блок с типом и записями исчез. Он был в странице, верните его.
  - Где-то осталось многоточие «…». Замените его своим текстом.
  - 'В типе нет строки "type": "items". Не удаляйте её.'
  - 'В типе должны быть поля title, text и price: они совпадают с полями услуги в брифе.'
  - 'У проекта несколько языков. Добавьте в тип поля для второго языка: title_en, text_en.'
  - 'В записях поля должны называться так же, как в типе: title, text, price.'
  - 'В записях нет названий ваших услуг. Они подставляются из брифа: не удаляйте их.'
  - 'Нужна хотя бы одна запись с настоящим названием: впишите её вместо «…».'
  - 'Нужна ещё одна запись помимо услуг из брифа: впишите свою вместо строки с «…».'
  - 'В записях нет полей второго языка: добавьте в новую запись title_en и text_en.'
  - В скрипте нет запроса fetch('/api/items').
  - 'Ответ нужно прочитать как JSON: await response.json().'
  - 'Не видно, где карточки создаются: используйте createElement и append или replaceChildren.'
  - 'Назовите вариант размещения: файлы в Git, свой сервер или облако.'
  - 'Объясните выбор в нескольких словах: через бюджет, число редакторов, данные проекта.'
  sources:
  - title: Strapi Docs
    url: https://docs.strapi.io/
    licence: proprietary-link
    kind: docs
    lang: en
  - title: Directus Docs
    url: https://directus.io/docs
    licence: proprietary-link
    kind: docs
    lang: en
  - title: Sanity Docs
    url: https://www.sanity.io/docs
    licence: proprietary-link
    kind: docs
    lang: en
  - title: 'Decap CMS Docs: Intro'
    url: https://decapcms.org/docs/intro/
    licence: proprietary-link
    kind: docs
    lang: en
  - title: Headless content management system (Wikipedia)
    url: https://en.wikipedia.org/wiki/Headless_content_management_system
    licence: CC-BY-SA
    kind: article
    lang: en
