- id: 08-cms/02-wordpress
  order: 2
  title: 'WordPress: тема, плагины и эпоха 2010 года'
  definition: WordPress — открытая CMS на PHP и MySQL. Тема решает, как сайт выглядит, плагины — что он умеет; с версии 3.0 (2010) на
    нём собирают любые сайты.
  summary: 'Вы разберёте, как устроен WordPress: записи и страницы, тема, плагины, меню. И соберёте в песочнице сайт эпохи 2010 года
    для своего проекта, понимая, что именно решает тема, а что плагин.'
  minutes: 20
  teaches:
  - cms.wordpress-themes-plugins
  requires:
  - cms.what-is-cms
  - cms.content-model
  - html.semantic-elements
  - css.box-model
  diagram: 'WpAnatomy: «Страница WordPress изнутри» (part 8, lesson 2). A schematic page of a classic theme. The person picks an area
    (header, menu, loop, sidebar, footer) and sees which theme file draws it, what the editor changes there, and what a plugin can do
    through hooks. The site''s name and the first section titles come from the person''s brief.'
  practice: 'Перед вами тема в духе WordPress 2010 года. 1) Слоган сайта (в шапке) сейчас «…»: напишите его. 2) Постройте меню: в списке
    меню только «Главная»; добавьте по пункту на каждый раздел вашего брифа. 3) На главной над списком записей добавьте кнопку главного
    действия: ссылка с классом button и текстом из брифа. 4) В плане под страницей для каждого раздела скажите, станет он страницей
    или рубрикой и есть ли он в меню. 5) Перечислите плагины: не меньше двух и не больше пяти, у каждого название и причина. 6) Скажите,
    какой плагин обслуживает главное действие и где он выведен. 7) Скажите, как тон проекта отражён в названии и слогане. Все «…» нужно
    заменить. Эпоха: 3.'
  checks:
  - Блок с планом исчез. Он был в странице, верните его.
  - Где-то осталось многоточие «…». Замените его своим текстом.
  - Слоган сайта в шапке пока пустой. Напишите короткую фразу вместо «…».
  - В меню нет всех разделов брифа. Добавьте li со ссылкой на каждый.
  - На главной нет кнопки главного действия. Добавьте в content ссылку с классом button и текстом действия.
  - В плане должна быть строка на каждый раздел. Не удаляйте строки.
  - 'Для каждого раздела напишите: страница или рубрика.'
  - В колонке «Есть в меню?» напишите «да» или «нет».
  - Плагинов должно быть не меньше двух и не больше пяти.
  - У каждого плагина запишите причину хотя бы в несколько слов.
  - Скажите, какой плагин или блок обслуживает главное действие.
  - 'Скажите, где выведено главное действие: например, на главной странице.'
  - Опишите в нескольких словах, как тон проекта отражён в названии и слогане.
  sources:
  - title: 'WordPress Developer Resources: Theme Handbook, Getting Started'
    url: https://developer.wordpress.org/themes/getting-started/
    licence: proprietary-link
    kind: docs
    lang: en
  - title: 'WordPress: Template Hierarchy'
    url: https://developer.wordpress.org/themes/basics/template-hierarchy/
    licence: proprietary-link
    kind: docs
    lang: en
  - title: 'WordPress Plugin Handbook: Hooks'
    url: https://developer.wordpress.org/plugins/hooks/
    licence: proprietary-link
    kind: docs
    lang: en
  - title: 'WordPress.org: History'
    url: https://wordpress.org/about/history/
    licence: proprietary-link
    kind: article
    lang: en
  - title: 'HTTP Archive Web Almanac 2024: CMS'
    url: https://almanac.httparchive.org/en/2024/cms
    licence: CC-BY-SA
    kind: article
    lang: en
  videos: []
- id: 08-cms/03-wordpress-upkeep
  order: 3
  title: Что ломается у WordPress и сколько он на самом деле стоит
  definition: 'Цена владения CMS — всё, что сайт стоит после установки: хостинг, платные темы и плагины, обновления, резервные копии,
    защита от взлома и починка.'
  summary: Вы научитесь честно считать цену владения CMS (обновления, взломы, зависимость от плагинов, хостинг) и сможете сказать, когда
    WordPress уместен, а когда станет обузой. Это страница «что было не так» для эпохи 3, и вы составите план обслуживания своего сайта.
  minutes: 15
  teaches:
  - cms.wordpress-maintenance
  - cms.cms-history
  requires:
  - cms.wordpress-themes-plugins
  diagram: 'WpYear: «Год жизни сайта на WordPress» (part 8, lesson 3). Seven things that typically happen over a year (an update, a
    plugin vulnerability, a big release, a conflict, an abandoned plugin, an old PHP, a spam wave), and what each costs under the settings
    the person chooses: automatic updates, backups, number of plugins. A model with invented hours, to show the shape of the cost, not
    to price it.'
  practice: 'Составьте план обслуживания сайта вашего проекта на CMS. 1) В таблице для каждой из четырёх задач впишите, кто делает (конкретный
    человек или роль), как часто и сколько часов в месяц это займёт (число). 2) Впишите общее число часов в месяц. 3) Опишите резервную
    копию: что копируется, где хранится и как проверяется. 4) Назовите не меньше двух рисков плагина, который обслуживает главное действие
    вашего проекта (форма, запись, оплата). 5) В таблице сравнения для WordPress, Drupal и Joomla впишите, как у них с обновлениями
    и подходят ли они вам. 6) В выводе скажите: оставить WordPress, взять другое или отказаться от CMS. Все «…» нужно заменить. Эпоха:
    3.'
  checks:
  - Блок с планом исчез. Он был в странице, верните его.
  - Где-то осталось многоточие «…». Замените его своим текстом.
  - 'В колонке «Кто делает» должен быть человек или роль: владелец, подрядчик, редактор.'
  - 'В колонке «Как часто» напишите частоту: например, «раз в неделю».'
  - 'В колонке «Часов в месяц» нужно число: например, 0.5.'
  - В строке с общим числом часов нужно число.
  - 'Опишите копию: что копируется и где хранится.'
  - Нужно не меньше двух рисков, каждый в своём пункте списка.
  - 'Риски должны быть про плагины: упомяните слово «плагин» и что с ним может случиться.'
  - 'В таблице сравнения должны остаться три строки: WordPress, Drupal и Joomla.'
  - 'В выводе скажите: оставить WordPress, взять другое или отказаться от CMS, и почему.'
  sources:
  - title: 'WordPress Advanced Administration: Hardening WordPress'
    url: https://developer.wordpress.org/advanced-administration/security/hardening/
    licence: proprietary-link
    kind: docs
    lang: en
