- id: 08-cms/04-tilda-bitrix
  order: 4
  title: 'Tilda и 1С-Битрикс: российский рынок сайтов'
  definition: 'Tilda — конструктор: страницу складывают из готовых блоков, сайт живёт на платформе. «1С-Битрикс» — платная CMS, связанная
    с учётной системой «1С».'
  summary: Вы поймёте, зачем в России нужны конструкторы вроде Tilda и системы вроде «1С-Битрикс», чем они отличаются от WordPress,
    и решите, что подходит вашему проекту по бюджету, поддержке и интеграциям (оплата, 1С, CRM, Метрика). После урока у вас есть обоснованный
    выбор с оценкой стоимости и путём выхода.
  minutes: 20
  teaches:
  - cms.tilda
  - cms.bitrix
  requires:
  - cms.what-is-cms
  - cms.content-model
  - html.forms
  diagram: 'ThreeWays: «Три пути: Tilda, Битрикс, WordPress» (part 8, lesson 4). Four questions about the person''s project (budget,
    1С, who edits, a shop) and the typical limits of each path. A few simple rules add points to each path and show their reasons; the
    rules are the lesson''s simplification, not a benchmark, and the answer is a starting point for a conversation, not a verdict.'
  practice: 'Заполните таблицу решения. 1) Для каждой из трёх платформ (Tilda, 1С-Битрикс, WordPress) напишите, подходит ли она вашему
    проекту (да, нет или условно), и почему. 2) Назовите выбор. 3) Обоснуйте его двумя полями брифа: напишите в обосновании название
    главного действия (в кавычках, как в брифе) и, если у проекта есть услуги или товары, хотя бы одно название. 4) Скажите, где будут
    храниться заявки и данные посетителей. 5) Скажите, какая страница нужна рядом с формой из-за персональных данных. 6) В таблице стоимости
    впишите числа в рублях за год по четырём статьям. 7) Опишите, как вы сможете уйти с платформы и что получится вынести. Все «…» нужно
    заменить. Эпоха: 3.'
  checks:
  - Блок с решением исчез. Он был в странице, верните его.
  - Где-то осталось многоточие «…». Замените его своим текстом.
  - В таблице должны быть три платформы. Не удаляйте строки.
  - В колонке «Подходит?» начинайте со слов «да», «нет» или «условно».
  - 'Назовите выбор: Tilda, 1С-Битрикс или WordPress.'
  - В обосновании нет главного действия вашего проекта. Впишите его название, как в брифе.
  - В обосновании нет ни одной вашей услуги или товара. Назовите хотя бы одну.
  - 'Опишите подробнее, где хранятся заявки: на серверах платформы, на вашем хостинге, в почте.'
  - 'Скажите, какая страница нужна: политика обработки персональных данных и согласие рядом с формой.'
  - В таблице стоимости должны остаться четыре строки.
  - В колонке «Сумма в год» должны быть только числа, например 12000.
  - Опишите, что можно вынести с платформы (код, тексты, картинки) и что придётся делать заново.
  sources:
