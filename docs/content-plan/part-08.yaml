- id: 08-cms/08-choosing
  order: 8
  title: 'Как выбрать: дерево решений для вашего проекта'
  definition: 'Выбор CMS или генератора сайта начинается с пяти вопросов: кто правит, как часто, что нужно кроме страниц, бюджет и языки.
    Свою CMS пишут последней.'
  summary: 'Вы получите рабочий метод выбора между конструктором, WordPress, «Битрикс», генератором и headless по пяти вопросам про
    ваш бриф, и защитите выбор перед заказчиком или самим собой. После урока у вас есть карточка решения: выбор, два отвергнутых варианта
    с причинами и условие пересмотра. Заодно вы узнаете, когда не надо делать свою CMS.'
  minutes: 15
  teaches:
  - cms.choosing-stack
  requires:
  - cms.wordpress-maintenance
  - cms.tilda
  - cms.bitrix
  - cms.ssg-landscape
  - cms.jamstack
  diagram: 'StackTree: «Дерево выбора» (part 8, lesson 8). Five questions about a project (who edits, how often, what besides pages,
    budget, languages) and a recommendation: a stack, why, what it costs, where it breaks, two options set aside with reasons, and when
    to reconsider. Buttons load the answers of the course''s template projects. The rules are the lesson''s judgement, kept simple on
    purpose.'
  practice: 'Заполните карточку решения. 1) Кто правит содержание и как часто. 2) Что обслуживает главное действие проекта (форма, оплата,
    запись): сервис, плагин или своя функция. 3) Как хранятся тексты на языках проекта (поле на каждый язык, перевод записи, копии страниц).
    4) Бюджет. 5) Выберите стек и объясните, как выбор связан с ответами выше. 6) Назовите два отвергнутых варианта и для каждого свою
    причину: причины не должны повторять друг друга. 7) Напишите, при каком условии вы пересмотрите решение. Все «…» нужно заменить.
    Эпоха: 6.'
  checks:
  - Карточка исчезла. Она была в странице, верните её.
  - Где-то осталось многоточие «…». Замените его своим текстом.
  - 'Скажите, кто правит содержание: владелец, редактор, разработчик или команда.'
  - 'Напишите, как часто правят содержание: например, «раз в месяц».'
  - 'Скажите, что обслуживает главное действие: сервис, плагин или функцию, хотя бы тремя словами.'
  - 'Скажите, как хранятся тексты на языках проекта: полем на каждый язык, переводом записи или копиями страниц.'
  - 'У проекта два языка: напишите, как хранятся тексты на них (поле на каждый язык или перевод записи).'
  - 'Назовите выбранный стек: конструктор, WordPress, Битрикс, генератор, headless или приложение.'
  - 'Объясните выбор развёрнуто, через ответы выше: кто правит, как часто, бюджет.'
  - Нужны два отвергнутых варианта. Не удаляйте строки таблицы.
  - У каждого отвергнутого варианта нужна своя причина, хотя бы в несколько слов.
  - 'Назовите условие пересмотра: «если…» или «когда…».'
