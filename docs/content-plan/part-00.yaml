lessons:
- id: 00-start/01-how-to-learn
  order: 1
  title: Как устроен этот учебник
  summary: Вы поймёте, из чего состоит урок и почему здесь не перечитывают, а вспоминают. После урока вы найдёте следующий
    урок на карте, будете знать, как работают карточки, и что делать, если застряли.
  minutes: 12
  teaches:
  - start-how-the-course-works
  - start-concept-map
  - start-retrieval-practice
  - start-spaced-repetition
  requires: []
  diagram: 'Живая схема «кривая забывания»: ползунок интервала повторения; одна и та же карточка показана через 1, 3, 7 и
    21 день, и на графике видно, как падает и снова поднимается вероятность вспомнить.'
  practice: 'Без песочницы: дела в приложении (карта, настройки, карточки), описанные в конце урока.'
  checks:
  - 'Нет проверок в песочнице: человек выполняет шаги «Сделайте сейчас» в приложении'
  sources:
  - title: Интервальные повторения (Википедия)
    url: https://ru.wikipedia.org/wiki/%D0%98%D0%BD%D1%82%D0%B5%D1%80%D0%B2%D0%B0%D0%BB%D1%8C%D0%BD%D1%8B%D0%B5_%D0%BF%D0%BE%D0%B2%D1%82%D0%BE%D1%80%D0%B5%D0%BD%D0%B8%D1%8F
    licence: CC-BY-SA
    kind: article
    lang: ru
  - title: Testing effect (Wikipedia)
    url: https://en.wikipedia.org/wiki/Testing_effect
    licence: CC-BY-SA
    kind: article
    lang: en
  - title: 'ABC of FSRS: как алгоритм планирует повторения'
    url: https://github.com/open-spaced-repetition/fsrs4anki/wiki/ABC-of-FSRS
    licence: link-only
    kind: docs
    lang: en
  - title: IndexedDB API (MDN)
    url: https://developer.mozilla.org/en-US/docs/Web/API/IndexedDB_API
    licence: CC-BY-SA
    kind: docs
    lang: en
  videos: []
- id: 00-start/02-time-machine
  order: 2
  title: 'Машина времени: восемь эпох одного сайта'
  summary: Вы поймёте, зачем курс идёт по истории веба, и увидите свой проект в шести эпохах. После урока вы по виду сайта
    назовёте эпоху и скажете, какой инструмент её определял.
  minutes: 15
  teaches:
  - start-time-machine
  - start-web-eras
  requires:
  - start-how-the-course-works
  diagram: 'Слайдер «сравни эпохи»: один и тот же текст человека (кто он, для кого, что должен сделать посетитель) показан
    в 1991, 1996, 2000, 2005, 2014 и 2025; ползунок листает эпохи, подпись называет инструмент.'
  practice: 'Без песочницы: дела в приложении (карта, настройки, карточки), описанные в конце урока.'
  checks:
  - 'Нет проверок в песочнице: человек выполняет шаги «Сделайте сейчас» в приложении'
  sources:
  - title: History of the World Wide Web (Wikipedia)
    url: https://en.wikipedia.org/wiki/History_of_the_World_Wide_Web
    licence: CC-BY-SA
    kind: article
    lang: en
  - title: 'The World Wide Web project: описание проекта на первом сайте (CERN)'
    url: https://info.cern.ch/hypertext/WWW/TheProject.html
    licence: link-only
    kind: article
    lang: en
  - title: L'Arrivée d'un train en gare de La Ciotat (Wikipedia)
    url: https://en.wikipedia.org/wiki/L%27Arriv%C3%A9e_d%27un_train_en_gare_de_La_Ciotat
    licence: CC-BY-SA
    kind: article
    lang: en
  - title: Рунет (Википедия)
    url: https://ru.wikipedia.org/wiki/%D0%A0%D1%83%D0%BD%D0%B5%D1%82
    licence: CC-BY-SA
    kind: article
    lang: ru
  videos: []
- id: 00-start/03-workbench
  order: 3
  title: 'Рабочее место: редактор, предпросмотр и проверки'
  summary: 'Вы освоите инструменты, в которых пройдёт вся практика: редактор, предпросмотр, проверки и инструменты разработчика
    браузера. После урока вы правите файл, видите результат и понимаете, что значит «проверка не прошла».'
  minutes: 20
  teaches:
  - start-workbench
  - start-devtools-first-look
  requires:
  - start-time-machine
  diagram: 'Три панели рядом: файл, предпросмотр и дерево элементов. Щелчок по элементу в предпросмотре подсвечивает строку
    в файле и в дереве; ошибка в проверке подсвечивает, чего именно не хватает.'
  practice: 'Первая страница вашего проекта. Сейчас на странице просто две строки текста, и браузер не знает, что в них главное.
    Оберните название проекта в заголовок первого уровня h1, а описание в абзац p. Потом откройте инструменты разработчика
    и найдите свой заголовок в дереве элементов. Эпоха: 1.'
  checks:
  - Заголовка первого уровня ещё нет, или их больше одного. Нужен ровно один <h1>.
  - Заголовок есть, но в нём должно быть название проекта, ровно как оно написано в файле.
  - Описание пока не в абзаце. Оберните его в <p> и </p>.
  sources:
  - title: Что такое инструменты разработчика браузера (MDN)
    url: https://developer.mozilla.org/ru/docs/Learn_web_development/Howto/Tools_and_setup/What_are_browser_developer_tools
    licence: CC-BY-SA
    kind: article
    lang: ru
  - title: Работа с файлами (MDN)
    url: https://developer.mozilla.org/ru/docs/Learn_web_development/Getting_started/Environment_setup/Dealing_with_files
    licence: CC-BY-SA
    kind: article
    lang: ru
  - title: 'Chrome DevTools: обзор'
    url: https://developer.chrome.com/docs/devtools/overview
    licence: CC-BY
    kind: docs
    lang: en
  - title: 'Firefox DevTools: руководство'
    url: https://firefox-source-docs.mozilla.org/devtools-user/
    licence: link-only
    kind: docs
    lang: en
  - title: Основы DevTools (курс на Stepik)
    url: https://stepik.org/course/238319
    licence: link-only
    kind: course
    lang: ru
  videos: []
- id: 00-start/04-brief
  order: 4
  title: 'Бриф: ваш проект в семи полях'
  summary: 'Вы опишете свой сайт или веб-приложение так, чтобы любой шаг курса знал, о чём он. После урока у вас есть бриф:
    кто, для кого, главное действие, разделы, содержимое, языки и тон. А если идеи ещё нет, у вас есть готовый шаблон.'
  minutes: 20
  teaches:
  - start-project-brief
  - start-brief-fields
  - start-persona
  requires:
  - start-workbench
  diagram: 'Форма брифа с живым превью справа: чем больше полей заполнено, тем больше карточек (разделы, услуги, люди, доказательства,
    контакты) появляется на схематичной странице; переключатель шаблонов (портфолио, магазин, кафе, НКО, событие, SaaS, персона).'
  practice: 'Карточка вашего проекта. Под заголовком добавлена карточка проекта: семь полей брифа. Название и описание в ней
    уже есть, остальное отмечено многоточием. Замените каждое «…» своими словами: главное действие (одна фраза), не меньше
    трёх разделов (каждый в своём li), что есть на сайте, язык сайта и тон: деловой, тёплый, смелый или спокойный. Эпоха:
    1.'
  checks:
  - В карточке должно остаться семь пар «название поля и значение». Не удаляйте поля.
  - В карточке осталось многоточие «…». Замените его своими словами.
  - Главное действие пока пустое. Напишите, что должен сделать посетитель, одной фразой.
  - Нужно не меньше трёх разделов, каждый в своём элементе <li>.
  - 'Опишите в одну-две фразы, что есть на сайте: услуги или товары, люди, доказательства, контакты.'
  - Укажите язык сайта, например «русский».
  - 'Тон должен быть одним из четырёх слов: деловой, тёплый, смелый, спокойный.'
  sources:
  - title: Бриф (Википедия)
    url: https://ru.wikipedia.org/wiki/%D0%91%D1%80%D0%B8%D1%84
    licence: CC-BY-SA
    kind: article
    lang: ru
  - title: Creative brief (Wikipedia)
    url: https://en.wikipedia.org/wiki/Creative_brief
    licence: CC-BY-SA
    kind: article
    lang: en
  - title: Persona (user experience) (Wikipedia)
    url: https://en.wikipedia.org/wiki/Persona_(user_experience)
    licence: CC-BY-SA
    kind: article
    lang: en
  - title: Personas Make Users Memorable (Nielsen Norman Group)
    url: https://www.nngroup.com/articles/persona/
    licence: proprietary-link
    kind: article
    lang: en
  videos: []
- id: 00-start/05-local-first
  order: 5
  title: 'Ваши данные остаются у вас: хранение, экспорт, личный ключ'
  summary: Вы поймёте, где живут ваш прогресс и ваш бриф, чем это удобно и чем рискованно, и как сохранить всё одним файлом.
    После урока вы можете решить, какие данные в брифе взять из своей жизни, а какие оставить вымышленными.
  minutes: 15
  teaches:
  - start-local-first
  requires:
  - start-project-brief
  diagram: 'Схема потоков данных: что остаётся в браузере (прогресс, бриф, ключ), что уходит в файл экспорта, что может уйти
    модели и только по разрешению; переключатель «режим модели выключен / включён» меняет стрелки.'
  practice: 'Чьи данные на странице. Под вашей карточкой проекта добавлена заметка: четыре данных, которые попадают на страницу.
    Рядом с каждым стоит многоточие. Решите для каждого, ваше это или вымышленное, и замените «…» на слово «своё» или «вымышленное».
    Это решение вы сможете поменять в любой момент. Эпоха: 1.'
  checks:
  - 'В заметке должно остаться четыре строки: имя, телефон, почта, город.'
  - Где-то осталось многоточие «…». Замените его словом «своё» или «вымышленное».
  - 'В выделенном месте должно стоять ровно одно слово: «своё» или «вымышленное», без точки.'
  - 'Отметьте все четыре данных: у каждого должен остаться элемент strong с классом src.'
  sources:
