part: 0
slug: start
title: Старт
era: null
summary: Как учиться по этому учебнику, что такое «машина времени», и как записать свой проект в структурированный бриф, на
  котором строится вся практика.
concepts:
- id: start.how-the-course-works
  title: 'Как устроен курс: урок, схема, практика, тест, карточки'
- id: start.concept-map
  title: Карта понятий и порядок уроков
- id: start.retrieval-practice
  title: Вспоминание вместо перечитывания
- id: start.spaced-repetition
  title: Интервальные повторения
- id: start.time-machine
  title: 'Машина времени: один сайт в восьми эпохах'
- id: start.web-eras
  title: Эпохи веба и их инструменты
- id: start.project-brief
  title: Бриф проекта
- id: start.brief-fields
  title: 'Поля брифа: кто, для кого, действие, разделы, содержимое, языки, тон'
- id: start.persona
  title: Персона по умолчанию и свои данные вместо неё
- id: start.workbench
  title: 'Рабочее место: редактор, предпросмотр, проверки'
- id: start.devtools-first-look
  title: 'Инструменты разработчика браузера: первый взгляд'
- id: start.local-first
  title: 'Данные только на вашем устройстве: хранение, экспорт, свой ключ'
lessons:
- id: 00-start/01-how-to-learn
  order: 1
  title: 'Как учиться здесь: проводник, карта, карточки'
  summary: 'Зачем: вы поймёте, из чего состоит урок и почему курс заставляет вспоминать, а не перечитывать. После урока вы
    найдёте следующий урок на карте, ответите на первые карточки и знаете, что делать, если застряли.'
  minutes: 10
  teaches:
  - start.how-the-course-works
  - start.concept-map
  - start.retrieval-practice
  - start.spaced-repetition
  requires: []
  diagram: 'Живая схема «кривая забывания»: ползунок интервала повторения; одна и та же карточка показана через 1, 3, 7 и
    21 день, и на графике видно, как падает и снова поднимается вероятность вспомнить.'
  practice: 'Без кода. Человек открывает карту понятий, находит урок по слову из своего проекта и отвечает на три пробные
    карточки. В бриф вносится только черновик полей title и who (одной фразой). Эпоха: до машины времени.'
  checks:
  - В брифе заполнено поле «кто и что» (хотя бы одной непустой фразой)
  - Человек отметил на карте хотя бы один урок как «следующий»
  - Сделано не меньше трёх ответов на карточки
  sources:
  - title: Spaced repetition
    url: https://en.wikipedia.org/wiki/Spaced_repetition
    licence: CC-BY-SA
    kind: article
    lang: en
  - title: Testing effect
    url: https://en.wikipedia.org/wiki/Testing_effect
    licence: CC-BY-SA
    kind: article
    lang: en
  - title: ABC of FSRS (алгоритм, который планирует карточки)
    url: https://github.com/open-spaced-repetition/fsrs4anki/wiki/ABC-of-FSRS
    licence: link-only
    kind: docs
    lang: en
  - title: Learn HTML (пример структуры современного курса)
    url: https://web.dev/learn/html
    licence: CC-BY
    kind: course
    lang: en
  videos: []
- id: 00-start/02-time-machine
  order: 2
  title: 'Машина времени: восемь эпох одного сайта'
  summary: 'Зачем: вы увидите, зачем курс идёт по истории веба, и пересоберёте пролог «Прибытие поезда» на своих словах. После
    урока вы можете назвать эпоху по виду сайта и сказать, какой инструмент её определял.'
  minutes: 15
  teaches:
  - start.time-machine
  - start.web-eras
  requires:
  - start.how-the-course-works
  diagram: 'Слайдер «сравни эпохи»: один и тот же текст человека (кто он, для кого, что должен сделать посетитель) показан
    в 1991, 1996, 2000, 2005, 2014 и 2025; ползунок листает эпохи, подпись называет инструмент.'
  practice: 'Человек отвечает на три вопроса пролога: кто он или в чём идея (title, who), для кого (forWhom), что должен сделать
    посетитель (mainAction). Эти ответы проходят через все эпохи. Эпоха: обзор всех восьми.'
  checks:
  - 'Заполнены три поля брифа: who, forWhom, mainAction'
  - Те же слова человека видны в предпросмотре как минимум двух разных эпох
  - Человек правильно сопоставил хотя бы три эпохи с их инструментом
  sources:
  - title: History of the World Wide Web
    url: https://en.wikipedia.org/wiki/History_of_the_World_Wide_Web
    licence: CC-BY-SA
    kind: article
    lang: en
  - title: The World Wide Web project (первая страница сайта CERN)
    url: http://info.cern.ch/hypertext/WWW/TheProject.html
    licence: link-only
    kind: article
    lang: en
  - title: L'Arrivée d'un train en gare de La Ciotat
    url: https://en.wikipedia.org/wiki/L%27Arriv%C3%A9e_d%27un_train_en_gare_de_La_Ciotat
    licence: CC-BY-SA
    kind: article
    lang: en
  - title: Рунет
    url: https://ru.wikipedia.org/wiki/%D0%A0%D1%83%D0%BD%D0%B5%D1%82
    licence: CC-BY-SA
    kind: article
    lang: ru
  videos: []
- id: 00-start/03-brief
  order: 3
  title: 'Бриф: ваш проект в семи полях'
  summary: 'Зачем: вы опишете свой сайт или веб-приложение так, чтобы любой шаг курса знал, о чём он. После урока у вас есть
    бриф: кто, для кого, главное действие, разделы, содержимое, языки и тон, а если идеи ещё нет, то готовый шаблон или персона
    по умолчанию.'
  minutes: 20
  teaches:
  - start.project-brief
  - start.brief-fields
  - start.persona
  requires:
  - start.time-machine
  diagram: 'Форма брифа с живым превью справа: чем больше полей заполнено, тем больше карточек (разделы, услуги, люди, доказательства,
    контакты) появляется на схематичной странице; переключатель шаблонов (портфолио, магазин, кафе, НКО, событие, SaaS, персона).'
  practice: 'Человек выбирает шаблон или описывает свою идею и заполняет все поля брифа: title, who, forWhom, mainAction,
    sections, items, people, proofs, contacts, languages, tone. Любое поле можно заменить своими данными вместо данных персоны.
    Эпоха: брифу всё равно, он нужен всем эпохам.'
  checks:
  - Заполнены все обязательные поля брифа, ни одно не состоит из одних пробелов
  - В sections есть хотя бы три раздела, и один из них отвечает на mainAction
  - В contacts есть хотя бы один способ связаться
  - В languages указан хотя бы один язык; если их два, указан язык по умолчанию
  sources:
  - title: Creative brief
    url: https://en.wikipedia.org/wiki/Creative_brief
    licence: CC-BY-SA
    kind: article
    lang: en
  - title: Persona (user experience)
    url: https://en.wikipedia.org/wiki/Persona_(user_experience)
    licence: CC-BY-SA
    kind: article
    lang: en
  - title: Personas Make Users Memorable (Nielsen Norman Group)
    url: https://www.nngroup.com/articles/persona/
    licence: proprietary-link
    kind: article
    lang: en
  videos: []
- id: 00-start/04-workbench
  order: 4
  title: 'Рабочее место: редактор, предпросмотр и проверки'
  summary: 'Зачем: вы освоите инструменты, в которых пройдёт вся практика: редактор, предпросмотр, проверки и инструменты
    разработчика браузера. После урока вы правите файл, видите результат и понимаете, что значит «проверка не прошла».'
  minutes: 20
  teaches:
  - start.workbench
  - start.devtools-first-look
  requires:
  - start.brief-fields
  diagram: 'Три панели рядом: файл, предпросмотр и дерево элементов. Щелчок по элементу в предпросмотре подсвечивает строку
    в файле и в дереве; ошибка в проверке подсвечивает, чего именно не хватает.'
  practice: 'Человек создаёт первую страницу проекта: заголовок первого уровня с названием из брифа (title) и абзац с формулировкой
    из who. Затем открывает инструменты разработчика и находит в дереве свой заголовок. Эпоха: 1 (1996), только текст.'
  checks:
  - На странице есть ровно один элемент h1, и его текст совпадает с полем title
  - Есть абзац, текст которого содержит значение поля who
  - Страница открывается без сообщений об ошибке разметки
  sources:
  - title: Your first website
    url: https://developer.mozilla.org/en-US/docs/Learn_web_development/Getting_started/Your_first_website
    licence: CC-BY-SA
    kind: course
    lang: en
  - title: Installing basic software
    url: https://developer.mozilla.org/en-US/docs/Learn_web_development/Getting_started/Environment_setup/Installing_software
    licence: CC-BY-SA
    kind: course
    lang: en
  - title: Dealing with files
    url: https://developer.mozilla.org/en-US/docs/Learn_web_development/Getting_started/Environment_setup/Dealing_with_files
    licence: CC-BY-SA
    kind: course
    lang: en
  - title: Chrome DevTools
    url: https://developer.chrome.com/docs/devtools
    licence: CC-BY
    kind: docs
    lang: en
  videos: []
- id: 00-start/05-local-first
  order: 5
  title: 'Ваши данные остаются у вас: хранение, экспорт, личный ключ'
  summary: 'Зачем: вы поймёте, где живёт ваш прогресс и ваш бриф, чем это удобно и чем рискованно, и как сохранить всё одним
    файлом. После урока вы можете решить, какие поля брифа взять из своей жизни, а какие оставить вымышленными.'
  minutes: 15
  teaches:
  - start.local-first
  requires:
  - start.project-brief
  diagram: 'Схема потоков данных: что остаётся в браузере (прогресс, бриф, ключ), что уходит в файл экспорта, что может уйти
    модели и только по разрешению; переключатель «режим модели выключен / включён» меняет стрелки.'
  practice: 'Человек отмечает в брифе поля, где его реальные персональные данные (people, contacts), решает, оставить ли данные
    персоны, и один раз сохраняет прогресс в файл. Эпоха: не привязана.'
  checks:
  - 'Для каждого поля people и contacts человек выбрал источник: своё или вымышленное'
  - Файл экспорта скачан и содержит бриф с теми же значениями
  - Человек правильно ответил, что хранится только на устройстве, а что покидает его только по разрешению
  sources:
  - title: IndexedDB API
    url: https://developer.mozilla.org/en-US/docs/Web/API/IndexedDB_API
    licence: CC-BY-SA
    kind: docs
    lang: en
  - title: Storage quotas and eviction criteria
    url: https://developer.mozilla.org/en-US/docs/Web/API/Storage_API/Storage_quotas_and_eviction_criteria
    licence: CC-BY-SA
    kind: docs
    lang: en
  - title: Федеральный закон «О персональных данных» № 152-ФЗ
    url: https://www.consultant.ru/document/cons_doc_LAW_61801/
    licence: proprietary-link
    kind: spec
    lang: ru
  - title: Портал персональных данных Роскомнадзора
    url: https://pd.rkn.gov.ru/
    licence: proprietary-link
    kind: docs
    lang: ru
  videos: []
