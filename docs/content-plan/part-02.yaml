- id: 02-html/07-head-meta-og
  order: 7
  title: Head, мета-теги и Open Graph
  summary: То, что невидимо на странице, решает, как её найдут и как покажут в поиске, в ВКонтакте, в Telegram и в
    мессенджерах. После урока вы заполняете title, description, кодировку, viewport и Open Graph для своего проекта.
  minutes: 20
  teaches:
  - html-head-meta
  - html-open-graph
  requires:
  - html-document-structure
  - net-http-status-headers
  diagram: 'content/diagrams/SnippetPreview.svelte: поля title, description и Open Graph и три превью: вкладка, выдача
    поиска и карточка ссылки в мессенджере.'
  practice: 'Заполните head своей страницы. Кодировка charset и viewport с шириной устройства. Название title понятное и
    не длиннее 70 знаков, в нём название проекта. Описание meta name="description" на 30–160 знаков (кто вы и для кого,
    из полей who и forWhom). Канонический адрес link rel="canonical" и значок link rel="icon". И Open Graph: og:title,
    og:description, og:image с полным адресом на https:// и og:locale в виде ru_RU. Свой адрес сайта пока не нужен:
    возьмите условный https://zarechye.example/. Эпоха: 4. Продолжает шаг contact-form.'
  checks:
  - Не хватает <meta charset="utf-8"> в начале head.
  - Нужен тег <meta name="viewport" content="width=device-width, initial-scale=1">.
  - Название title должно быть непустым и не длиннее 70 знаков.
  - В title должно быть название вашего проекта, как в брифе.
  - 'Нужен meta name="description" на 30–160 знаков: не слишком коротко и не слишком длинно.'
  - Добавьте <link rel="canonical" href="https://…"> с полным адресом.
  - 'Добавьте значок: <link rel="icon" href="…">.'
  - Добавьте <meta property="og:title" content="…">.
  - Добавьте <meta property="og:description" content="…">.
  - Адрес og:image должен быть полным и начинаться с https://.
  - og:locale пишется в виде языка и страны, например ru_RU.
  sources:
  - title: What’s in the head? Web page metadata (MDN)
    url: https://developer.mozilla.org/en-US/docs/Learn_web_development/Core/Structuring_content/Webpage_metadata
