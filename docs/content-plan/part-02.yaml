- id: 02-html/01-first-page
  order: 1
  title: 'Первая страница: теги, заголовок, ссылка'
  summary: 'Вы напишете веб-страницу своими руками: с заголовком, абзацами и ссылкой, по которой можно позвонить. Так
    выглядели сайты в начале девяностых, и так же устроен любой сайт сегодня.'
  minutes: 25
  teaches:
  - html-document-structure
  - html-tags-attributes
  - html-tag
  - html-heading
  - html-paragraph
  - html-link
  requires:
  - start-workbench
  - net-rendering-pipeline
  diagram: 'Разбор элемента ссылки по частям (TagAnatomy, src/lib/schemas): нажимаете на часть строки и читаете, что это.'
  practice: 'Сейчас на странице сплошной текст. Сделайте из него страницу: имя в заголовок h1, описание и город в два
    абзаца p, телефон в ссылку для звонка, и укажите, что страница на русском. Эпоха: 1.'
  checks:
  - Заголовка пока нет. Оберните имя в <h1> и </h1>.
  - Заголовок есть, но в нём должно быть имя, ровно как в ваших данных.
  - 'Нужно хотя бы два абзаца <p>: например, чем вы занимаетесь и где.'
  - Телефон пока не ссылка. Оберните его в <a href="tel:номер"> и </a>.
  - 'Осталось указать язык: в первом теге напишите <html lang="ru">.'
