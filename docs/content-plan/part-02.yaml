  title: ARIA и первое правило ARIA
lessons:
- id: 02-html/01-documents-tags
  order: 1
  title: 'Документ и теги: страница 1996 года'
  summary: 'Зачем: вы напишете страницу руками и поймёте, из чего она состоит. После урока вы отличаете элемент от тега и
    атрибута, пишете корректный документ и можете объяснить, почему в 1996-м всё держалось на таблицах и тегах font.'
  minutes: 25
  teaches:
  - html.document-structure
  - html.tags-attributes
  - html.legacy-layout
  requires:
  - net.rendering-pipeline
  - start.workbench
  diagram: 'Редактор с живым деревом: при вводе тега в дереве появляется узел, незакрытый тег подсвечивается, а переключатель
    «как увидит браузер» показывает, как он сам достраивает разметку.'
  practice: 'Человек строит версию сайта эпохи 1 (1996): таблица в качестве сетки, тег font для оформления, счётчик посетителей
    в виде картинки. Содержимое берётся из брифа: title в заголовке, who в первом абзаце, sections в меню, items в списке.
    Эпоха: 1 (1996).'
  checks:
  - Документ начинается с объявления типа документа и содержит html, head и body
  - В заголовке стоит значение поля title, а в меню есть пункт для каждого раздела из sections
  - Сетка страницы сделана таблицей, и человек отметил в заметке, чем это плохо
  - Все теги закрыты и вложены корректно, проверка разметки не показывает ошибок
  sources:
  - title: Basic HTML syntax
    url: https://developer.mozilla.org/en-US/docs/Learn_web_development/Core/Structuring_content/Basic_HTML_syntax
    licence: CC-BY-SA
    kind: course
    lang: en
  - title: HTML 3.2 Reference Specification (W3C, 1997)
    url: https://www.w3.org/TR/2018/SPSD-html32-20180315/
    licence: link-only
    kind: spec
    lang: en
  - title: 'RFC 1866: Hypertext Markup Language — 2.0'
    url: https://www.rfc-editor.org/rfc/rfc1866
    licence: link-only
    kind: spec
    lang: en
  - title: Spacer GIF
    url: https://en.wikipedia.org/wiki/Spacer_GIF
    licence: CC-BY-SA
    kind: article
    lang: en
  - title: HTML — Дока
    url: https://doka.guide/html/
    licence: link-only
    kind: docs
    lang: ru
  videos: []
- id: 02-html/02-semantics-outline
  order: 2
  title: Смысловая разметка и структура документа
  summary: 'Зачем: вы замените безликие блоки элементами, которые что-то значат для поисковиков, программ экранного чтения
    и вас самих через год. После урока вы строите страницу из header, nav, main, article, section и footer и расставляете
    заголовки по порядку.'
  minutes: 25
  teaches:
  - html.semantic-elements
  - html.heading-outline
  requires:
  - html.document-structure
  diagram: 'Переключатель «видимое / структурное»: слева обычная страница, справа та же страница как схема ориентиров и заголовков,
    как её читает экранный диктор; перетаскивание заголовков меняет схему.'
  practice: 'Человек переписывает страницу 1996 года на смысловые элементы без единой таблицы для сетки. Структура берётся
    из sections, главный заголовок из title, каждый пункт items оформляется как article. Эпоха: 2 (2005), структура отделена
    от оформления.'
  checks:
  - На странице один main и один h1, а заголовки идут без пропуска уровней
  - Для каждого значения sections есть section или article с заголовком
  - Меню оформлено как nav со списком ссылок
  - На странице нет таблиц, используемых для раскладки
  sources:
  - title: Structuring documents
    url: https://developer.mozilla.org/en-US/docs/Learn_web_development/Core/Structuring_content/Document_and_website_structure
    licence: CC-BY-SA
    kind: course
    lang: en
  - title: Headings and paragraphs
    url: https://developer.mozilla.org/en-US/docs/Learn_web_development/Core/Structuring_content/Headings_and_paragraphs
    licence: CC-BY-SA
    kind: course
    lang: en
  - title: 'HTML Living Standard: 4.3 Sections'
    url: https://html.spec.whatwg.org/multipage/sections.html
    licence: CC-BY
    kind: spec
    lang: en
  - title: Learn HTML
    url: https://web.dev/learn/html
    licence: CC-BY
    kind: course
    lang: en
  - title: HTML — Дока
    url: https://doka.guide/html/
    licence: link-only
    kind: docs
    lang: ru
  videos: []
- id: 02-html/03-links-images-media
  order: 3
  title: Ссылки, изображения и медиа
  summary: 'Зачем: вы свяжете страницы друг с другом, добавите картинки так, чтобы они были понятны всем и не тормозили загрузку,
    и встроите видео. После урока вы пишете правильный alt, выбираете между относительной и абсолютной ссылкой и подключаете
    адаптивные изображения.'
  minutes: 25
  teaches:
  - html.links
  - html.images
  - html.media
  requires:
  - html.semantic-elements
  - net.url-anatomy
  diagram: 'Схема «куда ведёт ссылка»: по введённому адресу показывается разбор на относительный и абсолютный путь относительно
    текущей страницы; рядом ползунок ширины экрана, который показывает, какой из вариантов srcset выберет браузер.'
  practice: 'Человек добавляет в страницу якорные ссылки на все разделы из sections, фото или значок для каждого пункта из
    people и items и, если уместно, видео. Для каждого изображения пишется alt по правилу «зачем картинка здесь». Эпоха: 2
    (2005).'
  checks:
  - У каждого изображения есть атрибут alt; для декоративных он пустой, а для содержательных описывает смысл
  - Каждый раздел из sections доступен по якорной ссылке, и якорь действительно есть на странице
  - У изображений заданы ширина и высота, чтобы страница не прыгала
  - Текст ссылок осмысленный и не состоит из слов «здесь» или «читать далее» без пояснения
  sources:
  - title: Creating links
    url: https://developer.mozilla.org/en-US/docs/Learn_web_development/Core/Structuring_content/Creating_links
    licence: CC-BY-SA
    kind: course
    lang: en
  - title: HTML images
    url: https://developer.mozilla.org/en-US/docs/Learn_web_development/Core/Structuring_content/HTML_images
    licence: CC-BY-SA
    kind: course
    lang: en
  - title: '<video>: the video embed element'
    url: https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Elements/video
    licence: CC-BY-SA
    kind: docs
    lang: en
  - title: Images Tutorial (W3C WAI)
    url: https://www.w3.org/WAI/tutorials/images/
    licence: link-only
    kind: course
    lang: en
  - title: Learn HTML
    url: https://web.dev/learn/html
    licence: CC-BY
    kind: course
    lang: en
  videos: []
- id: 02-html/04-forms
  order: 4
  title: 'Формы: как человек что-то отправляет'
  summary: 'Зачем: форма превращает посетителя в клиента, и от неё зависит результат сайта. После урока вы собираете форму
    под главное действие своего проекта, подписываете каждое поле, подключаете проверку в браузере и ставите галочку согласия
    на обработку персональных данных по 152-ФЗ.'
  minutes: 30
  teaches:
  - html.forms
  - html.form-validation
  requires:
  - html.links
  - net.http-request-response
  - net.tls
  diagram: 'Форма в двух видах: слева поля, справа HTTP-запрос, который уйдёт при отправке (метод GET или POST, имена полей,
    кодировка); ошибка в поле показывает, какое сообщение выдаст браузер.'
  practice: 'Человек создаёт форму под mainAction из брифа (заявка, запись, заказ, подписка): только необходимые поля, у каждого
    label, подходящий type и autocomplete, обязательность. Добавляется отдельная галочка согласия со ссылкой на политику обработки
    данных. Эпоха: 3 (2010), форма отправляется на сервер.'
  checks:
  - У каждого поля есть связанный label, а не только placeholder
  - 'Типы полей подходят к данным: телефон, e-mail, дата не заданы как простой текст'
  - Есть поле согласия на обработку персональных данных со ссылкой, и оно не отмечено заранее
  - Нет полей, которые не нужны для mainAction, а форма указывает метод POST
  sources:
  - title: Your first form
    url: https://developer.mozilla.org/en-US/docs/Learn_web_development/Extensions/Forms/Your_first_form
    licence: CC-BY-SA
    kind: course
    lang: en
  - title: Client-side form validation
    url: https://developer.mozilla.org/en-US/docs/Learn_web_development/Extensions/Forms/Form_validation
    licence: CC-BY-SA
    kind: course
    lang: en
  - title: Learn Forms
    url: https://web.dev/learn/forms
    licence: CC-BY
    kind: course
    lang: en
  - title: Forms Tutorial (W3C WAI)
    url: https://www.w3.org/WAI/tutorials/forms/
    licence: link-only
    kind: course
    lang: en
  - title: Федеральный закон «О персональных данных» № 152-ФЗ
    url: https://www.consultant.ru/document/cons_doc_LAW_61801/
    licence: proprietary-link
    kind: spec
    lang: ru
  videos: []
- id: 02-html/05-tables
  order: 5
  title: 'Таблицы: для данных, не для раскладки'
  summary: 'Зачем: таблица нужна, когда у вас действительно есть строки и столбцы, например цены, расписание или сравнение
    тарифов. После урока вы строите таблицу с заголовками и подписью, понимаете, почему таблицы для раскладки ушли, и знаете,
    где они ещё уместны.'
  minutes: 15
  teaches:
  - html.data-tables
  requires:
  - html.legacy-layout
  - html.semantic-elements
  diagram: 'Одни и те же данные в таблице и в раскладке таблицами-«картинками»: экранный диктор озвучивает ячейки, и видно,
    как заголовки th с scope дают контекст каждой ячейке.'
  practice: 'Человек, у которого в items есть цены, сроки или сравнение, оформляет их таблицей с caption, thead и th scope.
    Если таких данных нет, берётся предложенная заготовка для типа проекта (расписание, прайс, список документов). Эпоха:
    2 (2005).'
  checks:
  - Есть table с caption и строкой заголовков в thead
  - Все ячейки заголовков имеют th и scope
  - Таблица содержит данные из items, а не раскладку блоков страницы
  sources:
  - title: HTML table basics
    url: https://developer.mozilla.org/en-US/docs/Learn_web_development/Core/Structuring_content/HTML_table_basics
    licence: CC-BY-SA
    kind: course
    lang: en
  - title: Tables Tutorial (W3C WAI)
    url: https://www.w3.org/WAI/tutorials/tables/
    licence: link-only
    kind: course
    lang: en
  - title: HTML 3.2 Reference Specification (W3C, 1997)
    url: https://www.w3.org/TR/2018/SPSD-html32-20180315/
    licence: link-only
    kind: spec
    lang: en
  - title: Spacer GIF
    url: https://en.wikipedia.org/wiki/Spacer_GIF
    licence: CC-BY-SA
