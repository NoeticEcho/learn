    url: https://doka.guide/html/deprecated-tags/
    licence: link-only
    kind: docs
    lang: ru
  - title: HTML table basics (MDN)
    url: https://developer.mozilla.org/en-US/docs/Learn_web_development/Core/Structuring_content/HTML_table_basics
    licence: CC-BY-SA
    kind: course
    lang: en
  videos: []
- id: 02-html/03-semantics-outline
  order: 3
  title: Смысловая разметка и заголовки
  summary: Вы замените безликие блоки и таблицы элементами, которые что-то значат для поисковиков, программ чтения с
    экрана и для вас самих через год. После урока вы строите страницу из header, nav, main, article, section и footer и
    расставляете заголовки по порядку.
  minutes: 25
  teaches:
  - html-semantic-elements
  - html-heading-outline
  requires:
  - html-legacy-layout
  - html-heading
  diagram: 'content/diagrams/OutlineView.svelte: разметка разбирается настоящим DOMParser, схема показывает ориентиры и
    оглавление из заголовков и называет проблемы; два примера, смысловой и из div.'
  practice: 'Это страница в духе 2005 года: сетка из таблицы и подписи через font. Перепишите её без таблиц. Шапку с
    названием и меню сделайте элементами header и nav (меню списком ul со ссылками на все разделы). Основное содержимое
    поместите в main, а в нём: заголовок h1, а затем каждый раздел отдельным section с заголовком h2. Услуги и товары
    оформите карточками: каждый article с заголовком h3, все вместе в div с классом cards, а каждый article с классом
    card. Контакты поместите в aside, а подвал сделайте элементом footer. Многоточия «…» замените своим текстом. Эпоха:
    2.'
  checks:
  - 'В странице остались table, font или center. Эти теги надо убрать совсем: смысл теперь в элементах, а вид придёт
    позже из CSS.'
  - 'Нужен элемент header: в нём название и меню.'
  - В меню (внутри nav) должна быть ссылка для каждого раздела вашего проекта.
  - Основное содержимое лежит в одном элементе main. Не больше одного и не меньше.
  - 'На странице должен быть ровно один h1: название вашего проекта.'
  - В h1 должно быть название проекта, как в первом уроке.
  - Каждый раздел вашего проекта это отдельный section внутри main.
  - В каждом section должен быть заголовок h2 с названием раздела.
  - 'Заголовки перескакивают через уровень, например h2 сразу к h4. Идите по порядку: h1, h2, h3.'
  - 'Услуги или товары оформляются так: <div class="cards">, а в нём по одному <article class="card"> на каждую.'
  - В каждой карточке заголовок h3 с названием услуги или товара из вашего брифа.
  - 'Контакты положите в aside: телефон из вашего брифа должен быть внутри него.'
  - Подвал страницы это элемент footer.
  - Где-то в основном содержимом остался знак «…». Замените его своим текстом.
  sources:
  - title: Document and website structure (MDN)
    url: https://developer.mozilla.org/en-US/docs/Learn_web_development/Core/Structuring_content/Document_and_website_structure
    licence: CC-BY-SA
    kind: course
    lang: en
  - title: Headings and paragraphs (MDN)
    url: https://developer.mozilla.org/en-US/docs/Learn_web_development/Core/Structuring_content/Headings_and_paragraphs
