- id: 02-html/08-accessibility
  order: 8
  title: 'Доступность: сайт для всех'
  summary: Доступный сайт читают люди с нарушениями зрения и слуха, на клавиатуре и в шумной электричке, а поисковики
    видят его лучше. После урока вы проверяете страницу по основным принципам WCAG, добавляете ссылку «перейти к
    содержимому» и знаете, когда ARIA не нужна.
  minutes: 25
  teaches:
  - html-a11y-basics
  - html-aria-first-rule
  requires:
  - html-forms
  - html-images
  - html-heading-outline
  diagram: 'content/diagrams/KeyboardTest.svelte: три «кнопки» (button, div с обработчиком, div с role и tabindex);
    таблица записывает, кто получил фокус и сработал от клавиатуры.'
  practice: 'Пройдитесь по своей странице глазами человека с клавиатурой и диктором. 1) Первой в body поставьте ссылку
    «Перейти к содержимому» с href="#main" и дайте main id="main". 2) К полю телефона добавьте подсказку: короткий текст
    в small с id и атрибут aria-describedby у поля. 3) В форме добавьте группу переключателей «Когда удобно позвонить»
    (радиокнопки с label) и заверните её в fieldset с legend. 4) Убедитесь, что у каждой картинки есть alt, у каждого
    поля label, у каждого nav своё имя (aria-label), нет пустых ссылок и кнопок, нет tabindex больше нуля и нет
    самодельных кнопок из div. Эпоха: 4. Продолжает шаг head-meta.'
  checks:
  - Первым элементом в body должна быть ссылка <a href="#main">Перейти к содержимому</a>.
  - У main нужен id="main", чтобы ссылка «перейти к содержимому» знала, куда вести.
  - У html должен быть lang="ru".
  - У какого-то поля нет подписи label.
  - У каждой картинки должен быть alt.
  - Добавьте подсказку и свяжите её с полем через aria-describedby.
  - 'Группу переключателей заверните в <fieldset> с <legend>: подписью всей группы.'
  - 'У каждого nav должно быть имя: aria-label="Разделы сайта".'
  - 'Остался tabindex больше нуля. Уберите его: порядок задаёт разметка.'
  - Остался самодельный элемент с role="button" или onclick. Замените его на нативный button или a.
  - Есть пустая ссылка или кнопка без текста. У неё должно быть название.
  sources:
  - title: 'HTML: A good basis for accessibility (MDN)'
    url: https://developer.mozilla.org/en-US/docs/Learn_web_development/Core/Accessibility/HTML
    licence: CC-BY-SA
    kind: course
    lang: en
