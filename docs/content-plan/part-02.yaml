- id: 02-html/04-links-images-media
  order: 4
  title: Ссылки, изображения и медиа
  summary: Вы свяжете страницы и разделы друг с другом, добавите картинки так, чтобы они были понятны всем и не тормозили
    загрузку, и узнаете, как встроить видео. После урока вы пишете осмысленный alt, отличаете относительную ссылку от
    абсолютной и подключаете адаптивные изображения.
  minutes: 25
  teaches:
  - html-links
  - html-images
  - html-media
  requires:
  - html-semantic-elements
  - net-url-anatomy
  diagram: 'content/diagrams/LinkResolver.svelte: адрес страницы и значение href разбирает настоящий URL; ниже ползунок
    ширины окна и плотность экрана показывают, какой файл srcset выберет браузер.'
  practice: 'Продолжайте свою страницу. 1) Дайте id латиницей первым трём разделам (на их section) и сделайте пункты меню
    ссылками на них. 2) Кнопка главного действия (ссылка с классом button) должна вести на блок контактов: поставьте
    aside id="contacts" и ссылку href="#contacts". 3) Шапке дайте id="top", а в подвал добавьте ссылку «Наверх» на #top
    и ссылку на политику обработки данных privacy.html. 4) В первый раздел добавьте фотографию foto.jpg: img с alt,
    width и height. 5) Каждое подтверждение из брифа оформите как figure с картинкой skan.jpg и подписью figcaption.
    Файлов у нас нет, поэтому вместо картинок вы увидите их описания. Эпоха: 2. Продолжает шаг semantic-page.'
  checks:
  - Нужно три раздела с id. Допишите id латиницей к первым трём section, например id="obo-mne".
  - 'Не меньше трёх пунктов меню должны быть ссылками-якорями: <a href="#id-раздела">.'
  - Остались ссылки href="#", которые никуда не ведут. Замените их ссылкой на настоящий id.
  - 'Кнопка главного действия (ссылка с классом button) должна вести на блок контактов: href="#contacts".'
  - 'Нужен элемент aside с id="contacts": блок контактов, к которому ведёт кнопка.'
  - 'Шапке (header) нужен id="top": место, куда будет вести «Наверх».'
  - В подвале нужна ссылка «Наверх» с href="#top".
  - 'В подвале нужна ссылка на политику обработки данных: href="privacy.html".'
  - Добавьте хотя бы одну картинку <img>.
  - У каждой картинки должен быть alt. Для содержательной это описание, для декоративной пустое alt="".
  - У каждой картинки нужны width и height, чтобы страница не прыгала при загрузке.
  - Каждое подтверждение из вашего брифа это отдельный <figure>.
  - Подпись figcaption каждого подтверждения должна содержать его название из брифа.
  sources:
  - title: Создание ссылок (MDN)
    url: https://developer.mozilla.org/ru/docs/Learn_web_development/Core/Structuring_content/Creating_links
    licence: CC-BY-SA
    kind: course
    lang: ru
