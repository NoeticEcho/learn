    url: https://doka.guide/html/tables/
    licence: link-only
    kind: docs
    lang: ru
  videos: []
- id: 02-html/06-forms
  order: 6
  title: 'Формы: как человек что-то отправляет'
  summary: Форма превращает посетителя в клиента, и от неё зависит результат сайта. После урока вы собираете форму под
    главное действие своего проекта, подписываете каждое поле, включаете проверку в браузере и ставите отдельную галочку
    согласия на обработку персональных данных.
  minutes: 30
  teaches:
  - html-forms
  - html-form-validation
  requires:
  - html-links
  - net-http-request-response
  - net-tls
  diagram: 'content/diagrams/FormRequest.svelte: настоящая маленькая форма и рядом HTTP-запрос, который построит браузер
    (GET или POST, кодирование), плюс сообщения встроенной проверки.'
  practice: 'Начинается эпоха 2014 года. Страница ниже похожа на вашу из 2005-го, она уже собрана. Добавьте в неё форму
    для главного действия проекта: отдельным section с заголовком h2, в нём form с method="post" и action. Поля: имя
    (type text), телефон (type tel), коротко о задаче (textarea). У каждого поля label и атрибут autocomplete, имя и
    телефон обязательные. Потом отдельная галочка согласия на обработку персональных данных: обязательная, не отмеченная
    заранее, со ссылкой на privacy.html. Кнопка отправки type="submit" называется так же, как главное действие вашего
    проекта. Кнопку главного действия вверху страницы направьте на форму: href="#zayavka". Эпоха: 4.'
  checks:
  - 'Заявка отправляется методом POST: напишите method="post" у form.'
  - 'У form нужен action: адрес, на который уходят данные, например action="/zayavka".'
  - 'У какого-то поля нет подписи label. Свяжите их: for у label равно id у поля.'
  - Телефон или почта ещё обычный текст. Поставьте type="tel" или type="email".
  - 'Добавьте атрибут autocomplete хотя бы двум полям: name и tel.'
  - 'Хотя бы два поля (имя и телефон) должны быть обязательными: атрибут required.'
  - 'Нужна галочка согласия: input type="checkbox" с атрибутом required.'
  - 'Галочка согласия не должна быть отмечена заранее: уберите атрибут checked.'
  - 'Рядом с галочкой нужна ссылка на политику обработки данных: href="privacy.html".'
  - Текст кнопки отправки должен быть вашим главным действием, как оно написано в брифе.
  - 'Полей слишком много. Оставьте только нужное для вашего главного действия: до четырёх полей без галочек.'
  - 'Кнопка главного действия вверху страницы теперь ведёт к форме: href="#zayavka", а у section с формой id="zayavka".'
  sources:
