- id: 02-html/05-tables
  order: 5
  title: 'Таблицы: для данных, не для раскладки'
  summary: 'Таблица нужна, когда у вас действительно есть строки и столбцы: цены, расписание, сравнение тарифов. После
    урока вы строите таблицу с заголовками и подписью, понимаете, чем она отличается от старой табличной раскладки, и
    знаете, где таблица уместна.'
  minutes: 15
  teaches:
  - html-data-tables
  requires:
  - html-legacy-layout
  - html-semantic-elements
  diagram: 'content/diagrams/TableReader.svelte: одна таблица с th и scope и без них; выбор ячейки показывает, что скажет
    диктор. Строки из брифа человека.'
  practice: 'Добавьте на страницу таблицу. Сделайте для неё section с заголовком h2 «Условия и цены» (или своим). В нём
    table: сначала caption, потом thead с заголовками столбцов th scope="col" (позиция, что входит, цена), потом tbody.
    В каждой строке название позиции из вашего брифа это th scope="row", а описание и цена это td. Если у вас нет услуг
    и цен, сделайте таблицу «Режим работы» с теми же частями: столбцы «День» и «Часы». Атрибутов оформления (width,
    border, cellpadding) в таблице быть не должно. Эпоха: 2. Продолжает шаг links-images.'
  checks:
  - На странице нет таблицы. Добавьте <table> в отдельный section.
  - 'Первой в таблице должна идти подпись <caption>: о чём таблица.'
  - 'В thead нужны заголовки столбцов <th scope="col">: не меньше двух.'
  - Каждая строка данных начинается с заголовка строки <th scope="row"> с названием позиции. Строк должно быть столько,
    сколько у вас услуг или товаров.
  - В таблице должны быть названия ваших услуг или товаров из брифа.
  - 'В таблице остались атрибуты оформления (width, border, cellpadding, valign). Уберите их: вид задаст CSS.'
  - Таблица внутри таблицы не нужна. Оставьте одну плоскую таблицу.
  sources:
  - title: HTML table basics (MDN)
    url: https://developer.mozilla.org/en-US/docs/Learn_web_development/Core/Structuring_content/HTML_table_basics
    licence: CC-BY-SA
    kind: course
    lang: en
  - title: HTML table advanced features and accessibility (MDN)
    url: https://developer.mozilla.org/en-US/docs/Learn_web_development/Core/Structuring_content/Table_accessibility
    licence: CC-BY-SA
    kind: course
    lang: en
  - title: Tables Tutorial (W3C WAI)
    url: https://www.w3.org/WAI/tutorials/tables/
    licence: link-only
    kind: course
    lang: en
