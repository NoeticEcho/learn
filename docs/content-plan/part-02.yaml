- id: 02-html/09-languages
  order: 9
  title: 'Языки сайта: lang, hreflang и перевод'
  summary: Если сайт на двух языках, поисковикам и программам чтения надо сказать, где какой, а адреса не должны путаться.
    После урока вы размечаете язык страницы и её переводов и знаете, почему машинный перевод юридических текстов
    рискован.
  minutes: 15
  teaches:
  - html-lang-i18n
  requires:
  - html-head-meta
  - html-a11y-basics
  diagram: 'content/diagrams/HreflangMap.svelte: две версии страницы, язык посетителя и взаимность связи hreflang;
    показывает, какую версию покажут и почему.'
  practice: 'Разметьте языки страницы по полю languages из брифа. У html должен стоять lang="ru". В head добавьте для
    каждого языка сайта link rel="alternate" с hreflang и полным адресом (например https://zarechye.example/ru/ и
    https://zarechye.example/en/), а ещё запись x-default для случая, когда ни один язык не подошёл. Если у проекта есть
    английская версия, добавьте в шапку навигацию с ссылкой на неё: в ссылке hreflang="en" и lang="en", подпись
    по-английски. Если язык один, оставьте самоссылку и x-default, место под будущий второй язык уже готово. Эпоха: 4.
    Продолжает шаг a11y-pass.'
  checks:
  - У html должен быть lang="ru".
  - 'Страница должна указывать и на себя: link rel="alternate" с hreflang="ru".'
  - 'Добавьте запись x-default: link rel="alternate" hreflang="x-default".'
  - Адреса в hreflang должны быть полными и начинаться с https://.
  - 'У вашего сайта есть английская версия: нужна запись hreflang="en".'
  - Добавьте в навигацию ссылку на английскую версию с атрибутами hreflang="en" и lang="en".
  sources:
  - title: lang (MDN)
    url: https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Global_attributes/lang
    licence: CC-BY-SA
    kind: docs
    lang: en
