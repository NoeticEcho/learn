    licence: CC-BY
    kind: spec
    lang: en
  - title: 'Learn HTML: Semantic HTML (web.dev)'
    url: https://web.dev/learn/html/semantic-html
    licence: CC-BY
    kind: course
    lang: en
  - title: Семантика в HTML — Дока
    url: https://doka.guide/html/semantics/
    licence: link-only
    kind: docs
    lang: ru
