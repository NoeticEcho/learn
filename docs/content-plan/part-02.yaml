- id: 02-html/06-head-meta-og
  order: 6
  title: Head, мета-теги и Open Graph
  summary: 'Зачем: то, что невидимо на странице, решает, как её найдут и как покажут в поиске, в VK, Telegram и мессенджерах.
    После урока вы заполняете title, description, кодировку, viewport и Open Graph для своего проекта.'
  minutes: 20
  teaches:
  - html.head-meta
  - html.open-graph
  requires:
  - html.document-structure
  - net.http-status-headers
  diagram: 'Редактор head и три превью: сниппет в поиске, карточка ссылки в мессенджере и вкладка браузера; при вводе title
    и description строки в превью обрезаются на реальных пределах длины.'
  practice: 'Человек пишет для каждой страницы своего проекта title и description из полей title, who и forWhom, задаёт кодировку
    и viewport, добавляет og:title, og:description, og:image и og:locale. Эпоха: 4 (2014), когда ссылки массово шарят в соцсетях
    и мессенджерах.'
  checks:
  - У каждой страницы свой title, непустой и не длиннее 70 символов
  - description есть и отличается от title, длина до 160 символов
  - Объявлена кодировка UTF-8 и viewport с шириной устройства
  - Заданы og:title, og:description и og:image с абсолютным адресом
  sources:
  - title: What's in the head? Web page metadata
    url: https://developer.mozilla.org/en-US/docs/Learn_web_development/Core/Structuring_content/Webpage_metadata
    licence: CC-BY-SA
