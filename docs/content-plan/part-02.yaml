- id: 02-html/07-accessibility
  order: 7
  title: 'Доступность: сайт для всех'
  summary: 'Зачем: доступный сайт читают люди с нарушениями зрения и слуха, на клавиатуре и в шумной электричке, а поисковики
    видят его лучше. После урока вы проверяете страницу по основным принципам WCAG и знаете, когда ARIA не нужна.'
  minutes: 25
  teaches:
  - html.a11y-basics
  - html.aria-first-rule
  requires:
  - html.forms
  - html.images
  - html.heading-outline
  diagram: 'Страница в трёх режимах: обычный, только с клавиатуры (видно порядок фокуса) и в виде текста для экранного диктора;
    навёл на элемент и увидел, что о нём скажет диктор, с ARIA и без неё.'
  practice: 'Человек проверяет страницу проекта: порядок табуляции, видимость фокуса, текстовые альтернативы, подписи полей,
    ссылку «перейти к содержимому». Находит и исправляет не меньше трёх проблем. Эпоха: 4 (2014).'
  checks:
  - Все интерактивные элементы доступны с клавиатуры в логичном порядке
  - Есть ссылка «перейти к содержимому» и язык страницы в атрибуте lang
  - У каждого содержательного изображения есть alt, у каждого поля есть label
  - ARIA используется только там, где нет подходящего родного элемента
  sources:
  - title: 'HTML: A good basis for accessibility'
    url: https://developer.mozilla.org/en-US/docs/Learn_web_development/Core/Accessibility/HTML
    licence: CC-BY-SA
    kind: course
    lang: en
  - title: What is accessibility?
    url: https://developer.mozilla.org/en-US/docs/Learn_web_development/Core/Accessibility/What_is_accessibility
    licence: CC-BY-SA
    kind: course
    lang: en
  - title: Learn Accessibility
    url: https://web.dev/learn/accessibility
    licence: CC-BY
    kind: course
    lang: en
  - title: Web Content Accessibility Guidelines (WCAG) 2.2
    url: https://www.w3.org/TR/WCAG22/
    licence: link-only
    kind: spec
    lang: en
  - title: Using ARIA
    url: https://www.w3.org/TR/using-aria/
    licence: link-only
    kind: spec
    lang: en
  videos: []
- id: 02-html/08-languages
  order: 8
  title: 'Языки сайта: lang, hreflang и перевод'
  summary: 'Зачем: если сайт на двух языках, поисковикам и экранным дикторам надо сказать, где какой, а адреса не должны путаться.
    После урока вы размечаете язык страницы и её переводов и знаете, почему машинный перевод юридических текстов рискован.'
  minutes: 15
  teaches:
  - html.lang-i18n
  requires:
  - html.head-meta
  - html.a11y-basics
  diagram: Две страницы рядом (ru и en) со связями hreflang; переключатель показывает, какую версию получит посетитель с языком
    браузера ru, en или де, и что будет, если связь односторонняя.
  practice: 'Человек размечает язык каждой страницы по полю languages: lang в html, ссылки на переводы с hreflang и отдельные
    адреса. Фрагменты на другом языке получают свой lang. Если язык один, добавляется заготовка адресов для будущего второго.
    Эпоха: 4 (2014).'
  checks:
  - У html задан lang, совпадающий с языком текста страницы
  - Для каждого языка из languages есть ссылка на перевод с hreflang и она взаимная
  - Фразы на другом языке внутри страницы размечены собственным lang
  sources:
  - title: lang HTML global attribute
    url: https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Global_attributes/lang
    licence: CC-BY-SA
    kind: docs
    lang: en
  - title: Declaring language in HTML (W3C)
    url: https://www.w3.org/International/questions/qa-html-language-declarations
