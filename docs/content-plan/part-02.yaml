- id: 02-html/02-page-1996
  order: 2
  title: 'Страница 1996 года: таблицы, font и счётчик'
  summary: 'Вы соберёте страницу так, как это делали в 1996-м: таблицей, тегами font и счётчиком посетителей. После урока
    вы сможете прочитать любую старую вёрстку и объяснить, почему так больше не пишут.'
  minutes: 25
  teaches:
  - html-legacy-layout
  requires:
  - html-document-structure
  - html-tags-attributes
  diagram: 'content/diagrams/LegacyPage.svelte: страница 1996 года в рамке, включается сетка таблицы, ширина окна сужается
    до телефона, а список под рамкой показывает, как диктор читает ячейки.'
  practice: 'Возьмите свою первую страницу и соберите из неё сайт, как в 1996-м. Положите всё в таблицу: в первой строке
    на две ячейки название проекта в h1 (белым цветом на тёмном фоне, через тег font), во второй строке слева ячейка
    меню со ссылками на все разделы, справа ячейка с описанием, главным действием и списком услуг или товаров. Цвет фона
    страницы задайте атрибутом bgcolor у body. Внизу добавьте картинку-счётчик посетителей counter.gif с описанием в
    alt. Самого файла у нас нет, поэтому в предпросмотре вместо картинки вы увидите её описание. Эпоха: 1. Продолжает
    шаг first-page.'
  checks:
  - 'Раскладка делается таблицей: оберните всё содержимое в <table>, строки в <tr>, ячейки в <td>.'
  - Для оформления в 1996-м был тег <font>. Поставьте его хотя бы вокруг названия в заголовке.
  - У <body> нужен атрибут bgcolor с цветом, например bgcolor="#ffffcc".
  - В заголовке h1 должно стоять название вашего проекта, как в первом уроке.
  - В меню должна быть ссылка <a> для каждого раздела вашего проекта, внутри таблицы.
  - В таблице должны быть названия ваших услуг или товаров из брифа.
  - 'У картинки-счётчика должен быть непустой alt: это её описание для тех, кто картинку не видит.'
  sources:
  - title: Spacer GIF (Википедия)
    url: https://en.wikipedia.org/wiki/Spacer_GIF
    licence: CC-BY-SA
    kind: article
    lang: en
