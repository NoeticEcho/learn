<!doctype html>
<html lang="ru" data-theme="ink">
	<head>
		<meta charset="utf-8" />
		<!--
			Nothing reaches a third party unless the person asks (spec §4.1, §9): the model APIs only
			for their own key, the video hosts only behind a click. A srcdoc preview inherits this
			policy, so frame-src also stops a practice page from navigating its frame to another site;
			scripts stay 'unsafe-inline' because the preview runs the person's inline code, and its
			own stricter policy (sandbox.ts) blocks its network.
		-->
		<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; media-src 'self'; connect-src 'self' https://api.anthropic.com https://api.openai.com https://openrouter.ai; frame-src 'self' https://www.youtube-nocookie.com https://vkvideo.ru https://vk.com; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'" />
		<meta name="referrer" content="no-referrer" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="color-scheme" content="dark light" />
		<meta name="theme-color" content="#0A0B09" />
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/icon-192.png" />
		<script>
			// Before paint: the theme the person chose, else the system's, else Ink.
			try {
				var t = localStorage.getItem('learn.theme');
				var l = matchMedia('(prefers-color-scheme: light)').matches;
				document.documentElement.dataset.theme = t === 'ink' || t === 'paper' ? t : l ? 'paper' : 'ink';
			} catch (e) {
				document.documentElement.dataset.theme = 'ink';
			}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
