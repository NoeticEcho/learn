# The English edition's pronunciation lexicon for narration (docs/narration.md), the counterpart of ru.yaml.
# Applied after a lesson's own `say` map, which wins. Nothing here reaches the page.
#
# The English edition has no voice chosen yet and no audio; this is what the samples are made from. It is
# short on purpose: English lessons already carry `say` maps for the terms they use, written the way the
# author wants them read («H T M L», «F twelve»), and a model that speaks English needs no help with
# «Netscape» or «Cloudflare» the way a Russian reading does. What is here is what an English reader
# says in a way the spelling does not show. Not yet checked by ear.

# How a Latin letter is named when an unmapped acronym (two to six capitals) is spelt out: «CSS» → «see ess ess».
# Written as words, not as the letters: the model may read a bare «A» as the article.
letters:
  A: ay
  B: bee
  C: see
  D: dee
  E: ee
  F: eff
  G: gee
  H: aitch
  I: eye
  J: jay
  K: kay
  L: el
  M: em
  N: en
  O: oh
  P: pee
  Q: cue
  R: ar
  S: ess
  T: tee
  U: you
  V: vee
  W: double-you
  X: ex
  Y: why
  Z: zee

# Acronyms read as words, not spelt.
keep:
  - NASA
  - ARPA
  - ARIA
  - CORS
  - DOM
  - REST
  - WYSIWYG
  # HTTP methods and SQL keywords are words: «POST» is «post», not «pee oh ess tee»
  - GET
  - POST
  - PUT
  - PATCH
  - DELETE
  - HEAD
  - OPTIONS
  - SELECT
  - INSERT
  - UPDATE
  - FROM
  - WHERE
  - JOIN
  - LEFT
  - RIGHT
  - GROUP
  - ORDER
  - LIMIT
  - COUNT
  - NULL
  - LIKE
  - NOT
  - AND
  - ANALYZE
  - EXPLAIN
  - TODO
  - NOTE

stress: []

words:
  # the parts of an address
  io: eye oh
  ru: R U
  su: S U
  www: double-you double-you double-you
  # file types and formats
  html: H T M L
  css: C S S
  js: J S
  json: Jason
  JSON: Jason
  php: P H P
  xml: X M L
  svg: S V G
  png: P N G
  jpg: jay-peg
  JPEG: jay-peg
  GIF: gif
  WebP: web P
  AVIF: ay-vif
  md: M D
  txt: T X T
  # protocols and terms read in a way the spelling does not show
  http: H T T P
  https: H T T P S
  IPv4: I P version four
  IPv6: I P version six
  OAuth: oh-auth
  WCAG: wuh-cag
  CAPTCHA: cap-cha
  ASCII: ask-ee
  SaaS: sass
  GraphQL: graph Q L
  SQL: sequel
  SQLite: S Q lite
  MySQL: my S Q L
  PostgreSQL: post-gres Q L
  MongoDB: mongo D B
  nginx: engine X
  npm: N P M
  iOS: eye O S
  macOS: mac O S
  Wi-Fi: why-fye
  CERN: sern
  'Node.js': node J S
  Kubernetes: koo-ber-net-eez
  GitHub: git-hub
  Ctrl: control
  Cmd: command
  Esc: escape
  OK: okay
  ch: see aitch
  uk: you kay
  W3C: double-you three see
  WHATWG: what W G
  h1: H one
  h2: H two
  h3: H three
  h4: H four
  h5: H five
  h6: H six
  H1: H one
  H2: H two
  H3: H three
  'A/B': A B
