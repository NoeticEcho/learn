# The course's pronunciation lexicon for narration (docs/narration.md). Applied after a lesson's
# own `say` map, which wins. Nothing here reaches the page: it changes what the voice says only.
# A change here re-renders every section whose spoken text it changes, and no other.

# How a Latin letter is named when an unmapped acronym (two to six capitals) is spelt out:
# «CSS» → «си-эс-эс». The names are the ones Russian speakers use for these acronyms.
letters:
  A: эй
  B: би
  C: си
  D: ди
  E: и
  F: эф
  G: джи
  H: эйч
  I: ай
  J: джей
  K: кей
  L: эль
  M: эм
  N: эн
  O: оу
  P: пи
  Q: кью
  R: эр
  S: эс
  T: ти
  U: ю
  V: ви
  W: дабл-ю
  X: экс
  Y: уай
  Z: зед

# Acronyms left as they are written: none yet. An acronym said as a word goes in `words`.
keep: []

# Words the voice stresses wrongly, with a combining acute (U+0301) after the stressed vowel.
# The engine is given the stressed vowel as a capital (script.ts, stressMark).
stress: []

# Written form → spoken form, for the whole course.
