# The English edition's words for content/curriculum.yaml (docs/content-plan/README.md, «English
# edition»). The structure lives there and only there: part numbers, slugs and eras, concept ids
# and which part teaches each. This file gives every part and every concept its English title, and
# `npm run content:check` fails when one is missing or names a part or a concept that does not exist.
#
# These titles are the English edition's glossary: a lesson uses a concept's title as its term.
# Headings and titles are in sentence case. License of this file's text: CC BY-SA 4.0.

parts:
  00-start: { title: 'Start', summary: 'How to learn here, and what your site will be about.' }
  01-internet: { title: 'How the internet works', summary: 'From ARPANET to the web: packets, DNS, HTTP and how a browser draws a page.' }
  02-html: { title: 'HTML', summary: 'The document, tags, meaningful markup, links, forms and accessibility.' }
  03-css: { title: 'CSS', summary: 'The cascade, boxes, typography, color, flexbox, grid and responsive layout.' }
  04-design: { title: 'Design and design systems', summary: 'The history of web design, hierarchy, color, tokens and how to read a design system.' }
  05-javascript: { title: 'JavaScript', summary: 'Values, functions, the DOM, events, fetch and components.' }
  06-server: { title: 'Servers and languages', summary: 'What a web server is, why each language lives where it does, and what an API is.' }
  07-data: { title: 'Data', summary: 'Databases, SQL on a real Postgres in the browser, search and privacy.' }
  08-cms: { title: 'CMSs, generators and Jamstack', summary: 'WordPress, website builders, static site generators and headless CMSs.' }
  09-infrastructure: { title: 'Infrastructure', summary: 'Hosting, domains, certificates, CDNs, containers and CI/CD.' }
  10-writing: { title: 'Writing for the web', summary: 'How people read on screens, plain style, headlines and microcopy.' }
  11-copywriting: { title: 'Copywriting and marketing frameworks', summary: 'AIDA, PAS, JTBD, StoryBrand, funnels and the value ladder.' }
  12-storytelling: { title: 'Storytelling', summary: 'Why stories work, and a dozen ways to tell yours.' }
  13-growth: { title: 'Marketing and growth', summary: 'Automation, email, social media, SEO and GEO, and the rules that apply.' }
  14-metrics: { title: 'Metrics and behavior', summary: 'Bounces, conversions, cohorts, A/B tests and their traps.' }
  15-quality: { title: 'Quality and the law', summary: 'Speed, accessibility, security, data protection, advertising rules and a launch checklist.' }
  16-ai: { title: 'AI and the future of the web', summary: 'AI site builders, vibe coding, the agentic web and Iskin.' }

