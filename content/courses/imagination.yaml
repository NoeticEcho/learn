# Making things beside a model without losing your own taste (docs/specs/2026-11-01-platform-design.md §7.2).
# Copyright is `law`'s; this course only sends the reader there.
id: imagination
history: true
title: { ru: "Воображение: делать вместе с моделью и не терять вкус", en: "Imagination: making things beside a model, keeping your taste" }
tagline:
  ru: "Что известно о творчестве, как растёт вкус и как использовать генератор текста, картинок и музыки как набросок, а не как замену."
  en: "What is known about creativity, how taste grows, and how to use a generator of text, images or music as a sketch, not as a stand-in."
about:
  ru: "Курс для всех, кто что-то делает: пишет, рисует, сочиняет, снимает, пусть даже для себя. Вы разберётесь, что о творчестве подтверждено, начнёте замечать, как машина тянет к среднему, и сможете доводить свои вещи до конца. Авторское право разобрано в курсе о праве, а здесь вопрос другой: чьё это на самом деле и нравится ли оно вам."
  en: "A course for anyone who makes things: writing, drawing, composing, filming, even just for themselves. You will sort out what is established about creativity, start to notice how a machine pulls toward the average, and be able to take your own things through to the end. Copyright is covered in the course on law, and the question here is another one: whose is this really, and do you like it."
parts:
  - id: what-is-known
    title: { ru: "Что известно о творчестве", en: "What is known about creativity" }
    summary:
      ru: "Про творчество говорят много уверенного, и часть этого проверялась, а часть нет."
      en: "A lot is said with confidence about creativity; some of it has been tested and some of it has not."
    lessons:
      - id: creativity-tests
        title: { ru: "Что измеряют тесты на творчество", en: "What creativity tests measure" }
        summary:
          ru: "Задания вроде «придумайте применения кирпичу» считают идеи: что это говорит о вас и что значит, когда такой тест проходит модель."
          en: "Tasks like “think of uses for a brick” count ideas: what that says about you, and what it means when a model takes the test."
      - id: brainstorming-in-a-group
        title: { ru: "Мозговой штурм в группе", en: "Brainstorming in a group" }
        summary:
          ru: "Группы придумывают меньше, чем столько же людей порознь, и главная причина проста: все ждут своей очереди говорить."
          en: "Groups come up with fewer ideas than the same number of people working apart, and the main reason is simple: everyone waits their turn to speak."
      - id: creative-hemisphere
        title: { ru: "Миф о творческом полушарии", en: "The myth of the creative hemisphere" }
        summary:
          ru: "Откуда пошло деление на «левополушарных» и «правополушарных» и почему на нём нельзя строить ни обучение, ни мнение о себе."
          en: "Where the split into “left-brained” and “right-brained” people came from, and why neither teaching nor your view of yourself should be built on it."
      - id: put-it-down
        title: { ru: "Отложить и вернуться", en: "Put it down and come back" }
        summary:
          ru: "Помогает ли перерыв решить задачу: что в этом есть, что добавили рассказы об озарениях и как проверить это на своей работе."
          en: "Does a break help you solve a problem: what is really there, what stories of sudden insight have added, and how to test it on your own work."
      - id: more-attempts
        title: { ru: "Больше попыток", en: "More attempts" }
        summary:
          ru: "Верно ли, что количество рождает качество: что в этой идее можно подтвердить, а что держится на красивых историях."
          en: "Does quantity produce quality: what in the idea can be supported, and what rests on pretty stories."
  - id: taste
    title: { ru: "Вкус", en: "Taste" }
    summary:
      ru: "Вкус нельзя скачать, и мы считаем его главным умением рядом с генератором, потому что выбирать теперь приходится чаще, чем делать."
      en: "Taste cannot be downloaded, and we hold it to be the main skill beside a generator, because now you choose more often than you make."
    lessons:
      - id: what-taste-is
        title: { ru: "Что такое вкус", en: "What taste is" }
        summary:
          ru: "Можно ли спорить о вкусах: суждение, привычка или знак своего круга, и что из этого полезно тому, кто сам что-то делает."
          en: "Is there any arguing about taste: a judgment, a habit or a badge of your circle, and which of these is useful to someone who makes things."
      - id: other-peoples-likes
        title: { ru: "Чужие лайки и ваш вкус", en: "Other people’s likes and your taste" }
        summary:
          ru: "Известный опыт с незнакомыми песнями: когда видны чужие скачивания, успех становится неравнее и непредсказуемее."
          en: "A well-known experiment with unknown songs: when other people’s downloads are visible, success gets more unequal and harder to predict."
      - id: gap-between-taste-and-skill
        title: { ru: "Разрыв между вкусом и умением", en: "The gap between taste and skill" }
        summary:
          ru: "Мысль Айры Гласса: у новичка вкус опережает умение, и разрыв закрывается объёмом работы, а генератор убирает его только с виду."
          en: "Ira Glass’s point: a beginner’s taste outruns their skill and volume of work closes the gap, and a generator removes it only on the surface."
      - id: how-taste-grows
        title: { ru: "Как растёт вкус", en: "How taste grows" }
        summary:
          ru: "Смотреть много и вне ленты, сравнивать, объяснять, почему одно лучше другого: больших исследований за этим нет, и мы говорим об этом прямо."
          en: "Looking at a lot outside the feed, comparing, explaining why one thing beats another: no large studies stand behind this, and we say so plainly."
  - id: sketch
    title: { ru: "Модель как набросок", en: "The model as a sketch" }
    summary:
      ru: "Генератор полезен там, где вы потом отбрасываете почти всё, что он сделал."
      en: "A generator is useful where you go on to throw away nearly everything it made."
    lessons:
      - id: stories-that-look-alike
        title: { ru: "Идеи от модели и похожие рассказы", en: "Ideas from a model, and stories that look alike" }
        summary:
          ru: "С идеями от модели рассказы оценивают выше, особенно у менее творческих авторов, а сами рассказы становятся похожи друг на друга."
          en: "With ideas from a model stories get rated higher, above all from less creative writers, and they come to resemble one another."
      - id: text-as-a-sketch
        title: { ru: "Текст как набросок", en: "Text as a sketch" }
        summary:
          ru: "Как просить у модели варианты и возражения, а не готовую вещь, и как работать так, чтобы от первой версии мало что осталось."
          en: "How to ask a model for options and objections, not a finished piece, and how to work so that little of the first version survives."
      - id: first-image-sticks
        title: { ru: "Первая картинка прилипает", en: "The first image sticks" }
        summary:
          ru: "Увидев готовый пример, трудно придумать другое: зачем сначала набросать своё и как превратить варианты в подборку образцов."
          en: "Once you have seen a finished example it is hard to think of anything else: why to sketch your own first, and how to use outputs as a reference board."
      - id: music-as-a-rough-draft
        title: { ru: "Музыка как черновик", en: "Music as a rough draft" }
        summary:
          ru: "Что генератор музыки даёт тому, кто играет, и тому, кто не играет, и почему готовая песня не то же самое, что ваша песня."
          en: "What a music generator offers someone who plays and someone who does not, and why a finished song is not the same as your song."
  - id: your-own-work
    title: { ru: "Своя вещь", en: "Your own work" }
    summary:
      ru: "Чья это работа и доведена ли она до конца: два вопроса, которые машина за вас не решит."
      en: "Whose work it is and whether it got finished: two questions a machine will not settle for you."
    lessons:
      - id: whose-work-is-this
        title: { ru: "Чья это работа", en: "Whose work is this" }
        summary:
          ru: "Мастерские и писатели за чужой подписью были всегда: что делает вещь вашей, если кто-то помогал, и кому об этом сказать."
          en: "Workshops and ghostwriters have always existed: what makes a thing yours when someone helped, and whom to tell."
      - id: keeping-your-voice
        title: { ru: "Как сохранить свой голос", en: "Keeping your voice" }
        summary:
          ru: "Подсказки модели незаметно тянут письмо к чужому усреднённому стилю: как заметить это у себя и вернуть своё."
          en: "A model’s suggestions quietly pull your writing toward someone else’s averaged style: how to notice that and take it back."
      - id: fifty-words
        title: { ru: "Пятьдесят слов", en: "Fifty words" }
        summary:
          ru: "Доктор Сьюз написал «Зелёные яйца и ветчину» на спор, уложившись в 50 слов: как поставить себе рамку, когда генератор может всё."
          en: "Dr. Seuss wrote Green Eggs and Ham on a bet to use only 50 words: how to set yourself a limit when a generator can do anything."
      - id: getting-it-finished
        title: { ru: "Довести до конца", en: "Getting it finished" }
        summary:
          ru: "Начинать с генератором стало почти бесплатно, и потому законченная вещь весит больше: как решить, что хватит, и показать её людям."
          en: "Starting anything with a generator now costs next to nothing, so finishing counts for more: how to decide it is enough, and show it to people."
      - id: when-everything-looks-alike
        title: { ru: "Заглянем вперёд: когда всё станет похоже", en: "A look ahead: when everything looks alike" }
        summary:
          ru: "Поток одинаковых вещей и спрос на работу с очевидным автором: что может случиться за несколько лет, и всё это пока гипотезы."
          en: "A flood of similar content and demand for work with an obvious author: what may happen in the next few years, and all of it is hypothesis so far."
        ahead: true
