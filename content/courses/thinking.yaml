# Memory and writing when a machine remembers and drafts for you (docs/specs/2026-11-01-platform-design.md §7.2).
# Keeping a skill and your own thought is this course's; acquiring a new one is `learning`'s (§7.3), and the
# craft of delegating is `work-with-ai`'s.
id: thinking
history: true
title: { ru: "Память и письмо: думать, когда машина помнит и пишет", en: "Memory and writing: thinking when a machine remembers and drafts" }
tagline:
  ru: "Что отдать машине, а что оставить себе: память, письмо, чтение и навыки, которые могут уйти, если ими не пользоваться."
  en: "What to hand to the machine and what to keep: memory, writing, reading and the skills that can fade when you stop using them."
about:
  ru: "Курс для тех, кто уже просит машину напомнить, пересказать и написать черновик и не хочет незаметно разучиться делать это сам. Вы увидите, что показывают исследования и какие из них не подтвердились, и сможете решить, что поручить машине, когда писать первым и как поддерживать навык, который у вас уже есть. Как осваивать новый навык, разбирает другой курс этого раздела."
  en: "A course for people who already ask a machine to remind, summarize and draft, and do not want to quietly lose the ability to do it themselves. You will see what research shows and which of it did not hold up, and be able to decide what to hand over, when to write first and how to maintain a skill you already have. Acquiring a new skill is the subject of another course in this strand."
parts:
  - id: handing-over
    title: { ru: "Что мы отдаём машине", en: "What we hand to the machine" }
    summary:
      ru: "Выносить память наружу люди начали задолго до чат-ботов, и вопрос всегда был в том, что остаётся внутри."
      en: "People began moving memory outside their heads long before chatbots, and the question has always been what stays inside."
    lessons:
      - id: socrates-on-writing
        title: { ru: "Сократ против письма", en: "Socrates against writing" }
        summary:
          ru: "В «Федре» Платона письмо обвиняют в том, что оно ослабит память: что в этом страхе оказалось верным, а что нет."
          en: "In Plato’s Phaedrus writing is accused of weakening memory: what in that fear turned out right, and what did not."
      - id: cognitive-offloading
        title: { ru: "Что такое когнитивная разгрузка", en: "What cognitive offloading is" }
        summary:
          ru: "Список покупок, калькулятор и чат-бот разгружают голову по-разному, и вся суть в том, как именно."
          en: "A shopping list, a calculator and a chatbot all take load off your mind, and the differences between them are the whole point."
      - id: google-effect
        title: { ru: "Эффект Google: что устояло", en: "The Google effect: what survived" }
        summary:
          ru: "Часть знаменитого опыта о памяти и поиске в сети повторить не удалось: что устояло, а что остаётся открытым."
          en: "Part of the famous experiment on memory and web search failed to replicate: what stood up, and what is still open."
      - id: when-offloading-helps
        title: { ru: "Когда разгрузка помогает", en: "When offloading helps" }
        summary:
          ru: "Когда запись освобождает голову для следующего дела и почему это работает, только если вы доверяете тому, куда записали."
          en: "When writing something down frees your head for the next thing, and why that works only if you trust where you put it."
      - id: illusion-of-knowing
        title: { ru: "Иллюзия, что ты это знаешь", en: "The illusion that you know it" }
        summary:
          ru: "Поиск заставляет выше оценивать собственные знания, и стоит спросить, что делает с этой оценкой готовый ответ чат-бота."
          en: "Searching the web makes people rate their own knowledge higher, and it is worth asking what a chatbot’s ready answer does to that rating."
  - id: writing
    title: { ru: "Письмо как мышление", en: "Writing as thinking" }
    summary:
      ru: "Черновик, который написала машина, вы прочитали, а не обдумали, и разница между этими действиями здесь главная."
      en: "A draft the machine wrote is one you read, not one you thought through, and the difference between those two acts is the point here."
    lessons:
      - id: generation-effect
        title: { ru: "Эффект генерации", en: "The generation effect" }
        summary:
          ru: "То, что вы произвели сами, запоминается лучше прочитанного, и это один из самых надёжных результатов о памяти."
          en: "What you produce yourself is remembered better than what you only read, and that is one of the sturdier findings about memory."
      - id: thinking-on-paper
        title: { ru: "Думать на бумаге", en: "Thinking on paper" }
        summary:
          ru: "Многие говорят, что понимают мысль, только записав её: что здесь проверено, а что остаётся личным опытом."
          en: "Many writers say they understand a thought only once it is written down: what of that has been tested, and what is personal experience."
      - id: draft-first
        title: { ru: "Сначала черновик, потом вопрос", en: "Draft first, ask second" }
        summary:
          ru: "Простое правило, когда писать первым самому, чтобы мысль осталась вашей; как поручать работу модели, разбирает курс о работе с машиной."
          en: "A simple rule for when to write first yourself so the thought stays yours; how to delegate to a model is in the course on working with one."
      - id: draft-that-thinks
        title: { ru: "Черновик, который думает за вас", en: "The draft that thinks for you" }
        summary:
          ru: "Помощник с заданным мнением может сдвинуть и ваши взгляды, поэтому надо уметь замечать, что довод уже не ваш."
          en: "An assistant set to hold an opinion can shift your own views too, so you need to be able to notice when an argument is no longer yours."
  - id: notes-and-reading
    title: { ru: "Заметки и чтение", en: "Notes and reading" }
    summary:
      ru: "Конспект и чтение длинного теперь можно поручить, и потому важно понимать, что именно при этом теряется."
      en: "Note-taking and long reading can now be delegated, so it matters to understand what exactly gets lost."
    lessons:
      - id: hand-or-keyboard
        title: { ru: "Рукой или на клавиатуре", en: "By hand or on a keyboard" }
        summary:
          ru: "Знаменитый опыт в пользу конспекта от руки, повтор, который его не подтвердил, и что всё это значит для заметок, которые пишет машина."
          en: "The famous experiment in favor of notes by hand, the replication that did not bear it out, and what follows for notes a machine takes."
      - id: notes-you-return-to
        title: { ru: "Заметки, к которым возвращаются", en: "Notes you come back to" }
        summary:
          ru: "Картотека Лумана и индустрия «второго мозга»: что система заметок даёт, чего не даёт и что меняет поиск по ней с помощью модели."
          en: "Luhmann’s card index and the “second brain” industry: what a note system gives you, what it does not, and what a model searching it changes."
      - id: long-text-on-screen
        title: { ru: "Длинный текст на экране", en: "A long text on a screen" }
        summary:
          ru: "С экрана длинное понимают немного хуже, особенно в спешке: как читать всерьёз, когда отвлекает всё вокруг."
          en: "Long texts are understood somewhat worse on a screen, especially in a hurry: how to read seriously with everything pulling at you."
      - id: what-a-summary-loses
        title: { ru: "Что теряет пересказ", en: "What a summary loses" }
        summary:
          ru: "Когда пересказа от модели достаточно, а когда нужен сам текст с его ходом мысли и местами, где автор сомневается."
          en: "When a model’s summary is enough, and when you need the text itself, with its line of thought and the places where the author hesitates."
  - id: keeping-a-skill
    title: { ru: "Как не потерять навык", en: "Keeping a skill" }
    summary:
      ru: "Авиация и медицина давно живут рядом с автоматикой, и их опыт полезнее любых прогнозов, хотя и он неоднозначен."
      en: "Aviation and medicine have long lived beside automation, and their experience is worth more than any forecast, though it is not clear-cut either."
    lessons:
      - id: irony-of-automation
        title: { ru: "Ирония автоматизации", en: "The irony of automation" }
        summary:
          ru: "Мысль Лизанны Бейнбридж: чем лучше автоматика, тем меньше у человека практики и тем труднее ему вмешаться, когда она откажет."
          en: "Lisanne Bainbridge’s point: the better the automation, the less practice a person gets, and the harder it is to step in when it fails."
      - id: what-pilots-lose
        title: { ru: "Что пилоты теряют, а что нет", en: "What pilots lose and what they keep" }
        summary:
          ru: "Что у пилотов рядом с автопилотом ослабевает, что сохраняется и почему авиация сама советует чаще летать вручную."
          en: "What weakens in pilots beside the autopilot, what holds up, and why aviation itself urges more flying by hand."
      - id: doctors-and-gps
        title: { ru: "Врачи и навигаторы", en: "Doctors and GPS" }
        summary:
          ru: "Врачи, привыкшие к подсказке ИИ, и водители, привыкшие к навигатору: что уже измерено и почему выводы пока осторожные."
          en: "Doctors used to an AI prompt and drivers used to GPS: what has been measured so far, and why the conclusions are still cautious."
      - id: skill-maintenance-plan
        title: { ru: "Как поддерживать навык", en: "A maintenance plan for a skill" }
        summary:
          ru: "Какие умения вы не готовы потерять, как часто работать без машины и как проверять себя задачей, а не ощущением."
          en: "Which abilities you are not willing to lose, how often to work without the machine, and how to test yourself with a task, not a feeling."
      - id: skill-nobody-kept
        title: { ru: "Заглянем вперёд: навык, который никто не поддерживал", en: "A look ahead: the skill nobody kept up" }
        summary:
          ru: "Работа, где проверка машины и есть навык, и риск для тех, кто никогда не делал этого сам: за чем следить в ближайшие годы."
          en: "Jobs where checking the machine is the skill, and the risk for people who never did the work themselves: what to watch in the next few years."
        ahead: true
