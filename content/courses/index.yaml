# The catalog's strands, in order, and the courses in each, in order
# (docs/specs/2026-11-01-platform-design.md §4, §7). The web course is first and the AI course second.
strands:
  - id: machine
    title: { ru: Понять машину и работать с ней, en: Understand the machine and work with it }
    short: { ru: Машина, en: The machine }
    summary:
      ru: Кто понимает, как устроена машина, тот ставит ей задачи и проверяет ответы, а не верит в магию.
      en: People who understand how the machine works can set it tasks and check its answers, instead of believing in magic.
    courses: [web, ai, work-with-ai, own-tools, work]
  - id: noetic
    title: { ru: Ноэтическая сингулярность, en: The Noetic Singularity }
    short: { ru: Свой ум, en: Your own mind }
    summary:
      ru: Мы в NoeticEcho считаем, что люди должны развивать свой ум так, чтобы не отстать от сверхинтеллекта, и называем эту цель ноэтической сингулярностью. Это цель и ставка, а не прогноз.
      en: At NoeticEcho we hold that people must develop their minds so as not to be left behind by superintelligence, and we call that aim the Noetic Singularity. It is an aim and a bet, not a forecast.
    courses: [noetic-singularity, attention, thinking, learning, reasoning, resilience, meaning, dialogue, responsibility, imagination]
  - id: check
    title: { ru: Проверять, en: Check }
    short: { ru: Проверка, en: Checking }
    summary:
      ru: Убедительный текст теперь ничего не стоит, поэтому проверка становится повседневным умением.
      en: Convincing text now costs nothing, so checking has become an everyday skill.
    courses: [verify, numbers]
  - id: yours
    title: { ru: Беречь своё, en: Keep what is yours }
    short: { ru: Своё, en: What is yours }
    summary:
      ru: Ваши данные, деньги, здоровье, права и дети остаются вашим делом, какой бы умной ни была машина.
      en: Your data, money, health, rights and children remain your business, however clever the machine gets.
    courses: [privacy, security, money, health, children]
