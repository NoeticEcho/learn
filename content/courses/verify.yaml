# One claim in front of you (docs/specs/2026-11-01-platform-design.md §7.2, §7.3). Data and charts belong to
# `numbers`, your own decisions to `reasoning`, a cloned voice used by an attacker to `security`.
id: verify
history: true
title: { ru: "Проверить: текст, снимок, голос", en: "Checking a claim: text, image, voice" }
tagline:
  ru: "Как за несколько минут проверить, что сказала модель, что показывает снимок или видео и чей это голос, и когда пора остановиться."
  en: "How to check in minutes what a model told you, what a photo or video shows and whose voice that is, and when to stop checking."
about:
  ru: "Курс для всех, кому приходится решать, верить ли тому, что перед глазами: ответу чат-бота, цитате, снимку, записи. Вы освоите приёмы фактчекеров, научитесь доходить до первоисточника и вовремя останавливаться. Разбор данных и графиков живёт в курсе о числах, а здесь всегда одно утверждение."
  en: "A course for anyone who has to decide whether to believe what is in front of them: a chatbot’s answer, a quotation, a photo, a recording. You will learn the moves fact-checkers use, how to reach the original source and when to stop. Taking data and charts apart belongs to the course on numbers; here it is always one claim."
parts:
  - id: model-says
    title: { ru: "Что говорит модель", en: "What a model says" }
    summary:
      ru: "Модель пишет одинаково уверенно, когда знает и когда сочиняет, поэтому тон ни о чём не говорит."
      en: "A model writes with the same confidence whether it knows or invents, so its tone tells you nothing."
    lessons:
      - id: smooth-not-true
        title: { ru: "Складно не значит верно", en: "Smooth is not the same as true" }
        summary:
          ru: "Галлюцинации на практике: какие части ответа проверять первыми и почему вежливая уверенность модели не доказательство."
          en: "Hallucinations in practice: which parts of an answer to check first, and why a model’s polite confidence is no evidence."
      - id: citation-to-nothing
        title: { ru: "Ссылка на то, чего нет", en: "A citation to nothing" }
        summary:
          ru: "Модели выдумывают источники, и люди уже поплатились за это: как за минуту проверить, существует ли ссылка."
          en: "Models invent sources, and people have already paid for trusting them: how to check in a minute whether a citation exists."
      - id: summary-distorts
        title: { ru: "Пересказ искажает", en: "A summary distorts" }
        summary:
          ru: "Пересказ новости или статьи от модели может исказить суть: как быстро сверить его с исходным текстом."
          en: "A model’s summary of a story or a paper can distort the point: how to compare it quickly with the original."
      - id: asking-the-model
        title: { ru: "Можно ли спросить саму модель", en: "Can you ask the model itself" }
        summary:
          ru: "Что на самом деле даёт просьба назвать источник и почему согласие двух машин ещё не проверка."
          en: "What asking for a source really gives you, and why two machines agreeing is not a check."
  - id: moves
    title: { ru: "Приёмы фактчекера", en: "A fact-checker’s moves" }
    summary:
      ru: "Опытные проверяющие читают страницу меньше, а смотрят, что о ней пишут другие, и этому можно научиться."
      en: "Experienced checkers read a page less and look at what others say about it, and that can be learned."
    lessons:
      - id: lateral-reading
        title: { ru: "Читать вбок", en: "Reading sideways" }
        summary:
          ru: "Фактчекеры быстро уходят со страницы и проверяют её в других вкладках: как научиться этому самому."
          en: "Fact-checkers quickly leave a page and check it in other tabs: how to learn to do the same."
      - id: sift
        title: { ru: "Четыре шага SIFT", en: "The four moves of SIFT" }
        summary:
          ru: "Метод Майка Колфилда: остановиться, проверить источник, найти материал понадёжнее и дойти до оригинала, и всё за пару минут."
          en: "Mike Caulfield’s method: stop, investigate the source, find better coverage and trace the claim to its origin, all in a couple of minutes."
      - id: who-said-it
        title: { ru: "Кто это на самом деле сказал", en: "Who really said that" }
        summary:
          ru: "Как дойти от красивой цитаты до текста, где она появилась впервые, и заметить обрезанный контекст или приписанное знаменитости чужое."
          en: "How to get from a fine quotation to the text where it first appeared, and spot a clipped context or words pinned on someone famous."
      - id: number-at-source
        title: { ru: "Число в заголовке и число в источнике", en: "The number in the headline and the one in the source" }
        summary:
          ru: "Как найти отчёт, откуда взята цифра, и сверить с заголовком, то ли измеряли и у тех ли людей; разбор данных оставлен курсу о числах."
          en: "How to find the report behind a figure and compare it with the headline: same measure, same people; the data itself is for the course on numbers."
  - id: media
    title: { ru: "Снимок, видео, голос", en: "Images, video, voice" }
    summary:
      ru: "Сначала выясните, откуда взялся файл, и только потом разглядывайте его: так быстрее и надёжнее."
      en: "First find out where a file came from, and only then look closely at it: that is faster and more reliable."
    lessons:
      - id: false-caption
        title: { ru: "Настоящий снимок, чужая подпись", en: "A real photo with a false caption" }
        summary:
          ru: "Старые кадры под новой подписью: обратный поиск по картинке проверит контекст раньше, чем вы начнёте разглядывать пиксели."
          en: "Old footage under a new caption: a reverse image search checks the context before you start examining pixels."
      - id: pentagon-image
        title: { ru: "Картинка, которая качнула биржу", en: "The picture that moved the market" }
        summary:
          ru: "Фальшивый снимок взрыва у Пентагона разошёлся с аккаунтов с галочкой: урок о том, куда смотреть сначала."
          en: "A fake image of an explosion at the Pentagon spread from verified accounts: a lesson in where to look first."
      - id: detectors
        title: { ru: "Детектор не судья", en: "A detector is not a judge" }
        summary:
          ru: "Почему детекторы сгенерированного ошибаются и как читать их ответ, если других доказательств нет."
          en: "Why detectors of generated content get it wrong, and how to read their verdict when there is no other evidence."
      - id: provenance
        title: { ru: "Происхождение файла: C2PA", en: "Where a file came from: C2PA" }
        summary:
          ru: "Что подпись на файле доказывает, почему теряется при пересылке и почему её отсутствие ничего не значит."
          en: "What a signature on a file proves, why it gets lost in sharing, and why its absence proves nothing."
      - id: voice-recording
        title: { ru: "Голос на записи", en: "A voice on a recording" }
        summary:
          ru: "Как проверять публичную запись: кто выложил её первым и есть ли полная версия; звонок мошенника с чужим голосом разбирает курс о безопасности."
          en: "How to check a public recording: who posted it first and whether a full version exists; a scammer’s cloned call belongs to the course on security."
      - id: liars-dividend
        title: { ru: "Дивиденд лжеца", en: "The liar’s dividend" }
        summary:
          ru: "Когда подделать можно всё, настоящую запись тоже легко объявить фальшивкой, поэтому проверять приходится в обе стороны."
          en: "Once anything can be faked, a real recording is easy to dismiss as a fake too, so checking has to run both ways."
  - id: stopping
    title: { ru: "Когда остановиться", en: "When to stop" }
    summary:
      ru: "Проверить всё нельзя, поэтому решать, что проверять и насколько глубоко, тоже надо уметь."
      en: "Nobody can check everything, so deciding what to check and how deeply is a skill too."
    lessons:
      - id: how-much-checking
        title: { ru: "Сколько проверять", en: "How much checking is enough" }
        summary:
          ru: "Глубину задаёт цена ошибки: одно дело прочитать и забыть, другое переслать близким или решать о деньгах и лечении."
          en: "The cost of being wrong sets the depth: reading and forgetting is one thing, forwarding to family or deciding about money or treatment another."
      - id: critical-ignoring
        title: { ru: "Умение не читать", en: "The skill of not reading" }
        summary:
          ru: "Внимание ограничено, и не всякое утверждение заслуживает проверки: как решить, что можно просто не читать."
          en: "Attention is limited,, not every claim deserves to be checked: how to decide what you can simply not read."
      - id: i-do-not-know
        title: { ru: "«Не знаю» как результат", en: "“I do not know” as a result" }
        summary:
          ru: "Как записать, что проверено, а что нет, и как поправить себя, если ложное уже ушло от вас к другим."
          en: "How to note what you checked and what you did not, and how to correct yourself when a falsehood has already gone out from you."
      - id: checking-versus-generating
        title: { ru: "Заглянем вперёд: проверка против генерации", en: "A look ahead: checking versus generating" }
        summary:
          ru: "Что изменится, если подпись на файлах станет нормой, а подделки ещё подешевеют, и какие привычки понадобятся при любом исходе."
          en: "What changes if signed files become normal and fakes get cheaper still, and which habits you will need whichever way it goes."
        ahead: true
