# Your own arguments and decisions under uncertainty (docs/specs/2026-11-01-platform-design.md §7.2, §7.3, §7.4).
# A noetic-strand course. One claim belongs to `verify`, other people's data to `numbers`, a chatbot's
# sycophancy to `dialogue`. Base rates are taught in `numbers` and applied to your own decisions here.
id: reasoning
history: true
title: { ru: "Рассуждать, когда ничего не ясно", en: "Reasoning when nothing is clear" }
tagline:
  ru: "Как строить и разбирать доводы, считать шансы, вести счёт своим прогнозам и не соглашаться с машиной по привычке."
  en: "How to build and take apart arguments, weigh odds, keep score of your forecasts, not give in to a machine out of habit."
about:
  ru: "Машина будет предлагать готовое решение всё чаще, и наша цель в том, чтобы человек оставался способен его оценить и оспорить: это цель, а не прогноз. Вы научитесь разбирать доводы, считать шансы простыми словами, вести счёт своим прогнозам и решениям и увидите, какие известные искажения подтвердились, а какие нет. Здесь речь о ваших собственных решениях; чужие утверждения и данные разбирают соседние курсы, а почему модель с вами соглашается, курс о разговоре."
  en: "Machines will offer ready-made decisions more and more often, and our aim is that people stay able to judge and dispute them: that is an aim, not a forecast. You will learn to take arguments apart, work out odds in plain words, keep score of your forecasts and decisions, and see which famous biases held up and which did not. This course is about your own decisions; other people’s claims and data belong to the courses next door, and why a model agrees with you to the course on dialogue."
parts:
  - id: arguments
    title: { ru: "Довод как работа", en: "An argument as work" }
    summary:
      ru: "Прежде чем соглашаться или возражать, надо увидеть, из чего довод собран и где у него слабое место."
      en: "Before you agree or object, you need to see what an argument is built from and where it is weak."
    lessons:
      - id: what-reason-is-for
        title: { ru: "Зачем нам разум", en: "What reasoning is for" }
        summary:
          ru: "Спорная гипотеза Мерсье и Спербера: разум сложился для спора, поэтому в одиночку мы ищем подтверждения себе, а вместе находим чужие ошибки."
          en: "The disputed hypothesis of Mercier and Sperber: reason evolved for arguing, so alone we look for support and together we find each other’s errors."
      - id: anatomy
        title: { ru: "Из чего состоит довод", en: "What an argument is made of" }
        summary:
          ru: "Посылка, вывод и скрытое допущение: как выписать довод, свой или чужой, чтобы стало видно, что именно надо проверять."
          en: "Premise, conclusion and hidden assumption: how to write out an argument, yours or someone else’s, so that it shows what needs checking."
      - id: fallacies
        title: { ru: "Уловки в настоящем споре", en: "Fallacies in a real argument" }
        summary:
          ru: "Почему назвать уловку не значит опровергнуть и почему в жизни один и тот же ход бывает и ошибкой, и разумным доводом."
          en: "Why naming a fallacy does not refute it, and why in life the same move can be an error or a reasonable point."
  - id: odds
    title: { ru: "Шансы простыми словами", en: "Odds in plain words" }
    summary:
      ru: "Для большинства решений хватит трёх мыслей о вероятности, а формулы не понадобятся."
      en: "Most decisions need three ideas about probability and no formulas."
    lessons:
      - id: base-rates
        title: { ru: "С чего начинать: базовая частота", en: "Where to start: the base rate" }
        summary:
          ru: "Как начинать свою оценку с базовой частоты, когда яркая история тянет о ней забыть; саму идею объясняет курс о числах."
          en: "How to start your own estimate from the base rate when a vivid story tempts you to forget it; the idea itself is in the course on numbers."
      - id: bayes
        title: { ru: "Байес без формулы", en: "Bayes without the formula" }
        summary:
          ru: "Что меняет новый факт в том, во что вы уже верите, и как считать это на воображаемых людях вместо процентов."
          en: "What a new fact changes in what you already believe, and how to work it out with imagined people in place of percentages."
      - id: outside-view
        title: { ru: "Взгляд снаружи", en: "The outside view" }
        summary:
          ru: "Мысль Канемана: свой план кажется особенным, поэтому спросите, чем кончались похожие, и представьте его провал заранее."
          en: "Kahneman’s point: your own plan feels special, so ask how similar ones ended, and imagine it has already failed."
  - id: forecasts
    title: { ru: "Прогноз и счёт", en: "Forecasts and keeping score" }
    summary:
      ru: "Точность оценок можно измерить и подтянуть, но только если записывать их до того, как станет известен исход."
      en: "The accuracy of your estimates can be measured and improved, but only if you write them down before the outcome is known."
    lessons:
      - id: experts-and-forecasters
        title: { ru: "Эксперты, шимпанзе и суперпрогнозисты", en: "Experts, the chimp and superforecasters" }
        summary:
          ru: "Как Тетлок проверил знаменитых экспертов и что делают сильнейшие прогнозисты: дробят вопрос и часто меняют оценку."
          en: "How Tetlock tested famous experts, and what the strongest forecasters do: they split up a question and often revise."
      - id: calibration
        title: { ru: "Калибровка своих оценок", en: "Calibrating yourself" }
        summary:
          ru: "Что значит «уверен на 70 процентов» и как вести счёт своим оценкам, чтобы видеть, можно ли им верить."
          en: "What “70 percent sure” means, and how to keep score of your estimates so you can see whether to trust them."
      - id: decision-journal
        title: { ru: "Журнал решений", en: "A decision journal" }
        summary:
          ru: "Что записать до исхода, чтобы потом судить о решении, а не о везении: это разумная практика, а не доказанный метод."
          en: "What to write before the outcome so you can later judge the decision, not the luck: sensible practice, not a proven method."
  - id: biases
    title: { ru: "Искажения: что выдержало проверку", en: "Biases: what held up" }
    summary:
      ru: "Список когнитивных искажений из популярных книг оказался неоднородным, и знать, какие из них настоящие, полезнее, чем знать их все."
      en: "The list of biases in popular books turned out to be uneven, and knowing which are real is more useful than knowing them all."
    lessons:
      - id: held-up
        title: { ru: "Что подтвердилось", en: "What survived replication" }
        summary:
          ru: "Какие известные эффекты устояли при больших повторах, среди них эффект якоря, и почему на них можно опираться."
          en: "Which famous effects stood up to large replications, anchoring among them, and why you can lean on them."
      - id: fell-apart
        title: { ru: "Что рассыпалось", en: "What fell apart" }
        summary:
          ru: "Социальный прайминг, в котором Канеман сам признал излишнее доверие к слабым работам, и что это говорит о популярных книгах."
          en: "Social priming, where Kahneman himself admitted too much faith in weak studies, and what that says about popular books."
      - id: still-argued
        title: { ru: "О чём ещё спорят", en: "What is still argued over" }
        summary:
          ru: "Подталкивание и неприятие потерь: почему одни находят заметный эффект, другие почти никакого и как решать, пока спор открыт."
          en: "Nudging and loss aversion: why some find a clear effect and others almost none, and how to decide while the argument stays open."
  - id: machine
    title: { ru: "Последнее слово", en: "The last word" }
    summary:
      ru: "Наша цель в том, чтобы последнее слово оставалось за человеком, который способен его обосновать, а не просто нажать «согласен»."
      en: "Our aim is that the last word stays with a person who can justify it,, not one who merely clicks “agree.”"
    lessons:
      - id: automation-bias
        title: { ru: "Слепое доверие автоматике", en: "Automation bias" }
        summary:
          ru: "Люди идут за подсказкой системы и пропускают её ошибки, причём и новички, и специалисты: как поймать это за собой."
          en: "People follow a system’s prompt and miss its errors, novices and specialists alike: how to catch yourself doing it."
      - id: opposite-mistake
        title: { ru: "Обратная ошибка", en: "The opposite mistake" }
        summary:
          ru: "Формула часто точнее суждения специалиста, а люди отворачиваются от алгоритма, увидев его ошибку: как не принять упрямство за бдительность."
          en: "A formula often beats a specialist’s judgment, yet people abandon an algorithm once they see it err: how not to mistake stubbornness for vigilance."
      - id: how-to-argue
        title: { ru: "Как проверить довод модели", en: "How to test a model’s argument" }
        summary:
          ru: "Запишите своё решение до разговора, попросите его разбить и отметьте, что изменилось и почему: так вы пользуетесь чужим умом и решаете сами."
          en: "Write your decision down before the talk, ask the model to break it, note what changed and why: you borrow a mind and still decide for yourself."
      - id: machines-that-forecast
        title: { ru: "Заглянем вперёд: машины, которые предсказывают", en: "A look ahead: machines that forecast" }
        summary:
          ru: "Модели уже пробуют предсказывать наравне с людьми: что останется человеку, если так пойдёт дальше, для нас главный вопрос курса."
          en: "Models are already being tried as forecasters beside people: what is left for a person if this goes on is, to us, this course’s central question."
        ahead: true
