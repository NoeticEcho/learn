# What changes in a job, a career and a small organization (docs/specs/2026-11-01-platform-design.md §7.2, §7.3).
id: work
history: true
title: { ru: "Работа: задачи, карьера, маленькая организация", en: "Work: tasks, careers and small organizations" }
tagline:
  ru: "Как разобрать свою работу на задачи, решить, чему учиться дальше, и посчитать, окупился ли ИИ в маленькой команде."
  en: "How to break your job into tasks, decide what to learn next and count whether AI paid for itself in a small team."
about:
  ru: "Курс для работников, начинающих и владельцев маленьких организаций. Вы разберёте свою работу по задачам, составите план обучения, договоритесь в команде о правилах и проведёте пилот так, чтобы его можно было честно посчитать. Какие профессии уцелеют, никто не знает, и курс не делает вид, что знает."
  en: "A course for employees, people starting out and owners of small organizations. You will take your job apart into tasks, draw up a plan for what to learn, agree on rules in a team and run a pilot you can honestly count. Nobody knows which jobs will survive, and this course does not pretend to."
parts:
  - id: tasks
    title: { ru: "Задачи, а не профессии", en: "Tasks, not jobs" }
    summary:
      ru: "Экономисты давно считают не профессии, а задачи внутри них, и этот взгляд полезнее любого списка вымирающих занятий."
      en: "Economists have long counted the tasks inside jobs, not the jobs themselves, and that view is more useful than any list of dying occupations."
    lessons:
      - id: bundle-of-tasks
        title: { ru: "Работа как набор задач", en: "A job as a bundle of tasks" }
        summary:
          ru: "Компьютер берёт на себя рутинные задачи и дополняет остальные, поэтому профессия меняется, даже когда название остаётся."
          en: "Computers take over routine tasks and complement the others, so a job changes even when its name stays."
      - id: forty-seven-or-nine
        title: { ru: "47 процентов или 9", en: "47 percent or 9" }
        summary:
          ru: "Две знаменитые оценки риска для рабочих мест расходятся в пять раз, и этот разрыв учит читать любой прогноз о работе."
          en: "Two famous estimates of the risk to jobs differ fivefold, and the gap teaches you how to read any forecast about work."
      - id: displaced-and-new
        title: { ru: "Что машина забирает и что появляется", en: "What machines take and what appears" }
        summary:
          ru: "Вытеснение и новые задачи идут одновременно, и никакой закон не обязывает их уравновешиваться."
          en: "Displacement and new tasks run at the same time, and no law says they must balance."
      - id: tellers
        title: { ru: "Банкоматы и операционисты", en: "ATMs and bank tellers" }
        summary:
          ru: "Банкоматов стало в разы больше, а операционисты не исчезли: что произошло на самом деле и почему это не общий закон."
          en: "ATMs multiplied and bank tellers did not vanish: what really happened, and why the case is no general law."
  - id: measured
    title: { ru: "Что уже измерили", en: "What has been measured" }
    summary:
      ru: "Данных о генеративном ИИ на работе пока немного, они расходятся, и читать их надо вместе."
      en: "The data on generative AI at work is still thin and points in different directions, so it has to be read together."
    lessons:
      - id: who-gains-first
        title: { ru: "Кто выигрывает первым", en: "Who gains first" }
        summary:
          ru: "В поддержке клиентов ИИ сильнее всего помог новичкам и почти не помог самым опытным: что это может значить для вас."
          en: "In customer support AI helped newcomers most and barely helped the most experienced: what that may mean for you."
      - id: paychecks
        title: { ru: "Почему в зарплатах этого почти не видно", en: "Why paychecks barely show it" }
        summary:
          ru: "Почему экономия времени может не доходить до заработка и почему из этого ещё не следует, что так будет дальше."
          en: "Why saved time may not reach your earnings, and why that does not settle what comes next."
      - id: first-rung
        title: { ru: "Первая ступенька", en: "The first rung" }
        summary:
          ru: "Что известно о найме начинающих в профессиях, которых ИИ коснулся сильнее всего, и как читать такие данные."
          en: "What is known about hiring beginners in the jobs AI has touched most, and how to read such data."
  - id: small-organization
    title: { ru: "Маленькая организация", en: "A small organization" }
    summary:
      ru: "В команде из пяти человек нет отдела внедрения: правила и подсчёт ложатся на тех, кто уже занят своей работой."
      en: "A team of five has no adoption department: the rules and the counting fall to people already busy with their own work."
    lessons:
      - id: team-rules
        title: { ru: "Правила команды на одной странице", en: "Team rules on one page" }
        summary:
          ru: "Какие данные куда можно отдавать и кто отвечает за результат: договорённости, без которых каждый решает сам и молча."
          en: "Which data may go where and who answers for the result: the agreements without which everyone decides alone and in silence."
      - id: first-pilot
        title: { ru: "Первый пилот", en: "The first pilot" }
        summary:
          ru: "Одна скучная повторяющаяся задача, один ответственный и заранее записанный критерий успеха вместо большого внедрения на всю фирму."
          en: "One dull recurring task, one person responsible and a success criterion written in advance, in place of a big rollout across the firm."
      - id: did-it-pay
        title: { ru: "Как посчитать, окупилось ли", en: "How to count whether it paid" }
        summary:
          ru: "Замер до начала, сравнение с теми, кто работает по-старому, и время на проверку в расходах, чтобы ответ был числом, а не впечатлением."
          en: "A measurement before you start, a comparison with the old way, and checking time in the costs, so the answer is a number, not an impression."
      - id: feels-faster
        title: { ru: "Кажется, что быстрее", en: "It feels faster" }
        summary:
          ru: "Ощущение, что с ИИ работа идёт быстрее, может расходиться с замером, поэтому опрос сотрудников измерением не считается."
          en: "The feeling that work goes faster with AI can part ways with a measurement, which is why asking staff does not count as measuring."
      - id: replacing-too-fast
        title: { ru: "Заменить людей слишком быстро", en: "Replacing people too fast" }
        summary:
          ru: "Что бывает, когда компания спешит заменить людей ради экономии, и как заранее решить, что вы будете считать качеством."
          en: "What happens when a company rushes to replace people to save money, and how to decide in advance what you will count as quality."
  - id: next-step
    title: { ru: "Ваш следующий шаг", en: "Your next step" }
    summary:
      ru: "План на ближайший год, который не зависит от того, чей прогноз окажется верным."
      en: "A plan for the coming year that does not depend on whose forecast turns out right."
    lessons:
      - id: your-week
        title: { ru: "Разберите свою неделю", en: "Take your week apart" }
        summary:
          ru: "Простая таблица задач: что машина уже делает, что делает под вашей проверкой и что остаётся за вами."
          en: "A plain table of tasks: what a machine already does, what it does with you checking, and what stays yours."
      - id: expertise-bet
        title: { ru: "Экспертиза как ставка", en: "Expertise as a bet" }
        summary:
          ru: "Смелая гипотеза: ИИ может расширить круг тех, кто применяет экспертизу, если у них есть основа, и план на ней строят с оговоркой."
          en: "A bold hypothesis: AI may widen the circle of people who can use expertise, given a foundation, so plan on it with care."
      - id: step-sideways
        title: { ru: "Шаг в сторону", en: "A step sideways" }
        summary:
          ru: "Как перейти в соседнюю роль, унося с собой знание отрасли, и как проверить такой шаг малой ценой, прежде чем переучиваться с нуля."
          en: "How to move into a neighboring role and take your knowledge of the field with you, and how to test the move cheaply before retraining from scratch."
      - id: show-the-work
        title: { ru: "Как показать, что вы умеете", en: "How to show what you can do" }
        summary:
          ru: "Работа, которую можно посмотреть, вместо строчки «владею ИИ» в резюме: что собрать и как честно сказать, какую часть сделала машина."
          en: "Work people can look at, in place of “proficient in AI” on a résumé: what to gather, and how to say honestly which part the machine did."
      - id: signals
        title: { ru: "Заглянем вперёд: сигналы вместо прогнозов", en: "A look ahead: signals instead of forecasts" }
        summary:
          ru: "На какие числа смотреть в ближайшие годы, от найма начинающих до настоящего использования, и как заранее решить, что вы сделаете, если они сдвинутся."
          en: "Which numbers to watch in the next few years, from hiring of beginners to real use at work, and how to decide in advance what you will do if they move."
        ahead: true
