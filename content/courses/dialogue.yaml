# Listening, disagreeing and thinking together, with people and beside machines
# (docs/specs/2026-11-01-platform-design.md §7.2). A chatbot's sycophancy lives here, and companion chatbots
# for adults; companions for children are `children`'s.
id: dialogue
history: true
title: { ru: "Разговор: слушать, спорить, думать вместе", en: "Dialogue: listening, disagreeing, thinking together" }
tagline:
  ru: "Как слушать и спорить с толком, когда группа умнее одного человека и что меняется, когда собеседник машина."
  en: "How to listen and disagree to some purpose, when a group is smarter than one person, and what changes when the other party is a machine."
about:
  ru: "Курс для всех, кому приходится договариваться, и для тех, кто всё чаще разговаривает с машиной, а не с людьми. Вы разберётесь, какие приёмы общения проверены, а какие только популярны, сможете спорить с пользой и устроить обсуждение в группе и будете понимать, чем чат-бот отличается от человека рядом."
  en: "A course for anyone who has to reach agreement with others, and for those who talk more and more to a machine and less to people. You will sort out which communication techniques have been tested and which are merely popular, be able to argue usefully and run a group discussion, and understand how a chatbot differs from a person beside you."
parts:
  - id: listening
    title: { ru: "Слушать", en: "Listening" }
    summary:
      ru: "Популярные приёмы слушания проверены хуже, чем о них говорят, и это не делает их бесполезными."
      en: "Popular listening techniques have been tested less than people say, which does not make them useless."
    lessons:
      - id: active-listening
        title: { ru: "Активное слушание: что показали опыты", en: "Active listening: what the experiments showed" }
        summary:
          ru: "Людям кажется, что их лучше поняли, а разговором они довольны не больше, чем после совета: что из этого брать в жизнь."
          en: "People feel better understood, yet are no more satisfied with the talk than after advice: what to take from that into life."
      - id: nonviolent-communication
        title: { ru: "Ненасильственное общение и его границы", en: "Nonviolent communication and its limits" }
        summary:
          ru: "Наблюдение, чувство, потребность, просьба: где четыре шага Розенберга уместны, а где звучат как приём."
          en: "Observation, feeling, need, request: where Marshall Rosenberg’s four steps fit, and where they sound like a trick."
      - id: machine-that-always-listens
        title: { ru: "Машина, которая всегда слушает", en: "The machine that always listens" }
        summary:
          ru: "Почему чат-бот кажется внимательным и чем ощущение, что тебя услышали, отличается от того, что кому-то не всё равно."
          en: "Why a chatbot seems attentive, and how the feeling of being heard differs from someone actually caring."
  - id: disagreeing
    title: { ru: "Спорить с толком", en: "Disagreeing to some purpose" }
    summary:
      ru: "Хороший спор что-то меняет, и о том, как это бывает, теперь есть данные, а не только советы."
      en: "A good argument changes something, and there is now data on how that happens, not only advice."
    lessons:
      - id: state-their-position
        title: { ru: "Сначала изложи чужую позицию", en: "State their position first" }
        summary:
          ru: "Перескажите довод собеседника так, чтобы он сам согласился с пересказом, и только потом возражайте: как это работает и где ломается."
          en: "Restate the other person’s argument until they agree with your version, and only then object: how that works and where it breaks."
      - id: ten-minutes-at-the-door
        title: { ru: "Десять минут у двери", en: "Ten minutes at the door" }
        summary:
          ru: "Может ли короткий разговор надолго сдвинуть предубеждение: опыт с визитами к людям домой и подделка, которая ему предшествовала."
          en: "Can a short conversation shift a prejudice for months: a door-to-door experiment, and the fabricated paper that came before it."
      - id: arguing-with-a-machine
        title: { ru: "Спорить с машиной", en: "Arguing with a machine" }
        summary:
          ru: "Разговор с моделью может ослабить веру в теорию заговора, а значит, та же сила убеждения способна работать и в обратную сторону."
          en: "A talk with a model can weaken belief in a conspiracy theory, which means the same persuasive power can also work the other way."
      - id: when-not-to-argue
        title: { ru: "Когда спорить не стоит", en: "When not to argue" }
        summary:
          ru: "Разница в силе, усталость, человек, которому нужен покой: как заметить, что спор никуда не ведёт, и выйти из него."
          en: "A gap in power, exhaustion, someone who needs rest: how to notice an argument has stopped leading anywhere, and how to leave it."
  - id: thinking-together
    title: { ru: "Думать вместе", en: "Thinking together" }
    summary:
      ru: "Группа бывает умнее любого из участников, а бывает глупее их всех, и условия для того и другого известны лучше, чем кажется."
      en: "A group can be smarter than any of its members or dumber than all of them, and the conditions for each are better known than you might think."
    lessons:
      - id: galton-and-the-ox
        title: { ru: "Гальтон и бык", en: "Galton and the ox" }
        summary:
          ru: "Как толпа на выставке скота почти угадала вес быка и почему ошибки разных людей гасят друг друга."
          en: "How a crowd at a livestock show came close to guessing an ox’s weight, and why different people’s errors cancel out."
      - id: when-a-crowd-fails
        title: { ru: "Когда толпа глупеет", en: "When a crowd gets dumber" }
        summary:
          ru: "Даже лёгкое влияние чужих мнений подрывает мудрость толпы, а факты, известные немногим, группа часто так и не складывает вместе."
          en: "Even mild social influence undermines the wisdom of a crowd, and a group often fails to pool the facts only a few of its members hold."
      - id: a-little-debate
        title: { ru: "Немного спора, потом подсчёт", en: "A little debate, then a count" }
        summary:
          ru: "Почему несколько маленьких обсуждений могут дать ответ точнее большой толпы и что это значит для вашего следующего собрания."
          en: "Why a few small debates can give a better answer than a large crowd, and what that means for your next meeting."
      - id: group-intelligence
        title: { ru: "Есть ли у группы общий интеллект", en: "Does a group have a general intelligence" }
        summary:
          ru: "Есть ли у группы общий фактор, как у одного человека: кто его нашёл, кто сомневается и что из этого взять на практике."
          en: "Does a group have a general factor, as one person does: who found it, who doubts it, and what to take from that in practice."
      - id: citizens-at-one-table
        title: { ru: "Граждане за одним столом", en: "Citizens at one table" }
        summary:
          ru: "Как ирландская гражданская ассамблея обсуждала аборты перед референдумом и что нужно такому обсуждению, чтобы оно работало."
          en: "How Ireland’s citizens’ assembly took up abortion before the referendum, and what such a deliberation needs in order to work."
  - id: beside-machines
    title: { ru: "Рядом с машинами", en: "Beside machines" }
    summary:
      ru: "Собеседник, который всегда согласен и всегда на связи, меняет и то, как мы думаем, и то, с кем мы остаёмся."
      en: "A partner who always agrees and is always available changes how we think and who we end up with."
    lessons:
      - id: why-the-model-agrees
        title: { ru: "Почему модель с вами соглашается", en: "Why the model agrees with you" }
        summary:
          ru: "Почему ассистенты склонны говорить приятное, при чём здесь наши собственные оценки и что такое согласие делает с вашим суждением."
          en: "Why assistants tend to tell you what you like, what your own ratings have to do with it, and what all that agreement does to your judgment."
      - id: getting-an-objection
        title: { ru: "Как получить от модели возражение", en: "How to get a model to object" }
        summary:
          ru: "Как просить возражения, проверить совет обратной постановкой вопроса и отличить настоящую критику от вежливости."
          en: "How to ask for objections, test advice by asking the question the other way round, and tell real criticism from politeness."
      - id: friend-in-an-app
        title: { ru: "Друг в приложении", en: "A friend in an app" }
        summary:
          ru: "Чат-бот вместо компании у взрослого: что он даёт, чего не даёт и почему связь с одиночеством ещё не говорит о причине."
          en: "A chatbot for company as an adult: what it gives, what it does not, and why a link with loneliness does not give you the cause."
      - id: living-people-nearby
        title: { ru: "Живые люди рядом", en: "Living people nearby" }
        summary:
          ru: "Чего не заменит удобный собеседник: что известно о связи между людьми и здоровьем и что здесь наша гипотеза, а не данные."
          en: "What a convenient partner cannot replace: what is known about human ties and health, and what here is our hypothesis, not data."
      - id: go-between-in-every-conversation
        title: { ru: "Заглянем вперёд: посредник в каждом разговоре", en: "A look ahead: a go-between in every conversation" }
        summary:
          ru: "Модели пишут ваши письма и отвечают на чужие: что станет с разговором, когда с обеих сторон говорят машины."
          en: "Models write your messages and answer other people’s: what becomes of conversation when machines speak on both sides."
        ahead: true
