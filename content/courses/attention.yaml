# Attention and deep work against an economy built to take them (docs/specs/2026-11-01-platform-design.md §7.2).
id: attention
history: true
title: { ru: "Внимание: кто им распоряжается", en: "Attention: who decides where yours goes" }
tagline:
  ru: "Как устроено внимание, что о нём говорят исследования и что делают с ним лента, уведомления и чат-бот."
  en: "How attention works, what research says about it, and what feeds, notifications and chatbots do to it."
about:
  ru: "Курс для тех, кому всё труднее дочитать длинный текст или довести до конца трудную задачу. Вы разберётесь, что о внимании подтверждено, какие цифры оказались мифами и как устроена лента, и настроите телефон и рабочий день под свои цели. Это не медицинский курс: если трудности с вниманием мешают жить, обратитесь к специалисту."
  en: "A course for people who find it harder and harder to finish a long text or stay with a hard problem. You will sort out what is established about attention, which numbers turned out to be myths and how a feed is built, and set up your phone and your working day around your own goals. This is not a medical course: if trouble with attention gets in the way of your life, see a professional."
parts:
  - id: how-it-works
    title: { ru: "Как устроено внимание", en: "How attention works" }
    summary:
      ru: "Сначала то, что известно о самом внимании, и то, что о нём только повторяют."
      en: "First, what is known about attention itself, and what is merely repeated about it."
    lessons:
      - id: attention-as-selection
        title: { ru: "Внимание как отбор", en: "Attention as selection" }
        summary:
          ru: "Мозг пропускает в сознание малую часть того, что видит и слышит, и это не поломка, а способ работать."
          en: "The brain lets only a small part of what it sees and hears into awareness, and that is not a fault but how it works."
      - id: goldfish-myth
        title: { ru: "Миф о золотой рыбке", en: "The goldfish myth" }
        summary:
          ru: "Откуда пошла цифра в восемь секунд и почему исследования за ней найти не удалось."
          en: "Where the famous eight seconds came from, and why nobody has found a study behind the number."
      - id: wandering-mind
        title: { ru: "Когда мысли уходят сами", en: "When your mind wanders off" }
        summary:
          ru: "Как измеряют, куда уходят мысли посреди дела, и что такие замеры могут сказать, а что нет."
          en: "How researchers measure where the mind goes in the middle of a task, and what such samples can and cannot tell you."
  - id: switching
    title: { ru: "Цена переключения", en: "The cost of switching" }
    summary:
      ru: "Две трудные задачи разом мы не делаем: мы переключаемся между ними и за это платим."
      en: "We do not do two hard tasks at once: we switch between them, and we pay for it."
    lessons:
      - id: switch-cost
        title: { ru: "Что стоит одно переключение", en: "What one switch costs" }
        summary:
          ru: "Почему каждый переход между задачами отнимает время и как маленькие потери складываются за день."
          en: "Why each move between tasks costs time, and how the small losses add up over a day."
      - id: heavy-multitaskers
        title: { ru: "Те, кто всё делает разом", en: "People who do everything at once" }
        summary:
          ru: "Громкий опыт нашёл у любителей многозадачности слабость к отвлечениям, а повторы оказались куда менее ясными: как читать такой спор."
          en: "A well-known experiment found heavy multitaskers more easily distracted, the repeats were far less clear, and here is how to read a dispute like that."
      - id: twenty-three-minutes
        title: { ru: "Откуда взялись двадцать три минуты", en: "Where the 23 minutes came from" }
        summary:
          ru: "Цифра, которую повторяют все, кто пишет о прерванной работе: что за ней стоит у Глории Марк и как возвращаться к делу."
          en: "The figure everyone repeats about interrupted work: what stands behind it in Gloria Mark’s research, and how to get back to a task."
      - id: phone-on-the-table
        title: { ru: "Телефон на столе", en: "The phone on the table" }
        summary:
          ru: "Отвлекает ли телефон, даже когда молчит: громкий результат, спорные повторы и что разумно сделать, пока вопрос открыт."
          en: "Does a phone distract you even when it lies silent: a headline result, the disputed repeats, and what is sensible while the question stays open."
  - id: economy
    title: { ru: "Экономика внимания", en: "The attention economy" }
    summary:
      ru: "Ваше внимание продают, и мы считаем, что его стоит защищать так же упрямо, как деньги: это наша позиция, а механизмы можно проверить."
      en: "Your attention is being sold, and we hold that it deserves defending as stubbornly as money: that is our stance, and the mechanisms can be checked."
    lessons:
      - id: poverty-of-attention
        title: { ru: "Бедность внимания", en: "A poverty of attention" }
        summary:
          ru: "Мысль Герберта Саймона: обилие информации рождает бедность внимания, и как она стала бизнес-моделью бесплатных сервисов."
          en: "Herbert Simon’s thought that a wealth of information creates a poverty of attention, and how it became the business model of free services."
      - id: how-a-feed-chooses
        title: { ru: "Как лента выбирает, что показать", en: "How a feed chooses what to show" }
        summary:
          ru: "Лента предсказывает, на что вы отреагируете, а не что вам нужно, и из этого складывается всё, что вы в ней видите."
          en: "A feed predicts what you will react to, not what you need, and everything you see in it follows from that."
      - id: engagement-and-wanting
        title: { ru: "Что вы смотрите и что выбрали бы сами", en: "What you watch and what you would choose" }
        summary:
          ru: "Чем лента, настроенная на реакцию, отличается от той, что вы выбрали бы сами, и как проверить это на своей."
          en: "How a feed tuned for reactions differs from the one you would choose yourself, and how to test that on your own."
      - id: feed-with-no-bottom
        title: { ru: "Лента без дна", en: "A feed with no bottom" }
        summary:
          ru: "Как работают бесконечная прокрутка и непредсказуемая награда и почему слово «зависимость» здесь спорное."
          en: "How endless scrolling and unpredictable rewards work, and why the word “addiction” is disputed here."
      - id: four-weeks-off
        title: { ru: "Четыре недели без соцсети", en: "Four weeks off the network" }
        summary:
          ru: "Что изменилось у людей, которым заплатили за месяц без Facebook, и почему результат сложнее, чем хотелось бы обеим сторонам."
          en: "What changed for people paid to spend a month off Facebook, and why the result is less simple than either side would like."
  - id: taking-it-back
    title: { ru: "Вернуть своё", en: "Taking it back" }
    summary:
      ru: "Что реально сделать с телефоном, рабочим днём и разговорами с машиной, и где привычки уже ни при чём."
      en: "What you can really do with your phone, your working day and your conversations with a machine, and where habits stop being the answer."
    lessons:
      - id: notification-hygiene
        title: { ru: "Гигиена уведомлений", en: "Notification hygiene" }
        summary:
          ru: "Какие оповещения отключить и как, и почему неделю без них стоит проверить на себе, а не верить на слово."
          en: "Which alerts to switch off and how, and why a week without them is worth testing on yourself rather than taking on trust."
      - id: deep-work-without-legends
        title: { ru: "Глубокая работа без легенд", en: "Deep work without the legends" }
        summary:
          ru: "Книга Кэла Ньюпорта как довод популяризатора, а не исследование, и как устроить день с долгими отрезками без помех."
          en: "Cal Newport’s book as a popularizer’s argument, not a study, and how to build a day with long unbroken stretches."
      - id: chatbot-and-attention
        title: { ru: "Что чат-бот делает с вниманием", en: "What a chatbot does to attention" }
        summary:
          ru: "Мгновенный ответ и соблазн спросить вместо того, чтобы подумать: что можно заметить уже сейчас и почему данных пока мало."
          en: "The instant answer and the temptation to ask instead of think: what you can notice already, and why there is little data so far."
      - id: not-about-habits
        title: { ru: "Когда дело не в привычках", en: "When it is not about habits" }
        summary:
          ru: "Чем обычная рассеянность отличается от расстройства, почему диагноз не ставят по роликам и когда идти к специалисту."
          en: "How ordinary distraction differs from a disorder, why a diagnosis does not come from short videos, and when to see a professional."
      - id: who-reads-the-feed
        title: { ru: "Заглянем вперёд: кто будет читать ленту за вас", en: "A look ahead: who will read the feed for you" }
        summary:
          ru: "Если агенты начнут фильтровать за вас почту и новости, у кого окажется ваше внимание и что проверять уже сейчас."
          en: "If agents start filtering your mail and news, who ends up holding your attention, and what to check now."
        ahead: true
