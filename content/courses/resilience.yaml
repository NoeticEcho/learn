# Emotions and steadiness through rapid change, and when to go to a professional
# (docs/specs/2026-11-01-platform-design.md §7.2). Getting through a hard stretch is this course's;
# what the stretch is for is `meaning`'s (§7.3). Sleep lives here and nowhere else. No therapeutic claims (§7.4).
id: resilience
history: true
title: { ru: "Устойчивость: как пройти трудный отрезок", en: "Steadiness: getting through a hard stretch" }
tagline:
  ru: "Что исследования эмоций и стресса подтверждают, а что нет, как пережить трудный период и когда идти к специалисту."
  en: "What research on emotions and stress supports and what it does not, how to get through a hard stretch, and when to see a professional."
about:
  ru: "Курс для взрослых, которых выматывают перемены, новости и тревога из-за ИИ. Вы поймёте, у каких приёмов есть основания, какие советы не выдержали проверки, что может чат-бот в плохую минуту и как обратиться к специалисту. Это общие сведения, а не терапия и не медицинская помощь."
  en: "A course for adults worn down by change, by the news and by anxiety about AI. You will learn which techniques have grounds behind them, which advice did not survive testing, what a chatbot can do in a bad moment and how to go to a professional. This is general information, not therapy or medical care."
parts:
  - id: what-held-up
    title: { ru: "Что выдержало проверку", en: "What has held up" }
    summary:
      ru: "Об эмоциях написано много уверенного, и здесь отделено то, что подтверждается, от того, что просто красиво звучит."
      en: "Much that is confident has been written about emotions, and here what holds up is separated from what merely sounds good."
    lessons:
      - id: process-model
        title: { ru: "Где можно вмешаться", en: "Where you can step in" }
        summary:
          ru: "Модель Гросса о том, что на эмоцию можно влиять не только в момент вспышки, и почему это полезнее совета «успокойся»."
          en: "Gross’s model of how an emotion can be influenced before the moment it flares, and why that is more use than “calm down.”"
      - id: reappraisal-and-suppression
        title: { ru: "Переоценка и подавление", en: "Reappraisal and suppression" }
        summary:
          ru: "Почему переосмыслить ситуацию обычно полезнее, чем скрывать чувство, и когда это правило перестаёт работать."
          en: "Why rethinking a situation usually does more than hiding the feeling, and when that rule stops working."
      - id: letting-off-steam
        title: { ru: "Выпустить пар", en: "Letting off steam" }
        summary:
          ru: "Колотить грушу и прокручивать обиду не помогает, а вот то, что снижает возбуждение, обычно помогает: как остыть, не раздувая злость."
          en: "Hitting a punching bag and replaying the grievance do not help, and what calms the body usually does: how to cool off without fanning the anger."
      - id: what-did-not-replicate
        title: { ru: "Что не подтвердилось", en: "What did not replicate" }
        summary:
          ru: "Истощение воли и поза силы: как громкие открытия оказались под вопросом и как после этого читать психологию из заголовков."
          en: "Ego depletion and power posing: how loud findings came into question, and how to read psychology from headlines after that."
      - id: how-many-recover
        title: { ru: "Как часто люди справляются сами", en: "How many people recover on their own" }
        summary:
          ru: "Сколько людей справляются без помощи, почему об этих цифрах спорят и почему из них не следует, что справляться обязан каждый."
          en: "How many people recover without help, why the figures are disputed, and why they do not mean everyone must cope alone."
  - id: the-body
    title: { ru: "Тело под нагрузкой", en: "The body under load" }
    summary:
      ru: "Стресс и сон простыми словами: без страшилок и без лечебных советов."
      en: "Stress and sleep in plain words: no scare stories and no treatment advice."
    lessons:
      - id: stress-in-plain-words
        title: { ru: "Стресс простыми словами", en: "Stress in plain words" }
        summary:
          ru: "Короткая реакция на стресс полезна, а долгая нагрузка устроена иначе: что происходит в теле и почему «совсем без стресса» не цель."
          en: "A short stress response is useful and a long load works differently: what happens in the body, and why “no stress at all” is not the goal."
      - id: sleep-without-scare-stories
        title: { ru: "Сон без страшилок", en: "Sleep without the scare stories" }
        summary:
          ru: "Сколько сна нужно взрослому, почему страшные цифры из популярных книг стоит проверять и почему затянувшаяся бессонница это повод идти к врачу."
          en: "How much sleep an adult needs, why the frightening numbers in popular books deserve a check, and why lasting insomnia is a reason to see a doctor."
  - id: uncertainty-and-news
    title: { ru: "Неопределённость и новости", en: "Uncertainty and news" }
    summary:
      ru: "Перемены пугают не только тем, что они плохи, но и тем, что о них ничего не известно."
      en: "Change frightens not only by being bad but by being unknown."
    lessons:
      - id: when-not-knowing-is-worse
        title: { ru: "Когда не знать хуже", en: "When not knowing is worse" }
        summary:
          ru: "Неопределённость может давить сильнее, чем точное знание о плохом исходе: откуда это известно и что с этим делать."
          en: "Uncertainty can weigh more than knowing a bad outcome for certain: how we know that, and what to do about it."
      - id: change-it-or-bear-it
        title: { ru: "Менять или переживать", en: "Change it or bear it" }
        summary:
          ru: "Когда действовать, а когда принять: почему переосмысление помогает там, где от вас ничего не зависит, и мешает там, где зависит."
          en: "When to act and when to accept: why reappraisal helps where nothing depends on you and can get in the way where something does."
      - id: how-much-news
        title: { ru: "Сколько новостей выдержать", en: "How much news you can take" }
        summary:
          ru: "Как часы новостей о беде связаны со стрессом, почему это связь, а не доказанная причина, и как поставить себе предел."
          en: "How hours of news about a disaster go with stress, why that is an association, not a proven cause, and how to set yourself a limit."
      - id: anxiety-about-ai
        title: { ru: "Тревога из-за ИИ", en: "Anxiety about AI" }
        summary:
          ru: "Как отделить то, с чем можно работать, от страха без адреса и понять, кому выгодна паника."
          en: "How to separate what you can work on from a fear with no address, and see who profits from panic."
  - id: asking-for-help
    title: { ru: "Когда нужна помощь", en: "When you need help" }
    summary:
      ru: "Чат-бот доступен ночью, специалист нет, и здесь прямо сказано, чем они различаются и куда идти."
      en: "A chatbot is there at night and a professional is not, and here it is said plainly how they differ and where to go."
    lessons:
      - id: chatbot-on-a-bad-night
        title: { ru: "Чат-бот в плохую ночь", en: "A chatbot on a bad night" }
        summary:
          ru: "Что даёт разговор с машиной в плохую минуту, чего он не даёт и почему специальный бот из испытания не то же, что обычный чат-бот."
          en: "What talking to a machine offers in a bad moment, what it does not, and why a purpose-built bot in a trial is not your everyday chatbot."
      - id: where-a-chatbot-is-dangerous
        title: { ru: "Где чат-бот опасен", en: "Where a chatbot is dangerous" }
        summary:
          ru: "Обычный чат-бот может не распознать кризис и ответить буквально: когда закрыть окно и позвонить живому человеку."
          en: "An ordinary chatbot can miss a crisis and answer literally: when to close the window and call a living person."
      - id: when-to-see-a-professional
        title: { ru: "Когда идти к специалисту", en: "When to see a professional" }
        summary:
          ru: "Плохо неделями, трудно жить как обычно, мысли о смерти: с такими мыслями не ждите, а сразу звоните в экстренную службу или на кризисную линию."
          en: "Weeks of feeling bad, trouble living as usual, thoughts of death: with those thoughts do not wait, call your local emergency or crisis line."
      - id: who-to-see-and-how
        title: { ru: "К кому и как идти", en: "Who to see and how" }
        summary:
          ru: "Психолог, психотерапевт и психиатр: чем они различаются, как проверить образование и что делать, если нет денег или врача рядом."
          en: "Psychologist, psychotherapist and psychiatrist: how they differ, how to check training, and what to do without money or a doctor nearby."
      - id: when-someone-close-struggles
        title: { ru: "Когда плохо близкому", en: "When someone close is struggling" }
        summary:
          ru: "Как быть рядом без советов и спасательства и почему при мыслях о самоубийстве первым делом нужен специалист или кризисная линия."
          en: "How to stay close without advice or rescuing, and why with thoughts of suicide the first resource is a professional or a crisis line."
      - id: chatbots-and-the-rules
        title: { ru: "Заглянем вперёд: чат-боты и правила", en: "A look ahead: chatbots and the rules" }
        summary:
          ru: "Какие правила могут появиться для чат-ботов в разговорах о психике и как понять, можно ли доверить сервису хотя бы разговор."
          en: "What rules may come for chatbots that talk about mental health, and how to tell whether a service can be trusted with even a conversation."
        ahead: true
