# Reading data and charts other people show you (docs/specs/2026-11-01-platform-design.md §7.2, §7.3). One claim
# belongs to `verify`, your own decisions to `reasoning`. Relative risk and base rates are taught here;
# `health` applies them to screening and `reasoning` to your own decisions.
id: numbers
history: true
title: { ru: "Числа: как читать чужие данные и графики", en: "Numbers: reading other people’s data and charts" }
tagline:
  ru: "Как понять, что на самом деле говорят среднее, опрос, график или исследование, которые вам показывают, и где они могут ввести в заблуждение."
  en: "How to see what an average, a poll, a chart or a study shown to you actually says, and where it is likely to mislead you."
about:
  ru: "Курс для взрослых, которым показывают числа в новостях, на работе и в рекламе и которые не обязаны быть математиками. Вы будете читать средние, выборки, проценты, графики и научные статьи и задавать к ним правильные вопросы, а формул здесь почти нет. Как принимать собственные решения при неопределённости, рассказывает курс «Рассуждать, когда ничего не ясно»."
  en: "A course for adults who are shown numbers in the news, at work and in advertising and who need not be mathematicians. You will read averages, samples, percentages, charts and scientific papers and ask the right questions of them, with almost no formulas. Making your own decisions under uncertainty belongs to the course “Reasoning when nothing is clear.”"
parts:
  - id: simple-numbers
    title: { ru: "Простые числа с подвохом", en: "Simple numbers with a catch" }
    summary:
      ru: "Самые частые способы ввести в заблуждение не требуют никакой математики, и заметить их тоже можно без неё."
      en: "The most common ways to mislead take no mathematics, and spotting them takes none either."
    lessons:
      - id: averages
        title: { ru: "Средняя зарплата и ваша зарплата", en: "The average salary and yours" }
        summary:
          ru: "Среднее и медиана на одних и тех же доходах: почему один миллиардер поднимает среднее по комнате и какое число вам покажут, чтобы впечатлить."
          en: "The mean and the median of the same incomes: why one billionaire lifts a room’s average, and which number you will be shown to impress you."
      - id: percentage-points
        title: { ru: "Проценты и процентные пункты", en: "Percent and percentage points" }
        summary:
          ru: "Рост с 2 до 3 процентов можно назвать и одним пунктом, и ростом наполовину: оба ответа верны, и важно, какой выбрали для вас."
          en: "A rise from 2 to 3 percent is one point and also a 50 percent increase: both answers are right, and what matters is which was chosen for you."
      - id: twice-the-risk
        title: { ru: "Риск вдвое выше: от чего и до чего", en: "Twice the risk: from what to what" }
        summary:
          ru: "Чем относительный риск отличается от абсолютного, на примере британской паники из-за таблеток, где «вдвое» оказалось крошечной разницей."
          en: "How relative risk differs from absolute risk, with Britain’s scare over the pill, where “double” turned out to be a tiny difference."
      - id: no-denominator
        title: { ru: "Число без знаменателя", en: "A number with no denominator" }
        summary:
          ru: "«Тысячи случаев» из скольких, за какой срок и по сравнению с чем: с этого надо начинать разговор о любом большом числе."
          en: "“Thousands of cases” out of how many, over what period and compared with what: that is where any talk of a large number has to start."
      - id: how-common
        title: { ru: "Насколько это вообще часто", en: "How common it is to begin with" }
        summary:
          ru: "Что такое базовая частота и почему без неё нельзя понять ни риск, ни результат теста: идею применяют курсы о решениях и о здоровье."
          en: "What a base rate is, and why without it you cannot understand a risk or a test result: the courses on reasoning and health apply the idea."
  - id: where-from
    title: { ru: "Откуда взялись данные", en: "Where the data came from" }
    summary:
      ru: "Прежде чем читать результат, спросите, кого в него включили, кого потеряли и кто выбрал, что считать."
      en: "Before you read a result, ask who was included, who was lost and who chose what to count."
    lessons:
      - id: who-was-asked
        title: { ru: "Кого спросили", en: "Who was asked" }
        summary:
          ru: "Literary Digest собрал миллионы ответов и ошибся с президентом, а Гэллап с намного меньшей выборкой оказался прав: размер не спасает от перекоса."
          en: "The Literary Digest gathered millions of replies and picked the wrong president, and Gallup’s far smaller sample got it right: size does not fix a skew."
      - id: planes-that-returned
        title: { ru: "Самолёты, которые вернулись", en: "The planes that came back" }
        summary:
          ru: "Ошибка выжившего на примере Абрахама Вальда и советов успешных людей, и что популярная легенда прибавила к настоящей работе Вальда."
          en: "Survivorship bias, with Abraham Wald and the advice of successful people, and what the popular legend added to Wald’s real work."
      - id: measure-as-target
        title: { ru: "Когда показатель становится целью", en: "When a measure becomes a target" }
        summary:
          ru: "Закон Гудхарта: как ломаются рейтинги, отчёты и тесты моделей, когда за число начинают платить."
          en: "Goodhart’s law: how rankings, reports and model benchmarks break once someone gets paid for the number."
  - id: cause
    title: { ru: "Связь и причина", en: "Correlation and cause" }
    summary:
      ru: "Две линии, идущие вместе, ещё ничего не объясняют, и установить причину гораздо труднее, чем показать связь."
      en: "Two lines moving together explain nothing yet, and establishing a cause is far harder than showing a link."
    lessons:
      - id: link-not-cause
        title: { ru: "Связь ещё не причина", en: "A link is not a cause" }
        summary:
          ru: "Третий фактор, причина и следствие наоборот и простое совпадение: как заметить каждое, когда вам показывают красивую линию."
          en: "A third factor, cause and effect reversed and plain coincidence: how to spot each when someone shows you a handsome line."
      - id: simpsons-paradox
        title: { ru: "Парадокс Симпсона", en: "Simpson’s paradox" }
        summary:
          ru: "Приём в Беркли: в целом женщин принимали реже, а по факультетам перекоса против них не нашлось, и вывод зависит от того, как сложить данные."
          en: "Berkeley admissions: overall women got in less often, by department the bias vanished, so the conclusion depends on how the data is added up."
      - id: why-experiments
        title: { ru: "Зачем нужен эксперимент", en: "Why experiments exist" }
        summary:
          ru: "Наблюдения обещали, что гормональная терапия бережёт сердце, а испытание этого не подтвердило: что даёт случайное распределение, а чего не даёт."
          en: "Observational studies suggested hormone therapy protects the heart, and a randomized trial did not bear that out: what random assignment gives you."
  - id: charts
    title: { ru: "Графики", en: "Charts" }
    summary:
      ru: "График убеждает быстрее текста, поэтому читать его надо медленнее."
      en: "A chart persuades faster than text, which is why it needs reading more slowly."
    lessons:
      - id: same-numbers
        title: { ru: "Одинаковые числа, разные картины", en: "Same numbers, different pictures" }
        summary:
          ru: "Квартет Анскомба: четыре набора данных с почти одинаковой статистикой и совсем разными графиками, и почему одного итогового числа мало."
          en: "Anscombe’s quartet: four data sets with nearly the same statistics and quite different plots, and why one summary number is not enough."
      - id: misleading-charts
        title: { ru: "Как график вводит в заблуждение", en: "How a chart misleads" }
        summary:
          ru: "Обрезанная ось, картинка вместо столбца и две шкалы на одном рисунке: как заметить их за десять секунд."
          en: "The cropped axis, the picture in place of a bar and two scales on one plot: how to spot them in ten seconds."
  - id: reading-a-study
    title: { ru: "Как читать исследование", en: "How to read a study" }
    summary:
      ru: "«Учёные доказали» часто значит одну работу с одним порогом, и здесь разобрано, что за этим стоит."
      en: "“Scientists have proved” often means one paper with one threshold, and this part explains what stands behind it."
    lessons:
      - id: p-value
        title: { ru: "Что значит p меньше 0,05", en: "What p below 0.05 means" }
        summary:
          ru: "Что p-значение говорит на самом деле: ни вероятности гипотезы, ни размера эффекта оно не даёт."
          en: "What a p-value really says: it gives neither the probability of a hypothesis nor the size of an effect."
      - id: significant-not-important
        title: { ru: "Значимо ещё не значит важно", en: "Significant does not mean important" }
        summary:
          ru: "Большое исследование находит и крошечную разницу, а вопрос в том, что она меняет для живого человека."
          en: "A large study will find even a tiny difference, and the question is what it changes for an actual person."
      - id: fishing
        title: { ru: "Подбор до нужного результата", en: "Fishing for a result" }
        summary:
          ru: "Свобода в сборе и анализе данных резко повышает долю ложных открытий: на что смотреть в методах чужой работы."
          en: "Freedom in collecting and analyzing data sharply raises the rate of false findings: what to look for in a paper’s methods."
      - id: replication-crisis
        title: { ru: "Кризис воспроизводимости", en: "The replication crisis" }
        summary:
          ru: "Что случилось, когда большой проект заново повторил сотню работ по психологии, и почему этот вывод тоже оспаривают."
          en: "What happened when a large project repeated a hundred psychology studies, and why that finding is disputed too."
      - id: charts-on-demand
        title: { ru: "Заглянем вперёд: графики по запросу", en: "A look ahead: charts on demand" }
        summary:
          ru: "Модели строят анализ и графики за секунды, так что дешевеют и честный разбор, и подгонка: что спрашивать, когда за числами нет человека."
          en: "Models produce analysis and charts in seconds, so honest work and fudging both get cheaper: what to ask when no person stands behind the numbers."
        ahead: true
