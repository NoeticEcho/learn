# Reading health claims and using a chatbot about symptoms sensibly (docs/specs/2026-11-01-platform-design.md §7.2).
# Not medical advice, and it says so in `about`. No treatment claim anywhere; it points to a doctor and to emergency help.
# Relative risk and base rates are taught in `numbers` and only applied to screening here; sleep is `resilience`'s.
id: health
history: true
title: { ru: "Здоровье: как читать заявления и спрашивать чат-бота", en: "Health: reading claims and using a chatbot sensibly" }
tagline:
  ru: "Как понимать заявления о здоровье и риске, что спрашивать у чат-бота о симптомах и когда сразу идти к врачу или звонить в скорую."
  en: "How to read claims about health and risk, what to ask a chatbot about symptoms, and when to see a doctor or call an emergency number at once."
about:
  ru: "Курс для всех, кто читает новости о лекарствах и спрашивает чат-бота о симптомах. Вы научитесь отличать сильные данные от слабых, понимать результаты обследований, готовиться к приёму и видеть, когда нужна срочная помощь. Это не медицинский совет: курс не ставит диагнозов и не советует лечения, а решения о здоровье принимают вместе с врачом."
  en: "A course for anyone who reads news about medicines and asks a chatbot about symptoms. You will learn to tell strong evidence from weak, make sense of screening results, prepare for an appointment and recognize when you need urgent help. This is not medical advice: the course makes no diagnosis and recommends no treatment, and decisions about your health belong with you and your doctor."
parts:
  - id: evidence
    title: { ru: "Как читать доказательства", en: "How to read the evidence" }
    summary:
      ru: "Заголовок о новом открытии редко говорит, насколько ему можно верить и как оно относится к вам."
      en: "A headline about a new finding rarely says how far to trust it or what it has to do with you."
    lessons:
      - id: levels-of-evidence
        title: { ru: "Уровни доказательств", en: "Levels of evidence" }
        summary:
          ru: "От случая из практики и опыта на клетках до рандомизированного испытания: что может сказать каждый уровень, а что нет."
          en: "From a single case and a study in cells to a randomized trial: what each level can tell you and what it cannot."
      - id: screening-and-base-rates
        title: { ru: "Скрининг и базовая частота", en: "Screening and base rates" }
        summary:
          ru: "Что значит положительный результат, если болезнь редка: идея относительного риска и базовой частоты из курса о числах, применённая к обследованиям."
          en: "What a positive result means when a disease is rare: the ideas of relative risk and base rate from the course on numbers, applied to screening."
      - id: overdiagnosis
        title: { ru: "Когда ранняя находка не помогает", en: "When an early finding does not help" }
        summary:
          ru: "Что такое гипердиагностика, почему обследование может найти то, что никогда бы не навредило, и о чём спросить врача."
          en: "What overdiagnosis is, why a screening can find what would never have harmed you, and what to ask your doctor."
  - id: misinformation
    title: { ru: "Медицинская ложь", en: "Medical misinformation" }
    summary:
      ru: "Ложное заявление живёт дольше опровержения, особенно когда на нём зарабатывают."
      en: "A false claim outlives its correction, especially when someone is earning from it."
    lessons:
      - id: retracted-paper
        title: { ru: "Статья, которую отозвали, и миф, который остался", en: "The retracted paper and the myth that stayed" }
        summary:
          ru: "Работу Уэйкфилда о вакцине и аутизме отозвали, а страх остался: почему опровержение так плохо догоняет миф."
          en: "Wakefield’s paper on a vaccine and autism was retracted and the fear stayed: why a correction has such trouble catching up with a myth."
      - id: miracle-cures
        title: { ru: "Чудо-средства и добавки", en: "Miracle remedies and supplements" }
        summary:
          ru: "Признаки рекламы под видом науки, чем добавка отличается от лекарства и как проверить заявление, прежде чем платить."
          en: "The signs of marketing dressed as science, how a supplement differs from a drug in what it must prove, and how to check a claim before you pay."
  - id: chatbot
    title: { ru: "Чат-бот и симптомы", en: "A chatbot and your symptoms" }
    summary:
      ru: "Модель много знает о медицине, но это ещё не значит, что с её помощью человек примет лучшее решение."
      en: "A model knows a lot about medicine, which does not mean a person using it will make a better decision."
    lessons:
      - id: what-accuracy-studies-show
        title: { ru: "Что показывают исследования точности", en: "What accuracy studies show" }
        summary:
          ru: "Почему высокая точность модели на задачах из учебника ещё не значит, что человек рядом с ней решит лучше."
          en: "Why a model’s high score on textbook cases does not mean the person beside it will decide any better."
      - id: chatbot-and-urgency
        title: { ru: "Чат-бот и срочность", en: "A chatbot and urgency" }
        summary:
          ru: "Чат-бот может недооценить срочность: как это проверяют, чего такие проверки не показывают и почему при тревожных признаках спрашивать надо не его."
          en: "A chatbot can underrate urgency: how that gets tested, what such tests do not show, and why with warning signs it is not the one to ask."
      - id: how-to-ask-about-symptoms
        title: { ru: "Как спрашивать о симптомах", en: "How to ask about symptoms" }
        summary:
          ru: "Как описать состояние полно, спросить, что опасно пропустить, и не принять вежливое согласие модели за проверку."
          en: "How to describe the situation fully, ask what must not be missed,, not take a model’s polite agreement for a check."
  - id: data
    title: { ru: "Данные о вашем теле", en: "Data about your body" }
    summary:
      ru: "Часы и приложения знают о вас всё больше, а понимать их показания и беречь их приходится вам."
      en: "Watches and apps know more and more about you, and reading what they say and protecting it falls to you."
    lessons:
      - id: wearables
        title: { ru: "Часы на руке: что они измеряют", en: "What a watch on your wrist measures" }
        summary:
          ru: "Как отличать сигнал от диагноза и зачем после уведомления о нерегулярном пульсе идти к врачу."
          en: "How to tell a signal from a diagnosis, and why an irregular pulse notification is a reason to see a doctor."
      - id: who-gets-health-data
        title: { ru: "Кому достаются ваши медицинские данные", en: "Who gets your health data" }
        summary:
          ru: "Врачебная тайна связывает клинику, а приложения и чат-боты живут по другим правилам: что им отдавать и что проверить в условиях."
          en: "Medical confidentiality binds your clinic, not most apps and chatbots: what to tell them, and what to check in their terms."
  - id: care
    title: { ru: "К врачу и в скорую", en: "The doctor and the emergency line" }
    summary:
      ru: "Ни один курс и ни один чат-бот не осмотрит вас, поэтому здесь о том, когда и как обращаться к тем, кто осмотрит."
      en: "No course and no chatbot can examine you, so this part is about when and how to go to people who can."
    lessons:
      - id: when-to-see-a-doctor
        title: { ru: "Когда идти к врачу", en: "When to see a doctor" }
        summary:
          ru: "Что не стоит наблюдать дома: новое, необъяснимое, долгое или ухудшающееся, и почему спокойный ответ чат-бота этого не отменяет."
          en: "What not to keep watching at home: anything new, unexplained, lasting or getting worse, and why a chatbot’s calm answer does not change that."
      - id: when-to-call-emergency
        title: { ru: "Когда сразу звонить в скорую", en: "When to call an emergency number at once" }
        summary:
          ru: "Внезапная слабость, нарушение речи, боль в груди, тяжёлое дыхание, мысли о самоубийстве: кому звонить и что сказать, не теряя времени на чат."
          en: "Sudden weakness, trouble speaking, chest pain, severe trouble breathing, thoughts of suicide: whom to call and what to say, with no time lost on a chat."
      - id: prepare-for-an-appointment
        title: { ru: "Как подготовиться к приёму", en: "How to prepare for an appointment" }
        summary:
          ru: "Хронология симптомов, список лекарств и главные вопросы на одной странице, которую можно составить и с чат-ботом, не отдавая ему лишнего."
          en: "A timeline of symptoms, a list of medicines and your main questions on one page, which a chatbot can help draft without being told more than it needs."
      - id: what-you-may-ask-for
        title: { ru: "Что вы вправе спросить у врача", en: "What you may ask your doctor for" }
        summary:
          ru: "Ваше право узнать о своём здоровье и получить копии документов и как попросить объяснить назначение простыми словами."
          en: "Your right to see your records, and how to ask for a plain explanation and a second opinion."
      - id: model-with-your-records
        title: { ru: "Заглянем вперёд: модель с вашей медкартой", en: "A look ahead: a model with your medical records" }
        summary:
          ru: "Сервисы, которым отдают медицинскую карту, и главный вопрос: какие испытания на настоящих пациентах покажут, что от них лучше, а не хуже."
          en: "Services you hand your medical records to, and the main question: which trials on real patients will show they help rather than harm."
        ahead: true
