# Small programs and local models of your own, for people who do not program (docs/specs/2026-11-01-platform-design.md §7.2).
# Websites belong to the `web` course.
id: own-tools
history: true
title: { ru: "Свои инструменты: маленькие программы и модели", en: "Your own tools: small programs and local models" }
tagline:
  ru: "Как без профессии программиста собрать себе таблицу, скрипт или локальную модель, разобраться в чужом коде и не потерять данные."
  en: "How to build yourself a spreadsheet, a script or a local model without being a programmer, read code you did not write and keep your data safe."
about:
  ru: "Курс для тех, кто не программирует, но устал ждать, пока кто-то сделает нужный инструмент. Вы сможете собрать небольшую программу вместе с ИИ, прочитать и проверить её, хранить версии, чистить данные и запускать открытую модель на своём компьютере. Сайтов здесь нет: ими занимается курс «Сеть насквозь»."
  en: "A course for people who do not program and are tired of waiting for someone to build the tool they need. You will be able to make a small program with AI, read and test it, keep its versions, clean data and run an open model on your own computer. There are no websites here: those belong to the course “The Web, End to End.”"
parts:
  - id: spreadsheets
    title: { ru: "Таблица: ваша первая программа", en: "The spreadsheet: your first program" }
    summary:
      ru: "Кто пишет формулы, тот уже программирует и ошибается так же, как программисты."
      en: "Anyone who writes formulas is already programming, and makes the same kinds of mistakes programmers make."
    lessons:
      - id: everyones-program
        title: { ru: "Программа, которую пишут все", en: "The program everyone writes" }
        summary:
          ru: "VisiCalc дала формулы людям без профессии программиста: почему вашу таблицу стоит считать программой."
          en: "VisiCalc gave formulas to people who were not programmers: why your spreadsheet deserves to be treated as a program."
      - id: formulas-you-can-check
        title: { ru: "Формулы, которые можно проверить", en: "Formulas you can check" }
        summary:
          ru: "Данные отдельно от расчётов и контрольные суммы, на примере Рейнхарт и Рогоффа, чью ошибку в формуле заметил аспирант."
          en: "Data kept apart from calculations, and control totals, with the example of Reinhart and Rogoff, whose formula error a graduate student noticed."
      - id: outgrowing-spreadsheets
        title: { ru: "Когда таблицы уже мало", en: "When a spreadsheet is no longer enough" }
        summary:
          ru: "Как заметить предел таблицы заранее и куда переходить, на примере старого формата, из-за которого Англия потеряла данные о случаях ковида."
          en: "How to spot a spreadsheet’s limit in advance and where to move next, with the old file format that made England lose COVID cases."
  - id: scripts
    title: { ru: "Скрипт, написанный вместе с ИИ", en: "A script written with AI" }
    summary:
      ru: "Модель напишет программу за минуту, а решать, можно ли её запускать, придётся вам."
      en: "A model will write a program in a minute, and you will still have to decide whether it is safe to run."
    lessons:
      - id: first-script
        title: { ru: "Первый скрипт за вечер", en: "Your first script in an evening" }
        summary:
          ru: "Как описать модели рутину с файлами, получить короткую программу и запустить её сначала на копии, а не на настоящих данных."
          en: "How to describe a chore with files to a model, get a short program, and run it on a copy before it touches the real data."
      - id: vibe-coding-limits
        title: { ru: "Вайб-кодинг и где он заканчивается", en: "Vibe coding and where it ends" }
        summary:
          ru: "Код, в который не смотрят, годится для поделки на один раз и опасен там, где есть чужие данные, деньги или долгая жизнь впереди."
          en: "Code nobody looks at will do for a one-off and is dangerous wherever there is other people’s data, money or a long life ahead."
      - id: reading-code
        title: { ru: "Как читать код, который вы не писали", en: "How to read code you did not write" }
        summary:
          ru: "Что входит, что выходит и что уходит в сеть: как понять программу, не зная языка, и о чём спросить написавшую её модель."
          en: "What goes in, what comes out and what goes over the network: how to understand a program without knowing the language, and what to ask the model."
      - id: confident-and-insecure
        title: { ru: "Уверенность с дырой внутри", en: "Confidence with a hole in it" }
        summary:
          ru: "С ИИ-помощником люди могут писать менее безопасный код и при этом сильнее верить в его надёжность: как не попасть в эту ловушку."
          en: "With an AI assistant people can write less secure code and believe more firmly that it is secure: how to stay out of that trap."
  - id: keeping-it-working
    title: { ru: "Чтобы всё это не развалилось", en: "Keeping it from falling apart" }
    summary:
      ru: "Три привычки программистов, которые нужны и тем, кто пишет код чужими руками."
      en: "Three programmers’ habits that matter just as much to people whose code is written for them."
    lessons:
      - id: version-control
        title: { ru: "Машина времени для файлов", en: "A time machine for your files" }
        summary:
          ru: "Git без страшных слов: коммит, откат и ветка как способ разрешить модели всё сломать и спокойно вернуться назад."
          en: "Git without the scary words: a commit, a rollback and a branch as a way to let a model break everything and calmly go back."
      - id: tests
        title: { ru: "Тест как обещание", en: "A test as a promise" }
        summary:
          ru: "Как записать на нескольких примерах, что программа обязана делать, чтобы следующая правка не сломала работающее незаметно для вас."
          en: "How to write down, with a few cases, what a program must do, so that the next edit cannot quietly break what was working."
      - id: backups-and-keys
        title: { ru: "Резервные копии и ключи", en: "Backups and keys" }
        summary:
          ru: "Где хранить копию, чтобы она пережила ошибку вашей программы, и почему ключ от сервиса нельзя вставлять ни в код, ни в чат."
          en: "Where to keep a copy so that it survives a bug in your own program, and why a service’s key belongs neither in the code nor in a chat."
  - id: data
    title: { ru: "Ваши данные", en: "Your data" }
    summary:
      ru: "Большая часть работы с данными уходит на то, чтобы привести их в порядок и не испортить по дороге."
      en: "Much of working with data goes into getting it in order without damaging it on the way."
    lessons:
      - id: dirty-data
        title: { ru: "Грязные данные", en: "Dirty data" }
        summary:
          ru: "Дубли и разные написания одного имени: как чистить таблицу шагами, которые можно повторить, и отличать исправление от подгонки."
          en: "Duplicates and one name spelled several ways: how to clean a table in steps you can repeat, and how to tell correcting from fudging."
      - id: silent-conversion
        title: { ru: "Когда программа сама правит данные", en: "When software edits your data for you" }
        summary:
          ru: "Excel так упорно превращал названия генов в даты, что гены переименовали: как поймать такие тихие подмены у себя."
          en: "Excel turned gene names into dates so persistently that the genes were renamed: how to catch such silent changes in your own files."
  - id: local-models
    title: { ru: "Модель на своём компьютере", en: "A model on your own computer" }
    summary:
      ru: "Открытую модель можно запустить у себя, и тогда ваши файлы никуда не уходят, а её пределы становятся вашей заботой."
      en: "You can run an open model at home: your files then go nowhere, and its limits become your concern."
    lessons:
      - id: why-local
        title: { ru: "Зачем запускать модель у себя", en: "Why run a model yourself" }
        summary:
          ru: "Большие модели теперь работают и на обычных компьютерах: что это даёт в приватности и чего стоит в качестве и времени."
          en: "Large models now run on ordinary computers too: what that gains in privacy, and what it costs in quality and time."
      - id: running-one
        title: { ru: "Как запустить и на что смотреть", en: "How to run one and what to look at" }
        summary:
          ru: "Как прикинуть, что потянет ваш компьютер, и проверить модель на своих задачах, а не по чужим рейтингам."
          en: "How to estimate what your machine can carry, and test a model on your own tasks, not by someone’s ranking."
      - id: your-documents
        title: { ru: "Модель и ваши документы", en: "A model and your own documents" }
        summary:
          ru: "Как модель отвечает по вашим файлам, как заставить её указать место в тексте и где такой поиск ошибается."
          en: "How a model answers from your files, how to make it point to the passage, and where such search goes wrong."
      - id: disposable-software
        title: { ru: "Заглянем вперёд: программа на один раз", en: "A look ahead: software for one use" }
        summary:
          ru: "Если программа на один вечер станет почти бесплатной, что случится с покупными сервисами и кто будет чинить написанное машиной."
          en: "If a program for one evening becomes nearly free, what happens to the services you pay for, and who fixes what a machine wrote."
        ahead: true
