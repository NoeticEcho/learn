# Copyright, liability, contracts and rules around AI (docs/specs/2026-11-01-platform-design.md §7.2).
# What the law says now; who should answer is `responsibility`'s. General information, not legal advice. Each
# edition's line says its reader's law; what is unsettled says so. Cases and dates that move belong to the
# lessons, which must check them when they are written.
id: law
history: true
title: { ru: "Право и ИИ: авторство, ответственность, договоры", en: "Law and AI: authorship, liability, contracts" }
tagline:
  ru: "Кому принадлежит сгенерированное, кто отвечает за ошибку модели и что вы подписываете: общие сведения с пометкой о нерешённом."
  en: "Who owns generated work, who answers for a model’s mistake and what you are signing: general information, with the unsettled parts marked."
about:
  ru: "Курс для тех, кто работает с ИИ или создаёт что-то с его помощью: вы будете знать, как устроены авторское право, ответственность и договоры вокруг моделей, и отличать решённое от спорного. Это общая информация, а не юридическая консультация: со своим делом идите к адвокату или юристу по интеллектуальной собственности. Русская версия опирается на право России, английская на право США, ЕС и Великобритании."
  en: "A course for people who work with AI or make things with it: you will know how copyright, liability and contracts apply around models, and tell what is settled from what is not. This is general information, not legal advice: take your own case to an attorney or an intellectual property specialist. This edition follows US, EU and UK law, and the Russian edition follows Russia’s."
parts:
  - id: authorship
    title: { ru: "Авторство и образ", en: "Authorship and likeness" }
    summary:
      ru: "Старое авторское право встретилось с автором, которого в нём не предусмотрели, и ответы пока есть только на часть вопросов."
      en: "Old copyright law has met an author it never planned for, and so far only some of the questions have answers."
    lessons:
      - id: whose-law-applies
        title: { ru: "Чьё право применяется", en: "Whose law applies" }
        summary:
          ru: "Где вы живёте, где работает сервис и что написано в его условиях: с этого начинается любой вопрос, и ответы в разных странах расходятся."
          en: "Where you live, where the service operates and what its terms say: every question starts there, and the answers differ from country to country."
      - id: who-owns-model-output
        title: { ru: "Кто автор, если писала модель", en: "Who owns what a model writes" }
        summary:
          ru: "Часть четвёртая Гражданского кодекса признаёт автором только человека, чьим творческим трудом создан результат: что это значит для текста от модели."
          en: "US courts and the Copyright Office require a human author: what that means for what a model writes, and why prompts alone may not be enough."
      - id: how-much-human
        title: { ru: "Сколько человека нужно", en: "How much human is enough" }
        summary:
          ru: "Закон этого не измеряет, и практика ещё складывается: какой вклад можно показать и какие черновики и правки стоит хранить."
          en: "Protection covers what a person added, the line has not been drawn, and this part is unsettled: what to keep as a record of your contribution."
      - id: real-face-and-voice
        title: { ru: "Чужое лицо и голос в ролике", en: "A real person’s face and voice in your video" }
        summary:
          ru: "Что закон говорит о чужом изображении, что выяснять заранее, если копируют не лицо, а голос, и когда нужно согласие."
          en: "Publicity rights and the EU’s duty to disclose deepfakes: what applies when your video borrows a real person."
  - id: training
    title: { ru: "Обучение на чужих работах", en: "Training on other people’s work" }
    summary:
      ru: "Один из главных споров этой области идёт прямо сейчас, и ни одна страна ещё не поставила в нём точку."
      en: "One of the main disputes in this field is under way now, and no country has had the last word."
    lessons:
      - id: training-in-us-courts
        title: { ru: "Суды США об обучении моделей", en: "US courts on training models" }
        summary:
          ru: "Как суды США сейчас решают вопрос об обучении моделей на чужих книгах и почему он остаётся открытым."
          en: "How US courts are now deciding whether training models on other people’s books is fair use, and why the question stays open."
      - id: training-under-your-law
        title: { ru: "Обучение моделей по российскому праву", en: "Training in Europe and Britain" }
        summary:
          ru: "Что российское право говорит об обучении на охраняемых произведениях и чего пока не знают ни авторы, ни разработчики."
          en: "The EU’s text and data mining exception with its opt-out, how European and British courts have begun to rule on training, and why none of it is the last word."
      - id: keeping-your-work-out
        title: { ru: "Можно ли запретить учиться на своей работе", en: "Keeping your work out of training" }
        summary:
          ru: "Что автор может сделать сегодня: договоры, условия на сайте и технические запреты, и почему их действие ещё мало проверено на практике."
          en: "The opt-out EU law allows, the terms on your site and machine-readable signals: what a creator can do today, and how little of it has been tested."
  - id: liability
    title: { ru: "Кто отвечает", en: "Who answers" }
    summary:
      ru: "У модели нет ни кошелька, ни лицензии, поэтому отвечать приходится кому-то из людей или компаний."
      en: "A model has neither a wallet nor a license, so a person or a company has to answer."
    lessons:
      - id: who-answers-for-a-chatbot
        title: { ru: "Кто отвечает за слова чат-бота", en: "Who answers for a chatbot’s words" }
        summary:
          ru: "Дело Moffatt против Air Canada, где за слова чат-бота ответила компания, и что из него следует там, где таких дел ещё не было."
          en: "Moffatt v. Air Canada, where the company answered for its chatbot’s words, and what follows where no such case has been heard."
      - id: invented-cases
        title: { ru: "Выдуманные дела в суде", en: "Invented cases in court" }
        summary:
          ru: "Дело Mata против Avianca: адвокатов наказали за несуществующие ссылки от ChatGPT, и проверка остаётся на том, кто подписал."
          en: "Mata v. Avianca: lawyers were sanctioned over nonexistent cases from ChatGPT, and checking stays with the person who signs."
      - id: publishing-model-output
        title: { ru: "Опубликовали ответ модели: что теперь ваше", en: "You published a model’s answer: what is now yours" }
        summary:
          ru: "Клевета, чужой текст в результате и ложная реклама: почему отвечать, скорее всего, будет тот, кто опубликовал."
          en: "Defamation, someone else’s text in the output and false advertising: why the likely defendant is whoever published it."
      - id: when-an-algorithm-decides
        title: { ru: "Когда решает алгоритм", en: "When an algorithm decides" }
        summary:
          ru: "Что закон о персональных данных говорит о решениях без участия человека и как возразить при отказе в работе или кредите."
          en: "What GDPR says about solely automated decisions, and what you can ask when software turns you down for a job or a loan."
  - id: contracts
    title: { ru: "Договоры", en: "Contracts" }
    summary:
      ru: "Многое из того, что закон оставил открытым, уже решено бумагой, которую вы подписали, не читая."
      en: "Much of what the law leaves open has already been decided by a document you signed without reading."
    lessons:
      - id: service-terms
        title: { ru: "Условия сервиса: что вы подписали", en: "Service terms: what you signed" }
        summary:
          ru: "Кому принадлежит результат, можно ли учиться на ваших данных и что вы обещаете компании сами."
          en: "Who owns the output, whether your data can be used for training, and what you promise the company in return."
      - id: ai-at-work
        title: { ru: "ИИ на работе: что чьё", en: "AI at work: what belongs to whom" }
        summary:
          ru: "Служебное произведение, коммерческая тайна и соглашение о неразглашении: что нельзя вставлять в чат и кому принадлежит сделанное с моделью."
          en: "Work made for hire, trade secrets and your confidentiality agreement: what you may not paste into a chat, and who owns what you made with a model."
      - id: clients-and-generated-work
        title: { ru: "Заказчик и сгенерированный результат", en: "Clients and generated work" }
        summary:
          ru: "Как фрилансеру и автору говорить о моделях в договоре и что раскрывать, если права на результат неясны."
          en: "How a freelancer or an author handles models in a contract, and what to disclose when the rights are unclear."
  - id: rules
    title: { ru: "Правила и к кому идти", en: "Rules, and who to go to" }
    summary:
      ru: "Законы об ИИ только появились и вступают в силу частями, поэтому важно проверять сроки и обращаться к живому специалисту."
      en: "Laws on AI are new and take effect in stages, so it matters to check the dates and to go to a real specialist."
    lessons:
      - id: rules-at-home
        title: { ru: "Правила об ИИ в России", en: "The EU AI Act in stages" }
        summary:
          ru: "Что российское право требует от тех, кто делает и применяет ИИ, и как проверить, действует ли уже норма, о которой пишут."
          en: "A law of 2024 that takes effect in stages: what it bans, what it asks of general-purpose models, and how to check which stage applies today."
      - id: rules-elsewhere
        title: { ru: "Закон ЕС об ИИ: когда он касается вас", en: "Rules outside the EU: finding yours" }
        summary:
          ru: "Европейский закон 2024 года вступает в силу по частям: как он доходит до вас через европейского заказчика и как проверить сроки."
          en: "How to find the rules that bind you outside the EU, from US state laws to the new laws of other countries."
      - id: who-to-ask
        title: { ru: "Кого спросить и что принести", en: "Who to ask and what to bring" }
        summary:
          ru: "Адвокат, юрист по интеллектуальной собственности, патентный поверенный: к кому с каким вопросом и почему ответ чат-бота не заменяет консультацию."
          en: "An attorney, an IP specialist or, in Britain, a solicitor: which for which question, and why a chatbot’s answer does not replace that advice."
      - id: which-disputes-settle-first
        title: { ru: "Заглянем вперёд: какие споры решатся первыми", en: "A look ahead: which disputes settle first" }
        summary:
          ru: "Обучение моделей, маркировка и первые дела по новым законам: за чем следить и как не принять новость об одном суде за новый закон."
          en: "Training, labeling and the first cases under new laws: what to watch, and how not to mistake one court’s ruling for a new law."
        ahead: true
