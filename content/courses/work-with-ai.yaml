# Giving a machine a task: the craft, where `ai` teaches the mechanics (docs/specs/2026-11-01-platform-design.md §7.2).
# Prompt injection from the user's side and agent permissions live here; keeping your own thought is `thinking`'s.
id: work-with-ai
history: true
title: { ru: "Работать с машиной: от просьбы до агента", en: "Working with a machine: from a request to an agent" }
tagline:
  ru: "Как ставить машине задачу, поручать ей настоящую работу, ограничивать её права и проверять результат, даже если вы не программировали."
  en: "How to set a machine a task, hand it real work, limit what it may touch and check the result, even if you have never programmed."
about:
  ru: "Курс для тех, кто уже пробовал чат-ботов и хочет получать от них работу, а не текст, похожий на работу. Вы научитесь ставить задачу, давать контекст и примеры, решать, что можно поручить, ограничивать права агента и проверять сделанное. Как модель устроена внутри, рассказывает курс «ИИ: от символов до агентов», а здесь речь о ремесле, и программировать для него не нужно."
  en: "A course for people who have tried chatbots and want work from them, not text that resembles work. You will learn to set a task, give context and examples, decide what can be handed over, limit what an agent may do and check what it did. The course “AI: from symbols to agents” explains what is inside a model; this one is about the craft, and it takes no programming."
parts:
  - id: request
    title: { ru: "Хорошая просьба", en: "A good request" }
    summary:
      ru: "Просьба к машине устроена как поручение человеку: чем точнее задача, тем меньше модель додумывает за вас."
      en: "A request to a machine works like a brief to a person: the more exact the task, the less the model fills in for you."
    lessons:
      - id: brief-not-question
        title: { ru: "Поручение вместо вопроса", en: "A brief, not a question" }
        summary:
          ru: "Для кого это, что должно получиться и как вы поймёте, что всё верно: без этого модель решает за вас."
          en: "Who it is for, what should come out and how you will know it is right: without these, the model decides for you."
      - id: context
        title: { ru: "Чего машина о вас не знает", en: "What the machine does not know about you" }
        summary:
          ru: "Модель видит только то, что вы ей дали: какие документы и обстоятельства приложить, а какие только помешают."
          en: "A model sees only what you gave it: which documents and circumstances to attach, and which only get in the way."
      - id: examples
        title: { ru: "Покажите, а не описывайте", en: "Show it, do not describe it" }
        summary:
          ru: "Хороший и плохой образец часто объясняют формат лучше абзаца инструкций, но модель может скопировать и их случайные черты."
          en: "One good sample and one bad often explain a format better than a paragraph of instructions, though a model may copy their accidental traits too."
      - id: standing-instructions
        title: { ru: "Постоянные инструкции", en: "Standing instructions" }
        summary:
          ru: "Настройки проекта и файл с правилами: что стоит записать один раз и почему слишком длинный свод правил перестаёт работать."
          en: "Project settings and a rules file: what is worth writing down once, and why an overlong rulebook stops working."
      - id: bad-answer
        title: { ru: "Что делать с плохим ответом", en: "What to do with a bad answer" }
        summary:
          ru: "Уточнить, начать заново или сменить подход: как понять, что разговор зашёл в тупик и дальше только копит ошибки."
          en: "Refine it, start over or change the approach: how to tell that a conversation has hit a dead end and is only piling up mistakes."
  - id: delegating
    title: { ru: "Что поручать", en: "What to hand over" }
    summary:
      ru: "Главное решение принимается до первого запроса: поручать ли эту работу машине и какими кусками."
      en: "The main decision comes before the first prompt: whether this work should go to a machine at all, and in what pieces."
    lessons:
      - id: jagged-frontier
        title: { ru: "Неровная граница", en: "The jagged frontier" }
        summary:
          ru: "Где модель заметно помогает, где незаметно подводит и как найти эту неровную границу в своей работе."
          en: "Where a model clearly helps, where it quietly lets you down, and how to find that jagged line in your own work."
      - id: what-you-can-check
        title: { ru: "Поручайте то, что сможете проверить", en: "Hand over what you can check" }
        summary:
          ru: "Рабочее правило: задача подходит, если оценить результат дешевле, чем сделать самому, а цена незамеченной ошибки вам понятна."
          en: "A working rule: a task fits if judging the result costs less than doing it yourself, and you know what an unnoticed mistake would cost."
      - id: cutting-up
        title: { ru: "Большая работа по кускам", en: "Cutting a big job into pieces" }
        summary:
          ru: "Как разбить работу на шаги с промежуточными результатами, чтобы ошибка всплыла на втором шаге, а не в готовом отчёте."
          en: "How to divide work into steps with intermediate results, so that a mistake surfaces at step two, not in the finished report."
  - id: agents
    title: { ru: "Машина, которая действует", en: "A machine that acts" }
    summary:
      ru: "Агент не отвечает, а делает: у него появляются права, и за них отвечаете вы."
      en: "An agent does not answer, it acts: it gets permissions, and those are your responsibility."
    lessons:
      - id: briefing-an-agent
        title: { ru: "Поручение агенту", en: "Briefing an agent" }
        summary:
          ru: "Что добавить к обычной просьбе, когда исполнитель сделает сто шагов без вас: условие готовности, границы и момент, когда надо спросить."
          en: "What to add to an ordinary request when the worker will take a hundred steps without you: a definition of done, the limits, and when to stop and ask."
      - id: permissions
        title: { ru: "Какие права давать", en: "What permissions to give" }
        summary:
          ru: "Чтение, запись, отправка, оплата: как дать агенту минимум прав, держать копию и заранее решить, чего он не тронет."
          en: "Reading, writing, sending, paying: how to grant an agent the minimum, keep a copy, and decide in advance what it will not touch."
      - id: prompt-injection
        title: { ru: "Чужие приказы в вашей почте", en: "Someone else’s orders in your inbox" }
        summary:
          ru: "Письмо или страница могут отдавать приказы вашему помощнику: как выглядит внедрение инструкций со стороны пользователя и что с этим делать."
          en: "An email or a web page can give orders to your assistant: what prompt injection looks like from the user’s side, and what to do about it."
      - id: lethal-trifecta
        title: { ru: "Три доступа, которые нельзя сочетать", en: "Three kinds of access that do not mix" }
        summary:
          ru: "Личные данные, чужой текст и выход наружу: сочетание, которое Саймон Уиллисон назвал смертельной триадой, и что убрать, если оно у вас сложилось."
          en: "Private data, untrusted content and a way to send things out: the mix Simon Willison named the lethal trifecta, and what to remove if you have built it."
  - id: supervising
    title: { ru: "Проверка и надзор", en: "Checking and supervising" }
    summary:
      ru: "Работа сделана, когда вы это увидели сами, а не когда машина об этом написала."
      en: "Work is done when you have seen it yourself, not when the machine says so."
    lessons:
      - id: report-not-proof
        title: { ru: "Отчёт ещё не доказательство", en: "A report is not proof" }
        summary:
          ru: "Модель уверенно пишет «всё готово» и о несделанном, поэтому просите то, что можно увидеть самому: файл, ссылку, результат на известном примере."
          en: "A model will confidently write “all done” about work it did not do, so ask for what you can see yourself: a file, a link, a result on a known case."
      - id: reviewing
        title: { ru: "Как принимать чужую работу", en: "How to review work you did not do" }
        summary:
          ru: "Выборочная проверка, контрольные примеры и вторая модель в роли рецензента: как распределить внимание, когда прочитать всё невозможно."
          en: "Spot checks, test cases and a second model as a reviewer: how to spend your attention when you cannot read everything."
      - id: written-workflow
        title: { ru: "Письменный порядок работы: noetic-harness", en: "A written workflow: noetic-harness" }
        summary:
          ru: "Открытый проект NoeticEcho заставляет агентов работать по записанным процессам и не принимает шаг без доказательства: что перенести к себе, даже если вы не пишете код."
          en: "NoeticEcho’s open project holds agents to written workflows and refuses a step with no evidence: what to carry over even if you write no code."
      - id: many-agents
        title: { ru: "Один человек и много агентов: control-room", en: "One person, many agents: control-room" }
        summary:
          ru: "Что меняется, когда исполнителей несколько: споры за одни и те же файлы и ваше внимание как самое узкое место, на примере открытого проекта."
          en: "What changes when there are several workers: conflicts over the same files, and your attention as the narrowest point, seen in an open project."
      - id: what-it-remembers
        title: { ru: "Что агенту стоит помнить", en: "What an agent should remember" }
        summary:
          ru: "Заметки, файлы с правилами и библиотеки вроде Reminisce: что записывать на будущее и как устаревшая запись становится ошибкой."
          en: "Notes, rules files and libraries such as Reminisce: what to write down for next time, and how a stale note turns into a mistake."
      - id: from-tasks-to-oversight
        title: { ru: "Заглянем вперёд: от поручений к надзору", en: "A look ahead: from tasks to oversight" }
        summary:
          ru: "Если агенты будут работать без присмотра всё дольше, какие навыки поднимутся в цене и как отличить настоящее от обещанного."
          en: "If agents keep working longer without a person watching, which skills gain value, and how to tell what is real from what is only promised."
        ahead: true
