# Defending against an attacker (docs/specs/2026-11-01-platform-design.md §7.3). Data that flows without malice is
# `privacy`'s; investment scams are `money`'s; prompt injection and agent permissions are `work-with-ai`'s.
id: security
history: true
title: { ru: "Безопасность: защита от того, кто вас атакует", en: "Security: defending against an attacker" }
tagline:
  ru: "Как защитить аккаунты, деньги и близких от писем без ошибок и клонированных голосов и что делать в первый час после взлома."
  en: "How to protect your accounts, money and family from flawless phishing and cloned voices, and what to do in the first hour after a breach."
about:
  ru: "Курс для всех, у кого есть почта, банк и родители с телефоном. Вы настроите менеджер паролей, вход без пароля и резервные копии, договоритесь с близкими о кодовом слове и будете знать порядок действий при взломе. Здесь речь о нападающем, а о том, куда данные уходят без злого умысла, рассказывает курс «Приватность»."
  en: "A course for anyone with an email account, a bank and parents with a phone. You will set up a password manager, passkeys and backups, agree on a code word with your family, and know the order of steps when an account is taken. This is about an attacker: data that flows without malice is in the Privacy course."
parts:
  - id: attacks
    title: { ru: "Как вас атакуют теперь", en: "How you are attacked now" }
    summary:
      ru: "Старые приметы обмана перестали работать, поэтому проверять приходится другое."
      en: "The old signs of a scam have stopped working, so what you check has to change."
    lessons:
      - id: who-attacks-you
        title: { ru: "Кто вас атакует и зачем", en: "Who attacks you and why" }
        summary:
          ru: "Чаще всего это не охота лично на вас, а дешёвая массовая рассылка, и понимание этой экономики подсказывает, какая защита окупается."
          en: "Most often it is not a hunt for you personally but a cheap mass campaign, and understanding that economy shows which defenses pay off."
      - id: phishing-by-model
        title: { ru: "Фишинг, который пишет модель", en: "Phishing written by a model" }
        summary:
          ru: "Письмо без ошибок и с подробностями из вашей жизни: ошибки больше не примета, поэтому проверять приходится канал, а не текст."
          en: "A message with no mistakes and with details from your life: errors are no longer a sign, so you check the channel, not the text."
      - id: cloned-voice
        title: { ru: "Клон голоса в телефоне", en: "A cloned voice on the phone" }
        summary:
          ru: "Голос близкого можно подделать по короткой записи: как устроен такой звонок и почему надёжнее всего положить трубку и перезвонить самому."
          en: "A relative’s voice can be faked from a short recording: how such a call works, and why the safest move is to hang up and call back yourself."
      - id: fake-video-call
        title: { ru: "Видеозвонок с теми, кого там не было", en: "A video call with people who were not there" }
        summary:
          ru: "Сотрудники уже переводили крупные суммы после видеовстречи с поддельным начальством: как теперь согласовывать платежи по звонку."
          en: "Employees have already sent large sums after a video meeting with faked executives: how to approve a payment on a call from now on."
      - id: bank-fraud-call
        title: { ru: "«Служба безопасности банка» на линии", en: "“Your bank’s fraud team” on the line" }
        summary:
          ru: "Почему настоящий банк не просит переводить деньги на «безопасный счёт», как работает давление срочностью и как прервать разговор."
          en: "Why a real bank does not ask you to move money to a “safe account,” how pressure works, and how to end the call."
  - id: locks
    title: { ru: "Замки", en: "Locks" }
    summary:
      ru: "Несколько настроек на один вечер закрывают большую часть того, чем пользуются нападающие."
      en: "A few settings, one evening’s work, close most of what attackers rely on."
    lessons:
      - id: password-manager
        title: { ru: "Менеджер паролей: один замок вместо сотни", en: "A password manager: one lock instead of a hundred" }
        summary:
          ru: "Длинный уникальный пароль на каждый сайт и почему менять пароли по расписанию больше не советуют."
          en: "A long, unique password for every site, and why changing passwords on a schedule is no longer advised."
      - id: two-factor
        title: { ru: "Второй фактор: от СМС до аппаратного ключа", en: "Two-factor authentication: from text messages to a hardware key" }
        summary:
          ru: "Какие способы выдерживают фишинг, какие нет, почему СМС всё же лучше, чем ничего, и что будет, если потерять телефон."
          en: "Which methods stand up to phishing and which do not, why a text message still beats nothing, and what happens if you lose your phone."
      - id: passkeys
        title: { ru: "Passkey: вход без пароля", en: "Passkeys: signing in with no password" }
        summary:
          ru: "Как ключ доступа привязан к настоящему сайту и потому не отдаётся поддельному и как не потерять вход вместе с телефоном."
          en: "How a passkey is tied to the real site and so will not work on a fake one, and how not to lose access along with your phone."
      - id: email-master-key
        title: { ru: "Почта как главный ключ", en: "Your email is the master key" }
        summary:
          ru: "Через неё восстанавливается почти всё остальное, поэтому первой защищают именно её и способы её восстановления."
          en: "Almost everything else can be recovered through it, so it comes first, and so do the ways of recovering it."
      - id: backups
        title: { ru: "Резервные копии: 3-2-1 и пробное восстановление", en: "Backups: 3-2-1 and the test restore" }
        summary:
          ru: "Три копии на двух носителях, одна вне дома, и проверка, что копия восстанавливается, пока шифровальщик или кража ещё не случились."
          en: "Three copies on two kinds of media, one away from home, and a check that a copy really restores, before ransomware or a theft happens."
  - id: people
    title: { ru: "Люди вокруг вас", en: "The people around you" }
    summary:
      ru: "Вашу семью обманывают вашим голосом, поэтому защита должна быть общей, а договориться о ней надо заранее."
      en: "Your family can be deceived with your voice, so the defense has to be shared and agreed on in advance."
    lessons:
      - id: family-code-word
        title: { ru: "Семейное кодовое слово", en: "A family code word" }
        summary:
          ru: "Зачем семье секретное слово против поддельных голосов, как договориться о нём вживую и что делать, если звонящий его не знает."
          en: "Why a family needs a secret word against faked voices, how to agree on one in person, and what to do if the caller does not know it."
      - id: when-they-call-your-parents
        title: { ru: "Когда звонят вашим родителям", en: "When they call your parents" }
        summary:
          ru: "Как обсудить с пожилыми близкими звонки о срочных деньгах, без снисходительности и до того, как раздастся первый такой звонок."
          en: "How to talk with older relatives about calls demanding urgent money, without condescension and before the first such call comes."
  - id: breach
    title: { ru: "Когда это случилось", en: "When it has happened" }
    summary:
      ru: "Взлом случается и с осторожными людьми, и порядок действий важнее стыда."
      en: "A breach happens to careful people too, and the order of your steps matters more than the shame."
    lessons:
      - id: first-hour
        title: { ru: "Первый час после взлома", en: "The first hour after a breach" }
        summary:
          ru: "Сначала банк, потом почта, потом всё остальное: почему порядок важен и почему о чужом переводе банку надо сообщить сразу."
          en: "Your bank first, then your email, then the rest: why the order matters, and why an unauthorized transfer has to be reported at once."
      - id: your-data-leaked
        title: { ru: "Ваши данные утекли: что теперь", en: "Your data leaked: now what" }
        summary:
          ru: "Как проверить утечку и что делать потом: сменить повторявшиеся пароли, поставить самозапрет на кредиты и ждать точных писем от мошенников."
          en: "How to check whether you were in a breach and what comes next: change reused passwords, freeze your credit and expect well-aimed scams."
  - id: agents
    title: { ru: "Агент с вашим доступом", en: "An agent with your access" }
    summary:
      ru: "Агент, которому вы дали почту и файлы, становится новой дверью, и её тоже надо запирать."
      en: "An agent you gave your mail and files to becomes a new door, and it needs locking too."
    lessons:
      - id: agent-with-your-keys
        title: { ru: "Агент с вашими ключами", en: "An agent holding your keys" }
        summary:
          ru: "Чем агент с вашей почтой привлекает нападающего и что проверить после взлома; права и внедрение инструкций разбирает курс о работе с машиной."
          en: "What makes an agent with your mail a target and what to check after a breach; permissions and prompt injection are in the course on working with a machine."
      - id: attacks-run-by-a-machine
        title: { ru: "Заглянем вперёд: атаки, которые ведёт машина", en: "A look ahead: attacks run by a machine" }
        summary:
          ru: "Подделки в реальном времени и проверка личности, которая всё меньше может опираться на лицо и голос: к чему готовиться и что пока лишь обещают."
          en: "Real-time fakes and identity checks that can rely less and less on a face or a voice: what to prepare for, and what is only promised."
        ahead: true
