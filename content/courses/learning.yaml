# Metacognition and acquiring a new skill (docs/specs/2026-11-01-platform-design.md §7.2, §7.3, §7.4). A
# noetic-strand course. Keeping a skill you already have belongs to `thinking`; transfer of skills to
# `noetic-singularity/what-trains`.
id: learning
history: true
title: { ru: "Учиться новому: что подтверждено, а что легенда", en: "Learning something new: what holds up and what is legend" }
tagline:
  ru: "Какие способы учиться подтверждены исследованиями, как не поверить ощущению знания и как заниматься с ИИ так, чтобы он не думал за вас."
  en: "Which ways of learning have evidence behind them, how not to trust the feeling of knowing, and how to study with AI without it doing your thinking."
about:
  ru: "Если машины осваивают новое всё быстрее, умение учиться самому становится для человека главным, и это наша ставка, а не установленный факт. Вы узнаете, что подтверждено исследованиями, а что нет, научитесь замечать иллюзию знания и составите учебный план для занятого взрослого. Как сохранить уже имеющийся навык, рассказывает курс о мышлении, а здесь речь о новом."
  en: "If machines keep getting faster at picking up new things, the ability to learn for yourself becomes what matters most for a person, and that is our bet, not an established fact. You will find out what research supports and what it does not, learn to notice the illusion of knowing, and draw up a study plan for a busy adult. Keeping a skill you already have belongs to the course on thinking; this one is about new ones."
parts:
  - id: evidence
    title: { ru: "За чем стоят данные", en: "What has evidence behind it" }
    summary:
      ru: "У немногих способов учиться сильная доказательная база, и самые популярные в их число не входят."
      en: "Only a few ways of studying have a strong record, and the most popular ones are not among them."
    lessons:
      - id: retrieval
        title: { ru: "Вспоминать, а не перечитывать", en: "Recall instead of rereading" }
        summary:
          ru: "Почему самопроверка работает лучше перечитывания, хотя перечитывать приятнее, и как устроить её на своём материале."
          en: "Why testing yourself beats rereading, though rereading feels nicer, and how to set it up with your own material."
      - id: spacing
        title: { ru: "Перерывы между повторами", en: "Gaps between sessions" }
        summary:
          ru: "Кривая забывания Эббингауза и почему та же работа, разнесённая по дням, держится в памяти дольше, чем сделанная за один присест."
          en: "Ebbinghaus’s forgetting curve, and why the same work spread over days stays longer than the same work done in one sitting."
      - id: interleaving
        title: { ru: "Перемешивать задачи", en: "Mixing up your practice" }
        summary:
          ru: "Чередование часто даёт больше, хотя кажется хуже, и важно понимать, на каком материале оно того стоит."
          en: "Mixing often yields more though it feels worse, and it matters to know which material makes it worthwhile."
      - id: feedback
        title: { ru: "Обратная связь бывает вредной", en: "Feedback can hurt" }
        summary:
          ru: "В среднем обратная связь помогает, но нередко вредит, и многое зависит от того, о задаче она или о вас."
          en: "On average feedback helps, yet it often does harm, and much depends on whether it speaks about the task or about you."
  - id: illusions
    title: { ru: "Иллюзии знания", en: "Illusions of knowing" }
    summary:
      ru: "Ощущение, что вы поняли, плохо предсказывает, что вы сможете сделать через неделю, и этому ощущению можно не верить."
      en: "The feeling that you have understood is a poor guide to what you can do a week later, and you need not trust it."
    lessons:
      - id: feeling-of-learning
        title: { ru: "Ощущение, что вы учитесь", en: "The feeling of learning" }
        summary:
          ru: "Активные занятия кажутся менее полезными, чем хорошая лекция, а учат лучше: почему трудность бывает желательной, как говорит Бьорк."
          en: "Active classes feel less useful than a good lecture and teach more: why a difficulty can be desirable, as Robert Bjork puts it."
      - id: explain-a-zipper
        title: { ru: "Объясните, как устроена молния", en: "Explain how a zipper works" }
        summary:
          ru: "Попробуйте объяснить устройство простой вещи, и оценка своего понимания падает: иллюзия глубины как готовая самопроверка."
          en: "Try to explain a simple device and your rating of your own understanding drops: the illusion of depth as a ready self-test."
      - id: dunning-kruger
        title: { ru: "Что на самом деле показали Даннинг и Крюгер", en: "What Dunning and Kruger actually showed" }
        summary:
          ru: "Мем о дураках, которого в работе 1999 года нет, и спор о том, не статистический ли это артефакт."
          en: "The meme about fools that is not in the 1999 paper, and the dispute over whether the effect is a statistical artifact."
      - id: learning-styles
        title: { ru: "Миф о стилях обучения", en: "The myth of learning styles" }
        summary:
          ru: "Достаточных оснований подстраивать занятия под «визуалов» и «аудиалов» не нашлось, а верят в них по-прежнему многие."
          en: "No adequate basis has been found for matching lessons to “visual” or “auditory” learners, and plenty of people still believe in them."
  - id: skill
    title: { ru: "Как растёт умение", en: "How a skill grows" }
    summary:
      ru: "О практике сказано много громкого, а данные в этой области скромнее и всё ещё спорные."
      en: "Many loud things have been said about practice, and the data in this field is more modest and still in dispute."
    lessons:
      - id: deliberate-practice
        title: { ru: "Целенаправленная практика", en: "Deliberate practice" }
        summary:
          ru: "Чёткая цель, сложность чуть выше вашего уровня и тот, кто видит ошибку: почему простое повторение сюда не входит."
          en: "A clear goal, difficulty just past your level and someone who can see the error, and why mere repetition does not count."
      - id: ten-thousand-hours
        title: { ru: "Десять тысяч часов: чего не говорил Эрикссон", en: "Ten thousand hours: what Ericsson did not say" }
        summary:
          ru: "Как правило из популярной книги разошлось с тем, что писал сам Эрикссон, и сколько на самом деле объясняет практика."
          en: "How a rule from a popular book drifted from what Ericsson wrote, and how much practice really explains."
      - id: growth-mindset
        title: { ru: "Установка на рост без легенды", en: "Growth mindset without the legend" }
        summary:
          ru: "Эффекты оказались малы, и спорят теперь о том, кому такие занятия вообще помогают: что из этой идеи стоит оставить."
          en: "The effects turned out small, and the argument now is over whom such programs help at all: what of the idea is worth keeping."
  - id: ai-tutor
    title: { ru: "ИИ как учитель", en: "AI as a tutor" }
    summary:
      ru: "Одна и та же модель может и ускорить учёбу, и подменить её, и разница зависит от того, как вы ею пользуетесь."
      en: "The same model can speed up learning or replace it, and the difference lies in how you use it."
    lessons:
      - id: when-ai-hurts
        title: { ru: "Когда ИИ вредит учёбе", en: "When AI hurts learning" }
        summary:
          ru: "Чат-бот с готовыми ответами может поднять результат на занятии и опустить его потом: как понять, что это происходит с вами."
          en: "A chatbot that hands over answers can raise your score in practice and lower it afterward: how to tell it is happening to you."
      - id: when-ai-helps
        title: { ru: "Когда ИИ помогает", en: "When AI helps" }
        summary:
          ru: "Чем модель, настроенная учить, отличается от обычной и почему хороший результат сразу после занятия ещё не доказывает, что вы запомнили."
          en: "What sets a model tuned to teach apart from a plain one, and why a good result right after a session does not prove anything stayed."
      - id: two-sigma
        title: { ru: "Легенда о двух сигмах", en: "The two sigma legend" }
        summary:
          ru: "Что Блум в 1984 году говорил о репетиторах, что дают более поздние подсчёты и как после этого читать обещания ИИ-репетиторов."
          en: "What Bloom said about tutors in 1984, what later counts find, and how to read the promises of AI tutors with that in mind."
      - id: studying-with-a-model
        title: { ru: "Как заниматься с моделью", en: "How to study with a model" }
        summary:
          ru: "Сначала своя попытка, потом подсказка, вопросы вместо ответов и проверка без экрана: порядок, при котором думаете всё-таки вы."
          en: "Your own attempt first, then a hint, questions in place of answers and a test with the screen off: an order in which you still do the thinking."
  - id: your-course
    title: { ru: "Курс для себя", en: "A course of your own" }
    summary:
      ru: "Всё предыдущее имеет смысл, только если складывается в план, который вы выполните в обычную занятую неделю."
      en: "All of this counts only if it adds up to a plan you will carry out in an ordinary busy week."
    lessons:
      - id: how-to-know
        title: { ru: "Как понять, что вы научились", en: "How to know you have learned" }
        summary:
          ru: "Задача без подсказок, через неделю и на новом материале: проверка, которую трудно обмануть и без которой вы не знаете, сдвинулись ли с места."
          en: "A task with no hints, a week later and on new material: a test that is hard to fool, and without it you do not know whether you have moved."
      - id: course-for-one
        title: { ru: "Учебный план на одного", en: "A study plan for one" }
        summary:
          ru: "Цель как конкретное действие, короткие занятия в календаре и способ получать обратную связь, если рядом нет учителя."
          en: "A goal stated as a concrete action, short sessions in the calendar, and a way of getting feedback when no teacher is around."
      - id: a-tutor-for-everyone
        title: { ru: "Заглянем вперёд: репетитор у каждого", en: "A look ahead: a tutor for everyone" }
        summary:
          ru: "Если личный ИИ-репетитор станет обычным делом, редким окажется желание браться за трудное: это наша гипотеза, и её проверят долгие испытания."
          en: "If a personal AI tutor becomes ordinary, the rare thing will be the will to take on what is hard: that is our hypothesis, and long trials will test it."
        ahead: true
