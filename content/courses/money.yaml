# Personal finance and its new scams (docs/specs/2026-11-01-platform-design.md §7.2). General knowledge,
# not investment advice: no asset, fund, product or strategy is recommended, and no current rate or return appears.
# Investment scams live here; bank fraud calls are `security`'s.
id: money
history: true
title: { ru: "Деньги: личные финансы и новые мошенники", en: "Money: personal finance and its new scams" }
tagline:
  ru: "Как считать бюджет, долг и риск, что чат-бот может сделать с вашими деньгами и как распознать аферу с поддельным лицом."
  en: "How to work out a budget, a debt and a risk, what a chatbot can do with your money, and how to spot a scam with a synthetic face."
about:
  ru: "Курс для взрослых, которым никто не объяснял деньги по порядку. Вы сможете посчитать свой бюджет и стоимость долга, понимать идеи риска и диверсификации и проверять предложения, прежде чем платить. Это общие знания, а не инвестиционная рекомендация: курс не называет активов, фондов и стратегий, а крупные решения стоит обсуждать со специалистом, у которого есть обязанности перед вами."
  en: "A course for adults whom nobody ever walked through money in order. You will be able to work out your budget and the cost of a debt, understand the ideas of risk and diversification, and check an offer before you pay. This is general knowledge, not investment advice: the course names no asset, fund or strategy, and big decisions are worth taking to a professional who owes you a duty."
parts:
  - id: basics
    title: { ru: "Основа", en: "The basics" }
    summary:
      ru: "Несколько простых расчётов, которые в школе не проходили, а модель за вас не применит."
      en: "A few simple calculations nobody taught at school, and that a model will not apply to your life for you."
    lessons:
      - id: budget
        title: { ru: "Бюджет, который выдержит обычный месяц", en: "A budget that survives an ordinary month" }
        summary:
          ru: "Не таблица на идеальный год, а простой учёт того, что приходит и уходит, с местом для редких трат, о которых все забывают."
          en: "Not a spreadsheet for a perfect year but a simple record of what comes in and goes out, with room for the rare expenses everyone forgets."
      - id: compound-interest
        title: { ru: "Сложный процент в обе стороны", en: "Compound interest cuts both ways" }
        summary:
          ru: "Одна формула объясняет и рост накоплений за десятилетия, и то, как небольшой долг по карте становится большим."
          en: "One formula explains both how savings grow over decades and how a small card balance becomes a large one."
      - id: inflation
        title: { ru: "Инфляция: что можно купить на те же деньги", en: "Inflation: what the same money buys" }
        summary:
          ru: "Чем номинальное отличается от реального и почему число на счёте само по себе ничего не говорит."
          en: "The difference between nominal and real, and why the number in your account says little by itself."
      - id: cost-of-debt
        title: { ru: "Долг: сколько он стоит на самом деле", en: "Debt: what it really costs" }
        summary:
          ru: "Полная стоимость кредита и страховка в нагрузку: как сравнивать предложения и в каком порядке закрывать долги."
          en: "APR and the add-ons sold with a loan: how to compare offers, and in what order to pay debts down."
      - id: emergency-fund
        title: { ru: "Запас на случай беды", en: "An emergency fund" }
        summary:
          ru: "Зачем нужны деньги, которые просто лежат, и как прикинуть размер запаса под свою жизнь, а не под чужое правило."
          en: "Why you want money that just sits there, and how to estimate the size of it for your life, not by someone else’s rule."
  - id: risk
    title: { ru: "Риск и то, что вокруг него", en: "Risk and what surrounds it" }
    summary:
      ru: "Здесь идеи, а не рецепты: курс объясняет, как думать о риске, и не говорит, куда вкладывать."
      en: "These are ideas, not recipes: the course explains how to think about risk and does not say where to invest."
    lessons:
      - id: risk-and-return
        title: { ru: "Риск и доходность как идеи", en: "Risk and return as ideas" }
        summary:
          ru: "Почему обещание высокого дохода без риска уже подозрительно и что значит потерять деньги именно тогда, когда они понадобятся."
          en: "Why a promise of high returns without risk is already suspicious, and what it means to lose money at the very moment you need it."
      - id: diversification
        title: { ru: "Диверсификация: почему не всё в одно", en: "Diversification: why not all in one place" }
        summary:
          ru: "Какой риск разделение снижает, какой нет и почему ваша работа и жильё тоже часть этой картины."
          en: "Which risk spreading things out reduces, which it does not, and why your job and your home are part of the picture too."
      - id: insurance
        title: { ru: "Страховка: от чего она имеет смысл", en: "Insurance: what it makes sense for" }
        summary:
          ru: "Страхуют то, что разорит, а не то, что неприятно: как читать исключения и что навязывают вместе с кредитом."
          en: "You insure what would ruin you, not what would annoy you: how to read exclusions, and what gets pushed on you along with a loan."
      - id: taxes
        title: { ru: "Налоги: общая логика", en: "Taxes: the general logic" }
        summary:
          ru: "Когда налог удерживают за вас, когда считать его вам и к кому идти со своим случаем."
          en: "When tax is taken for you, when it is yours to work out, and who to ask about your own case."
  - id: scams
    title: { ru: "Новые лица старых афер", en: "New faces on old scams" }
    summary:
      ru: "Схемы почти не изменились, зато подделка знакомого лица и долгая переписка теперь стоят гроши."
      en: "The schemes have hardly changed, but faking a familiar face and keeping up a long conversation now cost next to nothing."
    lessons:
      - id: pyramid-anatomy
        title: { ru: "Как устроена финансовая пирамида", en: "The anatomy of a Ponzi scheme" }
        summary:
          ru: "От Понци до МММ схема одна: прежним вкладчикам платят деньгами новых, пока те не кончатся."
          en: "From Charles Ponzi to the schemes running today it is one design: earlier investors are paid with new investors’ money until it runs out."
      - id: celebrity-who-was-not-there
        title: { ru: "Знаменитость, которой там не было", en: "The celebrity who was never there" }
        summary:
          ru: "Ролик с поддельным лицом банкира или ведущего: как он попадает в рекламу и почему показ на известной площадке ничего не доказывает."
          en: "A video with the faked face of a banker or a TV host: how it gets into ads, and why seeing it on a well-known platform proves nothing."
      - id: friend-who-teaches-investing
        title: { ru: "Новый знакомый, который учит вкладывать", en: "The new friend who teaches you to invest" }
        summary:
          ru: "Долгая переписка, небольшая прибыль на поддельной платформе, потом просьба вложить больше: теперь такой разговор может вести и модель."
          en: "A long correspondence, a small profit on a fake platform, then a request to put in more: now a model can carry on that conversation too."
      - id: check-before-you-pay
        title: { ru: "Десять минут проверки перед переводом", en: "Ten minutes of checking before you pay" }
        summary:
          ru: "Справочник участников рынка Банка России и его список компаний с признаками нелегальной деятельности: что посмотреть, прежде чем платить."
          en: "FINRA’s BrokerCheck, the SEC’s adviser search and Britain’s FCA Register: what to look up before you send money to a platform you do not know."
      - id: recovery-scam
        title: { ru: "Вторая волна: вам обещают вернуть деньги", en: "The second wave: an offer to recover your money" }
        summary:
          ru: "Кто уже потерял деньги, попадает в списки, и вскоре появляется «юрист» или «служба возврата», которым нужна предоплата."
          en: "People who have already lost money end up on lists, and soon a “lawyer” or a “recovery service” turns up asking for payment in advance."
  - id: advice
    title: { ru: "Кто вам советует", en: "Who is advising you" }
    summary:
      ru: "Совет модели и совет человека различаются прежде всего тем, кто отвечает, если совет окажется плохим."
      en: "A model’s advice and a person’s differ above all in who answers if the advice turns out badly."
    lessons:
      - id: what-a-chatbot-can-do
        title: { ru: "Что чат-бот может сделать с деньгами", en: "What a chatbot can do with your money" }
        summary:
          ru: "Объяснить договор, разобрать выписку без лишних реквизитов, посчитать варианты и составить вопросы к специалисту."
          en: "Explain a contract, go through a statement with the account details removed, work out options and draft questions for a professional."
      - id: what-a-chatbot-cannot-do
        title: { ru: "Чего чат-бот с деньгами не может", en: "What a chatbot cannot do with your money" }
        summary:
          ru: "Он не отвечает за совет и уверенно ошибается в арифметике, поэтому любой расчёт стоит пересчитать самому."
          en: "It does not answer for its advice and can get the arithmetic confidently wrong, so redo any sum yourself."
      - id: advisers-duty
        title: { ru: "Что значит долг советника", en: "What an adviser’s duty means" }
        summary:
          ru: "Чем инвестиционный советник отличается от сотрудника банка, продающего продукт, и что спросить любого о его доходе и конфликте интересов."
          en: "How an investment adviser’s duty differs from a broker’s or a salesperson’s, and what to ask anyone about their pay and conflicts of interest."
      - id: agent-with-your-wallet
        title: { ru: "Заглянем вперёд: агент с доступом к кошельку", en: "A look ahead: an agent with your wallet" }
        summary:
          ru: "Агенты, которые сами сравнивают предложения и платят: какие лимиты ставить и кто ответит за их ошибку."
          en: "Agents that compare offers and pay by themselves: what limits to set, and who answers for their mistakes."
        ahead: true
