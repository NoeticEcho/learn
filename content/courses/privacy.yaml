# Where data flows without malice (docs/specs/2026-11-01-platform-design.md §7.3). An attacker is `security`'s.
# Each edition's law lines say that reader's law: 152-ФЗ in Russian, GDPR and the US states in English.
id: privacy
history: true
title: { ru: "Приватность: куда уходят ваши данные", en: "Privacy: where your data goes" }
tagline:
  ru: "Кто и что о вас собирает, что происходит с разговорами с чат-ботом и как по закону получить ответ от компании."
  en: "Who collects what about you, what happens to your chatbot conversations, and how to make a company answer you under the law."
about:
  ru: "Курс для тех, кто не собирается отказываться от телефона, но хочет понимать, куда с него уходят сведения. Вы сможете составить свою модель угроз, поменять настройки, от которых что-то зависит, и запросить у компании то, что она о вас хранит. Здесь речь о потоках данных без злого умысла: взломщики и мошенники разобраны в курсе «Безопасность»."
  en: "A course for people who are keeping their phone and want to understand where facts about them end up. You will be able to draw your own threat model, change the settings that make a difference, and ask a company what it holds on you. This is about data that flows without malice: attackers and scammers are in the Security course."
parts:
  - id: flows
    title: { ru: "Кто и что собирает", en: "Who collects what" }
    summary:
      ru: "Почти никто не охотится лично за вами, и всё же сведения о вас ходят по рынку, у которого есть свои участники и правила."
      en: "Almost nobody is hunting you personally, and facts about you still move through a market with its own players and rules."
    lessons:
      - id: three-kinds-of-data
        title: { ru: "Что вы отдали, что заметили, что вычислили", en: "What you gave, what was observed, what was inferred" }
        summary:
          ru: "Три вида сведений о человеке, и почему больше всего удивляет третий: выводы о здоровье и доходе, которых вы никому не сообщали."
          en: "Three kinds of facts about a person, and why the third surprises most: conclusions about your health and income that you never told anyone."
      - id: ad-auction
        title: { ru: "Рекламный аукцион за долю секунды", en: "The ad auction in a fraction of a second" }
        summary:
          ru: "Пока открывается страница, сведения о вас могут уйти многим участникам торгов, и почти никого из них вы не узнаете."
          en: "While a page opens, facts about you can reach many bidders, and you will never learn who almost all of them are."
      - id: data-brokers
        title: { ru: "Брокеры данных", en: "Data brokers" }
        summary:
          ru: "Кто покупает и перепродаёт сведения о людях, откуда их берёт и чем этот рынок в России отличается от американского."
          en: "Who buys and resells facts about people, where they get them, and what rights you have to get off their lists."
      - id: phone-location
        title: { ru: "Телефон знает, где вы были", en: "Your phone knows where you have been" }
        summary:
          ru: "Как из точек на карте получаются ваш адрес, работа и распорядок дня и какие разрешения приложений этому помогают."
          en: "How dots on a map turn into your address, your job and your daily routine, and which app permissions make it possible."
      - id: face-and-voice-as-data
        title: { ru: "Лицо и голос как данные", en: "Your face and voice as data" }
        summary:
          ru: "Их нельзя сменить, как пароль: откуда компании берут лицо и голос и где можно отказаться."
          en: "You cannot change them like a password: where companies get your face and voice, and where you can say no."
  - id: chatbots
    title: { ru: "Что вы говорите чат-боту", en: "What you tell a chatbot" }
    summary:
      ru: "Люди рассказывают моделям то, что не сказали бы врачу, поэтому стоит знать, что с этим разговором происходит дальше."
      en: "People tell models what they would not tell a doctor, so it is worth knowing what happens to that conversation next."
    lessons:
      - id: does-it-train
        title: { ru: "Учится ли модель на ваших разговорах", en: "Does the model train on your conversations" }
        summary:
          ru: "Ответ зависит от компании и тарифа и со временем меняется, поэтому урок учит находить его в правилах самого сервиса."
          en: "The answer depends on the company and the plan and changes over time, so this lesson teaches you to find it in the service’s own terms."
      - id: deleted-chat
        title: { ru: "Где лежит удалённый разговор", en: "Where a deleted conversation lives" }
        summary:
          ru: "Кто может его прочитать, сколько он хранится и почему «удалить» не всегда значит стереть."
          en: "Who can read it, how long it is kept, and why “delete” does not always mean erase."
      - id: what-not-to-paste
        title: { ru: "Что не вставлять в окно чата", en: "What not to paste into a chat" }
        summary:
          ru: "Рабочие документы, анализы и чужие персональные данные: что обезличить, что оставить при себе и когда это уже не только ваш риск."
          en: "Work documents, test results and other people’s personal data: what to anonymize, what to keep to yourself, and when the risk is no longer only yours."
      - id: assistant-memory
        title: { ru: "Ассистент, который всё запоминает", en: "The assistant that remembers everything" }
        summary:
          ru: "Память между разговорами и доступ к почте и файлам: что из этого сохраняется, как это посмотреть и как стереть."
          en: "Memory across conversations and access to your mail and files: what gets stored, how to look at it and how to erase it."
  - id: rights
    title: { ru: "Ваши права", en: "Your rights" }
    summary:
      ru: "Закон даёт вам больше, чем кажется из политики конфиденциальности, но общие сведения курса не заменяют консультацию юриста."
      en: "The law gives you more than a privacy policy suggests, though this course’s general information does not replace a lawyer’s advice."
    lessons:
      - id: rights-under-the-law
        title: { ru: "Что даёт вам 152-ФЗ", en: "Your rights under GDPR" }
        summary:
          ru: "Узнать, кто и зачем обрабатывает ваши данные, потребовать их уточнить или уничтожить, отозвать согласие: что закон обещает и как это работает на деле."
          en: "What GDPR lets you demand of a company, from seeing your data to having it erased, and where those rights have limits."
      - id: where-the-law-stops
        title: { ru: "Где заканчивается российский закон", en: "Where GDPR stops" }
        summary:
          ru: "Зарубежные сервисы и компании без представителей в России: какие права у вас остаются и как ими пользоваться."
          en: "US state laws, services based abroad and countries with rules of their own: what rights you keep once GDPR no longer reaches."
      - id: ask-a-company
        title: { ru: "Как спросить компанию, что она о вас хранит", en: "How to ask a company what it holds on you" }
        summary:
          ru: "Как написать запрос оператору шаг за шагом, какой срок у него есть на ответ и как быть, если он тянет."
          en: "A data access request step by step: what to ask for, how long the company has, and what to do if it stalls."
      - id: when-a-company-stays-silent
        title: { ru: "Компания молчит: что дальше", en: "The company stays silent: what next" }
        summary:
          ru: "Жалоба в Роскомнадзор и обращение в суд: что приложить, чего ожидать и когда пора спросить юриста."
          en: "A complaint to your data protection authority or a state attorney general: what to attach, what to expect, and when to ask a lawyer."
  - id: your-model
    title: { ru: "Ваш собственный расчёт", en: "Your own calculation" }
    summary:
      ru: "Полной приватности не купишь, поэтому важно решить, что беречь в первую очередь и сколько неудобства это стоит."
      en: "Complete privacy is not for sale, so what matters is deciding what to protect first and how much inconvenience it is worth."
    lessons:
      - id: threat-model
        title: { ru: "Ваша личная модель угроз", en: "Your personal threat model" }
        summary:
          ru: "Что вы хотите уберечь, от кого и какое неудобство готовы терпеть: после этого ясно, что менять, а что оставить."
          en: "What you want to protect, from whom and how much inconvenience you will accept: after that it is clear what to change and what to leave."
      - id: settings-that-matter
        title: { ru: "Настройки, от которых что-то зависит", en: "The settings that make a difference" }
        summary:
          ru: "Короткий список мест в телефоне, браузере и чат-боте, где десять минут работы дают заметный результат."
          en: "A short list of places in your phone, your browser and your chatbot where ten minutes of work shows."
      - id: other-peoples-data
        title: { ru: "Чужие данные в ваших руках", en: "Other people’s data in your hands" }
        summary:
          ru: "Контакты, загруженные в приложение, фото знакомых, переписка, отданная чат-боту: как не решать за других, что им скрывать."
          en: "Contacts uploaded to an app, photos of friends, a thread handed to a chatbot: how not to decide for other people what they get to keep private."
      - id: assistants-that-see-everything
        title: { ru: "Заглянем вперёд: ассистенты, которые видят всё", en: "A look ahead: assistants that see everything" }
        summary:
          ru: "Агенты с доступом к экрану, почте и файлам: какие вопросы задать сервису, прежде чем дать ему такой доступ."
          en: "Agents with access to your screen, mail and files: what to ask a service before you give it that access."
        ahead: true
