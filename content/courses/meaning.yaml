# Purpose and identity when work changes (docs/specs/2026-11-01-platform-design.md §7.2).
# What the stretch is for is this course's; getting through it is `resilience`'s (§7.3). No promises (§7.4).
id: meaning
history: true
title: { ru: "Смысл: кто ты, когда работа меняется", en: "Meaning: who you are when work changes" }
tagline:
  ru: "Что работа даёт кроме денег, что происходит, когда она уходит, и что вы хотите продолжать делать сами."
  en: "What work gives beyond money, what happens when it goes, and what you want to keep doing yourself."
about:
  ru: "Курс для тех, чья работа меняется или может уйти, и для тех, кто думает о пенсии. Вы узнаете, что исследования говорят о потере работы и выходе на пенсию и что из философии годится для обычной жизни, и сможете решить, что оставить за собой. Мы не обещаем ответа на вопрос, зачем всё это, а если пустота не отпускает, стоит поговорить со специалистом."
  en: "A course for people whose work is changing or may go, and for those thinking about retirement. You will learn what research says about losing a job and retiring and what in philosophy works for an ordinary life, and be able to decide what to keep for yourself. We do not promise an answer to what it is all for, and if the emptiness stays, it is worth talking to a professional."
parts:
  - id: beyond-money
    title: { ru: "Что работа даёт кроме денег", en: "What work gives beyond money" }
    summary:
      ru: "Зарплату видно сразу, а остальное люди обычно замечают, когда его уже нет."
      en: "The paycheck is easy to see, and people usually notice the rest once it is gone."
    lessons:
      - id: latent-functions
        title: { ru: "Пять вещей, кроме зарплаты", en: "Five things besides the paycheck" }
        summary:
          ru: "Что Мари Яхода назвала скрытыми функциями занятости и как понять, какие из них держит именно ваша работа."
          en: "What Marie Jahoda called the latent functions of employment, and how to see which of them your own job holds up."
      - id: marienthal
        title: { ru: "Мариенталь: посёлок без работы", en: "Marienthal: a village without work" }
        summary:
          ru: "Австрийский посёлок, где закрылась фабрика: почему свободное время оказалось «трагическим даром» и дни распались."
          en: "An Austrian village whose factory had closed: why free time turned out to be a “tragic gift,” and the days fell apart."
      - id: pointless-jobs
        title: { ru: "Бессмысленная работа", en: "Pointless jobs" }
        summary:
          ru: "Сколько работ и правда бессмысленны, почему оценки так расходятся и что происходит с теми, кто считает так о своей."
          en: "How many jobs really are pointless, why the estimates differ so much, and what happens to people who feel that way about their own."
      - id: calling-and-its-price
        title: { ru: "Дело жизни и его цена", en: "A calling and its price" }
        summary:
          ru: "Работа, карьера или призвание: чем призвание связывает, чего оно стоит и как перестроить работу под себя."
          en: "Job, career or calling: how a calling binds you, what it costs, and how to reshape a job around yourself."
  - id: when-a-role-ends
    title: { ru: "Когда роль заканчивается", en: "When a role ends" }
    summary:
      ru: "Что известно о потере работы и пенсии, без утешений и без запугивания."
      en: "What is known about job loss and retirement, without comfort and without scare stories."
    lessons:
      - id: what-losing-a-job-does
        title: { ru: "Что делает потеря работы", en: "What losing a job does" }
        summary:
          ru: "Что потеря работы делает с психикой и с удовлетворённостью жизнью и почему прежний уровень возвращается не всегда."
          en: "What losing a job does to mental health and to satisfaction with life, and why the old level does not always come back."
      - id: who-without-a-profession
        title: { ru: "Кто я без своей профессии", en: "Who I am without my profession" }
        summary:
          ru: "Как люди выходят из роли, на которой держалось их «я», и чем отличается случай, когда её забирает не начальник, а машина."
          en: "How people leave a role their sense of self rested on, and what is different when it is taken not by a boss but by a machine."
      - id: retirement
        title: { ru: "Пенсия: выход или обрыв", en: "Retirement: a step out or a drop" }
        summary:
          ru: "Обзоры расходятся: психике пенсия часто на пользу, со здоровьем картина спорная, и многое зависит от того, сами ли вы решили уйти."
          en: "The reviews disagree: retirement is often good for mental health, the picture for physical health is disputed, and much depends on whether you chose to go."
      - id: money-without-work
        title: { ru: "Деньги без работы", en: "Money without work" }
        summary:
          ru: "Кейнс предсказывал 15-часовую неделю, а деньги без условий с тех пор опробовали: что эти опыты говорят о мире без работы, а что нет."
          en: "Keynes foresaw a 15-hour week, and cash with no strings has since been tried: what those trials say about a world without work, and what they do not."
  - id: philosophy
    title: { ru: "Что может философия", en: "What philosophy can offer" }
    summary:
      ru: "Несколько мыслей, которые годятся для обычной жизни, и заодно цитаты, которых их предполагаемые авторы не говорили."
      en: "A few thoughts that work in an ordinary life, and along the way some quotes their supposed authors never said."
    lessons:
      - id: aristotle-on-activity
        title: { ru: "Аристотель: счастье как деятельность", en: "Aristotle: happiness as activity" }
        summary:
          ru: "Эвдемония у Аристотеля это то, что вы делаете, а не что чувствуете, и как к нему приклеилась чужая красивая фраза."
          en: "Eudaimonia in Aristotle is something you do, not something you feel, and how another writer’s fine line got stuck to him."
      - id: frankl-without-the-quote
        title: { ru: "Франкл без поддельной цитаты", en: "Frankl without the fake quote" }
        summary:
          ru: "Что на самом деле сказано в книге Франкла, что нельзя переносить на обычную жизнь и почему фразу о стимуле и реакции считают не его."
          en: "What Frankl’s book really says, what does not carry over into an ordinary life, and why the line about stimulus and response is held not to be his."
      - id: arendt-labor-work-action
        title: { ru: "Арендт: труд, создание, действие", en: "Arendt: labor, work, action" }
        summary:
          ru: "Три рода деятельности у Ханны Арендт: какой из них берёт на себя машина и какой, если следовать её логике, передать нельзя."
          en: "The three kinds of activity in Hannah Arendt: which of them a machine takes over, and which by her reasoning cannot be handed off."
  - id: what-you-do-yourself
    title: { ru: "Что вы делаете сами", en: "What you do yourself" }
    summary:
      ru: "Мы думаем, что делать что-то самому стоит и тогда, когда машина справится лучше: это наша позиция, и здесь она проверяется на практике."
      en: "We think doing a thing yourself is worthwhile even when a machine does it better: that is our stance, and here it meets practice."
    lessons:
      - id: why-play-if-the-machine-wins
        title: { ru: "Зачем играть, если машина сильнее", en: "Why play if the machine is stronger" }
        summary:
          ru: "Игроки в го не бросили игру, когда машина их превзошла, а стали играть сильнее и свежее: что это значит для вашего дела и что не значит."
          en: "Go players did not quit when the machine passed them, and began to play better and more freshly: what that means for your own work, and what it does not."
      - id: what-to-keep
        title: { ru: "Что оставить себе", en: "What to keep for yourself" }
        summary:
          ru: "Как отделить дела, которые вы делаете ради результата, от тех, что делаете ради самого дела, и почему у разных людей эти списки не совпадают."
          en: "How to separate what you do for the result from what you do for its own sake, and why different people’s lists do not match."
      - id: routine-with-no-boss
        title: { ru: "Распорядок без начальника", en: "A routine with no boss" }
        summary:
          ru: "Как получить время, людей и общую цель из других источников и почему волонтёрство заменяет их лишь отчасти."
          en: "How to get time, people and a shared purpose from other sources, and why volunteering replaces them only in part."
      - id: when-the-emptiness-stays
        title: { ru: "Когда пустота не проходит", en: "When the emptiness does not lift" }
        summary:
          ru: "Чем вопрос о смысле отличается от депрессии, почему со второй философия и курсы не справятся и когда идти к специалисту."
          en: "How a question about meaning differs from depression, why philosophy and courses will not handle the second, and when to see a professional."
      - id: if-there-is-less-work
        title: { ru: "Заглянем вперёд: если работы станет меньше", en: "A look ahead: if there is less work" }
        summary:
          ru: "Никто не знает, насколько сократится работа: какие сценарии возможны и что подготовить, не дожидаясь ответа."
          en: "Nobody knows how much work will shrink: which scenarios are possible, and what to prepare without waiting for the answer."
        ahead: true
