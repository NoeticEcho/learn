# The second course and the first to be filled (docs/specs/2026-11-01-platform-design.md §7.2).
id: ai
history: true
title: { ru: "ИИ: от символов до агентов", en: "AI: from symbols to agents" }
tagline:
  ru: "Вся история искусственного интеллекта: правила, чат-боты, нейросети, GPT, лаборатории, AGI и ASI, и что из этого следует завтра."
  en: "The whole history of artificial intelligence: rules, chatbots, neural networks, GPT, the labs, AGI and ASI, and what follows tomorrow."
about:
  ru: "Курс для тех, кто пользуется ИИ каждый день и хочет понимать, что у него внутри. Вы пройдёте семьдесят лет идей, тупиков и прорывов, поймёте, как работает языковая модель и почему она ошибается, и сможете сами судить о громких заявлениях. Программировать уметь не нужно."
  en: "A course for people who use AI every day and want to understand what is inside it. You will walk through seventy years of ideas, dead ends and breakthroughs, learn how a language model works and why it makes mistakes, and be able to judge bold claims for yourself. No programming needed."
parts:
  - id: symbols
    title: { ru: "Мышление как правила", en: "Thinking as rules" }
    summary:
      ru: "Первая большая идея: если разум работает с символами, его можно записать в виде программы."
      en: "The first big idea: if a mind works with symbols, it can be written down as a program."
    lessons:
      - id: turing-question
        title: { ru: "Может ли машина мыслить", en: "Can a machine think" }
        summary:
          ru: "Статья Тьюринга 1950 года, игра в имитацию и почему он заменил вопрос о мышлении вопросом о поведении."
          en: "Turing’s 1950 paper, the imitation game, and why he replaced a question about thinking with a question about behavior."
        status: open
        published: 2026-11-10
      - id: dartmouth
        title: { ru: "Дартмут, 1956: у науки появляется имя", en: "Dartmouth, 1956: a science gets its name" }
        summary:
          ru: "Заявка Маккарти, Минского, Рочестера и Шеннона, летний семинар и обещание заметно продвинуться за одно лето."
          en: "The proposal by McCarthy, Minsky, Rochester and Shannon, the summer workshop, and the promise of real progress in a single summer."
        status: open
        published: 2026-11-10
      - id: logic-theorist
        title: { ru: "Logic Theorist и гипотеза символьных систем", en: "Logic Theorist and the symbol system hypothesis" }
        summary:
          ru: "Как программа Ньюэлла, Саймона и Шоу доказывала теоремы и как из этого выросла главная ставка символьного ИИ."
          en: "How the program by Newell, Simon and Shaw proved theorems, and how symbolic AI’s central bet grew out of it."
        status: open
        published: 2026-11-10
      - id: blocks-world
        title: { ru: "SHRDLU и мир кубиков", en: "SHRDLU and the blocks world" }
        summary:
          ru: "Программа Винограда около 1970 года понимала приказы о кубиках, и на ней видно, почему такой успех не масштабируется."
          en: "Winograd’s program of about 1970 understood orders about blocks, which showed why that success does not scale."
      - id: expert-systems
        title: { ru: "Экспертные системы: знания как товар", en: "Expert systems: knowledge as a product" }
        summary:
          ru: "MYCIN в медицине, XCON в DEC и инженер знаний: первый случай, когда ИИ начал приносить деньги."
          en: "MYCIN in medicine, XCON at DEC and the knowledge engineer: the first time AI made money."
      - id: winters
        title: { ru: "Две зимы ИИ", en: "Two AI winters" }
        summary:
          ru: "Доклад Лайтхилла 1973 года, сокращение финансирования, крах рынка лисп-машин и урок о том, чем заканчиваются завышенные обещания."
          en: "The Lighthill report of 1973, the funding cuts, the collapse of the Lisp machine market, and what inflated promises end in."
  - id: chatbots
    title: { ru: "Собеседники", en: "Conversation partners" }
    summary:
      ru: "Машины, которые ничего не понимали, и люди, которые всё равно им верили."
      en: "Machines that understood nothing, and the people who trusted them anyway."
    lessons:
      - id: eliza
        title: { ru: "ELIZA: психотерапевт из шаблонов", en: "ELIZA: a therapist made of patterns" }
        summary:
          ru: "Программа Вейценбаума 1966 года, сценарий DOCTOR и то, как автора напугала готовность людей ей довериться."
          en: "Weizenbaum’s program of 1966, the DOCTOR script, and how people’s readiness to confide in it frightened its author."
      - id: eliza-effect
        title: { ru: "Эффект ЭЛИЗЫ сегодня", en: "The ELIZA effect today" }
        summary:
          ru: "Почему мы приписываем понимание тому, что складно отвечает, и как эта привычка работает с современными моделями."
          en: "Why we attribute understanding to whatever answers smoothly, and how that habit works on modern models."
      - id: alice
        title: { ru: "A.L.I.C.E.: десятки тысяч правил", en: "A.L.I.C.E.: tens of thousands of rules" }
        summary:
          ru: "Чат-бот Ричарда Уоллеса 1995 года, язык AIML и три премии Лёбнера, полученные совсем без обучения на данных."
          en: "Richard Wallace’s chatbot of 1995, the AIML language, and three Loebner Prizes won with no learning from data at all."
      - id: turing-test-contest
        title: { ru: "Тест Тьюринга как соревнование", en: "The Turing test as a contest" }
        summary:
          ru: "Что на самом деле измеряла премия Лёбнера и почему обмануть судью не значит мыслить."
          en: "What the Loebner Prize actually measured, and why fooling a judge is not the same as thinking."
      - id: voice-assistants
        title: { ru: "Siri, Alexa и Алиса", en: "Siri, Alexa and Yandex’s Alice" }
        summary:
          ru: "Голосовые помощники 2011, 2014 и 2017 годов: распознавание речи на нейросетях и сценарии, написанные людьми."
          en: "The voice assistants of 2011, 2014 and 2017: speech recognition on neural networks, and scripts written by people."
  - id: minds
    title: { ru: "Что вообще считать интеллектом", en: "What counts as intelligence" }
    summary:
      ru: "Спор о словах, от которого зависят и цели исследований, и сегодняшние заголовки."
      en: "An argument about words on which research goals and today’s headlines both depend."
    lessons:
      - id: weak-strong
        title: { ru: "Слабый и сильный ИИ", en: "Weak and strong AI" }
        summary:
          ru: "Различие из статьи Сёрла 1980 года, его китайская комната и почему спор о ней не окончен."
          en: "The distinction from Searle’s 1980 paper, his Chinese room, and why the argument over it is not finished."
      - id: cognitive-architectures
        title: { ru: "Когнитивные архитектуры", en: "Cognitive architectures" }
        summary:
          ru: "Soar и ACT-R: попытка построить модель всего разума, с памятью, вниманием и обучением, а не решать отдельные задачи."
          en: "Soar and ACT-R: the attempt to build a model of a whole mind, with memory, attention and learning, rather than solve separate tasks."
      - id: common-sense
        title: { ru: "Здравый смысл вручную: проект Cyc", en: "Common sense by hand: the Cyc project" }
        summary:
          ru: "С 1984 года Дуглас Ленат и его команда записывали знания о мире в виде правил, и по этой работе видно, как их много."
          en: "From 1984 Douglas Lenat and his team wrote knowledge of the world down as rules, which shows how much of it there is."
  - id: neural-generations
    title: { ru: "Поколения нейронных сетей", en: "Generations of neural networks" }
    summary:
      ru: "Вторая большая идея, которая шла рядом с первой семьдесят лет: не записывать правила, а учиться на примерах."
      en: "The second big idea, which ran beside the first for seventy years: do not write the rules, learn from examples."
    lessons:
      - id: first-neuron
        title: { ru: "Искусственный нейрон и перцептрон", en: "The artificial neuron and the perceptron" }
        summary:
          ru: "Модель Маккаллока и Питтса 1943 года, перцептрон Розенблатта 1958 года и первые громкие обещания машинного обучения."
          en: "The McCulloch and Pitts model of 1943, Rosenblatt’s perceptron of 1958, and the first loud promises of machine learning."
      - id: perceptrons-book
        title: { ru: "Книга, которая остановила перцептроны", en: "The book that stopped perceptrons" }
        summary:
          ru: "Минский и Пейперт в 1969 году показали пределы однослойной сети, а задача XOR стала символом этого спора."
          en: "In 1969 Minsky and Papert showed the limits of a single-layer network, and the XOR problem became the symbol of that dispute."
      - id: backprop
        title: { ru: "Обратное распространение ошибки", en: "Backpropagation" }
        summary:
          ru: "Статья Румельхарта, Хинтона и Уильямса 1986 года и простая мысль о том, как сеть узнаёт, какой вес виноват в ошибке."
          en: "The 1986 paper by Rumelhart, Hinton and Williams, and the simple idea of how a network finds out which weight is to blame for an error."
      - id: convnets-lstm
        title: { ru: "Сети для картинок и для последовательностей", en: "Networks for images and for sequences" }
        summary:
          ru: "Свёрточная сеть Лекуна для почтовых индексов и LSTM Хохрайтера и Шмидхубера 1997 года: две архитектуры, которые ждали своих данных."
          en: "LeCun’s convolutional network for zip codes and the 1997 LSTM by Hochreiter and Schmidhuber: two architectures waiting for their data."
      - id: statistics-wins
        title: { ru: "Тихая победа статистики", en: "The quiet victory of statistics" }
        summary:
          ru: "Спам-фильтры, поиск и машинный перевод девяностых: когда данные начали побеждать правила без всякого шума."
          en: "Spam filters, search and the machine translation of the 1990s: when data began to beat rules without any fuss."
  - id: deep-learning
    title: { ru: "Глубокое обучение", en: "Deep learning" }
    summary:
      ru: "Большие данные, видеокарты и несколько старых идей сошлись, и за пять лет изменилось всё."
      en: "Big data, graphics cards and a few old ideas came together, and within five years everything had changed."
    lessons:
      - id: imagenet
        title: { ru: "ImageNet и AlexNet", en: "ImageNet and AlexNet" }
        summary:
          ru: "Набор данных Фей-Фей Ли 2009 года, сеть Крижевского, Суцкевера и Хинтона 2012 года и роль видеокарт в этом переломе."
          en: "Fei-Fei Li’s dataset of 2009, the 2012 network by Krizhevsky, Sutskever and Hinton, and the part graphics cards played in that turn."
      - id: embeddings
        title: { ru: "Смысл как координаты", en: "Meaning as coordinates" }
        summary:
          ru: "Word2vec 2013 года и мысль, на которой стоят все языковые модели: слово можно представить точкой в пространстве."
          en: "Word2vec of 2013 and the idea all language models rest on: a word can be represented as a point in space."
      - id: games
        title: { ru: "Deep Blue и AlphaGo: две победы", en: "Deep Blue and AlphaGo: two victories" }
        summary:
          ru: "Шахматы 1997 года выиграл перебор, а го 2016 года выиграло обучение, и разница между ними важнее самих побед."
          en: "Chess in 1997 was won by search and Go in 2016 by learning, and the difference between them matters more than the wins."
      - id: generative
        title: { ru: "Машины, которые рисуют", en: "Machines that draw" }
        summary:
          ru: "GAN Гудфеллоу 2014 года, диффузионные модели и Stable Diffusion 2022 года: как сеть учится создавать, а не только распознавать."
          en: "Goodfellow’s GAN of 2014, diffusion models and Stable Diffusion of 2022: how a network learns to create and not only to recognize."
      - id: alphafold
        title: { ru: "AlphaFold: ИИ в науке", en: "AlphaFold: AI in science" }
        summary:
          ru: "Как задача о форме белка получила практическое решение в 2020 году и привела к Нобелевской премии 2024 года."
          en: "How the problem of protein shape got a practical solution in 2020 and led to a Nobel Prize in 2024."
  - id: attention-gpt
    title: { ru: "Attention и GPT", en: "Attention and GPT" }
    summary:
      ru: "Одна статья 2017 года и то, что выросло из неё за пять лет."
      en: "One paper from 2017 and what grew out of it in five years."
    lessons:
      - id: attention-idea
        title: { ru: "Идея внимания", en: "The idea of attention" }
        summary:
          ru: "Машинный перевод, работа Багданау, Чо и Бенджио 2014 года и простая мысль о том, что сеть может сама решать, куда смотреть."
          en: "Machine translation, the 2014 work by Bahdanau, Cho and Bengio, and the simple idea that a network can decide for itself where to look."
      - id: transformer
        title: { ru: "Attention Is All You Need", en: "Attention Is All You Need" }
        summary:
          ru: "Статья Васвани и соавторов 2017 года: архитектура «трансформер», объяснённая простыми словами и нарисованная по шагам."
          en: "The 2017 paper by Vaswani et al.: the transformer architecture, in plain words and drawn step by step."
      - id: gpt-lineage
        title: { ru: "GPT, GPT-2, GPT-3", en: "GPT, GPT-2, GPT-3" }
        summary:
          ru: "Модели OpenAI 2018, 2019 и 2020 годов: что менялось от версии к версии и с чего начались споры о публикации моделей."
          en: "OpenAI’s models of 2018, 2019 and 2020: what changed from version to version, and where the arguments about publishing began."
      - id: how-llm-works
        title: { ru: "Как работает языковая модель", en: "How a language model works" }
        summary:
          ru: "Токены, вероятности, контекст и температура: что происходит между вашим вопросом и ответом и почему модель сочиняет правдоподобное."
          en: "Tokens, probabilities, context and temperature: what happens between your question and the answer, and why a model invents plausible things."
      - id: scaling
        title: { ru: "Законы масштабирования и их пределы", en: "Scaling laws and their limits" }
        summary:
          ru: "Работа Каплана и соавторов 2020 года, рост за счёт данных и вычислений и честный вопрос о том, как долго это будет работать."
          en: "The 2020 work by Kaplan et al., growth through data and compute, and the honest question of how long that will keep working."
      - id: chatgpt
        title: { ru: "ChatGPT: дообучение на людях", en: "ChatGPT: training on people" }
        summary:
          ru: "InstructGPT, обучение с подкреплением по оценкам людей и день 30 ноября 2022 года, когда модель заговорила со всеми."
          en: "InstructGPT, reinforcement learning from human feedback, and November 30, 2022, the day a model began talking to everyone."
      - id: reasoning-models
        title: { ru: "Модели, которые рассуждают", en: "Models that reason" }
        summary:
          ru: "Цепочки рассуждений, модели 2024 и 2025 годов вроде o1 и DeepSeek-R1 и спор о том, что именно они делают."
          en: "Chains of reasoning, the models of 2024 and 2025 such as o1 and DeepSeek-R1, and the argument over what exactly they are doing."
  - id: agents
    title: { ru: "Агенты", en: "Agents" }
    summary:
      ru: "Модель получает инструменты и память, и из собеседника превращается в исполнителя."
      en: "A model gets tools and memory, and turns from a conversation partner into a doer."
    lessons:
      - id: tools-loop
        title: { ru: "Инструменты и цикл агента", en: "Tools and the agent loop" }
        summary:
          ru: "Как модель вызывает инструменты, читает результат и решает, что делать дальше, и какую роль в этом играет протокол MCP."
          en: "How a model calls tools, reads the result and decides what to do next, and the part the MCP protocol plays in that."
      - id: agent-memory
        title: { ru: "Память агента", en: "Agent memory" }
        summary:
          ru: "Почему модель ничего не помнит между разговорами, как память строят поверх неё и что показывает открытая библиотека Reminisce от NoeticEcho."
          en: "Why a model remembers nothing between conversations, how memory is built on top of it, and what NoeticEcho’s open library Reminisce shows."
      - id: agent-failures
        title: { ru: "Как агенты ошибаются", en: "How agents fail" }
        summary:
          ru: "Подмена задачи, внедрение инструкций и уверенный отчёт о несделанном: типичные сбои, которые объясняются устройством самой модели."
          en: "Swapping the task, prompt injection and a confident report of work not done: typical failures that follow from how the model is built."
  - id: labs
    title: { ru: "Кто это делает", en: "Who makes it" }
    summary:
      ru: "Компании, чипы и деньги: без них история идей не объясняет, почему всё сложилось именно так."
      en: "Companies, chips and money: without them the history of ideas does not explain why things turned out this way."
    lessons:
      - id: frontier-labs
        title: { ru: "Лаборатории ИИ", en: "The AI labs" }
        summary:
          ru: "DeepMind (2010), OpenAI (2015), Anthropic (2021), xAI, Mistral и DeepSeek (2023), а также Meta, Яндекс и Сбер: кто откуда взялся и как устроен."
          en: "DeepMind (2010), OpenAI (2015), Anthropic (2021), xAI, Mistral and DeepSeek (2023), along with Meta, Yandex and Sber: where each came from and how it is set up."
      - id: open-weights
        title: { ru: "Открытые и закрытые модели", en: "Open and closed models" }
        summary:
          ru: "Что значит «открытые веса», чем это отличается от открытого кода и почему после LLaMA 2023 года этот спор стал практическим."
          en: "What open weights mean, how that differs from open source, and why the argument became a practical one after LLaMA in 2023."
      - id: compute
        title: { ru: "Чипы, дата-центры и энергия", en: "Chips, data centers and energy" }
        summary:
          ru: "Откуда берутся вычисления, почему так важны несколько компаний в цепочке поставок и сколько электричества это требует."
          en: "Where compute comes from, why a few companies in the supply chain matter so much, and how much electricity it takes."
  - id: futures
    title: { ru: "AGI, ASI и завтрашний день", en: "AGI, ASI and tomorrow" }
    summary:
      ru: "Самые громкие слова этой области: что они значат, что о них известно и чего не знает никто."
      en: "The loudest words in the field: what they mean, what is known about them, and what nobody knows."
    lessons:
      - id: agi
        title: { ru: "AGI: общий интеллект", en: "AGI: general intelligence" }
        summary:
          ru: "Откуда взялся термин, почему у него нет единого определения и как относиться к заявлениям, что он вот-вот появится."
          en: "Where the term came from, why it has no single definition, and how to treat claims that it is about to arrive."
      - id: asi
        title: { ru: "ASI: сверхинтеллект", en: "ASI: superintelligence" }
        summary:
          ru: "От «ультраинтеллектуальной машины» Гуда 1965 года до книги Бострома 2014 года: логика аргумента и его слабые места."
          en: "From Good’s “ultraintelligent machine” of 1965 to Bostrom’s book of 2014: the logic of the argument and its weak points."
      - id: alignment
        title: { ru: "Согласование: как задать цель", en: "Alignment: how to set a goal" }
        summary:
          ru: "Почему машина может выполнить сказанное, а не задуманное, и о чём предупреждают сами создатели этих систем."
          en: "Why a machine may do what was said rather than what was meant, and what the builders of these systems themselves warn about."
      - id: near-future
        title: { ru: "Заглянем в ближайшее будущее", en: "A look into the near future" }
        summary:
          ru: "Что может измениться в ближайшие годы, что только обещают и как проверять такие прогнозы самому, когда они приходят в новостях."
          en: "What may change in the next few years, what is only promised, and how to check such forecasts yourself when they appear in the news."
        ahead: true
