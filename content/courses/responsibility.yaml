# Ethics, power and who answers for what a machine did (docs/specs/2026-11-01-platform-design.md §7.2).
# This course is who should answer; what the law says now is `law`'s.
id: responsibility
history: true
title: { ru: "Ответственность: кто отвечает за то, что сделала машина", en: "Responsibility: who answers for what a machine did" }
tagline:
  ru: "Этика простыми словами, громкие случаи с алгоритмами, у кого власть и что может сделать обычный человек."
  en: "Ethics in plain words, the well-known cases of algorithms gone wrong, who holds the power, and what an ordinary person can do."
about:
  ru: "Курс для тех, кто пользуется ИИ, работает рядом с ним или живёт под его решениями, а это уже почти все. Вы научитесь спрашивать, кто принял решение и кто за него ответит, разбирать спорные случаи, не выбирая сторону заранее, и отличать известное от спорного. Здесь вопрос в том, кто должен отвечать, а что закон говорит сейчас, разбирает курс о праве."
  en: "A course for people who use AI, work beside it or live under its decisions, which is by now nearly everyone. You will learn to ask who made a decision and who will answer for it, to take apart disputed cases without picking a side in advance, and to tell what is known from what is contested. The question here is who should answer, and what the law says now is in the course on law."
parts:
  - id: what-ethics-is
    title: { ru: "Что такое этика", en: "What ethics is" }
    summary:
      ru: "Это не список запретов, а способ разбираться, что делать, когда честные люди расходятся."
      en: "Not a list of prohibitions but a way of working out what to do when honest people disagree."
    lessons:
      - id: three-questions
        title: { ru: "Три вопроса этики", en: "Three questions of ethics" }
        summary:
          ru: "Каковы последствия, в чём мой долг, каким человеком это меня делает: три старые традиции и почему ни одна не заменяет две другие."
          en: "What are the consequences, what is my duty, what kind of person does this make me: three old traditions, and why none replaces the other two."
      - id: moral-machine
        title: { ru: "Моральная машина", en: "The moral machine" }
        summary:
          ru: "Огромный опрос о том, кого должен спасти беспилотник, и почему он показывает предпочтения, а не то, что правильно."
          en: "A huge survey on whom a driverless car should save, and why it shows preferences, not what is right."
      - id: no-tool-is-neutral
        title: { ru: "Нейтральных инструментов нет", en: "No tool is neutral" }
        summary:
          ru: "Кто выбрал данные, цель и то, от чего модель отказывается: как в системе оказываются чужие ценности и как их заметить."
          en: "Who chose the data, the goal and what a model refuses to do: how other people’s values end up in a system, and how to spot them."
  - id: who-answers
    title: { ru: "Кто отвечает", en: "Who answers" }
    summary:
      ru: "Машину нельзя призвать к ответу, и потому вопрос всегда о людях, которые её поставили, купили и ей поверили."
      en: "A machine cannot be held to account, so the question is always about the people who deployed it, bought it and believed it."
    lessons:
      - id: computer-cannot-answer
        title: { ru: "Компьютер не может отвечать", en: "A computer cannot be held accountable" }
        summary:
          ru: "Старая фраза, которую приписывают IBM: что вообще значит отвечать и почему это относится только к людям и организациям."
          en: "An old line credited to IBM: what being accountable means, and why it applies only to people and organizations."
      - id: responsibility-gap
        title: { ru: "Разрыв ответственности", en: "The responsibility gap" }
        summary:
          ru: "Если система учится сама, никто как будто не виноват: почему одни видят в этом новую проблему, а другие удобную отговорку."
          en: "If a system learns on its own, nobody seems to be at fault: why some see a new problem in this and others a convenient excuse."
      - id: crumple-zone
        title: { ru: "Человек как сминаемая зона", en: "The human as a crumple zone" }
        summary:
          ru: "Образ Мадлен Элиш на примере гибели пешехода под беспилотным автомобилем Uber: почему за сбой системы платит ближайший человек."
          en: "Madeleine Elish’s image, with the pedestrian killed by a self-driving Uber: why the nearest person pays for a system’s failure."
      - id: horizon
        title: { ru: "Horizon: когда верят системе, а не людям", en: "Horizon: believing the system over the people" }
        summary:
          ru: "Британская почта годами судила своих начальников отделений по данным учётной программы: как это стало возможно и кто ответил."
          en: "The British Post Office prosecuted its own subpostmasters for years on an accounting system’s data: how that was possible, and who answered."
      - id: robodebt
        title: { ru: "Robodebt: долг, рассчитанный усреднением", en: "Robodebt: a debt worked out by averaging" }
        summary:
          ru: "Австралийская программа выставляла людям долги по усреднённому доходу, и это была простая формула, а не ИИ: в этом весь урок."
          en: "An Australian scheme sent people debts based on averaged income, and it was a simple formula, not AI: that is the whole lesson."
      - id: your-name-on-it
        title: { ru: "Ваша подпись под работой машины", en: "Your name on the machine’s work" }
        summary:
          ru: "Что вы берёте на себя, отправляя текст или решение от модели, и что значит проверить настолько, чтобы ответить за это самому."
          en: "What you take on when you send out text or a decision a model prepared, and what it means to check it well enough to answer for it yourself."
  - id: bias
    title: { ru: "Предвзятость в системах", en: "Bias in systems" }
    summary:
      ru: "Здесь почти всё спорно, и как раз этому спору стоит научиться."
      en: "Almost everything here is disputed, and the dispute itself is worth learning."
    lessons:
      - id: compas
        title: { ru: "COMPAS: две правды о справедливости", en: "COMPAS: two truths about fairness" }
        summary:
          ru: "Спор журналистов и разработчика об ошибках алгоритма по расам и почему при разных базовых долях оба условия справедливости разом не выполнить."
          en: "The dispute between reporters and the maker over the algorithm’s errors by race, and why with different base rates both conditions of fairness cannot hold."
      - id: compared-with-whom
        title: { ru: "По сравнению с кем", en: "Compared with whom" }
        summary:
          ru: "Как один алгоритм выглядит рядом с неспециалистом, группой людей и простой формулой и с чем его стоит сравнивать, прежде чем судить."
          en: "How one algorithm looks beside a layperson, a group of people and a simple formula, and what to compare it with before you judge."
      - id: where-bias-comes-from
        title: { ru: "Откуда берётся предвзятость", en: "Where bias comes from" }
        summary:
          ru: "Данные о прошлом, показатель вместо цели, те, кто не попал в выборку: почему предвзятость не убирают одной правкой."
          en: "Data about the past, a proxy in place of the goal, who was left out of the sample: why one fix does not remove bias."
  - id: power-and-rules
    title: { ru: "Власть и правила", en: "Power and the rules" }
    summary:
      ru: "У кого вычисления, данные и решения, кто их ограничивает и о чём спорят те, кто боится, с теми, кто нет."
      en: "Who has the computing, the data and the decisions, who limits them, and what the worried and the unworried argue about."
    lessons:
      - id: who-holds-the-power
        title: { ru: "У кого власть", en: "Who holds the power" }
        summary:
          ru: "Вычисления и данные у немногих компаний, незаметный труд разметчиков: что здесь факт, а что спор о том, плохо ли это."
          en: "Computing and data in few companies, the unseen work of data labelers: what is fact here, and what is a dispute about whether that is bad."
      - id: rules-as-they-stand
        title: { ru: "Кто должен писать правила", en: "Who should write the rules" }
        summary:
          ru: "Кому доверить ограничивать сильные системы: государствам, судам или самим компаниям, и почему ни один ответ не очевиден."
          en: "Whom to trust with limiting powerful systems: governments, courts or the companies themselves, and why no answer is obvious."
      - id: safety-debate
        title: { ru: "Спор о безопасности", en: "The safety debate" }
        summary:
          ru: "Одни предупреждают о вымирании, другие считают ИИ обычной технологией: кто что утверждает, на что опирается и что остаётся спорным."
          en: "Some warn of extinction and others call AI an ordinary technology: who claims what, on what grounds, and what stays disputed."
      - id: what-an-ordinary-person-can-do
        title: { ru: "Что может обычный человек", en: "What an ordinary person can do" }
        summary:
          ru: "Спросить, кто решил, потребовать живого человека, пожаловаться, не поставить подпись: немного, и это больше, чем ничего."
          en: "Ask who decided, insist on a human, complain, refuse to sign: not much, and more than nothing."
      - id: agents-that-act-alone
        title: { ru: "Заглянем вперёд: агенты, которые действуют сами", en: "A look ahead: agents that act on their own" }
        summary:
          ru: "Когда агент сам тратит деньги и подписывает, вопрос об ответственности становится повседневным: кто платит за ошибку и как об этом договориться."
          en: "When an agent spends money and signs things on its own, responsibility becomes an everyday question: who pays for a mistake, and how to agree on it."
        ahead: true
