# For parents and teachers (docs/specs/2026-11-01-platform-design.md §7.2). What is contested is marked as
# contested, a professional is named where that is the right answer, and no line promises what a child will become.
# Companion chatbots for children live here, for adults in `dialogue`. The moves of checking are `verify`'s; teaching
# a child to check is here, in one lesson.
id: children
history: true
title: { ru: "Дети и ИИ: для родителей и учителей", en: "Children and AI: for parents and teachers" }
tagline:
  ru: "Что известно о детях и экранах, как быть с домашними заданиями и чат-ботами-компаньонами и как учить проверять и думать."
  en: "What is known about children and screens, how to handle homework and companion chatbots, and how to teach a child to check and to think."
about:
  ru: "Курс для родителей и учителей, без запугивания и без обещаний. Вы будете понимать, что исследования подтверждают, а о чём спорят, сможете договориться с ребёнком о правилах и обсудить с ним дипфейки и травлю. Если ребёнку плохо, нужен специалист, а не курс, и курс скажет, когда и к кому идти."
  en: "A course for parents and teachers, with no scaremongering and no promises. You will know what research supports and what is contested, be able to agree on rules with a child, and talk with them about deepfakes and bullying. When a child is struggling, they need a professional, not a course, and this course says when and who."
parts:
  - id: growing-up
    title: { ru: "Как растут дети", en: "How children grow" }
    summary:
      ru: "Прежде чем решать, что делать с машиной, полезно знать, с кем имеете дело в шесть лет и в четырнадцать."
      en: "Before deciding what to do about the machine, it helps to know who you are dealing with at six and at fourteen."
    lessons:
      - id: how-children-develop
        title: { ru: "Как развивается ребёнок, простыми словами", en: "How children develop, in plain words" }
        summary:
          ru: "Что примерно меняется с возрастом в речи, самоконтроле и дружбе и почему возрастные таблицы описывают средних детей, а не вашего."
          en: "What roughly changes with age in language, self-control and friendship, and why age charts describe average children, not yours."
      - id: teenagers-and-peers
        title: { ru: "Почему подростку так важны сверстники", en: "Why peers matter so much to a teenager" }
        summary:
          ru: "Чего ждать в этом возрасте и почему фраза «мозг ещё не созрел» объясняет меньше, чем кажется."
          en: "What to expect at this age, and why “the brain isn’t finished yet” explains less than it seems to."
      - id: marshmallow-and-mindset
        title: { ru: "Зефирный тест и мышление роста", en: "The marshmallow test and growth mindset" }
        summary:
          ru: "Что осталось от зефирного теста после повторов и от мышления роста после обзоров и что из этого брать для своего ребёнка."
          en: "What is left of the marshmallow test after its repeats and of growth mindset after the reviews, and what to take for your own child."
  - id: screens
    title: { ru: "Экраны", en: "Screens" }
    summary:
      ru: "Здесь спорят и родители, и учёные, поэтому каждое утверждение помечено: подтверждено, спорно или неизвестно."
      en: "Parents and scientists both argue about this, so each claim is marked as supported, contested or unknown."
    lessons:
      - id: screens-what-is-known
        title: { ru: "Экраны: что подтверждено, а о чём спорят", en: "Screens: what is supported and what is contested" }
        summary:
          ru: "Спор Джонатана Хайдта и его критиков о том, виноваты ли смартфоны в ухудшении психики подростков, и что здесь можно считать известным."
          en: "The argument between Jonathan Haidt and his critics over whether smartphones are to blame for teenagers’ mental health, and what counts as known."
      - id: very-young-children
        title: { ru: "Совсем маленькие и экран", en: "Very young children and screens" }
        summary:
          ru: "Что ВОЗ советует о времени у экрана до пяти лет, на чём это держится и что важнее минут."
          en: "What WHO advises about screen time before age five, what that rests on, and what matters more than minutes."
      - id: bans-and-their-effect
        title: { ru: "Запреты: телефоны на уроках и соцсети", en: "Bans: phones in class and social media" }
        summary:
          ru: "Телефоны на уроках и возрастные запреты на соцсети: что об их действии можно сказать, а что нельзя."
          en: "Phones in class and age limits on social media: what can and cannot be said about their effect."
      - id: family-rules
        title: { ru: "Семейные правила без войны", en: "Family rules without a war" }
        summary:
          ru: "Договорённости о сне, еде и месте для телефона, которые ребёнок помогает составить, а взрослые соблюдают сами."
          en: "Agreements about sleep, meals and where the phone lives, which the child helps to write and the adults keep too."
  - id: learning
    title: { ru: "Учёба рядом с моделью", en: "Learning beside a model" }
    summary:
      ru: "Запретить модель трудно, а разрешить всё вредно, и у этого уже есть первые данные."
      en: "Banning models is hard and allowing everything does harm, and there is now some early data on this."
    lessons:
      - id: homework-and-a-model
        title: { ru: "Домашнее задание и модель", en: "Homework and a model" }
        summary:
          ru: "Обычная модель может поднять результат на занятии и опустить его потом, а подсказки вместо ответов смягчают вред: как устроить это дома."
          en: "A plain model can raise a child’s score in practice and lower it afterward, and hints in place of answers ease the harm: how to set that up at home."
      - id: teaching-a-child-to-check
        title: { ru: "Как научить ребёнка проверять", en: "Teaching a child to check" }
        summary:
          ru: "Как сделать проверку привычкой ребёнка: что показать в каком возрасте и как разбирать ошибки вместе; сами приёмы в курсе о проверке."
          en: "How to make checking a child’s habit: what to show at which age and how to go over mistakes together; the moves themselves are in the course on checking."
      - id: teaching-thinking
        title: { ru: "Как учить думать, когда ответ уже есть", en: "Teaching thinking when the answer is already there" }
        summary:
          ru: "Сначала своя попытка, потом модель, потом разбор различий: приёмы для дома и класса, при которых работу делает сам ребёнок."
          en: "First your own attempt, then the model, then a look at the differences: methods for home and class in which the child does the work."
      - id: ai-detectors
        title: { ru: "Детекторы сгенерированного текста", en: "Detectors of generated text" }
        summary:
          ru: "Почему нельзя обвинять ученика только по показанию детектора, особенно если язык для него неродной."
          en: "Why a student should not be accused on a detector’s word alone, especially one writing in a second language."
      - id: school-rules
        title: { ru: "Какие правила нужны школе", en: "What rules a school needs" }
        summary:
          ru: "Что разрешено на каких заданиях и как сказать об этом ученикам и родителям, чтобы правило было понятно всем."
          en: "What is allowed on which assignments, and how to tell students and parents so that the rule is clear to everyone."
  - id: companions
    title: { ru: "Чат-бот вместо друга", en: "A chatbot in place of a friend" }
    summary:
      ru: "Собеседник, который всегда согласен и всегда рядом, особенно притягателен в том возрасте, когда учатся дружить."
      en: "A companion who always agrees and is always there is especially attractive at the age when people learn how to be friends."
    lessons:
      - id: companion-chatbots
        title: { ru: "Чат-боты-компаньоны и дети", en: "Companion chatbots and children" }
        summary:
          ru: "Что это за сервисы, чем они притягивают подростка, как говорить о них с ребёнком и когда пора идти к специалисту."
          en: "What these services are, what draws a teenager to them, how to talk about them with a child, and when it is time to see a professional."
      - id: age-rules
        title: { ru: "Возрастные правила в России", en: "Age rules: COPPA and GDPR" }
        summary:
          ru: "Закон о защите детей от вредной информации, родители как законные представители и возраст в условиях сервиса: как это читать."
          en: "COPPA’s line at 13, GDPR’s default of 16, which a country may lower to 13, and what a service’s own age rule does and does not mean."
  - id: hard-talks
    title: { ru: "Трудные разговоры", en: "Hard conversations" }
    summary:
      ru: "Лучше поговорить до первого случая, а если он уже произошёл, ребёнку нужен взрослый, который не начнёт с обвинений."
      en: "It is better to talk before the first incident, and if it has happened, a child needs an adult who does not start with blame."
    lessons:
      - id: talking-about-deepfakes
        title: { ru: "Как говорить о дипфейках", en: "Talking about deepfakes" }
        summary:
          ru: "Что подростку стоит знать заранее: подделать можно любого, пересылка делает хуже, а обращаться надо к взрослым, на площадку и в полицию."
          en: "What a teenager should know beforehand: anyone can be faked, forwarding makes it worse, and there are adults, platforms and police to turn to."
      - id: bullying-in-chat
        title: { ru: "Травля в чате", en: "Bullying in a group chat" }
        summary:
          ru: "Как сохранить доказательства, когда идти в школу и в полицию и почему не стоит отбирать телефон у того, кого травят."
          en: "How to save the evidence, when to go to the school and the police, and why not to take the phone away from the child being bullied."
      - id: when-a-professional-is-needed
        title: { ru: "Когда нужен специалист", en: "When a professional is the right answer" }
        summary:
          ru: "Признаки, при которых домашнего разговора мало: психолог, педиатр, детский телефон доверия, а при прямой опасности экстренная помощь."
          en: "The signs that a talk at home is not enough: a psychologist, a pediatrician, a crisis line and, in immediate danger, emergency services."
      - id: model-tutors-and-talking-toys
        title: { ru: "Заглянем вперёд: репетитор-модель и говорящие игрушки", en: "A look ahead: model tutors and talking toys" }
        summary:
          ru: "Какие обещания уже звучат, какие исследования должны их подтвердить и что спросить у школы и производителя игрушки."
          en: "What is already being promised, which studies would have to back it up, and what to ask the school and the toy’s maker."
        ahead: true
