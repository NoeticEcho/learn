# The course that says what the strand means (docs/specs/2026-11-01-platform-design.md §7.4). NoeticEcho's
# stance, in its own first person: an aim is called an aim, and a statement about the world is backed
# or marked as a hypothesis.
id: noetic-singularity
history: true
title: { ru: "Ноэтическая сингулярность: не отстать от машин", en: "The Noetic Singularity: not falling behind" }
tagline:
  ru: "Цель NoeticEcho в том, чтобы люди развивали свой ум и не отстали от сверхинтеллекта: что это значит и что можно сказать против."
  en: "NoeticEcho’s aim is that people develop their minds and do not fall behind superintelligence: what that means and what can be said against it."
about:
  ru: "Технологическая сингулярность говорит о том, что разум машин уйдёт вперёд. Мы ставим на другое: человек и человечество могут и должны расти сами, и эту цель мы называем ноэтической сингулярностью. Это цель и ставка, а не научный факт и не прогноз, и курс разбирает, что здесь подтверждено, что остаётся гипотезой и где мы можем ошибаться."
  en: "The technological singularity says the minds of machines will run ahead. We are betting on something else: people and humanity can and must grow themselves, and we call that aim the Noetic Singularity. It is an aim and a bet, not a scientific fact or a forecast, and this course goes through what is supported, what remains a hypothesis and where we may be wrong."
parts:
  - id: the-aim
    title: { ru: "Что мы утверждаем", en: "What we claim" }
    summary:
      ru: "Цель названа прямо, и сразу видно, что в ней цель, что гипотеза, а что неизвестно."
      en: "The aim is stated plainly, and it is clear at once which part is an aim, which a hypothesis and which unknown."
    lessons:
      - id: two-singularities
        title: { ru: "Две сингулярности", en: "Two singularities" }
        summary:
          ru: "Идея взрыва интеллекта у Гуда в 1965 году и сингулярность Винджа в 1993 году, а рядом наш ответ: развивать не только машины."
          en: "Good’s intelligence explosion of 1965 and Vinge’s singularity of 1993, and beside them our answer: develop more than the machines."
      - id: what-we-mean
        title: { ru: "Что значит «ноэтическая»", en: "What “noetic” means" }
        summary:
          ru: "Слово от греческого «нус», ум, и наше определение: качественный рост понимания у людей и у человечества как у целого."
          en: "The word comes from the Greek nous, mind, and our definition is a qualitative growth of understanding in people and in humanity as a whole."
      - id: aim-and-bet
        title: { ru: "Цель, ставка и то, чего никто не знает", en: "An aim, a bet and what nobody knows" }
        summary:
          ru: "Появится ли ASI и когда, неизвестно; мы ставим на то, что развитие ума окупится при любом исходе, и объясняем почему."
          en: "Whether and when ASI will come is unknown; we are betting that developing the mind pays off either way, and we explain why."
      - id: who-says
        title: { ru: "Кто это говорит", en: "Who is saying this" }
        summary:
          ru: "NoeticEcho: открытые проекты, один человек, который пишет как sudo_make_god, и его ИИ-напарник, и пока это всё сообщество."
          en: "NoeticEcho: open projects, one person who writes as sudo_make_god, and his AI partner, and for now that is the whole community."
  - id: lineage
    title: { ru: "Откуда это взялось", en: "Where it comes from" }
    summary:
      ru: "Мы не первые, кто думает о росте человеческого ума рядом с машиной, и у этих предшественников есть чему поучиться."
      en: "We are not the first to think about human minds growing beside a machine, and those predecessors have much to teach."
    lessons:
      - id: augmenting
        title: { ru: "Усиление интеллекта: Ликлайдер и Энгельбарт", en: "Augmenting intellect: Licklider and Engelbart" }
        summary:
          ru: "«Симбиоз человека и компьютера» 1960 года и «Усиление человеческого интеллекта» 1962 года: компьютер как партнёр, а не замена."
          en: "“Man-Computer Symbiosis” of 1960 and “Augmenting Human Intellect” of 1962: the computer as a partner and not a replacement."
      - id: noosphere
        title: { ru: "Ноосфера: что осталось от красивой идеи", en: "The noosphere: what is left of a beautiful idea" }
        summary:
          ru: "Вернадский и Тейяр де Шарден о мысли как планетном явлении: что из этого проверяемо, а что остаётся метафорой."
          en: "Vernadsky and Teilhard de Chardin on thought as a planetary phenomenon: what in it can be tested and what stays a metaphor."
      - id: extended-mind
        title: { ru: "Расширенный разум", en: "The extended mind" }
        summary:
          ru: "Статья Кларка и Чалмерса 1998 года о том, где кончается мышление, и почему письмо и калькулятор уже нас изменили."
          en: "The 1998 paper by Clark and Chalmers on where thinking ends, and why writing and the calculator have already changed us."
      - id: minds-change
        title: { ru: "Ум меняется вместе с культурой", en: "Minds change with culture" }
        summary:
          ru: "Эффект Флинна, его остановка в ряде стран и данные о влиянии образования: рост возможен, но он не автоматический."
          en: "The Flynn effect, its stall in several countries and the data on schooling: growth is possible, and it is not automatic."
  - id: evidence
    title: { ru: "Что можно развить на самом деле", en: "What can really be developed" }
    summary:
      ru: "Без этой части цель была бы лозунгом: здесь то, что подтверждено исследованиями, и то, что продают без оснований."
      en: "Without this part the aim would be a slogan: here is what research supports, and what is sold without grounds."
    lessons:
      - id: what-trains
        title: { ru: "Что действительно тренируется", en: "What really can be trained" }
        summary:
          ru: "Образование, знания и навыки в конкретной области: почему у них хорошая доказательная база и почему перенос навыков так редок."
          en: "Schooling, knowledge and skill in a specific domain: why the evidence for them is good, and why transfer of skills is so rare."
      - id: brain-training
        title: { ru: "Тренажёры для мозга", en: "Brain training" }
        summary:
          ru: "Большой обзор Саймонса и соавторов 2016 года: вы становитесь лучше в упражнении, а в остальном данные слабые."
          en: "The large 2016 review by Simons et al.: you get better at the exercise, and for everything else the evidence is weak."
      - id: pills-implants
        title: { ru: "Таблетки и нейроинтерфейсы", en: "Pills and neural implants" }
        summary:
          ru: "Что известно о ноотропах и нейроимплантах сегодня, чего не известно и почему решения о своём теле обсуждают с врачом, а не с учебником."
          en: "What is known about nootropics and neural implants today, what is not, and why decisions about your body belong with a doctor and not a textbook."
      - id: not-catching-up
        title: { ru: "Не догнать, а не отстать", en: "Not catching up, but not falling behind" }
        summary:
          ru: "Считать быстрее машины человек не будет, и потому мы определяем цель иначе: понимать, ставить цели, проверять и решать самому."
          en: "No person will out-compute a machine, so we define the aim differently: to understand, set goals, check and decide for yourself."
  - id: against
    title: { ru: "Что можно сказать против", en: "What can be said against it" }
    summary:
      ru: "Идея, которая не выдерживает возражений, не стоит курса, поэтому самые сильные из них разобраны здесь."
      en: "An idea that cannot survive objections is not worth a course, so the strongest of them are taken up here."
    lessons:
      - id: objection-futile
        title: { ru: "«Это бессмысленно»", en: "“It is pointless”" }
        summary:
          ru: "Если сверхинтеллект появится, зачем человеку расти, а если не появится, зачем спешить: честный разбор обоих вопросов."
          en: "If superintelligence comes, why should a person grow, and if it does not, why hurry: an honest look at both questions."
      - id: objection-elitism
        title: { ru: "История «улучшения человека»", en: "The history of “improving humanity”" }
        summary:
          ru: "Евгеника и другие проекты улучшения людей сверху: чем они закончились и какой наша цель не должна стать никогда."
          en: "Eugenics and other projects for improving people from above: how they ended, and what our aim must never become."
      - id: not-a-sect
        title: { ru: "Как отличить школу от секты", en: "How to tell a school from a sect" }
        summary:
          ru: "Обещания, ранги, деньги, цена выхода: признаки, которые стоит проверять у любого движения за развитие, и у нас в первую очередь."
          en: "Promises, ranks, money, the cost of leaving: signs to check in any movement for self-development, and in ours first of all."
  - id: practice
    title: { ru: "Что с этим делать", en: "What to do about it" }
    summary:
      ru: "От цели к плану на обычную неделю, и никаких обещаний о превращениях."
      en: "From an aim to a plan for an ordinary week, with no promises of transformation."
    lessons:
      - id: map-of-skills
        title: { ru: "Карта навыков", en: "A map of the skills" }
        summary:
          ru: "Как курсы этого раздела связаны между собой и с чего начать, если времени немного."
          en: "How the courses in this strand connect, and where to start if you do not have much time."
      - id: honest-measure
        title: { ru: "Как честно измерять свой рост", en: "How to measure your growth honestly" }
        summary:
          ru: "Проверка до и после, задачи вместо ощущений и защита от самообмана, который легко принять за прогресс."
          en: "Testing before and after, tasks in place of impressions, and a defense against the self-deception that is easy to mistake for progress."
      - id: own-program
        title: { ru: "Своя программа на год", en: "A program of your own for a year" }
        summary:
          ru: "Несколько целей, простой журнал и регулярный пересмотр: как собрать план, который выдержит обычную занятую жизнь."
          en: "A few goals, a simple log and a regular review: how to put together a plan that survives an ordinary busy life."
      - id: what-would-prove-us-wrong
        title: { ru: "Заглянем вперёд: что покажет, что мы ошиблись", en: "A look ahead: what would show we were wrong" }
        summary:
          ru: "Какие события ближайших лет подтвердят или опровергнут нашу ставку и что мы тогда будем делать."
          en: "Which events of the next few years would confirm or refute our bet, and what we would do then."
        ahead: true
