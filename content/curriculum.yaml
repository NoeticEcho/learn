  - { id: how-to-learn, title: Как устроен учебник, part: 0 }
  - { id: brief, title: Бриф проекта, part: 0 }
  - { id: local-progress, title: Прогресс в браузере, part: 0 }
  # part 2
  - { id: html-document, title: HTML-документ, part: 2 }
  - { id: html-tag, title: Тег и элемент, part: 2 }
  - { id: html-heading, title: Заголовок, part: 2 }
  - { id: html-paragraph, title: Абзац, part: 2 }
  - { id: html-link, title: Ссылка, part: 2 }
