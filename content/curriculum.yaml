# The single source of the map (spec §3.3). Parts are the outline; each part's content plan adds
# its concepts here. Concepts are listed for parts 0 and 2 only, which the reference lessons need.
# Licence of this file's text: CC BY-SA 4.0.

parts:
  - number: 0
    slug: 00-start
    title: Старт
    summary: Как здесь учиться, и о чём будет ваш сайт.
  - number: 1
    slug: 01-internet
    title: Как устроен интернет
    era: 1
    summary: От ARPANET до веба; пакеты, DNS, HTTP и то, как браузер рисует страницу.
  - number: 2
    slug: 02-html
    title: HTML
    era: 1
    summary: Документ, теги, смысл разметки, ссылки, формы и доступность.
  - number: 3
    slug: 03-css
    title: CSS
    era: 2
    summary: Каскад, блоки, типографика, цвет, flexbox, grid и адаптивность.
  - number: 4
    slug: 04-design
    title: Дизайн и дизайн-системы
    era: 4
    summary: История веб-дизайна, иерархия, цвет, токены и то, как читать дизайн-систему.
  - number: 5
    slug: 05-javascript
    title: JavaScript
    era: 4
    summary: Значения, функции, DOM, события, fetch и компоненты.
  - number: 6
    slug: 06-server
    title: Сервер и языки
    summary: Что такое веб-сервер, почему языки живут там, где живут, и что такое API.
  - number: 7
    slug: 07-data
    title: Данные
    summary: Базы данных, SQL на настоящем Postgres в браузере, поиск и приватность.
  - number: 8
    slug: 08-cms
    title: CMS, генераторы и Jamstack
    era: 3
    summary: WordPress, Tilda и Битрикс, генераторы сайтов, headless CMS.
  - number: 9
    slug: 09-infrastructure
    title: Инфраструктура
    era: 6
    summary: Хостинг, домены, сертификаты, CDN, контейнеры и CI/CD.
  - number: 10
    slug: 10-writing
    title: Тексты для веба
    summary: Как читают с экрана, инфостиль, заголовки и микротексты.
  - number: 11
    slug: 11-copywriting
    title: Копирайтинг и маркетинговые фреймворки
    summary: AIDA, PAS, JTBD, StoryBrand, воронки и лестница ценности.
  - number: 12
    slug: 12-storytelling
    title: Сторителлинг
    summary: Почему истории работают, и десяток способов рассказать свою.
  - number: 13
    slug: 13-growth
    title: Маркетинг и рост
    summary: Автоматизация, почта, соцсети, SEO и GEO, правовые рамки.
  - number: 14
    slug: 14-metrics
    title: Метрики и поведение
    summary: Отказы, конверсии, когорты, A/B-тесты и их ловушки.
  - number: 15
    slug: 15-quality
    title: Качество и право
    summary: Скорость, доступность, безопасность, 152-ФЗ, реклама и чек-лист запуска.
  - number: 16
    slug: 16-ai
    title: ИИ и будущее веба
    era: 7
    summary: ИИ-конструкторы, вайб-кодинг, агентный веб и Искин.

concepts:
