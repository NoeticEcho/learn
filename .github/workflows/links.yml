name: Links

# Every source and video a lesson cites still answers (spec §5). Nightly, and on any change to
# the content, so a dead link is found by a schedule rather than by a reader.
on:
  schedule:
    - cron: '17 3 * * *'
  pull_request:
    paths: ['content/**']
  push:
    branches: [main]
    paths: ['content/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run links:check
